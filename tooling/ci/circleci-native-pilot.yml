# Owner-authorized isolated controller. No main-rule or release authority mutation.
version: 2.1
jobs:
  ordinary-exact-quality:
    docker:
    - image: node:22-bookworm
    working_directory: /root/project
    resource_class: medium
    environment: &id001
      EXPECTED_BASE_SHA: 0af2b0eb68efbd7fcfe0398c21567d224ec33fb6
      EXPECTED_CANDIDATE_SHA: 7ef966af30e31d76bcda3fe5fc290db68201f8f0
      EXPECTED_CANDIDATE_TREE: ceb6e91d0b38dfccff115176dbb2bc2ef976e2bc
      GITHUB_REPOSITORY: luizanunciostoca/touristic-digital-platform
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      GIT_PAGER: cat
    steps:
    - run:
        name: Fetch and verify exact public candidate
        command: 'test "$CIRCLE_BRANCH" = infra/circleci-controller-bootstrap-20261108

          git init -q candidate

          git -C candidate remote add origin https://github.com/luizanunciostoca/touristic-digital-platform.git

          git -C candidate fetch --no-tags --depth=3 origin "$EXPECTED_CANDIDATE_SHA"

          git -C candidate checkout -q -b fix/six-ordinary-staging-20261108 FETCH_HEAD

          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

          test "$(git -C candidate rev-parse ''HEAD^{tree}'')" = "$EXPECTED_CANDIDATE_TREE"

          test "$(git -C candidate rev-parse ''HEAD^'')" = "$EXPECTED_BASE_SHA"

          test -z "$(git -C candidate status --porcelain --untracked-files=all)"

          git -C candidate update-ref refs/heads/main "$EXPECTED_BASE_SHA"

          git -C candidate worktree add -q --detach ../trusted "$EXPECTED_BASE_SHA"'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Install canonical package manager and locked dependencies
        command: 'corepack enable

          corepack prepare pnpm@10.15.0 --activate

          cd candidate

          pnpm install --frozen-lockfile --prefer-offline'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Classify frozen candidate using unchanged base analyzer
        command: 'mkdir -p quality-evidence

          cd candidate

          node ../trusted/tooling/ci/impact-analyzer.mjs "$EXPECTED_BASE_SHA" "$EXPECTED_CANDIDATE_SHA" > ../quality-evidence/impact.json'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Execute unchanged exact-head local admission and certification remotely
        command: 'cd candidate

          node ../trusted/tooling/ci/local-fast-gate.mjs --admission --base "$EXPECTED_BASE_SHA" | tee ../quality-evidence/admission.log

          node ../trusted/tooling/ci/local-fast-gate.mjs --certify --base "$EXPECTED_BASE_SHA" | tee ../quality-evidence/certify.log'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run concurrency supply-chain and log-PII controls
        command: 'cd candidate

          node tooling/quality/check-workflow-concurrency.mjs

          node tooling/quality/check-workflow-supply-chain.mjs --strict

          node tooling/quality/check-log-pii-exposure.mjs

          git --no-pager diff --check "$EXPECTED_BASE_SHA...$EXPECTED_CANDIDATE_SHA"'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Complete reusable workspace build
        command: 'cd candidate

          pnpm -w build | tee ../quality-evidence/workspace-build.log'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-quality-receipt.mjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/ordinary-quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-quality-receipt.mjs block 2
        command: printf '%s' '' | base64 --decode >> /tmp/ordinary-quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Seal exact-head quality receipt
        command: node /tmp/ordinary-quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: quality-evidence
        destination: ordinary-exact-quality
    - persist_to_workspace:
        root: .
        paths:
        - candidate
        - trusted
        - quality-evidence
  ordinary-browser-acceptance:
    docker:
    - image: mcr.microsoft.com/playwright:v1.54.2-noble
    working_directory: /root/project
    resource_class: medium
    environment: *id001
    steps:
    - attach_workspace:
        at: .
    - run:
        name: Prepare pinned package manager and browser API
        command: 'corepack enable

          corepack prepare pnpm@10.15.0 --activate

          npm install --prefix /tmp/pw --no-save playwright@1.54.2'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-browser-runner.cjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/ordinary-browser-runner.cjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-browser-runner.cjs block 2
        command: printf '%s' '' | base64 --decode >> /tmp/ordinary-browser-runner.cjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-browser-runner.cjs block 3
        command: printf '%s' '' | base64 --decode >> /tmp/ordinary-browser-runner.cjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ordinary-browser-runner.cjs block 4
        command: printf '%s' '' | base64 --decode >> /tmp/ordinary-browser-runner.cjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run selected unchanged base browser assertions against candidate workspace
        command: node /tmp/ordinary-browser-runner.cjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: browser-evidence
        destination: ordinary-browser-acceptance
  registry-auth-readonly:
    docker:
    - image: node:22-bookworm
    working_directory: /root/project
    resource_class: medium
    environment: *id001
    steps:
    - checkout:
        method: full
        path: controller
    - run:
        name: Prepare ghcr-readonly-probe.mjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/ghcr-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare ghcr-readonly-probe.mjs block 2
        command: printf '%s' 'aHtyZXN1bHQudG9rZW5DbGFpbXNSZWFkYWJsZT1mYWxzZTt9fQp9CmZzLm1rZGlyU3luYygncmVnaXN0cnktZXZpZGVuY2UnLHtyZWN1cnNpdmU6dHJ1ZX0pO2ZzLndyaXRlRmlsZVN5bmMoJ3JlZ2lzdHJ5LWV2aWRlbmNlL3JlY2VpcHQuanNvbicsSlNPTi5zdHJpbmdpZnkocmVzdWx0LG51bGwsMikrJ1xuJyk7Y29uc29sZS5sb2coSlNPTi5zdHJpbmdpZnkocmVzdWx0KSk7Cg==' | base64 --decode >> /tmp/ghcr-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Discover existing registry authentication capability without package writes
        command: node /tmp/ghcr-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: registry-evidence
        destination: ghcr-readonly-capability
workflows:
  ordinary-six-quality-and-browser:
    jobs:
    - ordinary-exact-quality
    - ordinary-browser-acceptance:
        requires:
        - ordinary-exact-quality
    - registry-auth-readonly
