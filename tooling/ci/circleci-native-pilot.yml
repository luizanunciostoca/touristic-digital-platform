# Owner-authorized isolated bootstrap. Diagnostic status is not main policy admission.
version: 2.1
jobs:
  retirement-contract-pilot:
    docker:
    - image: node:22-bookworm
    resource_class: medium
    environment: &id001
      EXPECTED_BASE_SHA: c7ee8c19fb97fc8bb5093eb75aef1ab41d2d63f3
      EXPECTED_CANDIDATE_SHA: 39bd377eb99c36be5522928ac008fc1233bda5b2
      EXPECTED_CANDIDATE_TREE: bf0aa2ef00d8a68a6db3c3a58d8b6b47523a73f9
      GITHUB_REPOSITORY: luizanunciostoca/touristic-digital-platform
    steps:
    - &id002
      run:
        name: Fetch and verify exact public candidate
        shell: /bin/bash -eo pipefail
        command: "#!/usr/bin/env bash\n# Preparation only. A protected configuration source must be admitted before use.\nset -euo pipefail\ntest \"$(node -p 'process.versions.node.split(\".\")[0]')\" = 22\ntest \"${CIRCLE_BRANCH:?}\" = \"infra/circleci-controller-bootstrap-20261108\"\ngit init candidate\ngit -C candidate remote add origin https://github.com/luizanunciostoca/touristic-digital-platform.git\ngit -C candidate fetch --depth=2 origin \"${EXPECTED_CANDIDATE_SHA:?}\"\ngit -C candidate checkout --detach FETCH_HEAD\ntest \"$(git -C candidate rev-parse HEAD)\" = \"$EXPECTED_CANDIDATE_SHA\"\ntest \"$(git -C candidate rev-parse 'HEAD^{tree}')\" = \"${EXPECTED_CANDIDATE_TREE:?}\"\ntest \"$(git -C candidate rev-parse 'HEAD^')\" = \"${EXPECTED_BASE_SHA:?}\"\ntest -z \"$(git -C candidate status --porcelain --untracked-files=all)\"\ngit -C candidate merge-base --is-ancestor \"$EXPECTED_BASE_SHA\" \"$EXPECTED_CANDIDATE_SHA\"\nmkdir -p evidence\nif [ ! -e trusted ]; then\n  git -C candidate worktree add --detach ../trusted \"$EXPECTED_BASE_SHA\"\nfi\ntest \"$(git -C trusted rev-parse HEAD)\" = \"$EXPECTED_BASE_SHA\"\n"
        no_output_timeout: 5m
    - run:
        name: Run unchanged base contracts and retirement proof
        shell: /bin/bash -eo pipefail
        command: "set -euo pipefail\n\n(\n  cd trusted\n  node --test \\\n    tooling/fabric/claim-guard.test.mjs \\\n    tooling/fabric/claim-retirement-proof.test.mjs \\\n    .github/hooks/morro-pretool-guard.test.mjs\n) | tee evidence/contracts.tap\n\nnode trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate \\\n  | tee evidence/retirement.json\n\n"
        no_output_timeout: 5m
    - run:
        name: Prepare verified recorder block 1
        command: printf '%s' '' | base64 --decode > /tmp/tdp-pilot-recorder.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare verified recorder block 2
        command: printf '%s' '' | base64 --decode >> /tmp/tdp-pilot-recorder.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Assert complete proof and record identities
        shell: /bin/bash -eo pipefail
        command: 'set -euo pipefail

          node /tmp/tdp-pilot-recorder.mjs'
        no_output_timeout: 5m
    - store_artifacts:
        path: evidence
        destination: pilot-only
  selected-quality-pilot:
    docker:
    - image: node:22-bookworm
    resource_class: medium
    environment: *id001
    steps:
    - *id002
    - run:
        name: Install canonical package manager and locked dependencies
        command: 'corepack enable

          corepack prepare pnpm@10.15.0 --activate

          cd candidate

          pnpm install --frozen-lockfile --prefer-offline'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Classify frozen candidate using unchanged base analyzer
        command: 'mkdir -p quality-evidence

          cd candidate

          node ../trusted/tooling/ci/impact-analyzer.mjs "$EXPECTED_BASE_SHA" "$EXPECTED_CANDIDATE_SHA" > ../quality-evidence/impact.json'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run affected formatting concurrency and credential checks
        command: 'cd candidate

          node tooling/quality/check-workflow-concurrency.mjs

          pnpm exec prettier --check --ignore-unknown .github/morro-control/claims.json .github/morro-control/events.ndjson .morro/changesets/MD-POLICY-GOVERNANCE-CONT2-20261106.json

          pnpm secret-patterns:check

          node tooling/quality/check-log-pii-exposure.mjs

          git --no-pager diff --check "$EXPECTED_BASE_SHA...$EXPECTED_CANDIDATE_SHA"'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run canonical CI governance and failure-learning gates
        command: 'cd candidate

          pnpm ci:governance:check | tee ../quality-evidence/ci-governance.log'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run complete applicable governance contracts
        command: 'cd candidate

          node --test tooling/fabric/*.test.mjs .github/agents/*.test.mjs .github/hooks/*.test.mjs | tee ../quality-evidence/governance-contracts.tap'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare quality-receipt.mjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare quality-receipt.mjs block 2
        command: printf '%s' '' | base64 --decode >> /tmp/quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run quality-receipt.mjs
        command: node /tmp/quality-receipt.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: quality-evidence
        destination: selected-quality-pilot
    - persist_to_workspace:
        root: .
        paths:
        - quality-evidence
  provider-auth-readonly:
    docker:
    - image: node:22-bookworm
    resource_class: small
    environment: *id001
    steps:
    - checkout:
        method: full
        path: controller
    - run:
        name: Prepare auth-readonly-probe.mjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/auth-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Prepare auth-readonly-probe.mjs block 2
        command: printf '%s' 'c2hhPT09cHJvY2Vzcy5lbnYuRVhQRUNURURfQkFTRV9TSEE7fQp9CmZzLm1rZGlyU3luYygiYXV0aC1ldmlkZW5jZSIse3JlY3Vyc2l2ZTp0cnVlfSk7CmZzLndyaXRlRmlsZVN5bmMoImF1dGgtZXZpZGVuY2UvcmVjZWlwdC5qc29uIixKU09OLnN0cmluZ2lmeShyZXN1bHQsbnVsbCwyKSsiXG4iKTsKY29uc29sZS5sb2coSlNPTi5zdHJpbmdpZnkocmVzdWx0KSk7Cgo=' | base64 --decode >> /tmp/auth-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run auth-readonly-probe.mjs
        command: node /tmp/auth-readonly-probe.mjs
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: auth-evidence
        destination: read-only-auth-probe
  candidate-pilot-reporter:
    docker:
    - image: node:22-bookworm
    resource_class: small
    environment: *id001
    steps:
    - checkout:
        method: full
        path: controller
    - attach_workspace:
        at: .
    - run:
        name: Prepare quality reporter block 1
        command: printf '%s' '' | base64 --decode > /tmp/quality-reporter.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare quality reporter block 2
        command: printf '%s' '' | base64 --decode >> /tmp/quality-reporter.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare quality reporter block 3
        command: printf '%s' '' | base64 --decode >> /tmp/quality-reporter.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Publish bounded candidate pilot status with source and provider readback
        command: node /tmp/quality-reporter.mjs
        shell: /bin/bash -eo pipefail
    - store_artifacts:
        path: reporter-evidence
        destination: candidate-pilot-status
workflows:
  selected-quality-and-candidate-status:
    jobs:
    - selected-quality-pilot
    - candidate-pilot-reporter:
        requires:
        - selected-quality-pilot
