# Prospective metadata acquisition only: no GHCR context, image push, deploy or canonical authority.
version: 2.1
jobs:
  external-claim-base-proof:
    docker:
    - image: node:22-bookworm
    working_directory: /root/project
    resource_class: medium
    environment:
      EXPECTED_BASE_SHA: 02c2af6d91456e64efa31646d0439b5e39ae8ea1
      EXPECTED_CANDIDATE_SHA: 378aa60dd9c0c9d156e0effc622a5d996ca50633
      EXPECTED_CANDIDATE_TREE: ca884f5a09a1e10e0f9a389688c74246f761109b
      GITHUB_REPOSITORY: luizanunciostoca/touristic-digital-platform
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      GIT_PAGER: cat
    steps:
    - run:
        name: Fetch and verify exact public candidate
        command: 'test "$CIRCLE_BRANCH" = infra/circleci-controller-bootstrap-20261108

          git init -q candidate

          git -C candidate remote add origin https://github.com/luizanunciostoca/touristic-digital-platform.git

          git -C candidate fetch --no-tags --depth=3 origin "$EXPECTED_CANDIDATE_SHA"

          git -C candidate checkout -q -b infra/external-staging-admission-20261108 FETCH_HEAD

          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

          test "$(git -C candidate rev-parse ''HEAD^{tree}'')" = "$EXPECTED_CANDIDATE_TREE"

          test "$(git -C candidate rev-parse ''HEAD^'')" = "$EXPECTED_BASE_SHA"

          test -z "$(git -C candidate status --porcelain --untracked-files=all)"

          git -C candidate update-ref refs/heads/main "$EXPECTED_BASE_SHA"

          git -C candidate worktree add -q --detach ../trusted "$EXPECTED_BASE_SHA"

          git -C candidate update-ref refs/remotes/origin/main "$EXPECTED_BASE_SHA"'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Install canonical package manager and locked dependencies
        command: 'corepack enable

          corepack prepare pnpm@10.15.0 --activate

          cd candidate

          pnpm install --frozen-lockfile --prefer-offline'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Classify frozen candidate using unchanged base analyzer
        command: 'mkdir -p quality-evidence

          cd candidate

          node ../trusted/tooling/ci/impact-analyzer.mjs "$EXPECTED_BASE_SHA" "$EXPECTED_CANDIDATE_SHA" > ../quality-evidence/impact.json'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Execute unchanged exact-head local admission and certification remotely
        command: 'cd candidate

          node ../trusted/tooling/ci/local-fast-gate.mjs --admission --base "$EXPECTED_BASE_SHA" | tee ../quality-evidence/admission.log

          node ../trusted/tooling/ci/local-fast-gate.mjs --certify --base "$EXPECTED_BASE_SHA" | tee ../quality-evidence/certify.log'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - run:
        name: Run concurrency supply-chain and log-PII controls
        command: 'cd candidate

          node tooling/quality/check-workflow-concurrency.mjs

          node tooling/quality/check-workflow-supply-chain.mjs --strict

          node tooling/quality/check-log-pii-exposure.mjs

          git --no-pager diff --check "$EXPECTED_BASE_SHA...$EXPECTED_CANDIDATE_SHA"'
        shell: /bin/bash -eo pipefail
        no_output_timeout: 10m
    - store_artifacts:
        path: quality-evidence
        destination: ordinary-exact-quality
    - persist_to_workspace:
        root: .
        paths:
        - candidate
        - trusted
        - quality-evidence
    - run:
        name: Execute unchanged base acquisition contracts independently
        shell: /bin/bash -eo pipefail
        command: 'cd trusted

          node --test tooling/fabric/claim-guard.test.mjs tooling/fabric/ownership-path.test.mjs tooling/control-state/mdctl-claim-lifecycle.test.mjs | tee ../quality-evidence/base-contracts.tap'
    - run:
        name: Prepare fresh-claim-provider-receipt.mjs block 1
        shell: /bin/bash -eo pipefail
        command: printf '%s' '' | base64 --decode > /tmp/fresh-claim-provider-receipt.mjs
    - run:
        name: Prepare fresh-claim-provider-receipt.mjs block 2
        shell: /bin/bash -eo pipefail
        command: printf '%s' '' | base64 --decode >> /tmp/fresh-claim-provider-receipt.mjs
    - run:
        name: Prepare fresh-claim-provider-receipt.mjs block 3
        shell: /bin/bash -eo pipefail
        command: printf '%s' 'YlVybDplbnYuQ0lSQ0xFX0JVSUxEX1VSTCxwcm9vZixjZXJ0aWZpY2F0ZSx0ZXN0czp7dG90YWw6MjQ4LHBhc3NlZDoyNDgsc2tpcHBlZDowfSxmaWxlcyxjYW5vbmljYWxFbnZlbG9wZUFkbWl0dGVkOmZhbHNlLG9ic2VydmVkQXQ6bmV3IERhdGUoKS50b0lTT1N0cmluZygpfSxudWxsLDIpKydcbicpOwo=' | base64 --decode >> /tmp/fresh-claim-provider-receipt.mjs
    - run:
        name: Seal prospective exact-head acquisition evidence
        shell: /bin/bash -eo pipefail
        command: node /tmp/fresh-claim-provider-receipt.mjs
    - store_artifacts:
        path: quality-evidence
        destination: external-claim-base-proof
    - persist_to_workspace:
        root: .
        paths:
        - quality-evidence
  external-claim-proposal-relay:
    docker:
    - image: node:22-bookworm
    working_directory: /root/project
    resource_class: small
    steps:
    - checkout:
        method: full
        path: controller
    - attach_workspace:
        at: .
    - run:
        name: Prepare fresh-claim-provider-relay.mjs block 1
        shell: /bin/bash -eo pipefail
        command: printf '%s' '' | base64 --decode > /tmp/fresh-claim-provider-relay.mjs
    - run:
        name: Prepare fresh-claim-provider-relay.mjs block 2
        shell: /bin/bash -eo pipefail
        command: printf '%s' '' | base64 --decode >> /tmp/fresh-claim-provider-relay.mjs
    - run:
        name: Prepare fresh-claim-provider-relay.mjs block 3
        shell: /bin/bash -eo pipefail
        command: printf '%s' '' | base64 --decode >> /tmp/fresh-claim-provider-relay.mjs
    - run:
        name: Relay independently completed base proof to exact proposal
        shell: /bin/bash -eo pipefail
        command: node /tmp/fresh-claim-provider-relay.mjs
    - store_artifacts:
        path: relay-evidence
        destination: external-claim-proposal-relay
workflows:
  external-claim-bootstrap-proposal:
    jobs:
    - external-claim-base-proof
    - external-claim-proposal-relay:
        requires:
        - external-claim-base-proof
