# Owner-authorized bounded relay. No registry credential, candidate execution or release authority.
version: 2.1
jobs:
  first-batch-status-relay:
    docker:
    - image: node:22-bookworm
    working_directory: /root/project
    resource_class: small
    steps:
    - checkout:
        method: full
        path: controller
    - run:
        name: Prepare first-quality-receipt.json block 1
        command: printf '%s' '' | base64 --decode > /tmp/first-quality-receipt.json
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-browser-receipt.json block 1
        command: printf '%s' '' | base64 --decode > /tmp/first-browser-receipt.json
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-browser-receipt.json block 2
        command: printf '%s' '' | base64 --decode >> /tmp/first-browser-receipt.json
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-browser-receipt.json block 3
        command: printf '%s' '' | base64 --decode >> /tmp/first-browser-receipt.json
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-browser-receipt.json block 4
        command: printf '%s' '' | base64 --decode >> /tmp/first-browser-receipt.json
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-result-relay.mjs block 1
        command: printf '%s' '' | base64 --decode > /tmp/first-result-relay.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-result-relay.mjs block 2
        command: printf '%s' '' | base64 --decode >> /tmp/first-result-relay.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Prepare first-result-relay.mjs block 3
        command: printf '%s' '' | base64 --decode >> /tmp/first-result-relay.mjs
        shell: /bin/bash -eo pipefail
    - run:
        name: Bind authenticated provider results to exact PR candidate
        command: node /tmp/first-result-relay.mjs
        shell: /bin/bash -eo pipefail
    - store_artifacts:
        path: relay-evidence
        destination: first-batch-status-relay
workflows:
  first-batch-result-relay:
    jobs:
    - first-batch-status-relay
