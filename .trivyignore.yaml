misconfigurations:
  - id: AVD-DS-0002
    paths:
      - tooling/render/mysql-staging/Dockerfile
    expired_at: 2026-12-14
    statement: >-
      The official MySQL image entrypoint starts as root only to initialize and
      repair ownership on the persistent data directory, then drops privileges
      to the mysql user via gosu. Forcing USER mysql in this derived Dockerfile
      would bypass that supported bootstrap path. Re-evaluate this exception on
      any base-image or entrypoint change and no later than the expiry date.
