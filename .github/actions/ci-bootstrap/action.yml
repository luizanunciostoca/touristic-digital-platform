name: Shared CI bootstrap
description: Pinned Node and pnpm setup with dependency and deterministic build caches.
inputs:
  browser:
    description: Restore the pinned Chromium binary cache; each suite still installs required OS packages.
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.15.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
    - name: Set deterministic cache location
      shell: bash
      run: |
        echo "TURBO_CACHE_DIR=$RUNNER_TEMP/morro-turbo" >> "$GITHUB_ENV"
        echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
    - name: Restore build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/morro-turbo
        key: turbo-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-
    - name: Restore deterministic Chromium
      if: inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-1.54.2
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
