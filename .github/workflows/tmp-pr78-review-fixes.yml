name: Temporary PR78 Review Fixes

on:
  push:
    branches:
      - fix/runtime-accessibility-i18n-parity

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-accessibility-i18n-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fixes
        run: python tooling/tmp-pr78-review-fixes.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
      - name: App tests
        run: pnpm --filter @touristic/morro-digital-platform test
      - name: App typecheck
        run: pnpm --filter @touristic/morro-digital-platform typecheck
      - name: App lint
        run: pnpm --filter @touristic/morro-digital-platform lint
      - name: App build
        run: pnpm --filter @touristic/morro-digital-platform build
      - name: Prettier check
        run: |
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
      - name: Diff check
        run: git diff --check
      - name: Commit reviewed functional tree
        run: |
          rm tooling/tmp-pr78-review-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml \
            tooling/tmp-pr78-review-fixes.py
          git diff --cached --check
          git commit -m "fix(i18n): address PR 78 review findings"
          git push origin HEAD:fix/runtime-accessibility-i18n-parity
