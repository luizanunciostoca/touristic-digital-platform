name: Provider Installment Probe 2026-08-24
on:
  push:
    branches: [ops/provider-e2e-e0d35bb-20260824]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - env:
          STAGING_URL: https://morro-digital-v2-staging.onrender.com
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const digits = ['5480','8328','0103','3311'].join('');
          const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
          async function field(page, name) {
            for (let i=0;i<120;i++) {
              for (const frame of page.frames()) {
                const x=frame.locator(`input[name="${name}"]`).first();
                try { if (await x.count() && await x.isVisible()) return x; } catch {}
              }
              await page.waitForTimeout(250);
            }
            throw new Error(`missing:${name}`);
          }
          async function type(x,v){ await x.click(); await x.pressSequentially(v,{delay:35}); }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              const url=`${process.env.STAGING_URL}/apps/morro-digital-platform/public/business-onboarding.html`;
              const r=await page.goto(url,{waitUntil:'load',timeout:60000});
              if(!r||r.status()!==200) throw new Error(`http:${r?.status()}`);
              await page.waitForFunction(()=>Boolean(globalThis.__MORRO_RUNTIME_ENV__),null,{timeout:20000});
              await page.evaluate(async()=>{
                const m=await import('/apps/morro-digital-platform/dist/mercado-pago-card-payment-brick.js');
                const b=m.createMercadoPagoCardPaymentBrick(window,document,window.fetch.bind(window));
                globalThis.__probe=b;
                void b.present({checkoutId:'ord_probeinstall01',statusToken:`cst_v1_${'a'.repeat(32)}`,plan:{amount:{minorUnits:1000,currency:'BRL'}},payerEmail:'payments.acceptance.20260824@gmail.com'}).catch(()=>{});
              });
              await page.locator('[data-morro-payments-brick="card"]').waitFor({state:'visible',timeout:30000});
              await type(await field(page,'cardNumber'),digits); await page.waitForTimeout(1200);
              await type(await field(page,'expirationDate'),'1130'); await type(await field(page,'securityCode'),'123');
              await page.locator('[data-morro-payments-brick="card"] input[name="HOLDER_NAME"]').fill('APRO');
              await page.locator('[data-morro-payments-brick="card"] input[name="DOCUMENT"]').fill(['123','456','789','09'].join(''));
              const sel=page.locator('[data-morro-payments-brick="card"] select').first();
              if(await sel.count()){const o=await sel.locator('option').evaluateAll(ns=>ns.map(n=>({v:n.value,t:(n.textContent||'').trim()})));const cpf=o.find(x=>/CPF/i.test(x.t)&&x.v);if(cpf)await sel.selectOption(cpf.v);}
              await page.waitForTimeout(1500);
              const data=await page.locator('[data-morro-payments-brick="card"]').evaluate(root=>{
                const n=s=>String(s||'').replace(/\s+/g,' ').trim();
                const all=[...root.querySelectorAll('*')];
                const snap=el=>({tag:el.tagName.toLowerCase(),id:el.id||'',cls:typeof el.className==='string'?el.className.slice(0,160):'',role:el.getAttribute('role')||'',tabindex:el.getAttribute('tabindex')||'',testid:el.getAttribute('data-testid')||'',text:n(el.textContent).slice(0,180)});
                const matches=all.filter(el=>/Selecione o número de parcelas|1x\s*R\$\s*10,00|Escolha uma opção para avançar/i.test(n(el.textContent))).sort((a,b)=>n(a.textContent).length-n(b.textContent).length).slice(0,30).map(el=>({self:snap(el),parent:el.parentElement?snap(el.parentElement):null,grand:el.parentElement?.parentElement?snap(el.parentElement.parentElement):null}));
                return {matches};
              });
              console.log('INSTALLMENT_PROBE='+JSON.stringify(data));
            } finally {await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
