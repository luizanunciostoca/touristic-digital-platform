name: Chat3 One Shot Prettier

on:
  push:
    branches:
      - fix/assistant-v1-residual-current-main-20260917

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/assistant-v1-residual-current-main-20260917
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.ts
          git rm .github/workflows/zz-one-shot-chat3-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.test.ts" "apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.ts"
          git commit -m "chore(assistant-v1-residual): apply exact prettier formatting"
          git push origin HEAD:fix/assistant-v1-residual-current-main-20260917
