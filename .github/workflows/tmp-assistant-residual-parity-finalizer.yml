name: Temporary Assistant V1 Residual Parity Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-assistant-residual-parity-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-residual-command-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply residual parity source patch
        run: |
          python tooling/tmp-assistant-residual-parity-finalizer.py
          python tooling/tmp-assistant-residual-test-lint-fix.py
      - name: Format residual parity source
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
      - name: Validate residual parity
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
          git diff --check
      - name: Commit validated residual parity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-residual-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(assistant): restore V1 residual history and map commands"
          git push origin HEAD:fix/assistant-v1-residual-command-parity
