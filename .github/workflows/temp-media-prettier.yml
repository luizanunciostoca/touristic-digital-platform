name: Temporary Media Prettier

on:
  push:
    branches:
      - wave/media-operational-cms-20260925
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-media-prettier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wave/media-operational-cms-20260925
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Media wave files
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-business-cms.js \
            apps/morro-digital-platform/src/ux/control-center-business-cms-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/control-center-business-cms-browser-contract.mjs \
            apps/morro-digital-platform/tooling/media-storage-runtime.mjs \
            apps/morro-digital-platform/tooling/media-storage-runtime.vitest.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center-business-cms.js \
            apps/morro-digital-platform/src/ux/control-center-business-cms-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/control-center-business-cms-browser-contract.mjs \
            apps/morro-digital-platform/tooling/media-storage-runtime.mjs \
            apps/morro-digital-platform/tooling/media-storage-runtime.vitest.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs
          git commit -m "style(media): apply canonical Prettier formatting"
          git push origin HEAD:wave/media-operational-cms-20260925
