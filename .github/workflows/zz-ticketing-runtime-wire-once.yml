name: Ticketing Current-Main Runtime Wire Once

on:
  push:
    branches:
      - fix/ticketing-feature-0011-current-main
    paths:
      - ".github/workflows/zz-ticketing-runtime-wire-once.yml"
      - ".github/scripts/zz_ticketing_runtime_wire_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-ticketing-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticketing-feature-0011-current-main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded runtime composition
        run: python3 .github/scripts/zz_ticketing_runtime_wire_once.py
      - name: Format touched runtime files
        run: pnpm exec prettier --write apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs
      - name: Commit runtime wiring if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs
          git commit -m "feat(ticketing): compose current-main Payments and runtime"
          git push origin HEAD:fix/ticketing-feature-0011-current-main
