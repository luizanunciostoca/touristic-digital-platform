name: Interface Fabric One-Shot Isolated QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-fabric-one-shot-qa.yml"
      - ".morro/changesets/MD-INTERFACE-FABRIC-ISOLATED-COMPOSITION.json"
      - "labs/interface-fabric/**"

permissions:
  contents: write

concurrency:
  group: interface-fabric-one-shot-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-qa:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/interface-fabric-isolated-completion-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Static isolation checker
        run: node labs/interface-fabric/tooling/check.mjs
      - name: Unit tests
        run: node --test labs/interface-fabric/tests/unit/*.test.mjs
      - name: Install deterministic browser QA toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pw --no-save --package-lock=false \
            playwright@1.54.2 axe-core@4.10.3
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          ln -sfn /tmp/pw/node_modules/playwright node_modules/playwright
      - name: Start isolated static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/interface-fabric-http.log 2>&1 &
          echo $! >/tmp/interface-fabric-http.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/labs/interface-fabric/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/interface-fabric-http.log
          exit 1
      - name: Functional browser QA
        env:
          IF_BASE_URL: http://127.0.0.1:4173/labs/interface-fabric
          IF_PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright
        run: node labs/interface-fabric/tests/browser/functional_qa.mjs
      - name: Accessibility QA
        env:
          IF_BASE_URL: http://127.0.0.1:4173/labs/interface-fabric
          IF_PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright
          IF_AXE_PATH: /tmp/pw/node_modules/axe-core/axe.min.js
        run: node labs/interface-fabric/tests/browser/a11y_qa.mjs
      - name: Visual QA
        env:
          IF_BASE_URL: http://127.0.0.1:4173/labs/interface-fabric
        run: node labs/interface-fabric/tests/browser/visual_qa.mjs
      - name: Record evidence summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/interface-fabric-evidence
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = "labs/interface-fabric/visual/evidence";
          const shots = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((name) => name.endsWith(".png")).sort()
            : [];
          fs.writeFileSync(
            "/tmp/interface-fabric-evidence/summary.json",
            JSON.stringify({
              contract: "MORRO-INTERFACE-FABRIC-ISOLATED-QA",
              status: "pass",
              headSha: process.env.GITHUB_SHA,
              interfaceCount: 112,
              unit: "pass",
              functionalBrowser: "pass",
              accessibility: "pass",
              visual: "pass",
              screenshots: shots,
            }, null, 2) + "\n",
          );
          NODE
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: interface-fabric-isolated-qa-${{ github.run_id }}
          path: |
            /tmp/interface-fabric-evidence
            labs/interface-fabric/visual/evidence
            /tmp/interface-fabric-http.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Stop isolated server
        if: always()
        run: kill "$(cat /tmp/interface-fabric-http.pid)" 2>/dev/null || true
      - name: Remove one-shot QA workflow after PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/interface-fabric-one-shot-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/interface-fabric-one-shot-qa.yml
          git commit -m "ci(interface-fabric): retire one-shot isolated QA"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
