name: Temporary PR74 Suppressed Source Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-pr74-suppressed-source-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-place-action-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply suppressed source remediations
        run: |
          python <<'PY'
          from pathlib import Path

          adapter = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts')
          adapter_test = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts')
          runtime = Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          a, t, r = adapter.read_text(), adapter_test.read_text(), runtime.read_text()

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          helper = '''function transportNavigationConfirmation(\n  placeName: string,\n  language: AssistantV1PlaceActionLanguage,\n) {\n  const copy = {\n    pt: { text: `Deseja iniciar a navegação até ${placeName}?`, yes: "Sim", no: "Não" },\n    en: { text: `Would you like to start navigation to ${placeName}?`, yes: "Yes", no: "No" },\n    es: { text: `¿Deseas iniciar la navegación hasta ${placeName}?`, yes: "Sí", no: "No" },\n    he: { text: `האם תרצה להתחיל ניווט אל ${placeName}?`, yes: "כן", no: "לא" },\n  } as const;\n  return copy[language];\n}\n\n'''
          a = one(a, 'function moreOptions(\n', helper + 'function moreOptions(\n', 'confirmation helper')
          a = one(a, '  if (["mais opcoes", "more options"].includes(normalized)) {', '''  if (\n    [\n      "mais opcoes",\n      "outras opcoes",\n      "more options",\n      "mas opciones",\n      "אפשרויות נוספות",\n    ].includes(normalized)\n  ) {''', 'more aliases')
          a = one(a, '["localizacao", "location", "ubicacion"].includes(normalized)', '["localizacao", "location", "ubicacion", "מיקום"].includes(normalized)', 'location aliases')
          a = one(a, '''    const destination = Object.freeze({\n      name: place.name,\n      latitude: place.latitude,\n      longitude: place.longitude,\n      category: place.category,\n    });\n    return {''', '''    const destination = Object.freeze({\n      name: place.name,\n      latitude: place.latitude,\n      longitude: place.longitude,\n      category: place.category,\n    });\n    const confirmation = transportNavigationConfirmation(place.name, language);\n    return {''', 'confirmation binding')
          a = one(a, '''        text: `Deseja iniciar a navegação até ${place.name}?`,\n        options: [\n          { label: "Sim", value: "sim" },\n          { label: "Não", value: "não" },\n        ],''', '''        text: confirmation.text,\n        options: [\n          { label: confirmation.yes, value: "sim" },\n          { label: confirmation.no, value: "não" },\n        ],''', 'localized confirmation')

          t = one(t, '  it("keeps unavailable transport secondary information explicit", () => {', '''  it.each([\n    ["mais opções", "pt"],\n    ["outras opções", "pt"],\n    ["more options", "en"],\n    ["más opciones", "es"],\n    ["אפשרויות נוספות", "he"],\n  ] as const)("routes the %s secondary-menu alias deterministically", (input, language) => {\n    expect(resolve(input, "Morena Bela", "restaurants", language)?.response.metadata).toMatchObject({\n      action: "restaurant_more_options",\n      deterministic: true,\n    });\n  });\n\n  it.each([\n    ["location", "en", "Would you like to start navigation to Píer de Morro de São Paulo?", "Yes", "No"],\n    ["ubicación", "es", "¿Deseas iniciar la navegación hasta Píer de Morro de São Paulo?", "Sí", "No"],\n    ["מיקום", "he", "האם תרצה להתחיל ניווט אל Píer de Morro de São Paulo?", "כן", "לא"],\n  ] as const)("localizes transport confirmation for %s", (input, language, text, yes, no) => {\n    const result = resolve(input, "Píer de Morro de São Paulo", "transport", language);\n    expect(result?.response.text).toBe(text);\n    expect(result?.response.options).toEqual([\n      { label: yes, value: "sim" },\n      { label: no, value: "não" },\n    ]);\n    expect(result?.response.metadata).toMatchObject({\n      action: "transport_location",\n      navigation: "awaiting_confirmation",\n      deterministic: true,\n    });\n  });\n\n  it("keeps unavailable transport secondary information explicit", () => {''', 'multilingual tests')

          context_pair = '        lastCategory: state.category,\n        lastIntent: "categoria",\n        awaiting:'
          context_fixed = '        lastCategory: state.category,\n        lastPlace: null,\n        lastIntent: "categoria",\n        awaiting:'
          count = r.count(context_pair)
          if count != 2:
              raise SystemExit(f'stale context: expected two matches, found {count}')
          r = r.replace(context_pair, context_fixed, 2)
          r = one(r, '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          awaiting: { type: "confirmar_navegacao", intent: "navigate" },''', '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          fallbackCount: 0,\n          awaiting: { type: "confirmar_navegacao", intent: "navigate" },''', 'nav fallback reset')
          r = one(r, '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          awaiting: null,''', '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          fallbackCount: 0,\n          awaiting: null,''', 'place fallback reset')

          adapter.write_text(a)
          adapter_test.write_text(t)
          runtime.write_text(r)
          PY
      - name: Format affected source
        run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - name: Validate suppressed source remediations
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git diff --check
      - name: Commit validated source remediations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'fix(assistant): close suppressed place-action source findings'
          git push origin HEAD:fix/assistant-v1-place-action-parity
