name: Chat7 PWA Prettier Diagnostic

on:
  pull_request:
    branches:
      - wave/chat7-pwa-offline-foundation

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print exact outputs
        run: |
          pnpm exec prettier apps/morro-digital-platform/public/offline.html apps/morro-digital-platform/src/pwa/pwa-contract.test.ts --write
          echo '===OFFLINE_HTML_BEGIN==='
          cat apps/morro-digital-platform/public/offline.html
          echo '===OFFLINE_HTML_END==='
          echo '===PWA_TEST_BEGIN==='
          cat apps/morro-digital-platform/src/pwa/pwa-contract.test.ts
          echo '===PWA_TEST_END==='
