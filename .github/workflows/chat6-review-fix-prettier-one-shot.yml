name: Chat 6 Review Fix Prettier One Shot

on:
  push:
    branches:
      - wave/css-modernization-ux-premium-20260920
    paths:
      - .github/workflows/chat6-review-fix-prettier-one-shot.yml
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/src/ux/premium-ux-mode.ts
      - apps/morro-digital-platform/src/ux/premium-ux-mode.test.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/css-modernization-ux-premium-20260920
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format review fixes and remove helper
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/public/premium-ux-v2.css apps/morro-digital-platform/src/ux/premium-ux-mode.ts apps/morro-digital-platform/src/ux/premium-ux-mode.test.ts
          git rm .github/workflows/chat6-review-fix-prettier-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/public/premium-ux-v2.css apps/morro-digital-platform/src/ux/premium-ux-mode.ts apps/morro-digital-platform/src/ux/premium-ux-mode.test.ts
          git diff --cached --check
          git commit -m "style(ux): format Chat 6 review fixes"
          git push origin HEAD:wave/css-modernization-ux-premium-20260920
