name: Merge Queue Full Regression

on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: merge-queue-full-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  regression:
    name: merge-queue-full-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:acceptance-manifest:check
      - name: Prove candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"
          echo "candidate_tree=$(git rev-parse "$GITHUB_SHA^{tree}")"

      - name: Dispatch full regression matrix on merge candidate
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/merge-queue-runs.tsv
          ref_name="${GITHUB_REF#refs/heads/}"
          if [ "$ref_name" = "$GITHUB_REF" ]; then
            ref_name="$GITHUB_REF"
          fi

          while IFS= read -r workflow; do
            echo "Dispatching $workflow on merge candidate $ref_name@$GITHUB_SHA"
            gh workflow run "$workflow" --ref "$ref_name"

            run_id=""
            for _ in $(seq 1 45); do
              run_id="$(
                gh run list \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --limit 20 \
                  --json databaseId,headSha,createdAt \
                | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
              )"
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Unable to resolve dispatched run for $workflow" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$workflow" "$run_id" >> /tmp/merge-queue-runs.tsv
          done < <(jq -r '.suites[].workflow' tooling/ci/release-acceptance-manifest.json)

      - name: Wait collectively for full regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            pending=0
            failed=0
            while IFS=$'\t' read -r workflow run_id; do
              state="$(gh run view "$run_id" --json status,conclusion,headSha)"
              status="$(jq -r '.status' <<<"$state")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$state")"
              observed_sha="$(jq -r '.headSha' <<<"$state")"

              if [ "$observed_sha" != "$GITHUB_SHA" ]; then
                echo "SHA DRIFT: $workflow expected $GITHUB_SHA got $observed_sha" >&2
                failed=1
                continue
              fi
              if [ "$status" != "completed" ]; then
                pending=$((pending + 1))
              elif [ "$conclusion" != "success" ]; then
                echo "FAILED: $workflow run $run_id conclusion=$conclusion" >&2
                failed=1
              fi
            done < /tmp/merge-queue-runs.tsv

            [ "$failed" -eq 0 ] || exit 1
            [ "$pending" -ne 0 ] || break
            echo "Waiting for $pending merge-queue regression suites..."
            sleep 10
          done

      - name: Re-prove merge candidate did not move
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
