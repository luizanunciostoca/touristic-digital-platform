name: Assistant M14 format

on:
  push:
    branches: [feat/assistant-runtime-m14]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-m14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-destination-resolver.test.ts apps/morro-digital-platform/src/assistant/assistant-destination-resolver.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.test.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/assistant/assistant-destination-resolver.test.ts apps/morro-digital-platform/src/assistant/assistant-destination-resolver.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.test.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts
          git commit -m "style(assistant): format M14 files"
          git pull --rebase origin feat/assistant-runtime-m14
          git push origin HEAD:feat/assistant-runtime-m14
