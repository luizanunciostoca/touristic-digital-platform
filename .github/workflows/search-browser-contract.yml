name: Search Browser Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/search-browser-contract.yml
      - apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - packages/search/src/**

permissions:
  contents: read

jobs:
  search-browser-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated browser runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/search-browser-contract.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/search-browser-contract.log
          exit 1
      - name: Validate query to details to navigation
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3765, longitude: -38.9165 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"][data-map-provider="mapbox"]').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('.quick-actions .action-button.primary').click();
              await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });

              await page.locator('#assistantInput').fill('Toca do Morcego');
              await page.locator('#sendButton').click();
              await page.locator('.assistant-options .assistant-option-btn').first().waitFor({ state: 'visible', timeout: 10000 });

              const searchText = await page.locator('#assistant-messages .message.assistant').last().textContent();
              if (!searchText?.includes('Encontrei estes resultados para "Toca do Morcego"')) {
                throw new Error(`Search response diverged: ${searchText}`);
              }
              if (!searchText.includes('Toca do Morcego')) {
                throw new Error(`Search result missing canonical POI: ${searchText}`);
              }

              await page.locator('.assistant-options .assistant-option-btn').first().click();
              await page.waitForFunction(() => {
                const buttons = Array.from(document.querySelectorAll('.assistant-options .assistant-option-btn'));
                return buttons.some(button => button.textContent?.includes('Como chegar'));
              }, { timeout: 15000 });

              const detailText = await page.locator('#assistant-messages .message.assistant').last().textContent();
              if (!detailText?.includes('Toca do Morcego')) {
                throw new Error(`Details integration lost selected place: ${detailText}`);
              }

              const navigate = page.locator('.assistant-options .assistant-option-btn', { hasText: 'Como chegar' });
              await navigate.click();
              await page.locator('body.navigation-active').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('#end-navigation-btn').waitFor({ state: 'visible', timeout: 5000 });

              if (pageErrors.length) throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              const evidence = {
                query: 'Toca do Morcego',
                searchText,
                detailText,
                navigationActive: await page.locator('body').evaluate(el => el.classList.contains('navigation-active')),
                mapProvider: await page.locator('#map').getAttribute('data-map-provider'),
                pageErrors,
              };
              writeFileSync('/tmp/search-browser-evidence.json', JSON.stringify(evidence, null, 2));
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/search-browser-contract.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-browser-evidence
          path: /tmp/search-browser-evidence.json
          retention-days: 1
          if-no-files-found: ignore
