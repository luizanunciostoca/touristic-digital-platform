name: M65 live runtime helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/business-m65-live-runtime-reconciliation
    paths:
      - ".github/workflows/m65-live-runtime-helper.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m65-live-runtime-reconciliation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply semantic live-runtime reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/morro-digital-platform/src/business-onboarding-runtime.ts')
          s = p.read_text()
          anchor = '''function categoryLabel(value: unknown): string {
  const category = text(value);
  return (
    BUSINESS_ONBOARDING_CATEGORIES.find((option) => option.value === category)
      ?.label ?? "Negócio local"
  );
}
'''
          addition = anchor + '''
function liveLocation(value: unknown): Readonly<{
  name: string;
  category: string;
  source: string;
  latitude: number;
  longitude: number;
}> | null {
  if (!isRecord(value)) return null;
  const coordinate = routeCoordinate(value);
  if (!coordinate) return null;
  return Object.freeze({
    name: text(value.name),
    category: text(value.category),
    source: text(value.source),
    latitude: coordinate.latitude,
    longitude: coordinate.longitude,
  });
}
'''
          if anchor not in s: raise SystemExit('categoryLabel anchor missing')
          s = s.replace(anchor, addition, 1)

          ctor = '''  constructor(
    private readonly host: BusinessOnboardingHostController,
    private readonly adapters: BusinessOnboardingConcreteAdapters,
    private readonly view: Window = window,
  ) {}
'''
          methods = ctor + '''
  private requestLiveSurfaceFocus(
    surface:
      | "assistant"
      | "map"
      | "navigation"
      | "promotions"
      | "settings"
      | "analytics"
      | "partner-panel",
    stepId: string,
  ): void {
    dispatch(this.view, "businessLiveSurfaceFocusRequested", {
      surface,
      stepId,
      tutorial: true,
      excludeFromBusinessMetrics: true,
    });
  }

  private presentLiveBusiness(stepId: "arrival" | "map" | "ecosystem"): boolean {
    const context = this.host.snapshot().session.conversationDraft.context;
    const location = liveLocation(context.businessLocation);
    if (!location) {
      dispatch(this.view, "businessConversationPresentation", {
        source: "business-live-runtime",
        kind: "error",
        title: "Localização ainda não confirmada",
        message:
          "Não mostraremos um ponto aproximado. Volte e confirme a localização do negócio.",
        actions: [
          { action: "previous", label: "Voltar e tentar novamente", primary: true },
        ],
        tutorial: true,
        excludeFromBusinessMetrics: true,
      });
      return false;
    }

    const businessName = text(context.businessName) || location.name || "Sua empresa";
    const category = categoryLabel(context.category);
    const specialty = text(context.specialty) || "Experiência local";
    const detail = Object.freeze({
      source: "business-live-runtime",
      stepId,
      businessName,
      categoryLabel: category,
      specialty,
      location,
      tutorial: true,
      excludeFromBusinessMetrics: true,
    });

    dispatch(this.view, "businessLiveMapPresentationRequested", detail);
    dispatch(this.view, "businessConversationPresentation", {
      source: "business-live-runtime",
      kind: "place",
      title: businessName,
      message: `${category} · ${specialty}`,
      actions: [
        { action: "place-info", label: "Informações" },
        { action: "place-route", label: "Como chegar", primary: true },
        { action: "place-profile", label: "Ver perfil completo" },
      ],
      tutorial: true,
      excludeFromBusinessMetrics: true,
    });
    this.requestLiveSurfaceFocus("map", stepId);
    return true;
  }
'''
          if ctor not in s: raise SystemExit('constructor anchor missing')
          s = s.replace(ctor, methods, 1)

          step_anchor = '''    if (snapshot.stepId === "ready") {
      await this.findLocationCandidate();
      return;
    }
'''
          step_block = '''    if (snapshot.stepId === "arrival") {
      this.presentLiveBusiness("arrival");
      return;
    }

''' + step_anchor
          if step_anchor not in s: raise SystemExit('ready anchor missing')
          s = s.replace(step_anchor, step_block, 1)

          assistant_anchor = '''    if (snapshot.stepId === "ranking-explanation") {
'''
          pre = '''    if (snapshot.stepId === "context") {
      this.requestLiveSurfaceFocus("assistant", "context");
      return;
    }

    if (snapshot.stepId === "map") {
      this.presentLiveBusiness("map");
      return;
    }

''' + assistant_anchor
          if assistant_anchor not in s: raise SystemExit('ranking anchor missing')
          s = s.replace(assistant_anchor, pre, 1)

          profile_anchor = '''    if (snapshot.stepId === "profile") {
'''
          live_steps = '''    if (snapshot.stepId === "conversion") {
      this.requestLiveSurfaceFocus("navigation", "conversion");
      return;
    }

    if (snapshot.stepId === "reputation") {
      const businessName = text(context.businessName) || "sua empresa";
      const query = `Mostre avaliações e informações de ${businessName}.`;
      const response = await this.adapters.assistant.ask(
        query,
        snapshot.session.selectedLanguage,
      );
      dispatch(this.view, "businessOnboardingReputationAssistantResult", {
        query,
        response,
        tutorial: true,
        excludeFromBusinessMetrics: true,
      });
      return;
    }

    if (snapshot.stepId === "promotions") {
      this.requestLiveSurfaceFocus("promotions", "promotions");
      return;
    }

    if (snapshot.stepId === "notifications") {
      this.requestLiveSurfaceFocus("settings", "notifications");
      return;
    }

    if (snapshot.stepId === "analytics") {
      this.requestLiveSurfaceFocus("analytics", "analytics");
      return;
    }

    if (snapshot.stepId === "ecosystem") {
      this.presentLiveBusiness("ecosystem");
      return;
    }

''' + profile_anchor
          if profile_anchor not in s: raise SystemExit('profile anchor missing')
          s = s.replace(profile_anchor, live_steps, 1)

          partner = '''    if (snapshot.stepId === "partner-panel") {
      const workspace = buildBusinessTutorialWorkspaceSnapshot({
        businessName: context.businessName,
        eventSummary: context.businessTutorialEventSummary,
      });
      this.host.updateRuntimeContext({ businessTutorialWorkspace: workspace });
      dispatch(this.view, "businessTutorialWorkspaceOpened", workspace);
    }
'''
          partner_new = '''    if (snapshot.stepId === "partner-panel") {
      const workspace = buildBusinessTutorialWorkspaceSnapshot({
        businessName: context.businessName,
        eventSummary: context.businessTutorialEventSummary,
      });
      this.host.updateRuntimeContext({ businessTutorialWorkspace: workspace });
      dispatch(this.view, "businessTutorialWorkspaceOpened", workspace);
      this.requestLiveSurfaceFocus("partner-panel", "partner-panel");
    }
'''
          if partner not in s: raise SystemExit('partner anchor missing')
          s = s.replace(partner, partner_new, 1)
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-runtime.ts
      - name: Validate M65 runtime patch
        run: |
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm -w build
      - name: Commit runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/business-onboarding-runtime.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(business): reconcile M65 live runtime semantics"
          git push origin HEAD:feat/business-m65-live-runtime-reconciliation
