name: Temporary Unified Dock Formatter

on:
  push:
    branches:
      - fix/ux-v2-unified-dock-visual-conformance-20260923

permissions:
  contents: write

concurrency:
  group: temporary-unified-dock-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ux-v2-unified-dock-visual-conformance-20260923
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format permanent files and remove formatter
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/runtime/browser-locale.ts \
            .github/workflows/home-first-run-browser-regression.yml
          rm .github/workflows/temporary-unified-dock-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ux): apply canonical Prettier formatting"
          git push origin HEAD:fix/ux-v2-unified-dock-visual-conformance-20260923
