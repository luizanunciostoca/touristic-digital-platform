name: Temporary Unified Dock Format

on:
  push:
    branches:
      - wave/ux-v2-unified-assistant-dock-convergence-20260922
    paths:
      - .github/workflows/temporary-unified-dock-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/ux-v2-unified-assistant-dock-convergence-20260922
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format unified dock changes
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/assistant-v2.css \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/layouts/app-shell.ts \
            apps/morro-digital-platform/src/runtime/shell-v1-i18n.ts \
            apps/morro-digital-platform/src/ux/premium-ux-mode.test.ts \
            apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs \
            apps/morro-digital-platform/tooling/wave-g-responsive-a11y-regression.mjs \
            docs/ux/design-tokens-v2-authority.md \
            docs/ux/shared-components-v2.md \
            docs/ux/unified-contextual-assistant-dock.md
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/assistant-v2.css \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/layouts/app-shell.ts \
            apps/morro-digital-platform/src/runtime/shell-v1-i18n.ts \
            apps/morro-digital-platform/src/ux/premium-ux-mode.test.ts \
            apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs \
            apps/morro-digital-platform/tooling/wave-g-responsive-a11y-regression.mjs \
            docs/ux/design-tokens-v2-authority.md \
            docs/ux/shared-components-v2.md \
            docs/ux/unified-contextual-assistant-dock.md
          git commit -m "style(ux): format unified assistant dock changes"
          git push origin HEAD:wave/ux-v2-unified-assistant-dock-convergence-20260922
