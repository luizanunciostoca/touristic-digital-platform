name: Payments M153 Format Once

on:
  push:
    branches:
      - feat/payments-m153-feature-0009-closure
    paths:
      - ".github/workflows/payments-m153-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m153-feature-0009-closure
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply narrow test correction
        run: |
          sed -i '/  SubscriptionRecurrenceError,/d' packages/ordering/src/subscription-application.test.ts
          sed -i 's/\.rejects\.toMatchObject<Partial<SubscriptionRecurrenceError>>({/.rejects.toMatchObject({/' packages/ordering/src/subscription-application.test.ts
          sed -i '/          orderId: undefined,/d' packages/ordering/src/subscription-application.test.ts
      - name: Apply canonical formatter
        run: >-
          pnpm exec prettier --write
          .github/workflows/payments-subscription-recurrence-contract.yml
          apps/morro-digital-platform/src/business-onboarding-entry.ts
          apps/morro-digital-platform/src/payments-browser-authority-bootstrap.test.ts
          apps/morro-digital-platform/src/payments-browser-authority-bootstrap.ts
          apps/morro-digital-platform/src/payments-business-checkout-composition.ts
          apps/morro-digital-platform/tooling/payments-api.mjs
          apps/morro-digital-platform/tooling/payments-authority-bootstrap.test.mjs
          docs/migration/MASTER-MIGRATION-TRACKER.md
          docs/migration/PAYMENTS-MIGRATION-MATRIX.md
          docs/operations/PAYMENTS-RELEASE-ROLLBACK.md
          docs/qa/PAYMENTS-M151-EVIDENCE.md
          packages/ordering/package.json
          packages/ordering/src/subscription-application.test.ts
          packages/ordering/src/subscription-application.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/payments-subscription-recurrence-contract.yml \
            apps/morro-digital-platform/src/business-onboarding-entry.ts \
            apps/morro-digital-platform/src/payments-browser-authority-bootstrap.test.ts \
            apps/morro-digital-platform/src/payments-browser-authority-bootstrap.ts \
            apps/morro-digital-platform/src/payments-business-checkout-composition.ts \
            apps/morro-digital-platform/tooling/payments-api.mjs \
            apps/morro-digital-platform/tooling/payments-authority-bootstrap.test.mjs \
            docs/migration/MASTER-MIGRATION-TRACKER.md \
            docs/migration/PAYMENTS-MIGRATION-MATRIX.md \
            docs/operations/PAYMENTS-RELEASE-ROLLBACK.md \
            docs/qa/PAYMENTS-M151-EVIDENCE.md \
            packages/ordering/package.json \
            packages/ordering/src/subscription-application.test.ts \
            packages/ordering/src/subscription-application.ts
          git commit -m "style(payments): apply canonical M153 formatting"
          git push origin HEAD:feat/payments-m153-feature-0009-closure
