name: Fix NAV-03 Lint Temp

on:
  push:
    branches:
      - feat/navigation-route-geometry
    paths:
      - .github/workflows/navigation-nav03-lintfix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-route-geometry
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint fix
        run: pnpm exec eslint packages/navigation/src/geometry.ts --fix
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/navigation/src/geometry.ts
          git commit -m "style: remove redundant NAV-03 assertion"
          git push origin HEAD:feat/navigation-route-geometry
