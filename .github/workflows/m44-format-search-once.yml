name: M44 Format Search Once

on:
  push:
    branches:
      - feat/search-m44-fuzzy-fallback
    paths:
      - .github/workflows/m44-format-search-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m44-fuzzy-fallback
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M44 Search files
        run: pnpm exec prettier --write packages/search/src/index.ts packages/search/src/search-fuzzy.test.ts
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m44-format-search-once.yml
          git add packages/search/src/index.ts packages/search/src/search-fuzzy.test.ts
          git commit -m "style(search): format M44 fuzzy fallback"
          git push origin HEAD:feat/search-m44-fuzzy-fallback
