name: Temporary PR18 Mercado Pago Docs Sync

on:
  push:
    branches:
      - fix/mercado-pago-modern-test-checkout-20260822
    paths:
      - ".github/workflows/tmp-sync-mp-docs-pr18.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mercado-pago-modern-test-checkout-20260822
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile Mercado Pago runbooks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`MISSING_EXPECTED_TEXT:${file}:${before}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          const staging = 'docs/deployment/RENDER-STAGING-V2.md';
          replaceExact(
            staging,
            'MERCADO_PAGO_CHECKOUT_ORIGINS=https://sandbox.mercadopago.com',
            'MERCADO_PAGO_CHECKOUT_ORIGINS=https://www.mercadopago.com,https://www.mercadopago.com.br',
          );
          replaceExact(
            staging,
            'V1_PAYMENT_PROVIDER_API_URL=https://api.mercadopago.com\n```',
            'V1_PAYMENT_PROVIDER_API_URL=https://api.mercadopago.com\n```\n\nEm `MERCADO_PAGO_CHECKOUT_MODE=test`, o adapter faz um read-only em `/users/me` e exige `tags` contendo `test_user` com `site_id=MLB` antes de criar a preferência. Somente depois desse guard ele aceita o `init_point` em uma das origins oficiais acima. Uma credencial que não seja de test user falha fechada antes de qualquer preferência.',
          );

          const mp = 'docs/deployment/RENDER-MERCADO-PAGO-V2.md';
          replaceExact(
            mp,
            '- origin sandbox inicial exata `https://sandbox.mercadopago.com`, conforme o `sandbox_init_point` atualmente documentado na API Reference do Checkout Pro.\n\nO adapter rejeita qualquer outra origin. Se o primeiro preflight real devolver uma origin HTTPS diferente, interrompa o gate e valide essa origin contra documentação oficial antes de alterar a allowlist. Não use wildcard.',
            '- `MERCADO_PAGO_CHECKOUT_MODE=test` exige que `/users/me` identifique a credencial como `test_user` do site `MLB` antes de criar qualquer preferência;\n- Checkout Pro usa o `init_point` retornado pelo provider;\n- a allowlist inicial aceita somente `https://www.mercadopago.com` e `https://www.mercadopago.com.br`.\n\nO adapter rejeita credencial não-test antes da preferência e rejeita qualquer checkout origin fora da allowlist. Se o provider devolver outra origin HTTPS, interrompa o gate e valide essa origin contra documentação oficial antes de alterar a allowlist. Não use wildcard.',
          );
          replaceExact(
            mp,
            'Não é necessário preencher manualmente `MERCADO_PAGO_CHECKOUT_ORIGINS` para o primeiro deploy de teste: o Blueprint já fornece `https://sandbox.mercadopago.com`. Depois do preflight, mantenha essa origin somente se ela coincidir com a origin realmente retornada pela conta.',
            'Não é necessário preencher manualmente `MERCADO_PAGO_CHECKOUT_ORIGINS` para o primeiro deploy de teste: o Blueprint já fornece `https://www.mercadopago.com,https://www.mercadopago.com.br`. O modo `test` só prossegue depois de comprovar `test_user` + `MLB`; não amplie a allowlist por tentativa e erro.',
          );
          replaceExact(
            mp,
            'MERCADO_PAGO_CHECKOUT_ORIGINS=https://sandbox.mercadopago.com',
            'MERCADO_PAGO_CHECKOUT_ORIGINS=https://www.mercadopago.com,https://www.mercadopago.com.br',
          );
          NODE
          pnpm exec prettier --write docs/deployment/RENDER-STAGING-V2.md docs/deployment/RENDER-MERCADO-PAGO-V2.md
      - name: Commit documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/deployment/RENDER-STAGING-V2.md docs/deployment/RENDER-MERCADO-PAGO-V2.md; then
            echo "Already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/RENDER-STAGING-V2.md docs/deployment/RENDER-MERCADO-PAGO-V2.md
          git commit -m "docs(payments): align Mercado Pago test checkout runbooks"
          git push origin HEAD:fix/mercado-pago-modern-test-checkout-20260822
