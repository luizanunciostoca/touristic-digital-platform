name: Commerce Browser Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/commerce-browser-regression.yml"
      - "tests/visual-regression/ux-v2-manual-reference-matrix.json"
      - ".github/workflows/final-release-acceptance.yml"
      - "apps/morro-digital-platform/public/commerce.css"
      - "apps/morro-digital-platform/public/experience.html"
      - "apps/morro-digital-platform/public/experience.js"
      - "apps/morro-digital-platform/public/index.html"
      - "apps/morro-digital-platform/public/ticketing.js"
      - "apps/morro-digital-platform/public/tickets.html"
      - "apps/morro-digital-platform/public/legacy/css/components/assistant/assistantModalUI.css"
      - "apps/morro-digital-platform/src/assistant/assistant-dom-view.ts"
      - "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts"
      - "apps/morro-digital-platform/src/browser-entry.ts"
      - "apps/morro-digital-platform/src/map/**"
      - "apps/morro-digital-platform/src/ux/tourist-experience-snapshot.ts"
      - "apps/morro-digital-platform/src/runtime/commerce-preview-sheet.ts"
      - "apps/morro-digital-platform/src/ux/commerce-preview-sheet.ts"
      - "apps/morro-digital-platform/src/business-dashboard-client.ts"
      - "apps/morro-digital-platform/src/business-dashboard-surface.ts"
      - "apps/morro-digital-platform/src/commerce/**"
      - "apps/morro-digital-platform/src/main.ts"
      - "apps/morro-digital-platform/tooling/ticketing-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.test.mjs"
      - "services/ordering/src/ticketing-checkout-handoff.ts"
      - "services/ordering/src/ticketing-checkout-handoff.test.ts"
      - "services/crm/src/commerce-schema.ts"
      - "services/crm/src/mysql-commerce-customer-repository.ts"
      - "services/ticketing/src/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commerce-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commerce security contracts
        run: pnpm --filter @touristic/ticketing-server test
      - name: Ticketing to Payments browser handoff contract
        run: pnpm ticketing:browser:smoke
      - name: Build workspace
        run: pnpm -w build
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/commerce-browser
      - name: Start browser runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/commerce-browser/server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/commerce-browser/server.log
          exit 1
      - name: Browser acceptance
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const origin = 'http://127.0.0.1:4173';
          const now = Date.now();
          const DAY = 24 * 60 * 60 * 1000;
          const HOUR = 60 * 60 * 1000;
          const iso = offset => new Date(now + offset).toISOString();
          const localDateTime = offset => iso(offset).slice(0, 16);
          const offer = {
            id: 'mpi_0123456789abcdef0123456789abcdef',
            destinationId: 'morro-de-sao-paulo',
            product: { kind: 'business_experience', reference: 'morro-pro:business-a:sunset' },
            label: 'Sunset Morro Pro',
            unitAmount: { minorUnits: 15900, currency: 'BRL' },
            pricingVersion: 'morro-pro-v1', capacity: 50, maxPerReservation: 4,
            availableQuantity: 42,
            salesStartAt: iso(-7 * DAY), salesEndAt: iso(2 * DAY),
            startsAt: iso(3 * DAY), endsAt: iso(3 * DAY + 5 * HOUR),
          };
          const placeOffer = {
            id: 'mpi_11111111111111111111111111111111',
            destinationId: 'morro-de-sao-paulo',
            product: { kind: 'business_experience', reference: 'morro-pro:toca-do-morcego:the-party' },
            label: 'Toca do Morcego · The Party',
            unitAmount: { minorUnits: 8000, currency: 'BRL' },
            pricingVersion: 'morro-pro-v1', capacity: 200, maxPerReservation: 8,
            availableQuantity: 37,
            salesStartAt: iso(-7 * DAY), salesEndAt: iso(2 * DAY),
            startsAt: iso(3 * DAY), endsAt: iso(3 * DAY + 6 * HOUR),
          };
          const reservation = {
            id: 'trv_browser_0001', inventoryId: offer.id, destinationId: offer.destinationId,
            product: offer.product, unitAmount: offer.unitAmount, pricingVersion: offer.pricingVersion,
            holderReference: 'guest:browser', quantity: 2, status: 'confirmed',
            expiresAt: iso(HOUR), validUntil: iso(3 * DAY + 5 * HOUR),
            orderId: 'ord_browser_0001', paymentId: 'pay_browser_0001',
            createdAt: iso(-HOUR), confirmedAt: iso(-HOUR + 5000),
          };
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 900 },
          ];
          const evidence = [];
          const fulfill = (route, body, status = 200, headers = {}) => route.fulfill({
            status, headers, contentType: 'application/json', body: JSON.stringify(body),
          });

          async function commerceRoutes(page, state) {
            await page.route('**/api/weather', route => fulfill(route, {
              temperatureCelsius: 28, temperatureMaxCelsius: 31, temperatureMinCelsius: 24,
              humidityPercent: 78, windSpeedKph: 18, rainChancePercent: 20,
              weatherCode: 1, isDay: true, forecast: [],
            }));
            await page.route('**/api/ticketing/v1/inventory', route =>
              state.inventoryFailure
                ? fulfill(route, { error: 'TICKETING_UNAVAILABLE' }, 503)
                : fulfill(route, { data: state.inventory ?? [offer, placeOffer] }));
            await page.route('**/api/ticketing/v1/consumer-session', route => fulfill(route, {
              data: { subject: 'guest:browser', csrfToken: 'csrf_browser_0001', expiresAt: iso(30 * DAY) },
            }, 201, { 'set-cookie': 'morro_commerce_session=browser-token; Path=/; HttpOnly; SameSite=Strict' }));
            await page.route('**/api/ticketing/v1/quote', route => {
              const body = route.request().postDataJSON();
              const selected =
                (state.inventory ?? [offer, placeOffer]).find(entry => entry.id === body.inventoryId) ?? offer;
              const quantity = Number(body.quantity);
              const unitAmount = selected.unitAmount;
              return fulfill(route, {
                data: {
                  inventoryId: selected.id,
                  quantity,
                  unitAmount,
                  totalAmount: {
                    minorUnits: unitAmount.minorUnits * quantity,
                    currency: unitAmount.currency,
                  },
                  pricingVersion: selected.pricingVersion,
                  availableQuantity: selected.availableQuantity,
                  maxPerReservation: selected.maxPerReservation,
                  observedAt: iso(0),
                  expiresAt: iso(60_000),
                },
              });
            });

            await page.route('**/api/ticketing/v1/reservations', route => {
              const request = route.request();
              if (request.method() === 'GET') return fulfill(route, { data: state.paid ? [reservation] : [] });
              if (request.headers()['x-csrf-token'] !== 'csrf_browser_0001') return fulfill(route, { error: 'INVALID_CSRF' }, 403);
              const body = request.postDataJSON();
              if (body.inventoryId !== offer.id || body.quantity !== 2) return fulfill(route, { error: 'INVALID_RESERVATION' }, 400);
              state.reserved = true;
              return fulfill(route, { data: {
                reservation: { ...reservation, status: 'held', orderId: null, paymentId: null, confirmedAt: null },
                reservationReference: reservation.id,
                checkout: {
                  path: '/api/payments/v1/checkouts', reservationReference: reservation.id,
                  idempotencyKey: 'idem_browser_0001', handoffToken: 'handoff_browser_0001',
                  handoff: { destinationId: offer.destinationId, reservationReference: reservation.id,
                    lineItems: [{ reference: offer.product.reference, quantity: 2, unitAmount: offer.unitAmount }] },
                },
              } }, 201);
            });
            await page.route('**/api/payments/v1/checkouts', route => {
              if (route.request().method() !== 'POST') return route.fallback();
              const h = route.request().headers();
              if (h['x-checkout-handoff-token'] !== 'handoff_browser_0001' || h['idempotency-key'] !== 'idem_browser_0001' || h['x-csrf-token']) {
                return fulfill(route, { error: 'CHECKOUT_HANDOFF_INVALID' }, 400);
              }
              state.checkout = true;
              return fulfill(route, { data: { checkoutId: 'chk_browser_0001', statusToken: 'status_browser_0001', statusExpiresAt: new Date(Date.now() + 60 * 60 * 1000).toISOString(), checkoutUrl: null } }, 201);
            });
            await page.route('**/api/payments/v1/checkouts/chk_browser_0001', route => {
              if (route.request().headers()['x-checkout-token'] !== 'status_browser_0001') return fulfill(route, { error: 'CHECKOUT_TOKEN_INVALID' }, 401);
              state.paid = true;
              return fulfill(route, { data: { status: 'CONFIRMED', verifiedPayment: { verified: true, paymentId: 'pay_browser_0001' } } });
            });
            await page.route('**/api/ticketing/v1/reservations/trv_browser_0001/ticket', route => fulfill(route, { data: {
              code: 'MORRO-BROWSER-0001', quantity: 2, amount: { minorUnits: 31800, currency: 'BRL' },
              issuedAt: iso(-HOUR + 6000), validUntil: iso(3 * DAY + 5 * HOUR),
              qrSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10"/></svg>',
            } }));
            await page.route('**/api/ticketing/v1/operator/check-in', route => fulfill(route, { error: 'AUTH_REQUIRED' }, 401));
          }

          (async () => {
            const bounded = (promise, label, ms = 10000) =>
              Promise.race([
                promise,
                new Promise((_, reject) =>
                  setTimeout(() => reject(new Error(`Timed out waiting for ${label}`)), ms),
                ),
              ]);
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport,
                  hasTouch: viewport.name === 'mobile',
                });
                await context.addInitScript(() => {
                  localStorage.setItem('morro-digital-onboarded', '1');
                  localStorage.setItem('morro-digital-language', 'pt-BR');
                  localStorage.setItem('voice-enabled', 'false');
                });
                const page = await context.newPage();
                const state = {};
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                await commerceRoutes(page, state);
                await page.goto(`${origin}/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                const home = await page.evaluate(() => ({
                  values: [...document.querySelectorAll('.assistant-option-btn')].map(node => node.getAttribute('data-value')),
                  globalCommerceCta: document.getElementById('assistant-commerce-cta') !== null,
                  messages: document.querySelectorAll('#assistant-messages .messages-area > .message').length,
                }));
                const expected = ['beaches','tours','attractions','restaurants','hotels','nightlife','shops','transport','emergencies','help'];
                if (JSON.stringify(home.values) !== JSON.stringify(expected) || home.globalCommerceCta || home.messages !== 1) {
                  throw new Error(`V1 Assistant home menu contract drift on ${viewport.name}: ${JSON.stringify(home)}`);
                }
                await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 5000 });
                const assistant = page.locator('#assistant-messages');
                const input = page.locator('#assistantInput');
                await input.waitFor({ state: 'visible', timeout: 5000 });
                if (!(await assistant.isVisible())) await input.focus();
                await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });
                await page.locator('#map[data-map-state="ready"]').waitFor({ state: 'attached', timeout: 30000 });

                const nightlifeCategory = page.locator(
                  '#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="nightlife"]',
                );
                await nightlifeCategory.waitFor({ state: 'visible', timeout: 5000 });
                await nightlifeCategory.click();
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="filters"] [data-value="ver todos"]',
                ).click();
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Toca do Morcego"]',
                ).click();
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="detail"] [data-value="como chegar"]',
                ).waitFor({ state: 'visible', timeout: 10000 });
                const placeActions = await page.evaluate(() => {
                  const rail = document.querySelector(
                    '#assistant-category-rail[data-rail-stage="detail"]',
                  );
                  const detail = document.querySelector(
                    '#assistant-category-results-message.md-assistant-place-detail-message',
                  );
                  if (!(rail instanceof HTMLElement) || !(detail instanceof HTMLElement)) {
                    return null;
                  }
                  const buttons = Array.from(
                    rail.querySelectorAll('[data-context-rail-option="true"]'),
                  );
                  const targets = buttons.map(button => {
                    const rect = button.getBoundingClientRect();
                    return { width: rect.width, height: rect.height };
                  });
                  const primary = buttons.find(
                    button => button.getAttribute('data-explore-action') === 'primary',
                  );
                  return {
                    values: buttons.map(button => button.getAttribute('data-value')),
                    primaryText: primary?.textContent?.trim() ?? null,
                    primaryIndex: buttons.indexOf(primary),
                    railStage: rail.getAttribute('data-rail-stage'),
                    targets,
                    detailTitle:
                      detail.querySelector('.md-assistant-place-detail-title')?.textContent?.trim() ??
                      null,
                    legacySheetExists: Boolean(document.getElementById('place-bottom-sheet')),
                  };
                });
                const expectedContextualActions = [
                  'como chegar',
                  'ver fotos',
                  'programação',
                  '__back_to_places__',
                ];
                if (
                  !placeActions ||
                  JSON.stringify(placeActions.values) !==
                    JSON.stringify(expectedContextualActions) ||
                  placeActions.railStage !== 'detail' ||
                  placeActions.primaryIndex !== -1 ||
                  placeActions.detailTitle !== 'Toca do Morcego' ||
                  placeActions.legacySheetExists ||
                  placeActions.primaryText !== null ||
                  placeActions.targets.some(target => target.width < 44 || target.height < 44)
                ) {
                  throw new Error(`External Place fail-closed action drift on ${viewport.name}: ${JSON.stringify(placeActions)}`);
                }
                const contextBeforeHandoff = await page.evaluate(() => {
                  const map = globalThis.mapboxPrimaryInstance;
                  const center = map?.getCenter?.();
                  return {
                    mode: document.body.dataset.mdMode,
                    category: document.getElementById('map')?.dataset.exploreCategory,
                    place: document.getElementById('map')?.dataset.explorePlace,
                    center: center ? [center.lng, center.lat] : null,
                    zoom: map?.getZoom?.() ?? null,
                  };
                });
                await Promise.all([
                  page.waitForURL(`**/tickets.html?offer=${placeOffer.id}&source=map`),
                  placePrimary.click(),
                ]);
                await page.locator('#selected-offer').waitFor({ state: 'visible', timeout: 10000 });
                let selectedFromMap = '';
                for (let attempt = 0; attempt < 50; attempt += 1) {
                  selectedFromMap = await page.locator('#selected-offer').inputValue();
                  if (selectedFromMap.includes('Toca do Morcego')) break;
                  await page.waitForTimeout(200);
                }
                if (!selectedFromMap.includes('Toca do Morcego')) {
                  throw new Error(`Map commerce handoff did not select place offer on ${viewport.name}: ${selectedFromMap}`);
                }
                const storedSnapshot = await page.evaluate(() => {
                  const raw = sessionStorage.getItem('morro_tourist_experience_v1');
                  return raw ? JSON.parse(raw) : null;
                });
                if (
                  !storedSnapshot ||
                  storedSnapshot.version !== 1 ||
                  storedSnapshot.mode !== 'place' ||
                  storedSnapshot.placeId !== 'Toca do Morcego' ||
                  storedSnapshot.category !== 'nightlife' ||
                  !Array.isArray(storedSnapshot.mapCenter) ||
                  typeof storedSnapshot.mapZoom !== 'number' ||
                  'statusToken' in storedSnapshot ||
                  'paymentAuthority' in storedSnapshot ||
                  'holder' in storedSnapshot
                ) {
                  throw new Error(`Tourist context snapshot invalid on ${viewport.name}: ${JSON.stringify(storedSnapshot)}`);
                }

                await Promise.all([
                  page.waitForURL(`${origin}/`, {
                    waitUntil: 'domcontentloaded',
                    timeout: 30000,
                  }),
                  page.locator('.back-link').click(),
                ]);
                await page.locator('#map[data-explore-stage="detail"][data-explore-place="Toca do Morcego"]').waitFor({
                  state: 'attached',
                  timeout: 10000,
                });
                await page.locator('body[data-md-mode="place"][data-md-context-restored="true"]').waitFor({
                  state: 'attached',
                  timeout: 10000,
                });
                const contextAfterReturn = await page.evaluate(() => {
                  const map = globalThis.mapboxPrimaryInstance;
                  const center = map?.getCenter?.();
                  return {
                    mode: document.body.dataset.mdMode,
                    restoredMode: document.body.dataset.mdContextRestoredMode,
                    category: document.getElementById('map')?.dataset.exploreCategory,
                    place: document.getElementById('map')?.dataset.explorePlace,
                    center: center ? [center.lng, center.lat] : null,
                    zoom: map?.getZoom?.() ?? null,
                  };
                });
                const close = (left, right, tolerance) =>
                  typeof left === 'number' &&
                  typeof right === 'number' &&
                  Math.abs(left - right) <= tolerance;
                const mapCenterTolerance = 0.00001;
                if (
                  contextBeforeHandoff.mode !== 'place' ||
                  contextAfterReturn.mode !== 'place' ||
                  contextAfterReturn.restoredMode !== 'place' ||
                  contextAfterReturn.category !== 'nightlife' ||
                  contextAfterReturn.place !== 'Toca do Morcego' ||
                  !Array.isArray(storedSnapshot.mapCenter) ||
                  !Array.isArray(contextAfterReturn.center) ||
                  !close(storedSnapshot.mapCenter[0], contextAfterReturn.center[0], mapCenterTolerance) ||
                  !close(storedSnapshot.mapCenter[1], contextAfterReturn.center[1], mapCenterTolerance) ||
                  !close(storedSnapshot.mapZoom, contextAfterReturn.zoom, 0.01)
                ) {
                  throw new Error(
                    `Map -> Place -> Ticketing -> Return context drift on ${viewport.name}: ${JSON.stringify({ contextBeforeHandoff, storedSnapshot, contextAfterReturn })}`,
                  );
                }
                await page.screenshot({
                  path: `/tmp/commerce-browser/commerce-return-to-tourist-context-${viewport.name}.png`,
                  fullPage: false,
                  animations: 'disabled',
                });
                evidence.push({
                  viewport: viewport.name,
                  placeActions,
                  selectedFromMap,
                  contextBeforeHandoff,
                  storedSnapshot,
                  contextAfterReturn,
                });

                state.inventory = [offer];
                await page.goto(`${origin}/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page
                  .locator('body[data-public-onboarding-settled="true"]')
                  .waitFor({ state: 'attached', timeout: 5000 });
                await page.locator('#assistantInput').focus();
                await page
                  .locator('#assistant-messages:not(.hidden)')
                  .waitFor({ state: 'visible', timeout: 5000 });
                const fallbackNightlifeCategory = page.locator(
                  '#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="nightlife"]',
                );
                await fallbackNightlifeCategory.waitFor({ state: 'visible', timeout: 5000 });
                await fallbackNightlifeCategory.click();
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="filters"] [data-value="ver todos"]',
                ).click();
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Toca do Morcego"]',
                ).click();
                const fallbackPrimary = page.locator(
                  '#assistant-category-rail[data-rail-stage="detail"] [data-explore-action="primary"]',
                );
                await fallbackPrimary.waitFor({ state: 'visible', timeout: 10000 });
                const fallbackAction = await fallbackPrimary.evaluate(node => ({
                  text: node.textContent?.trim(),
                  value: node.getAttribute('data-value'),
                }));
                if (
                  fallbackAction.value !== 'commerce:place:toca-do-morcego' ||
                  !fallbackAction.text?.includes('Comprar ingressos')
                ) {
                  throw new Error(`Place fallback CTA drift on ${viewport.name}: ${JSON.stringify(fallbackAction)}`);
                }
                await Promise.all([
                  page.waitForURL('**/tickets.html?place=toca-do-morcego&source=map'),
                  fallbackPrimary.click(),
                ]);
                await page.locator('#offers .empty').waitFor({ state: 'visible', timeout: 10000 });
                if ((await page.locator('.offer-card').count()) !== 0) {
                  throw new Error(`Place fallback leaked unrelated inventory on ${viewport.name}`);
                }
                state.inventory = undefined;
                await page.goto(`${origin}/tickets.html?place=TOCA-DO-MORCEGO&source=map`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.locator('#offers .empty').waitFor({ state: 'visible', timeout: 10000 });
                if ((await page.locator('.offer-card').count()) !== 0) {
                  throw new Error(`Invalid place filter leaked inventory on ${viewport.name}`);
                }

                await page.goto(`${origin}/tickets.html`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.locator(`.offer-card[data-inventory-id="${offer.id}"]`).waitFor({ state: 'visible' });
                await Promise.all([page.waitForURL('**/experience.html?id=*'), page.locator(`.offer-card[data-inventory-id="${offer.id}"] a.button-secondary`).click()]);
                try {
                  await page.locator('#experience-card').waitFor({ state: 'visible', timeout: 10000 });
                } catch {
                  const detailDiagnostics = await page.evaluate(async () => {
                    const moduleResponse = await fetch('/runtime/commerce-preview-sheet.js').catch(() => null);
                    return {
                      href: location.href,
                      loadingText: document.getElementById('experience-loading')?.textContent?.trim() ?? null,
                      loadingHidden: document.getElementById('experience-loading')?.hidden ?? null,
                      cardHidden: document.getElementById('experience-card')?.hidden ?? null,
                      moduleStatus: moduleResponse?.status ?? null,
                      moduleContentType: moduleResponse?.headers.get('content-type') ?? null,
                      resources: performance
                        .getEntriesByType('resource')
                        .map(entry => entry.name)
                        .filter(name => name.includes('commerce') || name.includes('experience')),
                    };
                  });
                  throw new Error(
                    `Experience detail did not resolve on ${viewport.name}: ${JSON.stringify({ detailDiagnostics, errors })}`,
                  );
                }
                if ((await page.locator('#experience-title').textContent())?.trim() !== offer.label) throw new Error(`Detail mismatch on ${viewport.name}`);

                const previewSheet = await page.locator('#experience-preview-sheet').evaluate(node => {
                  const handle = node.querySelector('[data-commerce-sheet-handle="true"]');
                  const reserve = node.querySelector('#experience-reserve');
                  const handleRect = handle instanceof HTMLElement ? handle.getBoundingClientRect() : null;
                  return {
                    active: node.classList.contains('md-bottom-sheet'),
                    state: node.getAttribute('data-sheet-state'),
                    bodyState: document.body.dataset.commerceSheetState ?? null,
                    handleHidden: handle instanceof HTMLElement ? handle.hidden : null,
                    handleHeight: handleRect?.height ?? 0,
                    reserveInside: reserve instanceof HTMLElement,
                  };
                });
                if (viewport.name === 'mobile') {
                  if (
                    !previewSheet.active ||
                    previewSheet.state !== 'half' ||
                    previewSheet.bodyState !== 'half' ||
                    previewSheet.handleHidden ||
                    previewSheet.handleHeight < 44 ||
                    !previewSheet.reserveInside
                  ) {
                    throw new Error(`Commerce preview sheet initial state drift on ${viewport.name}: ${JSON.stringify(previewSheet)}`);
                  }
                  const reserveGeometry = await page
                    .locator('#experience-reserve')
                    .evaluate(node => {
                      const rect = node.getBoundingClientRect();
                      return {
                        top: rect.top,
                        bottom: rect.bottom,
                        height: rect.height,
                        viewportHeight: innerHeight,
                      };
                    });
                  if (
                    reserveGeometry.height < 44 ||
                    reserveGeometry.top < 0 ||
                    reserveGeometry.bottom > reserveGeometry.viewportHeight
                  ) {
                    throw new Error(
                      `MANUAL_CONFORMANCE_COMMERCE_PRIMARY_CTA_VISIBILITY on ${viewport.name}: ${JSON.stringify(reserveGeometry)}`,
                    );
                  }
                  await page.screenshot({
                    path: `/tmp/commerce-browser/commerce-contextual-handoff-${viewport.name}.png`,
                    fullPage: false,
                    animations: 'disabled',
                  });
                  const handle = page.locator('[data-commerce-sheet-handle="true"]');
                  await handle.press('ArrowUp');
                  await page.locator('#experience-preview-sheet[data-sheet-state="full"]').waitFor({ state: 'attached' });
                  await handle.press('ArrowDown');
                  await page.locator('#experience-preview-sheet[data-sheet-state="half"]').waitFor({ state: 'attached' });
                  await page.evaluate(() => {
                    const sheet = document.getElementById('experience-preview-sheet');
                    globalThis.__commerceSheetGestureTrace = [];
                    const record = (event) => {
                      const touch =
                        event instanceof TouchEvent
                          ? event.touches[0] ?? event.changedTouches[0]
                          : null;
                      globalThis.__commerceSheetGestureTrace.push({
                        type: event.type,
                        pointerType: event instanceof PointerEvent ? event.pointerType : null,
                        clientY:
                          event instanceof PointerEvent
                            ? event.clientY
                            : touch?.clientY ?? null,
                        target:
                          event.target instanceof HTMLElement
                            ? event.target.id || event.target.className
                            : null,
                        state: sheet?.getAttribute('data-sheet-state') ?? null,
                      });
                    };
                    for (const type of [
                      'pointerdown',
                      'pointermove',
                      'pointerup',
                      'pointercancel',
                      'touchstart',
                      'touchmove',
                      'touchend',
                      'touchcancel',
                      'click',
                    ]) {
                      document.addEventListener(type, record, true);
                    }
                  });
                  const handleBox = await handle.boundingBox();
                  if (!handleBox) {
                    throw new Error('Commerce preview sheet handle has no geometry');
                  }
                  const touchClient = await context.newCDPSession(page);
                  const startX = handleBox.x + handleBox.width / 2;
                  const startY = handleBox.y + handleBox.height / 2;
                  const endY = Math.max(1, startY - 64);
                  await touchClient.send('Input.dispatchTouchEvent', {
                    type: 'touchStart',
                    touchPoints: [{ x: startX, y: startY }],
                  });
                  await touchClient.send('Input.dispatchTouchEvent', {
                    type: 'touchMove',
                    touchPoints: [{ x: startX, y: endY }],
                  });
                  await touchClient.send('Input.dispatchTouchEvent', {
                    type: 'touchEnd',
                    touchPoints: [],
                  });
                  await page.waitForTimeout(100);
                  const dragResult = await page
                    .locator('#experience-preview-sheet')
                    .evaluate(node => ({
                      state: node.getAttribute('data-sheet-state'),
                      bodyState: document.body.dataset.commerceSheetState ?? null,
                      trace: globalThis.__commerceSheetGestureTrace ?? [],
                    }));
                  if (dragResult.state !== 'full' || dragResult.bodyState !== 'full') {
                    throw new Error(
                      `Commerce preview sheet touch drag did not expand on ${viewport.name}: ${JSON.stringify(dragResult)}`,
                    );
                  }
                  const expanded = await page.locator('#experience-preview-sheet').evaluate(node => ({
                    state: node.getAttribute('data-sheet-state'),
                    bodyState: document.body.dataset.commerceSheetState ?? null,
                    reserveVisible: (() => {
                      const reserve = node.querySelector('#experience-reserve');
                      if (!(reserve instanceof HTMLElement)) return false;
                      const rect = reserve.getBoundingClientRect();
                      return rect.width >= 44 && rect.height >= 44 && rect.top < innerHeight && rect.bottom > 0;
                    })(),
                  }));
                  if (expanded.state !== 'full' || expanded.bodyState !== 'full' || !expanded.reserveVisible) {
                    throw new Error(`Commerce preview sheet expanded state drift on ${viewport.name}: ${JSON.stringify(expanded)}`);
                  }
                  await handle.press('ArrowDown');
                  await page.locator('#experience-preview-sheet[data-sheet-state="half"]').waitFor({ state: 'attached' });
                } else if (
                  previewSheet.active ||
                  previewSheet.state !== null ||
                  previewSheet.bodyState !== null ||
                  previewSheet.handleHidden !== true
                ) {
                  throw new Error(`Commerce preview sheet leaked into non-mobile layout on ${viewport.name}: ${JSON.stringify(previewSheet)}`);
                }
                evidence.push({ viewport: viewport.name, previewSheet });

                await page.goBack({ waitUntil: 'domcontentloaded' });
                await page.locator(`.offer-card[data-inventory-id="${offer.id}"]`).waitFor({ state: 'visible' });
                await Promise.all([page.waitForURL('**/experience.html?id=*'), page.locator(`.offer-card[data-inventory-id="${offer.id}"] a.button-secondary`).click()]);
                await Promise.all([page.waitForURL('**/tickets.html?offer=*'), page.locator('#experience-reserve').click()]);
                await page.locator('#holder-name').fill('Visitante Teste');
                await page.locator('#holder-email').fill('visitante@example.test');
                await page.locator('#quantity').fill('2');
                await page.locator('#reserve-button').click();
                await page.locator('#ticket-dialog[open]').waitFor({ state: 'visible', timeout: 10000 });
                if (!state.reserved || !state.checkout || !state.paid) throw new Error(`Commerce handoff incomplete on ${viewport.name}`);
                if ((await page.locator('#ticket-code').textContent())?.trim() !== 'MORRO-BROWSER-0001') throw new Error(`Wallet/QR missing on ${viewport.name}`);
                const ticketMeta = (await page.locator('#ticket-meta').textContent())?.trim() ?? '';
                if (!ticketMeta.includes('válido até')) throw new Error(`Ticket validity missing on ${viewport.name}: ${ticketMeta}`);
                const privileged = await page.evaluate(async () => {
                  const response = await fetch('/api/ticketing/v1/operator/check-in', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': 'csrf_browser_0001' }, body: '{}' });
                  return { status: response.status, body: await response.json() };
                });
                if (privileged.status !== 401) throw new Error(`Guest operator escalation on ${viewport.name}`);
                if (errors.length) throw new Error(`Browser errors on ${viewport.name}: ${JSON.stringify(errors)}`);
                evidence.push({ viewport: viewport.name, home, privileged, state });
                await context.close();
              }

              const markAuthStage = stage =>
                writeFileSync('/tmp/commerce-browser/auth-stage.txt', stage + '\n');
              markAuthStage('auth:start');
              const authContext = await browser.newContext({ viewport: { width: 1440, height: 900 } });
              const authPage = await authContext.newPage();
              authPage.setDefaultTimeout(10000);
              authPage.setDefaultNavigationTimeout(15000);
              markAuthStage('auth:context-ready');
              let createdProduct = false;
              let createCalls = 0;
              let catalogReads = 0;
              let createdResolve;
              let refetchResolve;
              const createdRequest = new Promise(resolve => { createdResolve = resolve; });
              const refetchRequest = new Promise(resolve => { refetchResolve = resolve; });
              let catalog = { products: [], offers: [], menus: [], categories: [], items: [] };
              await authPage.route('**/api/dashboard/auth/session', route => fulfill(route, {
                authenticated: true, csrfToken: 'dashboard_csrf_0001',
                user: { id: 'owner-a', email: 'owner@example.test', role: 'owner', businessIds: ['business-a'] },
              }));
              await authPage.route('**/api/business/business-a/profile', route => fulfill(route, { profile: {
                id: 'business-a', name: 'Business A', categoryLabel: 'Experiências', specialty: 'Sunset',
                description: 'Experiências locais', cta: 'Ver empresa', locationLabel: 'Morro de São Paulo',
                locationIsExample: false, promotion: null, tutorial: false, excludeFromBusinessMetrics: false,
              } }));
              await authPage.route('**/api/business/business-a/catalog', route => {
                if (route.request().method() !== 'GET') return route.fallback();
                catalogReads += 1;
                if (createdProduct) refetchResolve?.(catalogReads);
                return fulfill(route, catalog);
              });
              await authPage.route('**/api/business/business-a/catalog/product', route => {
                if (route.request().method() !== 'POST') return route.fallback();
                if (route.request().headers()['x-csrf-token'] !== 'dashboard_csrf_0001') {
                  return fulfill(route, { error: 'INVALID_CSRF' }, 403);
                }
                createCalls += 1;
                const body = route.request().postDataJSON();
                const product = {
                  id: 'product_browser_0001',
                  businessId: 'business-a',
                  placeId: 'place-a',
                  destinationId: 'morro-de-sao-paulo',
                  name: body.name,
                  description: body.description ?? '',
                  tags: body.tags ?? [],
                  status: body.status ?? 'draft',
                };
                catalog = { ...catalog, products: [product] };
                createdProduct = true;
                createdResolve?.(product.id);
                return fulfill(route, { data: product }, 201);
              });
              await authPage.route('**/api/business/business-b/catalog', route =>
                fulfill(route, { error: 'NOT_FOUND' }, 404));
              await authPage.goto(`${origin}/apps/morro-digital-platform/public/business-dashboard.html?businessId=business-a`, { waitUntil: 'domcontentloaded', timeout: 15000 });
              await authPage.locator('#main-dashboard:not([hidden])').waitFor({ state: 'visible', timeout: 10000 });
              markAuthStage('auth:dashboard-ready');
              await authPage.locator('.sidebar-nav [data-dashboard-view="products"]').click();
              markAuthStage('auth:products-open');
              await authPage.locator('#morro-pro-product-form [name="name"]').fill('Passeio Volta à Ilha');
              await authPage.locator('#morro-pro-product-form [name="description"]').fill('Experiência canônica do Morro Pro');
              await authPage.locator('#morro-pro-product-form [name="status"]').selectOption('draft');
              await authPage.locator('#morro-pro-product-form').evaluate(form => {
                if (!(form instanceof HTMLFormElement)) throw new Error('Morro Pro product form missing');
                form.requestSubmit();
              });
              const timeout = label => new Promise((_, reject) =>
                setTimeout(() => reject(new Error(`Timed out waiting for ${label}`)), 10000));
              await Promise.race([createdRequest, timeout('canonical Catalog POST')]);
              markAuthStage('auth:catalog-posted');
              await Promise.race([refetchRequest, timeout('canonical Catalog refetch')]);
              markAuthStage('auth:catalog-refetched');
              if (!createdProduct || createCalls !== 1 || catalogReads < 2) {
                throw new Error(`Canonical Morro Pro product create/refetch mismatch: created=${createdProduct} calls=${createCalls} reads=${catalogReads}`);
              }
              markAuthStage('auth:server-scope-proof');
              evidence.push({
                authenticatedMorroProCatalog: true,
                createCalls,
                catalogReads,
                productId: catalog.products[0]?.id,
                tenantIsolation: 'business-api-catalog-invariant',
              });
              await bounded(authPage.close({ runBeforeUnload: false }), 'auth page close', 5000);
              await bounded(authContext.close(), 'auth context close', 5000);
              markAuthStage('auth:closed');

              const failContext = await browser.newContext({
                viewport: { width: 390, height: 844 },
                locale: 'pt-BR',
              });
              const failPage = await failContext.newPage();
              failPage.setDefaultTimeout(10000);
              failPage.setDefaultNavigationTimeout(15000);
              markAuthStage('failure-path:start');
              await commerceRoutes(failPage, { inventoryFailure: true });
              await failPage.goto(`${origin}/tickets.html`, { waitUntil: 'domcontentloaded', timeout: 15000 });
              await failPage.locator('#reservation-message').filter({ hasText: 'temporariamente indisponíveis' }).waitFor({ state: 'visible', timeout: 10000 });
              const friendlyFailure = await failPage.locator('#reservation-message').textContent();
              if (/TICKETING_|PAYMENTS_|HTTP_/u.test(friendlyFailure || '')) {
                throw new Error('Technical failure leaked into Ticketing UI: ' + friendlyFailure);
              }
              evidence.push({ predictableFailure: 'friendly-unavailable' });
              markAuthStage('failure-path:asserted');
              await bounded(failPage.close({ runBeforeUnload: false }), 'failure page close', 5000);
              await bounded(failContext.close(), 'failure context close', 5000);
              markAuthStage('failure-path:closed');

              writeFileSync('/tmp/commerce-browser/evidence.json', JSON.stringify(evidence, null, 2));
              markAuthStage('complete');
            } finally {
              await bounded(browser.close(), 'browser close', 5000);
            }
          })().catch(error => {
            writeFileSync('/tmp/commerce-browser/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/commerce-browser/failure.txt || true
          cat /tmp/commerce-browser/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: commerce-browser-evidence
          path: /tmp/commerce-browser
          retention-days: 7
          if-no-files-found: error
