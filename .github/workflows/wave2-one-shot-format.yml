name: Wave 2 One Shot Format

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/wave2-one-shot-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'wave/control-center-home-overview-v1-20260922'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Wave 2 files
        run: >
          pnpm exec prettier --write
          apps/control-center/public/control-center-home-overview-v1.js
          apps/morro-digital-platform/src/ux/control-center-home-overview-v1-contract.test.ts
          apps/morro-digital-platform/tooling/control-center-home-overview-v1-browser-contract.cjs
          apps/morro-digital-platform/tooling/control-center-home-overview-v1-model.test.mjs
      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          git add             apps/control-center/public/control-center-home-overview-v1.js             apps/morro-digital-platform/src/ux/control-center-home-overview-v1-contract.test.ts             apps/morro-digital-platform/tooling/control-center-home-overview-v1-browser-contract.cjs             apps/morro-digital-platform/tooling/control-center-home-overview-v1-model.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(control-center): format Home Wave 2"
          git push origin HEAD:wave/control-center-home-overview-v1-20260922
