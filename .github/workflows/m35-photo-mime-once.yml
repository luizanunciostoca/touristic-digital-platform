name: M35 Photo MIME Once

on:
  push:
    branches:
      - feat/assistant-m35-photo-assets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m35-photo-assets
      - name: Add JPEG MIME types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = path.read_text()
          old = '  ".json": "application/json; charset=utf-8",\n  ".map": "application/json; charset=utf-8",\n  ".png": "image/png",'
          new = '  ".json": "application/json; charset=utf-8",\n  ".map": "application/json; charset=utf-8",\n  ".jpg": "image/jpeg",\n  ".jpeg": "image/jpeg",\n  ".png": "image/png",'
          if old not in text:
              raise SystemExit('contentTypes insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit MIME support and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m35-photo-mime-once.yml
          git add apps/morro-digital-platform/tooling/dev-server.mjs
          git commit -m "fix(runtime): serve assistant photos as JPEG"
          git push origin HEAD:feat/assistant-m35-photo-assets
