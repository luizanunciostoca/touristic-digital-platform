name: Staging Payments Diagnostics E2E

on:
  push:
    branches:
      - ops/payments-diagnostics-e2e-cf2accb-20260824

permissions:
  contents: read

jobs:
  diagnostics-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_URL: https://morro-digital-v2-staging.onrender.com
      ACCEPTANCE_PASSWORD: ${{ secrets.STAGING_PAYMENTS_ACCEPTANCE_PASSWORD }}
      EXPECTED_RELEASE_SHA: cf2accb89ab8f0e316a0c4b9e13c783cdd776810
    steps:
      - name: Checkout operational harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run provider lifecycle on diagnostic candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/staging-payments-full-provider-e2e.yml').read_text()
          marker = "          node <<'NODE'"
          start = source.index(marker)
          end_marker = "\n          NODE"
          end = source.index(end_marker, start) + len(end_marker)
          block = source[start:end]
          block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          Path('/tmp/run-provider-e2e.sh').write_text(block + '\n')
          PY
          bash /tmp/run-provider-e2e.sh
