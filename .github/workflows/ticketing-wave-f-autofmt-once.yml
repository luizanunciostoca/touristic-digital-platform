name: Ticketing Wave F Autofmt Once

on:
  push:
    branches:
      - wave/ux-v2-ticketing-mobile-convergence-20260922

permissions:
  contents: write

concurrency:
  group: ticketing-wave-f-autofmt-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wave/ux-v2-ticketing-mobile-convergence-20260922
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Wave F files and remove this one-shot workflow
        shell: bash
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/public/ticketing.css             apps/morro-digital-platform/public/ticketing.js             apps/morro-digital-platform/public/tickets.html             apps/morro-digital-platform/src/runtime/commerce-i18n.ts             apps/morro-digital-platform/src/ux/ticketing-v2-contract.test.ts             services/ticketing/src/public-http-transport.ts
          git rm .github/workflows/ticketing-wave-f-autofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/morro-digital-platform/public/ticketing.css             apps/morro-digital-platform/public/ticketing.js             apps/morro-digital-platform/public/tickets.html             apps/morro-digital-platform/src/runtime/commerce-i18n.ts             apps/morro-digital-platform/src/ux/ticketing-v2-contract.test.ts             services/ticketing/src/public-http-transport.ts
          git commit -m "style(ticketing): apply canonical Prettier formatting"
          git push origin HEAD:wave/ux-v2-ticketing-mobile-convergence-20260922
