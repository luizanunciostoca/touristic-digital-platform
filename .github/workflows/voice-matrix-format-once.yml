name: Voice Matrix Format Once

on:
  push:
    branches:
      - test/assistant-voice-browser-pass
    paths:
      - .github/workflows/voice-matrix-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - run: |
          rm .github/workflows/voice-matrix-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md .github/workflows/voice-matrix-format-once.yml
          git commit -m "style(assistant): format migration matrix"
          git push origin HEAD:test/assistant-voice-browser-pass
