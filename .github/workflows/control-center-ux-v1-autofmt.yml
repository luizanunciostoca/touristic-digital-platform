name: Control Center UX V1 Autofmt

on:
  push:
    branches:
      - wave/control-center-ux-design-v1-final-20260921

permissions:
  contents: write

concurrency:
  group: control-center-ux-v1-autofmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wave/control-center-ux-design-v1-final-20260921
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format UX V1 changed files
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-ux-v1.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/control-center/UX-DESIGN-V1.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center-ux-v1.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/control-center/UX-DESIGN-V1.md
          git commit -m "style(control-center): format UX Design V1 implementation"
          git push origin HEAD:wave/control-center-ux-design-v1-final-20260921
