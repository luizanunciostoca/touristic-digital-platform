name: PR93 Format Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/pr93-format-artifact.yml"
      - ".github/workflows/commerce-browser-regression.yml"
      - "apps/morro-digital-platform/public/commerce.css"
      - "apps/morro-digital-platform/public/ticketing.js"
      - "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts"
      - "apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts"
      - "apps/morro-digital-platform/src/map/explore-location-actions-v1.ts"
      - "apps/morro-digital-platform/src/map/place-commerce-capability.ts"
      - "apps/morro-digital-platform/tooling/ticketing-api.mjs"
      - "services/crm/src/mysql-commerce-customer-repository.ts"
      - "services/ticketing/src/commerce-crm-outbox.ts"

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed implementation files
        run: |
          pnpm exec prettier --write             .github/workflows/commerce-browser-regression.yml             apps/morro-digital-platform/public/commerce.css             apps/morro-digital-platform/public/ticketing.js             apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts             apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts             apps/morro-digital-platform/src/map/explore-location-actions-v1.ts             apps/morro-digital-platform/src/map/place-commerce-capability.ts             apps/morro-digital-platform/tooling/ticketing-api.mjs             services/crm/src/mysql-commerce-customer-repository.ts             services/ticketing/src/commerce-crm-outbox.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr93-formatted-files
          path: |
            .github/workflows/commerce-browser-regression.yml
            apps/morro-digital-platform/public/commerce.css
            apps/morro-digital-platform/public/ticketing.js
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
            apps/morro-digital-platform/src/map/place-commerce-capability.ts
            apps/morro-digital-platform/tooling/ticketing-api.mjs
            services/crm/src/mysql-commerce-customer-repository.ts
            services/ticketing/src/commerce-crm-outbox.ts
          retention-days: 1
          if-no-files-found: error
