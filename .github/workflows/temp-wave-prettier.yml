name: Temporary Wave Prettier
# one-shot trigger

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - wave/business-catalog-offers-menus-20260923

permissions:
  contents: write

concurrency:
  group: temp-wave-prettier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            docs/architecture/BUSINESS-COMMERCE-CATALOG-CONTRACTS.md \
            packages/business/src/commerce-domain.test.ts \
            packages/business/src/commerce-domain.ts
      - name: Commit formatter delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/BUSINESS-COMMERCE-CATALOG-CONTRACTS.md \
            packages/business/src/commerce-domain.test.ts \
            packages/business/src/commerce-domain.ts
          if git diff --cached --quiet; then
            echo "No formatter delta."
            exit 0
          fi
          git commit -m "chore: apply canonical Prettier formatting"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
