name: Temporary Wave Prettier

on:
  workflow_dispatch:
  push:
    branches:
      - wave/control-center-business-cms-20260923

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-business-cms.js
      - name: Commit formatter delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/control-center/public/control-center-business-cms.js"
          if git diff --cached --quiet; then
            echo "No formatter delta."
            exit 0
          fi
          git commit -m "chore: apply canonical Prettier formatting"
          git push origin HEAD:${{ github.ref_name }}
