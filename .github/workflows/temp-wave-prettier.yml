name: Temporary Wave Prettier

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - wave/map-place-presentation-v2-20260923

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/map/public-place-map-client-v2.ts \
            apps/morro-digital-platform/src/map/public-place-presentation-v2.ts \
            docs/architecture/PUBLIC-PLACE-PROJECTION-WAVE-G.md \
            packages/business/src/index.ts \
            packages/business/src/place-domain.ts \
            packages/business/src/public-place-projection.test.ts \
            packages/business/src/public-place-projection.ts
      - name: Commit formatter delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/morro-digital-platform/src/map/public-place-map-client-v2.ts" "apps/morro-digital-platform/src/map/public-place-presentation-v2.ts" "docs/architecture/PUBLIC-PLACE-PROJECTION-WAVE-G.md" "packages/business/src/index.ts" "packages/business/src/place-domain.ts" "packages/business/src/public-place-projection.test.ts" "packages/business/src/public-place-projection.ts"
          if git diff --cached --quiet; then
            echo "No formatter delta."
            exit 0
          fi
          git commit -m "chore: apply canonical Prettier formatting"
          git push origin HEAD:${{ github.ref_name }}
