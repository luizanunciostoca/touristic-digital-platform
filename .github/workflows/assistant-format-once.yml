name: Assistant formatter one-shot

on:
  push:
    branches:
      - fix/assistant-v1-runtime-intelligence-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-runtime-intelligence-completion
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format assistant completion files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/main.ts \
            packages/assistant/src/dialog-controller.ts \
            packages/assistant/src/navigation-handlers.ts \
            packages/assistant/src/navigation-handlers.test.ts \
            packages/assistant/src/navigation-confirmation-controller.test.ts

      - name: Remove one-shot workflow and commit formatter output
        run: |
          rm .github/workflows/assistant-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(assistant): normalize runtime completion"
          git push origin HEAD:fix/assistant-v1-runtime-intelligence-completion
