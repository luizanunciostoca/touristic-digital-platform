name: Temporary Place Runtime Formatter

on:
  push:
    branches:
      - fix/place-runtime-persistence-integration-20260924

permissions:
  contents: write

concurrency:
  group: temporary-place-runtime-formatter
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style(place): apply canonical formatting') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/place-runtime-persistence-integration-20260924
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.test.mjs
      - name: Commit formatted files when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.test.mjs
          git commit -m "style(place): apply canonical formatting"
          git push origin HEAD:fix/place-runtime-persistence-integration-20260924
