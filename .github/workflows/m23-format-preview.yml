name: M23 Format Preview

on:
  push:
    branches:
      - feat/assistant-m23-nearby

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.test.ts
          git diff -- \
            apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.test.ts
