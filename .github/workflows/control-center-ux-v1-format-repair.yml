name: Control Center UX V1 Format Repair

on:
  pull_request:
    paths:
      - ".github/workflows/control-center-ux-v1-format-repair.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "docs/control-center/**"

permissions:
  contents: write

concurrency:
  group: control-center-ux-v1-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-ux-v1.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/control-center/UX-DESIGN-V1.md
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            echo "Formatting already canonical."
            exit 0
          fi
          git config user.name "morro-digital-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center-ux-v1.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/control-center/UX-DESIGN-V1.md
          git commit -m "style(control-center): apply canonical Prettier output"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
