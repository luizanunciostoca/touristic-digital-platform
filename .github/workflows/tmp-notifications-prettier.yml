name: One-shot Notifications Prettier

on:
  push:
    branches:
      - fix/notifications-durable-outbox-20260927

permissions:
  contents: write

concurrency:
  group: one-shot-notifications-prettier
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            services/notifications/src/mysql-notification-outbox.ts \
            services/notifications/src/outbox-scheduler.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet --             services/notifications/src/mysql-notification-outbox.ts             services/notifications/src/outbox-scheduler.ts; then
            echo "No formatter delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             services/notifications/src/mysql-notification-outbox.ts             services/notifications/src/outbox-scheduler.ts
          git commit -m "style(notifications): apply canonical prettier"
          git push origin HEAD:fix/notifications-durable-outbox-20260927
