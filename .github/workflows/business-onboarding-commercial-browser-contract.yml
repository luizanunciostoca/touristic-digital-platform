name: Business Onboarding Commercial Browser Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/business-onboarding-commercial-browser-contract.yml"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-onboarding-*.ts"
      - "apps/morro-digital-platform/public/business-onboarding.*"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "apps/morro-digital-platform/tooling/business-onboarding-runtime.ts"
      - "apps/morro-digital-platform/tooling/business-onboarding-surface.ts"
      - "packages/business/src/onboarding-commercial*.ts"
      - "packages/business/src/onboarding-context*.ts"
      - "packages/business/package.json"
      - ".github/scripts/onboarding-commercial-browser-contract.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/business-onboarding-commercial-browser-contract.yml"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-onboarding-*.ts"
      - "apps/morro-digital-platform/public/business-onboarding.*"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "apps/morro-digital-platform/tooling/business-onboarding-runtime.ts"
      - "apps/morro-digital-platform/tooling/business-onboarding-surface.ts"
      - "packages/business/src/onboarding-commercial*.ts"
      - "packages/business/src/onboarding-context*.ts"
      - "packages/business/package.json"
      - ".github/scripts/onboarding-commercial-browser-contract.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  onboarding-commercial-browser:
    name: onboarding-commercial-browser / repeat ${{ matrix.repeat }}
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start deterministic module origin
        run: |
          PORT=4185 HOST=127.0.0.1 node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/m62-commercial-server.log 2>&1 &
          echo $! >/tmp/m62-commercial-server.pid
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4185/runtime-config.js >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/m62-commercial-server.log
          exit 1
      - name: Validate Business-to-Payments browser lifecycle (repeat ${{ matrix.repeat }}/5)
        env:
          M62_REPEAT: ${{ matrix.repeat }}
          M62_EVIDENCE_PATH: /tmp/m62-commercial-evidence.json
          PLAYWRIGHT_MODULE_PATH: /tmp/pw/node_modules/playwright
        run: node .github/scripts/onboarding-commercial-browser-contract.mjs
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/m62-commercial-server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: business-onboarding-commercial-browser-evidence-${{ matrix.repeat }}
          path: /tmp/m62-commercial-evidence.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Stop runtime
        if: always()
        run: kill "$(cat /tmp/m62-commercial-server.pid)" 2>/dev/null || true
