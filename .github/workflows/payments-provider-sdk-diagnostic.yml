name: Payments Provider SDK Diagnostic

on:
  push:
    branches: [ops/payments-provider-test-acceptance-20260824]

permissions:
  contents: read
  statuses: write

env:
  STAGING_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_SHA: cf20f97b7180b8d7d893716cd7528f070f3f07cc

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Diagnose public runtime and SDK bootstrap
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const base = process.env.STAGING_URL;
          const expectedSha = process.env.EXPECTED_SHA;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const failures = [];
              page.on('requestfailed', request => {
                const url = request.url();
                if (url.includes('mercadopago')) failures.push({ origin: new URL(url).origin, error: request.failure()?.errorText || 'request_failed' });
              });
              const ready = await page.request.get(`${base}/readyz`);
              if (!ready.ok() || ready.headers()['x-release-sha'] !== expectedSha) throw new Error('release-not-ready');
              await page.goto(`${base}/business-onboarding.html`, { waitUntil: 'domcontentloaded' });
              const result = await page.evaluate(async () => {
                const raw = String(window.__MORRO_RUNTIME_ENV__?.VITE_MERCADO_PAGO_PUBLIC_KEY || '').trim();
                const key = { present: raw.length > 0, length: raw.length, prefix: raw.startsWith('TEST-') ? 'TEST' : raw.startsWith('APP_USR-') ? 'APP_USR' : raw ? 'OTHER' : 'NONE' };
                try {
                  const module = await import('/apps/morro-digital-platform/dist/mercado-pago-card-payment-brick.js');
                  const brick = module.createMercadoPagoCardPaymentBrick(window, document, window.fetch.bind(window));
                  if (!brick.available) return { key, available: false, overlay: false, error: 'PAYMENTS_BRICK_NOT_CONFIGURED' };
                  window.__MORRO_SDK_DIAG__ = { error: null };
                  brick.present({
                    checkoutId: 'ord_provider_sdk_diag_12345678',
                    statusToken: 'cst_v1_provider_sdk_diag_12345678',
                    plan: { amount: { minorUnits: 1000, currency: 'BRL' } },
                    payerEmail: 'morro-provider-test@example.com'
                  }).catch(error => { window.__MORRO_SDK_DIAG__.error = String(error?.message || error); });
                  const deadline = Date.now() + 18000;
                  while (Date.now() < deadline) {
                    const overlay = Boolean(document.querySelector('[data-morro-payments-brick="card"]'));
                    const error = window.__MORRO_SDK_DIAG__.error;
                    if (overlay || error) return { key, available: true, overlay, error };
                    await new Promise(resolve => setTimeout(resolve, 100));
                  }
                  return { key, available: true, overlay: false, error: 'SDK_DIAGNOSTIC_TIMEOUT' };
                } catch (error) {
                  return { key, available: null, overlay: false, error: String(error?.message || error) };
                }
              });
              const safe = { ...result, requestFailures: failures };
              console.log(JSON.stringify(safe));
              if (!safe.key.present || safe.key.prefix === 'OTHER' || !safe.available || !safe.overlay || safe.error) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(JSON.stringify({ status: 'FAIL', error: String(error?.message || error) })); process.exit(1); });
          NODE
      - name: Publish diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Brick SDK diagnostic passed'; else state=failure; description='Brick SDK diagnostic failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='Payments Provider SDK Diagnostic' -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
