name: M136 Tracker Once

on:
  push:
    branches:
      - feat/payments-m136-domain-vocabulary

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m136-domain-vocabulary
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/m136-reconcile-tracker.mjs
      - run: pnpm exec prettier --write docs/migration/MASTER-MIGRATION-TRACKER.md
      - name: Commit reconciled tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m "docs(payments): reconcile M136 master tracker"
          git push
