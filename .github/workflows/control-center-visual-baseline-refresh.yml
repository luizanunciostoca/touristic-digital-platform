name: Control Center Visual Baseline Refresh

on:
  push:
    branches:
      - wave/control-center-final-integration-20260921
    paths:
      - ".github/workflows/control-center-visual-baseline-refresh.yml"

permissions:
  contents: write

concurrency:
  group: control-center-visual-baseline-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install deterministic visual toolchain
        run: |
          npm install --prefix /tmp/cc-visual --no-save \
            playwright@1.54.2 \
            pixelmatch@5.3.0 \
            pngjs@7.0.0 \
            @fontsource/inter@5.2.5
          /tmp/cc-visual/node_modules/.bin/playwright install --with-deps chromium

      - name: Build Control Center runtime graph
        run: pnpm -w build

      - name: Start authenticated Control Center runtime
        shell: bash
        run: |
          set -euo pipefail
          PORT=4194
          AUTH_SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="control center visual regression fixture"
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 31))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"platform-owner-visual",email:"platform-owner@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}]))' "$OWNER_HASH")
          DASHBOARD_AUTH_SECRET="$AUTH_SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          PORT="$PORT" \
          HOST="127.0.0.1" \
          node apps/morro-digital-platform/tooling/dev-server.mjs \
            >/tmp/control-center-visual-refresh-server.log 2>&1 &
          echo $! >/tmp/control-center-visual-refresh-server.pid
          for _ in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:$PORT/apps/control-center/public/index.html" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/control-center-visual-refresh-server.log
          exit 1

      - name: Refresh reviewed deterministic baselines
        env:
          CONTROL_CENTER_VISUAL_PASSWORD: control center visual regression fixture
          CONTROL_CENTER_VISUAL_SOURCE_SHA: ${{ github.sha }}
        run: node apps/morro-digital-platform/tooling/control-center-visual-regression.mjs --update

      - name: Commit refreshed baselines and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/control-center-visual-baseline-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-regression/control-center/baselines .github/workflows/control-center-visual-baseline-refresh.yml
          git diff --cached --quiet && {
            echo "Expected reviewed baseline changes, but none were generated." >&2
            exit 1
          }
          git commit -m "test(control-center): refresh reviewed final visual baselines"
          git push origin "HEAD:wave/control-center-final-integration-20260921"

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-visual-baseline-refresh-report
          path: /tmp/control-center-visual-regression/report.json
          retention-days: 14
          if-no-files-found: error

      - name: Stop Control Center runtime
        if: always()
        run: kill "$(cat /tmp/control-center-visual-refresh-server.pid)" 2>/dev/null || true
