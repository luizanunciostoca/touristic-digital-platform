name: Temporary Payments M149 Workflow Formatter

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/payments-m149-docs-reconcile-once.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render canonical workflow
        run: |
          pnpm exec prettier --write .github/workflows/payments-browser-checkout-contract.yml
          pnpm exec prettier --check .github/workflows/payments-browser-checkout-contract.yml
          echo "M149_FORMATTED_WORKFLOW_BASE64_BEGIN"
          base64 -w0 .github/workflows/payments-browser-checkout-contract.yml
          echo
          echo "M149_FORMATTED_WORKFLOW_BASE64_END"
