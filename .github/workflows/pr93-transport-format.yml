name: PR93 Transport Format

on:
  pull_request:
    paths:
      - ".github/workflows/pr93-transport-format.yml"
      - ".github/workflows/commerce-browser-regression.yml"
      - "packages/ticketing/src/index.ts"
      - "packages/ticketing/src/reservations.test.ts"
      - "services/ticketing/src/schema.ts"
      - "services/ticketing/src/reservation-schema.ts"
      - "services/ticketing/src/business-inventory-repository.ts"
      - "services/ticketing/src/index.ts"
      - "services/ticketing/src/transport-product-kind-schema.ts"
      - "services/ticketing/src/transport-product-kind-schema.test.ts"
      - "apps/morro-digital-platform/public/experience.js"
      - "apps/morro-digital-platform/src/business-dashboard-client.ts"
      - "apps/morro-digital-platform/src/business-dashboard-surface.ts"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format transport commerce changes
        run: |
          pnpm exec prettier --write             packages/ticketing/src/index.ts             packages/ticketing/src/reservations.test.ts             services/ticketing/src/schema.ts             services/ticketing/src/reservation-schema.ts             services/ticketing/src/business-inventory-repository.ts             services/ticketing/src/index.ts             services/ticketing/src/transport-product-kind-schema.ts             services/ticketing/src/transport-product-kind-schema.test.ts             apps/morro-digital-platform/src/business-dashboard-client.ts             apps/morro-digital-platform/src/business-dashboard-surface.ts \
            apps/morro-digital-platform/tooling/crm-api.mjs
      - name: Commit formatting to PR branch
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add --             packages/ticketing/src/index.ts             packages/ticketing/src/reservations.test.ts             services/ticketing/src/schema.ts             services/ticketing/src/reservation-schema.ts             services/ticketing/src/business-inventory-repository.ts             services/ticketing/src/index.ts             services/ticketing/src/transport-product-kind-schema.ts             services/ticketing/src/transport-product-kind-schema.test.ts             apps/morro-digital-platform/src/business-dashboard-client.ts             apps/morro-digital-platform/src/business-dashboard-surface.ts \
            apps/morro-digital-platform/tooling/crm-api.mjs
          if git diff --cached --quiet; then
            echo "Formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format transport commerce support"
          git push origin "HEAD:${PR_HEAD_REF}"
