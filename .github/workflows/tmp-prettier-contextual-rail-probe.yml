name: Temporary Prettier Contextual Rail Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts"
      - "apps/morro-digital-platform/src/map/explore-locations-control.ts"
      - "apps/morro-digital-platform/src/ux/unified-assistant-category-rail.test.ts"
      - ".github/workflows/tmp-prettier-contextual-rail-probe.yml"

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier patch
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/ux/unified-assistant-category-rail.test.ts
          git diff -- \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/ux/unified-assistant-category-rail.test.ts
