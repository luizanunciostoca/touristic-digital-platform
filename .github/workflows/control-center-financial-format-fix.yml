name: Control Center Financial Format Fix

on:
  push:
    branches:
      - wave/control-center-financial-admin-20260920

permissions:
  contents: write

concurrency:
  group: control-center-financial-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/features/registry.json
      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/features/registry.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            docs/control-center/IMPLEMENTATION.md \
            docs/features/registry.json
          git commit -m "style(control-center): apply canonical financial formatting"
          git push origin HEAD:wave/control-center-financial-admin-20260920
