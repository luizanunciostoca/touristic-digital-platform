name: Temporary Unified Dock Final Format

on:
  push:
    branches:
      - wave/ux-v2-unified-assistant-dock-convergence-20260922
    paths:
      - .github/workflows/temporary-unified-dock-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/ux-v2-unified-assistant-dock-convergence-20260922
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final unified dock files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/tooling/wave-g-webkit-safari-smoke.mjs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/tooling/wave-g-webkit-safari-smoke.mjs
          git commit -m "style(ux): format final unified dock changes"
          git push origin HEAD:wave/ux-v2-unified-assistant-dock-convergence-20260922
