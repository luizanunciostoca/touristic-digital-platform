name: Payments Subscription Recurrence Contract

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-payments-subscription-recurrence-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recurrence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m153-recurrence
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm153-recurrence"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m153-recurrence@127.0.0.1:3306/mysql
      ORDERING_DATABASE_URL: mysql://root:m153-recurrence@127.0.0.1:3306/ordering_m137_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
      - name: Build Financial package dependency
        id: ci_command_01
        run: pnpm --filter @touristic/financial build
      - name: Ordering recurrence domain and application contracts
        id: ci_command_02
        run: pnpm --filter @touristic/ordering test
      - name: Ordering durable Subscription persistence
        id: ci_command_03
        run: pnpm --filter @touristic/ordering-server test:integration
      - name: Build server runtime entrypoints
        id: ci_command_04
        run: |
          pnpm --filter @touristic/core build
          pnpm --filter @touristic/financial-server build
          pnpm --filter @touristic/ordering-server build
      - name: Payments server authority bootstrap
        id: ci_command_05
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run tooling/payments-authority-bootstrap.test.mjs
      - name: Payments browser authority bootstrap
        id: ci_command_06
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run src/payments-browser-authority-bootstrap.test.ts

      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["payments-subscription-recurrence-contract.yml"]'), 'payments-subscription-recurrence-contract.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["payments-subscription-recurrence-contract.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt payments-subscription-recurrence-contract.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-payments-subscription-recurrence-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
