name: M48 Bootstrap Auth Server Once

on:
  push:
    branches:
      - feat/auth-m48-server-browser-integration
    paths:
      - .github/workflows/m48-bootstrap-auth-server-once.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-m48-server-browser-integration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - name: Format and validate auth server service
        run: |
          pnpm exec prettier --write services/auth/package.json services/auth/tsconfig.json services/auth/src/index.ts services/auth/src/index.test.ts pnpm-lock.yaml
          pnpm --filter @touristic/auth-server lint
          pnpm --filter @touristic/auth-server typecheck
          pnpm --filter @touristic/auth-server test
          pnpm --filter @touristic/auth-server build
      - name: Commit service bootstrap and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m48-bootstrap-auth-server-once.yml
          git add services/auth pnpm-lock.yaml
          git commit -m "chore(auth): validate M48 auth server service"
          git push origin HEAD:feat/auth-m48-server-browser-integration
