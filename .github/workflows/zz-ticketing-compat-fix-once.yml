# retry on serialized branch head
name: Ticketing M139 M153 Compatibility Fix Once

on:
  push:
    branches:
      - fix/ticketing-feature-0011-current-main
    paths:
      - ".github/workflows/zz-ticketing-compat-fix-once.yml"
      - ".github/scripts/zz_ticketing_compat_fix_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-compatibility-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticketing-feature-0011-current-main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded compatibility patch
        run: python3 .github/scripts/zz_ticketing_compat_fix_once.py
      - name: Format touched files
        run: pnpm exec prettier --write services/ordering/src/checkout-http-transport.ts services/ordering/src/ticketing-order-binding-mysql-integration.test.ts
      - name: Run focused ordering contracts
        run: pnpm --filter @touristic/ordering-server test
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No compatibility changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ordering/src/checkout-http-transport.ts services/ordering/src/ticketing-order-binding-mysql-integration.test.ts
          git commit -m "fix(ticketing): preserve M139 audit and M153 FK contracts"
          git push origin HEAD:fix/ticketing-feature-0011-current-main
