name: M32 Domain I18n Wire Once

on:
  push:
    branches: [feat/assistant-m32-domain-i18n]
    paths: [.github/workflows/m32-domain-i18n-wire-once.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m32-domain-i18n
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Wire localized domain handlers and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts')
          s = p.read_text()
          insert = '''import {\n  askPlaceCopy,\n  favoritesCopy,\n  formatPlaceDetailsCopy,\n  helpResponse,\n  hoursCopy,\n  locationCopy,\n  moreInfoUnavailable,\n  photosCopy,\n  placeDetailsOptions,\n  priceCopy,\n  type AssistantDomainLanguage,\n} from "./assistant-domain-copy.js";\n'''
          anchor = 'import { resolveAssistantNearby } from "./assistant-nearby-adapter.js";\n'
          if insert not in s:
              s = s.replace(anchor, anchor + insert)

          start = s.index('const PLACE_DETAILS_OPTIONS = [')
          end = s.index('async function getWeather(')
          s = s[:start] + s[end:]

          start = s.index('function getCurrentLocation(')
          end = s.index('async function getPhotos(')
          s = s[:start] + '''function getCurrentLocation(\n  language: AssistantDomainLanguage,\n  geolocation?: AssistantGeolocationPort,\n): Promise<AssistantDialogResponse> {\n  const copy = locationCopy(language);\n  if (!geolocation) {\n    return Promise.resolve({\n      text: copy.unavailable,\n      metadata: { domain: "my_location", state: "unavailable", language },\n    });\n  }\n\n  return new Promise((resolve) => {\n    geolocation.getCurrentPosition(\n      (position) => {\n        resolve({\n          text: copy.resolved,\n          metadata: {\n            domain: "my_location",\n            state: "resolved",\n            language,\n            location: {\n              lat: position.coords.latitude,\n              lon: position.coords.longitude,\n              accuracy: position.coords.accuracy,\n            },\n          },\n        });\n      },\n      () => {\n        resolve({\n          text: copy.failed,\n          metadata: { domain: "my_location", state: "denied_or_failed", language },\n        });\n      },\n      { enableHighAccuracy: true, maximumAge: 15_000, timeout: 10_000 },\n    );\n  });\n}\n\n''' + s[end:]

          start = s.index('async function getPhotos(')
          end = s.index('function formatPlaceDetails(')
          s = s[:start] + '''async function getPhotos(\n  place: string,\n  language: AssistantDomainLanguage,\n  fetchImplementation: typeof globalThis.fetch,\n): Promise<AssistantDialogResponse> {\n  const photoSet = resolveAssistantV1Photos(place);\n  if (!photoSet) {\n    return {\n      text: photosCopy(language, "unavailable", place),\n      metadata: { domain: "photos", state: "unavailable", place, language },\n    };\n  }\n\n  const firstImage = photoSet.images[0];\n  if (!firstImage) {\n    return {\n      text: photosCopy(language, "unavailable", photoSet.place),\n      metadata: {\n        domain: "photos",\n        state: "unavailable",\n        place: photoSet.place,\n        language,\n      },\n    };\n  }\n\n  try {\n    const probe = await fetchImplementation(firstImage, { method: "HEAD" });\n    if (!probe.ok) throw new Error("photo_asset_unavailable");\n  } catch {\n    return {\n      text: photosCopy(language, "asset_source_pending", photoSet.place),\n      metadata: {\n        domain: "photos",\n        state: "asset_source_pending",\n        place: photoSet.place,\n        language,\n        images: [...photoSet.images],\n      },\n    };\n  }\n\n  return {\n    text: photosCopy(language, "resolved", photoSet.place, photoSet.images.length),\n    metadata: {\n      domain: "photos",\n      state: "resolved",\n      place: photoSet.place,\n      language,\n      images: [...photoSet.images],\n      presentation: "carousel",\n    },\n  };\n}\n\n''' + s[end:]

          start = s.index('function formatPlaceDetails(')
          end = s.index('async function getPlaceDetails(')
          s = s[:start] + s[end:]

          start = s.index('async function getPlaceDetails(')
          end = s.index('async function getPlaceHours(')
          s = s[:start] + '''async function getPlaceDetails(\n  place: string,\n  language: AssistantDomainLanguage,\n  options: AssistantBrowserDomainAdapterOptions,\n): Promise<AssistantDialogResponse> {\n  const details = await fetchAssistantPlaceDetails(place, {\n    ...(options.mapboxAccessToken\n      ? { accessToken: options.mapboxAccessToken }\n      : {}),\n    ...(options.fetch ? { fetch: options.fetch } : {}),\n  });\n  if (!details) {\n    return {\n      text: moreInfoUnavailable(language, place),\n      options: [...placeDetailsOptions(language)],\n      metadata: { domain: "more_info", state: "unavailable", place, language },\n    };\n  }\n\n  return {\n    text: formatPlaceDetailsCopy(language, details),\n    options: [...placeDetailsOptions(language)],\n    metadata: {\n      domain: "more_info",\n      state: "resolved",\n      place: details.name,\n      language,\n      details,\n    },\n  };\n}\n\n''' + s[end:]

          start = s.index('async function getPlaceHours(')
          end = s.index('export function createAssistantBrowserDomainHandlers(')
          s = s[:start] + '''async function getPlaceHours(\n  place: string,\n  language: AssistantDomainLanguage,\n  options: AssistantBrowserDomainAdapterOptions,\n): Promise<AssistantDialogResponse> {\n  const details = await fetchAssistantPlaceDetails(place, {\n    ...(options.mapboxAccessToken\n      ? { accessToken: options.mapboxAccessToken }\n      : {}),\n    ...(options.fetch ? { fetch: options.fetch } : {}),\n  });\n  if (!details || details.openNow === null) {\n    return {\n      text: hoursCopy(language, place, null),\n      metadata: { domain: "hours", state: "unavailable", place, language },\n    };\n  }\n\n  return {\n    text: hoursCopy(language, details.name, details.openNow),\n    options: [...placeDetailsOptions(language)],\n    metadata: {\n      domain: "hours",\n      state: "resolved",\n      place: details.name,\n      language,\n      openNow: details.openNow,\n    },\n  };\n}\n\n''' + s[end:]

          old_ports = '''      myLocation: () => getCurrentLocation(options.geolocation),\n      photos: (place) => getPhotos(place, fetchImplementation),\n      price: (place) => ({\n        text:\n          `💰 Sobre preços em <b>${place}</b>:<br><br>` +\n          `As informações de preço podem variar. Recomendo verificar diretamente com o estabelecimento.<br><br>` +\n          `Em geral, as praias de Morro de São Paulo são <b>gratuitas</b>. Passeios de barco custam em torno de <b>R$ 80-150</b> por pessoa. Restaurantes variam de <b>R$ 30-150</b> por pessoa.`,\n        options: [...PLACE_DETAILS_OPTIONS],\n        metadata: { domain: "price", state: "v1_guidance", place },\n      }),\n      hours: (place) => getPlaceHours(place, options),\n      moreInfo: (place) => getPlaceDetails(place, options),\n      nearby: (request) => resolveAssistantNearby(request, options.geolocation),\n      favorites: () => {\n        const favorites = profile.getFavoritePlaces();\n        if (favorites.length === 0) {\n          return {\n            text: "Você ainda não adicionou lugares aos favoritos.",\n            metadata: { domain: "favorites", count: 0 },\n          };\n        }\n        return {\n          text: `Seus favoritos: ${favorites.map((place) => place.name).join(", ")}.`,\n          options: favorites.map((place) => ({\n            label: place.name,\n            value: place.name,\n          })),\n          metadata: { domain: "favorites", count: favorites.length },\n        };\n      },\n      help: () => ({\n        text: "Posso ajudar com praias, restaurantes, pousadas, atrações, passeios, vida noturna, localização, favoritos e rotas.",\n        options: [\n          { label: "Praias", value: "praias" },\n          { label: "Restaurantes", value: "restaurantes" },\n          { label: "Pousadas", value: "pousadas" },\n          { label: "Atrações", value: "atrações" },\n        ],\n        metadata: { domain: "help" },\n      }),'''
          new_ports = '''      myLocation: (request) =>\n        getCurrentLocation(request.intent.entities.language ?? "pt", options.geolocation),\n      photos: (place, request) =>\n        getPhotos(place, request.intent.entities.language ?? "pt", fetchImplementation),\n      price: (place, request) => {\n        const language = request.intent.entities.language ?? "pt";\n        return {\n          text: priceCopy(language, place),\n          options: [...placeDetailsOptions(language)],\n          metadata: { domain: "price", state: "v1_guidance", place, language },\n        };\n      },\n      hours: (place, request) =>\n        getPlaceHours(place, request.intent.entities.language ?? "pt", options),\n      moreInfo: (place, request) =>\n        getPlaceDetails(place, request.intent.entities.language ?? "pt", options),\n      nearby: (request) => resolveAssistantNearby(request, options.geolocation),\n      favorites: (request) => {\n        const language = request.intent.entities.language ?? "pt";\n        const favorites = profile.getFavoritePlaces();\n        return {\n          text: favoritesCopy(language, favorites.map((place) => place.name)),\n          ...(favorites.length > 0\n            ? {\n                options: favorites.map((place) => ({\n                  label: place.name,\n                  value: place.name,\n                })),\n              }\n            : {}),\n          metadata: { domain: "favorites", count: favorites.length, language },\n        };\n      },\n      help: (request) => {\n        const language = request.intent.entities.language ?? "pt";\n        const copy = helpResponse(language);\n        return {\n          text: copy.text,\n          options: [...copy.options],\n          metadata: { domain: "help", language },\n        };\n      },'''
          if old_ports not in s:
              raise SystemExit('domain ports block not found')
          s = s.replace(old_ports, new_ports, 1)

          marker = '  return createAssistantDomainHandlers({\n    ports: {'
          replacement = '''  return createAssistantDomainHandlers({\n    copy: {\n      askPlace: (intent, request) => {\n        const language = request.intent.entities.language ?? "pt";\n        return {\n          text: askPlaceCopy(language, intent),\n          metadata: { domain: intent, state: "awaiting_place", language },\n        };\n      },\n    },\n    ports: {'''
          if marker not in s:
              raise SystemExit('domain handler creation marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('packages/assistant/src/domain-handlers.test.ts')
          s = p.read_text()
          s = s.replace(
            '        askPlace: (intent) => ({ text: `ask:${intent}` }),',
            '        askPlace: (intent, request) => ({ text: `ask:${intent}:${request.input}` }),',
          )
          s = s.replace(
            '      text: "ask:hours",',
            '      text: "ask:hours:hours",',
          )
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.ts apps/morro-digital-platform/src/assistant/assistant-domain-copy.ts apps/morro-digital-platform/src/assistant/assistant-domain-copy.test.ts packages/assistant/src/domain-handlers.ts packages/assistant/src/domain-handlers.test.ts
          pnpm format:check
          pnpm architecture:check
          pnpm typecheck
          pnpm test
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m32-domain-i18n-wire-once.yml
          git add apps/morro-digital-platform/src/assistant packages/assistant/src/domain-handlers.ts packages/assistant/src/domain-handlers.test.ts
          git commit -m "feat(assistant): wire M32 domain handlers i18n"
          git push
