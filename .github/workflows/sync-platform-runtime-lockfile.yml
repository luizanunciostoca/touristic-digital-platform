name: Sync Platform Runtime Lockfile

on:
  push:
    branches: [feat/platform-runtime-m1]
    paths:
      - apps/morro-digital-platform/package.json
      - packages/platform-runtime/package.json
      - .github/workflows/sync-platform-runtime-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-runtime-m1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize Platform Runtime lockfile"
          git push origin HEAD:feat/platform-runtime-m1
