name: Temporary Payments M149 Contract Patch

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/payments-m149-contract-patch-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply source and unit contract patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.ts')
          source = source_path.read_text()

          anchor = '''export interface PaymentsBrowserCheckoutFailure {'''
          addition = '''export interface PaymentsBrowserVerifiedFailure {
            readonly verified: true;
            readonly sessionId: string;
            readonly reason: string;
            readonly resultId: string;
          }

          '''
          if 'export interface PaymentsBrowserVerifiedFailure' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('failure interface insertion anchor mismatch')
              source = source.replace(anchor, addition + anchor, 1)

          source, count = re.subn(
              r'(interface CheckoutStatusProjection \{\n(?:.*\n)*?  readonly verifiedPayment: PaymentsBrowserVerifiedPayment \| null;\n)(\})',
              r'\1  readonly verifiedFailure: PaymentsBrowserVerifiedFailure | null;\n\2',
              source,
              count=1,
          )
          if count != 1 and 'readonly verifiedFailure: PaymentsBrowserVerifiedFailure | null;' not in source:
              raise SystemExit('status projection interface patch mismatch')

          if 'function verifiedFailure(' not in source:
              marker = 'function statusProjection(value: unknown): CheckoutStatusProjection | null {'
              helper = '''function verifiedFailure(
            value: unknown,
          ): PaymentsBrowserVerifiedFailure | null {
            const data = record(value);
            if (!data || data.verified !== true) return null;
            const sessionId = text(data.sessionId, 120);
            const reason = text(data.reason, 80);
            const resultId = text(data.resultId, 160);
            if (!sessionId || !reason || !resultId) return null;
            return Object.freeze({ verified: true, sessionId, reason, resultId });
          }

          '''
              if source.count(marker) != 1:
                  raise SystemExit('verified failure parser insertion anchor mismatch')
              source = source.replace(marker, helper + marker, 1)

          old = '    verifiedPayment: verifiedPayment(data.verifiedPayment),\n  });\n}'
          new = '    verifiedPayment: verifiedPayment(data.verifiedPayment),\n    verifiedFailure: verifiedFailure(data.verifiedFailure),\n  });\n}'
          if 'verifiedFailure: verifiedFailure(data.verifiedFailure)' not in source:
              if source.count(old) != 1:
                  raise SystemExit('status projection parser anchor mismatch')
              source = source.replace(old, new, 1)

          pattern = re.compile(
              r'(?ms)^        if \(projection\.status === "CONFIRMED"\) \{.*?^        \}\n      \}\n\n      throw paymentFailure\('
          )
          replacement = '''        if (projection.status === "CONFIRMED") {
            if (projection.verifiedFailure) {
              throw paymentFailure(
                handoff.sessionId,
                "PAYMENTS_BROWSER_INVALID_RESPONSE",
                "A confirmação do pagamento retornou evidências conflitantes.",
              );
            }
            if (!projection.verifiedPayment) continue;
            if (projection.verifiedPayment.sessionId !== handoff.sessionId) {
              throw paymentFailure(
                handoff.sessionId,
                "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                "A confirmação do pagamento não corresponde a esta contratação.",
              );
            }
            await options.signals.verified(projection.verifiedPayment);
            return projection.verifiedPayment;
          }

          if (
            projection.status === "FAILED" ||
            projection.status === "CANCELLED" ||
            projection.status === "EXPIRED" ||
            projection.status === "REFUNDED"
          ) {
            if (projection.verifiedPayment) {
              throw paymentFailure(
                handoff.sessionId,
                "PAYMENTS_BROWSER_INVALID_RESPONSE",
                "A confirmação do pagamento retornou evidências conflitantes.",
              );
            }
            if (!projection.verifiedFailure) continue;
            if (projection.verifiedFailure.sessionId !== handoff.sessionId) {
              throw paymentFailure(
                handoff.sessionId,
                "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                "A falha do pagamento não corresponde a esta contratação.",
              );
            }
            throw paymentFailure(
              handoff.sessionId,
              "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              "O pagamento não foi concluído.",
            );
          }

          if (projection.verifiedPayment || projection.verifiedFailure) {
            throw paymentFailure(
              handoff.sessionId,
              "PAYMENTS_BROWSER_INVALID_RESPONSE",
              "O estado do pagamento não corresponde à evidência verificada.",
            );
          }
        }

        throw paymentFailure('''
          if 'if (projection.verifiedPayment || projection.verifiedFailure)' not in source:
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit('terminal polling structural patch mismatch')
          source_path.write_text(source)

          test_path = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts')
          test = test_path.read_text().replace('M148', 'M149').replace('m148', 'm149')

          old = '''  it("uses location fallback only when the popup is blocked", async () => {
            const result = harness([checkoutResponse(), statusResponse("FAILED")], {
              popupResult: null,
            });
            const session = await result.client.start(handoff);
            await expect(session.confirmation).rejects.toMatchObject({
              code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
            });
            expect(result.assignments).toEqual([
              "https://sandbox-payments.example.test/checkout/001",
            ]);
            expect(result.failed).toEqual([
              expect.objectContaining({
                sessionId: handoff.sessionId,
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              }),
            ]);
          });'''
          new = '''  it("uses location fallback only when the popup is blocked", async () => {
            const result = harness(
              [
                checkoutResponse(),
                statusResponse("FAILED"),
                statusResponse("FAILED", null, {
                  verifiedFailure: {
                    verified: true,
                    sessionId: handoff.sessionId,
                    reason: "failed",
                    resultId: "fev_m149_popup_failure",
                  },
                }),
              ],
              { popupResult: null },
            );
            const session = await result.client.start(handoff);
            await expect(session.confirmation).rejects.toMatchObject({
              code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
            });
            expect(result.assignments).toEqual([
              "https://sandbox-payments.example.test/checkout/001",
            ]);
            expect(result.waits).toEqual([2_500, 2_500]);
            expect(result.failed).toEqual([
              expect.objectContaining({
                sessionId: handoff.sessionId,
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              }),
            ]);
          });'''
          if test.count(old) != 1:
              raise SystemExit('popup fallback unit anchor mismatch')
          test = test.replace(old, new, 1)

          anchor = '''  it("fails closed when the status response belongs to another checkout or Business session", async () => {'''
          insertion = '''  it("waits for persisted verified failure evidence before emitting a failure signal", async () => {
            const result = harness([
              checkoutResponse(),
              statusResponse("FAILED"),
              statusResponse("FAILED", null, {
                verifiedFailure: {
                  verified: true,
                  sessionId: handoff.sessionId,
                  reason: "failed",
                  resultId: "fev_m149_verified_failure",
                },
              }),
            ]);
            const session = await result.client.start(handoff);
            await expect(session.confirmation).rejects.toMatchObject({
              code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
            });
            expect(result.waits).toEqual([2_500, 2_500]);
            expect(result.verified).toEqual([]);
            expect(result.failed).toEqual([
              expect.objectContaining({
                sessionId: handoff.sessionId,
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              }),
            ]);
          });

          it("fails closed when verified failure evidence substitutes another Business session", async () => {
            const result = harness([
              checkoutResponse(),
              statusResponse("FAILED", null, {
                verifiedFailure: {
                  verified: true,
                  sessionId: "substituted_session",
                  reason: "failed",
                  resultId: "fev_m149_substituted_failure",
                },
              }),
            ]);
            const session = await result.client.start(handoff);
            await expect(session.confirmation).rejects.toMatchObject({
              code: "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
            });
            expect(result.verified).toEqual([]);
            expect(result.failed).toEqual([
              expect.objectContaining({
                code: "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
              }),
            ]);
          });

          ''' + anchor
          if test.count(anchor) != 1:
              raise SystemExit('verified failure test insertion anchor mismatch')
          test = test.replace(anchor, insertion, 1)

          old = '''    const result = harness([checkoutResponse(), statusResponse("FAILED")], {
              authority: {
                "X-CSRF-Token": "csrf-token-m149",
                "X-Business-ID": "business_12345678",
              },
            });'''
          new = '''    const result = harness(
              [
                checkoutResponse(),
                statusResponse("FAILED", null, {
                  verifiedFailure: {
                    verified: true,
                    sessionId: handoff.sessionId,
                    reason: "failed",
                    resultId: "fev_m149_authenticated_failure",
                  },
                }),
              ],
              {
                authority: {
                  "X-CSRF-Token": "csrf-token-m149",
                  "X-Business-ID": "business_12345678",
                },
              },
            );'''
          if test.count(old) != 1:
              raise SystemExit('authenticated failure unit anchor mismatch')
          test = test.replace(old, new, 1)
          test_path.write_text(test)
          PY
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts
          git diff --check
      - name: Build workspace
        run: pnpm -w build
      - name: Run focused M149 unit contract
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run src/payments-browser-checkout-client.test.ts
      - name: Commit permanent source and test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts
          git commit -m "feat(payments): require persisted verified failure in M149"
          git push origin HEAD:feat/payments-m148-browser-checkout
