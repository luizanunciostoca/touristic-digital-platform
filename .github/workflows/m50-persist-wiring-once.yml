name: M50 Persist Wiring Once

on:
  push:
    branches:
      - feat/business-m50-protected-http
    paths:
      - .github/workflows/m50-persist-wiring-once.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m50-protected-http
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reapply validated M50 wiring with audit evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          helper = Path('.github/workflows/m50-wire-protected-business-once.yml').read_text()
          def extract(target):
              pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n          EOF"
              match = re.search(pattern, helper, re.S)
              if not match:
                  raise SystemExit(f'heredoc not found: {target}')
              content = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines()) + '\n'
              Path(target).write_text(content)

          extract('apps/morro-digital-platform/tooling/business-api.mjs')
          extract('.github/workflows/business-auth-integration-contract.yml')

          auth = Path('apps/morro-digital-platform/tooling/auth-api.mjs')
          text = auth.read_text()
          if 'import { authorizeBusinessAccess } from "@touristic/auth";' not in text:
              text = 'import { authorizeBusinessAccess } from "@touristic/auth";\n' + text
          anchor = '  async function login(request, response) {'
          block = '''  function authorizeBusinessRequest(\n    request,\n    response,\n    businessIdInput,\n    { mutation = false, auditAction = "business.resource" } = {},\n  ) {\n    const active = requireSession(request, response);\n    if (!active) return null;\n    if (mutation && !originAllowed(request)) {\n      audit(request, { action: auditAction, result: "denied", reason: "cross_origin_request" });\n      json(response, 403, { error: "ORIGIN_DENIED", message: "Origem da solicitação não autorizada." });\n      return null;\n    }\n    if (mutation && !verifyCsrfToken(firstHeader(request.headers["x-csrf-token"]), active, secret)) {\n      audit(request, { action: auditAction, result: "denied", reason: "invalid_csrf" });\n      json(response, 403, { error: "INVALID_CSRF", message: "Validação de segurança expirada. Recarregue o painel." });\n      return null;\n    }\n    const decision = authorizeBusinessAccess(active, businessIdInput, { mutation });\n    if (!decision.allowed || !decision.businessId) {\n      audit(request, { action: auditAction, result: "denied", reason: decision.reason });\n      if (decision.reason === "invalid_business_id") {\n        json(response, 400, { error: "INVALID_BUSINESS_ID", message: "Identificador de empresa inválido." });\n      } else if (decision.reason === "read_only_role") {\n        json(response, 403, { error: "READ_ONLY_ROLE", message: "Este usuário possui acesso somente para leitura." });\n      } else {\n        json(response, 403, { error: "BUSINESS_ACCESS_DENIED", message: "Acesso à empresa não autorizado." });\n      }\n      return null;\n    }\n    return Object.freeze({ session: active, businessId: decision.businessId });\n  }\n\n'''
          if 'function authorizeBusinessRequest(' not in text:
              text = text.replace(anchor, block + anchor, 1)
          if '    authorizeBusinessRequest,\n    matches(pathname)' not in text:
              text = text.replace('  return Object.freeze({\n    matches(pathname) {', '  return Object.freeze({\n    authorizeBusinessRequest,\n    matches(pathname) {', 1)
          auth.write_text(text)

          dev = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = dev.read_text()
          if 'createBusinessApi' not in text:
              text = text.replace('import { createAuthApi } from "./auth-api.mjs";\n', 'import { createAuthApi } from "./auth-api.mjs";\nimport { createBusinessApi } from "./business-api.mjs";\n', 1)
          audit_fn = '''\nfunction auditSecurityEvent(request, event) {\n  const pathname = (() => {\n    try {\n      return new URL(request.url || "/", `http://${host}:${port}`).pathname;\n    } catch {\n      return "/";\n    }\n  })();\n  const record = {\n    action: String(event?.action || "security.unknown"),\n    result: String(event?.result || "unknown"),\n    reason: event?.reason ? String(event.reason) : undefined,\n    method: String(request.method || "GET"),\n    pathname,\n  };\n  console.warn(`[security-audit] ${JSON.stringify(record)}`);\n}\n'''
          if 'function auditSecurityEvent(' not in text:
              text = text.replace('const assistantApi = createAssistantApi({', audit_fn + '\nconst assistantApi = createAssistantApi({', 1)
          old_auth = '''const authApi = createAuthApi({\n  getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",\n});'''
          new_auth = '''const authApi = createAuthApi({\n  getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",\n  audit: auditSecurityEvent,\n});'''
          text = text.replace(old_auth, new_auth, 1)
          if 'const businessApi = createBusinessApi({ authApi });' not in text:
              text = text.replace(new_auth, new_auth + '\n\nconst businessApi = createBusinessApi({ authApi });', 1)
          if 'businessApi.matches(requestUrl.pathname)' not in text:
              marker = '    if (assistantApi.matches(requestUrl.pathname)) {'
              text = text.replace(marker, '    if (businessApi.matches(requestUrl.pathname)) {\n      await businessApi.handle(request, response, requestUrl.pathname);\n      return;\n    }\n' + marker, 1)
          dev.write_text(text)

          package_path = Path('apps/morro-digital-platform/package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@touristic/auth'] = 'workspace:*'
          package['dependencies']['@touristic/business'] = 'workspace:*'
          package['dependencies'] = dict(sorted(package['dependencies'].items()))
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          contract = Path('.github/workflows/business-auth-integration-contract.yml')
          c = contract.read_text()
          audit_checks = '''\n                    grep -q '\"action\":\"business.profile.read\",\"result\":\"denied\",\"reason\":\"business_access_denied\"' /tmp/m50-business-server.log\n                    grep -q '\"action\":\"business.profile.write\",\"result\":\"denied\",\"reason\":\"invalid_csrf\"' /tmp/m50-business-server.log\n                    grep -q '\"action\":\"business.profile.write\",\"result\":\"denied\",\"reason\":\"cross_origin_request\"' /tmp/m50-business-server.log\n                    grep -q '\"action\":\"business.profile.write\",\"result\":\"denied\",\"reason\":\"read_only_role\"' /tmp/m50-business-server.log\n'''
          if 'business.profile.read' not in c.split('grep -q')[-1]:
              c += audit_checks
          contract.write_text(c)
          PY
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write apps/morro-digital-platform/package.json apps/morro-digital-platform/tooling/auth-api.mjs apps/morro-digital-platform/tooling/business-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs .github/workflows/business-auth-integration-contract.yml pnpm-lock.yaml
          pnpm --filter @touristic/business test
          pnpm --filter @touristic/morro-digital-platform typecheck
      - name: Persist and remove temporary helpers
        run: |
          rm .github/workflows/m50-wire-protected-business-once.yml
          rm .github/workflows/m50-persist-wiring-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(business): wire protected Business HTTP boundary"
          git push origin HEAD:feat/business-m50-protected-http
