name: Chat7 Analytics Prettier Diagnostic

on:
  pull_request:
    branches:
      - wave/chat7-analytics-instrumentation

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print exact outputs
        run: |
          pnpm exec prettier \
            apps/morro-digital-platform/src/analytics/browser-analytics.ts \
            apps/morro-digital-platform/src/analytics/browser-analytics.test.ts \
            apps/morro-digital-platform/tooling/analytics-api.mjs \
            apps/morro-digital-platform/tooling/analytics-api.test.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            packages/analytics/src/index.ts \
            packages/analytics/src/index.test.ts \
            docs/qa/CHAT7-ANALYTICS-INSTRUMENTATION-EVIDENCE.md \
            --write
          for file in \
            apps/morro-digital-platform/src/analytics/browser-analytics.ts \
            apps/morro-digital-platform/src/analytics/browser-analytics.test.ts \
            apps/morro-digital-platform/tooling/analytics-api.mjs \
            apps/morro-digital-platform/tooling/analytics-api.test.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            packages/analytics/src/index.ts \
            packages/analytics/src/index.test.ts \
            docs/qa/CHAT7-ANALYTICS-INSTRUMENTATION-EVIDENCE.md
          do
            echo "===FILE_BEGIN:${file}==="
            cat "${file}"
            echo "===FILE_END:${file}==="
          done
