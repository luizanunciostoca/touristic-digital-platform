name: Wave A One-Time Format Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wave-a-format-fix
  cancel-in-progress: true

jobs:
  format-wave-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Wave A files only
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/ux/home-discover-manual-conformance.test.ts \
            apps/morro-digital-platform/tooling/wave-a-discover-convergence.mjs

      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/ux/home-discover-manual-conformance.test.ts \
            apps/morro-digital-platform/tooling/wave-a-discover-convergence.mjs
          git rm .github/workflows/wave-a-format-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(discover): format Wave A exact head"
          git push origin HEAD:${GITHUB_REF_NAME}
