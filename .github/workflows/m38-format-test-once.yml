name: M38 Format Test Once
on:
  push:
    branches:
      - feat/search-m38-shared-v1-catalog
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m38-shared-v1-catalog
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write packages/search/src/morro-v1-search-catalog.test.ts
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/m38-format-test-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/search/src/morro-v1-search-catalog.test.ts .github/workflows/m38-format-test-once.yml
          git commit -m "style(search): format M38 catalog tests"
          git push origin HEAD:feat/search-m38-shared-v1-catalog
