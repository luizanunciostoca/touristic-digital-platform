name: UX V2 Prettier Helper

on:
  push:
    branches:
      - wave/ux-v2-place-search-explore-20260921
    paths:
      - .github/workflows/ux-v2-prettier-helper.yml
      - apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
      - apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/place-bottom-sheet.ts
      - apps/morro-digital-platform/src/ux/place-search-explore-v2-contract.test.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files and export exact bytes
        run: |
          files=(
            apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
            apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts
            apps/morro-digital-platform/src/map/explore-locations-control.ts
            apps/morro-digital-platform/src/map/place-bottom-sheet.ts
            apps/morro-digital-platform/src/ux/place-search-explore-v2-contract.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "::MORRO_PRETTIER_BEGIN::${file}"
            base64 -w0 "${file}"
            echo
            echo "::MORRO_PRETTIER_END::${file}"
          done
