name: UX V2 Prettier Diagnostic

on:
  push:
    branches:
      - diagnostic/ux-v2-prettier-probe-20260921
    paths:
      - .github/workflows/ux-v2-prettier-diagnostic.yml

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted files
        run: |
          pnpm exec prettier apps/morro-digital-platform/public/explore-locations.css
          echo "===NAVIGATION==="
          pnpm exec prettier apps/morro-digital-platform/public/navigation-map.css
          echo "===STATE_MOTION==="
          pnpm exec prettier apps/morro-digital-platform/src/ux/state-motion-layers-v2-contract.test.ts
          echo "===SKELETON==="
          pnpm exec prettier apps/morro-digital-platform/src/ux/skeleton-adoption-v2-contract.test.ts
          echo "===SHARED==="
          pnpm exec prettier apps/morro-digital-platform/src/ux/shared-components-v2-contract.test.ts
