name: Control Center Format Fix

on:
  push:
    branches:
      - wave/control-center-entity360-dashboard-final-20260921

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/control-center-entity360-dashboard-final-20260921
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped files and remove formatter
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/src/ux/control-center-entity360-dashboard-contract.test.ts
          rm .github/workflows/control-center-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-center/public/control-center.js \
            apps/morro-digital-platform/src/ux/control-center-entity360-dashboard-contract.test.ts \
            .github/workflows/control-center-format-fix.yml
          git commit -m "style(control-center): apply prettier formatting"
          git push origin HEAD:wave/control-center-entity360-dashboard-final-20260921
