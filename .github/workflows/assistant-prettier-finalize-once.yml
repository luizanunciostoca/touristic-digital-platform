name: Assistant final Prettier closure

on:
  push:
    branches:
      - fix/assistant-v1-runtime-intelligence-completion

permissions:
  contents: write

jobs:
  finalize-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-runtime-intelligence-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format known files
        run: |
          pnpm exec prettier --write \
            packages/assistant/src/dialog-controller-fallback.test.ts \
            packages/assistant/src/intent-engine-v1-intelligence.test.ts \
            packages/assistant/src/proactive-content-v1-weather.test.ts
      - name: Validate formatting globally
        run: pnpm format:check
      - name: Validate assistant
        run: |
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
      - name: Validate workspace build
        run: pnpm -w build
      - name: Commit validated formatting
        run: |
          rm -f .github/workflows/assistant-prettier-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(assistant): normalize final runtime tests"
          git push origin HEAD:fix/assistant-v1-runtime-intelligence-completion
