name: Control Center Final Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "wave/platform-control-center-final-completion-*"
    paths:
      - ".github/workflows/control-center-final-qualification.yml"
      - ".github/workflows/control-center-*.yml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/security-scanning.yml"
      - ".github/workflows/dependency-security-audit.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/admin-*.mjs"
      - "apps/morro-digital-platform/tooling/control-center-*.mjs"
      - "apps/morro-digital-platform/tooling/auth-api*.mjs"
      - "apps/morro-digital-platform/tooling/business-api.mjs"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"
      - "apps/morro-digital-platform/tooling/ticketing-api*.mjs"
      - "packages/auth/**"
      - "packages/affiliates/**"
      - "packages/content/**"
      - "packages/destinations/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "packages/ticketing/**"
      - "services/auth/**"
      - "services/affiliates/**"
      - "services/content/**"
      - "services/destinations/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "services/ticketing/**"
      - "docs/features/registry.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: control-center-final-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head / mandatory matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Prove candidate SHA and branch are frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            candidate_ref="${GITHUB_HEAD_REF}"
          else
            candidate_ref="${GITHUB_REF_NAME}"
          fi
          test -n "$candidate_ref"
          remote_sha="$(git ls-remote origin "refs/heads/$candidate_ref" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          qualification_ref="cc-qualify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "$qualification_ref" "$GITHUB_SHA"
          git push origin "refs/tags/$qualification_ref"
          echo "CANDIDATE_REF=$candidate_ref" >> "$GITHUB_ENV"
          echo "QUALIFICATION_REF=$qualification_ref" >> "$GITHUB_ENV"
          echo "Frozen candidate: $candidate_ref@$GITHUB_SHA via tag $qualification_ref"

      - name: Cancel stale mandatory runs from older candidate SHAs
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            quality.yml
            security-scanning.yml
            dependency-security-audit.yml
            auth-integration-contract.yml
            business-auth-integration-contract.yml
            crm-platform-auth-integration-contract.yml
            ticketing-m147-contract.yml
            ticketing-m148-transaction-contract.yml
            control-center-browser-contract.yml
            control-center-affiliates-contract.yml
            control-center-affiliates-browser-contract.yml
            control-center-financial-contract.yml
            control-center-financial-browser-contract.yml
            control-center-content-contract.yml
            control-center-destination-contract.yml
          )

          for workflow in "${workflows[@]}"; do
            gh run list               --workflow "$workflow"               --branch "$CANDIDATE_REF"               --limit 50               --json databaseId,headSha,status             | jq -r --arg sha "$GITHUB_SHA"                 '.[] | select(.headSha != $sha and .status != "completed") | .databaseId'             | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Cancelling stale $workflow run $run_id"
                gh run cancel "$run_id" || true
              done
          done

      - name: Dispatch exact-head mandatory workflows
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            quality.yml
            security-scanning.yml
            dependency-security-audit.yml
            auth-integration-contract.yml
            business-auth-integration-contract.yml
            crm-platform-auth-integration-contract.yml
            ticketing-m147-contract.yml
            ticketing-m148-transaction-contract.yml
            control-center-browser-contract.yml
            control-center-affiliates-contract.yml
            control-center-affiliates-browser-contract.yml
            control-center-financial-contract.yml
            control-center-financial-browser-contract.yml
            control-center-content-contract.yml
            control-center-destination-contract.yml
          )

          : > /tmp/control-center-final-runs.tsv
          for workflow in "${workflows[@]}"; do
            before_id="$(
              gh api                 "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100"               | jq '[.workflow_runs[].id] | max // 0'
            )"

            echo "Dispatching $workflow on $QUALIFICATION_REF@$GITHUB_SHA after run $before_id"
            gh workflow run "$workflow" --ref "$QUALIFICATION_REF"

            run_id=""
            for _ in $(seq 1 60); do
              run_id="$(
                gh api                   "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100"                 | jq -r                     --arg sha "$GITHUB_SHA"                     --argjson before "$before_id"                     '[.workflow_runs[] | select(.head_sha == $sha and .id > $before)] | max_by(.id) | .id // empty'
              )"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Unable to discover exact-head run for $workflow" >&2
              exit 1
            fi
            echo "$workflow $run_id" >> /tmp/control-center-final-runs.tsv
            echo "$workflow -> run $run_id"
          done

      - name: Wait for exact-head mandatory matrix
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r workflow run_id; do
            echo "Waiting for $workflow (run $run_id)"
            if ! gh run watch "$run_id" --exit-status; then
              echo "FAILED: $workflow (run $run_id)" >&2
              failed=1
              continue
            fi

            observed_sha="$(gh run view "$run_id" --json headSha --jq '.headSha')"
            if [ "$observed_sha" != "$GITHUB_SHA" ]; then
              echo "SHA DRIFT: $workflow expected $GITHUB_SHA got $observed_sha" >&2
              failed=1
            else
              echo "PASS: $workflow @ $observed_sha"
            fi
          done < /tmp/control-center-final-runs.tsv
          exit "$failed"

      - name: Re-prove candidate did not move
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$CANDIDATE_REF" | awk '{print $1}')"
          tag_sha="$(git ls-remote origin "refs/tags/$QUALIFICATION_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          test "$tag_sha" = "$GITHUB_SHA"
          echo "Exact-head qualification remained frozen: $GITHUB_SHA"

      - name: Remove ephemeral qualification tag
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QUALIFICATION_REF:-}" ]; then
            git push origin ":refs/tags/$QUALIFICATION_REF" || true
          fi
