name: Temporary Catalog Formatter

on:
  push:
    branches:
      - fix/catalog-runtime-persistence-integration-20260925

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/catalog-runtime-persistence-integration-20260925
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Catalog files and remove helper
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/tooling/catalog-platform-runtime.mjs             apps/morro-digital-platform/tooling/catalog-platform-runtime.mysql.mjs             apps/morro-digital-platform/tooling/place-platform-runtime.mjs
          rm .github/workflows/tmp-catalog-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(catalog): apply canonical formatting"
            git push origin HEAD:fix/catalog-runtime-persistence-integration-20260925
          fi
