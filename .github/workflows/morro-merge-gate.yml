name: Morro Merge Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  merge_group:
    types:
      - checks_requested

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: morro-merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: morro/merge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Reject fork candidates
        if: github.event_name == 'pull_request'
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"

      - name: Checkout trusted base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as data
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for PR policy
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Detect canonical claim retirement
        if: github.event_name == 'pull_request'
        id: retirement
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node - "$BASE_SHA" "$HEAD_BRANCH" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [baseSha, branch] = process.argv.slice(2);
          const base = JSON.parse(fs.readFileSync("trusted/.github/morro-control/claims.json", "utf8"));
          const candidate = JSON.parse(fs.readFileSync("candidate/.github/morro-control/claims.json", "utf8"));
          const baseIds = Object.keys(base.claims ?? {});
          const candidateIds = Object.keys(candidate.claims ?? {});
          const removed = baseIds.filter((id) => !candidateIds.includes(id));
          const added = candidateIds.filter((id) => !baseIds.includes(id));
          let eligible = false;
          if (removed.length === 1 && added.length === 0) {
            const file = path.join("candidate", ".morro", "changesets", removed[0] + ".json");
            if (fs.existsSync(file)) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              eligible =
                manifest.id === removed[0] &&
                manifest.baseSha === baseSha &&
                manifest.branch === branch;
            }
          }
          process.stdout.write("eligible=" + String(eligible) + "\n");
          NODE

      - name: Classify ordinary scope using trusted base
        if: github.event_name == 'pull_request'
        id: native-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node trusted/tooling/mdctl/native-pr-gate.mjs --classify trusted candidate "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head Trusted Claim Guard
        if: github.event_name == 'pull_request' && steps.retirement.outputs.eligible != 'true' && steps.native-scope.outputs.ordinary != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -C candidate diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if grep -Fxq '.github/workflows/morro-claim-guard.yml' <<<"$changed"; then
            echo "TRUSTED_CLAIM_GUARD_WAIT_SKIPPED_IMMUTABLE_ROOT:$HEAD_SHA"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { verifyTrustedClaimEvidence } from './trusted/tooling/mdctl/scheduler-live.mjs';
          const args = { repository: process.env.REPOSITORY, mainSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA, branch: process.env.HEAD_BRANCH,
            prNumber: Number(process.env.PR_NUMBER) };
          for (let attempt = 1; attempt <= 60; attempt++) {
            const evidence = await verifyTrustedClaimEvidence(args);
            if (evidence.trusted === true) process.exit(0);
            const pending = evidence.reason === 'TRUSTED_CLAIM_GUARD_RUN_NOT_COMPLETED';
            const discovering = evidence.reason === 'TRUSTED_CLAIM_GUARD_RUN_MISSING' && attempt < 3;
            if (!pending && !discovering) throw new Error('TRUSTED_PRODUCER_REJECTED:' + evidence.reason);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('TRUSTED_PRODUCER_TIMEOUT:' + process.env.HEAD_SHA);
          NODE

      - name: Run trusted merge-gate policy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node trusted/tooling/mdctl/merge-gate.mjs \
            --trusted trusted \
            --candidate candidate \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --branch "$HEAD_BRANCH" \
            | tee merge-gate-decision.json
          jq -e '.decision == "POLICY_SATISFIED"' merge-gate-decision.json >/dev/null

      - name: Upload PR merge-gate decision
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: morro-merge-gate-${{ github.event.pull_request.head.sha }}
          path: merge-gate-decision.json
          if-no-files-found: warn
          retention-days: 30

      - name: Checkout merge group
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main ancestry
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GROUP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          git fetch --no-tags origin "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$GROUP_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$GROUP_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          printf '{"kind":"TDP_MERGE_GROUP_GATE","mainSha":"%s","groupSha":"%s","status":"PASS"}\n' \
            "$MAIN_SHA" "$GROUP_SHA" | tee merge-group-decision.json

      - name: Upload merge-group decision
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: morro-merge-group-gate-${{ github.sha }}
          path: merge-group-decision.json
          if-no-files-found: warn
          retention-days: 30
