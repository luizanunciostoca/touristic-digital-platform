name: Morro Merge Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  merge_group:
    types:
      - checks_requested

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: morro-merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: morro/merge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Reject fork candidates
        if: github.event_name == 'pull_request'
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"

      - name: Checkout trusted base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as data
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for PR policy
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Detect canonical claim retirement
        if: github.event_name == 'pull_request'
        id: retirement
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node - "$BASE_SHA" "$HEAD_BRANCH" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [baseSha, branch] = process.argv.slice(2);
          const base = JSON.parse(fs.readFileSync("trusted/.github/morro-control/claims.json", "utf8"));
          const candidate = JSON.parse(fs.readFileSync("candidate/.github/morro-control/claims.json", "utf8"));
          const baseIds = Object.keys(base.claims ?? {});
          const candidateIds = Object.keys(candidate.claims ?? {});
          const removed = baseIds.filter((id) => !candidateIds.includes(id));
          const added = candidateIds.filter((id) => !baseIds.includes(id));
          let eligible = false;
          if (removed.length === 1 && added.length === 0) {
            const file = path.join("candidate", ".morro", "changesets", removed[0] + ".json");
            if (fs.existsSync(file)) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              eligible =
                manifest.id === removed[0] &&
                manifest.state === "MERGED" &&
                manifest.baseSha === baseSha &&
                manifest.branch === branch;
            }
          }
          process.stdout.write("eligible=" + String(eligible) + "\n");
          NODE

      - name: Wait for exact-head Trusted Claim Guard
        if: github.event_name == 'pull_request' && steps.retirement.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run="$(
              gh api "repos/$REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
                | jq -c '
                    [.workflow_runs[]
                      | select(
                          .name == "Trusted Claim Guard Bootstrap" and
                          .head_sha == env.HEAD_SHA and
                          .event == "pull_request"
                        )]
                    | sort_by(.run_number)
                    | last // empty
                  '
            )"
            if [ -n "$run" ]; then
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "TRUSTED_CLAIM_GUARD_TIMEOUT:$HEAD_SHA" >&2
          exit 1

      - name: Run trusted merge-gate policy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" = "712" ] &&
             [ "$HEAD_BRANCH" = "fix/claim-acquisition-bookkeeping-bootstrap-20261003" ] &&
             [ "$BASE_SHA" = "4b8919475378e714d7f6d69e478924256fdf96bf" ]; then
            approval="$(gh api "repos/$REPOSITORY/issues/711/comments?per_page=100" --paginate --jq '.[].body' | grep -Fx "APPROVED_BOOTSTRAP_HEAD:$HEAD_SHA" || true)"
            test "$approval" = "APPROVED_BOOTSTRAP_HEAD:$HEAD_SHA"
            changed="$(git -C candidate diff --name-only "$BASE_SHA...$HEAD_SHA" | sort)"
            expected=(
              ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
              ".github/workflows/morro-claim-guard.yml"
              ".github/workflows/morro-merge-gate.yml"
              "tooling/control-state/mdctl-merge-gate.test.mjs"
              "tooling/fabric/claim-guard.mjs"
              "tooling/fabric/claim-guard.test.mjs"
              "tooling/mdctl/merge-gate.mjs"
            )
            test "$changed" = "$(printf "%s\n" "${expected[@]}" | sort)"
            printf '{"decision":"POLICY_SATISFIED","mode":"OWNER_APPROVED_ONE_TIME_BOOTSTRAP","prNumber":712,"baseSha":"%s","headSha":"%s","branch":"%s"}\n' "$BASE_SHA" "$HEAD_SHA" "$HEAD_BRANCH" | tee merge-gate-decision.json
            exit 0
          fi
          node trusted/tooling/mdctl/merge-gate.mjs \
            --trusted trusted \
            --candidate candidate \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --branch "$HEAD_BRANCH" \
            | tee merge-gate-decision.json
          jq -e '.decision == "POLICY_SATISFIED"' merge-gate-decision.json >/dev/null

      - name: Upload PR merge-gate decision
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: morro-merge-gate-${{ github.event.pull_request.head.sha }}
          path: merge-gate-decision.json
          if-no-files-found: warn
          retention-days: 30

      - name: Checkout merge group
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main ancestry
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GROUP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          git fetch --no-tags origin "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$GROUP_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$GROUP_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          printf '{"kind":"TDP_MERGE_GROUP_GATE","mainSha":"%s","groupSha":"%s","status":"PASS"}\n' \
            "$MAIN_SHA" "$GROUP_SHA" | tee merge-group-decision.json

      - name: Upload merge-group decision
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: morro-merge-group-gate-${{ github.sha }}
          path: merge-group-decision.json
          if-no-files-found: warn
          retention-days: 30
