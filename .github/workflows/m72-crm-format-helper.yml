name: M72 CRM docs formatter

on:
  push:
    branches:
      - feat/crm-m72-authenticated-transport
    paths:
      - ".github/workflows/m72-crm-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m72-authenticated-transport
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/CRM-MIGRATION-MATRIX.md
      - run: pnpm format:check
      - name: Commit formatted matrix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/CRM-MIGRATION-MATRIX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(crm): format M72 migration matrix"
          git push origin HEAD:feat/crm-m72-authenticated-transport
