name: Morro Pro Canonical Catalog Contract

on:
  pull_request:
    paths:
      [
        ".github/workflows/morro-pro-canonical-catalog.yml",
        "apps/morro-digital-platform/src/business-dashboard-client.ts",
        "apps/morro-digital-platform/src/business-dashboard-client.test.ts",
        "apps/morro-digital-platform/tooling/business-api.mjs",
        "apps/morro-digital-platform/tooling/business-api-catalog.invariants.mjs",
        "apps/morro-digital-platform/tooling/dev-server.mjs",
        "apps/morro-digital-platform/tooling/place-platform-runtime.mjs",
      ]

permissions: { contents: read }

concurrency:
  group: morro-pro-canonical-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build Business package
        run: pnpm --filter @touristic/business build
      - name: Verify Business Catalog auth boundary
        run: node --test apps/morro-digital-platform/tooling/business-api-catalog.invariants.mjs
      - name: Verify dashboard Catalog client
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run src/business-dashboard-client.test.ts
