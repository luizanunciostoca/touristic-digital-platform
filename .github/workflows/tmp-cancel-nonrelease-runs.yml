name: Temporary Cancel Nonrelease Runs

on:
  push:
    branches:
      - ops/cancel-nonrelease-runs-20260924

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/cancel-nonrelease-runs-20260924
          fetch-depth: 0
      - name: Cancel only nonrelease runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for sha in             46365749163b0422c40059dd57b709568dd5c76d             4832096204107b2a1114e6141e0fa9eed3aa5a9a
          do
            gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100"               --jq '.workflow_runs[] | select(.status != "completed") | .id' |
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" || true
              echo "cancelled $run_id for $sha"
            done
          done
      - name: Remove temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cancel-nonrelease-runs.yml
          git commit -m "chore(ci): remove nonrelease cancellation helper"
          git push origin HEAD:ops/cancel-nonrelease-runs-20260924
