name: Business CMS MySQL Acceptance

on:
  pull_request:
    paths:
      - "apps/control-center/public/control-center-business-cms.js"
      - "apps/morro-digital-platform/tooling/place-platform-*.mjs"
      - "apps/morro-digital-platform/tooling/control-center-business-cms-browser-contract.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "packages/business/**"
      - "services/content/**"
      - ".github/workflows/business-cms-mysql-acceptance.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/control-center/public/control-center-business-cms.js"
      - "apps/morro-digital-platform/tooling/place-platform-*.mjs"
      - "apps/morro-digital-platform/tooling/control-center-business-cms-browser-contract.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "packages/business/**"
      - "services/content/**"
      - ".github/workflows/business-cms-mysql-acceptance.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-cms-mysql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cms-acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcms-acceptance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BUSINESS_DATABASE_URL: mysql://root:cms-acceptance@127.0.0.1:3306/cms_acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@touristic/morro-digital-platform^...
      - name: Create isolated Business database
        working-directory: apps/morro-digital-platform
        run: >-
          node --input-type=module -e
          "import('@touristic/content-server').then(async ({createMySqlPool}) => {
          const pool = createMySqlPool('mysql://root:cms-acceptance@127.0.0.1:3306/mysql');
          try { await pool.query('CREATE DATABASE cms_acceptance CHARACTER SET utf8mb4'); }
          finally { await pool.end(); }
          })"
      - name: Verify persistence, revisions, publication and tenant denial
        run: node apps/morro-digital-platform/tooling/place-platform-mysql-acceptance.mjs
      - run: pnpm --filter @touristic/morro-digital-platform build
      - name: Install Chromium browser runner
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify authenticated Control Center browser flow
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD='cms browser fixture password'
          HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 7))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"cms-admin",email:"cms-admin@example.invalid",passwordHash:process.argv[1],role:"PLATFORM_ADMIN",businessIds:[]},{id:"cms-owner",email:"cms-business-owner@example.invalid",passwordHash:process.argv[1],role:"BUSINESS_OWNER",businessIds:["unrelated-business"]}]))' "$HASH")
          DASHBOARD_AUTH_SECRET='0123456789abcdef0123456789abcdef' DASHBOARD_USERS_JSON="$USERS" PORT=4198 HOST=127.0.0.1 \
            node apps/morro-digital-platform/tooling/dev-server.mjs > /tmp/business-cms-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -80 /tmp/business-cms-server.log || true' EXIT
          for _ in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:4198/runtime-config.js >/dev/null; then break; fi
            sleep 0.25
          done
          node apps/morro-digital-platform/tooling/control-center-business-cms-browser-contract.mjs
