name: Assistant Input Menu Flow V1 Parity

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/actions/ci-bootstrap/action.yml"
      - .github/workflows/assistant-input-menu-flow-v1-parity.yml
      - apps/morro-digital-platform/public/index.html
      - apps/morro-digital-platform/public/assistant-input-v1-parity.js
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/navigation/**
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/place-bottom-sheet.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - packages/assistant/src/**
      - packages/search/src/**
      - packages/geospatial/src/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assistant-input-menu-flow:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
        with:
          browser: "true"
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-input-menu-flow.log 2>&1 &
          echo $! >/tmp/assistant-input-menu-flow.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-input-menu-flow.log
          exit 1
      - name: Verify typed input drives the same V1 assistant and map flow
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          async function assertCatalogMarkerMembership(page, category, legacyCount, selectedName = null, filterTags = null) {
            const catalog = (await import(require('node:url').pathToFileURL(
              require('node:path').resolve('packages/search/dist/index.js')).href)).morroV1SearchCatalog;
            const key = item => JSON.stringify([item.category, item.name]);
            const allKeys = catalog.map(key);
            if (new Set(allKeys).size !== allKeys.length) throw new Error('Local catalog identity tuple is not unique');
            const expected = catalog.filter(item => (!category || item.category === category) && (!selectedName || item.name === selectedName) && (!filterTags || filterTags.some(tag => item.tags.includes(tag)))).map(key).sort();
            const deadline = Date.now() + 10000;
            let stable = 0;
            while (Date.now() < deadline) {
              const state = await page.evaluate(() => {
                const map = document.getElementById('map');
                return {
                  ready: map?.getAttribute('data-explore-state') === 'ready',
                  moving: Boolean(globalThis.mapboxPrimaryInstance?.isMoving?.()),
                  physical: Number(map?.getAttribute('data-map-marker-count')),
                  actual: document.querySelectorAll('.morro-explore-marker[data-morro-explore-marker="true"]').length,
                  members: map?.getAttribute('data-map-member-count'),
                };
              });
              if (state.ready && !state.moving && state.physical === state.actual &&
                  (state.members === null ? state.physical === legacyCount : Number(state.members) === expected.length)) stable += 1;
              else stable = 0;
              if (stable >= 2) break;
              await page.waitForTimeout(50);
            }
            if (stable < 2) throw new Error('Marker membership did not settle under the actual map contract');
            const markers = await page.locator('.morro-explore-marker[data-morro-explore-marker="true"]').evaluateAll(nodes => nodes.map(node => ({
              id: node.getAttribute('data-marker-id'), category: node.getAttribute('data-explore-category'),
              name: node.getAttribute('data-location-name'), canonicalId: node.getAttribute('data-canonical-place-id'),
              clustered: node.getAttribute('data-marker-cluster') === 'true' || node.getAttribute('data-tour-cluster') === 'true',
              count: Number(node.getAttribute('data-cluster-count')),
            })));
            const counts = await page.locator('#map').evaluate(node => ({
              physical: Number(node.getAttribute('data-map-marker-count')),
              members: node.getAttribute('data-map-member-count'),
            }));
            if (counts.physical !== markers.length) throw new Error('Physical marker count disagrees with rendered symbols');
            const sourceDeclaresMemberContract = require('node:fs').readFileSync(
              'apps/morro-digital-platform/src/map/explore-locations-control.ts', 'utf8').includes('"data-map-member-count"');
            if (counts.members === null) {
              if (sourceDeclaresMemberContract) throw new Error('U7 producer contract declared but runtime membership capability missing');
              const compareLegacy = expectedCount => {
                if (markers.length !== expectedCount) throw new Error('Legacy physical marker contract changed');
              };
              compareLegacy(legacyCount);
              for (const wrongCount of [legacyCount - 1, legacyCount + 1]) {
                let rejected = false;
                try { compareLegacy(wrongCount); } catch { rejected = true; }
                if (!rejected) throw new Error('Legacy count negative canary failed');
              }
              const proof = { proofMode: 'LEGACY_PHYSICAL_CONTRACT', u7Membership: 'NOT_EXERCISED', physical: markers.length };
              console.log(JSON.stringify(proof));
              return proof;
            }
            if (Number(counts.members) !== expected.length) throw new Error('Dataset member count disagrees with independent catalog');
            const initialSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
            if (initialSemantic === null || Number(initialSemantic) !== expected.length)
              throw new Error('Semantic current dataset count is missing or incorrect');
            if (markers.some(marker => !marker.id) || new Set(markers.map(marker => marker.id)).size !== markers.length)
              throw new Error('Physical marker identities missing or duplicated');
            const observed = [];
            for (const marker of markers) {
              if (!marker.clustered) {
                observed.push(key(marker));
                continue;
              }
              await page.locator(`.morro-explore-marker[data-marker-id=${JSON.stringify(marker.id)}]`).evaluate(node => node.click());
              const back = page.locator('#assistant-category-rail [data-explore-action="back-cluster"]');
              await back.waitFor({ state: 'visible', timeout: 5000 });
              const members = await page.locator('#assistant-category-rail [data-location-name][data-location-category]').evaluateAll(nodes => nodes.map(node => ({
                category: node.getAttribute('data-location-category'), name: node.getAttribute('data-location-name'),
                source: node.getAttribute('data-location-source'), canonicalId: node.getAttribute('data-canonical-place-id'),
              })));
              if (members.length !== marker.count || members.some(member => member.source !== 'catalog'))
                throw new Error('Actual local cluster list disagrees with declared membership/source');
              const selectedSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
              if (selectedSemantic === null || Number(selectedSemantic) !== members.length)
                throw new Error('Semantic count disagrees with the actual opened subset');
              observed.push(...members.map(key));
              await back.click();
              await back.waitFor({ state: 'hidden', timeout: 5000 });
              const restoredSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
              if (restoredSemantic === null || Number(restoredSemantic) !== expected.length)
                throw new Error('Semantic count did not restore the full current dataset');
            }
            const compare = wanted => {
              if (JSON.stringify([...observed].sort()) !== JSON.stringify([...wanted].sort()))
                throw new Error('Canonical catalog membership missing, duplicated, invented or wrong category');
            };
            compare(expected);
            for (const wrong of [expected.slice(1), [...expected, expected[0]], [JSON.stringify(['__wrong_category__', '__wrong_identity__']), ...expected.slice(1)]]) {
              let rejected = false;
              try { compare(wrong); } catch { rejected = true; }
              if (!rejected) throw new Error('Membership missing/duplicate/wrong identity negative canary failed');
            }
            const proof = { proofMode: 'U7_LOCAL_CATALOG_MEMBERSHIP', localIdentity: 'unique category/name tuple', locations: expected.length, physical: markers.length, negativeCanaries: ['missing', 'duplicate', 'wrong-identity'] };
            console.log(JSON.stringify(proof));
            return proof;
          }


          async function assertFilteredBeaches(page, tags) {
            const catalog = (await import(require('node:url').pathToFileURL(
              require('node:path').resolve('packages/search/dist/index.js')).href)).morroV1SearchCatalog;
            // Independent input data/predicate: never derive expected members from the UI.
            const key = item => JSON.stringify([item.category, item.name]);
            const expected = catalog.filter(item => item.category === 'beaches' &&
              tags.some(tag => item.tags.includes(tag))).map(key).sort();
            if (!expected.length || expected.length >= 8) throw new Error('Independent filtered catalog is not a proper beach subset');
            const observed = await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-location-name]').evaluateAll(nodes =>
              nodes.map(node => JSON.stringify([node.getAttribute('data-location-category'), node.getAttribute('data-location-name')])).sort());
            const compare = wanted => {
              if (JSON.stringify(observed) !== JSON.stringify([...wanted].sort())) throw new Error('Filtered rail differs from independent catalog predicate');
            };
            compare(expected);
            for (const wrong of [expected.slice(1), [...expected, expected[0]], ['["wrong","identity"]', ...expected.slice(1)]]) {
              let rejected = false; try { compare(wrong); } catch { rejected = true; }
              if (!rejected) throw new Error('Filtered rail negative membership canary failed');
            }
            return assertCatalogMarkerMembership(page, 'beaches', expected.length, null, tags);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('morro-digital-language', 'pt-BR');
                localStorage.setItem('voice-enabled', 'false');
                globalThis.__typedMenuRoutes = [];
                document.addEventListener('morro:assistant-menu-command-routed', event => {
                  globalThis.__typedMenuRoutes.push(event.detail);
                });
              });

              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  temperatureCelsius: 28,
                  temperatureMaxCelsius: 31,
                  temperatureMinCelsius: 24,
                  humidityPercent: 78,
                  windSpeedKph: 18,
                  rainChancePercent: 42,
                  weatherCode: 1,
                  isDay: true,
                  forecast: [],
                }),
              }));

              await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({
                state: 'attached',
                timeout: 30000,
              });
              await page.locator('body[data-public-onboarding-settled="true"]').waitFor({
                state: 'attached',
                timeout: 5000,
              });

              const assistant = page.locator('#assistant-messages');
              const input = page.locator('#assistantInput');
              const send = page.locator('#sendButton');
              await input.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await assistant.isVisible())) await input.focus();
              await assistant.waitFor({ state: 'visible', timeout: 5000 });

              async function submit(text, keyboard = false) {
                await page.evaluate(
                  ({ value, keyboard }) => {
                    const input = document.getElementById('assistantInput');
                    const send = document.getElementById('sendButton');
                    if (!(input instanceof HTMLInputElement) || !(send instanceof HTMLButtonElement)) {
                      throw new Error('Assistant semantic input controls unavailable');
                    }
                    const setter = Object.getOwnPropertyDescriptor(
                      HTMLInputElement.prototype,
                      'value',
                    )?.set;
                    setter?.call(input, value);
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    send.click();
                  },
                  { value: text, keyboard },
                );
                if ((await input.inputValue()) !== '') {
                  throw new Error(`Handled menu command did not clear input: ${text}`);
                }
              }

              async function waitStage(category, stage, count) {
                await page.locator(
                  `#map[data-explore-state="ready"][data-explore-category="${category}"][data-explore-stage="${stage}"]`,
                ).waitFor({ state: 'attached', timeout: 8000 });
                const selectedName = stage === 'detail' ? await page.locator('#map').getAttribute('data-explore-place') : null;
                if (stage === 'detail' && !selectedName) throw new Error('Detail identity missing');
                return assertCatalogMarkerMembership(page, category, count, selectedName);
              }

              await submit('olá');
              await page.locator('#assistant-messages .messages-area .message.assistant').filter({
                hasText: 'Bem-vindo a Morro de São Paulo! Sou seu guia digital. Como posso ajudar?',
              }).first().waitFor({ state: 'attached', timeout: 30000 });

              const greetingState = await page.evaluate(() => {
                const assistantMessages = Array.from(
                  document.querySelectorAll('#assistant-messages .messages-area .message.assistant'),
                );
                const dynamicOptions = Array.from(
                  document.querySelectorAll('#assistant-messages .messages-area .assistant-options'),
                ).filter(container => !container.querySelector('[data-explore-category]'));
                const latestOptions = dynamicOptions.at(-1);
                return {
                  text: assistantMessages.at(-1)?.textContent || '',
                  values: latestOptions
                    ? Array.from(latestOptions.querySelectorAll('.assistant-option-btn')).map(
                        button => button.getAttribute('data-value'),
                      )
                    : [],
                };
              });
              if (!greetingState.text.includes(
                'Bem-vindo a Morro de São Paulo! Sou seu guia digital. Como posso ajudar?'
              )) {
                throw new Error(
                  `Greeting did not preserve V1 personalized copy: ${JSON.stringify(greetingState)}`
                );
              }
              for (const expectedValue of [
                'beaches',
                'restaurants',
                'hotels',
                'shops',
                'transport',
                'attractions',
                'tours',
                'nightlife',
                'emergencies',
                'help',
              ]) {
                if (!greetingState.values.includes(expectedValue)) {
                  throw new Error(
                    `Greeting did not complete the canonical V1 menu with ${expectedValue}: ${JSON.stringify(greetingState)}`
                  );
                }
              }

              const categoryCases = [
                { message: 'beachs', category: 'beaches', count: 8 },
                { message: 'restaurants', category: 'restaurants', count: 45 },
                { message: 'hotels', category: 'hotels', count: 35 },
                { message: 'shops', category: 'shops', count: 12 },
                { message: 'transport', category: 'transport', count: 8 },
                { message: 'attractions', category: 'attractions', count: 8 },
                { message: 'tours', category: 'tours', count: 4 },
                { message: 'nightlife', category: 'nightlife', count: 5 },
                { message: 'emergencies', category: 'emergencies', count: 4 },
              ];

              for (const [index, item] of categoryCases.entries()) {
                await submit(item.message, index % 2 === 1);
                await page.locator(
                  `#assistant-category-rail[data-rail-stage="filters"][data-context-category="${item.category}"]`,
                ).waitFor({ state: 'visible', timeout: 8000 });
                const markerProof = await waitStage(item.category, 'filters', item.count);
                if (item.category === 'tours' && markerProof.proofMode === 'LEGACY_PHYSICAL_CONTRACT') {
                  const tourClusters = await page
                    .locator('[data-morro-explore-marker="true"][data-tour-cluster="true"][data-cluster-count="3"]')
                    .count();
                  if (tourClusters !== 1) {
                    throw new Error(`Typed tours clustering diverged: ${tourClusters}`);
                  }
                }
              }

              await submit('back to main menu');
              await page.locator(
                '#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="beaches"]',
              ).waitFor({
                state: 'visible',
                timeout: 5000,
              });
              if (await page.locator('#assistant-category-results').count()) {
                throw new Error('Typed back-to-main-menu left the category flow source mounted');
              }

              await submit('quero uma praia tranquila para crianças');
              await page.locator(
                '#assistant-category-rail[data-rail-stage="places"][data-context-category="beaches"]',
              ).waitFor({ state: 'visible', timeout: 8000 });
              await assertFilteredBeaches(page, ['familiar', 'tranquila']);

              await submit('back to main menu');
              await page.locator(
                '#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="beaches"]',
              ).waitFor({ state: 'visible', timeout: 5000 });

              await submit('praias');
              await page.locator(
                '#assistant-category-rail[data-rail-stage="filters"][data-context-category="beaches"]',
              ).waitFor({ state: 'visible' });
              await waitStage('beaches', 'filters', 8);
              const filtersText = await page.locator('#assistant-category-results-message').innerText();
              if (!filtersText.includes('Praias') || !filtersText.includes('8')) {
                throw new Error(`Typed beaches did not open the V1 filter response: ${filtersText}`);
              }

              await submit('surf', true);
              await page.locator(
                '#assistant-category-rail[data-rail-stage="places"][data-context-category="beaches"]',
              ).waitFor({ state: 'visible' });
              await assertFilteredBeaches(page, ['surf']);

              await submit('back to filters');
              await page.locator(
                '#assistant-category-rail[data-rail-stage="filters"][data-context-category="beaches"]',
              ).waitFor({ state: 'visible' });
              await waitStage('beaches', 'filters', 8);

              await page.locator(
                '#assistant-category-rail[data-rail-stage="filters"] [data-value="ver todos"]',
              ).click();
              await page.locator(
                '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]',
              ).waitFor({ state: 'visible' });
              await waitStage('beaches', 'places', 8);

              await submit('Primeira Praia');
              await waitStage('beaches', 'detail', 1);
              await page.locator(
                '#assistant-category-rail[data-rail-stage="detail"][data-context-place="Primeira Praia"] [data-value="ver fotos"]',
              ).waitFor({ state: 'visible', timeout: 8000 });

              await submit('fotos', true);
              await page.locator('.assistant-photo-carousel').waitFor({ state: 'attached', timeout: 8000 });
              const photoOwnership = await page.evaluate(() => ({
                contextualPhotoAction: document.querySelectorAll(
                  '#assistant-category-rail[data-rail-stage="detail"] [data-context-rail-option="true"][data-value="ver fotos"]',
                ).length,
                assistantPhotoDuplicates: document.querySelectorAll(
                  '#assistant-messages:not(.hidden) .assistant-options:not([data-presentation="photo-actions"]) .assistant-option-btn[data-value="ver fotos"]',
                ).length,
                photoCarouselVisible: Array.from(
                  document.querySelectorAll('.assistant-photo-carousel'),
                ).some(node => {
                  const style = getComputedStyle(node);
                  return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                }),
              }));
              if (
                photoOwnership.contextualPhotoAction !== 1 ||
                photoOwnership.assistantPhotoDuplicates !== 0 ||
                !photoOwnership.photoCarouselVisible
              ) {
                throw new Error(
                  `Typed photos violated contextual Place action ownership: ${JSON.stringify(photoOwnership)}`,
                );
              }

              await page.locator(
                '#assistant-category-rail[data-rail-stage="detail"] [data-value="__back_to_places__"]',
              ).click();
              await page.locator(
                '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]',
              ).waitFor({ state: 'visible', timeout: 8000 });
              await waitStage('beaches', 'places', 8);

              await submit('Primeira Praia');
              await waitStage('beaches', 'detail', 1);
              await submit('fotos');
              await page.locator('.assistant-photo-carousel').waitFor({ state: 'attached', timeout: 8000 });

              await submit('restaurantes', true);
              await page.locator(
                '#assistant-category-rail[data-rail-stage="filters"][data-context-category="restaurants"]',
              ).waitFor({ state: 'visible' });
              await waitStage('restaurants', 'filters', 45);
              const cleanupState = await page.evaluate(() => ({
                photos: document.querySelectorAll('.assistant-photo-carousel').length,
                stalePhotoButtons: Array.from(
                  document.querySelectorAll(
                    '#assistant-messages .assistant-options:not(#assistant-category-results) .assistant-option-btn',
                  ),
                ).filter(button => button.getAttribute('data-value') === 'ver fotos').length,
              }));
              if (cleanupState.photos !== 0 || cleanupState.stalePhotoButtons !== 0) {
                throw new Error(`Typed category transition left stale detail UI: ${JSON.stringify(cleanupState)}`);
              }

              const routed = await page.evaluate(() => globalThis.__typedMenuRoutes);
              const routedMessages = routed.map(item => item.message);
              for (const expected of [
                ...categoryCases.map(item => item.message),
                'back to main menu',
                'praias',
                'surf',
                'back to filters',
                                    'restaurantes',
              ]) {
                if (!routedMessages.includes(expected)) {
                  throw new Error(`Missing typed menu route for ${expected}: ${JSON.stringify(routedMessages)}`);
                }
              }

              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/assistant-input-menu-flow.log || true
