name: Assistant Input Menu Flow V1 Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/assistant-input-menu-flow-v1-parity.yml
      - apps/morro-digital-platform/src/assistant/**

permissions:
  contents: write

jobs:
  assistant-input-menu-flow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact-head source fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }
          function write(path, source) {
            fs.writeFileSync(path, source);
          }
          function replaceOnce(source, oldText, newText, marker, path) {
            if (source.includes(oldText)) return source.replace(oldText, newText);
            if (source.includes(marker)) return source;
            throw new Error(`Expected source fragment or marker not found in ${path}`);
          }

          {
            const path = 'apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts';
            let source = read(path);
            source = replaceOnce(
              source,
              '.replace(/[^\\p{L}\\p{N}\\s\\[\\]_]/gu, " ")',
              '.replace(/[^\\p{L}\\p{N}\\s[\\]_]/gu, " ")',
              '.replace(/[^\\p{L}\\p{N}\\s[\\]_]/gu, " ")',
              path,
            );
            write(path, source);
          }

          {
            const path = 'apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts';
            let source = read(path);
            source = replaceOnce(
              source,
              '  createAssistantUserProfileManager,\n',
              '  type createAssistantUserProfileManager,\n',
              '  type createAssistantUserProfileManager,\n',
              path,
            );
            write(path, source);
          }

          {
            const path = 'apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts';
            let source = read(path);
            source = replaceOnce(
              source,
`  const metadata = response.metadata;
  if (
    !metadata ||
    typeof metadata !== "object" ||
    metadata.deterministic !== true ||
    metadata.fromLLM === true ||
    !Array.isArray(metadata.exploreCommands)
  ) {
    return [];
  }

  const commands: ExploreLocationsCommand[] = [];
  for (const raw of metadata.exploreCommands) {`,
`  const metadata = response.metadata;
  const rawCommands: unknown =
    metadata && typeof metadata === "object"
      ? metadata.exploreCommands
      : undefined;
  if (
    !metadata ||
    typeof metadata !== "object" ||
    metadata.deterministic !== true ||
    metadata.fromLLM === true ||
    !Array.isArray(rawCommands)
  ) {
    return [];
  }

  const commands: ExploreLocationsCommand[] = [];
  const commandCandidates: readonly unknown[] = rawCommands;
  for (const raw of commandCandidates) {`,
              'const commandCandidates: readonly unknown[] = rawCommands;',
              path,
            );

            if (!source.includes('function readVisiblePresentation(')) {
              const anchor = `function readOptionOverride(\n  value: unknown,\n): readonly AssistantDomOption[] | null {`;
              if (!source.includes(anchor)) throw new Error(`Presentation anchor missing in ${path}`);
              const helper = `function readVisiblePresentation(\n  document: Document,\n): AssistantPresentationSnapshot | null {\n  const flow = document.getElementById("assistant-category-results");\n  const flowButtons = flow\n    ? Array.from(\n        flow.querySelectorAll<HTMLButtonElement>(".assistant-option-btn"),\n      )\n    : [];\n  const dynamicContainers = Array.from(\n    document.querySelectorAll<HTMLElement>(\n      "#assistant-messages .assistant-options",\n    ),\n  ).filter((container) => !container.querySelector("[data-explore-category]"));\n  const dynamicButtons = Array.from(\n    dynamicContainers\n      .at(-1)\n      ?.querySelectorAll<HTMLButtonElement>(".assistant-option-btn") ?? [],\n  );\n  const buttons = flowButtons.length > 0 ? flowButtons : dynamicButtons;\n  const visibleOptions = buttons.flatMap((button) => {\n    const label = button.textContent?.trim();\n    const value = button.dataset.value?.trim();\n    return label && value ? [{ label, value }] : [];\n  });\n  if (visibleOptions.length === 0) return null;\n\n  const text =\n    document\n      .getElementById("assistant-category-results-message")\n      ?.textContent?.trim() ??\n    Array.from(\n      document.querySelectorAll<HTMLElement>(\n        "#assistant-messages .message.assistant",\n      ),\n    )\n      .at(-1)\n      ?.textContent?.trim() ??\n    "";\n  return snapshotPresentation(text, visibleOptions);\n}\n\n`;
              source = source.replace(anchor, helper + anchor);
            }

            source = replaceOnce(
              source,
`    const previousPresentation = preservePreviousOptions
      ? currentPresentation
      : null;`,
`    const visiblePresentation = readVisiblePresentation(options.document);
    const previousPresentation = preservePreviousOptions
      ? currentPresentation ?? visiblePresentation
      : visiblePresentation ?? currentPresentation;`,
              'const visiblePresentation = readVisiblePresentation(options.document);',
              path,
            );

            source = replaceOnce(
              source,
`      currentPresentation = null;
      syncExploreContext();`,
`      syncExploreContext();
      currentPresentation = readVisiblePresentation(options.document);`,
              'currentPresentation = readVisiblePresentation(options.document);',
              path,
            );
            write(path, source);
          }
          NODE
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - name: Validate source closure
        run: |
          pnpm format:check
          pnpm lint
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm -w build
          git diff --check
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/pr73-source-finalizer.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr73-source-finalizer.log
          exit 1
      - name: Validate typed photo continuity
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ temperatureCelsius: 28, temperatureMaxCelsius: 31, temperatureMinCelsius: 24, humidityPercent: 78, windSpeedKph: 18, rainChancePercent: 42, weatherCode: 1, isDay: true, forecast: [] }),
              }));
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({ state: 'attached', timeout: 30000 });
              const quick = page.locator('.mood-button[data-assistant-shell-ready="true"]');
              await quick.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await page.locator('#assistant-messages').isVisible())) await quick.click();
              const input = page.locator('#assistantInput');
              const send = page.locator('#sendButton');
              async function submit(text) {
                await input.fill(text);
                await send.click();
              }
              await submit('praias');
              await page.locator('#assistant-category-results[data-category="beaches"][data-stage="filters"]').waitFor({ state: 'visible', timeout: 8000 });
              await submit('ver todas');
              await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible', timeout: 8000 });
              await submit('Primeira Praia');
              await page.locator('#map[data-explore-category="beaches"][data-explore-stage="detail"][data-map-marker-count="1"]').waitFor({ state: 'attached', timeout: 8000 });
              await page.locator('.assistant-option-btn[data-value="ver fotos"]').waitFor({ state: 'visible', timeout: 8000 });
              await submit('fotos');
              await page.locator('.assistant-photo-carousel').waitFor({ state: 'visible', timeout: 8000 });
              const preserved = await page.locator('.assistant-options[data-presentation="photo-actions"] .assistant-option-btn[data-value="ver fotos"]').count();
              if (preserved < 1) throw new Error('Typed photo actions were not preserved');
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit validated source fixes
        run: |
          git add \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Validated source fixes already present.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(assistant): close exact-head CI regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
