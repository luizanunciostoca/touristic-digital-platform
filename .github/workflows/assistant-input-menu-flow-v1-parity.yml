name: Assistant Input Menu Flow V1 Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/assistant-input-menu-flow-v1-parity.yml
      - apps/morro-digital-platform/public/assistant-input-v1-parity.js
      - apps/morro-digital-platform/public/assistant-menu-flow-v1-parity.js
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - packages/assistant/src/**
      - packages/search/src/**
      - packages/geospatial/src/**

permissions:
  contents: read

jobs:
  assistant-input-menu-flow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-input-menu-flow.log 2>&1 &
          echo $! >/tmp/assistant-input-menu-flow.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-input-menu-flow.log
          exit 1
      - name: Verify typed input drives the same V1 assistant and map flow
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
                globalThis.__typedMenuRoutes = [];
                document.addEventListener('morro:assistant-menu-command-routed', event => {
                  globalThis.__typedMenuRoutes.push(event.detail);
                });
              });

              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  temperatureCelsius: 28,
                  temperatureMaxCelsius: 31,
                  temperatureMinCelsius: 24,
                  humidityPercent: 78,
                  windSpeedKph: 18,
                  rainChancePercent: 42,
                  weatherCode: 1,
                  isDay: true,
                  forecast: [],
                }),
              }));

              await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({
                state: 'attached',
                timeout: 30000,
              });
              await page.locator('body[data-public-onboarding-settled="true"]').waitFor({
                state: 'attached',
                timeout: 5000,
              });

              const assistant = page.locator('#assistant-messages');
              const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
              await quickAction.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await assistant.isVisible())) await quickAction.click();

              const input = page.locator('#assistantInput');
              const send = page.locator('#sendButton');
              await input.waitFor({ state: 'visible', timeout: 5000 });

              async function submit(text, keyboard = false) {
                await input.fill(text);
                if (keyboard) await input.press('Enter');
                else await send.click();
                if ((await input.inputValue()) !== '') {
                  throw new Error(`Handled menu command did not clear input: ${text}`);
                }
              }

              async function waitStage(category, stage, count) {
                await page.locator(
                  `#map[data-explore-category="${category}"][data-explore-stage="${stage}"][data-map-marker-count="${count}"]`,
                ).waitFor({ state: 'attached', timeout: 8000 });
              }

              await submit('praias');
              await page.locator('#assistant-category-results[data-category="beaches"][data-stage="filters"]').waitFor({ state: 'visible' });
              await waitStage('beaches', 'filters', 8);
              const filtersText = await page.locator('#assistant-category-results-message').innerText();
              if (!filtersText.includes('Praias') || !filtersText.includes('8')) {
                throw new Error(`Typed beaches did not open the V1 filter response: ${filtersText}`);
              }

              await submit('surf', true);
              await page.locator('#assistant-category-results[data-category="beaches"][data-stage="places"]').waitFor({ state: 'visible' });
              const surfState = await page.evaluate(() => ({
                places: document.querySelectorAll('#assistant-category-results [data-location-name]').length,
                markers: Number(document.getElementById('map')?.dataset.mapMarkerCount || 0),
              }));
              if (surfState.places < 1 || surfState.places !== surfState.markers) {
                throw new Error(`Typed surf filter diverged: ${JSON.stringify(surfState)}`);
              }

              await submit('voltar aos filtros');
              await page.locator('#assistant-category-results[data-stage="filters"]').waitFor({ state: 'visible' });
              await waitStage('beaches', 'filters', 8);

              await submit('ver todas', true);
              await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible' });
              await waitStage('beaches', 'places', 8);

              await submit('Primeira Praia');
              await waitStage('beaches', 'detail', 1);
              await page.locator('.assistant-option-btn[data-value="ver fotos"]').waitFor({ state: 'visible', timeout: 8000 });

              await submit('fotos', true);
              await page.locator('.assistant-photo-carousel').waitFor({ state: 'visible', timeout: 8000 });
              const detailButtons = await page.locator('.assistant-option-btn[data-value="ver fotos"]').count();
              if (detailButtons < 1) {
                throw new Error('Typed photos did not preserve the V1 detail actions');
              }

              await submit('voltar');
              await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible', timeout: 8000 });
              await waitStage('beaches', 'places', 8);

              await submit('beachs');
              await page.locator('#assistant-category-results[data-category="beaches"][data-stage="filters"]').waitFor({ state: 'visible' });
              await waitStage('beaches', 'filters', 8);

              await submit('restaurantes', true);
              await page.locator('#assistant-category-results[data-category="restaurants"][data-stage="filters"]').waitFor({ state: 'visible' });
              await waitStage('restaurants', 'filters', 45);

              const routed = await page.evaluate(() => globalThis.__typedMenuRoutes);
              const routedMessages = routed.map(item => item.message);
              for (const expected of [
                'praias',
                'surf',
                'voltar aos filtros',
                'ver todas',
                'Primeira Praia',
                'fotos',
                'voltar',
                'beachs',
                'restaurantes',
              ]) {
                if (!routedMessages.includes(expected)) {
                  throw new Error(`Missing typed menu route for ${expected}: ${JSON.stringify(routedMessages)}`);
                }
              }

              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/assistant-input-menu-flow.log || true
