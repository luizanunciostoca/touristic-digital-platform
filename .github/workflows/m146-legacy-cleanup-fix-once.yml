name: Temporary M146 Legacy Cleanup Fix

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-legacy-cleanup-fix-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove M146-only cleanup from legacy schema tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/financial/src/mysql-integration.test.ts')
          s = p.read_text()
          lines = [
              '    await pool.query("DELETE FROM financial_settlements");\n',
              '    await pool.query("DELETE FROM financial_payables");\n',
              '    await pool.query("DELETE FROM financial_allocations");\n',
          ]
          for line in lines:
              if s.count(line) != 1:
                  raise SystemExit(f'expected exactly one cleanup line: {line!r}')
              s = s.replace(line, '', 1)
          p.write_text(s)
          PY
          pnpm exec prettier --check services/financial/src/mysql-integration.test.ts
          pnpm --filter @touristic/financial-server lint
          pnpm --filter @touristic/financial-server typecheck
          git diff --check
      - name: Commit correction and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m146-legacy-cleanup-fix-once.yml
          git add services/financial/src/mysql-integration.test.ts
          git commit -m "test(payments): keep M137 cleanup within legacy schema"
          git push origin HEAD:feat/payments-m146-settlement
