name: M49 Prepare Business Core Once (lint-fixed)

on:
  push:
    branches:
      - feat/business-m49-core-auth-consumer
    paths:
      - .github/workflows/m49-prepare-business-core-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace and update lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format M49 files
        run: pnpm exec prettier --write packages/business pnpm-lock.yaml
      - name: Lint Business core
        run: pnpm --filter @touristic/business lint
      - name: Typecheck Business core
        run: pnpm --filter @touristic/business typecheck
      - name: Test Business core
        run: pnpm --filter @touristic/business test
      - name: Build Business core
        run: pnpm --filter @touristic/business build
      - name: Commit prepared M49 core and remove helper
        run: |
          rm .github/workflows/m49-prepare-business-core-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business pnpm-lock.yaml .github/workflows/m49-prepare-business-core-once.yml
          git commit -m "chore(business): prepare M49 core"
          git push
