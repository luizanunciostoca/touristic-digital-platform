name: One-shot Mercado Pago automatic test credentials fix

on:
  push:
    branches:
      - fix/mercado-pago-auto-test-credentials-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Patch provider, tests, staging contract and runbooks
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          provider_path = "services/financial/src/mercado-pago-provider.ts"
          provider = read(provider_path)
          provider = replace_once(
              provider,
              '  readonly MERCADO_PAGO_CHECKOUT_MODE?: string;\n',
              '  readonly MERCADO_PAGO_CHECKOUT_MODE?: string;\n  readonly MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED?: string;\n',
              "provider env interface",
          )
          provider = replace_once(
              provider,
              'const mercadoLivreApiBaseUrl = new URL("https://api.mercadolibre.com/");\n',
              '',
              "obsolete Mercado Livre base URL",
          )
          pattern = re.compile(
              r'async function requireMercadoPagoTestAccount\(input: \{.*?\n\}\n\nexport function createMercadoPagoCheckoutProviderFromEnvironment',
              re.S,
          )
          replacement = '''function requireMercadoPagoTestCredentialsConfirmation(\n  environment: MercadoPagoProviderEnvironment,\n): void {\n  const confirmed = boundedString(\n    environment.MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED,\n    16,\n  ).toLowerCase();\n  if (confirmed !== "true") {\n    throw new MercadoPagoProviderError("MERCADO_PAGO_TEST_ACCOUNT_REQUIRED");\n  }\n}\n\nexport function createMercadoPagoCheckoutProviderFromEnvironment'''
          provider, count = pattern.subn(replacement, provider, count=1)
          if count != 1:
              raise SystemExit(f"provider test-account guard: expected 1 replacement, found {count}")
          provider = replace_once(
              provider,
              '''        if (mode === "test") {\n          await requireMercadoPagoTestAccount({\n            environment,\n            token,\n            fetch: fetchImpl,\n            timeoutMs: timeout,\n          });\n        }''',
              '''        if (mode === "test") {\n          requireMercadoPagoTestCredentialsConfirmation(environment);\n        }''',
              "provider test-mode call",
          )
          if 'users/me' in provider or 'tags.includes("test_user")' in provider or 'mercadoLivreApiBaseUrl' in provider:
              raise SystemExit("obsolete /users/me test-user inference remains in provider")
          write(provider_path, provider)

          test_path = "services/financial/src/mercado-pago-provider.test.ts"
          test = read(test_path)
          test = replace_once(
              test,
              '    MERCADO_PAGO_CHECKOUT_MODE: "test",\n',
              '    MERCADO_PAGO_CHECKOUT_MODE: "test",\n    MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED: "true",\n',
              "provider test env confirmation",
          )
          helper_pattern = re.compile(r'\nfunction testAccountResponse\(\): Response \{.*?\n\}\n', re.S)
          test, count = helper_pattern.subn('\n', test, count=1)
          if count != 1:
              raise SystemExit(f"testAccountResponse helper: expected 1 replacement, found {count}")
          test = replace_once(
              test,
              '  it("verifies the test seller and creates Checkout Pro preference from authoritative Financial values", async () => {',
              '  it("creates Checkout Pro preference with explicitly confirmed automatic TEST credentials", async () => {',
              "first provider test name",
          )
          test = replace_once(
              test,
              '''          if (url === "https://api.mercadolibre.com/users/me") {\n            return Promise.resolve(testAccountResponse());\n          }\n          return Promise.resolve(''',
              '''          return Promise.resolve(''',
              "first provider fetch",
          )
          test = replace_once(
              test,
              '''    expect(calls.map((call) => call.url)).toEqual([\n      "https://api.mercadolibre.com/users/me",\n      "https://api.mercadopago.com/checkout/preferences",\n    ]);\n    const accountHeaders = new Headers(calls[0]?.init?.headers);\n    expect(accountHeaders.get("Authorization")).toBe(\n      "Bearer fixture-token-not-a-real-credential-with-thirty-two-characters",\n    );\n    const preferenceInit = calls[1]?.init;''',
              '''    expect(calls.map((call) => call.url)).toEqual([\n      "https://api.mercadopago.com/checkout/preferences",\n    ]);\n    const preferenceInit = calls[0]?.init;''',
              "first provider call expectations",
          )
          old_test = re.compile(
              r'  it\("fails closed before preference creation when test mode is not backed by an MLB test user", async \(\) => \{.*?\n  \}\);',
              re.S,
          )
          new_test = '''  it("fails closed before preference creation when TEST credentials are not explicitly confirmed", async () => {\n    let calls = 0;\n    const provider = createMercadoPagoCheckoutProviderFromEnvironment(\n      {\n        ...environment(),\n        MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED: "false",\n      },\n      {\n        fetch: () => {\n          calls += 1;\n          return Promise.resolve(response({}));\n        },\n      },\n    );\n\n    await expect(provider.createCheckout(checkoutRequest())).rejects.toEqual(\n      new MercadoPagoProviderError("MERCADO_PAGO_TEST_ACCOUNT_REQUIRED"),\n    );\n    expect(calls).toBe(0);\n  });'''
          test, count = old_test.subn(new_test, test, count=1)
          if count != 1:
              raise SystemExit(f"unconfirmed TEST credential test: expected 1 replacement, found {count}")
          unsafe_block = '''          if (url === "https://api.mercadolibre.com/users/me") {\n            return Promise.resolve(testAccountResponse());\n          }\n          return Promise.resolve('''
          if unsafe_block in test:
              test = test.replace(unsafe_block, '          return Promise.resolve(', 1)
          if 'api.mercadolibre.com/users/me' in test or 'testAccountResponse' in test:
              raise SystemExit("obsolete users/me test fixture remains")
          write(test_path, test)

          blueprint_path = "render.staging.yaml"
          blueprint = read(blueprint_path)
          blueprint = replace_once(
              blueprint,
              '''      # Payments stays in real-provider TEST mode only. In test mode the adapter\n      # verifies that the credential owner is an MLB `test_user` before creating\n      # a preference, then accepts only official Mercado Pago `init_point` hosts.\n      # Production checkout remains forbidden in this staging Blueprint.''',
              '''      # Payments stays in real-provider TEST mode only. Mercado Pago now issues\n      # automatic TEST credentials for Checkout Pro, so staging requires an explicit\n      # operator confirmation that the server-side token came from Test credentials,\n      # then accepts only official Mercado Pago `init_point` hosts. Production checkout\n      # remains forbidden in this staging Blueprint.''',
              "blueprint payment safety comment",
          )
          blueprint = replace_once(
              blueprint,
              '''      - key: MERCADO_PAGO_CHECKOUT_MODE\n        value: test\n''',
              '''      - key: MERCADO_PAGO_CHECKOUT_MODE\n        value: test\n      - key: MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED\n        sync: false\n''',
              "blueprint TEST confirmation key",
          )
          write(blueprint_path, blueprint)

          checker_path = "tooling/quality/check-render-staging-blueprint.mjs"
          checker = read(checker_path)
          checker = replace_once(
              checker,
              '''for (const required of [\n  'new URL("users/me", mercadoLivreApiBaseUrl)',\n  'tags.includes("test_user")',\n  'siteId !== "MLB"',\n  "payload.init_point",\n  "MERCADO_PAGO_TEST_ACCOUNT_REQUIRED",\n]) {\n  requireText(mercadoPagoProvider, required);\n}\n''',
              '''for (const required of [\n  "MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED",\n  "requireMercadoPagoTestCredentialsConfirmation(environment);",\n  "payload.init_point",\n  "MERCADO_PAGO_TEST_ACCOUNT_REQUIRED",\n]) {\n  requireText(mercadoPagoProvider, required);\n}\nfor (const obsolete of [\n  'new URL("users/me", mercadoLivreApiBaseUrl)',\n  'tags.includes("test_user")',\n  "mercadoLivreApiBaseUrl",\n]) {\n  forbidText(mercadoPagoProvider, obsolete);\n}\n''',
              "blueprint checker provider contract",
          )
          checker = replace_once(
              checker,
              '  "MERCADO_PAGO_ACCESS_TOKEN",\n  "MERCADO_PAGO_WEBHOOK_SECRET",',
              '  "MERCADO_PAGO_ACCESS_TOKEN",\n  "MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED",\n  "MERCADO_PAGO_WEBHOOK_SECRET",',
              "blueprint checker sync-false keys",
          )
          checker = replace_once(
              checker,
              '  "Render staging Blueprint contract valid: canonical repo/main, isolated MySQL 8.4, autoDeploy off, verified Mercado Pago test-account checkout, legacy staging preserved.",',
              '  "Render staging Blueprint contract valid: canonical repo/main, isolated MySQL 8.4, autoDeploy off, explicit Mercado Pago automatic TEST credential confirmation, legacy staging preserved.",',
              "blueprint checker status message",
          )
          write(checker_path, checker)

          env_path = ".env.example"
          env = read(env_path)
          env = replace_once(
              env,
              '''# Exact HTTPS checkout origins accepted from init_point/sandbox_init_point.\n# The Render test Blueprint currently uses the exact sandbox origin documented\n# by Mercado Pago Checkout Pro. Production must be replaced with the exact\n# origin returned by the account's real init_point; never use wildcard.\nMERCADO_PAGO_CHECKOUT_ORIGINS=https://sandbox.mercadopago.com\n\n# production => use init_point; test => use sandbox_init_point.\nMERCADO_PAGO_CHECKOUT_MODE=test\n''',
              '''# Exact HTTPS checkout origins accepted from the provider `init_point`.\n# Keep a strict official-origin allowlist; never use wildcard.\nMERCADO_PAGO_CHECKOUT_ORIGINS=https://www.mercadopago.com,https://www.mercadopago.com.br\n\n# Application policy mode. In TEST mode the runtime additionally requires an\n# explicit operator acknowledgement that MERCADO_PAGO_ACCESS_TOKEN was copied\n# from the application's Tests > Test credentials screen. Mercado Pago's current\n# Checkout Pro flow automatically issues those credentials and does not expose a\n# documented token prefix that distinguishes TEST from production.\nMERCADO_PAGO_CHECKOUT_MODE=test\nMERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED=false\n''',
              "environment Mercado Pago mode docs",
          )
          write(env_path, env)

          envcheck_path = "tooling/quality/check-environment-reconciliation.mjs"
          envcheck = read(envcheck_path)
          envcheck = replace_once(
              envcheck,
              '  "MERCADO_PAGO_CHECKOUT_MODE",\n',
              '  "MERCADO_PAGO_CHECKOUT_MODE",\n  "MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED",\n',
              "environment checker required key",
          )
          envcheck = replace_once(
              envcheck,
              '''const checkoutMode = values.get("MERCADO_PAGO_CHECKOUT_MODE");\nif (checkoutMode !== "test" && checkoutMode !== "production") {\n  throw new Error("MERCADO_PAGO_CHECKOUT_MODE must be test or production");\n}\n''',
              '''const checkoutMode = values.get("MERCADO_PAGO_CHECKOUT_MODE");\nif (checkoutMode !== "test" && checkoutMode !== "production") {\n  throw new Error("MERCADO_PAGO_CHECKOUT_MODE must be test or production");\n}\nconst testCredentialsConfirmed = values.get(\n  "MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED",\n);\nif (testCredentialsConfirmed !== "true" && testCredentialsConfirmed !== "false") {\n  throw new Error(\n    "MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED must be true or false",\n  );\n}\n''',
              "environment checker confirmation validation",
          )
          write(envcheck_path, envcheck)

          staging_doc_path = "docs/deployment/RENDER-STAGING-V2.md"
          staging_doc = read(staging_doc_path)
          staging_doc = replace_once(
              staging_doc,
              '- `MERCADO_PAGO_ACCESS_TOKEN`: access token da aplicação/test account aprovada;\n',
              '- `MERCADO_PAGO_ACCESS_TOKEN`: Access Token exibido em **Testes > Credenciais de teste** da aplicação Checkout Pro aprovada;\n- `MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED`: `true` somente após essa origem TEST ter sido conferida pelo operador;\n',
              "staging runbook payment vars",
          )
          staging_doc = replace_once(
              staging_doc,
              '''Em `MERCADO_PAGO_CHECKOUT_MODE=test`, o adapter faz um read-only em `/users/me` e exige `tags` contendo `test_user` com `site_id=MLB` antes de criar a preferência. Somente depois desse guard ele aceita o `init_point` em uma das origins oficiais acima. Uma credencial que não seja de test user falha fechada antes de qualquer preferência.''',
              '''Em `MERCADO_PAGO_CHECKOUT_MODE=test`, o adapter exige `MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED=true` antes de qualquer chamada de criação de preferência. Essa confirmação registra que o operador conferiu o Access Token diretamente em **Testes > Credenciais de teste**. O fluxo atual do Checkout Pro emite essas credenciais automaticamente; portanto o runtime não infere mais TEST pela tag não documentada de `/users/me`. Depois desse guard, somente o `init_point` em uma das origins oficiais acima é aceito.''',
              "staging runbook obsolete users/me guard",
          )
          write(staging_doc_path, staging_doc)

          mp_doc_path = "docs/deployment/RENDER-MERCADO-PAGO-V2.md"
          mp_doc = read(mp_doc_path)
          mp_doc = replace_once(
              mp_doc,
              '- `MERCADO_PAGO_CHECKOUT_MODE=test` exige que `/users/me` identifique a credencial como `test_user` do site `MLB` antes de criar qualquer preferência;\n',
              '- `MERCADO_PAGO_CHECKOUT_MODE=test` exige `MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED=true`, registrando que o Access Token foi conferido diretamente em **Testes > Credenciais de teste**;\n',
              "Mercado Pago runbook mode guard",
          )
          mp_doc = replace_once(
              mp_doc,
              '''O adapter rejeita credencial não-test antes da preferência e rejeita qualquer checkout origin fora da allowlist.''',
              '''O adapter rejeita TEST mode sem confirmação operacional explícita antes da preferência e rejeita qualquer checkout origin fora da allowlist.''',
              "Mercado Pago runbook safety statement",
          )
          mp_doc = replace_once(
              mp_doc,
              '''Não é necessário preencher manualmente `MERCADO_PAGO_CHECKOUT_ORIGINS` para o primeiro deploy de teste: o Blueprint já fornece `https://www.mercadopago.com,https://www.mercadopago.com.br`. O modo `test` só prossegue depois de comprovar `test_user` + `MLB`; não amplie a allowlist por tentativa e erro.''',
              '''Não é necessário preencher manualmente `MERCADO_PAGO_CHECKOUT_ORIGINS` para o primeiro deploy de teste: o Blueprint já fornece `https://www.mercadopago.com,https://www.mercadopago.com.br`. O modo `test` só prossegue com `MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED=true`, após o operador conferir o Access Token na tela **Testes > Credenciais de teste**; não amplie a allowlist por tentativa e erro.''',
              "Mercado Pago runbook checkout guard",
          )
          write(mp_doc_path, mp_doc)

          print("Patched files:")
          for path in [
              provider_path, test_path, blueprint_path, checker_path, env_path,
              envcheck_path, staging_doc_path, mp_doc_path,
          ]:
              print(path)
          PY

          git grep -n -E 'users/me|tags\.includes\("test_user"\)|sandbox_init_point selection' -- \
            services/financial/src/mercado-pago-provider.ts \
            tooling/quality/check-render-staging-blueprint.mjs \
            docs/deployment/RENDER-STAGING-V2.md \
            docs/deployment/RENDER-MERCADO-PAGO-V2.md || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          services/financial/src/mercado-pago-provider.ts
          services/financial/src/mercado-pago-provider.test.ts
          tooling/quality/check-render-staging-blueprint.mjs
          tooling/quality/check-environment-reconciliation.mjs
          render.staging.yaml
          .env.example
          docs/deployment/RENDER-STAGING-V2.md
          docs/deployment/RENDER-MERCADO-PAGO-V2.md
      - name: Build Financial dependencies
        run: pnpm build
      - name: Run affected provider tests
        run: pnpm --filter @touristic/financial-server exec vitest run src/mercado-pago-provider.test.ts --no-file-parallelism
      - name: Validate staging and environment contracts
        run: |
          node tooling/quality/check-render-staging-blueprint.mjs
          node tooling/quality/check-environment-reconciliation.mjs
      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-mp-auto-test-credentials-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(payments): support automatic Mercado Pago TEST credentials"
          git push origin HEAD:fix/mercado-pago-auto-test-credentials-20260822
