name: Platform Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform-contracts.yml"
      - "package.json"
      - "packages/core/src/**"
      - "apps/morro-digital-platform/src/bootstrap/runtime.ts"
      - "apps/morro-digital-platform/src/config/tour-selection.ts"
      - "docs/contracts/**"
      - "docs/product-architecture/PLATFORM-BIBLE.md"
      - "docs/product-architecture/MODULE-CONTRACTS.md"
      - "docs/qa/PLATFORM-CONTRACTS-OBSERVABILITY-EVIDENCE.md"
      - "tooling/quality/check-platform-contracts.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-contracts.yml"
      - "package.json"
      - "packages/core/src/**"
      - "apps/morro-digital-platform/src/bootstrap/runtime.ts"
      - "apps/morro-digital-platform/src/config/tour-selection.ts"
      - "docs/contracts/**"
      - "docs/product-architecture/PLATFORM-BIBLE.md"
      - "docs/product-architecture/MODULE-CONTRACTS.md"
      - "docs/qa/PLATFORM-CONTRACTS-OBSERVABILITY-EVIDENCE.md"
      - "tooling/quality/check-platform-contracts.mjs"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate canonical platform contracts
        run: pnpm platform:contracts:check
