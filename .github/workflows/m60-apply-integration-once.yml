name: M60 Apply Integration Once

on:
  push:
    branches:
      - feat/business-m60-partner-workspace
    paths:
      - .github/workflows/m60-apply-integration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m60-partner-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply M60 integration
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Explicit runtime context allowlist.
          replace(
              'packages/business/src/onboarding-context.ts',
              '  "tutorialBusinessProfile",\n]);',
              '  "tutorialBusinessProfile",\n  "businessTutorialEventSummary",\n  "businessDemoPromotion",\n  "businessTutorialWorkspace",\n]);',
          )

          # Runtime workspace imports and action types.
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              'import { BUSINESS_ONBOARDING_CATEGORIES } from "@touristic/business/onboarding-steps";\n',
              'import { BUSINESS_ONBOARDING_CATEGORIES } from "@touristic/business/onboarding-steps";\nimport {\n  buildBusinessTutorialPromotion,\n  buildBusinessTutorialWorkspaceSnapshot,\n  incrementBusinessTutorialEventSummary,\n  type BusinessTutorialEventKey,\n} from "@touristic/business/onboarding-workspace";\n',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '  | "profile-promotion"\n  | "route-retry";',
              '  | "profile-promotion"\n  | "route-retry"\n  | "workspace-open-dashboard"\n  | `workspace-promotion-save:${string}`;',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '  beforeTransition(context: BusinessOnboardingGuardContext): boolean {',
              '''  private trackTutorialEvent(key: BusinessTutorialEventKey): void {\n    const context = this.host.snapshot().session.conversationDraft.context;\n    const summary = incrementBusinessTutorialEventSummary(\n      context.businessTutorialEventSummary,\n      key,\n    );\n    this.host.updateRuntimeContext({ businessTutorialEventSummary: summary });\n  }\n\n  beforeTransition(context: BusinessOnboardingGuardContext): boolean {''',
          )

          # Track frozen V1 tutorial events at their existing V2 effects.
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    if (snapshot.stepId === "menu-discovery") {\n      await this.runDiscovery(text(context.category));\n      return;\n    }',
              '    if (snapshot.stepId === "menu-discovery") {\n      await this.runDiscovery(text(context.category));\n      this.trackTutorialEvent("business_discovered_by_menu");\n      return;\n    }',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    if (snapshot.stepId === "text-discovery") {\n      await this.runDiscovery(step.description.replace(/[“”\\"]/gu, ""));\n      return;\n    }',
              '    if (snapshot.stepId === "text-discovery") {\n      await this.runDiscovery(step.description.replace(/[“”\\"]/gu, ""));\n      this.trackTutorialEvent("business_discovered_by_text_search");\n      return;\n    }',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    if (snapshot.stepId === "name-discovery") {\n      await this.runDiscovery(text(context.businessName));\n      return;\n    }',
              '    if (snapshot.stepId === "name-discovery") {\n      await this.runDiscovery(text(context.businessName));\n      this.trackTutorialEvent("business_discovered_by_name");\n      return;\n    }',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '      if (recommendation.rendered) {',
              '      if (recommendation.rendered) {\n        this.trackTutorialEvent("business_recommended_by_assistant");',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '      this.host.updateRuntimeContext({ tutorialBusinessProfile: profile });',
              '      this.host.updateRuntimeContext({ tutorialBusinessProfile: profile });\n      this.trackTutorialEvent("business_profile_opened");',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    if (snapshot.stepId === "route") {\n      await this.verifyRoute(snapshot);\n    }',
              '''    if (snapshot.stepId === "route") {\n      await this.verifyRoute(snapshot);\n      return;\n    }\n\n    if (snapshot.stepId === "partner-panel") {\n      const workspace = buildBusinessTutorialWorkspaceSnapshot({\n        businessName: context.businessName,\n        eventSummary: context.businessTutorialEventSummary,\n      });\n      this.host.updateRuntimeContext({ businessTutorialWorkspace: workspace });\n      dispatch(this.view, "businessTutorialWorkspaceOpened", workspace);\n    }''',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '      this.host.updateRuntimeContext({ businessVoiceDiscoveryReady: true });',
              '      this.host.updateRuntimeContext({ businessVoiceDiscoveryReady: true });\n      this.trackTutorialEvent("business_discovered_by_voice");',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '      if (action === "profile-primary") {\n        dispatch(this.view, "businessTutorialProfilePrimaryAction", {',
              '      if (action === "profile-primary") {\n        this.trackTutorialEvent("business_contact_action");\n        dispatch(this.view, "businessTutorialProfilePrimaryAction", {',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '      dispatch(this.view, "businessTutorialProfilePromotionAction", {',
              '      this.trackTutorialEvent("business_demo_promotion_viewed");\n      dispatch(this.view, "businessTutorialProfilePromotionAction", {',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    if (action === "route-retry") {\n      return this.verifyRoute(this.host.snapshot());\n    }\n\n    return false;',
              '''    if (action === "route-retry") {\n      return this.verifyRoute(this.host.snapshot());\n    }\n\n    if (action === "workspace-open-dashboard") {\n      dispatch(this.view, "businessProtectedDashboardRequested", {\n        href: "/apps/morro-digital-platform/public/business-dashboard.html",\n        tutorial: true,\n        requiresAuthentication: true,\n        excludeFromBusinessMetrics: true,\n      });\n      return true;\n    }\n\n    if (action.startsWith("workspace-promotion-save:")) {\n      let input: Record<string, unknown>;\n      try {\n        input = JSON.parse(\n          decodeURIComponent(action.slice("workspace-promotion-save:".length)),\n        ) as Record<string, unknown>;\n      } catch {\n        return false;\n      }\n      const promotion = buildBusinessTutorialPromotion(input);\n      if (!promotion) return false;\n      this.host.updateRuntimeContext({ businessDemoPromotion: promotion });\n      this.trackTutorialEvent("business_demo_promotion_created");\n      dispatch(this.view, "businessTutorialPromotionSaved", {\n        promotion,\n        tutorial: true,\n        excludeFromBusinessMetrics: true,\n      });\n      return true;\n    }\n\n    return false;''',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-runtime.ts',
              '    dispatch(this.view, "businessTutorialRouteRendered", {',
              '    this.trackTutorialEvent("business_route_started");\n    dispatch(this.view, "businessTutorialRouteRendered", {',
          )

          # Surface workspace rendering and editable sandbox promotion form.
          replace(
              'apps/morro-digital-platform/src/business-onboarding-surface.ts',
              '    root.addEventListener("input", (event) => {',
              '''    root.addEventListener("submit", (event) => {\n      const form = event.target;\n      if (!(form instanceof HTMLFormElement) || form.dataset.workspacePromotion !== "true") return;\n      event.preventDefault();\n      const payload = Object.fromEntries(new FormData(form).entries());\n      void this.handleRuntimeAction(\n        `workspace-promotion-save:${encodeURIComponent(JSON.stringify(payload))}`,\n      );\n    });\n    root.addEventListener("input", (event) => {''',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-surface.ts',
              '  private renderRuntimeActions(\n',
              '''  private renderWorkspaceSummary(\n    container: HTMLElement,\n    workspace: Record<string, unknown>,\n  ): void {\n    const panel = this.document.createElement("article");\n    panel.className = "business-onboarding-workspace-preview";\n    panel.setAttribute("aria-label", "Resumo da sessão demonstrativa");\n    const title = this.document.createElement("h2");\n    title.textContent = `Resultados de ${stringValue(workspace.businessName) || "Sua empresa"}`;\n    const note = this.document.createElement("p");\n    note.textContent = "Estes números pertencem somente a esta demonstração e não alimentam métricas comerciais.";\n    panel.append(title, note);\n    const metrics = Array.isArray(workspace.metrics) ? workspace.metrics : [];\n    const list = this.document.createElement("dl");\n    list.className = "business-onboarding-workspace-metrics";\n    for (const metricValue of metrics) {\n      const metric = objectValue(metricValue);\n      if (!metric) continue;\n      const row = this.document.createElement("div");\n      const label = this.document.createElement("dt");\n      label.textContent = stringValue(metric.label);\n      const value = this.document.createElement("dd");\n      value.textContent = String(typeof metric.value === "number" ? metric.value : 0);\n      row.append(label, value);\n      list.append(row);\n    }\n    panel.append(list);\n    container.append(panel);\n  }\n\n  private renderPromotionForm(\n    container: HTMLElement,\n    context: Readonly<Record<string, unknown>>,\n  ): void {\n    const category = stringValue(context.category);\n    const defaultsByCategory: Record<string, readonly [string, string, string]> = {\n      restaurant: ["Oferta especial de hoje", "Condição exclusiva para quem encontrou a empresa pelo Morro Digital.", "Ver oferta"],\n      lodging: ["Benefício na reserva", "Consulte uma condição especial para sua hospedagem.", "Consultar"],\n      tour: ["Condição especial no passeio", "Garanta uma vantagem ao reservar pelo Morro Digital.", "Reservar"],\n      events: ["Ingresso ou benefício especial", "Confira a condição disponível para este evento.", "Ver evento"],\n    };\n    const [defaultTitle, defaultDescription, defaultCta] = defaultsByCategory[category] ?? ["Oferta especial", "Confira uma condição exclusiva disponível agora.", "Ver oferta"];\n    const form = this.document.createElement("form");\n    form.dataset.workspacePromotion = "true";\n    form.className = "business-onboarding-promotion-form";\n    form.innerHTML = `\n      <label>Título<input name="title" maxlength="90" required></label>\n      <label>Descrição<textarea name="description" maxlength="220" required></textarea></label>\n      <label>Botão<input name="cta" maxlength="50" required></label>\n      <label>Validade<input name="validUntil" type="date"></label>\n      <button type="submit" class="business-onboarding-runtime-action is-primary">Salvar promoção demonstrativa</button>\n    `;\n    const title = form.querySelector<HTMLInputElement>('input[name="title"]');\n    const description = form.querySelector<HTMLTextAreaElement>('textarea[name="description"]');\n    const cta = form.querySelector<HTMLInputElement>('input[name="cta"]');\n    if (title) title.value = defaultTitle;\n    if (description) description.value = defaultDescription;\n    if (cta) cta.value = defaultCta;\n    container.append(form);\n  }\n\n  private renderRuntimeActions(\n''',
          )
          replace(
              'apps/morro-digital-platform/src/business-onboarding-surface.ts',
              '    } else if (snapshot.stepId === "route") {',
              '''    } else if (snapshot.stepId === "promotions") {\n      this.renderPromotionForm(container, context);\n    } else if (snapshot.stepId === "partner-panel") {\n      const workspace = objectValue(context.businessTutorialWorkspace);\n      if (workspace) this.renderWorkspaceSummary(container, workspace);\n      this.appendRuntimeButton(\n        actions,\n        "workspace-open-dashboard",\n        "Abrir dashboard protegido",\n        true,\n      );\n    } else if (snapshot.stepId === "route") {''',
          )

          # Real page import map for lazy workspace subpath.
          replace(
              'apps/morro-digital-platform/public/business-onboarding.html',
              '          "@touristic/business/onboarding-profile": "/packages/business/dist/onboarding-profile.js",',
              '          "@touristic/business/onboarding-profile": "/packages/business/dist/onboarding-profile.js",\n          "@touristic/business/onboarding-workspace": "/packages/business/dist/onboarding-workspace.js",',
          )
          PY
      - run: pnpm exec prettier --write packages/business/src/onboarding-context.ts apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/public/business-onboarding.html
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/src/onboarding-context.ts apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/public/business-onboarding.html
          git commit -m "feat(business): integrate M60 partner workspace runtime"
          git push origin HEAD:feat/business-m60-partner-workspace
