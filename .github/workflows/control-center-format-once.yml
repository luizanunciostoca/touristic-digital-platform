name: Control Center Format Once

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/control-center-format-once.yml"

permissions:
  contents: write

concurrency:
  group: control-center-format-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 227 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format mission files with repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-primitives.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/control-center-accessibility-browser-contract.mjs \
            apps/morro-digital-platform/tooling/control-center-responsive-browser-contract.mjs
      - name: Commit deterministic formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "FORMAT_ALREADY_CLEAN"
            exit 0
          fi
          git config user.name "morro-digital-ci"
          git config user.email "morro-digital-ci@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center-primitives.js \
            apps/control-center/public/control-center.css \
            apps/control-center/public/control-center.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-ux-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/control-center-accessibility-browser-contract.mjs \
            apps/morro-digital-platform/tooling/control-center-responsive-browser-contract.mjs
          git commit -m "style(control-center): format reusable UX final"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
