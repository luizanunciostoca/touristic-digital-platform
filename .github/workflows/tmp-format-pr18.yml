name: Temporary PR18 Formatter

on:
  push:
    branches:
      - fix/mercado-pago-modern-test-checkout-20260822
    paths:
      - ".github/workflows/tmp-format-pr18.yml"
      - "services/financial/src/mercado-pago-provider.ts"
      - "tooling/quality/check-render-staging-blueprint.mjs"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mercado-pago-modern-test-checkout-20260822
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only PR18 files
        run: pnpm exec prettier --write services/financial/src/mercado-pago-provider.ts tooling/quality/check-render-staging-blueprint.mjs
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/financial/src/mercado-pago-provider.ts tooling/quality/check-render-staging-blueprint.mjs; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/financial/src/mercado-pago-provider.ts tooling/quality/check-render-staging-blueprint.mjs
          git commit -m "style(payments): apply canonical formatting"
          git push origin HEAD:fix/mercado-pago-modern-test-checkout-20260822
