name: Ops Apply Order Confirmation Projection Fix

on:
  push:
    branches:
      - ops/fix-order-confirmation-projection-7ce8d69-20260824

permissions:
  contents: write

concurrency:
  group: ops-fix-order-confirmation-projection
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: fix/mercado-pago-bricks-subscriptions-20260823
      EXPECTED_HEAD: 7ce8d69d1efc945ab39b254fc7df2fd6b455c598
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Guard exact target head
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:tooling/ops-apply-order-confirmation-projection.py" > /tmp/apply-order-projection.py
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$actual" = "$EXPECTED_HEAD" || { echo "EXPECTED_HEAD_MISMATCH actual=$actual"; exit 1; }
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
      - name: Apply minimal projection patch
        run: python /tmp/apply-order-projection.py
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build workspace entrypoints
        run: corepack pnpm build
      - name: Run focused regression
        run: node --test apps/morro-digital-platform/tooling/payments-order-confirmation.test.mjs
      - name: Format touched files
        run: corepack pnpm exec prettier --write apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/payments-order-confirmation.test.mjs
      - name: Validate formatting and diff
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm exec prettier --check apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/payments-order-confirmation.test.mjs
          git diff --check
      - name: Commit and push exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/payments-order-confirmation.test.mjs
          git commit -m "fix(payments): confirm order after verified payment"
          git push origin "HEAD:$TARGET_BRANCH"
