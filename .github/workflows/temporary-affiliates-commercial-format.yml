name: Temporary Affiliates Commercial Format

on:
  push:
    branches:
      - fix/affiliates-commercial-clean-20260824

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/affiliates-commercial-clean-20260824
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: pnpm exec prettier --write services/affiliates/src/affiliate-commercial-application-service.ts services/affiliates/src/affiliate-eligibility-gate.ts services/affiliates/src/commercial-mysql-integration.test.ts
      - name: Commit formatter delta
        shell: bash
        run: |
          if git diff --quiet -- services/affiliates/src/affiliate-commercial-application-service.ts services/affiliates/src/affiliate-eligibility-gate.ts services/affiliates/src/commercial-mysql-integration.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/affiliates/src/affiliate-commercial-application-service.ts services/affiliates/src/affiliate-eligibility-gate.ts services/affiliates/src/commercial-mysql-integration.test.ts
          git commit -m "style(affiliates): apply canonical prettier"
          git push origin HEAD:fix/affiliates-commercial-clean-20260824
