name: Morro Digital Performance Budget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/morro-performance-budget.yml
      - tooling/performance/**
      - apps/morro-digital-platform/src/**
      - apps/morro-digital-platform/public/**
      - packages/assistant/src/**
      - packages/core/src/**
      - packages/geospatial/src/**
      - packages/navigation/src/**
      - packages/search/src/**
      - package.json
      - pnpm-lock.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/morro-performance-budget.yml
      - tooling/performance/**
      - apps/morro-digital-platform/src/**
      - apps/morro-digital-platform/public/**
      - packages/assistant/src/**
      - packages/core/src/**
      - packages/geospatial/src/**
      - packages/navigation/src/**
      - packages/search/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-budget:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm -w build
      - name: Enforce Morro Digital asset budgets
        run: |
          mkdir -p /tmp/morro-performance
          node tooling/performance/check-morro-digital-budget.mjs |
            tee /tmp/morro-performance/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: morro-performance-budget
          path: /tmp/morro-performance/report.json
          retention-days: 7
          if-no-files-found: error
