name: Temporary Assistant Place Action Finalizer

on:
  push:
    branches:
      - fix/assistant-v1-place-action-parity
    paths:
      - tooling/patch-assistant-place-actions.mjs
      - .github/workflows/tmp-assistant-place-action-finalizer.yml
      - apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts
      - apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/assistant-v1-place-action-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply runtime integration
        run: node tooling/patch-assistant-place-actions.mjs
      - name: Format affected source
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts
          apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
      - name: Validate affected source
        run: |
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          git diff --check
      - name: Commit validated source integration
        run: |
          if git diff --quiet -- \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          git commit -m "fix(assistant): execute V1 place actions deterministically"
          git push origin HEAD:fix/assistant-v1-place-action-parity
