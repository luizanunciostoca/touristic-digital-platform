name: M34 Mapbox Contract Fix Once

on:
  push:
    branches:
      - feat/assistant-m34-shell-ui-parity

permissions:
  contents: write

jobs:
  align-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m34-shell-ui-parity
      - name: Align visual contract with audited V1 shell lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mapbox-visual-contract-regression.yml')
          text = path.read_text()
          old = """            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitReady(page);
            const state = await readContract(page);
"""
          new = """            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitReady(page);

            const initialAssistantVisible = await page.evaluate(() =>
              Boolean(document.querySelector('#assistant-messages:not(.hidden)')),
            );
            if (initialAssistantVisible) {
              throw new Error(`Assistant must start hidden like audited V1 for ${name}.`);
            }

            await page.locator('.quick-actions .action-button.primary').click();
            await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });
            const state = await readContract(page);
"""
          if old not in text:
              raise SystemExit('Mapbox contract insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit aligned contract and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m34-mapbox-contract-fix-once.yml
          git add .github/workflows/mapbox-visual-contract-regression.yml
          git commit -m "test(mapbox): align visual contract with V1 assistant lifecycle"
          git push origin HEAD:feat/assistant-m34-shell-ui-parity
