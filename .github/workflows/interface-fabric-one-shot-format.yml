name: Interface Fabric One-Shot Formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-fabric-one-shot-format.yml"
      - ".morro/changesets/MD-INTERFACE-FABRIC-ISOLATED-COMPOSITION.json"
      - "labs/interface-fabric/**"

permissions:
  contents: write

concurrency:
  group: interface-fabric-one-shot-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/interface-fabric-isolated-completion-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply repository Prettier
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            .morro/changesets/MD-INTERFACE-FABRIC-ISOLATED-COMPOSITION.json \
            labs/interface-fabric
      - name: Remove one-shot workflow from final branch state
        run: rm -f .github/workflows/interface-fabric-one-shot-format.yml
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/interface-fabric-one-shot-format.yml \
            .morro/changesets/MD-INTERFACE-FABRIC-ISOLATED-COMPOSITION.json \
            labs/interface-fabric
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(interface-fabric): apply canonical formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
