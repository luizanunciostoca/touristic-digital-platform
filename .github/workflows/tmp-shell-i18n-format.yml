name: Temporary Shell I18n Format

on:
  push:
    branches:
      - fix/shell-v1-i18n-parity

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/shell-v1-i18n-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format shell i18n tests
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/runtime/shell-v1-i18n.test.ts \
            apps/morro-digital-platform/tooling/shell-v1-i18n-browser-parity.mjs
      - name: Verify formatting diff
        run: |
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/runtime/shell-v1-i18n.test.ts \
            apps/morro-digital-platform/tooling/shell-v1-i18n-browser-parity.mjs
          git diff --check
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/runtime/shell-v1-i18n.test.ts \
            apps/morro-digital-platform/tooling/shell-v1-i18n-browser-parity.mjs
          git diff --cached --check
          git commit -m "style(i18n): format shell parity coverage"
          git push origin HEAD:fix/shell-v1-i18n-parity
