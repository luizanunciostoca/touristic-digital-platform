name: M56 App Lint Fix Once

on:
  push:
    branches:
      - feat/business-m56-onboarding-step-contracts
    paths:
      - .github/workflows/m56-app-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m56-onboarding-step-contracts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix strict app lint findings
        run: |
          python <<'PY'
          from pathlib import Path

          runtime = Path('apps/morro-digital-platform/src/business-onboarding-runtime.ts')
          text = runtime.read_text()
          text = text.replace(
              '  async beforeTransition(\n    context: BusinessOnboardingGuardContext,\n  ): Promise<boolean> {',
              '  beforeTransition(context: BusinessOnboardingGuardContext): boolean {'
          )
          runtime.write_text(text)

          surface = Path('apps/morro-digital-platform/src/business-onboarding-surface.ts')
          text = surface.read_text()
          marker = 'function contextValue(\n'
          helper = '''function stringValue(value: unknown): string {\n  return typeof value === "string" ? value : "";\n}\n\n'''
          if helper.strip() not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace(
              '    const selected = String(\n      snapshot.session.conversationDraft.context[field] ?? "",\n    );',
              '    const selected = stringValue(\n      snapshot.session.conversationDraft.context[field],\n    );'
          )
          text = text.replace(
              '      input.value = String(context[definition.field] ?? "");',
              '      input.value = stringValue(context[definition.field]);'
          )
          surface.write_text(text)
          PY
      - name: Format changed files
        run: pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts
      - name: Validate app lint and typecheck
        run: |
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m56-app-lint-fix-once.yml
          git add apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts
          git commit -m "fix(business): satisfy strict app lint"
          git push origin HEAD:feat/business-m56-onboarding-step-contracts
