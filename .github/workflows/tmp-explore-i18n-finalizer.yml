name: Temporary Explore V1 I18n Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-explore-i18n-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/explore-v1-i18n-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply V1 Explore localization parity
        run: python tooling/tmp-explore-i18n-finalizer.py
      - name: Format localization source
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/map/explore-v1-i18n.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
      - name: Validate localization parity
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/map/explore-v1-i18n.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          git diff --check
      - name: Commit validated localization parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/morro-digital-platform/src/map/explore-v1-i18n.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          git diff --cached --quiet && { echo 'No localization changes'; exit 1; }
          git commit -m 'fix(explore): restore V1 multilingual presentation parity'
          git push origin HEAD:fix/explore-v1-i18n-parity
