name: Temporary Explore V1 I18n Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-explore-i18n-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/explore-v1-i18n-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply V1 Explore localization parity
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('apps/morro-digital-platform/src')
          i18n = root / 'map/explore-v1-i18n.ts'
          actions = root / 'map/explore-location-actions-v1.ts'
          flow = root / 'map/explore-locations-v1-flow.ts'
          control = root / 'map/explore-locations-control.ts'
          adapter = root / 'assistant/assistant-v1-place-action-adapter.ts'
          flow_test = root / 'map/explore-locations-v1-flow.test.ts'
          actions_test = root / 'map/explore-location-actions-v1.test.ts'
          adapter_test = root / 'assistant/assistant-v1-place-action-adapter.test.ts'

