          actions.write_text(r'''import type { AssistantLocale } from "@touristic/assistant";

import { getV1ExploreLabel, type V1ExploreLabelKey } from "./explore-v1-i18n.js";

export type V1ExplorePlaceAction = "command" | "back-places";

export interface V1ExplorePlaceActionOption {
  readonly label: string;
  readonly value: string;
  readonly action: V1ExplorePlaceAction;
}

type ActionSpec = Readonly<{ icon: string; key: V1ExploreLabelKey; value: string }>;

const command = (spec: ActionSpec, locale: AssistantLocale): V1ExplorePlaceActionOption =>
  Object.freeze({
    label: `${spec.icon} ${getV1ExploreLabel(spec.key, locale)}`,
    value: spec.value,
    action: "command" as const,
  });

const backToPlaces = (category: string, locale: AssistantLocale): V1ExplorePlaceActionOption =>
  Object.freeze({
    label: `⬅️ ${getV1ExploreLabel("back", locale)}`,
    value: `[sub]${category}`,
    action: "back-places" as const,
  });

const GENERIC_PLACE_ACTIONS: readonly ActionSpec[] = Object.freeze([
  { icon: "📍", key: "directions", value: "como chegar" },
  { icon: "📸", key: "photos", value: "ver fotos" },
  { icon: "ℹ️", key: "moreInformation", value: "mais detalhes" },
