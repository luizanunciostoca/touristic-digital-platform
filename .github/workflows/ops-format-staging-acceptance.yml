name: Ops Format Staging Acceptance

on:
  push:
    branches:
      - ops/format-staging-acceptance-8b267-20260824

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            tooling/render/with-staging-mysql-env.mjs \
            tooling/render/with-staging-mysql-env.test.mjs
          pnpm format:check
          node --test tooling/render/with-staging-mysql-env.test.mjs
          git diff --check
      - name: Commit formatted blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/render/with-staging-mysql-env.mjs tooling/render/with-staging-mysql-env.test.mjs
          if git diff --cached --quiet; then
            echo "FORMAT_ALREADY_CANONICAL=YES"
            exit 0
          fi
          git commit -m "chore(ops): format staging acceptance auth"
          git push origin HEAD:ops/format-staging-acceptance-8b267-20260824
