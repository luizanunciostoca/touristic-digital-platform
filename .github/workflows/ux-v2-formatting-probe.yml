name: UX V2 Formatting Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ux-v2-formatting-probe.yml"
      - "apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts"
      - "docs/ux/manual-visual-conformance-v2.md"
      - "tests/visual-regression/ux-v2-manual-reference-matrix.json"
      - "tooling/visual/validate-ux-v2-manual-authority.mjs"

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Produce canonical Prettier patch
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts             docs/ux/manual-visual-conformance-v2.md             tests/visual-regression/ux-v2-manual-reference-matrix.json             tooling/visual/validate-ux-v2-manual-authority.mjs
          echo '<<<PRETTIER_PATCH_START>>>'
          git diff --no-color --             apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts             docs/ux/manual-visual-conformance-v2.md             tests/visual-regression/ux-v2-manual-reference-matrix.json             tooling/visual/validate-ux-v2-manual-authority.mjs
          echo '<<<PRETTIER_PATCH_END>>>'
