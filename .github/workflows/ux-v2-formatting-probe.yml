name: UX V2 Formatting Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ux-v2-formatting-probe.yml"

permissions:
  contents: write

jobs:
  prettier-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting and remove probe
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          pnpm exec prettier --write             apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts             docs/ux/manual-visual-conformance-v2.md             tests/visual-regression/ux-v2-manual-reference-matrix.json             tooling/visual/validate-ux-v2-manual-authority.mjs
          git rm .github/workflows/ux-v2-formatting-probe.yml
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts             docs/ux/manual-visual-conformance-v2.md             tests/visual-regression/ux-v2-manual-reference-matrix.json             tooling/visual/validate-ux-v2-manual-authority.mjs
          git diff --cached --check
          git commit -m "style(ux-v2): format manual golden authority"
          git push origin "HEAD:${HEAD_BRANCH}"
