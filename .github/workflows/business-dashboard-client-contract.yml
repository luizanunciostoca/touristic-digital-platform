name: Business Dashboard Client Contract

on:
  pull_request:
    paths:
      - "packages/auth-browser/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-dashboard-client.ts"
      - "apps/morro-digital-platform/src/business-dashboard-client.test.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/business-dashboard-client-contract.yml"
  push:
    branches:
      - main
    paths:
      - "packages/auth-browser/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-dashboard-client.ts"
      - "apps/morro-digital-platform/src/business-dashboard-client.test.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/business-dashboard-client-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Auth browser Business protection
        run: |
          pnpm --filter @touristic/auth-browser lint
          pnpm --filter @touristic/auth-browser typecheck
          pnpm --filter @touristic/auth-browser test
      - name: Build workspace
        run: pnpm -w build
      - name: Validate Business dashboard consumer
        run: |
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
