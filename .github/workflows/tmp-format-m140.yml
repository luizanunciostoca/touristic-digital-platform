name: Temporary Format M140

on:
  push:
    branches:
      - feat/payments-m140-sandbox-provider

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m140-sandbox-provider
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M140 files
        run: |
          pnpm exec prettier --write \
            .env.example \
            .github/workflows/payments-sandbox-provider-contract.yml \
            apps/morro-digital-platform/tooling/payments-api.mjs \
            docs/migration/MASTER-MIGRATION-TRACKER.md \
            docs/migration/PAYMENTS-MIGRATION-MATRIX.md \
            docs/qa/PAYMENTS-M140-EVIDENCE.md \
            packages/financial/src/index.ts \
            packages/financial/src/provider-checkout-contract.test.ts \
            README.md \
            services/financial/src/index.ts \
            services/financial/src/sandbox-checkout-provider.test.ts \
            services/financial/src/sandbox-checkout-provider.ts \
            services/ordering/src/checkout-http-transport.test.ts \
            services/ordering/src/checkout-http-transport.ts \
            tooling/payments/checkout-mysql-integration.test.ts \
            tooling/payments/provider-sandbox-contract.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(payments): format M140 changes"
            git push origin HEAD:feat/payments-m140-sandbox-provider
          fi
