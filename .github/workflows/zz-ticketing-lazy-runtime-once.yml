name: Ticketing Lazy Runtime Once

on:
  push:
    branches:
      - fix/ticketing-feature-0011-current-main
    paths:
      - ".github/workflows/zz-ticketing-lazy-runtime-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticketing-feature-0011-current-main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded lazy-runtime patch
        run: |
          python3 .github/scripts/zz_ticketing_lazy_runtime_once.py
          pnpm exec prettier --write apps/morro-digital-platform/tooling/dev-server.mjs
      - name: Build legacy startup dependencies only
        run: |
          pnpm turbo run build --filter=@touristic/auth-server --filter=@touristic/business --filter=@touristic/crm-server --filter=@touristic/financial-server --filter=@touristic/ordering-server
          pnpm --filter @touristic/morro-digital-platform build
      - name: Prove legacy server starts without Ticketing build
        shell: bash
        run: |
          set -euo pipefail
          test ! -e packages/ticketing/dist/index.js
          test ! -e services/ticketing/dist/index.js
          PORT=4198 HOST=127.0.0.1 node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/ticketing-lazy-legacy.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4198/runtime-config.js >/dev/null; then break; fi
            sleep .25
          done
          curl --fail --silent http://127.0.0.1:4198/runtime-config.js >/dev/null
          curl --fail --silent http://127.0.0.1:4198/dashboard/login.html >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
      - name: Build Ticketing runtime artifacts
        run: |
          pnpm --filter @touristic/ticketing build
          pnpm --filter @touristic/ticketing-server build
      - name: Prove Ticketing route lazy-loads after artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          PORT=4199 HOST=127.0.0.1 node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/ticketing-lazy-route.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4199/runtime-config.js >/dev/null; then break; fi
            sleep .25
          done
          status=$(curl --silent --output /tmp/ticketing-lazy-response.json --write-out '%{http_code}' http://127.0.0.1:4199/api/ticketing/_lazy_probe)
          test "$status" != "500"
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
      - name: Commit validated lazy runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/dev-server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(ticketing): lazy-load runtime from public server"
          git push origin HEAD:fix/ticketing-feature-0011-current-main
