name: Temporary Clipped Rail Formatter

on:
  push:
    branches:
      - fix/context-rail-back-left-no-overlap-20260924
    paths:
      - .github/workflows/tmp-clipped-rail-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/context-rail-back-left-no-overlap-20260924
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format rail files
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/src/layouts/app-shell.ts             apps/morro-digital-platform/public/tourist-shell-v2.css             apps/morro-digital-platform/src/ux/context-rail-button-system.test.ts
      - name: Commit and push formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/morro-digital-platform/src/layouts/app-shell.ts             apps/morro-digital-platform/public/tourist-shell-v2.css             apps/morro-digital-platform/src/ux/context-rail-button-system.test.ts
          git commit -m "style(rail): format clipped viewport correction"
          git pull --rebase origin fix/context-rail-back-left-no-overlap-20260924
          git push origin HEAD:fix/context-rail-back-left-no-overlap-20260924
