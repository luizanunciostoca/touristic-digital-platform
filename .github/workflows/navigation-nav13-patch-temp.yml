name: Patch NAV-13 Temp

on:
  push:
    branches:
      - feat/navigation-browser-entry-runtime
    paths:
      - .github/workflows/navigation-nav13-patch-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-browser-entry-runtime
      - name: Patch browser entry runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/src/browser-entry.ts')
          text = path.read_text()

          old = 'import { bootstrapMorroDigitalApplication } from "./main.js";\nimport { loadMapboxGlSdk } from "./runtime/mapbox-sdk-loader.js";'
          new = 'import { bootstrapMorroDigitalApplication } from "./main.js";\nimport {\n  installBrowserNavigationRuntime,\n  type BrowserNavigationRuntimeInstall,\n} from "./navigation/browser-navigation-runtime-install.js";\nimport { loadMapboxGlSdk } from "./runtime/mapbox-sdk-loader.js";'
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = 'let activeRealMap: MapboxGlMapLike | undefined;\n\nfunction updateStatus(message: string): void {'
          new = 'let activeRealMap: MapboxGlMapLike | undefined;\nlet activeNavigationRuntimeInstall: BrowserNavigationRuntimeInstall | undefined;\n\nfunction clearBrowserNavigationRuntime(): void {\n  activeNavigationRuntimeInstall?.destroy();\n  activeNavigationRuntimeInstall = undefined;\n}\n\nfunction updateStatus(message: string): void {'
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new, 1)

          old = 'function prepareMapContainerForFallback(): void {\n  activeRealMap = undefined;'
          new = 'function prepareMapContainerForFallback(): void {\n  clearBrowserNavigationRuntime();\n  activeRealMap = undefined;'
          if old not in text:
              raise SystemExit('fallback anchor not found')
          text = text.replace(old, new, 1)

          old = '''            onMapCreated: (map: MapboxGlMapLike) => {\n              activeRealMap = map;\n              setV1MapboxCompatibilityAliases(map);\n            },'''
          new = '''            onMapCreated: (map: MapboxGlMapLike) => {\n              clearBrowserNavigationRuntime();\n              activeRealMap = map;\n              setV1MapboxCompatibilityAliases(map);\n              activeNavigationRuntimeInstall = installBrowserNavigationRuntime({\n                map,\n                sdk: provider.sdk,\n                document,\n              });\n            },'''
          if old not in text:
              raise SystemExit('onMapCreated anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format changed entrypoint
        run: npx prettier --write apps/morro-digital-platform/src/browser-entry.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/browser-entry.ts
          git commit -m "feat: install navigation runtime on real Mapbox lifecycle"
          git push origin HEAD:feat/navigation-browser-entry-runtime
