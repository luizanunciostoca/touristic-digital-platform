name: Control Center Prettier Once

on:
  push:
    branches:
      - wave/control-center-shell-sidebar-v1-20260922
    paths:
      - ".github/workflows/control-center-prettier-once.yml"

permissions:
  contents: read

concurrency:
  group: control-center-prettier-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format source contract
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts
          mkdir -p /tmp/control-center-prettier-once
          cp apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts /tmp/control-center-prettier-once/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-prettier-once-output
          path: /tmp/control-center-prettier-once
          retention-days: 1
