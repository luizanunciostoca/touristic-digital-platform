name: M28 Run Finalize
on:
  push:
    branches: [feat/assistant-m28-voice-synthesis]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node apps/morro-digital-platform/tooling/m28-finalize.mjs
      - run: pnpm exec prettier --write packages/assistant/src/voice-synthesis.ts packages/assistant/src/voice-synthesis.test.ts packages/assistant/src/index.ts apps/morro-digital-platform/src/assistant/assistant-voice-adapter.ts apps/morro-digital-platform/src/assistant/assistant-voice-adapter.test.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/tooling/m28-finalize.mjs docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - run: pnpm format:check
      - run: pnpm architecture:check
      - run: pnpm features:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit finalized files
        run: |
          rm -rf .turbo
          rm .github/workflows/m28-run-finalize.yml
          rm apps/morro-digital-platform/tooling/m28-finalize.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(assistant): finalize M28 voice synthesis'
          git push
