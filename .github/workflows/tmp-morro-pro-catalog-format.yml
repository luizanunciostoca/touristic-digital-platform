name: Temporary Morro Pro Catalog Formatter

on:
  push:
    branches: [feat/morro-pro-catalog-crud-20260925]
    paths:
      - ".github/workflows/tmp-morro-pro-catalog-format.yml"
      - ".github/workflows/morro-pro-canonical-catalog.yml"
      - "apps/morro-digital-platform/src/business-dashboard-client.test.ts"
      - "apps/morro-digital-platform/src/business-dashboard-client.ts"
      - "apps/morro-digital-platform/src/business-dashboard-surface.test.ts"
      - "apps/morro-digital-platform/src/business-dashboard-surface.ts"
      - "apps/morro-digital-platform/src/morro-pro-business-management.test.ts"
      - "apps/morro-digital-platform/src/morro-pro-business-management.ts"
      - "apps/morro-digital-platform/tooling/business-api.mjs"
      - "apps/morro-digital-platform/tooling/business-api-catalog.invariants.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.mjs"

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(auto)')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/morro-pro-catalog-crud-20260925
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files
        run: |
          pnpm exec prettier --write \
            .github/workflows/morro-pro-canonical-catalog.yml \
            apps/morro-digital-platform/src/business-dashboard-client.test.ts \
            apps/morro-digital-platform/src/business-dashboard-client.ts \
            apps/morro-digital-platform/src/business-dashboard-surface.test.ts \
            apps/morro-digital-platform/src/business-dashboard-surface.ts \
            apps/morro-digital-platform/src/morro-pro-business-management.test.ts \
            apps/morro-digital-platform/src/morro-pro-business-management.ts \
            apps/morro-digital-platform/tooling/business-api.mjs \
            apps/morro-digital-platform/tooling/business-api-catalog.invariants.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/morro-pro-canonical-catalog.yml \
            apps/morro-digital-platform/src/business-dashboard-client.test.ts \
            apps/morro-digital-platform/src/business-dashboard-client.ts \
            apps/morro-digital-platform/src/business-dashboard-surface.test.ts \
            apps/morro-digital-platform/src/business-dashboard-surface.ts \
            apps/morro-digital-platform/src/morro-pro-business-management.test.ts \
            apps/morro-digital-platform/src/morro-pro-business-management.ts \
            apps/morro-digital-platform/tooling/business-api.mjs \
            apps/morro-digital-platform/tooling/business-api-catalog.invariants.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            apps/morro-digital-platform/tooling/place-platform-runtime.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(auto): format Morro Pro catalog"
            git push origin HEAD:feat/morro-pro-catalog-crud-20260925
          fi
