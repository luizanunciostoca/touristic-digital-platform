name: Ops Payments Transient Metadata V2

on:
  push:
    branches:
      - ops/payments-transient-metadata-v2-ec021bb-20260824

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ec021bb18dc09ecf88e9b753ee723c919d9dceed
      TARGET_BRANCH: fix/mercado-pago-bricks-subscriptions-20260823
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard exact head and apply minimal observability patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$actual" = "$EXPECTED_HEAD" || { echo "EXPECTED_HEAD_MISMATCH actual=$actual"; exit 1; }
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          retry_path = Path('services/financial/src/provider-retry.ts')
          retry = retry_path.read_text()
          old_class = '''export class ProviderRequestUnavailableError extends Error {
            readonly httpStatus: number | null;

            constructor(httpStatus?: number) {
              super("PROVIDER_REQUEST_UNAVAILABLE");
              this.name = "ProviderRequestUnavailableError";
              this.httpStatus =
                typeof httpStatus === "number" &&
                Number.isInteger(httpStatus) &&
                httpStatus >= 100 &&
                httpStatus <= 599
                  ? httpStatus
                  : null;
            }
          }
          '''
          new_class = '''export interface ProviderUnavailableResponseMetadata {
            readonly providerRequestId?: string | null;
            readonly retryAfter?: string | null;
            readonly contentType?: string | null;
          }

          function boundedResponseMetadataValue(
            value: string | null | undefined,
            maxLength: number,
          ): string | null {
            if (typeof value !== "string") return null;
            const normalized = value.trim();
            if (
              !normalized ||
              normalized.length > maxLength ||
              /[\\u0000-\\u001f\\u007f]/u.test(normalized)
            ) {
              return null;
            }
            return normalized;
          }

          export class ProviderRequestUnavailableError extends Error {
            readonly httpStatus: number | null;
            readonly providerRequestId: string | null;
            readonly retryAfter: string | null;
            readonly contentType: string | null;

            constructor(
              httpStatus?: number,
              metadata: ProviderUnavailableResponseMetadata = {},
            ) {
              super("PROVIDER_REQUEST_UNAVAILABLE");
              this.name = "ProviderRequestUnavailableError";
              this.httpStatus =
                typeof httpStatus === "number" &&
                Number.isInteger(httpStatus) &&
                httpStatus >= 100 &&
                httpStatus <= 599
                  ? httpStatus
                  : null;
              this.providerRequestId = boundedResponseMetadataValue(
                metadata.providerRequestId,
                120,
              );
              this.retryAfter = boundedResponseMetadataValue(metadata.retryAfter, 120);
              this.contentType = boundedResponseMetadataValue(metadata.contentType, 120);
            }
          }
          '''
          if retry.count(old_class) != 1:
              raise SystemExit(f'RETRY_CLASS_ANCHOR_COUNT={retry.count(old_class)}')
          retry = retry.replace(old_class, new_class, 1)
          old_final = '''    await discardResponse(response);
              if (attempt >= attempts) {
                throw new ProviderRequestUnavailableError(response.status);
              }
          '''
          new_final = '''    const transientMetadata = {
                providerRequestId: response.headers.get("x-request-id"),
                retryAfter: response.headers.get("retry-after"),
                contentType: response.headers.get("content-type"),
              };
              await discardResponse(response);
              if (attempt >= attempts) {
                throw new ProviderRequestUnavailableError(
                  response.status,
                  transientMetadata,
                );
              }
          '''
          if retry.count(old_final) != 1:
              raise SystemExit(f'RETRY_FINAL_ANCHOR_COUNT={retry.count(old_final)}')
          retry_path.write_text(retry.replace(old_final, new_final, 1))

          sub_path = Path('services/financial/src/mercado-pago-subscription-provider.ts')
          sub = sub_path.read_text()
          old_type = '''    reason: string;
              httpStatus?: number;
            }>,
          '''
          new_type = '''    reason: string;
              httpStatus?: number;
              providerRequestId?: string;
              retryAfter?: string;
              contentType?: string;
            }>,
          '''
          if sub.count(old_type) != 1:
              raise SystemExit(f'SUB_TYPE_ANCHOR_COUNT={sub.count(old_type)}')
          sub = sub.replace(old_type, new_type, 1)

          status_block = '''        ...(Number.isInteger(event.httpStatus)
                  ? { httpStatus: event.httpStatus }
                  : {}),
          '''
          metadata_block = '''        ...(Number.isInteger(event.httpStatus)
                  ? { httpStatus: event.httpStatus }
                  : {}),
                ...(boundedString(event.providerRequestId, 120)
                  ? { providerRequestId: boundedString(event.providerRequestId, 120) }
                  : {}),
                ...(boundedString(event.retryAfter, 120)
                  ? { retryAfter: boundedString(event.retryAfter, 120) }
                  : {}),
                ...(boundedString(event.contentType, 120)
                  ? { contentType: boundedString(event.contentType, 120) }
                  : {}),
          '''
          if sub.count(status_block) != 1:
              raise SystemExit(f'SUB_STATUS_ANCHOR_COUNT={sub.count(status_block)}')
          sub = sub.replace(status_block, metadata_block, 1)

          catch_block = '''          ...(error.httpStatus === null
                    ? {}
                    : { httpStatus: error.httpStatus }),
                });
          '''
          catch_replacement = '''          ...(error.httpStatus === null
                    ? {}
                    : { httpStatus: error.httpStatus }),
                  ...(error.providerRequestId === null
                    ? {}
                    : { providerRequestId: error.providerRequestId }),
                  ...(error.retryAfter === null
                    ? {}
                    : { retryAfter: error.retryAfter }),
                  ...(error.contentType === null
                    ? {}
                    : { contentType: error.contentType }),
                });
          '''
          if sub.count(catch_block) != 1:
              raise SystemExit(f'SUB_CATCH_ANCHOR_COUNT={sub.count(catch_block)}')
          sub_path.write_text(sub.replace(catch_block, catch_replacement, 1))
          PY

          cat > services/financial/src/provider-transient-metadata.test.ts <<'TEST'
          import { describe, expect, it, vi } from "vitest";

          import { createMoney } from "@touristic/financial";
          import {
            createSubscriptionProviderIdempotencyKey,
            normalizeProviderSubscriptionRequest,
          } from "@touristic/financial/subscription-provider";

          import { createMercadoPagoSubscriptionProviderFromEnvironment } from "./mercado-pago-subscription-provider.js";
          import {
            executeBoundedProviderRequest,
            ProviderRequestUnavailableError,
          } from "./provider-retry.js";

          describe("safe transient provider response metadata", () => {
            it("preserves only allowlisted bounded metadata on the final transient response", async () => {
              const fetchMock: typeof fetch = async () =>
                new Response("sensitive response body", {
                  status: 503,
                  headers: {
                    "x-request-id": "mp-request-safe-503",
                    "retry-after": "2",
                    "content-type": "application/json",
                    "x-provider-secret": "must-never-be-captured",
                  },
                });

              let captured: unknown;
              try {
                await executeBoundedProviderRequest({
                  fetch: fetchMock,
                  url: new URL("https://api.mercadopago.com/preapproval"),
                  init: {
                    method: "POST",
                    headers: { "Idempotency-Key": "safe-idempotency-key" },
                  },
                  timeoutMs: 8000,
                  policy: { maxAttempts: 1, baseDelayMs: 0 },
                });
              } catch (error) {
                captured = error;
              }

              expect(captured).toBeInstanceOf(ProviderRequestUnavailableError);
              expect(captured).toMatchObject({
                message: "PROVIDER_REQUEST_UNAVAILABLE",
                httpStatus: 503,
                providerRequestId: "mp-request-safe-503",
                retryAfter: "2",
                contentType: "application/json",
              });
              expect(captured).not.toHaveProperty("body");
              expect(captured).not.toHaveProperty("x-provider-secret");
            });

            it("emits the allowlisted metadata without logging body or arbitrary headers", async () => {
              const amount = createMoney(12_900, "BRL");
              if (!amount) throw new Error("TEST_AMOUNT_INVALID");
              const subscriptionId = "sub_metadata_0001";
              const idempotencyKey =
                createSubscriptionProviderIdempotencyKey(subscriptionId);
              if (!idempotencyKey) throw new Error("TEST_IDEMPOTENCY_KEY_INVALID");
              const request = normalizeProviderSubscriptionRequest({
                subscriptionId,
                idempotencyKey,
                amount,
                frequency: 1,
                frequencyType: "months",
                reason: "Plano Growth",
                payerEmail: "buyer@example.com",
                cardToken: "card_token_metadata_0001",
                backUrl: "https://morro.digital/checkout/return",
                metadata: {
                  orderId: "ord_metadata_0001",
                  pricingVersion: "pricing_v1",
                },
              });
              if (!request) throw new Error("TEST_REQUEST_INVALID");

              const warn = vi.spyOn(console, "warn").mockImplementation(() => undefined);
              try {
                const provider = createMercadoPagoSubscriptionProviderFromEnvironment(
                  {
                    PAYMENTS_PROVIDER_MODE: "mercado_pago",
                    PAYMENTS_PROVIDER_TIMEOUT_MS: "8000",
                    PAYMENTS_PROVIDER_MAX_ATTEMPTS: "1",
                    PAYMENTS_PROVIDER_RETRY_BASE_MS: "0",
                    MERCADO_PAGO_CHECKOUT_MODE: "test",
                    MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED: "true",
                    MERCADO_PAGO_ACCESS_TOKEN:
                      "TEST_ACCESS_TOKEN_fixture_123456789012345678901234567890",
                  },
                  {
                    fetch: async () =>
                      new Response("sensitive provider body must not be logged", {
                        status: 503,
                        headers: {
                          "x-request-id": "mp-subscription-request-503",
                          "retry-after": "3",
                          "content-type": "application/json",
                          "x-provider-secret": "must-never-be-logged",
                        },
                      }),
                  },
                );

                await expect(provider.createSubscription(request)).rejects.toMatchObject({
                  code: "MERCADO_PAGO_UNAVAILABLE",
                });

                const messages = warn.mock.calls.flat().map(String).join("\n");
                expect(messages).toContain('"reason":"PROVIDER_REQUEST_UNAVAILABLE"');
                expect(messages).toContain('"httpStatus":503');
                expect(messages).toContain(
                  '"providerRequestId":"mp-subscription-request-503"',
                );
                expect(messages).toContain('"retryAfter":"3"');
                expect(messages).toContain('"contentType":"application/json"');
                expect(messages).not.toContain("sensitive provider body");
                expect(messages).not.toContain("must-never-be-logged");
              } finally {
                warn.mockRestore();
              }
            });
          });
          TEST

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          corepack pnpm exec prettier --write \
            services/financial/src/provider-retry.ts \
            services/financial/src/mercado-pago-subscription-provider.ts \
            services/financial/src/provider-transient-metadata.test.ts

      - name: Build dependencies
        run: |
          corepack pnpm --filter @touristic/core build
          corepack pnpm --filter @touristic/financial build

      - name: Run focused financial tests
        run: |
          corepack pnpm --filter @touristic/financial-server exec vitest run \
            src/provider-transient-metadata.test.ts \
            src/provider-retry.test.ts \
            src/mercado-pago-subscription-provider.test.ts

      - name: Build financial server
        run: corepack pnpm --filter @touristic/financial-server build

      - name: Validate diff and push only after green checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . \
            ':!services/financial/src/provider-retry.ts' \
            ':!services/financial/src/mercado-pago-subscription-provider.ts' \
            ':!services/financial/src/provider-transient-metadata.test.ts'
          test -n "$(git status --porcelain)" || { echo NO_CHANGES; exit 1; }
          git config user.name "Idebook Digital"
          git config user.email "luizanunciostoca@gmail.com"
          git add \
            services/financial/src/provider-retry.ts \
            services/financial/src/mercado-pago-subscription-provider.ts \
            services/financial/src/provider-transient-metadata.test.ts
          git commit -m "chore(payments): preserve safe transient provider metadata"
          git push origin "HEAD:$TARGET_BRANCH"
