name: Temporary M146 Command Fix

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-command-fix-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - name: Apply explicit settlement command mapping
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("services/financial/src/settlement-application-service.ts"); s=p.read_text(); old="      const command = createFinancialSettlementProviderCommand(\n        claim.settlement,\n      );"; new="      const command = createFinancialSettlementProviderCommand({\n        settlementId: claim.settlement.id,\n        payableId: claim.settlement.payableId,\n        paymentId: claim.settlement.paymentId,\n        beneficiaryReference: claim.settlement.beneficiaryReference,\n        amount: claim.settlement.amount,\n        idempotencyKey: claim.settlement.idempotencyKey,\n      });"; assert old in s, "expected provider command mapping not found"; p.write_text(s.replace(old, new, 1))'
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/financial/src/settlement-application-service.ts
          git commit -m "fix(payments): map settlement provider command explicitly"
          git push origin HEAD:feat/payments-m146-settlement
