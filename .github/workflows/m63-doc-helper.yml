name: M63 doc helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/business-m63-production-profile-view
    paths:
      - ".github/workflows/m63-doc-helper.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m63-production-profile-view
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile M63 migration matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/migration/BUSINESS-MIGRATION-MATRIX.md')
          s = p.read_text()
          s = s.replace(
            '# Business Portal — Migration Matrix (M62 commercial browser lifecycle parity)',
            '# Business Portal — Migration Matrix (M63 production profile view parity)',
          )
          s = s.replace(
            'After M62, `FEATURE-0005` remains `baseline-pending`, but every currently classified Business-owned migration contract is now at least partially represented in V2. M61 closed the commercial-conversion domain GAP and M62 binds that core to the real onboarding browser lifecycle. Payments still owns transaction execution and financial verification. Production profile breadth, wider live Business runtime and broader Business browser behavior remain partial.',
            'After M63, `FEATURE-0005` remains `baseline-pending`. M61/M62 closed the Business-owned commercial conversion lifecycle while preserving Payments ownership, and M63 ports the frozen production profile browser view onto the authenticated dashboard. Wider live Business runtime and broader Business browser behavior remain partial.',
          )
          s = s.replace('V2 evidence at M62', 'V2 evidence at M63')
          old = '| Business profile behavior               | `js/business/profile/*`                                               | immutable models + protected HTTP resource + mounted read/edit/save profile surface; M59 reuses this core for tutorial profile projection, but production persistence breadth remains partial | PARTIAL | Bind intended production persistence/full profile behavior before PASS.                                                                              |'
          new = '| Business profile behavior               | `js/business/profile/*`                                               | immutable model + protected GET/PUT + authenticated dashboard editing + M63 production modal view with optional promotion, delegated actions and deterministic Chromium evidence             | PASS    | Keep one normalized `BusinessProfile` model and preserve Auth-owned persistence/authorization.                                                        |'
          if old not in s:
            raise SystemExit('profile row not found')
          s = s.replace(old, new)
          s = s.replace('## M62 score', '## M63 score')
          s = s.replace('- `PASS`: 16\n- `PARTIAL`: 3', '- `PASS`: 17\n- `PARTIAL`: 2')
          old_tail = '`Business domain/browser behavior`, `Business profile behavior` and `Live Business runtime` remain `PARTIAL`. `Checkout client` remains `N/A` for Business because provider/payment execution belongs to `FEATURE-0009`. M62 reaches zero Business-owned GAPs without claiming full Business equivalence.'
          new_tail = '`Business profile behavior` is now `PASS`: M63 reuses the protected V2 profile model/persistence and restores the frozen production browser view with accessible modal semantics, optional promotion, delegated primary/map/promotion actions and no synthetic business data. `Business domain/browser behavior` and `Live Business runtime` remain `PARTIAL`. `Checkout client` remains `N/A` for Business because provider/payment execution belongs to `FEATURE-0009`. M63 still does not claim full Business equivalence.'
          if old_tail not in s:
            raise SystemExit('M62 partial summary not found')
          s = s.replace(old_tail, new_tail)
          marker = '`BUSINESS-M62-EVIDENCE.md`, the expanded runtime-context allowlist and the permanent Business Onboarding Commercial Browser Contract prove the browser finish-step preparation flow, reuse of the M61 core, Payments handoff, absence of synthetic financial confirmation and same-correlation verified activation.\n'
          addition = marker + '\n`BUSINESS-M63-EVIDENCE.md` and the permanent Business Production Profile Browser Contract prove the authenticated production profile modal, frozen V1 view semantics, optional promotion, delegated actions, Escape teardown and absence of synthetic ratings/hours/images/contacts.\n'
          if marker not in s:
            raise SystemExit('evidence marker not found')
          s = s.replace(marker, addition)
          s = s.replace(
            'The official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route, Onboarding Profile, Onboarding Workspace, Onboarding Commercial and Navigation Accessibility regressions must remain green on the final permanent M62 head.',
            'The official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. The Business Dashboard Browser Contract and Business Production Profile Browser Contract must remain green on the final permanent M63 head, together with any other path-triggered regressions.',
          )
          s = s.replace(
            'M63 should audit the remaining `PARTIAL` contracts from frozen production V1 call sites and select the smallest observable production behavior that can be ported without inventing analytics or weakening Auth/Payments ownership.\n\nProduction profile breadth, wider `Live Business runtime` and broader Business browser behavior must not be promoted until executable frozen evidence proves their missing production behavior. Zero GAPs at M62 does not make `FEATURE-0005` equivalent while these PARTIAL contracts remain.',
            'M64 should audit the two remaining `PARTIAL` contracts — `Business domain/browser behavior` and `Live Business runtime` — from frozen production V1 call sites and select the smallest observable production behavior that can be ported without inventing analytics or restoring legacy globals.\n\nZero GAPs and a production-profile PASS at M63 do not make `FEATURE-0005` equivalent while these two PARTIAL contracts remain.',
          )
          p.write_text(s)
          PY
          pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M63-EVIDENCE.md
      - name: Commit M63 docs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M63-EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(business): consolidate M63 profile parity"
          git push origin HEAD:feat/business-m63-production-profile-view
