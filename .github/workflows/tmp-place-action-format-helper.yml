name: Temporary Place Action Formatter

on:
  push:
    branches:
      - wave/place-category-actions-capabilities-20260923

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical formatted files
        run: |
          files=(
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "===FORMAT_FILE_START:$file==="
            base64 -w 0 "$file"
            echo
            echo "===FORMAT_FILE_END:$file==="
          done
