name: M55 Format Once

on:
  push:
    branches:
      - feat/business-m55-onboarding-browser-lifecycle-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m55-onboarding-browser-lifecycle-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M55 files
        run: >-
          pnpm exec prettier --write
          packages/business/src/onboarding-host.ts
          packages/business/src/onboarding-host.test.ts
          packages/business/package.json
          apps/morro-digital-platform/src/business-onboarding-surface.ts
          apps/morro-digital-platform/src/business-onboarding-entry.ts
          apps/morro-digital-platform/public/business-onboarding.css
          apps/morro-digital-platform/public/business-onboarding.html
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m55-format-once.yml
          git add packages/business/src/onboarding-host.ts \
            packages/business/src/onboarding-host.test.ts \
            packages/business/package.json \
            apps/morro-digital-platform/src/business-onboarding-surface.ts \
            apps/morro-digital-platform/src/business-onboarding-entry.ts \
            apps/morro-digital-platform/public/business-onboarding.css \
            apps/morro-digital-platform/public/business-onboarding.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(business): format M55 onboarding files"
          git push origin HEAD:feat/business-m55-onboarding-browser-lifecycle-v2
