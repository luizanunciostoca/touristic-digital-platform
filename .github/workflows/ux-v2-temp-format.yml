name: UX V2 Temporary Formatter

on:
  push:
    branches:
      - wave/ux-v2-carousel-v4-20260921
    paths:
      - .github/workflows/ux-v2-temp-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format branch-owned UX files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/ux/device-matrix-v2-contract.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/ux/device-matrix-v2-contract.test.ts
          git commit -m "style(ux): apply canonical Prettier formatting"
          git push origin HEAD:wave/ux-v2-carousel-v4-20260921
