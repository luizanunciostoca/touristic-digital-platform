name: Staging OCI Promotion
run-name: "staging-oci-promotion:${{ inputs.request_id }}:${{ inputs.expected_sha }}"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest produced by Release OCI Image
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string
      request_id:
        description: Correlation id for exact dispatch evidence
        required: false
        default: manual
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: staging-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_STAGING_SERVICE_NAME: morro-digital-v2-staging
  EXPECTED_STAGING_SERVICE_ID: srv-da4hb6c9v7es7386ttt0
  EXPECTED_STAGING_CANONICAL_URL: https://morro-digital-v2-staging.onrender.com

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Prove frozen candidate provenance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

      - name: Re-prove immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --workflow release-oci-image.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          test -n "$run_id"
          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$run_id" \
            --name "release-provenance-$EXPECTED_SHA" \
            --dir /tmp/release-provenance
          expected_tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg tree "$expected_tree" \
            --arg digest "$IMAGE_DIGEST" \
            '.source_sha == $sha and .tree_sha == $tree and .digest == $digest' \
            /tmp/release-provenance/release-provenance.json >/dev/null
          echo "PASS: immutable image $IMAGE_REPOSITORY@$IMAGE_DIGEST from run $run_id"

  deploy:
    needs: preflight
    if: >-
      (github.ref == 'refs/heads/main' ||
       github.ref == format('refs/tags/rc/{0}', inputs.expected_sha)) &&
      inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: main - morro-digital-v2-staging
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prove canonical Render staging image hook target before deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_IMAGE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK"
          hook_service_id="$(node -e '
            const value = process.env.DEPLOY_HOOK;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.hostname !== "api.render.com") process.exit(2);
            const match = url.pathname.match(/^\/deploy\/(srv-[A-Za-z0-9]+)$/);
            if (!match) process.exit(3);
            process.stdout.write(match[1]);
          ')"
          test "$hook_service_id" = "$EXPECTED_STAGING_SERVICE_ID"
          test "$TARGET_URL" = "$EXPECTED_STAGING_CANONICAL_URL"

      - name: Trigger Render image deploy by exact digest
        id: render
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_IMAGE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK"
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          encoded="$(jq -rn --arg value "$image_ref" '$value|@uri')"
          separator='?'
          [[ "$DEPLOY_HOOK" == *\?* ]] && separator='&'
          status="$(curl --request POST --silent --show-error \
            --output /tmp/render-image-deploy.json \
            --write-out '%{http_code}' \
            "${DEPLOY_HOOK}${separator}imgURL=${encoded}")"
          case "$status" in 200|202) ;; *) cat /tmp/render-image-deploy.json >&2; exit 1 ;; esac
          deploy_id="$(jq -r '.deploy.id // .id // empty' /tmp/render-image-deploy.json 2>/dev/null || true)"
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA runtime identity
        id: runtime
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                echo "live_sha=$release_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          LIVE_SHA: ${{ steps.runtime.outputs.live_sha }}
        shell: bash
        run: |
          set -euo pipefail
          verified_at=""
          if [ -n "${LIVE_SHA:-}" ]; then
            verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "live_sha=${LIVE_SHA:-}"
            echo "image=$IMAGE_REPOSITORY"
            echo "digest=$IMAGE_DIGEST"
            echo "render_deploy_id=${DEPLOY_ID:-unknown}"
            echo "target_url=$TARGET_URL"
          } > oci-deployment-evidence.txt
          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg liveSha "${LIVE_SHA:-}" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg environment "staging" \
            --arg serviceName "$EXPECTED_STAGING_SERVICE_NAME" \
            --arg serviceId "$EXPECTED_STAGING_SERVICE_ID" \
            --arg canonicalUrl "$EXPECTED_STAGING_CANONICAL_URL" \
            --arg deploymentId "${DEPLOY_ID:-}" \
            --arg verifiedAt "$verified_at" \
            '{
              expectedSha:$expectedSha,
              liveSha:$liveSha,
              imageDigest:$imageDigest,
              environment:$environment,
              serviceName:$serviceName,
              serviceId:$serviceId,
              canonicalUrl:$canonicalUrl,
              deploymentId:$deploymentId,
              verifiedAt:$verifiedAt
            }' > staging-deployment-evidence.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-oci-deployment-evidence-${{ github.run_id }}
          path: |
            oci-deployment-evidence.txt
            staging-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
