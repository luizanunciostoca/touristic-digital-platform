name: Release Promotion Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion-${{ inputs.expected_sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  smoke:
    name: release / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Prove exact promotion SHA is current main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN_SHA" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate canonical Platform contracts
        run: pnpm platform:contracts:check
      - name: Build release candidate
        run: pnpm build
      - name: Start local release candidate
        shell: bash
        run: |
          set -euo pipefail
          PORT=4199 HOST=127.0.0.1 node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/release-promotion.log 2>&1 &
          echo $! >/tmp/release-promotion.pid
          for _ in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:4199/runtime-config.js >/dev/null; then
              exit 0
            fi
            sleep .25
          done
          cat /tmp/release-promotion.log
          exit 1
      - name: Smoke canonical local surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4199/runtime-config.js >/tmp/runtime-config.js
          curl --fail --silent --show-error http://127.0.0.1:4199/apps/morro-digital-platform/public/index.html >/tmp/platform-index.html
          test -s /tmp/runtime-config.js
          test -s /tmp/platform-index.html
      - name: Show runtime diagnostics
        if: failure()
        run: cat /tmp/release-promotion.log || true
      - name: Stop release candidate
        if: always()
        run: |
          if [ -f /tmp/release-promotion.pid ]; then
            kill "$(cat /tmp/release-promotion.pid)" 2>/dev/null || true
          fi
