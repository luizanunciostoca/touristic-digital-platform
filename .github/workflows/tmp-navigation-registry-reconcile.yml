name: Temporary Navigation Registry Reconciliation

on:
  push:
    branches:
      - fix/navigation-v1-product-parity-20260915

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/navigation-v1-product-parity-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile Navigation registry and master tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          tracker_path = Path('docs/migration/MASTER-MIGRATION-TRACKER.md')
          tracker = tracker_path.read_text()
          lines = tracker.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith('| MIG-0005 |')]
          assert len(matches) == 1, f'expected one MIG-0005 row, found {len(matches)}'
          lines[matches[0]] = '| MIG-0005 | `js/navigation*` | Navigation | FEATURE-0003 | `packages/navigation` + adapters em `packages/geospatial` + composição no app | 4 | migrating | baseline visual/câmera anterior permanece válida; re-certificação integral reaberta contra o ZIP `55ac...` | jornada funcional remediada na PR #60: step progression, TTS, GPS retry/reuse, 15 s routing, recalculation suppression, arrival/Assistant feedback, processing PT/EN/ES/HE, contextual suggestions e fallback guiado; source-exactness ainda PARTIAL para constantes/texto/fallback do ZIP | `NAVIGATION-MIG-0005-EQUIVALENCE-MATRIX.md`; `NAVIGATION-V1-GAP-REGISTER.md`; PR #60; Quality + `Navigation Turn-by-Turn Parity` obrigatórios no exact-head | crítico |'
          tracker_path.write_text('\n'.join(lines) + '\n')

          registry_path = Path('docs/features/registry.json')
          registry = registry_path.read_text()
          feature_start = registry.index('"id": "FEATURE-0003"')
          feature_end = registry.index('"id": "FEATURE-0004"', feature_start)
          block = registry[feature_start:feature_end]
          assert '"status": "migrating"' in block
          note = (
              'FEATURE-0003 equivalence certification was reopened on 2026-09-15 after an audit of the canonical ZIP snapshot reporting sourceCommit '
              '55acb639c1112a3c9a646dd103b01ad9cf5dd106 found product-journey obligations not covered by the historical 24-scenario matrix frozen against '
              '60746fd7fed97b805758b37adfdbe3bad2582bfe. PR #60 functionally remediates automatic maneuver progression, turn-by-turn speech, GPS retry/reuse, '
              '15s route timeout, recalculation suppression, arrival/Assistant feedback, safe PT/EN/ES/HE instruction processing, contextual route suggestions and guided '
              'navigation under degraded map providers. The remaining PARTIAL classification is source-exactness only: the live connection cannot read the canonical ZIP bytes, '
              'so the exact historical semantic simplifier, suggestion policy constants/ranking and fallback details are not claimed identical. Promotion back to equivalent requires '
              'exact-head Quality plus Navigation Turn-by-Turn Parity and direct reconciliation against ZIP 55ac... or a formal acceptance of the documented differences.'
          )
          replacement = '        "note": ' + json.dumps(note, ensure_ascii=False)
          next_block, count = re.subn(r'        "note": ".*"', replacement, block, count=1)
          assert count == 1, f'expected one FEATURE-0003 note, replaced {count}'
          registry = registry[:feature_start] + next_block + registry[feature_end:]
          registry_path.write_text(registry)
          PY
          pnpm exec prettier --write docs/features/registry.json
          git diff --check
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            echo 'REGISTRY_ALREADY_RECONCILED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m 'docs(navigation): reconcile MIG-0005 migrating state'
          git push origin HEAD:fix/navigation-v1-product-parity-20260915
