name: Format NAV-16 Temp

on:
  push:
    branches:
      - feat/navigation-v1-routing-baseline
    paths:
      - .github/workflows/navigation-nav16-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-v1-routing-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/navigation/src/v1-routing-baseline-parity.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/navigation/src/v1-routing-baseline-parity.test.ts
          git commit -m "style: format V1 routing parity test"
          git push origin HEAD:feat/navigation-v1-routing-baseline
