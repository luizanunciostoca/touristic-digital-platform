name: Temporary Cancel Stale Runs

on:
  push:
    branches:
      - ops/cancel-stale-runs-20260924

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/cancel-stale-runs-20260924
          fetch-depth: 0
      - name: Cancel obsolete runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36028542221 35648018423; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [ "$status" != "completed" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
              echo "Cancelled stale run $run_id"
            fi
          done
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cancel-stale-runs.yml
          git commit -m "chore(ci): remove stale-run cancellation helper"
          git push origin HEAD:ops/cancel-stale-runs-20260924
