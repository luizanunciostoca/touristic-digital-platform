name: Assistant V1 Place Actions Browser Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/assistant-place-actions-v1-parity.yml
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/**
      - packages/assistant/src/**
      - packages/search/src/**

permissions:
  contents: read

jobs:
  assistant-place-actions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-place-actions.log 2>&1 &
          echo $! >/tmp/assistant-place-actions.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-place-actions.log
          exit 1
      - name: Verify V1 place actions execute through the semantic runtime
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
                globalThis.__placeActionRoutes = [];
                document.addEventListener('morro:assistant-place-action-routed', event => {
                  globalThis.__placeActionRoutes.push(event.detail);
                });
              });

              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  temperatureCelsius: 28,
                  temperatureMaxCelsius: 31,
                  temperatureMinCelsius: 24,
                  humidityPercent: 78,
                  windSpeedKph: 18,
                  rainChancePercent: 42,
                  weatherCode: 1,
                  isDay: true,
                  forecast: [],
                }),
              }));

              await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({
                state: 'attached',
                timeout: 30000,
              });
              await page.locator('body[data-public-onboarding-settled="true"]').waitFor({
                state: 'attached',
                timeout: 5000,
              });

              const assistant = page.locator('#assistant-messages');
              const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
              await quickAction.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await assistant.isVisible())) await quickAction.click();

              const input = page.locator('#assistantInput');
              const send = page.locator('#sendButton');
              await input.waitFor({ state: 'visible', timeout: 5000 });

              const detailActionValues = {
                beaches: 'condições da praia',
                restaurants: 'cardápio',
                hotels: 'ver quartos',
                tours: 'ponto de encontro',
                transport: 'tarifas',
              };

              async function waitUntil(check, label, timeout = 8000) {
                const deadline = Date.now() + timeout;
                let lastError = null;
                while (Date.now() < deadline) {
                  try {
                    if (await check()) return;
                  } catch (error) {
                    lastError = error;
                  }
                  await page.waitForTimeout(100);
                }
                const suffix = lastError instanceof Error ? `: ${lastError.message}` : '';
                throw new Error(`${label} timed out${suffix}`);
              }

              async function submit(text) {
                await input.fill(text);
                await send.click();
                await waitUntil(
                  async () => (await input.inputValue()) === '',
                  `input reset after ${text}`,
                );
              }

              async function openPlace(category, place) {
                await submit(category);
                await page.locator(
                  `#assistant-category-results[data-category="${category}"][data-stage="filters"]`,
                ).waitFor({ state: 'visible', timeout: 8000 });
                await submit('ver todos');
                await page.locator(
                  `#assistant-category-results[data-category="${category}"][data-stage="places"] [data-location-name="${place}"]`,
                ).waitFor({ state: 'visible', timeout: 8000 });
                await submit(place);
                await page.locator(
                  `#map[data-explore-category="${category}"][data-explore-stage="detail"][data-map-marker-count="1"]`,
                ).waitFor({ state: 'attached', timeout: 8000 });
                const detailAction = detailActionValues[category];
                if (!detailAction) throw new Error(`Missing detail action for ${category}`);
                await page.locator(
                  `.assistant-option-btn[data-value="${detailAction}"]`,
                ).last().waitFor({ state: 'visible', timeout: 8000 });
              }

              async function expectAction(inputText, action, expectedText) {
                const before = await page.evaluate(() => globalThis.__placeActionRoutes.length);
                await submit(inputText);
                await page.locator('#assistant-messages .message.assistant', {
                  hasText: expectedText,
                }).last().waitFor({ state: 'visible', timeout: 8000 });
                await waitUntil(
                  () => page.evaluate(
                    ({ before, action }) => {
                      const routes = globalThis.__placeActionRoutes || [];
                      return routes.length > before && routes.at(-1)?.action === action;
                    },
                    { before, action },
                  ),
                  `deterministic route ${action}`,
                );
              }

              await openPlace('beaches', 'Primeira Praia');
              await expectAction(
                'condições da praia',
                'beach_conditions',
                'Ainda não há condições confiáveis cadastradas para esta praia.',
              );

              await openPlace('restaurants', 'Morena Bela');
              await expectAction(
                'cardápio',
                'restaurant_menu',
                'Este restaurante ainda não possui cardápio digital cadastrado.',
              );

              await openPlace('hotels', 'Pousada Natureza');
              await expectAction(
                'ver quartos',
                'accommodation_rooms',
                'Esta hospedagem ainda não possui quartos cadastrados.',
              );

              await openPlace('tours', 'Passeio de Barco Volta à Ilha');
              await expectAction(
                'ponto de encontro',
                'tour_meeting_point',
                'O ponto de encontro ainda não possui coordenadas válidas cadastradas.',
              );

              await openPlace('transport', 'Píer de Morro de São Paulo');
              await expectAction(
                'tarifas',
                'transport_fares',
                'As tarifas ainda não estão cadastradas.',
              );
              await expectAction(
                'localização',
                'transport_location',
                'Deseja iniciar a navegação até Píer de Morro de São Paulo?',
              );
              await page.locator('.assistant-option-btn[data-value="sim"]').waitFor({
                state: 'visible',
                timeout: 5000,
              });
              await page.locator('.assistant-option-btn[data-value="não"]').waitFor({
                state: 'visible',
                timeout: 5000,
              });

              const routes = await page.evaluate(() => globalThis.__placeActionRoutes);
              const actions = routes.map(item => item.action);
              for (const action of [
                'beach_conditions',
                'restaurant_menu',
                'accommodation_rooms',
                'tour_meeting_point',
                'transport_fares',
                'transport_location',
              ]) {
                if (!actions.includes(action)) {
                  throw new Error(`Missing deterministic V1 place action ${action}: ${JSON.stringify(actions)}`);
                }
              }

              const latest = await page.locator('#assistant-messages .message.assistant').last().innerText();
              if (latest.includes('Localização atualizada com sucesso')) {
                throw new Error('Transport location was incorrectly handled as user geolocation');
              }
              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/assistant-place-actions.log || true
