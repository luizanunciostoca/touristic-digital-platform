name: Temporary format home overlay

on:
  push:
    branches:
      - feat/v1-app-shell-checkpoint
    paths:
      - .github/workflows/temp-format-home-overlay.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-app-shell-checkpoint
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format home overlay files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/layouts/app-shell.ts \
            apps/morro-digital-platform/src/browser-entry.ts
      - name: Verify changed paths
        run: |
          git status --short
          test "$(git status --short | wc -l)" -ge 1
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(apps/morro-digital-platform/src/layouts/app-shell.ts|apps/morro-digital-platform/src/browser-entry.ts)$' || true)"
          test -z "$unexpected"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/layouts/app-shell.ts \
            apps/morro-digital-platform/src/browser-entry.ts
          git commit -m "style: format V1 home overlay state"
          git push origin HEAD:feat/v1-app-shell-checkpoint
