name: M27 Run Finalize
on:
  push:
    branches: [feat/assistant-m27-llm-boundary]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node apps/morro-digital-platform/tooling/m27-finalize.mjs
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-llm-adapter.ts apps/morro-digital-platform/src/assistant/assistant-llm-adapter.test.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/tooling/assistant-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs apps/morro-digital-platform/tooling/m27-finalize.mjs docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - run: pnpm format:check
      - run: pnpm architecture:check
      - run: pnpm features:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke same-origin boundary
        run: |
          PORT=4180 node apps/morro-digital-platform/tooling/dev-server.mjs > /tmp/m27-server.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4180/runtime-config.js >/dev/null && break
            sleep 0.25
          done
          STATUS=$(curl -sS -o /tmp/m27.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"input":"história de Morro"}' http://127.0.0.1:4180/api/ai/assistant/respond)
          test "$STATUS" = "503"
          grep -q assistant_not_configured /tmp/m27.json
          LEGACY=$(curl -sS -o /tmp/m27-legacy.json -w '%{http_code}' http://127.0.0.1:4180/api/assistant/respond)
          test "$LEGACY" = "405"
          grep -q method_not_allowed /tmp/m27-legacy.json
          kill $PID
      - name: Commit finalized files
        run: |
          rm .github/workflows/m27-run-finalize.yml
          rm apps/morro-digital-platform/tooling/m27-finalize.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(assistant): finalize same-origin LLM boundary'
          git push
