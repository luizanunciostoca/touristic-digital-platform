name: Payments Provider Live Probe

on:
  push:
    branches:
      - ops/payments-provider-test-acceptance-20260824

permissions:
  contents: read
  statuses: write

env:
  STAGING_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_SHA: 0d5e4478ded981a1d4841f46fba95de17205f832

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='Payments Provider Live Probe' \
            -f description='TEST Brick bootstrap probe running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Probe exact live Brick without card submission
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const { writeFileSync } = require('node:fs');
          const base = process.env.STAGING_URL;
          const expectedSha = process.env.EXPECTED_SHA;
          const planId = 'provider_acceptance_test';
          const sanitize = value => String(value || '').replace(/[A-Za-z0-9_-]{40,}/g, '[redacted]');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const providerRequestFailures = [];
              page.on('requestfailed', request => {
                if (!request.url().includes('mercadopago')) return;
                let origin = 'unknown';
                try { origin = new URL(request.url()).origin; } catch {}
                providerRequestFailures.push({ origin, error: sanitize(request.failure()?.errorText || 'request_failed') });
              });

              const health = await page.request.get(`${base}/healthz`);
              const ready = await page.request.get(`${base}/readyz`);
              if (!health.ok() || !ready.ok()) throw new Error(`staging-not-ready:${health.status()}:${ready.status()}`);
              for (const response of [health, ready]) {
                const sha = response.headers()['x-release-sha'];
                if (sha !== expectedSha) throw new Error(`release-sha-mismatch:${sha || 'missing'}`);
              }

              await page.goto(`${base}/business-onboarding.html`, { waitUntil: 'domcontentloaded' });
              const runtimeSummary = await page.evaluate(() => {
                const env = window.__MORRO_RUNTIME_ENV__ || {};
                const summarize = (name) => {
                  const raw = String(env[name] || '').trim();
                  return {
                    present: raw.length > 0,
                    length: raw.length,
                    prefix:
                      name === 'VITE_MERCADO_PAGO_PUBLIC_KEY'
                        ? raw.startsWith('TEST-')
                          ? 'TEST'
                          : raw.startsWith('APP_USR-')
                            ? 'APP_USR'
                            : raw
                              ? 'OTHER'
                              : 'NONE'
                        : raw
                          ? 'SET'
                          : 'NONE',
                  };
                };
                return {
                  mercadoPagoPublicKey: summarize('VITE_MERCADO_PAGO_PUBLIC_KEY'),
                  mapboxAccessToken: summarize('VITE_MAPBOX_ACCESS_TOKEN'),
                  mapboxStyle: summarize('VITE_MAPBOX_STYLE'),
                  mapboxContainerId: summarize('VITE_MAPBOX_CONTAINER_ID'),
                  mapboxInitialZoom: summarize('VITE_MAPBOX_INITIAL_ZOOM'),
                };
              });

              const runtime = await page.request.get(`${base}/runtime-config.js`);
              const runtimeStatus = runtime.status();
              const runtimeText = await runtime.text();
              for (const forbidden of ['MERCADO_PAGO_ACCESS_TOKEN','MERCADO_PAGO_WEBHOOK_SECRET','ORDERING_DATABASE_URL','FINANCIAL_DATABASE_URL']) {
                if (runtimeText.includes(forbidden)) throw new Error(`secret-name-exposed:${forbidden}`);
              }
              const runtimeResponseSummary = (() => {
                const match = /Object\.freeze\((\{.*\})\);/u.exec(runtimeText);
                if (!match) return { status: runtimeStatus, parsed: false };
                let parsed;
                try { parsed = JSON.parse(match[1]); } catch { return { status: runtimeStatus, parsed: false }; }
                const summarize = (name) => {
                  const raw = String(parsed[name] || '').trim();
                  return {
                    present: raw.length > 0,
                    length: raw.length,
                    prefix:
                      name === 'VITE_MERCADO_PAGO_PUBLIC_KEY'
                        ? raw.startsWith('TEST-')
                          ? 'TEST'
                          : raw.startsWith('APP_USR-')
                            ? 'APP_USR'
                            : raw
                              ? 'OTHER'
                              : 'NONE'
                        : raw
                          ? 'SET'
                          : 'NONE',
                  };
                };
                return {
                  status: runtimeStatus,
                  parsed: true,
                  mercadoPagoPublicKey: summarize('VITE_MERCADO_PAGO_PUBLIC_KEY'),
                  mapboxAccessToken: summarize('VITE_MAPBOX_ACCESS_TOKEN'),
                  mapboxStyle: summarize('VITE_MAPBOX_STYLE'),
                  mapboxContainerId: summarize('VITE_MAPBOX_CONTAINER_ID'),
                  mapboxInitialZoom: summarize('VITE_MAPBOX_INITIAL_ZOOM'),
                };
              })();

              const sessionId = `provider_probe_${Date.now()}`;
              const handoff = {
                sessionId,
                planId,
                contractor: { name: 'Morro Provider Test', email: 'morro-provider-test@example.com', phone: '75999999999', document: '12345678909' },
                businessDraft: { demoBusinessId: `demo_${sessionId}`, displayName: 'Morro Provider TEST', categoryId: 'events', specialty: 'Provider acceptance', environment: 'sandbox', publishable: false },
                acceptedTerms: [
                  { type: 'terms', version: 'business-partner-terms-2026-08', acceptedAt: new Date().toISOString() },
                  { type: 'privacy', version: 'privacy-policy-2026-08', acceptedAt: new Date().toISOString() }
                ],
                returnUrl: `${base}/business-onboarding.html`, tutorial: false, requiresPaymentsCapability: true
              };

              const bootstrap = await page.evaluate(async ({ handoff, sessionId, planId }) => {
                const authority = await fetch('/api/payments/v1/checkout-authority', {
                  method: 'POST', credentials: 'same-origin', cache: 'no-store',
                  headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify(handoff)
                });
                const authorityPayload = await authority.json();
                if (!authority.ok) return { stage: 'authority', status: authority.status, error: authorityPayload?.error || 'unknown' };
                const checkout = await fetch('/api/payments/v1/checkouts', {
                  method: 'POST', credentials: 'same-origin', cache: 'no-store',
                  headers: { 'content-type': 'application/json', accept: 'application/json', 'x-checkout-handoff-token': authorityPayload.data.handoffToken, 'idempotency-key': `business:${sessionId}:${planId}` },
                  body: JSON.stringify(handoff)
                });
                const payload = await checkout.json();
                return { stage: 'checkout', status: checkout.status, payload };
              }, { handoff, sessionId, planId });

              if (bootstrap.status < 200 || bootstrap.status >= 300) throw new Error(`bootstrap-failed:${bootstrap.stage}:${bootstrap.status}:${bootstrap.error || bootstrap.payload?.error || 'unknown'}`);
              const data = bootstrap.payload?.data;
              if (!data?.checkoutId || !data?.statusToken || !data?.plan?.amount) throw new Error('invalid-checkout-bootstrap');
              if (data.plan.id !== planId || data.plan.amount.minorUnits !== 1000 || data.plan.amount.currency !== 'BRL') throw new Error('acceptance-plan-authority-mismatch');

              const brickBootstrap = await page.evaluate(async ({ data, email }) => {
                try {
                  const module = await import('/apps/morro-digital-platform/dist/mercado-pago-card-payment-brick.js');
                  const brick = module.createMercadoPagoCardPaymentBrick(window, document, window.fetch.bind(window));
                  window.__MORRO_PROVIDER_PROBE__ = { settled: false, error: null };
                  brick.present({ checkoutId: data.checkoutId, statusToken: data.statusToken, plan: data.plan, payerEmail: email })
                    .then(() => { window.__MORRO_PROVIDER_PROBE__.settled = true; })
                    .catch(error => { window.__MORRO_PROVIDER_PROBE__.error = String(error?.message || error); });
                  const deadline = Date.now() + 18000;
                  while (Date.now() < deadline) {
                    const overlay = Boolean(document.querySelector('[data-morro-payments-brick="card"]'));
                    const error = window.__MORRO_PROVIDER_PROBE__.error;
                    if (overlay || error) return { available: brick.available, overlay, error };
                    await new Promise(resolve => setTimeout(resolve, 100));
                  }
                  return { available: brick.available, overlay: false, error: 'BRICK_BOOTSTRAP_TIMEOUT' };
                } catch (error) {
                  return { available: null, overlay: false, error: String(error?.message || error) };
                }
              }, { data, email: handoff.contractor.email });

              const frames = brickBootstrap.overlay ? page.frames().map((frame, index) => ({
                index,
                name: frame.name(),
                origin: (() => { try { return new URL(frame.url()).origin; } catch { return ''; } })()
              })) : [];

              const result = {
                status: brickBootstrap.overlay && !brickBootstrap.error ? 'PASS' : 'FAIL',
                releaseSha: expectedSha,
                runtimePage: runtimeSummary,
                runtimeResponse: runtimeResponseSummary,
                planId,
                amount: data.plan.amount,
                brick: { available: brickBootstrap.available, overlay: brickBootstrap.overlay, error: sanitize(brickBootstrap.error) || null },
                providerRequestFailures,
                frames,
              };
              writeFileSync('/tmp/provider-live-probe.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result));
              if (result.status !== 'PASS') process.exitCode = 1;
            } finally { await browser.close(); }
          })().catch(error => {
            const result = { status: 'FAIL', releaseSha: expectedSha, error: sanitize(error?.message || error) };
            writeFileSync('/tmp/provider-live-probe.json', JSON.stringify(result, null, 2));
            console.error(JSON.stringify(result));
            process.exit(1);
          });
          NODE
          exit $?

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success; description='TEST Brick bootstrap probe passed' ;;
            *) state=failure; description='TEST Brick bootstrap probe failed' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='Payments Provider Live Probe' -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
