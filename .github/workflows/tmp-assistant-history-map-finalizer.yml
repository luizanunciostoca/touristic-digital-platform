name: Temporary Assistant V1 History Map Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-assistant-history-map-finalizer.yml
      - tooling/tmp-assistant-history-map-finalizer.py
      - tooling/tmp-assistant-history-map-contract-fix.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-history-map-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply history and map parity patch
        run: |
          python tooling/tmp-assistant-history-map-finalizer.py
          python tooling/tmp-assistant-history-map-contract-fix.py
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.test.ts \
            packages/geospatial/src/infrastructure/mapbox-gl-driver.ts
      - name: Validate history and map parity
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/geospatial test
          pnpm --filter @touristic/geospatial typecheck
          pnpm --filter @touristic/geospatial lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.test.ts \
            packages/geospatial/src/infrastructure/mapbox-gl-driver.ts
          git diff --check
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.test.ts \
            packages/geospatial/src/infrastructure/mapbox-gl-driver.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix(assistant): restore V1 history and map command parity"
          git push origin HEAD:fix/assistant-v1-history-map-parity
