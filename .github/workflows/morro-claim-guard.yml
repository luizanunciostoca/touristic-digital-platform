name: Morro Claim Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  claim-guard:
    name: claim-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch canonical base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Validate ChangeSet claim and exact base
        run: node .github/scripts/validate-morro-claim.mjs
