name: M37 Refresh Lockfile Once
on:
  push:
    branches:
      - feat/search-m37-local-core
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m37-local-core
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm format
      - name: Commit generated lockfile/format and remove helper
        run: |
          rm .github/workflows/m37-refresh-lockfile-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml packages/search .github/workflows/m37-refresh-lockfile-once.yml
          git commit -m "chore(search): refresh M37 workspace metadata"
          git push origin HEAD:feat/search-m37-local-core
