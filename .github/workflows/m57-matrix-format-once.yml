name: M57 Matrix Format Once

on:
  push:
    branches:
      - feat/business-m57-onboarding-route-parity
    paths:
      - ".github/workflows/m57-matrix-format-once.yml"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m57-onboarding-route-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update migration matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("docs/migration/BUSINESS-MIGRATION-MATRIX.md")
          t = p.read_text()
          t = t.replace("# Business Portal — Migration Matrix (M56 onboarding per-step contracts)", "# Business Portal — Migration Matrix (M57 onboarding route parity)")
          a = t.index("After M56,")
          b = t.index("\n\n| Contract", a)
          intro = "After M57, `FEATURE-0005` remains `baseline-pending`, but the Business-owned onboarding orchestration is now executable end-to-end across the frozen 28-step flow. M57 adds an explicit route port backed by the shared Navigation routing contract, keeps route verification fail-closed, persists tutorial-only route summaries and hands successful route intent back to Navigation without moving routing ownership into Business. Wider Business profile/runtime, analytics, partner-workspace and sandbox surfaces remain incomplete and commercial conversion stays outside Business ownership."
          t = t[:a] + intro + t[b:]
          t = t.replace("V2 evidence at M56", "V2 evidence at M57")
          rows = []
          for line in t.splitlines():
              if line.startswith("| Business onboarding orchestration"):
                  line = "| Business onboarding orchestration       | `js/onboarding/business-onboarding.js`                                | M56 binds the frozen 28-step flow to host/adapters; M57 adds verified fail-closed route execution through the shared Navigation contract and Navigation handoff | PASS    | Preserve explicit external capability ports; Business owns onboarding state/guards, not Search, Assistant, geospatial or Navigation internals. |"
              elif line.startswith("| Live Business runtime"):
                  line = "| Live Business runtime                   | `business-live-runtime.js`                                            | onboarding now drives location, discovery, Assistant, ranking/profile and verified route behavior; wider live/analytics/workspace runtime remains incomplete | PARTIAL | Continue only from frozen observable call sites; do not restore global browser state. |"
              rows.append(line)
          t = "\n".join(rows) + "\n"
          a = t.index("## M56 score")
          b = t.index("## Dependency rule", a)
          score = "## M57 score\n\n- `PASS`: 12\n- `PARTIAL`: 3\n- `GAP`: 4\n- `N/A`: 1\n- total: 20\n\nM57 promotes `Business onboarding orchestration` from `PARTIAL` to `PASS`. The remaining route guard no longer relies on a placeholder: Business now consumes an explicit route port, the app adapter delegates to the shared `@touristic/navigation` `requestRoute()` boundary, verified route distance/duration/geometry are persisted as tutorial-only state, and `route → conversion` remains blocked until that verification succeeds.\n\nThe permanent `Business Onboarding Route Browser Contract` proves the same-origin `POST`, `foot-walking` profile, validated `LineString`, tutorial metric exclusion, route summary persistence, `businessTutorialRouteRendered`, Navigation ownership handoff through `morro:navigation-requested`, and guarded transition to `conversion`. Failure remains fail-closed and is covered by unit tests.\n\n`Live Business runtime` remains `PARTIAL`. M57 closes the onboarding-owned route orchestration gap but does not claim analytics, partner-workspace, recommendation/profile sandbox or other unrelated Business runtime breadth. Commercial conversion remains outside Business ownership.\n\nThe M54 runtime-isolation rule remains intact. Business onboarding consumes Search, location, Assistant and Navigation through explicit ports and dedicated onboarding subpaths; protected Business/Auth server consumers retain their existing module graph.\n\n"
          t = t[:a] + score + t[b:]
          a = t.index("## Evidence")
          b = t.index("## Next implementation milestone", a)
          evidence = "## Evidence\n\n`BUSINESS-M54-EVIDENCE.md` and the permanent Business Onboarding Adapter Browser Contract continue to prove Search discovery, catalog/device location and real Assistant-domain integration.\n\n`BUSINESS-M55-EVIDENCE.md` and `onboarding-host.test.ts` continue to prove host lifecycle, guarded transitions, resume/expiry handling and bounded fail-closed transitions.\n\n`BUSINESS-M56-EVIDENCE.md`, `onboarding-steps.test.ts` and the permanent Business Onboarding Browser Contract continue to prove the frozen 28-step presentation/input contract, persisted foundation inputs and representative browser lifecycle/effects.\n\n`BUSINESS-M57-EVIDENCE.md`, the expanded `business-onboarding-adapters.test.ts` and the permanent Business Onboarding Route Browser Contract prove verified same-origin route calculation, fail-closed errors, tutorial metric exclusion, Navigation ownership handoff and `route → conversion` guard release only after a valid route result.\n\nThe official Quality Gate validates formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route and Navigation Accessibility regressions must remain green on the final M57 head.\n\n"
          t = t[:a] + evidence + t[b:]
          a = t.index("## Next implementation milestone")
          nxt = "## Next implementation milestone\n\nM58 should audit the remaining Business-owned `PARTIAL`/`GAP` contracts before implementation, prioritizing frozen observable call sites rather than expanding scope by assumption. The next candidate should be selected from Business profile persistence/runtime breadth, profile sandbox/runtime, recommendation sandbox or partner-workspace integration based on executable V1 usage. Payments/checkout and commercial conversion remain separate feature ownership, and analytics endpoints must not be invented merely to improve the Business migration score.\n"
          p.write_text(t[:a] + nxt)
          PY
          pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M57-EVIDENCE.md
          pnpm exec prettier --check docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M57-EVIDENCE.md
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m57-matrix-format-once.yml
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M57-EVIDENCE.md .github/workflows/m57-matrix-format-once.yml
          git commit -m "docs(business): finalize M57 migration evidence"
          git push origin HEAD:feat/business-m57-onboarding-route-parity
