name: Place Action Runtime Facts

on:
  pull_request:
    paths:
      - ".github/workflows/place-action-runtime-facts.yml"
      - "packages/business/src/place-action-registry.ts"
      - "packages/business/src/place-action-registry.test.ts"
      - "services/ticketing/src/public-api-schema.ts"
      - "services/ticketing/src/business-inventory-repository.ts"
      - "services/ticketing/src/commerce-public-http-transport.ts"
      - "services/ticketing/src/commerce-public-http-transport.test.ts"
      - "services/ticketing/src/index.ts"
      - "apps/morro-digital-platform/tooling/ticketing-api.mjs"
      - "apps/morro-digital-platform/tooling/ticketing-action-facts.test.mjs"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"

permissions:
  contents: read

concurrency:
  group: place-action-runtime-facts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical Place Action Registry
        run: pnpm --filter @touristic/business exec vitest run src/place-action-registry.test.ts
      - name: Verify Ticketing canonical binding boundary
        run: pnpm --filter @touristic/ticketing-server test -- src/commerce-public-http-transport.test.ts
      - name: Build runtime dependencies
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/core build
          pnpm --filter @touristic/business build
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/ordering build
          pnpm --filter @touristic/ticketing build
          pnpm --filter @touristic/ticketing-server build
          pnpm --filter @touristic/crm-server build
          pnpm --filter @touristic/ordering-server build
          pnpm --filter @touristic/financial-server build
      - name: Verify Ticketing action facts adapter
        run: node --test apps/morro-digital-platform/tooling/ticketing-action-facts.test.mjs
      - name: Verify affected typechecks
        run: |
          pnpm --filter @touristic/business typecheck
          pnpm --filter @touristic/ticketing-server typecheck
          pnpm --filter @touristic/morro-digital-platform typecheck