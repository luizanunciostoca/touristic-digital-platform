name: Temporary M148 Row Typing Patch

on:
  push:
    branches:
      - feat/ticketing-m148-transactional-checkin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ticketing-m148-transactional-checkin
          fetch-depth: 0
      - name: Apply strict MySQL row typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/ticketing/src/transaction-mysql-integration.test.ts')
          text = path.read_text()
          old_import = 'import mysql, { type Pool } from "mysql2/promise";'
          new_import = 'import mysql, { type Pool, type RowDataPacket } from "mysql2/promise";'
          if old_import not in text:
              raise SystemExit('expected mysql import not found')
          text = text.replace(old_import, new_import, 1)
          marker = 'const describeMySql =\n  transactionDatabaseUrl && adminUrl ? describe : describe.skip;\n\n'
          addition = '''interface OfflineEnvelopeSyncRow extends RowDataPacket {\n  synced_at: Date;\n  checkin_id: string;\n}\n\n'''
          if marker not in text:
              raise SystemExit('describe marker not found')
          if addition not in text:
              text = text.replace(marker, marker + addition, 1)
          old_query = 'const [rows] = await pool.query(\n      "SELECT synced_at, checkin_id FROM ticketing_offline_envelopes WHERE envelope_id = ?",'
          new_query = 'const [rows] = await pool.query<OfflineEnvelopeSyncRow[]>(\n      "SELECT synced_at, checkin_id FROM ticketing_offline_envelopes WHERE envelope_id = ?",'
          if old_query not in text:
              raise SystemExit('expected query not found')
          text = text.replace(old_query, new_query, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/m148-type-offline-row-once.yml
      - name: Publish patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ticketing): type M148 offline persistence row"
          git push origin HEAD:feat/ticketing-m148-transactional-checkin
