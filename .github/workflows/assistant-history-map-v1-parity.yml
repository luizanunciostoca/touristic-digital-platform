name: Assistant V1 History Map Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/assistant-history-map-v1-parity.yml
      - apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.ts
      - apps/morro-digital-platform/src/assistant/assistant-v1-history-adapter.test.ts
      - apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.ts
      - apps/morro-digital-platform/src/assistant/assistant-v1-map-command-adapter.test.ts
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts
      - packages/geospatial/src/**
      - packages/search/src/**

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/assistant-history-map
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-history-map/server.log 2>&1 &
          echo $! >/tmp/assistant-history-map/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-history-map/server.log
          exit 1
      - name: Validate V1 history and map commands in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function poll(read, accept, label, timeout = 10000) {
            const deadline = Date.now() + timeout;
            let last;
            while (Date.now() < deadline) {
              last = await read();
              if (accept(last)) return last;
              await sleep(100);
            }
            throw new Error(`${label}: ${JSON.stringify(last)}`);
          }

          async function openAssistant(page) {
            await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 7000 });
            const assistant = page.locator('#assistant-messages');
            const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
            await quickAction.waitFor({ state: 'visible', timeout: 7000 });
            if (!(await assistant.isVisible())) await quickAction.click();
            await assistant.waitFor({ state: 'visible', timeout: 7000 });
          }

          async function submit(page, text, eventType) {
            const before = await page.evaluate(() => globalThis.__historyMapEvents?.length ?? 0);
            const input = page.locator('#assistantInput');
            await input.fill(text);
            await input.press('Enter');
            const event = await poll(
              () => page.evaluate(index => globalThis.__historyMapEvents?.[index] ?? null, before),
              value => Boolean(value && value.type === eventType),
              `event ${eventType} for ${text}`,
            );
            return event;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              localStorage.setItem('morro-digital-onboarded', '1');
              localStorage.setItem('voice-enabled', 'false');
              localStorage.setItem('voice-language', 'pt');
            });
            const page = await context.newPage();
            const pageErrors = [];
            const mapboxHttpErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('response', response => {
              if (response.url().includes('mapbox.com') && response.status() >= 400) {
                mapboxHttpErrors.push({ status: response.status(), url: response.url() });
              }
            });
            await page.route('**/api/weather', route => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({
                temperatureCelsius: 28,
                temperatureMaxCelsius: 31,
                temperatureMinCelsius: 24,
                humidityPercent: 78,
                windSpeedKph: 18,
                rainChancePercent: 42,
                weatherCode: 1,
                isDay: true,
                forecast: [],
              }),
            }));

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({ state: 'attached', timeout: 30000 });
            await openAssistant(page);
            await page.evaluate(() => {
              globalThis.__historyMapEvents = [];
              document.addEventListener('morro:assistant-map-command-routed', event => {
                globalThis.__historyMapEvents.push({ type: 'map', detail: event.detail });
              });
              document.addEventListener('morro:assistant-history-routed', event => {
                globalThis.__historyMapEvents.push({ type: 'history', detail: event.detail });
              });
            });

            const filterEvent = await submit(page, 'filtrar praias', 'map');
            if (filterEvent.detail?.command !== 'filter') throw new Error(`filter command mismatch: ${JSON.stringify(filterEvent)}`);
            await poll(
              () => page.evaluate(() => ({
                count: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                filter: document.getElementById('map')?.getAttribute('data-map-command-filter'),
                flowExists: Boolean(document.getElementById('assistant-category-results')),
              })),
              state => state.count === 8 && state.filter === 'beaches' && !state.flowExists,
              'map-only beach filter',
            );

            await submit(page, 'visão geral', 'map');
            await poll(
              () => page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                const center = map?.getCenter?.();
                return center ? { lng: center.lng, lat: center.lat, zoom: map.getZoom?.() } : null;
              }),
              state => Boolean(state && Math.abs(state.lng + 38.9145) < 0.003 && Math.abs(state.lat + 13.382) < 0.003 && Math.abs(state.zoom - 14) < 0.15),
              'overview camera',
            );

            await submit(page, 'mostrar no mapa Toca do Morcego', 'map');
            await poll(
              () => page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                const center = map?.getCenter?.();
                return center ? { lng: center.lng, lat: center.lat, zoom: map.getZoom?.() } : null;
              }),
              state => Boolean(state && Math.abs(state.lng + 38.9172057) < 0.002 && Math.abs(state.lat + 13.3766787) < 0.002 && Math.abs(state.zoom - 17) < 0.15),
              'Toca focus camera',
            );

            await submit(page, 'zoom in', 'map');
            await poll(
              () => page.evaluate(() => globalThis.mapboxPrimaryInstance?.getZoom?.() ?? null),
              zoom => typeof zoom === 'number' && Math.abs(zoom - 19) < 0.15,
              'zoom in camera',
            );

            await submit(page, 'modo satélite', 'map');
            await poll(
              () => page.evaluate(() => Boolean(globalThis.mapboxPrimaryInstance?.isStyleLoaded?.())),
              ready => ready === true,
              'satellite style load',
              15000,
            );
            const satelliteText = await page.locator('.message.assistant').last().textContent();
            if (!satelliteText?.toLowerCase().includes('satélite')) throw new Error(`satellite response missing: ${satelliteText}`);

            await submit(page, 'modo normal', 'map');
            await poll(
              () => page.evaluate(() => Boolean(globalThis.mapboxPrimaryInstance?.isStyleLoaded?.())),
              ready => ready === true,
              'default style load',
              15000,
            );

            await submit(page, 'meu histórico', 'history');
            const historyText = await page.locator('.message.assistant').last().textContent();
            if (!historyText?.includes('Seu histórico recente:')) throw new Error(`history heading missing: ${historyText}`);
            if (!historyText.includes('Você: visão geral')) throw new Error(`history did not preserve prior map turn: ${historyText}`);
            if (!historyText.includes('Assistente:')) throw new Error(`history role formatting missing: ${historyText}`);

            const optionValues = await page.locator('.assistant-options:not(:has([data-explore-category])) .assistant-option-btn').evaluateAll(buttons => buttons.map(button => button.getAttribute('data-value')));
            if (optionValues.length !== 0) throw new Error(`history should not expose map options: ${JSON.stringify(optionValues)}`);

            if (pageErrors.length || mapboxHttpErrors.length) {
              throw new Error(`browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
            }

            await page.screenshot({ path: '/tmp/assistant-history-map/history-map-parity.png', fullPage: true });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-v1-history-map-evidence
          path: |
            /tmp/assistant-history-map/history-map-parity.png
            /tmp/assistant-history-map/server.log
          if-no-files-found: warn
