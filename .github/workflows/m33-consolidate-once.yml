name: M33 Consolidate Once

on:
  push:
    branches:
      - feat/assistant-m33-ui-lifecycle-parity

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m33-ui-lifecycle-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Consolidate runtime and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          text = path.read_text()
          anchor = 'import { createAssistantMessageDom } from "./assistant-message-dom.js";\n'
          addition = '''import {
            clearAssistantDomOptions,
            readAssistantResponseOptions,
            renderAssistantDomOptions,
          } from "./assistant-dom-view.js";
          '''
          if 'readAssistantResponseOptions' not in text:
              text = text.replace(anchor, anchor + addition)
          text = text.replace(
              '    if (!value) return { text: "Como posso ajudar?" };\n    appendStandardMessage("user", value);',
              '    if (!value) return { text: "Como posso ajudar?" };\n    clearAssistantDomOptions(options.document);\n    appendStandardMessage("user", value);',
          )
          text = text.replace(
              '    appendStandardMessage("assistant", response.text);\n    const voicePreferences = voice?.getPreferences();',
              '    appendStandardMessage("assistant", response.text);\n    const responseOptions = readAssistantResponseOptions(response);\n    if (responseOptions.length > 0) {\n      renderAssistantDomOptions(options.document, responseOptions);\n    }\n    const voicePreferences = voice?.getPreferences();',
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-dom-view.ts \
            apps/morro-digital-platform/src/assistant/assistant-dom-view.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-message-dom.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - name: Commit consolidated M33 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m33-consolidate-once.yml
          git add apps/morro-digital-platform/src/assistant
          git commit -m "feat(assistant): consolidate M33 DOM lifecycle parity"
          git push origin HEAD:feat/assistant-m33-ui-lifecycle-parity
