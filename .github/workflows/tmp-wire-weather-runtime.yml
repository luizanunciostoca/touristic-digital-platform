name: Temporary Wire Weather Provider Runtime

# One-shot maintenance workflow. Delete after the runtime wiring commit is verified.
on:
  push:
    branches:
      - fix/v1-home-parity-weather-globe-20260912
    paths:
      - .github/workflows/tmp-wire-weather-runtime.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-home-parity-weather-globe-20260912
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply runtime wiring
        run: node .github/tmp-wire-weather-runtime.mjs
      - name: Format and validate
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/tooling/dev-server.mjs .github/workflows/v1-home-parity-browser-regression.yml
          git diff --check
          pnpm --filter @touristic/morro-digital-platform test -- weather-provider-mappers weather-widget
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/tooling/dev-server.mjs \
                  .github/workflows/v1-home-parity-browser-regression.yml
          if git diff --cached --quiet; then
            echo 'No runtime wiring changes needed.'
            exit 0
          fi
          git commit -m 'refactor(weather): use tested provider mappers in runtime'
          git push origin HEAD:fix/v1-home-parity-weather-globe-20260912
