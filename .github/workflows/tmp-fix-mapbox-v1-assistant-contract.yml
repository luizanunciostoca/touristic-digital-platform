name: Temporary Mapbox V1 Assistant Contract Fixer

on:
  push:
    branches:
      - fix/v1-public-tutorial-assistant-welcome-20260912
    paths:
      - .github/workflows/tmp-fix-mapbox-v1-assistant-contract.yml

permissions:
  contents: write

jobs:
  fix-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-public-tutorial-assistant-welcome-20260912
      - name: Reconcile Mapbox visual contract with audited V1 assistant lifecycle
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mapbox-visual-contract-regression.yml')
          text = path.read_text()
          text = text.replace(
              '      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts\n',
              '      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts\n      - apps/morro-digital-platform/src/onboarding/public-interactive-tour.ts\n',
          )
          text = text.replace(
              '                !state.outline &&\n                !state.assistantVisible\n',
              '                !state.outline &&\n                state.assistantVisible\n',
          )
          text = text.replace(
              "throw new Error('Mapbox Home did not reach clean idle state before timeout.');",
              "throw new Error('Mapbox Home did not reach V1 idle + visible assistant state before timeout.');",
          )
          text = text.replace(
              "            await page.locator('.quick-actions .action-button.primary').click();\n            await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });\n",
              "            await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });\n",
          )
          text = text.replace(
              "assistantLifecycle: 'The audited V1 starts hidden; the contract opens the Assistant before validating its modal focus order.',",
              "assistantLifecycle: 'The audited V1 starts with the Assistant welcome visible; the contract preserves that state while validating its modal focus order.',",
          )
          path.write_text(text)
          PY
      - name: Verify intended diff only
        run: git diff --check && git diff -- .github/workflows/mapbox-visual-contract-regression.yml
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mapbox-visual-contract-regression.yml
          git commit -m 'test(home): align Mapbox contract with V1 assistant welcome'
          git push origin HEAD:fix/v1-public-tutorial-assistant-welcome-20260912
