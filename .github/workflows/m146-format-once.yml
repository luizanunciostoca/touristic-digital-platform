name: Temporary M146 Formatter

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-format-once.yml"
      - "packages/financial/src/settlement.ts"
      - "packages/financial/src/settlement.test.ts"
      - "services/financial/src/mysql-settlement-repository.ts"
      - "services/financial/src/sandbox-settlement-provider.ts"
      - "services/financial/src/sandbox-settlement-provider.test.ts"
      - "services/financial/src/settlement-application-service.ts"
      - "services/financial/src/settlement-mysql-integration.test.ts"
      - "services/financial/src/settlement-schema.ts"
      - "services/financial/src/settlement.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/financial/src/settlement.ts \
            packages/financial/src/settlement.test.ts \
            services/financial/src/mysql-settlement-repository.ts \
            services/financial/src/sandbox-settlement-provider.ts \
            services/financial/src/sandbox-settlement-provider.test.ts \
            services/financial/src/settlement-application-service.ts \
            services/financial/src/settlement-mysql-integration.test.ts \
            services/financial/src/settlement-schema.ts \
            services/financial/src/settlement.ts
          git diff --check
      - name: Commit formatting only when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/financial/src/settlement.ts \
            packages/financial/src/settlement.test.ts \
            services/financial/src/mysql-settlement-repository.ts \
            services/financial/src/sandbox-settlement-provider.ts \
            services/financial/src/sandbox-settlement-provider.test.ts \
            services/financial/src/settlement-application-service.ts \
            services/financial/src/settlement-mysql-integration.test.ts \
            services/financial/src/settlement-schema.ts \
            services/financial/src/settlement.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(payments): format M146 settlement"
            git push origin HEAD:feat/payments-m146-settlement
          fi
