name: Patch Navigation Visual GPS Temp

on:
  push:
    branches:
      - feat/navigation-camera-visual-baseline
    paths:
      - tooling/patch-navigation-visual-gps.cjs
      - .github/workflows/navigation-visual-gps-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-camera-visual-baseline
      - run: node tooling/patch-navigation-visual-gps.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/navigation-visual-baseline.yml
          git commit -m "fix: drive live GPS update in navigation visual baseline"
          git push origin HEAD:feat/navigation-camera-visual-baseline
