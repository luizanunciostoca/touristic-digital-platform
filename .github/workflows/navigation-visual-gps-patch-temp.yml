name: Patch Navigation Visual GPS Temp

on:
  push:
    branches:
      - feat/navigation-camera-visual-baseline
    paths:
      - .github/workflows/navigation-visual-gps-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-camera-visual-baseline
      - name: Patch deterministic GPS progression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/navigation-visual-baseline.yml')
          text = path.read_text()
          old = '''            await page.locator('#instruction-banner:not(.hidden)').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#end-navigation-btn').waitFor({ state: 'visible', timeout: 15000 });
            await poll(page, () => {
              const evidence = globalThis.__navigationEvidence;
              return Boolean(
                evidence?.events?.some((event) => event.type === 'navigationRouteRuntimeUpdated') &&
                evidence?.events?.some((event) => event.type === 'navigationStarted') &&
                evidence.camera.length > 0
              );
            });
            await page.waitForTimeout(700);
'''
          new = '''            await page.locator('#instruction-banner:not(.hidden)').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#end-navigation-btn').waitFor({ state: 'visible', timeout: 15000 });
            await poll(page, () =>
              globalThis.__navigationEvidence?.events?.some((event) => event.type === 'navigationStarted'),
            );

            // getCurrentPosition() seeds routing; watchPosition() needs a deterministic
            // movement to exercise the live runtime/presenter path in Chromium.
            await context.setGeolocation({
              latitude: -13.37615,
              longitude: -38.91715,
            });
            await poll(page, () => {
              const evidence = globalThis.__navigationEvidence;
              return Boolean(
                evidence?.events?.some((event) => event.type === 'navigationRouteRuntimeUpdated') &&
                evidence?.events?.some((event) => event.type === 'userLocationUpdated') &&
                evidence.camera.length > 0
              );
            });
            await page.waitForTimeout(700);
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/navigation-visual-baseline.yml
          git commit -m "fix: drive live GPS update in navigation visual baseline"
          git push origin HEAD:feat/navigation-camera-visual-baseline
