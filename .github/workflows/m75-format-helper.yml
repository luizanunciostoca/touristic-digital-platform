name: M75 temporary formatter

on:
  push:
    branches:
      - feat/crm-m75-meetings-transport-composition
    paths:
      - ".github/workflows/m75-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m75-meetings-transport-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/crm/src/meetings-http-transport.ts services/crm/src/meetings-http-transport.test.ts
      - name: Commit formatted M75 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/crm/src/meetings-http-transport.ts services/crm/src/meetings-http-transport.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(crm): format M75 transport"
          git push origin HEAD:feat/crm-m75-meetings-transport-composition
