name: M49 Prepare Core Once

on:
  push:
    branches:
      - feat/business-m49-core-auth-consumer
    paths:
      - .github/workflows/m49-prepare-core-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m49-core-auth-consumer
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: pnpm exec prettier --write packages/business/package.json packages/business/src/index.ts packages/business/src/index.test.ts pnpm-lock.yaml
      - name: Commit prepared core and remove helper
        run: |
          rm .github/workflows/m49-prepare-core-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/package.json packages/business/src/index.ts packages/business/src/index.test.ts pnpm-lock.yaml .github/workflows/m49-prepare-core-once.yml
          git commit -m "chore(business): prepare M49 core"
          git push origin HEAD:feat/business-m49-core-auth-consumer
