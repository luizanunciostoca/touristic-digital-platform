name: Assistant M1 format sync

on:
  push:
    branches: [feat/assistant-runtime-m1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-m1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M1 files
        run: |
          pnpm exec prettier --write \
            docs/migration/ASSISTANT-MIGRATION-MATRIX.md \
            packages/assistant/src/intent-engine.ts \
            packages/assistant/src/intent-engine.test.ts \
            packages/assistant/src/menu.ts \
            packages/assistant/src/menu.test.ts \
            packages/assistant/src/index.ts \
            packages/assistant/package.json \
            packages/assistant/tsconfig.json \
            pnpm-lock.yaml
      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md packages/assistant pnpm-lock.yaml
          git commit -m "style(assistant): format M1 files"
          git push origin HEAD:feat/assistant-runtime-m1
