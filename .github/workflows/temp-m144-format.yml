name: Temporary M144 Formatter

on:
  push:
    branches:
      - feat/payments-m144-refund-command

permissions:
  contents: write

concurrency:
  group: temporary-m144-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m144-refund-command
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M144 changes
        run: |
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' > /tmp/m144-files
          if [ -s /tmp/m144-files ]; then
            xargs pnpm exec prettier --write < /tmp/m144-files
          fi
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style(payments): format M144 documentation"
            git push origin HEAD:feat/payments-m144-refund-command
          fi
