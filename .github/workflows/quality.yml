name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Turbo lint/typecheck cache
        uses: actions/cache@v4
        with:
          path: /tmp/turbo-cache
          key: turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Validate Feature Registry
        run: pnpm features:check
      - name: Lint
        env:
          TURBO_CACHE_DIR: /tmp/turbo-cache
        run: pnpm lint
      - name: Typecheck
        env:
          TURBO_CACHE_DIR: /tmp/turbo-cache
        run: pnpm typecheck
      - name: Test
        if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        run: pnpm test
      - name: Build
        if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        run: pnpm build
