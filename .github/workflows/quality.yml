name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: /tmp/turbo-cache

jobs:
  impact:
    uses: ./.github/workflows/ci-impact.yml

  core-quality:
    needs: impact
    if: always()
    name: Core Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: ${{ needs.impact.outputs.non_runtime != 'true' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: canonical-mysql
          MYSQL_DATABASE: affiliates_m154_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcanonical-mysql"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Require successful impact classification
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
        run: test "$IMPACT_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore shared Turbo proof cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/turbo-cache
          key: turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'eslint.config.mjs', 'tsconfig.base.json') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce workflow concurrency policy
        run: node tooling/quality/check-workflow-concurrency.mjs
      - name: Check formatting
        run: pnpm format:check
      - name: Enforce Stylelint V2 CSS governance
        if: needs.impact.outputs.non_runtime != 'true'
        run: pnpm css:stylelint
      - name: Enforce humanized public Assistant copy
        run: node tooling/quality/check-assistant-public-copy.mjs
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Validate Feature Registry
        run: pnpm features:check
      - name: Reconcile environment inventory
        run: pnpm environment:check
      - name: Validate release-readiness guardrails
        run: pnpm release:readiness:check
      - name: Scan tracked content for credential signatures
        run: pnpm secret-patterns:check
      - name: Validate CI and repository governance contracts
        run: pnpm ci:governance:check
      - name: Validate release deployment target governance
        run: pnpm release:target-governance:check
      - name: Release gate negative contracts
        run: pnpm release:gates:negative-check
      - name: Enforce workflow supply chain
        run: pnpm ci:supply-chain:strict
      - name: Validate CI selection and candidate identity
        run: node --test tooling/ci/*.test.mjs tooling/quality/ci-scheduler-governance.test.mjs
      - name: Validate operational tooling contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['ls-files', '-z', '--', 'tooling/workspace/*.test.mjs', 'tooling/control-state/*.test.mjs'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          if (files.length) execFileSync(process.execPath, ['--test', ...files], { stdio: 'inherit' });
          else console.log('No operational tooling contracts are tracked in this candidate.');
          NODE
      - name: Validate governance contracts
        if: needs.impact.outputs.non_runtime == 'true'
        run: >-
          node --test
          tooling/fabric/*.test.mjs
          .github/agents/*.test.mjs
          .github/hooks/*.test.mjs
      - name: Lint
        if: needs.impact.outputs.non_runtime != 'true'
        run: pnpm lint
      - name: Typecheck
        if: needs.impact.outputs.non_runtime != 'true'
        run: pnpm typecheck
      - name: Test
        if: needs.impact.outputs.non_runtime != 'true'
        env:
          CONTENT_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/affiliates_m154_test
        run: pnpm test
      - name: Build
        if: needs.impact.outputs.non_runtime != 'true'
        run: pnpm build
      - name: Validate canonical MySQL matrix
        if: needs.impact.outputs.non_runtime != 'true'
        env:
          MYSQL_ADMIN_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/mysql
          FINANCIAL_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/financial_m137_test
          ORDERING_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/ordering_m137_test
          TICKETING_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/ticketing_m147_test
          AFFILIATES_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/affiliates_m154_test
          CONTENT_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/affiliates_m154_test
          DESTINATIONS_DATABASE_URL: mysql://root:canonical-mysql@127.0.0.1:3306/destinations_owner_test
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local domain="$1"
            local workspace="$2"
            pnpm --filter "$workspace" exec vitest run \
              --passWithNoTests \
              --no-file-parallelism \
              --reporter=json \
              --outputFile="/tmp/mysql-${domain}.json"
          }

          run_suite financial @touristic/financial-server
          run_suite ordering @touristic/ordering-server
          run_suite crm @touristic/crm-server
          run_suite ticketing @touristic/ticketing-server
          run_suite affiliates @touristic/affiliates-server
          run_suite content @touristic/content-server
          run_suite destinations @touristic/destinations-server

          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const domains = ['financial', 'ordering', 'crm', 'ticketing', 'affiliates', 'content', 'destinations'];
          let passed = 0;
          let total = 0;

          for (const domain of domains) {
            const result = JSON.parse(readFileSync(`/tmp/mysql-${domain}.json`, 'utf8'));
            const failed = result.numFailedTests ?? 0;
            const skipped = result.numPendingTests ?? 0;
            const failedSuites = result.numFailedTestSuites ?? 0;
            const skippedSuites = result.numPendingTestSuites ?? 0;
            const domainPassed = result.numPassedTests ?? 0;
            const domainTotal = result.numTotalTests ?? 0;

            if (
              failed !== 0 ||
              skipped !== 0 ||
              failedSuites !== 0 ||
              skippedSuites !== 0 ||
              domainPassed !== domainTotal ||
              domainTotal === 0
            ) {
              throw new Error(
                `${domain} MySQL matrix is incomplete: passed=${domainPassed}, total=${domainTotal}, failed=${failed}, skipped=${skipped}, failedSuites=${failedSuites}, skippedSuites=${skippedSuites}`,
              );
            }

            console.log(`${domain}: ${domainPassed}/${domainTotal} PASS`);
            passed += domainPassed;
            total += domainTotal;
          }

          console.log(`Canonical MySQL matrix: ${passed}/${total} PASS`);
          NODE

  suite-payments-operational-ledger-contract:
    needs: impact
    if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.scheduled_suites || '[]'), 'payments-operational-ledger-contract.yml')
    uses: ./.github/workflows/payments-operational-ledger-contract.yml

  suite-payments-persistence-integration:
    needs: impact
    if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.scheduled_suites || '[]'), 'payments-persistence-integration.yml')
    uses: ./.github/workflows/payments-persistence-integration.yml

  suite-payments-sandbox-provider-contract:
    needs: impact
    if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.scheduled_suites || '[]'), 'payments-sandbox-provider-contract.yml')
    uses: ./.github/workflows/payments-sandbox-provider-contract.yml

  suite-payments-settlement-contract:
    needs: impact
    if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.scheduled_suites || '[]'), 'payments-settlement-contract.yml')
    uses: ./.github/workflows/payments-settlement-contract.yml

  suite-payments-subscription-recurrence-contract:
    needs: impact
    if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.scheduled_suites || '[]'), 'payments-subscription-recurrence-contract.yml')
    uses: ./.github/workflows/payments-subscription-recurrence-contract.yml

  quality:
    name: quality
    if: always()
    needs:
      - impact
      - core-quality
      - suite-payments-operational-ledger-contract
      - suite-payments-persistence-integration
      - suite-payments-sandbox-provider-contract
      - suite-payments-settlement-contract
      - suite-payments-subscription-recurrence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require every selected suite and core gate to succeed
        env:
          CI_SELECTED_SUITES: ${{ needs.impact.outputs.scheduled_suites }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tooling/ci/suite-scheduler.mjs --verify

      - name: Upload exact-source Quality child proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality-${{ github.run_id }}
          path: ci-quality-proof.json
          if-no-files-found: error
          retention-days: 30
