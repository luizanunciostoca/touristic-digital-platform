name: Assistant Input V1 Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/assistant-input-v1-parity.yml
      - apps/morro-digital-platform/public/assistant-input-v1-parity.js
      - apps/morro-digital-platform/public/index.html
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts

permissions:
  contents: read

jobs:
  assistant-input-v1-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start browser runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-input-v1-parity.log 2>&1 &
          echo $! >/tmp/assistant-input-v1-parity.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-input-v1-parity.log
          exit 1
      - name: Verify V1 typed-input dispatch and mobile keyboard contract
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
                globalThis.__v1InputSubmissions = [];
                globalThis.__v1InputOptionSelections = [];
                document.addEventListener('morro:assistant-input-submitted', (event) => {
                  globalThis.__v1InputSubmissions.push(event.detail);
                });
                document.addEventListener('morro:assistant-option-selected', (event) => {
                  if (typeof event.detail?.value === 'string') {
                    globalThis.__v1InputOptionSelections.push(event.detail.value);
                  }
                });
              });

              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });

              const input = page.locator('#assistantInput');
              const send = page.locator('#sendButton');
              await input.waitFor({ state: 'visible', timeout: 10000 });

              const initial = await input.evaluate((element) => ({
                marker: element.dataset.v1InputParity,
                inlineFontSize: element.style.fontSize,
                computedFontSize: Number.parseFloat(getComputedStyle(element).fontSize),
              }));
              if (
                initial.marker !== 'true' ||
                initial.inlineFontSize !== '16px' ||
                !Number.isFinite(initial.computedFontSize) ||
                initial.computedFontSize < 16
              ) {
                throw new Error(`V1 input bootstrap diverged: ${JSON.stringify(initial)}`);
              }

              await input.fill('  praias  ');
              await send.click();
              if ((await input.inputValue()) !== '') {
                throw new Error('Valid button submission did not clear input immediately');
              }

              await input.evaluate((element) => {
                element.value = '   ';
              });
              await send.click();
              if ((await input.inputValue()) !== '   ') {
                throw new Error('Whitespace-only input must be preserved and ignored');
              }

              await input.fill('restaurantes');
              await input.press('Enter');
              if ((await input.inputValue()) !== '') {
                throw new Error('Keyboard submission did not clear input immediately');
              }

              await input.fill('rascunho shift');
              await input.dispatchEvent('keydown', {
                key: 'Enter',
                code: 'Enter',
                shiftKey: true,
                bubbles: true,
                cancelable: true,
              });
              if ((await input.inputValue()) !== 'rascunho shift') {
                throw new Error('Shift+Enter must not submit or clear the draft');
              }

              await input.fill('rascunho ime');
              await page.evaluate(() => {
                const element = document.querySelector('#assistantInput');
                element?.dispatchEvent(
                  new KeyboardEvent('keydown', {
                    key: 'Enter',
                    code: 'Enter',
                    bubbles: true,
                    cancelable: true,
                    isComposing: true,
                  }),
                );
              });
              if ((await input.inputValue()) !== 'rascunho ime') {
                throw new Error('IME composition Enter must not submit or clear the draft');
              }

              const dispatchState = await page.evaluate(() => ({
                submissions: globalThis.__v1InputSubmissions,
                optionSelections: globalThis.__v1InputOptionSelections,
              }));
              const expected = [
                { message: 'praias', source: 'button' },
                { message: 'restaurantes', source: 'keyboard' },
              ];
              if (JSON.stringify(dispatchState.submissions) !== JSON.stringify(expected)) {
                throw new Error(
                  `Single-dispatch/source contract diverged: ${JSON.stringify(dispatchState)}`,
                );
              }
              if (dispatchState.optionSelections.length !== 0) {
                throw new Error(
                  `Typed input polluted option-selection events: ${JSON.stringify(dispatchState)}`,
                );
              }

              await input.focus();
              const focused = await page.evaluate(() => ({
                body: document.body.classList.contains('keyboard-visible'),
                html: document.documentElement.classList.contains('keyboard-visible'),
              }));
              if (!focused.body || !focused.html) {
                throw new Error(
                  `Keyboard-visible focus contract diverged: ${JSON.stringify(focused)}`,
                );
              }

              await input.evaluate((element) => element.blur());
              await page.waitForTimeout(700);
              const blurred = await page.evaluate(() => ({
                body: document.body.classList.contains('keyboard-visible'),
                html: document.documentElement.classList.contains('keyboard-visible'),
                x: window.scrollX,
                y: window.scrollY,
              }));
              if (blurred.body || blurred.html || blurred.x !== 0 || blurred.y !== 0) {
                throw new Error(
                  `Keyboard blur/restore contract diverged: ${JSON.stringify(blurred)}`,
                );
              }

              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/assistant-input-v1-parity.log || true
