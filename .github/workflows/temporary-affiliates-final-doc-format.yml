name: Temporary Affiliates Final Docs Format

on:
  push:
    branches:
      - docs/affiliates-equivalence-finalization-20260824

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/affiliates-equivalence-finalization-20260824
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: >-
          pnpm exec prettier --write
          docs/migration/AFFILIATES-MIGRATION-MATRIX.md
          docs/operations/AFFILIATES-ROLLOUT-ROLLBACK.md
          docs/qa/AFFILIATES-FEATURE-0010-TEST-PLAN.md
      - name: Commit formatter delta
        shell: bash
        run: |
          if git diff --quiet -- docs/migration/AFFILIATES-MIGRATION-MATRIX.md docs/operations/AFFILIATES-ROLLOUT-ROLLBACK.md docs/qa/AFFILIATES-FEATURE-0010-TEST-PLAN.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/AFFILIATES-MIGRATION-MATRIX.md docs/operations/AFFILIATES-ROLLOUT-ROLLBACK.md docs/qa/AFFILIATES-FEATURE-0010-TEST-PLAN.md
          git commit -m "style(affiliates): format final equivalence docs"
          git push origin HEAD:docs/affiliates-equivalence-finalization-20260824
