name: Voice Parity Format Temp

on:
  push:
    branches:
      - test/assistant-voice-browser-pass

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/voice-parity-format-temp.yml
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          git commit -m "docs(assistant): format Voice PASS evidence"
          git push origin HEAD:test/assistant-voice-browser-pass
