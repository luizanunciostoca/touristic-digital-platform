name: Payments Branch Format Temporary

on:
  push:
    branches:
      - fix/mercado-pago-bricks-subscriptions-20260823

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source files with canonical Prettier
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --name-only -z origin/main...HEAD -- '*.ts' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --write
          git diff --check
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style(payments): apply canonical prettier'
          git push origin HEAD:${GITHUB_REF_NAME}
