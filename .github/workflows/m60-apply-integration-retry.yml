name: M60 Apply Integration Retry
on:
  push:
    branches: [feat/business-m60-partner-workspace]
    paths: [.github/workflows/m60-apply-integration-retry.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m60-partner-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch M60
        run: |
          python <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          ctx='packages/business/src/onboarding-context.ts'
          rep(ctx,'  "tutorialBusinessProfile",\n]);','  "tutorialBusinessProfile",\n  "businessTutorialEventSummary",\n  "businessDemoPromotion",\n  "businessTutorialWorkspace",\n]);')

          rt='apps/morro-digital-platform/src/business-onboarding-runtime.ts'
          rep(rt,'import { BUSINESS_ONBOARDING_CATEGORIES } from "@touristic/business/onboarding-steps";\n','import { BUSINESS_ONBOARDING_CATEGORIES } from "@touristic/business/onboarding-steps";\nimport {\n  buildBusinessTutorialPromotion,\n  buildBusinessTutorialWorkspaceSnapshot,\n  incrementBusinessTutorialEventSummary,\n  type BusinessTutorialEventKey,\n} from "@touristic/business/onboarding-workspace";\n')
          rep(rt,'  | "profile-promotion"\n  | "route-retry";','  | "profile-promotion"\n  | "route-retry"\n  | "workspace-open-dashboard"\n  | `workspace-promotion-save:${string}`;')
          rep(rt,'  beforeTransition(context: BusinessOnboardingGuardContext): boolean {','  private trackTutorialEvent(key: BusinessTutorialEventKey): void {\n    const context = this.host.snapshot().session.conversationDraft.context;\n    const summary = incrementBusinessTutorialEventSummary(\n      context.businessTutorialEventSummary,\n      key,\n    );\n    this.host.updateRuntimeContext({ businessTutorialEventSummary: summary });\n  }\n\n  beforeTransition(context: BusinessOnboardingGuardContext): boolean {')
          rep(rt,'      await this.runDiscovery(text(context.category));\n      return;','      await this.runDiscovery(text(context.category));\n      this.trackTutorialEvent("business_discovered_by_menu");\n      return;')
          rep(rt,'      await this.runDiscovery(step.description.replace(/[“”"]/gu, ""));\n      return;','      await this.runDiscovery(step.description.replace(/[“”"]/gu, ""));\n      this.trackTutorialEvent("business_discovered_by_text_search");\n      return;')
          rep(rt,'      await this.runDiscovery(text(context.businessName));\n      return;','      await this.runDiscovery(text(context.businessName));\n      this.trackTutorialEvent("business_discovered_by_name");\n      return;')
          rep(rt,'      if (recommendation.rendered) {','      if (recommendation.rendered) {\n        this.trackTutorialEvent("business_recommended_by_assistant");')
          rep(rt,'      this.host.updateRuntimeContext({ tutorialBusinessProfile: profile });','      this.host.updateRuntimeContext({ tutorialBusinessProfile: profile });\n      this.trackTutorialEvent("business_profile_opened");')
          rep(rt,'    if (snapshot.stepId === "route") {\n      await this.verifyRoute(snapshot);\n    }','    if (snapshot.stepId === "route") {\n      await this.verifyRoute(snapshot);\n      return;\n    }\n\n    if (snapshot.stepId === "partner-panel") {\n      const workspace = buildBusinessTutorialWorkspaceSnapshot({\n        businessName: context.businessName,\n        eventSummary: context.businessTutorialEventSummary,\n      });\n      this.host.updateRuntimeContext({ businessTutorialWorkspace: workspace });\n      dispatch(this.view, "businessTutorialWorkspaceOpened", workspace);\n    }')
          rep(rt,'      this.host.updateRuntimeContext({ businessVoiceDiscoveryReady: true });','      this.host.updateRuntimeContext({ businessVoiceDiscoveryReady: true });\n      this.trackTutorialEvent("business_discovered_by_voice");')
          rep(rt,'      if (action === "profile-primary") {\n        dispatch(this.view, "businessTutorialProfilePrimaryAction", {','      if (action === "profile-primary") {\n        this.trackTutorialEvent("business_contact_action");\n        dispatch(this.view, "businessTutorialProfilePrimaryAction", {')
          rep(rt,'      dispatch(this.view, "businessTutorialProfilePromotionAction", {','      this.trackTutorialEvent("business_demo_promotion_viewed");\n      dispatch(this.view, "businessTutorialProfilePromotionAction", {')
          rep(rt,'    if (action === "route-retry") {\n      return this.verifyRoute(this.host.snapshot());\n    }\n\n    return false;','    if (action === "route-retry") {\n      return this.verifyRoute(this.host.snapshot());\n    }\n\n    if (action === "workspace-open-dashboard") {\n      dispatch(this.view, "businessProtectedDashboardRequested", {\n        href: "/apps/morro-digital-platform/public/business-dashboard.html",\n        tutorial: true,\n        requiresAuthentication: true,\n        excludeFromBusinessMetrics: true,\n      });\n      return true;\n    }\n\n    if (action.startsWith("workspace-promotion-save:")) {\n      let input: Record<string, unknown>;\n      try {\n        input = JSON.parse(decodeURIComponent(action.slice("workspace-promotion-save:".length))) as Record<string, unknown>;\n      } catch {\n        return false;\n      }\n      const promotion = buildBusinessTutorialPromotion(input);\n      if (!promotion) return false;\n      this.host.updateRuntimeContext({ businessDemoPromotion: promotion });\n      this.trackTutorialEvent("business_demo_promotion_created");\n      dispatch(this.view, "businessTutorialPromotionSaved", { promotion, tutorial: true, excludeFromBusinessMetrics: true });\n      return true;\n    }\n\n    return false;')
          rep(rt,'    dispatch(this.view, "businessTutorialRouteRendered", {','    this.trackTutorialEvent("business_route_started");\n    dispatch(this.view, "businessTutorialRouteRendered", {')

          sf='apps/morro-digital-platform/src/business-onboarding-surface.ts'
          rep(sf,'    root.addEventListener("input", (event) => {','    root.addEventListener("submit", (event) => {\n      const form = event.target;\n      if (!(form instanceof HTMLFormElement) || form.dataset.workspacePromotion !== "true") return;\n      event.preventDefault();\n      const payload = Object.fromEntries(new FormData(form).entries());\n      void this.handleRuntimeAction(`workspace-promotion-save:${encodeURIComponent(JSON.stringify(payload))}`);\n    });\n    root.addEventListener("input", (event) => {')
          rep(sf,'  private renderRuntimeActions(\n','  private renderWorkspaceSummary(container: HTMLElement, workspace: Record<string, unknown>): void {\n    const panel = this.document.createElement("article");\n    panel.className = "business-onboarding-workspace-preview";\n    panel.setAttribute("aria-label", "Resumo da sessão demonstrativa");\n    const title = this.document.createElement("h2");\n    title.textContent = `Resultados de ${stringValue(workspace.businessName) || "Sua empresa"}`;\n    const note = this.document.createElement("p");\n    note.textContent = "Estes números pertencem somente a esta demonstração e não alimentam métricas comerciais.";\n    panel.append(title, note);\n    const metrics = Array.isArray(workspace.metrics) ? workspace.metrics : [];\n    const list = this.document.createElement("dl");\n    list.className = "business-onboarding-workspace-metrics";\n    for (const metricValue of metrics) {\n      const metric = objectValue(metricValue);\n      if (!metric) continue;\n      const row = this.document.createElement("div");\n      const label = this.document.createElement("dt"); label.textContent = stringValue(metric.label);\n      const value = this.document.createElement("dd"); value.textContent = String(typeof metric.value === "number" ? metric.value : 0);\n      row.append(label, value); list.append(row);\n    }\n    panel.append(list); container.append(panel);\n  }\n\n  private renderPromotionForm(container: HTMLElement, context: Readonly<Record<string, unknown>>): void {\n    const defaults: Record<string, readonly [string,string,string]> = {\n      restaurant:["Oferta especial de hoje","Condição exclusiva para quem encontrou a empresa pelo Morro Digital.","Ver oferta"],\n      lodging:["Benefício na reserva","Consulte uma condição especial para sua hospedagem.","Consultar"],\n      tour:["Condição especial no passeio","Garanta uma vantagem ao reservar pelo Morro Digital.","Reservar"],\n      events:["Ingresso ou benefício especial","Confira a condição disponível para este evento.","Ver evento"],\n    };\n    const [defaultTitle,defaultDescription,defaultCta]=defaults[stringValue(context.category)] ?? ["Oferta especial","Confira uma condição exclusiva disponível agora.","Ver oferta"];\n    const form=this.document.createElement("form"); form.dataset.workspacePromotion="true"; form.className="business-onboarding-promotion-form";\n    form.innerHTML=`<label>Título<input name="title" maxlength="90" required></label><label>Descrição<textarea name="description" maxlength="220" required></textarea></label><label>Botão<input name="cta" maxlength="50" required></label><label>Validade<input name="validUntil" type="date"></label><button type="submit" class="business-onboarding-runtime-action is-primary">Salvar promoção demonstrativa</button>`;\n    const title=form.querySelector<HTMLInputElement>(\'input[name="title"]\'); const description=form.querySelector<HTMLTextAreaElement>(\'textarea[name="description"]\'); const cta=form.querySelector<HTMLInputElement>(\'input[name="cta"]\');\n    if(title) title.value=defaultTitle; if(description) description.value=defaultDescription; if(cta) cta.value=defaultCta; container.append(form);\n  }\n\n  private renderRuntimeActions(\n')
          rep(sf,'    } else if (snapshot.stepId === "route") {','    } else if (snapshot.stepId === "promotions") {\n      this.renderPromotionForm(container, context);\n    } else if (snapshot.stepId === "partner-panel") {\n      const workspace = objectValue(context.businessTutorialWorkspace);\n      if (workspace) this.renderWorkspaceSummary(container, workspace);\n      this.appendRuntimeButton(actions, "workspace-open-dashboard", "Abrir dashboard protegido", true);\n    } else if (snapshot.stepId === "route") {')

          html='apps/morro-digital-platform/public/business-onboarding.html'
          rep(html,'          "@touristic/business/onboarding-profile": "/packages/business/dist/onboarding-profile.js",','          "@touristic/business/onboarding-profile": "/packages/business/dist/onboarding-profile.js",\n          "@touristic/business/onboarding-workspace": "/packages/business/dist/onboarding-workspace.js",')
          PY
      - run: pnpm exec prettier --write packages/business/src/onboarding-context.ts apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/public/business-onboarding.html
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/src/onboarding-context.ts apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/public/business-onboarding.html
          git commit -m "feat(business): integrate M60 partner workspace runtime"
          git push origin HEAD:feat/business-m60-partner-workspace
