name: Format Tour I18n Temp

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tour-content-i18n
    paths:
      - .github/workflows/format-tour-i18n-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tour-content-i18n
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format tour localization files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/config/tour-editorial-source.ts \
            apps/morro-digital-platform/src/config/tour-localization.ts \
            apps/morro-digital-platform/src/config/tour-localization.test.ts \
            apps/morro-digital-platform/src/config/tour-translations-en.ts \
            apps/morro-digital-platform/src/config/tour-translations-es.ts \
            apps/morro-digital-platform/src/config/tour-translations-he.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/config/tour-editorial-source.ts \
            apps/morro-digital-platform/src/config/tour-localization.ts \
            apps/morro-digital-platform/src/config/tour-localization.test.ts \
            apps/morro-digital-platform/src/config/tour-translations-en.ts \
            apps/morro-digital-platform/src/config/tour-translations-es.ts \
            apps/morro-digital-platform/src/config/tour-translations-he.ts
          git commit -m "style: format V1 tour localization"
          git push origin HEAD:feat/tour-content-i18n
