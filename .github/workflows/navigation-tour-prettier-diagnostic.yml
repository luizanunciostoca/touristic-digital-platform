name: Navigation Tour Prettier Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/navigation-tour-prettier-diagnostic.yml
      - apps/morro-digital-platform/public/explore-locations.css
      - apps/morro-digital-platform/public/navigation-map.css
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/src/ux/navigation-tour-manual-conformance.test.ts

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier output
        run: |
          files=(
            apps/morro-digital-platform/public/explore-locations.css
            apps/morro-digital-platform/public/navigation-map.css
            apps/morro-digital-platform/public/premium-ux-v2.css
            apps/morro-digital-platform/src/ux/navigation-tour-manual-conformance.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "::MD_FORMAT_FILE_BEGIN::${file}"
            cat "${file}"
            echo "::MD_FORMAT_FILE_END::${file}"
          done
