name: PR73 Source Finalizer

on:
  pull_request:
    paths:
      - .github/workflows/pr73-source-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited CI fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patch(path, replacements) {
            let source = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!source.includes(from)) {
                throw new Error(`Expected source fragment not found in ${path}: ${from.slice(0, 120)}`);
              }
              source = source.replace(from, to);
            }
            fs.writeFileSync(path, source);
          }

          patch('apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts', [[
            '.replace(/[^\\p{L}\\p{N}\\s\\[\\]_]/gu, " ")',
            '.replace(/[^\\p{L}\\p{N}\\s[\\]_]/gu, " ")',
          ]]);

          patch('apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts', [[
            '  createAssistantUserProfileManager,\n',
            '  type createAssistantUserProfileManager,\n',
          ]]);

          patch('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts', [
            [
`  const metadata = response.metadata;
  if (
    !metadata ||
    typeof metadata !== "object" ||
    metadata.deterministic !== true ||
    metadata.fromLLM === true ||
    !Array.isArray(metadata.exploreCommands)
  ) {
    return [];
  }

  const commands: ExploreLocationsCommand[] = [];
  for (const raw of metadata.exploreCommands) {`,
`  const metadata = response.metadata;
  const rawCommands: unknown =
    metadata && typeof metadata === "object"
      ? metadata.exploreCommands
      : undefined;
  if (
    !metadata ||
    typeof metadata !== "object" ||
    metadata.deterministic !== true ||
    metadata.fromLLM === true ||
    !Array.isArray(rawCommands)
  ) {
    return [];
  }

  const commands: ExploreLocationsCommand[] = [];
  const commandCandidates: readonly unknown[] = rawCommands;
  for (const raw of commandCandidates) {`,
            ],
            [
`function readOptionOverride(
  value: unknown,
): readonly AssistantDomOption[] | null {`,
`function readVisiblePresentation(
  document: Document,
): AssistantPresentationSnapshot | null {
  const flow = document.getElementById("assistant-category-results");
  const flowButtons = flow
    ? Array.from(
        flow.querySelectorAll<HTMLButtonElement>(".assistant-option-btn"),
      )
    : [];
  const dynamicContainers = Array.from(
    document.querySelectorAll<HTMLElement>(
      "#assistant-messages .assistant-options",
    ),
  ).filter((container) => !container.querySelector("[data-explore-category]"));
  const dynamicButtons = Array.from(
    dynamicContainers
      .at(-1)
      ?.querySelectorAll<HTMLButtonElement>(".assistant-option-btn") ?? [],
  );
  const buttons = flowButtons.length > 0 ? flowButtons : dynamicButtons;
  const visibleOptions = buttons.flatMap((button) => {
    const label = button.textContent?.trim();
    const value = button.dataset.value?.trim();
    return label && value ? [{ label, value }] : [];
  });
  if (visibleOptions.length === 0) return null;

  const text =
    document
      .getElementById("assistant-category-results-message")
      ?.textContent?.trim() ??
    Array.from(
      document.querySelectorAll<HTMLElement>(
        "#assistant-messages .message.assistant",
      ),
    )
      .at(-1)
      ?.textContent?.trim() ??
    "";
  return snapshotPresentation(text, visibleOptions);
}

function readOptionOverride(
  value: unknown,
): readonly AssistantDomOption[] | null {`,
            ],
            [
`    const previousPresentation = preservePreviousOptions
      ? currentPresentation
      : null;`,
`    const visiblePresentation = readVisiblePresentation(options.document);
    const previousPresentation = preservePreviousOptions
      ? currentPresentation ?? visiblePresentation
      : visiblePresentation ?? currentPresentation;`,
            ],
            [
`      currentPresentation = null;
      syncExploreContext();`,
`      syncExploreContext();
      currentPresentation = readVisiblePresentation(options.document);`,
            ],
          ]);
          NODE
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - name: Validate source closure
        run: |
          pnpm format:check
          pnpm lint
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm -w build
          git diff --check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)" || { echo 'No source changes to commit'; exit 1; }
          git commit -m "fix(assistant): close exact-head CI regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
