name: Temporary M149 Payments Browser Reconcile

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/m149-payments-browser-reconcile-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile M149 contracts and evidence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.ts')
          source = source_path.read_text()

          old = '''export interface PaymentsBrowserVerifiedPayment {
            readonly verified: true;
            readonly sessionId: string;
            readonly reference: string;
            readonly definitiveBusinessId: string | null;
            readonly activationStatus: string | null;
          }

          export interface PaymentsBrowserCheckoutFailure {'''
          new = '''export interface PaymentsBrowserVerifiedPayment {
            readonly verified: true;
            readonly sessionId: string;
            readonly reference: string;
            readonly definitiveBusinessId: string | null;
            readonly activationStatus: string | null;
          }

          export interface PaymentsBrowserVerifiedFailure {
            readonly verified: true;
            readonly sessionId: string;
            readonly reason: string;
            readonly resultId: string;
          }

          export interface PaymentsBrowserCheckoutFailure {'''
          if source.count(old) != 1:
            raise SystemExit('verified-payment interface anchor mismatch')
          source = source.replace(old, new, 1)

          old = '''interface CheckoutStatusProjection {
            readonly checkoutId: string;
            readonly sessionId: string;
            readonly status: string;
            readonly verifiedPayment: PaymentsBrowserVerifiedPayment | null;
          }'''
          new = '''interface CheckoutStatusProjection {
            readonly checkoutId: string;
            readonly sessionId: string;
            readonly status: string;
            readonly verifiedPayment: PaymentsBrowserVerifiedPayment | null;
            readonly verifiedFailure: PaymentsBrowserVerifiedFailure | null;
          }'''
          if source.count(old) != 1:
            raise SystemExit('status projection interface anchor mismatch')
          source = source.replace(old, new, 1)

          old = '''function statusProjection(value: unknown): CheckoutStatusProjection | null {
            const envelope = record(value);
            const data = record(envelope?.data);
            if (!data) return null;
            const checkoutId = text(data.checkoutId, 120);
            const sessionId = text(data.sessionId, 120);
            const status = text(data.status, 40);
            if (!checkoutId || !sessionId || !status) return null;
            return Object.freeze({
              checkoutId,
              sessionId,
              status,
              verifiedPayment: verifiedPayment(data.verifiedPayment),
            });
          }'''
          new = '''function verifiedFailure(
            value: unknown,
          ): PaymentsBrowserVerifiedFailure | null {
            const data = record(value);
            if (!data || data.verified !== true) return null;
            const sessionId = text(data.sessionId, 120);
            const reason = text(data.reason, 80);
            const resultId = text(data.resultId, 160);
            if (!sessionId || !reason || !resultId) return null;
            return Object.freeze({ verified: true, sessionId, reason, resultId });
          }

          function statusProjection(value: unknown): CheckoutStatusProjection | null {
            const envelope = record(value);
            const data = record(envelope?.data);
            if (!data) return null;
            const checkoutId = text(data.checkoutId, 120);
            const sessionId = text(data.sessionId, 120);
            const status = text(data.status, 40);
            if (!checkoutId || !sessionId || !status) return null;
            return Object.freeze({
              checkoutId,
              sessionId,
              status,
              verifiedPayment: verifiedPayment(data.verifiedPayment),
              verifiedFailure: verifiedFailure(data.verifiedFailure),
            });
          }'''
          if source.count(old) != 1:
            raise SystemExit('status projection implementation anchor mismatch')
          source = source.replace(old, new, 1)

          old = '''        if (projection.status === "CONFIRMED") {
                  if (!projection.verifiedPayment) continue;
                  if (projection.verifiedPayment.sessionId !== handoff.sessionId) {
                    throw paymentFailure(
                      handoff.sessionId,
                      "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                      "A confirmação do pagamento não corresponde a esta contratação.",
                    );
                  }
                  await options.signals.verified(projection.verifiedPayment);
                  return projection.verifiedPayment;
                }

                if (
                  projection.status === "FAILED" ||
                  projection.status === "CANCELLED" ||
                  projection.status === "EXPIRED" ||
                  projection.status === "REFUNDED"
                ) {
                  throw paymentFailure(
                    handoff.sessionId,
                    "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
                    "O pagamento não foi concluído.",
                  );
                }'''
          new = '''        if (projection.status === "CONFIRMED") {
                  if (projection.verifiedFailure) {
                    throw paymentFailure(
                      handoff.sessionId,
                      "PAYMENTS_BROWSER_INVALID_RESPONSE",
                      "A confirmação do pagamento retornou evidências conflitantes.",
                    );
                  }
                  if (!projection.verifiedPayment) continue;
                  if (projection.verifiedPayment.sessionId !== handoff.sessionId) {
                    throw paymentFailure(
                      handoff.sessionId,
                      "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                      "A confirmação do pagamento não corresponde a esta contratação.",
                    );
                  }
                  await options.signals.verified(projection.verifiedPayment);
                  return projection.verifiedPayment;
                }

                if (
                  projection.status === "FAILED" ||
                  projection.status === "CANCELLED" ||
                  projection.status === "EXPIRED" ||
                  projection.status === "REFUNDED"
                ) {
                  if (projection.verifiedPayment) {
                    throw paymentFailure(
                      handoff.sessionId,
                      "PAYMENTS_BROWSER_INVALID_RESPONSE",
                      "A confirmação do pagamento retornou evidências conflitantes.",
                    );
                  }
                  if (!projection.verifiedFailure) continue;
                  if (projection.verifiedFailure.sessionId !== handoff.sessionId) {
                    throw paymentFailure(
                      handoff.sessionId,
                      "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                      "A falha do pagamento não corresponde a esta contratação.",
                    );
                  }
                  throw paymentFailure(
                    handoff.sessionId,
                    "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
                    "O pagamento não foi concluído.",
                  );
                }

                if (projection.verifiedPayment || projection.verifiedFailure) {
                  throw paymentFailure(
                    handoff.sessionId,
                    "PAYMENTS_BROWSER_INVALID_RESPONSE",
                    "O estado do pagamento não corresponde à evidência verificada.",
                  );
                }'''
          if source.count(old) != 1:
            raise SystemExit('poll terminal contract anchor mismatch')
          source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts')
          test = test_path.read_text().replace('M148', 'M149').replace('m148', 'm149')
          old = '''  it("uses location fallback only when the popup is blocked", async () => {
              const result = harness([checkoutResponse(), statusResponse("FAILED")], {
                popupResult: null,
              });
              const session = await result.client.start(handoff);
              await expect(session.confirmation).rejects.toMatchObject({
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              });
              expect(result.assignments).toEqual([
                "https://sandbox-payments.example.test/checkout/001",
              ]);
              expect(result.failed).toEqual([
                expect.objectContaining({
                  sessionId: handoff.sessionId,
                  code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
                }),
              ]);
            });'''
          new = '''  it("uses location fallback only when the popup is blocked", async () => {
              const result = harness(
                [
                  checkoutResponse(),
                  statusResponse("FAILED"),
                  statusResponse("FAILED", null, {
                    verifiedFailure: {
                      verified: true,
                      sessionId: handoff.sessionId,
                      reason: "failed",
                      resultId: "fev_m149_popup_failure",
                    },
                  }),
                ],
                { popupResult: null },
              );
              const session = await result.client.start(handoff);
              await expect(session.confirmation).rejects.toMatchObject({
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              });
              expect(result.assignments).toEqual([
                "https://sandbox-payments.example.test/checkout/001",
              ]);
              expect(result.waits).toEqual([2_500, 2_500]);
              expect(result.failed).toEqual([
                expect.objectContaining({
                  sessionId: handoff.sessionId,
                  code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
                }),
              ]);
            });'''
          if test.count(old) != 1:
            raise SystemExit('popup failure test anchor mismatch')
          test = test.replace(old, new, 1)

          anchor = '''  it("fails closed when the status response belongs to another checkout or Business session", async () => {'''
          addition = '''  it("waits for persisted verified failure evidence before emitting a failure signal", async () => {
              const result = harness([
                checkoutResponse(),
                statusResponse("FAILED"),
                statusResponse("FAILED", null, {
                  verifiedFailure: {
                    verified: true,
                    sessionId: handoff.sessionId,
                    reason: "failed",
                    resultId: "fev_m149_verified_failure",
                  },
                }),
              ]);
              const session = await result.client.start(handoff);
              await expect(session.confirmation).rejects.toMatchObject({
                code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
              });
              expect(result.waits).toEqual([2_500, 2_500]);
              expect(result.verified).toEqual([]);
              expect(result.failed).toEqual([
                expect.objectContaining({
                  sessionId: handoff.sessionId,
                  code: "PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED",
                }),
              ]);
            });

            it("fails closed when verified failure evidence substitutes another Business session", async () => {
              const result = harness([
                checkoutResponse(),
                statusResponse("FAILED", null, {
                  verifiedFailure: {
                    verified: true,
                    sessionId: "substituted_session",
                    reason: "failed",
                    resultId: "fev_m149_substituted_failure",
                  },
                }),
              ]);
              const session = await result.client.start(handoff);
              await expect(session.confirmation).rejects.toMatchObject({
                code: "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
              });
              expect(result.verified).toEqual([]);
              expect(result.failed).toEqual([
                expect.objectContaining({
                  code: "PAYMENTS_BROWSER_STATUS_IDENTITY_MISMATCH",
                }),
              ]);
            });

          ''' + anchor
          if test.count(anchor) != 1:
            raise SystemExit('failure evidence test insertion anchor mismatch')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test)

          workflow_path = Path('.github/workflows/payments-browser-checkout-contract.yml')
          workflow = workflow_path.read_text().replace('M148', 'M149').replace('m148', 'm149')
          old = '''                const confirmation = await session.confirmation;
                          const createHeaders = requests[0]?.headers || {};
                          const statusHeaders = requests.slice(1).map(request => request.headers);
                          const successEvents = events.filter(event => event.name === 'businessPaymentVerified');
                          const failureEvents = events.filter(event => event.name === 'businessPaymentVerificationFailed');

                          const blockedAssignments = [];'''
          new = '''                const confirmation = await session.confirmation;
                          const createHeaders = requests[0]?.headers || {};
                          const statusHeaders = requests.slice(1).map(request => request.headers);

                          const failureHandoff = { ...handoff, sessionId: 'business_session_m149_browser_failure' };
                          const failureStatusToken = `cst_v1_${'f'.repeat(43)}`;
                          const failureWaits = [];
                          const failureResponses = [
                            {
                              data: {
                                checkoutId: 'ord_m149browserfailure001',
                                paymentId: 'pay_m149browserfailure001',
                                status: 'PENDING',
                                statusToken: failureStatusToken,
                                statusExpiresAt: '2026-08-16T04:30:00.000Z',
                                checkoutUrl: null,
                                replayed: false
                              }
                            },
                            {
                              data: {
                                checkoutId: 'ord_m149browserfailure001',
                                sessionId: failureHandoff.sessionId,
                                status: 'FAILED',
                                verifiedPayment: null,
                                verifiedFailure: null
                              }
                            },
                            {
                              data: {
                                checkoutId: 'ord_m149browserfailure001',
                                sessionId: failureHandoff.sessionId,
                                status: 'FAILED',
                                verifiedPayment: null,
                                verifiedFailure: {
                                  verified: true,
                                  sessionId: failureHandoff.sessionId,
                                  reason: 'failed',
                                  resultId: 'fev_m149_browser_failure'
                                }
                              }
                            }
                          ];
                          let failureResponseIndex = 0;
                          const failureClient = module.createPaymentsBrowserCheckoutClient({
                            fetchFn: async () => {
                              const payload = failureResponses[failureResponseIndex++];
                              if (!payload) throw new Error('Unexpected failure browser fetch');
                              return new Response(JSON.stringify(payload), {
                                status: 200,
                                headers: { 'content-type': 'application/json' }
                              });
                            },
                            authority: {
                              resolveCreateHeaders: async () => ({
                                'X-Checkout-Handoff-Token': 'signed-browser-capability-m149-failure'
                              })
                            },
                            popup: { open: () => ({}), assign: () => {} },
                            signals,
                            scheduler: {
                              wait: async milliseconds => { failureWaits.push(milliseconds); }
                            },
                            correlationId: () => 'browser:m149-contract-failure-0001'
                          });
                          const failureSession = await failureClient.start(failureHandoff);
                          let failureCode = null;
                          try {
                            await failureSession.confirmation;
                          } catch (error) {
                            failureCode = error && typeof error === 'object' && 'code' in error ? error.code : String(error);
                          }

                          const successEvents = events.filter(event => event.name === 'businessPaymentVerified');
                          const failureEvents = events.filter(event => event.name === 'businessPaymentVerificationFailed');

                          const blockedAssignments = [];'''
          if workflow.count(old) != 1:
            raise SystemExit('browser workflow failure scenario anchor mismatch')
          workflow = workflow.replace(old, new, 1)

          old = '''                  failureEvents,
                            createHeaders,
                            statusHeaders,'''
          new = '''                  failureEvents,
                            failureWaits,
                            failureCode,
                            createHeaders,
                            statusHeaders,'''
          if workflow.count(old) != 1:
            raise SystemExit('browser workflow result anchor mismatch')
          workflow = workflow.replace(old, new, 1)

          old = '''              if (result.successEvents.length !== 1 || result.failureEvents.length !== 0) throw new Error(`Business signal mismatch: ${JSON.stringify(result)}`);
                        if (result.waits.length !== 2 || result.waits.some(value => value !== 2500)) throw new Error(`Polling cadence mismatch: ${JSON.stringify(result.waits)}`);'''
          new = '''              if (result.successEvents.length !== 1 || result.failureEvents.length !== 1) throw new Error(`Business signal mismatch: ${JSON.stringify(result)}`);
                        if (result.failureCode !== 'PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED') throw new Error(`Verified failure code mismatch: ${JSON.stringify(result)}`);
                        if (result.failureEvents[0]?.detail?.sessionId !== 'business_session_m149_browser_failure' || result.failureEvents[0]?.detail?.code !== 'PAYMENTS_BROWSER_PAYMENT_NOT_COMPLETED') throw new Error(`Verified failure signal mismatch: ${JSON.stringify(result.failureEvents)}`);
                        if (result.failureWaits.length !== 2 || result.failureWaits.some(value => value !== 2500)) throw new Error(`Verified failure polling mismatch: ${JSON.stringify(result.failureWaits)}`);
                        if (result.waits.length !== 2 || result.waits.some(value => value !== 2500)) throw new Error(`Polling cadence mismatch: ${JSON.stringify(result.waits)}`);'''
          if workflow.count(old) != 1:
            raise SystemExit('browser workflow assertion anchor mismatch')
          workflow = workflow.replace(old, new, 1)
          workflow_path.write_text(workflow)

          matrix_path = Path('docs/migration/PAYMENTS-MIGRATION-MATRIX.md')
          matrix = matrix_path.read_text()
          matrix = matrix.replace(
            '# Payments / Ordering / Financial — Migration Matrix (M146 split/repasse/settlement)',
            '# Payments / Ordering / Financial — Migration Matrix (M149 browser checkout/confirmation)',
            1,
          )
          if '## M149 implementation boundary' not in matrix:
            marker = '\n## Matrix\n'
            section = '''\n## M149 implementation boundary\n\nM149 adds the Payments-owned browser adapter over the already protected M139/M140 checkout boundary without moving financial execution into Business. It consumes the immutable Business handoff, derives the exact Ordering idempotency key, requires exactly one pre-existing trusted creation authority, launches only the provider URL returned by the protected server route and keeps the status capability inside the client closure.\n\nConfirmation remains server-authoritative. `CONFIRMED` is accepted only after the status projection contains the persisted `verifiedPayment` result; terminal failure statuses are emitted only after the matching persisted `verifiedFailure` result exists. A terminal Payment row without its verified result is treated as an incomplete recovery window and continues bounded polling rather than fabricating success or failure. Contradictory result/status pairs and substituted Business sessions fail closed. The adapter preserves the frozen 2.5-second cadence and 240-attempt ceiling, popup `noopener,noreferrer` semantics and location fallback. No handoff HMAC secret is present in browser code and M149 does not add anonymous authority composition.\n\nThe permanent Chromium contract proves launch, status-capability non-persistence, exact idempotency, authoritative success, authoritative failure and popup fallback. This is still a deterministic repository contract, not a deployed third-party sandbox/browser E2E or production money rollout.\n'''
            if marker not in matrix:
              raise SystemExit('matrix section anchor mismatch')
            matrix = matrix.replace(marker, section + marker, 1)

          lines = matrix.splitlines()
          def rewrite_row(label, v2, status, decision):
            for index, line in enumerate(lines):
              if line.startswith('| ' + label):
                cells = [cell.strip() for cell in line.strip().strip('|').split('|')]
                if len(cells) != 5:
                  raise SystemExit(f'unexpected matrix row shape for {label}: {cells}')
                cells[2] = v2
                cells[3] = status
                cells[4] = decision
                lines[index] = '| ' + ' | '.join(cells) + ' |'
                return
            raise SystemExit(f'matrix row not found: {label}')

          rewrite_row(
            'Browser checkout launch',
            'M149 Payments browser adapter launches only the protected server-returned checkout URL with `noopener,noreferrer`, location fallback, same-origin credentials and a private status capability',
            'PASS',
            'Business provides only its immutable commercial handoff; Payments owns launch and never mints server authority in the browser.',
          )
          rewrite_row(
            'Browser confirmation wait',
            'M149 preserves the frozen 2.5 s cadence / 240-attempt bound and polls only the protected Payments status projection',
            'PASS',
            'A browser return is never confirmation; bounded polling waits for persisted verified Financial evidence.',
          )
          rewrite_row(
            'Browser verified-payment event',
            'M149 emits `businessPaymentVerified` only from identity-matched persisted `verifiedPayment`; a confirmed Payment without that result keeps polling',
            'PASS',
            'Business remains a consumer and cannot manufacture or independently verify Financial approval.',
          )
          rewrite_row(
            'Browser failure event',
            'M149 emits `businessPaymentVerificationFailed` only after identity-matched persisted `verifiedFailure`; terminal Payment state without the result keeps polling',
            'PASS',
            'Failure signaling is now symmetric with approval and cannot be synthesized from browser/provider state alone.',
          )
          matrix = '\n'.join(lines) + '\n'

          matrix_lines = matrix.splitlines()
          start = matrix_lines.index('## Matrix')
          end = next(i for i in range(start + 1, len(matrix_lines)) if matrix_lines[i].startswith('## ') and i > start + 1)
          counts = {'PASS': 0, 'PARTIAL': 0, 'GAP': 0, 'N/A': 0}
          for line in matrix_lines[start:end]:
            if not line.startswith('|'):
              continue
            cells = [cell.strip() for cell in line.strip().strip('|').split('|')]
            if len(cells) == 5 and cells[3] in counts:
              counts[cells[3]] += 1
          total = sum(counts.values())
          if total < 30:
            raise SystemExit(f'unexpected matrix contract count: {counts}')

          score_pattern = re.compile(r'## M146 score\n\n(?:- `[^\n]+\n){5}\nM146 closes[^\n]+\n', re.M)
          score = f'''## M149 score\n\n- `PASS`: {counts['PASS']}\n- `PARTIAL`: {counts['PARTIAL']}\n- `GAP`: {counts['GAP']}\n- `N/A`: {counts['N/A']}\n- total: {total}\n\nM149 closes the repository-level browser checkout/confirmation and Business-compatible success/failure signaling contracts without broadening authority to Business or to production money movement. Both success and failure require persisted verified Financial evidence; the status capability remains private and no browser-side handoff secret is introduced.\n'''
          matrix, replaced = score_pattern.subn(score, matrix, count=1)
          if replaced != 1:
            raise SystemExit('matrix score anchor mismatch')
          matrix = matrix.replace('After M146 and green Quality, Persistence, Sandbox Provider, Verified Webhook, Verified Outcome, Operational Ledger, Refund Command, Reconciliation, Settlement and Ticketing regression gates on the final head:', 'After M149 and green Quality plus the permanent Payments Browser Checkout Contract on the final head:', 1)
          matrix = matrix.replace('The remaining Wave 8 gaps are subscription lifecycle and the browser checkout/confirmation journey. Partial contracts still include Business browser event composition, financial observability, deployed sandbox/browser E2E, distributed rate limiting and rollback/release completion.', 'The remaining Wave 8 gap is the subscription lifecycle plus any other matrix GAPs not owned by the browser adapter. Partial contracts remain financial observability, deployed third-party sandbox/browser E2E, distributed rate limiting and rollback/release completion. Browser success/failure composition is repository-contract complete but does not activate anonymous checkout or production money movement.', 1)
          matrix_path.write_text(matrix)

          tracker_path = Path('docs/migration/MASTER-MIGRATION-TRACKER.md')
          tracker = tracker_path.read_text()
          tracker_lines = tracker.splitlines()
          for index, line in enumerate(tracker_lines):
            if line.startswith('| MIG-0010 |'):
              cells = [cell.strip() for cell in line.strip().strip('|').split('|')]
              if len(cells) != 11:
                raise SystemExit(f'unexpected MIG-0010 tracker shape: {len(cells)}')
              cells[7] = 'M149 adiciona checkout/confirmation browser Payments-owned com contrato Chromium; nenhuma UI Business é movida para Financial'
              cells[8] = f"{total} contratos: {counts['PASS']} PASS / {counts['PARTIAL']} PARTIAL / {counts['GAP']} GAP / {counts['N/A']} N/A; sucesso e falha browser exigem resultado Financial persistido e identity-matched"
              cells[9] = '`PAYMENTS-V1-BASELINE.md`; `PAYMENTS-MIGRATION-MATRIX.md`; evidências M135–M146 + M149'
              tracker_lines[index] = '| ' + ' | '.join(cells) + ' |'
              break
          else:
            raise SystemExit('MIG-0010 tracker row not found')
          tracker = '\n'.join(tracker_lines) + '\n'
          tracker = tracker.replace(
            '`MIG-0010` e `FEATURE-0009` permanecem `migrating`; equivalence behavior/visual/API continua `false`. Ainda faltam recorrência/assinaturas, browser checkout/confirmation, integração dos eventos Business parciais, observabilidade financeira completa, sandbox/browser E2E implantado, limiter distribuído e fechamento operacional de release/rollback. Affiliates permanece separado e não recebe autoridade financeira implícita.',
            f'''`MIG-0010` e `FEATURE-0009` permanecem `migrating`; equivalence behavior/visual/API continua `false`.\n\n### M149 — Payments browser checkout/confirmation\n\nM149 fecha o adaptador browser pertencente a Payments sem alterar o domínio Business. O cliente deriva a chave de idempotência pelo contrato Ordering, exige uma única autoridade de criação já emitida pelo servidor/Auth, mantém `statusToken` somente no closure, abre o checkout com `noopener,noreferrer` e fallback de navegação, e preserva polling de 2,5 s limitado a 240 tentativas.\n\nA promoção de sucesso exige `verifiedPayment` persistido; falha exige `verifiedFailure` persistido. Estado terminal sem o resultado verificado correspondente continua em recuperação/polling e não produz evento sintético. O contrato Chromium permanente cobre os dois caminhos e a não persistência da capability. A matriz passa a `{counts['PASS']} PASS / {counts['PARTIAL']} PARTIAL / {counts['GAP']} GAP / {counts['N/A']} N/A`.\n\nAinda faltam recorrência/assinaturas, observabilidade financeira completa, sandbox/browser E2E implantado com terceiro real, limiter distribuído e fechamento operacional de release/rollback. Produção/dinheiro real e autoridade anônima continuam desativados. Affiliates permanece separado e não recebe autoridade financeira implícita.''',
            1,
          )
          tracker_path.write_text(tracker)

          evidence_path = Path('docs/qa/PAYMENTS-M149-EVIDENCE.md')
