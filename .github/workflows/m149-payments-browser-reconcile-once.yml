onFailed`;\n9. contradictory success/failure evidence, substituted checkout/session identity and malformed responses fail closed;\n10. the adapter does not claim deployed third-party sandbox E2E, subscription recurrence, distributed limiting or production money movement.\n\n## Matrix delta\n\n- Browser checkout launch: `GAP → PASS`.\n- Browser confirmation wait: `GAP → PASS`.\n- Browser verified-payment event: `PARTIAL → PASS`.\n- Browser failure event: `PARTIAL → PASS`.\n- Canonical M149 matrix: `{counts['PASS']} PASS / {counts['PARTIAL']} PARTIAL / {counts['GAP']} GAP / {counts['N/A']} N/A` (`{total}` contracts).\n- `FEATURE-0009` / `MIG-0010` remain `migrating`; equivalence flags remain false.\n\n## Permanent validation\n\nPromotion requires the exact final PR head to pass:\n\n- `Quality Gate` — install, formatting, architecture boundaries, Feature Registry, lint, typecheck, full workspace tests and build;\n- `Payments Browser Checkout Contract` — focused unit tests plus deterministic Chromium success/failure/launch/capability evidence.\n\nThe PR itself records the final same-head run IDs. No temporary repair workflow may remain in the promoted diff.\n''')
