name: Temporary V1 3D Control Patch

on:
  push:
    branches:
      - fix/v1-home-parity-3d-control-20260913
    paths:
      - .github/workflows/tmp-v1-3d-control.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-home-parity-3d-control-20260913
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/tmp-patch-v1-3d-control.mjs
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/layouts/app-shell.ts apps/morro-digital-platform/src/browser-entry.ts apps/morro-digital-platform/src/map/three-dimensional-map-control.ts apps/morro-digital-platform/src/map/three-dimensional-map-control.test.ts
      - run: git diff --check
      - run: pnpm --filter @touristic/morro-digital-platform test -- three-dimensional-map-control.test.ts
      - run: pnpm --filter @touristic/morro-digital-platform build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/layouts/app-shell.ts \
                  apps/morro-digital-platform/src/browser-entry.ts \
                  apps/morro-digital-platform/src/map/three-dimensional-map-control.ts \
                  apps/morro-digital-platform/src/map/three-dimensional-map-control.test.ts
          if git diff --cached --quiet; then
            echo 'No implementation changes.'
            exit 0
          fi
          git commit -m 'fix(home): restore V1 3D perspective control'
          git push origin HEAD:fix/v1-home-parity-3d-control-20260913
