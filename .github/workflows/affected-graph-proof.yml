name: Affected Graph Proof

on:
  push:
    branches:
      - ci/affected-graph-proof

permissions:
  contents: read

concurrency:
  group: affected-graph-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-fallbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local-only fallback probes
        run: |
          git config user.name 'ci-affected-proof'
          git config user.email 'ci-affected-proof@example.invalid'
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          pnpm turbo ls --output=json > /tmp/all-packages.json
      - name: Record root package change behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.__ciAffectedProbe = true;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          git add package.json
          git commit -m 'probe: root package metadata'
          HEAD_SHA=$(git rev-parse HEAD)
          TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA" pnpm turbo ls --affected --output=json > /tmp/root-package-affected.json
      - name: Record turbo config change behavior
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fd
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'turbo.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.__ciAffectedProbe = true;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          git add turbo.json
          git commit -m 'probe: root turbo config'
          HEAD_SHA=$(git rev-parse HEAD)
          TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA" pnpm turbo ls --affected --output=json > /tmp/turbo-config-affected.json
      - name: Record non-workspace change behavior
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fd
          mkdir -p .github
          printf 'probe\n' > .github/__ci_affected_probe__.txt
          git add .github/__ci_affected_probe__.txt
          git commit -m 'probe: non-workspace change'
          HEAD_SHA=$(git rev-parse HEAD)
          TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA" pnpm turbo ls --affected --output=json > /tmp/nonworkspace-affected.json
      - name: Build fallback evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const unpack = path => {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const packages = Array.isArray(data)
              ? data
              : Array.isArray(data.packages)
                ? data.packages
                : data.packages?.items;
            if (!Array.isArray(packages)) throw new Error(`Unexpected turbo ls JSON shape for ${path}`);
            return packages.map(item => typeof item === 'string' ? item : item.name).filter(Boolean).sort();
          };
          const evidence = {
            baseSha: process.env.BASE_SHA,
            allPackageCount: unpack('/tmp/all-packages.json').length,
            rootPackageChangeAffectedPackages: unpack('/tmp/root-package-affected.json'),
            turboConfigChangeAffectedPackages: unpack('/tmp/turbo-config-affected.json'),
            nonWorkspaceChangeAffectedPackages: unpack('/tmp/nonworkspace-affected.json'),
            policy: 'full-lint-typecheck-fallback-required-for-any-root-or-non-workspace-change'
          };
          fs.writeFileSync('/tmp/affected-fallback-proof.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affected-fallback-proof
          path: |
            /tmp/affected-fallback-proof.json
            /tmp/root-package-affected.json
            /tmp/turbo-config-affected.json
            /tmp/nonworkspace-affected.json
          retention-days: 3
          if-no-files-found: ignore
