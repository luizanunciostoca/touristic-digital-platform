name: Place Search Explore V2 Visual Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - apps/morro-digital-platform/src/map/explore-marker-grouping.ts
      - apps/morro-digital-platform/src/map/explore-marker-grouping.test.ts
      - ".github/actions/ci-bootstrap/action.yml"
      - .github/workflows/place-explore-v2-visual-regression.yml
      - tests/visual-regression/ux-v2-manual-reference-matrix.json
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/**
      - apps/morro-digital-platform/src/ux/place-search-explore-v2-contract.test.ts
      - apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts
      - tests/visual-regression/ux-v2-manual-conformance.json
      - apps/morro-digital-platform/public/design-system-v2.css
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/public/explore-locations.css
      - apps/morro-digital-platform/public/tourist-shell-v2.css
      - packages/assistant/src/**
      - packages/search/src/**
      - packages/geospatial/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  place-search-explore-v2:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
        with:
          browser: "true"
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/place-explore-v2
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          # This matrix proves legacy catalog membership with the real Mapbox SDK.
          # The supported backend startup contract makes canonical Place unavailable without its DB.
          BUSINESS_DATABASE_URL= MORRO_DB_HOST= \
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/place-explore-v2/server.log 2>&1 &
          echo $! >/tmp/place-explore-v2/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/place-explore-v2/server.log
          exit 1
      - name: Validate canonical Place + Search/Explore V2 matrix
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const origin = 'http://127.0.0.1:4173';
          const viewports = [
            { id: 'w320', width: 320, height: 568 },
            { id: 'w360', width: 360, height: 800 },
            { id: 'w390', width: 390, height: 844 },
            { id: 'w412', width: 412, height: 915 },
            { id: 'w430', width: 430, height: 932 },
            { id: 'w768', width: 768, height: 1024 },
            { id: 'w1024-landscape', width: 1024, height: 600 },
            { id: 'w1280', width: 1280, height: 800 },
            { id: 'w1440', width: 1440, height: 900 },
          ];
          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 20,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };
          const evidence = [];

          function assertInside(rect, viewport, label) {
            if (
              !rect ||
              rect.left < -1 ||
              rect.top < -1 ||
              rect.right > viewport.width + 1 ||
              rect.bottom > viewport.height + 1
            ) {
              throw new Error(`${label} escaped ${viewport.id}: ${JSON.stringify(rect)}`);
            }
          }

          function closeEnough(a, b, tolerance) {
            return (
              typeof a === 'number' &&
              typeof b === 'number' &&
              Math.abs(a - b) <= tolerance
            );
          }

          async function installRoutes(page) {
            await page.route('**/api/weather', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(weather),
              }),
            );
            await page.route('**/api/ticketing/v1/inventory', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ data: [] }),
              }),
            );
            await page.route('**/search/searchbox/v1/forward**', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ features: [] }),
              }),
            );
          }

          async function openAssistant(page) {
            const input = page.locator('#assistantInput');
            await input.waitFor({ state: 'visible', timeout: 8000 });
            if (!(await page.locator('#assistant-messages').isVisible())) {
              await input.focus();
            }
            await page.locator('#assistant-messages:not(.hidden)').waitFor({
              state: 'visible',
              timeout: 5000,
            });
          }

          async function submit(page, text) {
            await openAssistant(page);
            const input = page.locator('#assistantInput');
            await input.fill(text);
            await page.locator('#sendButton').evaluate(button => button.click());
            const deadline = Date.now() + 8000;
            while (Date.now() < deadline) {
              if ((await input.inputValue()) === '') return;
              await page.waitForTimeout(50);
            }
            throw new Error(`composer did not submit: ${text}`);
          }

          async function camera(page) {
            return page.evaluate(() => {
              const map = globalThis.mapboxPrimaryInstance;
              const center = map?.getCenter?.();
              return {
                lng: center?.lng ?? null,
                lat: center?.lat ?? null,
                zoom: map?.getZoom?.() ?? null,
              };
            });
          }

          async function settledCamera(page) {
            const deadline = Date.now() + 8000;
            let previous;
            let stableSince = 0;
            while (Date.now() < deadline) {
              const idle = await page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                return document.querySelector('#map')?.dataset.exploreState === 'ready' &&
                  typeof map?.isMoving === 'function' && !map.isMoving();
              });
              const current = await camera(page);
              const stable = idle && previous &&
                closeEnough(previous.lng, current.lng, 0.0000001) &&
                closeEnough(previous.lat, current.lat, 0.0000001) &&
                closeEnough(previous.zoom, current.zoom, 0.0000001);
              if (!stable) stableSince = Date.now();
              if (stable && Date.now() - stableSince >= 300) return current;
              previous = current;
              await page.waitForTimeout(50);
            }
            throw new Error(`Explore camera did not settle: ${JSON.stringify(previous)}`);
          }

          const beachNames = [
            'Primeira Praia', 'Praia de Garapuá', 'Praia do Pôrto',
            'Praia da Gamboa', 'Segunda Praia', 'Terceira Praia',
            'Quarta Praia', 'Praia do Encanto',
          ];

          async function assertBeachMembership(page, expectedNames, requireList) {
            if (await page.evaluate(() => globalThis.__MORRO_RUNTIME_ENV__?.VITE_PLACE_PLATFORM_AVAILABLE) !== 'false') {
              throw new Error('Legacy beach census requires canonical Place explicitly unavailable; canonical IDs need a separate producer-backed scenario');
            }
            const readCensus = () => page.evaluate(() => {
              const map = document.querySelector('#map');
              return {
                members: Number(map.getAttribute('data-map-member-count')),
                markerCount: Number(map.getAttribute('data-map-marker-count')),
                grouping: map.dataset.markerGrouping,
                state: map.dataset.exploreState,
                // This public geometry epoch is separate from the dataset epoch encoded in IDs.
                geometryGeneration: map.dataset.exploreDatasetGeneration,
                markers: Array.from(map.querySelectorAll(
                  '.morro-explore-marker[data-morro-explore-marker="true"]:not([data-discover-initial-poi="true"])',
                ), node => ({
                  id: node.dataset.markerId,
                  name: node.dataset.locationName,
                  cluster: node.dataset.markerCluster === 'true',
                  count: Number(node.dataset.clusterCount ?? 1),
                })).sort((left, right) => left.id.localeCompare(right.id)),
                names: Array.from(document.querySelectorAll(
                  '#assistant-category-rail[data-rail-stage="places"] [data-location-name]',
                ), node => node.dataset.locationName).sort(),
              };
            });
            const validate = (census, checkList) => {
              const indices = [], generations = new Set(), markerIds = new Set();
              for (const marker of census.markers) {
                const match = marker.id?.match(/^explore:beaches:(?:cluster:([2-9]\d*|1\d+):|member:)(.+)$/);
                if (!match || markerIds.has(marker.id)) {
                  throw new Error(`Invalid or duplicate beach marker: ${JSON.stringify(marker)}`);
                }
                markerIds.add(marker.id);
                const keys = match[2].split('|');
                if (marker.cluster !== Boolean(match[1]) || marker.count !== keys.length ||
                    new Set(keys).size !== keys.length ||
                    (match[1] && Number(match[1]) !== keys.length) ||
                    (!marker.cluster && keys.length !== 1)) {
                  throw new Error(`Incoherent beach group: ${JSON.stringify(marker)}`);
                }
                for (const key of keys) {
                  const member = key.match(/^dataset:([1-9]\d*):(0|[1-9]\d*)$/);
                  if (!member) throw new Error(`Unexpected beach member key: ${key}`);
                  generations.add(member[1]);
                  const index = Number(member[2]);
                  indices.push(index);
                  if (!Number.isSafeInteger(index) || index >= expectedNames.length ||
                      (!marker.cluster && marker.name !== expectedNames[index])) {
                    throw new Error(`Wrong beach identity: ${JSON.stringify(marker)}`);
                  }
                }
              }
              const expectedIndices = expectedNames.map((_, index) => index);
              if (census.state !== 'ready' || census.grouping !== 'projected' || generations.size !== 1 ||
                  !/^[1-9]\d*$/.test(census.geometryGeneration ?? '') ||
                  census.members !== expectedNames.length || census.markerCount !== census.markers.length ||
                  new Set(indices).size !== indices.length ||
                  JSON.stringify(indices.sort((left, right) => left - right)) !== JSON.stringify(expectedIndices) ||
                  (checkList && JSON.stringify(census.names) !== JSON.stringify([...expectedNames].sort()))) {
                throw new Error(`Beach membership drift: ${JSON.stringify({ expectedNames, census, indices })}`);
              }
              return { ...census, datasetGeneration: [...generations][0] };
            };
            const stableCensus = async (checkList = requireList) => {
              await settledCamera(page);
              const deadline = Date.now() + 8000;
              let previous, stableSince = Date.now();
              while (Date.now() < deadline) {
                const current = await readCensus();
                const serialized = JSON.stringify(current);
                if (serialized !== previous) stableSince = Date.now();
                else if (Date.now() - stableSince >= 300) return validate(current, checkList);
                previous = serialized;
                await page.waitForTimeout(50);
              }
              throw new Error(`Beach census did not stabilize: ${previous}`);
            };
            let census = await stableCensus();
            const visited = new Set(), transitions = [];
            // Re-read after each restore: Back may legitimately reinstall the dataset and regroup.
            for (let operation = 0; operation <= expectedNames.length; operation++) {
              const marker = census.markers.find(marker => marker.cluster &&
                !visited.has(marker.id.replace(/dataset:[1-9]\d*:/g, 'dataset:')));
              if (!marker) return { ...census, generationTransitions: transitions };
              if (operation === expectedNames.length) throw new Error('Beach cluster census did not converge');
              const signature = marker.id.replace(/dataset:[1-9]\d*:/g, 'dataset:');
              const groupNames = marker.id.split(':').slice(4).join(':').split('|')
                .map(key => expectedNames[Number(key.split(':').at(-1))]).sort();
              // A real locator click proves the hit target; no synthetic DOM click bypasses actionability.
              await page.locator(`#map .morro-explore-marker[data-marker-id=${JSON.stringify(marker.id)}]`).click();
              const back = page.locator('#assistant-category-rail [data-value="back-cluster"]');
              await back.waitFor({ state: 'visible', timeout: 5000 });
              const names = await page.locator('#assistant-category-rail [data-location-name]')
                .evaluateAll(nodes => nodes.map(node => node.dataset.locationName).sort());
              const expanded = await stableCensus(false);
              if (JSON.stringify(names) !== JSON.stringify(groupNames) ||
                  JSON.stringify(expanded.markers) !== JSON.stringify(census.markers) ||
                  expanded.datasetGeneration !== census.datasetGeneration ||
                  expanded.geometryGeneration !== census.geometryGeneration) {
                throw new Error(`Beach group changed while expanded: ${JSON.stringify({ marker, names, groupNames, census, expanded })}`);
              }
              await back.click();
              await back.waitFor({ state: 'detached', timeout: 5000 });
              const restored = await stableCensus();
              // Epochs are independently monotonic; neither is inferred from the other.
              if (BigInt(restored.datasetGeneration) < BigInt(census.datasetGeneration) ||
                  BigInt(restored.geometryGeneration) < BigInt(census.geometryGeneration)) {
                throw new Error(`Beach epoch regressed after restore: ${JSON.stringify({ census, restored })}`);
              }
              transitions.push({ beforeDataset: census.datasetGeneration, afterDataset: restored.datasetGeneration,
                beforeGeometry: census.geometryGeneration, afterGeometry: restored.geometryGeneration });
              visited.add(signature);
              census = restored;
            }
            throw new Error('Beach cluster census exhausted');
          }

          async function sheetGeometry(page, selector) {
            return page.locator(selector).evaluate(node => {
              const rect = node.getBoundingClientRect();
              return {
                rect: {
                  left: rect.left,
                  top: rect.top,
                  right: rect.right,
                  bottom: rect.bottom,
                  width: rect.width,
                  height: rect.height,
                },
                rootWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                direction: getComputedStyle(node).direction,
              };
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                  permissions: ['geolocation'],
                  hasTouch: viewport.width <= 430,
                });
                await context.addInitScript(() => {
                  localStorage.setItem('morro-digital-onboarded', '1');
                  localStorage.setItem('morro-digital-language', 'pt-BR');
                  localStorage.setItem('voice-enabled', 'false');
                });

                const page = await context.newPage();
                const pageErrors = [];
                const providerErrors = [];
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('response', response => {
                  if (
                    response.url().includes('mapbox.com') &&
                    !response.url().includes('/search/searchbox/v1/forward') &&
                    response.status() >= 400
                  ) {
                    providerErrors.push({
                      status: response.status(),
                      url: response.url().split('?')[0],
                    });
                  }
                });
                await installRoutes(page);

                await page.goto(origin + '/', {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000,
                });
                await page.locator(
                  '#map[data-map-state="ready"][data-home-state="ready"][data-map-mode="real"]',
                ).waitFor({ state: 'attached', timeout: 30000 });
                await page.locator('body[data-public-onboarding-settled="true"]').waitFor({
                  state: 'attached',
                  timeout: 5000,
                });

                await submit(page, 'Primeira');
                const explore = page.locator(
                  '#assistant-category-rail[data-rail-stage="places"]',
                );
                await explore.waitFor({ state: 'visible', timeout: 10000 });
                await page.locator(
                  '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]',
                ).waitFor({ state: 'visible', timeout: 10000 });
                await page.locator(
                  '#map[data-explore-category="search"][data-explore-stage="places"][data-map-marker-count="1"]',
                ).waitFor({ state: 'attached', timeout: 10000 });

                const assistantVisible = await page.locator('#assistant-messages').evaluate(
                  node =>
                    !node.classList.contains('hidden') &&
                    node.getAttribute('aria-hidden') !== 'true',
                );
                if (!assistantVisible) {
                  throw new Error(`Unified Assistant Dock lost its message region on ${viewport.id}`);
                }
                const legacyExploreSheetVisible = await page.locator('#explore-flow-bottom-sheet').evaluate(
                  node =>
                    node.getAttribute('aria-hidden') === 'false' &&
                    !node.classList.contains('hidden'),
                );
                if (legacyExploreSheetVisible) {
                  throw new Error(`Legacy Explore sheet remained visible on ${viewport.id}`);
                }

                const exploreGeometry = await sheetGeometry(
                  page,
                  '#assistant-category-rail[data-rail-stage="places"]',
                );
                assertInside(exploreGeometry.rect, viewport, 'Contextual Explore rail');
                if (
                  exploreGeometry.rootWidth > viewport.width + 1 ||
                  exploreGeometry.bodyWidth > viewport.width + 1
                ) {
                  throw new Error(
                    `Contextual rail horizontal overflow on ${viewport.id}: ${JSON.stringify(exploreGeometry)}`,
                  );
                }
                const mapGeometry = await page.locator('#map').evaluate(node => {
                  const rect = node.getBoundingClientRect();
                  return { width: rect.width, height: rect.height };
                });
                if (
                  mapGeometry.width < viewport.width * 0.95 ||
                  mapGeometry.height < viewport.height * 0.72
                ) {
                  throw new Error(
                    `Map-first canvas shrank on ${viewport.id}: ${JSON.stringify(mapGeometry)}`,
                  );
                }

                let exploreAccessibility = null;
                if (viewport.id === 'w390') {
                  await page.evaluate(() => {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'he';
                  });
                  await page.waitForTimeout(80);
                  const rtlExplore = await sheetGeometry(
                    page,
                    '#assistant-category-rail[data-rail-stage="places"]',
                  );
                  if (
                    rtlExplore.direction !== 'rtl' ||
                    rtlExplore.rootWidth > 391 ||
                    rtlExplore.bodyWidth > 391
                  ) {
                    throw new Error(
                      `RTL contextual rail drift: ${JSON.stringify(rtlExplore)}`,
                    );
                  }

                  await page.evaluate(() => {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'pt-BR';
                    document.documentElement.style.fontSize = '200%';
                  });
                  await page.waitForTimeout(80);
                  const zoomedExplore = await sheetGeometry(
                    page,
                    '#assistant-category-rail[data-rail-stage="places"]',
                  );
                  assertInside(
                    zoomedExplore.rect,
                    { id: 'w390-explore-200pct', width: 390, height: 844 },
                    'Contextual rail at 200% text',
                  );
                  if (
                    zoomedExplore.rootWidth > 391 ||
                    zoomedExplore.bodyWidth > 391
                  ) {
                    throw new Error(
                      `Contextual rail 200% text overflow: ${JSON.stringify(zoomedExplore)}`,
                    );
                  }
                  await page.evaluate(() => {
                    document.documentElement.style.fontSize = '';
                  });

                  await page.emulateMedia({ forcedColors: 'active' });
                  const forcedExplore = await explore
                    .locator('[data-context-rail-option="true"]')
                    .first()
                    .evaluate(node => ({
                      borderStyle: getComputedStyle(node).borderStyle,
                      borderWidth: getComputedStyle(node).borderWidth,
                    }));
                  if (
                    forcedExplore.borderStyle === 'none' ||
                    forcedExplore.borderWidth === '0px'
                  ) {
                    throw new Error(
                      `forced-colors removed contextual rail boundary: ${JSON.stringify(forcedExplore)}`,
                    );
                  }
                  await page.screenshot({
                    path: '/tmp/place-explore-v2/explore-w390-accessibility.png',
                    fullPage: false,
                    animations: 'disabled',
                  });
                  await page.emulateMedia({ forcedColors: 'none' });

                  exploreAccessibility = {
                    rtlExplore,
                    zoomedExplore,
                    forcedExplore,
                    keyboardReachable: true,
                  };
                }

                await page.screenshot({
                  path: `/tmp/place-explore-v2/explore-${viewport.id}.png`,
                  fullPage: false,
                  animations: 'disabled',
                });

                const result = page.locator(
                  '#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]',
                );
                await result.waitFor({ state: 'visible', timeout: 5000 });
                const resultGeometry = await result.evaluate(node => {
                  const rect = node.getBoundingClientRect();
                  const source = node.closest('.md-assistant-category-scroll');
                  const sourceRect = source?.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return {
                    width: rect.width,
                    height: rect.height,
                    sourceWidth: sourceRect?.width ?? null,
                    wordBreak: style.wordBreak,
                    overflowWrap: style.overflowWrap,
                  };
                });
                if (
                  resultGeometry.width < 44 ||
                  resultGeometry.height < 44 ||
                  resultGeometry.wordBreak === 'break-all'
                ) {
                  throw new Error(
                    `MANUAL_CONFORMANCE_SEARCH_RESULT_GEOMETRY on ${viewport.id}: ${JSON.stringify(resultGeometry)}`,
                  );
                }
                if (viewport.id === 'w390') {
                  await result.focus();
                  await page.keyboard.press('Enter');
                } else {
                  await result.click();
                }

                await page.locator(
                  '#assistant-category-rail[data-rail-stage="detail"][data-context-place="Primeira Praia"]',
                ).waitFor({ state: 'visible', timeout: 10000 });
                await page.locator(
                  '#map[data-explore-stage="detail"][data-explore-place="Primeira Praia"][data-map-marker-count="1"]',
                ).waitFor({ state: 'attached', timeout: 10000 });
                const detailMessage = page.locator(
                  '#assistant-category-results-message.md-assistant-place-detail-message[data-place="Primeira Praia"]',
                );
                await detailMessage.waitFor({ state: 'visible', timeout: 10000 });

                const detailState = await page.evaluate(() => {
                  const legacySheet = document.getElementById('place-bottom-sheet');
                  const message = document.querySelector(
                    '#assistant-category-results-message.md-assistant-place-detail-message',
                  );
                  const rail = document.querySelector(
                    '#assistant-category-rail[data-rail-stage="detail"]',
                  );
                  const actions = Array.from(
                    rail?.querySelectorAll('[data-context-rail-option="true"]') ?? [],
                  );
                  const voiceCta = document.getElementById('voiceButton');
                  const compatInput = document.getElementById('assistantInput');
                  const compatSend = document.getElementById('sendButton');
                  const selectedMarker = document.querySelector(
                    '#map[data-explore-stage="detail"] .morro-explore-marker[data-location-name]',
                  );
                  const unifiedDock = document.getElementById('unified-assistant-dock');
                  const dockRect =
                    unifiedDock instanceof HTMLElement
                      ? unifiedDock.getBoundingClientRect()
                      : null;
                  const actionValues = actions.map(button => button.getAttribute('data-value'));
                  const actionTargets = actions.map(button => {
                    const rect = button.getBoundingClientRect();
                    const style = getComputedStyle(button);
                    const isStructuralBack = button.matches('[data-context-rail-back]');
                    return {
                      width: rect.width,
                      height: rect.height,
                      isStructuralBack,
                      visible:
                        style.display !== 'none' &&
                        style.visibility !== 'hidden' &&
                        rect.width > 0 &&
                        rect.height > 0,
                    };
                  });
                  const voiceRect =
                    voiceCta instanceof HTMLElement
                      ? voiceCta.getBoundingClientRect()
                      : null;
                  return {
                    legacySheetExists: Boolean(legacySheet),
                    title:
                      message?.querySelector('.md-assistant-place-detail-title')?.textContent?.trim() ??
                      null,
                    meta:
                      message?.querySelector('.md-assistant-place-detail-meta')?.textContent?.trim() ??
                      null,
                    actionValues,
                    actionTargets,
                    selectedMarkerLabel:
                      selectedMarker instanceof HTMLElement
                        ? selectedMarker.dataset.locationName ?? null
                        : null,
                    voiceLabel: voiceCta?.textContent?.trim() ?? null,
                    voiceWidth: voiceRect?.width ?? 0,
                    voiceHeight: voiceRect?.height ?? 0,
                    textControls: ['assistantInput', 'sendButton'].map(id => {
                      const node = document.getElementById(id);
                      if (!(node instanceof HTMLElement)) return null;
                      const rect = node.getBoundingClientRect();
                      const style = getComputedStyle(node);
