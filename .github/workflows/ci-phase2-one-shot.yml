name: CI Phase 2 One Shot

on:
  push:
    branches:
      - ci/actions-cost-phase2-heavy-gates

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/actions-cost-phase2-heavy-gates
      - name: Add cancellation and timeout guards
        shell: python
        run: |
          from pathlib import Path

          targets = {
              '.github/workflows/payments-browser-checkout-contract.yml': ('payments-browser-checkout', 15),
              '.github/workflows/crm-platform-auth-integration-contract.yml': ('crm-platform-auth', 20),
              '.github/workflows/business-onboarding-lifecycle-browser-contract.yml': ('business-onboarding-lifecycle', 15),
              '.github/workflows/auth-login-browser-contract.yml': ('auth-login-browser', 15),
          }

          for raw_path, (group_name, timeout) in targets.items():
              path = Path(raw_path)
              text = path.read_text()
              if '\nconcurrency:\n' in text or 'timeout-minutes:' in text:
                  raise SystemExit(f'{raw_path}: guard already present; refusing ambiguous rewrite')

              permissions = 'permissions:\n  contents: read\n\n'
              if permissions not in text:
                  raise SystemExit(f'{raw_path}: permissions anchor missing')
              text = text.replace(
                  permissions,
                  permissions
                  + 'concurrency:\n'
                  + f'  group: {group_name}-${{{{ github.workflow }}}}-${{{{ github.ref }}}}\n'
                  + '  cancel-in-progress: true\n\n',
                  1,
              )

              runs_on = '    runs-on: ubuntu-24.04\n'
              if runs_on not in text:
                  raise SystemExit(f'{raw_path}: runs-on anchor missing')
              text = text.replace(
                  runs_on,
                  runs_on + f'    timeout-minutes: {timeout}\n',
                  1,
              )
              path.write_text(text)
      - name: Commit permanent workflow guards and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/payments-browser-checkout-contract.yml \
            .github/workflows/crm-platform-auth-integration-contract.yml \
            .github/workflows/business-onboarding-lifecycle-browser-contract.yml \
            .github/workflows/auth-login-browser-contract.yml
          git rm .github/workflows/ci-phase2-one-shot.yml
          git commit -m 'ci: cancel stale heavyweight contract runs'
          git push origin HEAD:ci/actions-cost-phase2-heavy-gates
