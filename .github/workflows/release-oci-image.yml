name: Release OCI Image

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to package as immutable OCI image
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2

jobs:
  image:
    name: release-image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/run-release-oci '))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact owner-authorized invocation
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_sha="$INPUT_SHA"
          else
            read -r command expected_sha extra <<<"$COMMENT_BODY"
            test "$command" = "/run-release-oci"
            test -z "${extra:-}"
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected_sha"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$expected_sha"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove exact source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "tree=$(git rev-parse "$EXPECTED_SHA^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable image
        id: publish
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$EXPECTED_SHA"
          docker build --pull --target production \
            --build-arg "MORRO_RELEASE_SHA=$EXPECTED_SHA" \
            --build-arg "MORRO_RELEASE_VERSION=$EXPECTED_SHA" \
            --build-arg "MORRO_RELEASE_IMAGE_RUN_ID=$GITHUB_RUN_ID" \
            --label "org.opencontainers.image.revision=$EXPECTED_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image" .
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | sed 's/^.*@//')"
          test -n "$digest"
          echo "image=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_REPOSITORY@$digest"

      - name: Verify immutable registry digest
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$EXPECTED_SHA" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          test "$remote" = "$DIGEST"

      - name: Smoke the exact immutable release digest
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE_REPOSITORY@$DIGEST"
          docker pull "$ref"
          user="$(docker image inspect --format '{{.Config.User}}' "$ref")"
          case "$user" in
            65532|65532:65532|nonroot) ;;
            *) echo "RUNTIME_USER_NOT_NONROOT:$user" >&2; exit 1 ;;
          esac
          container_name="morro-release-smoke-$GITHUB_RUN_ID"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:43173:4173 \
            --env HOST=0.0.0.0 --env PORT=4173 \
            --env NODE_ENV=production \
            --env ANALYTICS_FEATURE_ENABLED=false \
            "$ref"
          for attempt in {1..35}; do
            if curl --silent --show-error --fail \
              http://127.0.0.1:43173/healthz \
              --output /tmp/morro-release-health.json; then
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container_name")" != true; then
              docker logs "$container_name" >&2 || true
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const health = JSON.parse(readFileSync("/tmp/morro-release-health.json","utf8"));
          assert.equal(health.status, "live");
          assert.equal(health.release?.sha, process.env.EXPECTED_SHA);
          NODE

      - name: Scan immutable digest for embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
          scanners: secret
          exit-code: "1"
          format: table

      - name: Scan immutable digest for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: json
          output: trivy-immutable-release-vulnerabilities.json

      - name: Upload immutable digest scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-image-security-${{ steps.invocation.outputs.expected_sha }}
          path: trivy-immutable-release-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write release provenance
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          TREE_SHA: ${{ steps.identity.outputs.tree }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$EXPECTED_SHA" \
            --arg tree_sha "$TREE_SHA" \
            --arg image "$IMAGE_REPOSITORY" \
            --arg digest "$DIGEST" \
            --arg image_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              source_sha: $source_sha,
              tree_sha: $tree_sha,
              image: $image,
              digest: $digest,
              image_run_id: $image_run_id,
              workflow_run: $workflow_run
            }' > release-provenance.json
          cat release-provenance.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance-${{ steps.invocation.outputs.expected_sha }}
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 90
