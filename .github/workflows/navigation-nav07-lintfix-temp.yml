name: Fix NAV-07 Lint Temp

on:
  push:
    branches:
      - feat/navigation-browser-geolocation
    paths:
      - .github/workflows/navigation-nav07-lintfix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-browser-geolocation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply explicit subscriber typing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/morro-digital-platform/src/navigation/browser-geolocation.ts';
          let source = fs.readFileSync(path, 'utf8');
          const from = '    subscribe(listener) {\n      subscribers.add(listener);\n      return () => subscribers.delete(listener);\n    },';
          const to = '    subscribe(listener: (location: BrowserLocation) => void): () => void {\n      subscribers.add(listener);\n      return () => subscribers.delete(listener);\n    },';
          if (!source.includes(from)) throw new Error('subscribe anchor not found');
          source = source.replace(from, to);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write apps/morro-digital-platform/src/navigation/browser-geolocation.ts
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/navigation/browser-geolocation.ts
          git commit -m "fix: type NAV-07 subscriber boundary"
          git push origin HEAD:feat/navigation-browser-geolocation
