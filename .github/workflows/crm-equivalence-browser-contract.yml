name: CRM Equivalence Browser Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crm-equivalence-browser-contract.yml"
      - "apps/admin-crm/public/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/crm-m141-equivalence-contract.test.ts"
      - "apps/morro-digital-platform/tooling/crm-m141-equivalence-browser-e2e.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "packages/business/**"
      - "packages/crm/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/crm/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "docs/migration/CRM-MIGRATION-MATRIX.md"
      - "docs/qa/CRM-M141-EQUIVALENCE-EVIDENCE.md"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crm-equivalence-browser-contract.yml"
      - "apps/admin-crm/public/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/crm-m141-equivalence-contract.test.ts"
      - "apps/morro-digital-platform/tooling/crm-m141-equivalence-browser-e2e.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "packages/business/**"
      - "packages/crm/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/crm/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "docs/migration/CRM-MIGRATION-MATRIX.md"
      - "docs/qa/CRM-M141-EQUIVALENCE-EVIDENCE.md"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: crm-equivalence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crm-pass
          MYSQL_DATABASE: morro_crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcrm-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate focused CRM equivalence contracts
        run: |
          pnpm --filter @touristic/crm lint
          pnpm --filter @touristic/crm typecheck
          pnpm --filter @touristic/crm test
          pnpm --filter @touristic/crm-server lint
          pnpm --filter @touristic/crm-server typecheck
          pnpm --filter @touristic/crm-server test
          pnpm --filter @touristic/morro-digital-platform exec vitest run src/crm-m141-equivalence-contract.test.ts

      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Build authenticated CRM runtime graph
        run: |
          pnpm turbo run build --filter=@touristic/auth-browser --filter=@touristic/auth-server --filter=@touristic/crm --filter=@touristic/crm-server --filter=@touristic/business --filter=@touristic/financial-server --filter=@touristic/ordering-server
          pnpm --filter @touristic/morro-digital-platform build

      - name: Start authenticated CRM runtime
        shell: bash
        run: |
          set -euo pipefail
          PORT=4192
          SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="correct horse battery staple"
          HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 13))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"owner-1",email:"owner@example.com",passwordHash:process.argv[1],role:"owner",businessIds:["toca-do-morcego"]},{id:"viewer-1",email:"viewer@example.com",passwordHash:process.argv[1],role:"viewer",businessIds:["toca-do-morcego"]}]))' "$HASH")
          DASHBOARD_AUTH_SECRET="$SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          CRM_DATABASE_URL="mysql://root:crm-pass@127.0.0.1:3306/morro_crm" \
          PORT="$PORT" HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/crm-m141-server.log 2>&1 &
          echo $! >/tmp/crm-m141-server.pid
          for _ in $(seq 1 80); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/runtime-config.js" >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/crm-m141-server.log
          exit 1

      - name: Prepare real MySQL fixtures and negative paths
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="http://127.0.0.1:4192"
          PASSWORD="correct horse battery staple"

          request() {
            local file="$1"
            shift
            curl --silent --output "$file" --write-out '%{http_code}' "$@"
          }
          assert_http() {
            local actual="$1" expected="$2" file="$3" label="$4"
            if [ "$actual" != "$expected" ]; then
              echo "$label expected HTTP $expected but received $actual"
              cat "$file" || true
              cat /tmp/crm-m141-server.log || true
              exit 1
            fi
          }

          OWNER_LOGIN=$(request /tmp/m141-owner-login.json --cookie-jar /tmp/m141-owner.cookies \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"owner@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$OWNER_LOGIN" 200 /tmp/m141-owner-login.json owner-login
          OWNER_CSRF=$(jq -r '.csrfToken' /tmp/m141-owner-login.json)

          CREATE=$(request /tmp/m141-create.json --cookie /tmp/m141-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            --data '{"companyName":"Toca do Morcego","segment":"events","contactName":"Luiz","phone":"7530000000","whatsapp":"557530000000","email":"crm@example.com","address":"Rua do Farol","website":"https://example.com","notes":"Limpar no M141","source":"baseline-v1","monthlyValue":"499.90"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$CREATE" 200 /tmp/m141-create.json owner-create
          LEAD_ID=$(jq -r '.data.id' /tmp/m141-create.json)
          test "$LEAD_ID" != "null"
          printf '%s' "$LEAD_ID" >/tmp/m141-lead-id.txt

          FOLLOW_UP=$(request /tmp/m141-follow-up-create.json --cookie /tmp/m141-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"scheduledAt\":\"2026-08-17T12:00:00.000Z\",\"attemptNumber\":1}" \
            "$ORIGIN/api/crm/follow-ups")
          assert_http "$FOLLOW_UP" 200 /tmp/m141-follow-up-create.json follow-up-create
          FOLLOW_UP_ID=$(jq -r '.data.id' /tmp/m141-follow-up-create.json)
          test "$FOLLOW_UP_ID" != "null"
          printf '%s' "$FOLLOW_UP_ID" >/tmp/m141-follow-up-id.txt

          INVALID_TRANSITION=$(request /tmp/m141-invalid-transition.json --cookie /tmp/m141-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --request POST "$ORIGIN/api/crm/follow-ups/$FOLLOW_UP_ID/responded")
          assert_http "$INVALID_TRANSITION" 409 /tmp/m141-invalid-transition.json invalid-transition
          grep -q 'INVALID_TRANSITION' /tmp/m141-invalid-transition.json

          VIEWER_LOGIN=$(request /tmp/m141-viewer-login.json --cookie-jar /tmp/m141-viewer.cookies \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"viewer@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$VIEWER_LOGIN" 200 /tmp/m141-viewer-login.json viewer-login
          VIEWER_CSRF=$(jq -r '.csrfToken' /tmp/m141-viewer-login.json)

          VIEWER_WRITE=$(request /tmp/m141-viewer-write.json --cookie /tmp/m141-viewer.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $VIEWER_CSRF" \
            --request POST "$ORIGIN/api/crm/follow-ups/$FOLLOW_UP_ID/sent")
          assert_http "$VIEWER_WRITE" 403 /tmp/m141-viewer-write.json viewer-write
          grep -q 'READ_ONLY_ROLE' /tmp/m141-viewer-write.json

      - name: Validate responsive keyboard accessibility and CRM lifecycle
        run: node apps/morro-digital-platform/tooling/crm-m141-equivalence-browser-e2e.cjs

      - name: Validate durable readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -h 127.0.0.1 -uroot -pcrm-pass -N -B morro_crm -e "SELECT status FROM crm_follow_ups WHERE id=$(cat /tmp/m141-follow-up-id.txt)")" = "responded"
          test "$(mysql -h 127.0.0.1 -uroot -pcrm-pass -N -B morro_crm -e "SELECT company_name FROM crm_leads WHERE id=$(cat /tmp/m141-lead-id.txt)")" = "Toca do Morcego"
          mysql -h 127.0.0.1 -uroot -pcrm-pass -N -B morro_crm -e "SELECT COALESCE(contact_name,''),COALESCE(email,''),COALESCE(notes,'') FROM crm_leads WHERE id=$(cat /tmp/m141-lead-id.txt)" >/tmp/m141-cleared-db.txt
          test "$(tr -d '\t\n\r' </tmp/m141-cleared-db.txt)" = ""

      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/crm-m141-server.log || true
          cat /tmp/m141-create.json || true
          cat /tmp/m141-follow-up-create.json || true
          cat /tmp/m141-invalid-transition.json || true
          cat /tmp/m141-viewer-write.json || true
          cat /tmp/crm-m141-evidence/evidence.json || true
          cat /tmp/m141-cleared-db.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crm-m141-equivalence-evidence
          path: /tmp/crm-m141-evidence
          retention-days: 7
          if-no-files-found: error

      - name: Stop runtime
        if: always()
        run: |
          if [ -f /tmp/crm-m141-server.pid ]; then kill "$(cat /tmp/crm-m141-server.pid)" 2>/dev/null || true; fi