name: M66 auth reconciliation helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/auth-m66-login-surface-parity
    paths:
      - ".github/workflows/m66-auth-reconciliation-helper.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-m66-login-surface-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Auth reconciliation
        run: |
          python3 .github/scripts/m66-auth-reconciliation.py
          pnpm exec prettier --write docs/migration/AUTH-MIGRATION-MATRIX.md docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/AUTH-M66-EVIDENCE.md
      - name: Validate canonical docs
        run: |
          pnpm format:check
          pnpm features:check
      - name: Commit permanent reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/AUTH-MIGRATION-MATRIX.md docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/AUTH-M66-EVIDENCE.md
          git commit -m "docs(auth): reconcile M66 final equivalence"
          git push origin HEAD:feat/auth-m66-login-surface-parity
