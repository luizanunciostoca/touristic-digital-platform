name: V1 Tour Responsive Browser Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/v1-tour-responsive-browser-regression.yml
      - apps/morro-digital-platform/public/index.html
      - apps/morro-digital-platform/public/styles.css
      - apps/morro-digital-platform/public/v1-tour-assistant-visibility.css
      - apps/morro-digital-platform/public/legacy/**
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/onboarding/public-interactive-tour.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  v1-tour-responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/v1-tour-responsive
      - name: Build workspace
        run: pnpm -w build
      - name: Start fallback runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-tour-responsive/server.log 2>&1 &
          echo $! >/tmp/v1-tour-responsive/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-tour-responsive/server.log
          exit 1
      - name: Validate V1 tutorial geometry across mobile tablet and desktop
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const outputDir = '/tmp/v1-tour-responsive';
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1280, height: 800 },
          ];

          function rectInsideViewport(rect, viewport, tolerance = 2) {
            return rect &&
              rect.width > 0 &&
              rect.height > 0 &&
              rect.left >= -tolerance &&
              rect.top >= -tolerance &&
              rect.right <= viewport.width + tolerance &&
              rect.bottom <= viewport.height + tolerance;
          }

          async function snapshot(page) {
            return page.evaluate(() => {
              const tooltip = document.getElementById('tour-tooltip');
              const highlight = document.getElementById('tour-highlight');
              const target = document.querySelector('.tour-target-active');
              const assistant = document.getElementById('assistant-messages');
              const assistantStyle = assistant ? getComputedStyle(assistant) : null;
              const toRect = node => {
                if (!(node instanceof Element)) return null;
                const rect = node.getBoundingClientRect();
                return {
                  left: rect.left,
                  top: rect.top,
                  right: rect.right,
                  bottom: rect.bottom,
                  width: rect.width,
                  height: rect.height,
                };
              };
              return {
                label: document.querySelector('.tour-step-label')?.textContent?.trim() ?? null,
                tooltip: toRect(tooltip),
                highlight: toRect(highlight),
                target: toRect(target),
                targetIdentity: target?.id || target?.className || null,
                assistantVisible: assistantStyle
                  ? assistantStyle.display !== 'none' &&
                    assistantStyle.visibility !== 'hidden' &&
                    assistantStyle.opacity !== '0'
                  : null,
                bodyScrollWidth: document.documentElement.scrollWidth,
                bodyClientWidth: document.documentElement.clientWidth,
              };
            });
          }

          async function startTour(page) {
            await page.evaluate(() => {
              localStorage.removeItem('morro-digital-onboarded');
              localStorage.setItem('voice-enabled', 'false');
            });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#map[data-map-state="ready"][data-home-state="ready"]').waitFor({ state: 'attached', timeout: 20000 });
            await page.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await page.locator('[data-public-onboarding-action="start"]').click();
            await page.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
          }

          async function validateViewport(browser, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await startTour(page);

            const steps = [];
            for (let step = 1; step <= 7; step += 1) {
              await page.locator('.tour-step-label').filter({ hasText: `Passo ${step} de 7` }).waitFor({ state: 'visible' });
              const current = await snapshot(page);
              if (!rectInsideViewport(current.tooltip, viewport)) {
                throw new Error(`${viewport.name} step ${step} tooltip escaped viewport: ${JSON.stringify(current)}`);
              }
              if (!rectInsideViewport(current.highlight, viewport)) {
                throw new Error(`${viewport.name} step ${step} highlight escaped viewport: ${JSON.stringify(current)}`);
              }
              if (!current.target || current.target.width <= 0 || current.target.height <= 0) {
                throw new Error(`${viewport.name} step ${step} target is not measurable: ${JSON.stringify(current)}`);
              }
              const expectedAssistantVisible = step >= 4 && step <= 6;
              if (current.assistantVisible !== expectedAssistantVisible) {
                throw new Error(`${viewport.name} step ${step} assistant visibility diverged: ${JSON.stringify(current)}`);
              }
              if (current.bodyScrollWidth > current.bodyClientWidth + 2) {
                throw new Error(`${viewport.name} step ${step} introduced horizontal overflow: ${JSON.stringify(current)}`);
              }
              steps.push(current);
              if (step < 7) await page.locator('.tour-btn-next').click();
            }

            await page.locator('.tour-btn-finish').click();
            await page.locator('#tour-tooltip').waitFor({ state: 'detached', timeout: 3000 });
            const restored = await page.evaluate(() => ({
              onboarded: localStorage.getItem('morro-digital-onboarded'),
              settled: document.body.getAttribute('data-public-onboarding-settled'),
              assistantHidden: document.getElementById('assistant-messages')?.getAttribute('aria-hidden'),
              assistantVisible: (() => {
                const node = document.getElementById('assistant-messages');
                if (!node) return false;
                const style = getComputedStyle(node);
                return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
              })(),
            }));
            if (restored.onboarded !== '1' || restored.settled !== 'true' || restored.assistantHidden !== 'false' || !restored.assistantVisible) {
              throw new Error(`${viewport.name} exit restoration diverged: ${JSON.stringify(restored)}`);
            }
            if (errors.length) throw new Error(`${viewport.name} browser errors: ${JSON.stringify(errors)}`);

            await page.screenshot({
              path: `${outputDir}/${viewport.name}-tour-restored.png`,
              fullPage: false,
              animations: 'disabled',
            });
            await context.close();
            return { viewport, steps, restored, errors };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const evidence = [];
              for (const viewport of viewports) {
                evidence.push(await validateViewport(browser, viewport));
              }
              writeFileSync(`${outputDir}/evidence.json`, JSON.stringify(evidence, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            writeFileSync(`${outputDir}/failure.txt`, String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/v1-tour-responsive/server.log || true
          cat /tmp/v1-tour-responsive/failure.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-tour-responsive-evidence
          path: /tmp/v1-tour-responsive
          retention-days: 7
          if-no-files-found: error
