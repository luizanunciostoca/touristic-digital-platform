name: CRM M140 Format Once

on:
  push:
    branches: [feat/crm-m140-lead-detail-activity]
    paths:
      - ".github/workflows/crm-m140-format-once.yml"

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m140-lead-detail-activity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/crm-lead-detail-contract.test.ts \
            docs/migration/CRM-MIGRATION-MATRIX.md \
            packages/crm/src/lead-detail-boundary.test.ts \
            packages/crm/src/lead-detail-boundary.ts \
            services/crm/src/lead-detail-http-transport.ts \
            services/crm/src/mysql-lead-detail-repository.test.ts
          rm .github/workflows/crm-m140-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/crm-lead-detail-contract.test.ts \
            docs/migration/CRM-MIGRATION-MATRIX.md \
            packages/crm/src/lead-detail-boundary.test.ts \
            packages/crm/src/lead-detail-boundary.ts \
            services/crm/src/lead-detail-http-transport.ts \
            services/crm/src/mysql-lead-detail-repository.test.ts \
            .github/workflows/crm-m140-format-once.yml
          git commit -m "style(crm): apply canonical M140 formatting"
          git push origin HEAD:feat/crm-m140-lead-detail-activity
