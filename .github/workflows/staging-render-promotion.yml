name: Staging Render Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for staging promotion
        required: true
        type: string
      confirm_staging:
        description: Type DEPLOY to authorize the staging deploy
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  STAGING_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_STAGING_ENVIRONMENT: staging
  EXPECTED_STAGING_SERVICE_NAME: morro-digital-v2-staging
  EXPECTED_STAGING_SERVICE_ID: srv-da4hb6c9v7es7386ttt0
  EXPECTED_STAGING_CANONICAL_URL: https://morro-digital-v2-staging.onrender.com

concurrency:
  group: staging-render-promotion
  cancel-in-progress: false

jobs:
  preflight:
    name: staging / preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Prove exact SHA is current main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate staging and release contracts
        run: |
          pnpm platform:contracts:check
          pnpm migration:dry-run
          pnpm release:readiness:check
          pnpm secret-patterns:check
          pnpm ci:governance:check
          pnpm ci:supply-chain:strict
          pnpm build

  deploy:
    name: staging / deploy
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.confirm_staging == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: main - morro-digital-v2-staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prove canonical Render staging hook target before deploy
        id: staging-target
        env:
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_STAGING_DEPLOY_HOOK_URL"

          hook_service_id="$(node -e '
            const value = process.env.RENDER_STAGING_DEPLOY_HOOK_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.hostname !== "api.render.com") process.exit(2);
            const match = url.pathname.match(/^\/deploy\/(srv-[A-Za-z0-9]+)$/);
            if (!match) process.exit(3);
            process.stdout.write(match[1]);
          ')"

          test "$hook_service_id" = "$EXPECTED_STAGING_SERVICE_ID"
          test "$STAGING_URL" = "$EXPECTED_STAGING_CANONICAL_URL"
          echo "service_id=$hook_service_id" >> "$GITHUB_OUTPUT"
          echo "Canonical staging hook target proved: $EXPECTED_STAGING_SERVICE_NAME ($hook_service_id)"

      - name: Trigger exact-SHA Render staging deploy
        id: render-deploy
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "$RENDER_STAGING_DEPLOY_HOOK_URL" == *\?* ]]; then
            separator='&'
          fi
          deploy_url="${RENDER_STAGING_DEPLOY_HOOK_URL}${separator}ref=${EXPECTED_SHA}"
          http_status="$(curl --request POST --silent --show-error \
            --output /tmp/render-staging-deploy-response.json \
            --write-out '%{http_code}' \
            "$deploy_url")"
          case "$http_status" in
            200|202) ;;
            *)
              echo "Render staging deploy hook failed with HTTP $http_status" >&2
              cat /tmp/render-staging-deploy-response.json >&2
              exit 1
              ;;
          esac
          deploy_id="$(jq -r '.deploy.id // .id // empty' /tmp/render-staging-deploy-response.json 2>/dev/null || true)"
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render staging deploy accepted for exact SHA $EXPECTED_SHA as $deploy_id"

      - name: Wait for exact-SHA staging health and identity
        id: live-staging
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.STAGING_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 90); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                echo "live_sha=$release_sha" >> "$GITHUB_OUTPUT"
                echo "Exact-SHA staging smoke PASS: $release_sha"
                exit 0
              fi
              last_output="$output"
              echo "Staging release is ${release_sha:-unknown}; waiting for $EXPECTED_SHA"
            else
              last_output="$output"
              echo "Staging smoke not ready yet; retrying"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          echo "Exact-SHA staging smoke timed out for $EXPECTED_SHA" >&2
          exit 1

      - name: Publish structured staging deployment evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
          LIVE_SHA: ${{ steps.live-staging.outputs.live_sha }}
          PROVED_SERVICE_ID: ${{ steps.staging-target.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$LIVE_SHA"
          test "$PROVED_SERVICE_ID" = "$EXPECTED_STAGING_SERVICE_ID"
          test "$STAGING_URL" = "$EXPECTED_STAGING_CANONICAL_URL"
          jq -n             --arg expectedSha "$EXPECTED_SHA"             --arg serviceId "$PROVED_SERVICE_ID"             --arg serviceName "$EXPECTED_STAGING_SERVICE_NAME"             --arg environment "$EXPECTED_STAGING_ENVIRONMENT"             --arg deploymentId "$DEPLOY_ID"             --arg canonicalUrl "$STAGING_URL"             --arg liveSha "$LIVE_SHA"             --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{
              expectedSha: $expectedSha,
              serviceId: $serviceId,
              serviceName: $serviceName,
              environment: $environment,
              deploymentId: $deploymentId,
              canonicalUrl: $canonicalUrl,
              liveSha: $liveSha,
              verifiedAt: $verifiedAt,
              workflowRun: $workflowRun
            }' > staging-deployment-evidence.json
          jq -e '
            .expectedSha == .liveSha and
            .environment == "staging" and
            .serviceName == "morro-digital-v2-staging" and
            .serviceId == "srv-da4hb6c9v7es7386ttt0" and
            .canonicalUrl == "https://morro-digital-v2-staging.onrender.com" and
            (.deploymentId | length > 0)
          ' staging-deployment-evidence.json >/dev/null
          cat staging-deployment-evidence.json

      - name: Upload staging deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-deployment-evidence-${{ github.run_id }}
          path: staging-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
