name: Staging Render Promotion
run-name: "staging-render-promotion:${{ inputs.operation }}:${{ inputs.caller_run_id }}:${{ inputs.caller_run_attempt }}:${{ inputs.expected_sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Dispatch once or only verify an existing dispatch
        type: choice
        options: [dispatch, verify-only]
        default: dispatch
      caller_run_id:
        description: Exact Final Release Acceptance caller run
        required: true
        type: string
      caller_run_attempt:
        description: Exact caller attempt
        required: true
        type: string
      dispatch_run_id:
        description: Original dispatch run for verification-only continuation
        required: false
        type: string
      dispatch_run_attempt:
        description: Original dispatch attempt for verification-only continuation
        required: false
        type: string
      expected_sha:
        description: Exact frozen candidate SHA approved for staging promotion
        required: true
        type: string
      request_id:
        description: Correlation identifier used to bind the caller to this exact workflow run
        required: false
        default: manual
        type: string
      confirm_staging:
        description: Type DEPLOY to authorize the staging deploy
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  STAGING_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_STAGING_ENVIRONMENT: staging
  EXPECTED_STAGING_SERVICE_NAME: morro-digital-v2-staging
  EXPECTED_STAGING_SERVICE_ID: srv-da4hb6c9v7es7386ttt0
  EXPECTED_STAGING_CANONICAL_URL: https://morro-digital-v2-staging.onrender.com

jobs:
  preflight:
    if: inputs.operation == 'dispatch'
    name: staging / preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Prove frozen candidate provenance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate staging and release contracts
        run: |
          pnpm platform:contracts:check
          pnpm migration:dry-run
          pnpm release:readiness:check
          pnpm secret-patterns:check
          pnpm ci:governance:check
          pnpm ci:supply-chain:strict
          pnpm build

  intent:
    if: inputs.operation == 'dispatch'
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Publish exact-run Node intent
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
        run: node tooling/ci/staging-node-exception.mjs node-intent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-node-intent.json
          if-no-files-found: error

  deploy:
    name: staging / single authorized Node dispatch
    needs: intent
    if: inputs.operation == 'dispatch' && inputs.confirm_staging == 'DEPLOY' && github.ref == format('refs/tags/rc/{0}', inputs.expected_sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: render-staging-srv-da4hb6c9v7es7386ttt0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: read
    environment:
      name: main - morro-digital-v2-staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Prove immutable candidate before external authorization
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"
      - name: Prove canonical Render staging hook target before deploy
        env:
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_STAGING_DEPLOY_HOOK_URL"
          hook_service_id="$(node -e '
            const url = new URL(process.env.RENDER_STAGING_DEPLOY_HOOK_URL);
            if (url.protocol !== "https:" || url.hostname !== "api.render.com") process.exit(2);
            const match = url.pathname.match(/^\/deploy\/(srv-[A-Za-z0-9]+)$/);
            if (!match) process.exit(3);
            process.stdout.write(match[1]);
          ')"
          test "$hook_service_id" = "$EXPECTED_STAGING_SERVICE_ID"
          test "$STAGING_URL" = "$EXPECTED_STAGING_CANONICAL_URL"

      - name: Revalidate receipt inside lock, reserve once, then POST existing hook
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: node tooling/ci/staging-node-exception.mjs node-dispatch
      - name: Preserve dispatch outcome including uncertainty
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-node-dispatch.json
          if-no-files-found: error
          retention-days: 30

      - name: Record verifier job barrier after acquiring the service lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
        run: node tooling/ci/staging-node-exception.mjs node-verification-barrier
      - name: Expose the authenticated job barrier before operator readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-verification-barrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-node-verification-barrier.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify original dispatch and external post-receipt without a deploy hook
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
          DISPATCH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tooling/ci/staging-node-exception.mjs node-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: staging / external provider and runtime verification
    concurrency:
      group: render-staging-srv-da4hb6c9v7es7386ttt0
      cancel-in-progress: false
    needs: [deploy]
    if: always() && inputs.operation == 'verify-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Record verifier job barrier after acquiring the service lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
        run: node tooling/ci/staging-node-exception.mjs node-verification-barrier
      - name: Expose the authenticated job barrier before operator readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-verification-barrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-node-verification-barrier.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify original dispatch and external post-receipt without a deploy hook
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          DISPATCH_RUN_ID: ${{ inputs.dispatch_run_id }}
          DISPATCH_RUN_ATTEMPT: ${{ inputs.dispatch_run_attempt }}
        run: node tooling/ci/staging-node-exception.mjs node-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
