name: Control Center Prettier Temp

on:
  push:
    branches:
      - wave/control-center-shell-sidebar-v1-20260922
    paths:
      - ".github/workflows/control-center-prettier-temp.yml"

permissions:
  contents: write

concurrency:
  group: control-center-prettier-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Wave 1 files
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center-shell-v1.js \
            apps/control-center/public/index.html \
            apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts \
            apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs
          mkdir -p /tmp/control-center-prettier
          cp apps/control-center/public/control-center-shell-v1.js /tmp/control-center-prettier/
          cp apps/control-center/public/index.html /tmp/control-center-prettier/
          cp apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts /tmp/control-center-prettier/
          cp apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs /tmp/control-center-prettier/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-prettier-output
          path: /tmp/control-center-prettier
          retention-days: 1
      - name: Commit exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --             apps/control-center/public/control-center-shell-v1.js             apps/control-center/public/index.html             apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts             apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/control-center/public/control-center-shell-v1.js             apps/control-center/public/index.html             apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts             apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs
          git commit -m "chore(control-center): apply exact Prettier output"
          git push origin HEAD:wave/control-center-shell-sidebar-v1-20260922
