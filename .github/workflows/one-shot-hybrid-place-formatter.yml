name: One-shot Hybrid Place Formatter

on:
  push:
    branches:
      - wave/map-hybrid-canonical-place-20260925

permissions:
  contents: write

concurrency:
  group: one-shot-hybrid-place-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wave/map-hybrid-canonical-place-20260925
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output and remove formatter
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
          git rm .github/workflows/one-shot-hybrid-place-formatter.yml
          git add \
            apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(map): apply canonical Prettier output"
          git push origin HEAD:wave/map-hybrid-canonical-place-20260925
