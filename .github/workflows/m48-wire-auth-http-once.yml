name: M48 Wire Auth HTTP Once

# rerun after revocation boundary fix
on:
  push:
    branches:
      - feat/auth-m48-server-browser-integration
    paths:
      - .github/workflows/m48-wire-auth-http-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-m48-server-browser-integration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Wire auth adapter into dev server
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = path.read_text()
          old_import = 'import { createAssistantApi } from "./assistant-api.mjs";\n'
          new_import = old_import + 'import { createAuthApi } from "./auth-api.mjs";\n'
          if 'createAuthApi' not in text:
              if old_import not in text: raise SystemExit('assistant import anchor not found')
              text = text.replace(old_import, new_import, 1)
          anchor = '''const assistantApi = createAssistantApi({
            getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",
          });
          '''
          addition = anchor + '''
          const authApi = createAuthApi({
            getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",
          });
          '''
          if 'const authApi = createAuthApi' not in text:
              if anchor not in text: raise SystemExit('assistant API anchor not found')
              text = text.replace(anchor, addition, 1)
          route_anchor = '''    if (assistantApi.matches(requestUrl.pathname)) {
                await assistantApi.handle(request, response);
                return;
              }
          '''
          route_addition = '''    if (authApi.matches(requestUrl.pathname)) {
                await authApi.handle(request, response, requestUrl.pathname);
                return;
              }
          ''' + route_anchor
          if 'authApi.matches(requestUrl.pathname)' not in text:
              if route_anchor not in text: raise SystemExit('assistant route anchor not found')
              text = text.replace(route_anchor, route_addition, 1)
          path.write_text(text)
          PY
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - name: Format and validate workspace
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/package.json apps/morro-digital-platform/tooling/auth-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs services/auth pnpm-lock.yaml
          pnpm --filter @touristic/auth-server lint
          pnpm --filter @touristic/auth-server typecheck
          pnpm --filter @touristic/auth-server test
          pnpm --filter @touristic/auth-server build
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit wiring and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m48-wire-auth-http-once.yml
          git add apps/morro-digital-platform/package.json apps/morro-digital-platform/tooling/auth-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs services/auth pnpm-lock.yaml
          git commit -m "feat(auth): wire M48 same-origin auth HTTP"
          git push origin HEAD:feat/auth-m48-server-browser-integration
