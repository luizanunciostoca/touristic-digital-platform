name: Home First Run Browser Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/home-first-run-browser-regression.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/bootstrap/geospatial.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - .github/workflows/home-first-run-browser-regression.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/bootstrap/geospatial.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  first-run-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/home-first-run-evidence
      - name: Build workspace
        run: pnpm -w build
      - name: Start fallback runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/home-first-run.log 2>&1 &
          echo $! >/tmp/home-first-run.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-first-run.log
          exit 1
      - name: Validate first-run Home and onboarding lifecycle
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const outputDir = '/tmp/home-first-run-evidence';

          async function waitForHome(page) {
            await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-marker-count="0"]').waitFor({
              state: 'attached',
              timeout: 20000,
            });
          }

          async function readFirstRunState(page) {
            return page.evaluate(() => {
              const overlay = document.getElementById('onboarding-overlay');
              const map = document.getElementById('map');
              const assistant = document.getElementById('assistant-messages');
              const background = Array.from(document.body.children).filter((element) => element !== overlay && element instanceof HTMLElement);
              return {
                overlayPresent: Boolean(overlay),
                overlayPointerEvents: overlay ? getComputedStyle(overlay).pointerEvents : null,
                backgroundAllInert: background.length > 0 && background.every((element) => element.inert),
                mapState: map?.getAttribute('data-map-state') ?? null,
                homeState: map?.getAttribute('data-home-state') ?? null,
                tourState: map?.getAttribute('data-tour-state') ?? null,
                activeTour: map?.getAttribute('data-active-tour') ?? null,
                markerCount: map?.getAttribute('data-map-marker-count') ?? null,
                assistantHidden: Boolean(assistant?.classList.contains('hidden')),
                onboarded: localStorage.getItem('morro-digital-onboarded'),
              };
            });
          }

          async function assertFocusContained(page, steps = 8) {
            for (let index = 0; index < steps; index += 1) {
              await page.keyboard.press(index % 2 === 0 ? 'Tab' : 'Shift+Tab');
              const contained = await page.evaluate(() => {
                const overlay = document.getElementById('onboarding-overlay');
                return Boolean(overlay && overlay.contains(document.activeElement));
              });
              if (!contained) throw new Error(`Onboarding focus escaped at keyboard step ${index + 1}.`);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(page);
            await page.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });

            const initial = await readFirstRunState(page);
            if (!initial.overlayPresent || initial.overlayPointerEvents === 'none' || !initial.backgroundAllInert) {
              throw new Error(`First-run modal isolation failed: ${JSON.stringify(initial)}`);
            }
            if (initial.activeTour !== null || initial.markerCount !== '0' || initial.tourState !== 'idle' || initial.onboarded !== null) {
              throw new Error(`First-run Home was not clean and idle: ${JSON.stringify(initial)}`);
            }
            if (!initial.assistantHidden) {
              throw new Error(`Assistant must remain hidden on first-run Home: ${JSON.stringify(initial)}`);
            }

            await assertFocusContained(page);
            await page.locator('[data-public-onboarding-action="start"]').click();
            await page.locator('[data-public-onboarding-step="tutorial"]:not([hidden])').waitFor({ state: 'visible', timeout: 3000 });
            const afterStart = await readFirstRunState(page);
            if (afterStart.onboarded !== null) {
              throw new Error(`Starting the tutorial must not persist completion: ${JSON.stringify(afterStart)}`);
            }
            await assertFocusContained(page);

            await page.locator('#public-onboarding-finish').click();
            await page.locator('#onboarding-overlay').waitFor({ state: 'detached', timeout: 3000 });
            const completed = await readFirstRunState(page);
            if (completed.onboarded !== '1' || !completed.assistantHidden) {
              throw new Error(`Explicit onboarding completion failed: ${JSON.stringify(completed)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForHome(page);
            await page.waitForTimeout(1600);
            const reloaded = await readFirstRunState(page);
            if (reloaded.overlayPresent || reloaded.onboarded !== '1' || reloaded.activeTour !== null || reloaded.markerCount !== '0') {
              throw new Error(`Completed onboarding was not respected after reload: ${JSON.stringify(reloaded)}`);
            }

            evidence.complete = { initial, afterStart, completed, reloaded, pageErrors };
            await page.screenshot({ path: `${outputDir}/completed-home.png`, fullPage: false });
            await context.close();

            const skipContext = await browser.newContext({ viewport: { width: 768, height: 1024 } });
            const skipPage = await skipContext.newPage();
            const skipErrors = [];
            skipPage.on('pageerror', (error) => skipErrors.push(error.message));
            await skipPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(skipPage);
            await skipPage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await skipPage.keyboard.press('Escape');
            await skipPage.locator('#onboarding-overlay').waitFor({ state: 'detached', timeout: 3000 });
            const skipped = await readFirstRunState(skipPage);
            if (skipped.onboarded !== '1') {
              throw new Error(`Escape skip did not persist explicit skip: ${JSON.stringify(skipped)}`);
            }
            evidence.skip = { skipped, pageErrors: skipErrors };
            await skipContext.close();

            if (pageErrors.length || skipErrors.length) {
              throw new Error(`Browser errors detected: ${JSON.stringify({ pageErrors, skipErrors })}`);
            }

            writeFileSync(`${outputDir}/evidence.json`, JSON.stringify({ status: 'validated', evidence }, null, 2));
            await browser.close();
          })().catch((error) => {
            writeFileSync(`${outputDir}/failure.txt`, String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/home-first-run.log || true
          cat /tmp/home-first-run-evidence/failure.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: home-first-run-browser-evidence
          path: /tmp/home-first-run-evidence
          retention-days: 7
          if-no-files-found: error
