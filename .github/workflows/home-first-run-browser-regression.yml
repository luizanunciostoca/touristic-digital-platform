name: Home First Run Browser Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/home-first-run-browser-regression.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/onboarding/public-interactive-tour.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding-i18n.ts
      - apps/morro-digital-platform/src/runtime/browser-locale.ts
      - apps/morro-digital-platform/src/bootstrap/geospatial.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - apps/morro-digital-platform/public/onboarding-v2.css
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - package.json
      - pnpm-lock.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/home-first-run-browser-regression.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/onboarding/public-interactive-tour.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding-i18n.ts
      - apps/morro-digital-platform/src/runtime/browser-locale.ts
      - apps/morro-digital-platform/src/bootstrap/geospatial.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-run-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/home-first-run-evidence
      - name: Build workspace
        run: pnpm -w build
      - name: Start fallback runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/home-first-run.log 2>&1 &
          echo $! >/tmp/home-first-run.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-first-run.log
          exit 1
      - name: Validate V2 first-run tutorial and persistent composer lifecycle
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const outputDir = '/tmp/home-first-run-evidence';

          async function waitForHome(page) {
            await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-marker-count="0"]').waitFor({
              state: 'attached',
              timeout: 20000,
            });
          }

          async function readState(page) {
            return page.evaluate(() => {
              const assistant = document.getElementById('assistant-messages');
              const welcome = assistant?.querySelector('.message.assistant');
              const map = document.getElementById('map');
              const backdrop = document.getElementById('tour-backdrop');
              const tooltip = document.getElementById('tour-tooltip');
              const tooltipRect = tooltip?.getBoundingClientRect();
              const primaryAction = tooltip?.querySelector('.tour-btn-next, .tour-btn-finish');
              const primaryActionRect = primaryAction?.getBoundingClientRect();
              const primaryActionVisible = Boolean(
                tooltipRect &&
                primaryActionRect &&
                primaryActionRect.width > 0 &&
                primaryActionRect.height > 0 &&
                primaryActionRect.left >= tooltipRect.left - 1 &&
                primaryActionRect.right <= tooltipRect.right + 1 &&
                primaryActionRect.top >= tooltipRect.top - 1 &&
                primaryActionRect.bottom <= tooltipRect.bottom + 1 &&
                primaryActionRect.bottom <= window.innerHeight + 1
              );
              return {
                onboarded: localStorage.getItem('morro-digital-onboarded'),
                onboardingVisible: Boolean(document.querySelector('#onboarding-overlay')),
                tourActive: document.body.classList.contains('tour-active'),
                tourBackdrop: Boolean(backdrop),
                backdropClipPath: backdrop?.style.clipPath ?? '',
                tourHighlight: Boolean(document.getElementById('tour-highlight')),
                tourTooltip: Boolean(tooltip),
                tourLabel: document.querySelector('.tour-step-label')?.textContent?.trim() ?? null,
                mapTourState: map?.getAttribute('data-tour-state') ?? null,
                activeMapTour: map?.getAttribute('data-active-tour') ?? null,
                markerCount: map?.getAttribute('data-map-marker-count') ?? null,
                assistantVisible: Boolean(
                  assistant &&
                  !assistant.classList.contains('hidden') &&
                  assistant.getAttribute('aria-hidden') !== 'true'
                ),
                composerVisible: Boolean(
                  document.getElementById('assistant-input-area')?.getBoundingClientRect().width
                ),
                welcomeVisible: Boolean(welcome),
                welcomeText: welcome?.textContent?.replace(/\s+/g, ' ').trim() ?? '',
                tooltipRight: tooltipRect?.right ?? null,
                targetIdentity:
                  document.querySelector('.tour-target-active')?.id ||
                  document.querySelector('.tour-target-active')?.className ||
                  null,
                targetOverlap: tooltip?.hasAttribute('data-overlaps-target') ?? false,
                targetUnavailable: tooltip?.hasAttribute('data-target-unavailable') ?? false,
                capabilityNote: document.querySelector('.tour-capability-note')?.textContent?.trim() ?? null,
                primaryActionVisible,
                tooltipScrollTop: tooltip?.scrollTop ?? 0,
                viewportWidth: window.innerWidth,
              };
            });
          }

          function assertIdleMap(state, label) {
            if (state.mapTourState !== 'idle' || state.activeMapTour !== null || state.markerCount !== '0') {
              throw new Error(`${label} activated a map tour unexpectedly: ${JSON.stringify(state)}`);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(page);
            await page.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });

            const initial = await readState(page);
            await page.screenshot({ path: `${outputDir}/01-welcome.png`, fullPage: false });
            assertIdleMap(initial, 'Fresh Home');
            if (initial.onboarded !== null || !initial.onboardingVisible || initial.tourActive) {
              throw new Error(`Invalid fresh first-run state: ${JSON.stringify(initial)}`);
            }

            await page.locator('[data-public-onboarding-action="start"]').click();
            await page.locator('body.tour-active').waitFor({ state: 'attached', timeout: 3000 });
            await page.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
            const started = await readState(page);
            assertIdleMap(started, 'Interactive tutorial');
            if (
              started.onboarded !== null ||
              !started.tourActive ||
              !started.tourBackdrop ||
              !started.backdropClipPath.includes('evenodd') ||
              !started.tourHighlight ||
              !started.tourTooltip ||
              started.tourLabel !== 'Step 1 of 6' ||
              started.assistantVisible ||
              !started.composerVisible ||
              !started.welcomeVisible ||
              started.tooltipRight === null ||
              started.tooltipRight > started.viewportWidth + 1 ||
              started.targetIdentity !== 'map-container' ||
              started.targetOverlap ||
              !started.primaryActionVisible
            ) {
              throw new Error(`UX V2 interactive tutorial did not start correctly: ${JSON.stringify(started)}`);
            }
            await page.screenshot({ path: `${outputDir}/02-step-1-map.png`, fullPage: false });

            await page.locator('#toggle-globe-view').focus();
            await page.keyboard.press('Tab');
            const focusTrapped = await page.evaluate(() => {
              const tooltip = document.getElementById('tour-tooltip');
              return Boolean(tooltip && tooltip.contains(document.activeElement));
            });
            if (!focusTrapped) throw new Error('Tutorial modal did not trap keyboard focus.');

            const expectedTargets = [
              ['map-container'],
              ['weather-widget'],
              ['assistant-input-area'],
              ['voiceButton', 'assistant-input-area'],
              ['home-profile-button'],
              ['toggle-globe-view'],
            ];
            const screenshotNames = [
              '02-step-1-map.png',
              '03-step-2-weather.png',
              '04-step-3-composer.png',
              '05-step-4-voice.png',
              '06-step-5-profile.png',
              '07-step-6-map-perspective.png',
            ];
            for (let step = 2; step <= 6; step += 1) {
              await page.locator('.tour-btn-next').click();
              await page.locator('.tour-step-label').filter({ hasText: `Step ${step} of 6` }).waitFor({ state: 'visible', timeout: 3000 });
              const stepState = await readState(page);
              assertIdleMap(stepState, `Tutorial step ${step}`);
              if (
                stepState.tooltipRight !== null &&
                stepState.tooltipRight > stepState.viewportWidth + 1
              ) {
                throw new Error(`Tutorial tooltip overflowed viewport at step ${step}: ${JSON.stringify(stepState)}`);
              }
              if (!expectedTargets[step - 1].includes(stepState.targetIdentity)) {
                throw new Error(`Tutorial step ${step} targeted ${stepState.targetIdentity}, expected one of ${expectedTargets[step - 1].join(', ')}`);
              }
              if (stepState.targetOverlap) {
                throw new Error(`Tutorial tooltip covered actionable target at step ${step}: ${JSON.stringify(stepState)}`);
              }
              if (!stepState.primaryActionVisible) {
                throw new Error(`Tutorial primary action was clipped at step ${step}: ${JSON.stringify(stepState)}`);
              }
              if (stepState.tooltipScrollTop !== 0) {
                throw new Error(`Tutorial coachmark started scrolled at step ${step}: ${JSON.stringify(stepState)}`);
              }
              if (
                step === 4 &&
                stepState.targetUnavailable &&
                !stepState.capabilityNote
              ) {
                throw new Error(`Unavailable voice capability lacked fallback copy: ${JSON.stringify(stepState)}`);
              }
              await page.screenshot({ path: `${outputDir}/${screenshotNames[step - 1]}`, fullPage: false });
            }
            await page.locator('.tour-btn-finish').click();
            await page.locator('#tour-tooltip').waitFor({ state: 'detached', timeout: 3000 });
            const completed = await readState(page);
            assertIdleMap(completed, 'Completed tutorial');
            if (
              completed.onboarded !== '1' ||
              completed.tourActive ||
              completed.tourTooltip ||
              completed.assistantVisible ||
              !completed.composerVisible ||
              !completed.welcomeVisible ||
              !completed.welcomeText.includes('Welcome to Morro Digital')
            ) {
              throw new Error(`Tutorial completion did not preserve the V2 persistent composer state: ${JSON.stringify(completed)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForHome(page);
            await page.waitForTimeout(1600);
            const reloaded = await readState(page);
            assertIdleMap(reloaded, 'Reloaded Home');
            if (
              reloaded.onboardingVisible ||
              reloaded.onboarded !== '1' ||
              reloaded.assistantVisible ||
              !reloaded.composerVisible ||
              !reloaded.welcomeVisible
            ) {
              throw new Error(`V2 Home composer state was not preserved after reload: ${JSON.stringify(reloaded)}`);
            }
            evidence.complete = { initial, started, completed, reloaded, errors };
            await page.screenshot({ path: `${outputDir}/completed-v2-home.png`, fullPage: false });
            await context.close();

            const skipContext = await browser.newContext({ viewport: { width: 768, height: 1024 }, locale: 'en-US' });
            const skipPage = await skipContext.newPage();
            const skipErrors = [];
            skipPage.on('pageerror', error => skipErrors.push(error.message));
            await skipPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(skipPage);
            await skipPage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await skipPage.locator('[data-public-onboarding-action="start"]').click();
            await skipPage.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
            await skipPage.keyboard.press('Escape');
            await skipPage.locator('#tour-tooltip').waitFor({ state: 'detached', timeout: 3000 });
            const skipped = await readState(skipPage);
            assertIdleMap(skipped, 'Escape-skipped tutorial');
            if (skipped.onboarded !== '1' || skipped.tourActive || skipped.assistantVisible || !skipped.composerVisible || !skipped.welcomeVisible) {
              throw new Error(`Tutorial Escape skip did not preserve the V2 composer state: ${JSON.stringify(skipped)}`);
            }
            evidence.skip = { skipped, errors: skipErrors };
            await skipContext.close();

            const overlaySkipContext = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const overlaySkipPage = await overlaySkipContext.newPage();
            await overlaySkipPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(overlaySkipPage);
            await overlaySkipPage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await overlaySkipPage.keyboard.press('Escape');
            await overlaySkipPage.locator('#onboarding-overlay').waitFor({ state: 'detached', timeout: 3000 });
            const overlaySkipped = await readState(overlaySkipPage);
            assertIdleMap(overlaySkipped, 'Escape-skipped onboarding');
            if (overlaySkipped.onboarded !== '1' || overlaySkipped.assistantVisible || !overlaySkipped.composerVisible || !overlaySkipped.welcomeVisible) {
              throw new Error(`Onboarding Escape skip did not preserve the V2 composer state: ${JSON.stringify(overlaySkipped)}`);
            }
            evidence.overlaySkip = overlaySkipped;
            await overlaySkipContext.close();

            const missingTargetContext = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const missingTargetPage = await missingTargetContext.newPage();
            await missingTargetPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(missingTargetPage);
            await missingTargetPage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await missingTargetPage.locator('[data-public-onboarding-action="start"]').click();
            await missingTargetPage.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
            await missingTargetPage.evaluate(() => document.getElementById('weather-widget')?.remove());
            await missingTargetPage.locator('.tour-btn-next').click();
            await missingTargetPage.locator('.tour-step-label').filter({ hasText: 'Step 2 of 6' }).waitFor({ state: 'visible', timeout: 3000 });
            const missingTarget = await readState(missingTargetPage);
            if (
              missingTarget.targetIdentity !== null ||
              !missingTarget.targetUnavailable ||
              !missingTarget.capabilityNote ||
              missingTarget.targetOverlap ||
              !missingTarget.tourActive
            ) {
              throw new Error(`Missing target fallback failed: ${JSON.stringify(missingTarget)}`);
            }
            evidence.missingTarget = missingTarget;
            await missingTargetContext.close();

            const resizeContext = await browser.newContext({ viewport: { width: 430, height: 932 }, locale: 'en-US' });
            const resizePage = await resizeContext.newPage();
            await resizePage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(resizePage);
            await resizePage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await resizePage.locator('[data-public-onboarding-action="start"]').click();
            await resizePage.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
            await resizePage.setViewportSize({ width: 390, height: 700 });
            await resizePage.waitForTimeout(100);
            const resized = await readState(resizePage);
            if (
              resized.tooltipRight === null ||
              resized.tooltipRight > resized.viewportWidth + 1 ||
              resized.targetOverlap
            ) {
              throw new Error(`Viewport recomputation failed: ${JSON.stringify(resized)}`);
            }
            evidence.viewportResize = resized;
            await resizeContext.close();

            const micDeniedContext = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const micDeniedPage = await micDeniedContext.newPage();
            await micDeniedPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForHome(micDeniedPage);
            await micDeniedPage.locator('#onboarding-overlay').waitFor({ state: 'visible', timeout: 5000 });
            await micDeniedPage.evaluate(() => {
              const permissions = navigator.permissions;
              Object.defineProperty(navigator, 'permissions', {
                configurable: true,
                value: {
                  query: async descriptor =>
                    descriptor?.name === 'microphone'
                      ? { state: 'denied', addEventListener() {}, removeEventListener() {} }
                      : permissions.query(descriptor),
                },
              });
              if (!document.getElementById('voiceButton')) {
                const voiceButton = document.createElement('button');
                voiceButton.id = 'voiceButton';
                voiceButton.type = 'button';
                voiceButton.textContent = 'Voice';
                voiceButton.setAttribute('aria-label', 'Send voice message');
                document.getElementById('assistant-input-area')?.appendChild(voiceButton);
              }
            });
            await micDeniedPage.locator('[data-public-onboarding-action="start"]').click();
            await micDeniedPage.locator('#tour-tooltip').waitFor({ state: 'visible', timeout: 3000 });
            for (let step = 2; step <= 4; step += 1) {
              await micDeniedPage.locator('.tour-btn-next').click();
              await micDeniedPage.locator('.tour-step-label').filter({ hasText: `Step ${step} of 6` }).waitFor({ state: 'visible', timeout: 3000 });
            }
            await micDeniedPage.locator('#tour-tooltip[data-target-unavailable]').waitFor({ state: 'visible', timeout: 3000 });
            const micDenied = await readState(micDeniedPage);
            if (
              micDenied.targetIdentity !== 'voiceButton' ||
              !micDenied.targetUnavailable ||
              !micDenied.capabilityNote ||
              micDenied.targetOverlap ||
              !micDenied.primaryActionVisible
            ) {
              throw new Error(`Denied microphone fallback failed: ${JSON.stringify(micDenied)}`);
            }
            evidence.micDenied = micDenied;
            await micDeniedContext.close();

            if (errors.length || skipErrors.length) {
              throw new Error(`Browser errors detected: ${JSON.stringify({ errors, skipErrors })}`);
            }
            writeFileSync(`${outputDir}/evidence.json`, JSON.stringify({ status: 'validated', evidence }, null, 2));
            await browser.close();
          })().catch(error => {
            writeFileSync(`${outputDir}/failure.txt`, String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/home-first-run.log || true
          cat /tmp/home-first-run-evidence/failure.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: home-first-run-browser-evidence
          path: /tmp/home-first-run-evidence
          retention-days: 7
          if-no-files-found: error
