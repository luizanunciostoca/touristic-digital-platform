name: Business Onboarding Browser Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/business-onboarding-browser-contract.yml"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-onboarding-*.ts"
      - "apps/morro-digital-platform/public/business-onboarding.*"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/business/src/onboarding*.ts"
      - "packages/business/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/business-onboarding-browser-contract.yml"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/business-onboarding-*.ts"
      - "apps/morro-digital-platform/public/business-onboarding.*"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/business/src/onboarding*.ts"
      - "packages/business/package.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  onboarding-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start deterministic app origin
        shell: bash
        run: |
          set -euo pipefail
          PORT=4181
          HOST=127.0.0.1
          PORT="$PORT" HOST="$HOST" node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/m56-onboarding-server.log 2>&1 &
          echo $! >/tmp/m56-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent "http://${HOST}:${PORT}/apps/morro-digital-platform/public/business-onboarding.html" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/m56-onboarding-server.log
          exit 1
      - name: Validate onboarding step content and wiring
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = { errors: [], events: [] };
            try {
              const page = await browser.newPage();
              page.on('pageerror', error => evidence.errors.push(error.message));
              await page.exposeFunction('recordM56Event', event => evidence.events.push(event));
              await page.addInitScript(() => {
                for (const name of [
                  'businessTutorialActivityChanged',
                  'businessConversationAbandoned',
                  'businessTutorialLocationCandidate',
                  'businessTutorialLocationResolved',
                  'businessOnboardingDiscoveryResult',
                  'businessOnboardingAssistantResult'
                ]) {
                  window.addEventListener(name, event => {
                    window.recordM56Event({ name, detail: event.detail });
                  });
                }
              });

              await page.goto('http://127.0.0.1:4181/apps/morro-digital-platform/public/business-onboarding.html', { waitUntil: 'domcontentloaded' });
              await page.locator('#businessOnboardingSurface').waitFor({ state: 'visible' });

              const initial = await page.evaluate(() => ({
                active: document.body.classList.contains('md-business-tutorial-active'),
                role: document.querySelector('#businessOnboardingSurface')?.getAttribute('role'),
                modal: document.querySelector('#businessOnboardingSurface')?.getAttribute('aria-modal'),
                title: document.querySelector('#businessOnboardingTitle')?.textContent,
                eyebrow: document.querySelector('#businessOnboardingEyebrow')?.textContent,
                progress: document.querySelector('#businessOnboardingProgress')?.textContent,
                backHidden: document.querySelector('[data-action="back"]')?.hidden,
              }));
              if (!initial.active) throw new Error('Tutorial activity class was not mounted');
              if (initial.role !== 'dialog' || initial.modal !== 'true') throw new Error(`Dialog semantics diverged: ${JSON.stringify(initial)}`);
              if (initial.title !== 'Veja como turistas encontram e escolhem o seu negócio') throw new Error(`Welcome copy diverged: ${initial.title}`);
              if (!initial.progress?.includes('Capítulo 1 de 5')) throw new Error(`Initial progress diverged: ${initial.progress}`);
              if (initial.backHidden !== true) throw new Error('Back button must be hidden on welcome');

              const next = page.locator('[data-action="next"]');
              await next.click();
              await page.getByRole('heading', { name: 'Qual é a categoria principal?' }).waitFor();
              await page.locator('[data-input-value="events"]').click();
              if (await page.locator('[data-input-value="events"]').getAttribute('aria-pressed') !== 'true') throw new Error('Category selection did not persist');

              await next.click();
              await page.getByRole('heading', { name: 'O que melhor diferencia o negócio?' }).waitFor();
              await page.locator('[data-input-value="Sunset"]').click();

              await next.click();
              const nameInput = page.locator('[data-onboarding-input="true"]');
              await nameInput.fill('Toca do Morcego');
              await next.click();

              await page.getByRole('heading', { name: 'Qual resultado você mais deseja?' }).waitFor();
              await page.locator('[data-input-value="events"]').click();
              await next.click();

              await page.getByRole('heading', { name: 'Quem você mais deseja alcançar?' }).waitFor();
              await page.locator('[data-input-value="premium"]').click();
              await next.click();

              await page.getByRole('heading', { name: 'Agora vamos mostrar como um turista encontra Toca do Morcego' }).waitFor();
              await page.locator('[data-runtime-action="location-confirm"]').waitFor({ state: 'visible' });
              await page.locator('[data-runtime-action="location-confirm"]').click();
              await next.click();
              await page.getByRole('heading', { name: 'O turista precisa de ajuda, mas ainda não conhece Toca do Morcego' }).waitFor();

              const foundation = await page.evaluate(() => ({
                title: document.querySelector('#businessOnboardingTitle')?.textContent,
                progress: document.querySelector('#businessOnboardingProgress')?.textContent,
              }));
              if (!foundation.progress?.includes('Capítulo 2 de 5')) throw new Error(`Chapter transition diverged: ${foundation.progress}`);
              if (!evidence.events.some(event => event.name === 'businessTutorialLocationCandidate' && event.detail?.location)) throw new Error('Missing real catalog location candidate event');
              if (!evidence.events.some(event => event.name === 'businessTutorialLocationResolved' && event.detail?.foundExisting === true)) throw new Error('Missing location confirmation event');

              await page.locator('[data-action="skip"]').click();
              await page.locator('#businessOnboardingSurface').waitFor({ state: 'detached' });
              const afterSkip = await page.evaluate(() => ({
                active: document.body.classList.contains('md-business-tutorial-active'),
              }));
              if (afterSkip.active) throw new Error('Tutorial activity class remained after skip');
              if (!evidence.events.some(event => event.name === 'businessTutorialActivityChanged' && event.detail?.active === true)) throw new Error('Missing active lifecycle event');
              if (!evidence.events.some(event => event.name === 'businessTutorialActivityChanged' && event.detail?.active === false)) throw new Error('Missing inactive lifecycle event');
              if (!evidence.events.some(event => event.name === 'businessConversationAbandoned' && event.detail?.reason === 'user_skip')) throw new Error('Missing skip/abandon lifecycle event');
              if (evidence.errors.length) throw new Error(`Browser errors: ${JSON.stringify(evidence.errors)}`);

              Object.assign(evidence, { initial, foundation, afterSkip, result: 'PASS' });
              writeFileSync('/tmp/m56-onboarding-browser-evidence.json', JSON.stringify(evidence, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/m56-onboarding-server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: business-onboarding-browser-evidence
          path: /tmp/m56-onboarding-browser-evidence.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Stop runtime
        if: always()
        run: kill "$(cat /tmp/m56-server.pid)" 2>/dev/null || true