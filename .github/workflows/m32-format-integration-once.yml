name: M32 Format Integration Once

on:
  push:
    branches:
      - feat/assistant-m32-domain-i18n

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m32-domain-i18n
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format integration test
        run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-domain-i18n-integration.test.ts
      - name: Commit formatted test and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m32-format-integration-once.yml
          git add apps/morro-digital-platform/src/assistant/assistant-domain-i18n-integration.test.ts
          git commit -m "test(assistant): format M32 i18n integration coverage"
          git push origin HEAD:feat/assistant-m32-domain-i18n
