name: M51 Format Matrix Once

on:
  push:
    branches:
      - feat/business-m51-dashboard-consumer
    paths:
      - .github/workflows/m51-format-matrix-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m51-dashboard-consumer
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md
      - name: Commit formatted matrix and remove helper
        run: |
          rm .github/workflows/m51-format-matrix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md .github/workflows/m51-format-matrix-once.yml
          git commit -m "style(business): format M51 migration matrix"
          git push origin HEAD:feat/business-m51-dashboard-consumer
