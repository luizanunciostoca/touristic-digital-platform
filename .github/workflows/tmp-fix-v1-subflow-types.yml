name: Temporary Fix V1 Subflow Types

on:
  push:
    branches:
      - fix/v1-assistant-category-subflows-20260915
    paths:
      - .github/workflows/tmp-fix-v1-subflow-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-assistant-category-subflows-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply type-safe repair
        run: node tooling/tmp-fix-v1-subflow-types.mjs
      - name: Format and validate app
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts
          git diff --check
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit type-safe repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
                  apps/morro-digital-platform/src/map/explore-locations-control.ts
          git commit -m 'fix(assistant): preserve V1 subflow literal types'
          git push origin HEAD:fix/v1-assistant-category-subflows-20260915

# Retry after correcting the temporary script anchor.
