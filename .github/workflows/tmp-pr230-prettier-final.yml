name: PR230 Prettier Final

on:
  push:
    branches:
      - wave/control-center-real-data-final-20260921
    paths:
      - ".github/workflows/tmp-pr230-prettier-final.yml"

permissions:
  contents: write

concurrency:
  group: pr230-prettier-final
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wave/control-center-real-data-final-20260921
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final changed test
        run: pnpm exec prettier --write apps/morro-digital-platform/tooling/control-center-real-data-dashboard.test.mjs
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/control-center-real-data-dashboard.test.mjs
          git rm .github/workflows/tmp-pr230-prettier-final.yml
          git commit -m "style(control-center): finalize real-data test formatting"
          git push origin HEAD:wave/control-center-real-data-final-20260921
