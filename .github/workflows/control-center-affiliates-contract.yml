name: Control Center Affiliates Contract

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/control-center-affiliates-contract.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/affiliate-admin-runtime.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/affiliates/**"
      - "packages/auth/**"
      - "services/affiliates/**"
      - "services/auth/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/control-center-affiliates-contract.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/affiliate-admin-runtime.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/affiliates/**"
      - "packages/auth/**"
      - "services/affiliates/**"
      - "services/auth/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: control-center-affiliates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affiliates-admin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: control_center_affiliates_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AFFILIATES_DATABASE_URL: mysql://root@127.0.0.1:3306/control_center_affiliates_contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Affiliates and Auth owner boundaries
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/affiliates build
          pnpm --filter @touristic/affiliates-server build
      - name: Validate Control Center Affiliates orchestration
        run: |
          pnpm --filter @touristic/morro-digital-platform exec vitest run \
            tooling/admin-api.test.mjs \
            tooling/admin-domain-adapters.test.mjs
      - name: Validate Affiliates owner contracts with MySQL
        run: pnpm --filter @touristic/affiliates-server test:integration
