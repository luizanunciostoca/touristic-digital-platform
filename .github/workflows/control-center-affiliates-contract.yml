name: Control Center Affiliates Contract

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-control-center-affiliates-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affiliates-admin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: control_center_affiliates_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AFFILIATES_DATABASE_URL: mysql://root@127.0.0.1:3306/control_center_affiliates_contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - id: ci_command_01
        run: pnpm install --frozen-lockfile
      - name: Build Affiliates and Auth owner boundaries
        id: ci_command_02
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/affiliates build
          pnpm --filter @touristic/affiliates-server build
      - name: Validate Control Center Affiliates orchestration
        id: ci_command_03
        run: |
          pnpm --filter @touristic/morro-digital-platform exec vitest run \
            tooling/admin-api.test.mjs \
            tooling/admin-domain-adapters.test.mjs
      - name: Validate Affiliates owner contracts with MySQL
        id: ci_command_04
        run: pnpm --filter @touristic/affiliates-server test:integration

      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["control-center-affiliates-contract.yml"]'), 'control-center-affiliates-contract.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["control-center-affiliates-contract.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt control-center-affiliates-contract.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-control-center-affiliates-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
