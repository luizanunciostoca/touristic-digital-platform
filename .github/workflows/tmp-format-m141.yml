name: Temporary Format M141

on:
  push:
    branches:
      - feat/payments-m141-verified-webhook

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m141-verified-webhook
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M141 files
        run: |
          pnpm exec prettier --write \
            .github/workflows/payments-verified-webhook-contract.yml \
            apps/morro-digital-platform/tooling/payments-api.mjs \
            apps/morro-digital-platform/tooling/payments-api.test.mjs \
            docs/migration/MASTER-MIGRATION-TRACKER.md \
            docs/migration/PAYMENTS-MIGRATION-MATRIX.md \
            docs/qa/PAYMENTS-M141-EVIDENCE.md \
            packages/financial/src/index.ts \
            README.md \
            services/financial/src/index.ts \
            services/financial/src/mysql-integration.test.ts \
            services/financial/src/mysql-provider-webhook-event-repository.ts \
            services/financial/src/sandbox-webhook-verifier.test.ts \
            services/financial/src/sandbox-webhook-verifier.ts \
            services/financial/src/schema.ts \
            services/financial/src/webhook-http-transport.test.ts \
            services/financial/src/webhook-http-transport.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(payments): format M141 changes"
            git push origin HEAD:feat/payments-m141-verified-webhook
          fi
