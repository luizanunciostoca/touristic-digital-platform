name: Voice Contract Patch Temp

on:
  push:
    branches:
      - test/assistant-voice-browser-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Patch unsupported capability wait
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs')
          text = path.read_text()
          old = '''  await waitForAssistant(page);\n  await page.locator("#configButton").click();\n  const state = await page.evaluate(() => ({\n'''
          new = '''  await waitForAssistant(page);\n  await poll(\n    page,\n    () =>\n      page.evaluate(() => {\n        const panel = document.getElementById("assistantVoiceSettings");\n        const enabled = document.getElementById("assistantVoiceEnabled");\n        const voice = document.getElementById("assistantVoiceSelect");\n        const speed = document.getElementById("assistantVoiceSpeed");\n        const language = document.getElementById("assistantVoiceLanguage");\n        return (\n          panel?.dataset.voiceSupported === "false" &&\n          enabled?.disabled === true &&\n          voice?.disabled === true &&\n          speed?.disabled === true &&\n          language?.disabled === true\n        );\n      }),\n    "unsupported-voice-settings",\n    10000,\n  );\n  await page.locator("#configButton").click();\n  const state = await page.evaluate(() => ({\n'''
          if old not in text:
              raise SystemExit('target snippet not found')
          # only patch unsupported function: use last occurrence
          idx = text.rfind(old)
          text = text[:idx] + text[idx:].replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/voice-contract-patch-temp.yml
          git add apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
          git commit -m "test(assistant): wait for unsupported voice state"
          git push origin HEAD:test/assistant-voice-browser-pass
