name: CRM Platform Auth Integration Contract

on:
  pull_request:
    paths:
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/auth-api.mjs"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/crm/**"
      - "services/auth/**"
      - "services/crm/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/crm-platform-auth-integration-contract.yml"
  push:
    branches:
      - main
    paths:
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/auth-api.mjs"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/crm/**"
      - "services/auth/**"
      - "services/crm/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/crm-platform-auth-integration-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-platform-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-auth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crm-pass
          MYSQL_DATABASE: morro_crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcrm-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Auth and CRM packages
        run: |
          pnpm --filter @touristic/auth-server test
          pnpm --filter @touristic/crm test
          pnpm --filter @touristic/crm-server lint
          pnpm --filter @touristic/crm-server typecheck
          pnpm --filter @touristic/crm-server test
      - name: Build workspace
        run: pnpm -w build
      - name: Validate real cookie/session/origin/CSRF/MySQL contract
        shell: bash
        run: |
          set -euo pipefail
          PORT=4176
          ORIGIN="http://127.0.0.1:${PORT}"
          SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="correct horse battery staple"
          HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 7))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"owner-1",email:"owner@example.com",passwordHash:process.argv[1],role:"owner",businessIds:["toca-do-morcego"]},{id:"viewer-1",email:"viewer@example.com",passwordHash:process.argv[1],role:"viewer",businessIds:["toca-do-morcego"]}]))' "$HASH")

          assert_http() {
            local actual="$1"
            local expected="$2"
            local file="$3"
            local label="$4"
            if [ "$actual" != "$expected" ]; then
              echo "$label expected HTTP $expected but received $actual"
              cat "$file" || true
              echo "--- server log ---"
              cat /tmp/crm-platform-server.log || true
              exit 1
            fi
          }

          DASHBOARD_AUTH_SECRET="$SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          CRM_DATABASE_URL="mysql://root:crm-pass@127.0.0.1:3306/morro_crm" \
          PORT="$PORT" \
          HOST="127.0.0.1" \
          node apps/morro-digital-platform/tooling/dev-server.mjs > /tmp/crm-platform-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/crm-platform-server.log || true' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent "$ORIGIN/runtime-config.js" >/dev/null; then break; fi
            sleep 0.25
          done

          UNAUTH=$(curl --silent --output /tmp/crm-unauth.json --write-out '%{http_code}' "$ORIGIN/api/crm/leads")
          assert_http "$UNAUTH" 401 /tmp/crm-unauth.json unauthenticated-read
          grep -q 'AUTH_REQUIRED' /tmp/crm-unauth.json

          MEETING_UNAUTH=$(curl --silent --output /tmp/meeting-unauth.json --write-out '%{http_code}' "$ORIGIN/api/crm/meetings")
          assert_http "$MEETING_UNAUTH" 401 /tmp/meeting-unauth.json unauthenticated-meeting-read
          grep -q 'AUTH_REQUIRED' /tmp/meeting-unauth.json

          PROPOSAL_UNAUTH=$(curl --silent --output /tmp/proposal-unauth.json --write-out '%{http_code}' "$ORIGIN/api/crm/proposals")
          assert_http "$PROPOSAL_UNAUTH" 401 /tmp/proposal-unauth.json unauthenticated-proposal-read
          grep -q 'AUTH_REQUIRED' /tmp/proposal-unauth.json

          LOGIN=$(curl --silent --output /tmp/owner-login.json --cookie-jar /tmp/owner.cookies --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"owner@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$LOGIN" 200 /tmp/owner-login.json owner-login
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/owner-login.json'))
          open('/tmp/owner-csrf.txt','w').write(data['csrfToken'])
          PY
          OWNER_CSRF=$(cat /tmp/owner-csrf.txt)

          BAD_CSRF=$(curl --silent --output /tmp/crm-bad-csrf.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header 'X-CSRF-Token: wrong' \
            --header 'Content-Type: application/json' --data '{"companyName":"Blocked"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$BAD_CSRF" 403 /tmp/crm-bad-csrf.json invalid-csrf
          grep -q 'INVALID_CSRF' /tmp/crm-bad-csrf.json

          CROSS=$(curl --silent --output /tmp/crm-cross.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header 'Origin: https://evil.example' --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"companyName":"Blocked"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$CROSS" 403 /tmp/crm-cross.json cross-origin
          grep -q 'ORIGIN_DENIED' /tmp/crm-cross.json

          CREATE=$(curl --silent --output /tmp/crm-create.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"companyName":"Toca do Morcego","segment":"events"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$CREATE" 200 /tmp/crm-create.json owner-create
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/crm-create.json'))
          assert data['data']['companyName'] == 'Toca do Morcego'
          assert data['data']['id'] > 0
          open('/tmp/lead-id.txt','w').write(str(data['data']['id']))
          PY
          LEAD_ID=$(cat /tmp/lead-id.txt)

          LIST=$(curl --silent --output /tmp/crm-list.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies "$ORIGIN/api/crm/leads?search=Toca&limit=25&offset=0")
          assert_http "$LIST" 200 /tmp/crm-list.json owner-list
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/crm-list.json'))
          assert len(data['data']) == 1
          assert data['data'][0]['companyName'] == 'Toca do Morcego'
          PY

          MEETING_BAD_CSRF=$(curl --silent --output /tmp/meeting-bad-csrf.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header 'X-CSRF-Token: wrong' \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"title\":\"Blocked\",\"scheduledAt\":\"2026-08-25T17:30:00.000Z\",\"modality\":\"online\"}" \
            "$ORIGIN/api/crm/meetings")
          assert_http "$MEETING_BAD_CSRF" 403 /tmp/meeting-bad-csrf.json meeting-invalid-csrf
          grep -q 'INVALID_CSRF' /tmp/meeting-bad-csrf.json

          MEETING_CREATE=$(curl --silent --output /tmp/meeting-create.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"title\":\"Diagnóstico comercial\",\"scheduledAt\":\"2026-08-25T17:30:00.000Z\",\"modality\":\"in_person\",\"location\":\"Morro de São Paulo\"}" \
            "$ORIGIN/api/crm/meetings")
          assert_http "$MEETING_CREATE" 200 /tmp/meeting-create.json meeting-create
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/meeting-create.json'))
          assert data['data']['title'] == 'Diagnóstico comercial'
          assert data['data']['status'] == 'scheduled'
          assert data['data']['modality'] == 'in_person'
          open('/tmp/meeting-id.txt','w').write(str(data['data']['id']))
          PY
          MEETING_ID=$(cat /tmp/meeting-id.txt)

          MEETING_LIST=$(curl --silent --output /tmp/meeting-list.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies "$ORIGIN/api/crm/meetings?leadId=$LEAD_ID")
          assert_http "$MEETING_LIST" 200 /tmp/meeting-list.json meeting-list
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/meeting-list.json'))
          assert len(data['data']) == 1
          assert data['data'][0]['title'] == 'Diagnóstico comercial'
          PY

          MEETING_UPDATE=$(curl --silent --output /tmp/meeting-update.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"status":"done"}' \
            "$ORIGIN/api/crm/meetings/$MEETING_ID")
          assert_http "$MEETING_UPDATE" 200 /tmp/meeting-update.json meeting-update
          grep -q '"status":"done"' /tmp/meeting-update.json

          PROPOSAL_BAD_CSRF=$(curl --silent --output /tmp/proposal-bad-csrf.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header 'X-CSRF-Token: wrong' \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"title\":\"Blocked\",\"monthlyValue\":\"10.00\"}" \
            "$ORIGIN/api/crm/proposals")
          assert_http "$PROPOSAL_BAD_CSRF" 403 /tmp/proposal-bad-csrf.json proposal-invalid-csrf
          grep -q 'INVALID_CSRF' /tmp/proposal-bad-csrf.json

          PROPOSAL_CREATE=$(curl --silent --output /tmp/proposal-create.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"title\":\"Proposta Comercial — Morro Digital\",\"planName\":\"Plano Essencial\",\"monthlyValue\":\"299.00\",\"setupFee\":\"99.90\",\"trialDays\":14,\"features\":[\"Página personalizada\",\"Mapa interativo\"]}" \
            "$ORIGIN/api/crm/proposals")
          assert_http "$PROPOSAL_CREATE" 200 /tmp/proposal-create.json proposal-create
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/proposal-create.json'))
          assert data['data']['title'] == 'Proposta Comercial — Morro Digital'
          assert data['data']['status'] == 'draft'
          assert data['data']['monthlyValue'] == '299.00'
          open('/tmp/proposal-id.txt','w').write(str(data['data']['id']))
          PY
          PROPOSAL_ID=$(cat /tmp/proposal-id.txt)

          PROPOSAL_LIST=$(curl --silent --output /tmp/proposal-list.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies "$ORIGIN/api/crm/proposals?leadId=$LEAD_ID")
          assert_http "$PROPOSAL_LIST" 200 /tmp/proposal-list.json proposal-list
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/proposal-list.json'))
          assert len(data['data']) == 1
          assert data['data'][0]['title'] == 'Proposta Comercial — Morro Digital'
          assert data['data'][0]['status'] == 'draft'
          PY

          PROPOSAL_SEND=$(curl --silent --output /tmp/proposal-send.json --write-out '%{http_code}' \
            --request POST --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            "$ORIGIN/api/crm/proposals/$PROPOSAL_ID/send")
          assert_http "$PROPOSAL_SEND" 200 /tmp/proposal-send.json proposal-send
          grep -q '"status":"sent"' /tmp/proposal-send.json

          PROPOSAL_RESPOND=$(curl --silent --output /tmp/proposal-respond.json --write-out '%{http_code}' \
            --request POST --cookie /tmp/owner.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"accepted":true}' \
            "$ORIGIN/api/crm/proposals/$PROPOSAL_ID/respond")
          assert_http "$PROPOSAL_RESPOND" 200 /tmp/proposal-respond.json proposal-respond
          grep -q '"status":"accepted"' /tmp/proposal-respond.json

          PROPOSAL_ACCEPTED=$(curl --silent --output /tmp/proposal-accepted.json --write-out '%{http_code}' \
            --cookie /tmp/owner.cookies "$ORIGIN/api/crm/proposals/accepted?leadId=$LEAD_ID")
          assert_http "$PROPOSAL_ACCEPTED" 200 /tmp/proposal-accepted.json proposal-accepted
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/proposal-accepted.json'))
          assert data['data']['status'] == 'accepted'
          assert data['data']['id'] > 0
          PY

          VIEWER_LOGIN=$(curl --silent --output /tmp/viewer-login.json --cookie-jar /tmp/viewer.cookies --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"viewer@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$VIEWER_LOGIN" 200 /tmp/viewer-login.json viewer-login
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/viewer-login.json'))
          open('/tmp/viewer-csrf.txt','w').write(data['csrfToken'])
          PY
          VIEWER_CSRF=$(cat /tmp/viewer-csrf.txt)

          VIEWER_WRITE=$(curl --silent --output /tmp/crm-viewer.json --write-out '%{http_code}' \
            --cookie /tmp/viewer.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $VIEWER_CSRF" \
            --header 'Content-Type: application/json' --data '{"companyName":"Viewer blocked"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$VIEWER_WRITE" 403 /tmp/crm-viewer.json viewer-write
          grep -q 'READ_ONLY_ROLE' /tmp/crm-viewer.json

          MEETING_VIEWER_WRITE=$(curl --silent --output /tmp/meeting-viewer.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/viewer.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $VIEWER_CSRF" \
            --header 'Content-Type: application/json' --data '{"status":"cancelled"}' \
            "$ORIGIN/api/crm/meetings/$MEETING_ID")
          assert_http "$MEETING_VIEWER_WRITE" 403 /tmp/meeting-viewer.json meeting-viewer-write
          grep -q 'READ_ONLY_ROLE' /tmp/meeting-viewer.json

          PROPOSAL_VIEWER_WRITE=$(curl --silent --output /tmp/proposal-viewer.json --write-out '%{http_code}' \
            --cookie /tmp/viewer.cookies --header "Origin: $ORIGIN" --header "X-CSRF-Token: $VIEWER_CSRF" \
            --header 'Content-Type: application/json' \
            --data "{\"leadId\":$LEAD_ID,\"title\":\"Viewer blocked\",\"monthlyValue\":\"10.00\"}" \
            "$ORIGIN/api/crm/proposals")
          assert_http "$PROPOSAL_VIEWER_WRITE" 403 /tmp/proposal-viewer.json proposal-viewer-write
          grep -q 'READ_ONLY_ROLE' /tmp/proposal-viewer.json

          cd services/crm
          LEAD_ID="$LEAD_ID" MEETING_ID="$MEETING_ID" PROPOSAL_ID="$PROPOSAL_ID" node --input-type=module - <<'NODE'
          import mysql from 'mysql2/promise';
          const pool = mysql.createPool('mysql://root:crm-pass@127.0.0.1:3306/morro_crm');
          const [leads] = await pool.query('SELECT company_name, assigned_to_subject, stage FROM crm_leads');
          if (leads.length !== 1 || leads[0].company_name !== 'Toca do Morcego' || leads[0].assigned_to_subject !== 'owner-1' || leads[0].stage !== 'contract_sent') process.exit(1);
          const [meetings] = await pool.query('SELECT lead_id, title, status, created_by_subject FROM crm_meetings WHERE id = ?', [Number(process.env.MEETING_ID)]);
          if (meetings.length !== 1 || meetings[0].lead_id !== Number(process.env.LEAD_ID) || meetings[0].title !== 'Diagnóstico comercial' || meetings[0].status !== 'done' || meetings[0].created_by_subject !== 'owner-1') process.exit(1);
          const [proposals] = await pool.query('SELECT lead_id, title, status, created_by_subject, share_token FROM crm_proposals WHERE id = ?', [Number(process.env.PROPOSAL_ID)]);
          if (proposals.length !== 1 || proposals[0].lead_id !== Number(process.env.LEAD_ID) || proposals[0].title !== 'Proposta Comercial — Morro Digital' || proposals[0].status !== 'accepted' || proposals[0].created_by_subject !== 'owner-1') process.exit(1);
          if (typeof proposals[0].share_token !== 'string' || proposals[0].share_token.length < 16 || proposals[0].share_token.length > 64) process.exit(1);
          const [meetingInteractions] = await pool.query("SELECT type, actor_subject FROM crm_interactions WHERE lead_id = ? AND type = 'meeting'", [Number(process.env.LEAD_ID)]);
          if (meetingInteractions.length < 1 || meetingInteractions[0].actor_subject !== 'owner-1') process.exit(1);
          const [proposalInteractions] = await pool.query("SELECT type, actor_subject FROM crm_interactions WHERE lead_id = ? AND type = 'proposal'", [Number(process.env.LEAD_ID)]);
          if (proposalInteractions.length < 3 || proposalInteractions.some((row) => row.actor_subject !== 'owner-1')) process.exit(1);
          const [audits] = await pool.query("SELECT operation, reason, actor_subject FROM crm_audit_events WHERE reason = 'read_only_role'");
          if (!audits.some((row) => row.actor_subject === 'viewer-1' && row.operation === 'meeting.update')) process.exit(1);
          if (!audits.some((row) => row.actor_subject === 'viewer-1' && row.operation === 'proposal.create')) process.exit(1);
          await pool.end();
          NODE
