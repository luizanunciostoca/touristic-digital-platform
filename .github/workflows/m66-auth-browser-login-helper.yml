name: M66 auth browser login helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/auth-m66-login-surface-parity
    paths:
      - ".github/workflows/m66-auth-browser-login-helper.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-m66-login-surface-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and format Auth browser login patch
        run: |
          python3 .github/scripts/m66-auth-browser-login-patch.py
          pnpm exec prettier --write packages/auth-browser/src/index.ts packages/auth-browser/src/index.test.ts apps/morro-digital-platform/src/business-login-entry.ts dashboard/login.html dashboard/login.css dashboard/index-v3-improved.html
      - name: Validate M66 login patch
        run: |
          pnpm --filter @touristic/auth-browser lint
          pnpm --filter @touristic/auth-browser typecheck
          pnpm --filter @touristic/auth-browser test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm -w build
      - name: Commit permanent code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/auth-browser/src/index.ts packages/auth-browser/src/index.test.ts apps/morro-digital-platform/src/business-login-entry.ts dashboard/login.html dashboard/login.css dashboard/index-v3-improved.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(auth): port M66 Business login surface"
          git push origin HEAD:feat/auth-m66-login-surface-parity
