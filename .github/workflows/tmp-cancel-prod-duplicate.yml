name: Temporary Cancel Duplicate Production Run

on:
  push:
    branches:
      - ops/cancel-prod-duplicate-c5597ea6-20260924

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate pending production run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36035767403" --jq '.status')"
          if [ "$status" != "completed" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/36035767403/cancel"
          fi
