name: Temporary Prettier Diagnostic

on:
  push:
    branches: [fix/control-center-admin-mutation-rate-limit-20260927]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/tooling/admin-api.mjs
          git diff -- apps/morro-digital-platform/tooling/admin-api.mjs
