name: M57 Format Validate Once

on:
  push:
    branches:
      - feat/business-m57-onboarding-route-parity
    paths:
      - ".github/workflows/m57-format-validate-once.yml"

permissions:
  contents: write

jobs:
  format-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m57-onboarding-route-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M57 files
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/src/business-onboarding-adapters.ts
          apps/morro-digital-platform/src/business-onboarding-adapters.test.ts
          apps/morro-digital-platform/src/business-onboarding-runtime.ts
      - name: Validate app
        run: |
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
      - name: Commit formatted files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m57-format-validate-once.yml
          git add apps/morro-digital-platform/src/business-onboarding-adapters.ts \
            apps/morro-digital-platform/src/business-onboarding-adapters.test.ts \
            apps/morro-digital-platform/src/business-onboarding-runtime.ts \
            .github/workflows/m57-format-validate-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(business): normalize M57 route implementation"
          git push origin HEAD:feat/business-m57-onboarding-route-parity
