name: M62 integration helper
on:
  push:
    branches: [feat/business-m62-commercial-browser-lifecycle]
    paths: [.github/workflows/m62-integration-helper.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m62-commercial-browser-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply M62 browser lifecycle integration
        run: |
          python <<'PY'
          from pathlib import Path

          runtime = Path('apps/morro-digital-platform/src/business-onboarding-runtime.ts')
          text = runtime.read_text()
          old = '  | "workspace-open-dashboard"\n  | `workspace-promotion-save:${string}`;'
          new = '  | "workspace-open-dashboard"\n  | `workspace-promotion-save:${string}`\n  | `commercial-prepare-checkout:${string}`;'
          if old not in text: raise SystemExit('runtime action marker missing')
          text = text.replace(old, new, 1)
          marker = '    if (action.startsWith("workspace-promotion-save:")) {\n'
          insertion = '''    if (action.startsWith("commercial-prepare-checkout:")) {\n      let input: Record<string, unknown>;\n      try {\n        input = JSON.parse(\n          decodeURIComponent(action.slice("commercial-prepare-checkout:".length)),\n        ) as Record<string, unknown>;\n      } catch {\n        return false;\n      }\n      const snapshot = this.host.snapshot();\n      const context = snapshot.session.conversationDraft.context;\n      const {\n        buildBusinessCommercialAcceptances,\n        buildBusinessCommercialCheckoutHandoff,\n        buildBusinessCommercialContractor,\n        recommendBusinessCommercialPlan,\n      } = await import("@touristic/business/onboarding-commercial-conversion");\n      const contractorInput = isRecord(input.contractor) ? input.contractor : {};\n      const contractor = buildBusinessCommercialContractor(contractorInput);\n      const acceptedTerms = buildBusinessCommercialAcceptances(\n        {\n          terms: input.acceptTerms === true,\n          privacy: input.acceptPrivacy === true,\n          marketing: input.marketingConsent === true,\n        },\n        new Date().toISOString(),\n      );\n      const recommendedPlan = recommendBusinessCommercialPlan(context.objective);\n      const planId = text(input.selectedPlanId) || recommendedPlan?.id || "";\n      const handoff = buildBusinessCommercialCheckoutHandoff({\n        sessionId: `business-onboarding:${snapshot.session.createdAt}`,\n        planId,\n        contractor,\n        acceptedTerms,\n        businessDraft: { ...snapshot.session.businessDraft },\n        returnUrl: this.view.location.href,\n      });\n      if (!handoff) return false;\n      this.host.updateRuntimeContext({ businessCommercialCheckoutHandoff: handoff });\n      dispatch(this.view, "businessCheckoutRequested", handoff);\n      dispatch(this.view, "businessCommercialCheckoutPrepared", {\n        planId: handoff.planId,\n        requiresPaymentsCapability: true,\n        tutorial: false,\n      });\n      return true;\n    }\n\n'''
          if marker not in text: raise SystemExit('runtime insertion marker missing')
          text = text.replace(marker, insertion + marker, 1)
          method_marker = '  private async verifyRoute(\n'
          method = '''  async verifyPayment(\n    detail: Readonly<Record<string, unknown>>,\n  ): Promise<boolean> {\n    const snapshot = this.host.snapshot();\n    const { acceptBusinessCommercialVerifiedPayment } =\n      await import("@touristic/business/onboarding-commercial-conversion");\n    const activation = acceptBusinessCommercialVerifiedPayment(\n      `business-onboarding:${snapshot.session.createdAt}`,\n      detail,\n    );\n    if (!activation) return false;\n    this.host.updateRuntimeContext({ businessCommercialActivation: activation });\n    dispatch(this.view, "businessCommercialActivationReady", {\n      ...activation,\n      verifiedByPaymentsBoundary: true,\n      tutorial: false,\n    });\n    return true;\n  }\n\n'''
          if method_marker not in text: raise SystemExit('runtime method marker missing')
          runtime.write_text(text.replace(method_marker, method + method_marker, 1))

          context = Path('packages/business/src/onboarding-context.ts')
          text = context.read_text()
          old = '  "businessTutorialWorkspace",\n]);'
          new = '  "businessTutorialWorkspace",\n  "businessCommercialCheckoutHandoff",\n  "businessCommercialActivation",\n]);'
          if old not in text: raise SystemExit('context allowlist marker missing')
          context.write_text(text.replace(old, new, 1))

          surface = Path('apps/morro-digital-platform/src/business-onboarding-surface.ts')
          text = surface.read_text()
          submit_marker = '''      if (\n        !(form instanceof HTMLFormElement) ||\n        form.dataset.workspacePromotion !== "true"\n      )\n        return;\n      event.preventDefault();\n      const data = new FormData(form);\n      const payload = {\n        title: data.get("title"),\n        description: data.get("description"),\n        cta: data.get("cta"),\n        validUntil: data.get("validUntil"),\n      };\n      void this.handleRuntimeAction(\n        `workspace-promotion-save:${encodeURIComponent(JSON.stringify(payload))}`,\n      );\n'''
          replacement = '''      if (!(form instanceof HTMLFormElement)) return;\n      if (form.dataset.workspacePromotion === "true") {\n        event.preventDefault();\n        const data = new FormData(form);\n        const payload = {\n          title: data.get("title"),\n          description: data.get("description"),\n          cta: data.get("cta"),\n          validUntil: data.get("validUntil"),\n        };\n        void this.handleRuntimeAction(\n          `workspace-promotion-save:${encodeURIComponent(JSON.stringify(payload))}`,\n        );\n        return;\n      }\n      if (form.dataset.commercialConversion === "true") {\n        event.preventDefault();\n        const data = new FormData(form);\n        const payload = {\n          selectedPlanId: data.get("planId"),\n          contractor: {\n            name: data.get("name"),\n            email: data.get("email"),\n            phone: data.get("phone"),\n            document: data.get("document"),\n          },\n          acceptTerms: data.get("terms") === "on",\n          acceptPrivacy: data.get("privacy") === "on",\n          marketingConsent: data.get("marketing") === "on",\n        };\n        void this.handleRuntimeAction(\n          `commercial-prepare-checkout:${encodeURIComponent(JSON.stringify(payload))}`,\n        );\n      }\n'''
          if submit_marker not in text: raise SystemExit('surface submit marker missing')
          text = text.replace(submit_marker, replacement, 1)
          form_marker = '  private renderRuntimeActions(\n'
          form_method = '''  private renderCommercialForm(\n    container: HTMLElement,\n    snapshot: BusinessOnboardingHostSnapshot,\n  ): void {\n    const context = snapshot.session.conversationDraft.context;\n    if (objectValue(context.businessCommercialCheckoutHandoff)) {\n      const notice = this.document.createElement("p");\n      notice.className = "business-onboarding-runtime-note";\n      notice.textContent =\n        "Cadastro comercial preparado. O pagamento só pode ser executado e confirmado pelo serviço seguro de Payments.";\n      container.append(notice);\n      return;\n    }\n    const form = this.document.createElement("form");\n    form.dataset.commercialConversion = "true";\n    form.className = "business-onboarding-commercial-form";\n    form.innerHTML = `<fieldset><legend>Plano</legend><label><input type="radio" name="planId" value="essential"> Essencial</label><label><input type="radio" name="planId" value="growth"> Crescimento</label><label><input type="radio" name="planId" value="performance"> Performance</label></fieldset><label>Nome completo<input name="name" autocomplete="name" maxlength="160" required></label><label>E-mail<input name="email" type="email" autocomplete="email" maxlength="200" required></label><label>Telefone/WhatsApp<input name="phone" autocomplete="tel" maxlength="80" required></label><label>CPF ou CNPJ<input name="document" maxlength="80" required></label><label><input type="checkbox" name="terms" required> Li e aceito os Termos de Parceria.</label><label><input type="checkbox" name="privacy" required> Li e aceito a Política de Privacidade.</label><label><input type="checkbox" name="marketing"> Autorizo comunicações comerciais (opcional).</label><p class="business-onboarding-runtime-note">Nenhum pagamento é executado nesta tela. Ao continuar, o Business prepara somente o handoff para Payments.</p><button type="submit" class="business-onboarding-runtime-action is-primary">Preparar pagamento seguro</button>`;\n    container.append(form);\n  }\n\n'''
          if form_marker not in text: raise SystemExit('surface method marker missing')
          text = text.replace(form_marker, form_method + form_marker, 1)
          finish_marker = '    } else if (snapshot.stepId === "route") {\n'
          finish_insert = '    } else if (snapshot.stepId === "finish") {\n      this.renderCommercialForm(container, snapshot);\n'
          if finish_marker not in text: raise SystemExit('finish render marker missing')
          surface.write_text(text.replace(finish_marker, finish_insert + finish_marker, 1))

          entry = Path('apps/morro-digital-platform/src/business-onboarding-entry.ts')
          text = entry.read_text()
          old = '''  runtime = new BusinessOnboardingRuntime(host, adapters, window);\n\n  mountBusinessOnboardingSurface({\n'''
          new = '''  runtime = new BusinessOnboardingRuntime(host, adapters, window);\n  window.addEventListener("businessPaymentVerified", (event) => {\n    if (!(event instanceof CustomEvent) || !runtime) return;\n    const detail =\n      event.detail && typeof event.detail === "object"\n        ? (event.detail as Record<string, unknown>)\n        : {};\n    void runtime.verifyPayment(detail);\n  });\n\n  mountBusinessOnboardingSurface({\n'''
          if old not in text: raise SystemExit('entry marker missing')
          entry.write_text(text.replace(old, new, 1))

          html = Path('apps/morro-digital-platform/public/business-onboarding.html')
          text = html.read_text()
          anchor = '"@touristic/business/onboarding-workspace": "/packages/business/dist/onboarding-workspace.js",'
          replacement = anchor + '\n          "@touristic/business/onboarding-commercial-conversion": "/packages/business/dist/onboarding-commercial-conversion.js",'
          if anchor not in text: raise SystemExit('import map marker missing')
          html.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Add permanent Chromium contract
        run: |
          cat > .github/workflows/business-onboarding-commercial-browser-contract.yml <<'YAML'
          name: Business Onboarding Commercial Browser Contract
          on:
            workflow_dispatch:
            pull_request:
              paths:
                - ".github/workflows/business-onboarding-commercial-browser-contract.yml"
                - "apps/morro-digital-platform/src/business-onboarding-*.ts"
                - "apps/morro-digital-platform/public/business-onboarding.*"
                - "packages/business/src/onboarding-commercial*.ts"
                - "packages/business/src/onboarding-context*.ts"
                - "packages/business/package.json"
            push:
              branches: [main]
              paths:
                - ".github/workflows/business-onboarding-commercial-browser-contract.yml"
                - "apps/morro-digital-platform/src/business-onboarding-*.ts"
                - "apps/morro-digital-platform/public/business-onboarding.*"
                - "packages/business/src/onboarding-commercial*.ts"
                - "packages/business/src/onboarding-context*.ts"
                - "packages/business/package.json"
          permissions:
            contents: read
          jobs:
            onboarding-commercial-browser:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - name: Install deterministic Chromium
                  run: |
                    npm install --prefix /tmp/pw --no-save playwright@1.54.2
                    /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
                - run: pnpm -w build
                - name: Start deterministic module origin
                  run: |
                    PORT=4185 HOST=127.0.0.1 node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/m62-commercial-server.log 2>&1 &
                    echo $! >/tmp/m62-commercial-server.pid
                    for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4185/runtime-config.js >/dev/null && exit 0; sleep .25; done
                    cat /tmp/m62-commercial-server.log; exit 1
                - name: Validate commercial browser lifecycle
                  run: |
                    node <<'NODE'
                    const { writeFileSync } = require('node:fs');
                    const { chromium } = require('/tmp/pw/node_modules/playwright');
                    (async () => {
                      const browser = await chromium.launch({headless:true});
                      const evidence = {events:[], errors:[]};
                      try {
                        const page = await browser.newPage();
                        page.on('pageerror', e => evidence.errors.push(e.message));
                        await page.exposeFunction('recordM62Event', e => evidence.events.push(e));
                        await page.goto('http://127.0.0.1:4185/runtime-config.js');
                        await page.evaluate(() => { document.open(); document.write(`<!doctype html><html><head><script type="importmap">${JSON.stringify({imports:{'@touristic/business/onboarding':'/packages/business/dist/onboarding.js','@touristic/business/onboarding-host':'/packages/business/dist/onboarding-host.js','@touristic/business/onboarding-presentation':'/packages/business/dist/onboarding-presentation.js','@touristic/business/onboarding-recommendation':'/packages/business/dist/onboarding-recommendation.js','@touristic/business/onboarding-steps':'/packages/business/dist/onboarding-steps.js','@touristic/business/onboarding-workspace':'/packages/business/dist/onboarding-workspace.js','@touristic/business/onboarding-commercial-conversion':'/packages/business/dist/onboarding-commercial-conversion.js'}})}<\/script></head><body><main id="root"></main></body></html>`); document.close(); });
                        const result = await page.evaluate(async () => {
                          for (const name of ['businessCheckoutRequested','businessCommercialCheckoutPrepared','businessCommercialActivationReady']) window.addEventListener(name,e=>window.recordM62Event({name,detail:e.detail}));
                          const onboarding = await import('/packages/business/dist/onboarding.js');
                          const hostModule = await import('/packages/business/dist/onboarding-host.js');
                          const runtimeModule = await import('/apps/morro-digital-platform/dist/business-onboarding-runtime.js');
                          const surfaceModule = await import('/apps/morro-digital-platform/dist/business-onboarding-surface.js');
                          const base = onboarding.createBusinessOnboardingSession({context:{businessName:'Toca do Morcego',category:'events',specialty:'Sunset',objective:'events'}}, new Date('2026-08-11T12:00:00.000Z'));
                          const finish = onboarding.transitionBusinessOnboarding(base,'finish',{reason:'m62-contract'});
                          const host = new hostModule.BusinessOnboardingHostController({session:finish});
                          const adapters={discovery:{searchBusiness:async()=>[]},location:{findExistingLocation:async()=>null,requestDeviceLocation:async()=>null},assistant:{ask:async()=>({})},route:{showRoute:async()=>({success:false,code:'NOT_USED',distanceMeters:0,durationSeconds:0,route:null,tutorial:true,excludeFromBusinessMetrics:true})}};
                          const runtime = new runtimeModule.BusinessOnboardingRuntime(host,adapters,window);
                          const surface = new surfaceModule.BusinessOnboardingSurface({document,host,onRuntimeAction:a=>runtime.handleAction(a)});
                          surface.mount(document.querySelector('#root'));
                          const form=document.querySelector('[data-commercial-conversion="true"]'); if(!form) throw new Error('commercial form missing');
                          form.querySelector('[name="name"]').value='<Luiz> Silva'; form.querySelector('[name="email"]').value=' LUIZ@example.com '; form.querySelector('[name="phone"]').value='75999999999'; form.querySelector('[name="document"]').value='12345678900'; form.querySelector('[name="terms"]').checked=true; form.querySelector('[name="privacy"]').checked=true;
                          form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); await new Promise(r=>setTimeout(r,50));
                          const handoff=host.snapshot().session.conversationDraft.context.businessCommercialCheckoutHandoff;
                          const wrong=await runtime.verifyPayment({verified:true,sessionId:'wrong',reference:'pay-wrong'});
                          const unverified=await runtime.verifyPayment({verified:false,sessionId:handoff?.sessionId,reference:'pay-no'});
                          const valid=await runtime.verifyPayment({verified:true,sessionId:handoff?.sessionId,reference:'<pay-1>',definitiveBusinessId:'business-1'});
                          const activation=host.snapshot().session.conversationDraft.context.businessCommercialActivation;
                          return {formText:form.textContent||'',handoff,wrong,unverified,valid,activation};
                        });
                        if(result.handoff?.planId!=='performance') throw new Error(`recommendation mismatch ${JSON.stringify(result.handoff)}`);
                        if(result.handoff?.contractor?.name!=='Luiz Silva'||result.handoff?.contractor?.email!=='luiz@example.com') throw new Error(`contractor mismatch ${JSON.stringify(result.handoff)}`);
                        if(result.handoff?.requiresPaymentsCapability!==true||result.handoff?.tutorial!==false) throw new Error('payments boundary mismatch');
                        if('paymentStatus' in (result.handoff||{})||'checkoutUrl' in (result.handoff||{})||'publicToken' in (result.handoff||{})) throw new Error('handoff contains payment execution state');
                        if(!result.formText.includes('Nenhum pagamento é executado nesta tela')) throw new Error('ownership disclosure missing');
                        if(result.wrong!==false||result.unverified!==false||result.valid!==true) throw new Error('verification gate mismatch');
                        if(result.activation?.paymentStatus!=='CONFIRMED'||result.activation?.paymentReference!=='pay-1') throw new Error(`activation mismatch ${JSON.stringify(result.activation)}`);
                        const activations=evidence.events.filter(e=>e.name==='businessCommercialActivationReady'); if(activations.length!==1||activations[0].detail?.verifiedByPaymentsBoundary!==true) throw new Error(`activation events mismatch ${JSON.stringify(activations)}`);
                        if(evidence.errors.length) throw new Error(`browser errors ${JSON.stringify(evidence.errors)}`);
                        Object.assign(evidence,{result,status:'PASS'}); writeFileSync('/tmp/m62-commercial-evidence.json',JSON.stringify(evidence,null,2));
                      } finally { await browser.close(); }
                    })().catch(e=>{console.error(e);process.exit(1)});
                    NODE
                - if: failure()
                  run: cat /tmp/m62-commercial-server.log || true
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: business-onboarding-commercial-browser-evidence
                    path: /tmp/m62-commercial-evidence.json
                    retention-days: 1
                    if-no-files-found: ignore
                - if: always()
                  run: kill "$(cat /tmp/m62-commercial-server.pid)" 2>/dev/null || true
          YAML
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/src/business-onboarding-entry.ts apps/morro-digital-platform/public/business-onboarding.html packages/business/src/onboarding-context.ts .github/workflows/business-onboarding-commercial-browser-contract.yml
      - run: pnpm --filter @touristic/business lint && pnpm --filter @touristic/business typecheck && pnpm --filter @touristic/business test && pnpm --filter @touristic/morro-digital-platform typecheck && pnpm --filter @touristic/morro-digital-platform test && pnpm -w build
      - name: Commit validated M62 integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform packages/business/src/onboarding-context.ts .github/workflows/business-onboarding-commercial-browser-contract.yml
          git commit -m "feat(business): integrate M62 commercial browser lifecycle" || exit 0
          git push
