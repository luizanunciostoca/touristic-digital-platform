name: Format NAV-02 Temp

on:
  push:
    branches:
      - feat/navigation-routing-core
    paths:
      - .github/workflows/navigation-nav02-format-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-routing-core
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatter output
        run: pnpm exec prettier --write packages/navigation/src/routing.ts packages/navigation/src/routing.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/navigation/src/routing.ts packages/navigation/src/routing.test.ts
          git commit -m "style: format NAV-02 sources"
          git push origin HEAD:feat/navigation-routing-core
