name: EGF Construction Format Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/egf-construction-format-once.yml"
      - ".morro/changesets/MD-EGF-CONSTRUCTION.json"

permissions:
  contents: write

concurrency:
  group: egf-construction-format-once-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-once:
    if: github.event.pull_request.head.ref == 'feat/experience-growth-fabric-isolated-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install canonical workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Normalize construction ChangeSet formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write ".morro/changesets/MD-EGF-CONSTRUCTION.json"
          git rm ".github/workflows/egf-construction-format-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".morro/changesets/MD-EGF-CONSTRUCTION.json"
          git commit -m "style(growth): format construction ChangeSet"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
