name: M27 Clean Cache
on:
  push:
    branches: [feat/assistant-m27-llm-boundary]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove generated cache and temporary workflow
        run: |
          rm -rf .turbo/cache
          rm .github/workflows/m27-clean-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove generated turbo cache'
          git push
