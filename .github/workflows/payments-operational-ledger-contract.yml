name: Payments Operational Ledger Contract

on:
  push:
    branches:
      - main
    paths:
      - "packages/auth/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "apps/morro-digital-platform/tooling/payments-api.mjs"
      - ".github/workflows/payments-operational-ledger-contract.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/auth/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "apps/morro-digital-platform/tooling/payments-api.mjs"
      - ".github/workflows/payments-operational-ledger-contract.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m143-ledger
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm143-ledger"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m143-ledger@127.0.0.1:3306/mysql
      FINANCIAL_DATABASE_URL: mysql://root:m143-ledger@127.0.0.1:3306/financial_m137_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verified accounting unit and recovery contracts
        run: pnpm --filter @touristic/financial-server test
      - name: Approval and reversal MySQL integration
        run: pnpm --filter @touristic/financial-server test:integration
      - name: Build composed Financial runtime
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/ordering build
          pnpm --filter @touristic/financial-server build
          pnpm --filter @touristic/ordering-server build
