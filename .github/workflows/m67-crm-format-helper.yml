name: M67 CRM format helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-m67-baseline-inventory
    paths:
      - ".github/workflows/m67-crm-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m67-baseline-inventory
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M67 docs
        run: pnpm exec prettier --write docs/migration/CRM-V1-BASELINE.md docs/migration/CRM-MIGRATION-MATRIX.md docs/qa/CRM-M67-EVIDENCE.md
      - name: Verify formatting
        run: pnpm exec prettier --check docs/migration/CRM-V1-BASELINE.md docs/migration/CRM-MIGRATION-MATRIX.md docs/qa/CRM-M67-EVIDENCE.md
      - name: Commit permanent docs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/CRM-V1-BASELINE.md docs/migration/CRM-MIGRATION-MATRIX.md docs/qa/CRM-M67-EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(crm): format M67 baseline docs"
          git push origin HEAD:feat/crm-m67-baseline-inventory
