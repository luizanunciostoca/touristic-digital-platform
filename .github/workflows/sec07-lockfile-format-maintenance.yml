name: SEC07 Lockfile Format Maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  format-lockfile:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format canonical lockfile
        run: pnpm exec prettier --write pnpm-lock.yaml

      - name: Commit formatted lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already formatted"
            exit 0
          fi
          git diff --check -- pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): format remediated lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
