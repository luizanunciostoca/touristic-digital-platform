name: Temporary Apply V1 Post Detail And Popup

on:
  push:
    branches:
      - fix/v1-assistant-category-subflows-20260915
    paths:
      - .github/workflows/tmp-apply-v1-postdetail-popup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-assistant-category-subflows-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic V1 parity patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path: str, before: str, after: str, label: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor for {label}, found {count}")
              file.write_text(source.replace(before, after, 1))

          patch(
              "packages/geospatial/src/provider.ts",
              """export interface MapMarker {
            readonly id: string;
            readonly position: Coordinates;
            readonly label?: string;
          }""",
              """export interface MapMarker {
            readonly id: string;
            readonly position: Coordinates;
            readonly label?: string;
            readonly openPopup?: boolean;
          }""",
              "MapMarker openPopup",
          )

          patch(
              "packages/geospatial/src/adapters/mapbox.ts",
              """  createMarker(input: {
            readonly id: string;
            readonly label?: string;
          }): MapboxMarkerHandle;""",
              """  createMarker(input: {
            readonly id: string;
            readonly label?: string;
            readonly openPopup?: boolean;
          }): MapboxMarkerHandle;""",
              "driver marker input",
          )
          patch(
              "packages/geospatial/src/adapters/mapbox.ts",
              """        const handle = options.driver.createMarker({
                  id: marker.id,
                  ...(marker.label ? { label: marker.label } : {}),
                });""",
              """        const handle = options.driver.createMarker({
                  id: marker.id,
                  ...(marker.label ? { label: marker.label } : {}),
                  ...(marker.openPopup ? { openPopup: true } : {}),
                });""",
              "pass openPopup",
          )

          patch(
              "packages/geospatial/src/infrastructure/mapbox-gl-driver.ts",
              """export interface MapboxGlMapLike {
            setCenter(center: [number, number]): void;
            remove(): void;""",
              """export interface MapboxGlMapLike {
            setCenter(center: [number, number]): void;
            setZoom?(zoom: number): void;
            getZoom?(): number;
            getCenter?(): Readonly<{ lng: number; lat: number }>;
            flyTo?(options: {
              readonly center: [number, number];
              readonly zoom?: number;
              readonly duration?: number;
              readonly essential?: boolean;
            }): void;
            remove(): void;""",
              "map camera compatibility",
          )
          patch(
              "packages/geospatial/src/infrastructure/mapbox-gl-driver.ts",
              """export interface MapboxGlMarkerLike {
            setLngLat(coordinates: [number, number]): MapboxGlMarkerLike;
            addTo(map: MapboxGlMapLike): MapboxGlMarkerLike;
            remove(): void;
          }""",
              """export interface MapboxGlPopupLike {
            setText(text: string): MapboxGlPopupLike;
          }

          export interface MapboxGlMarkerLike {
            setLngLat(coordinates: [number, number]): MapboxGlMarkerLike;
            setPopup?(popup: MapboxGlPopupLike): MapboxGlMarkerLike;
            togglePopup?(): MapboxGlMarkerLike;
            addTo(map: MapboxGlMapLike): MapboxGlMarkerLike;
            remove(): void;
          }""",
              "marker popup compatibility",
          )
          patch(
              "packages/geospatial/src/infrastructure/mapbox-gl-driver.ts",
              """  Marker: new (options?: {
            readonly element?: HTMLElement;
            readonly anchor?: string;
          }) => MapboxGlMarkerLike;
          }""",
              """  Marker: new (options?: {
            readonly element?: HTMLElement;
            readonly anchor?: string;
          }) => MapboxGlMarkerLike;
            Popup?: new (options?: { readonly closeButton?: boolean }) => MapboxGlPopupLike;
          }""",
              "Popup constructor",
          )
          patch(
              "packages/geospatial/src/infrastructure/mapbox-gl-driver.ts",
              """      const marker = new options.sdk.Marker(
                element ? { element, anchor: \"bottom\" } : undefined,
              );

              const handle: MapboxMarkerHandle = Object.freeze({""",
              """      const marker = new options.sdk.Marker(
                element ? { element, anchor: \"bottom\" } : undefined,
              );
              if (input.label && options.sdk.Popup && marker.setPopup) {
                const popup = new options.sdk.Popup({ closeButton: false });
                marker.setPopup(popup.setText(input.label));
              }

              const handle: MapboxMarkerHandle = Object.freeze({""",
              "attach safe popup",
          )
          patch(
              "packages/geospatial/src/infrastructure/mapbox-gl-driver.ts",
              """          marker.addTo(nativeMap);
                    return handle;""",
              """          marker.addTo(nativeMap);
                    if (input.openPopup) marker.togglePopup?.();
                    return handle;""",
              "open selected popup",
          )

          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """  renderAssistantDomOptions,
          } from \"./assistant-dom-view.js\";""",
              """  renderAssistantDomOptions,
            type AssistantDomOption,
          } from \"./assistant-dom-view.js\";""",
              "AssistantDomOption import",
          )
          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """function resolveStorage(
            document: Document,""",
              """function readOptionOverride(value: unknown): readonly AssistantDomOption[] | null {
            if (!Array.isArray(value) || value.length === 0) return null;
            const result: AssistantDomOption[] = [];
            for (const option of value) {
              if (!option || typeof option !== \"object\") return null;
              const label = Reflect.get(option, \"label\");
              const optionValue = Reflect.get(option, \"value\");
              if (typeof label !== \"string\" || typeof optionValue !== \"string\") {
                return null;
              }
              result.push(Object.freeze({ label, value: optionValue }));
            }
            return Object.freeze(result);
          }

          function resolveStorage(
            document: Document,""",
              "option override parser",
          )
          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """  const process = async (
            rawInput: string,
          ): Promise<AssistantDialogResponse> => {""",
              """  const processInput = async (
            rawInput: string,
            optionOverride?: readonly AssistantDomOption[],
          ): Promise<AssistantDialogResponse> => {""",
              "internal processInput",
          )
          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """    const responseOptions = readAssistantResponseOptions(response);
            if (responseOptions.length > 0) {
              renderAssistantDomOptions(options.document, responseOptions);
            }""",
              """    const responseOptions =
              optionOverride ?? readAssistantResponseOptions(response);
            if (responseOptions.length > 0) {
              renderAssistantDomOptions(options.document, responseOptions);
            }""",
              "override response options",
          )
          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """    return response;
            };

            const Recognition = view""",
              """    return response;
            };

            const process = (rawInput: string): Promise<AssistantDialogResponse> =>
              processInput(rawInput);

            const Recognition = view""",
              "public process wrapper",
          )
          patch(
              "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts",
              """  const onOptionSelected = (event: Event): void => {
            if (!(event instanceof CustomEvent)) return;
            const detail = event.detail as { value?: unknown } | null;
            const value = typeof detail?.value === \"string\" ? detail.value : \"\";
            if (value) void process(value);
          };""",
              """  const onOptionSelected = (event: Event): void => {
            if (!(event instanceof CustomEvent)) return;
            const detail = event.detail as
              | { value?: unknown; optionsOverride?: unknown }
              | null;
            const value = typeof detail?.value === \"string\" ? detail.value : \"\";
            if (!value) return;
            const optionOverride = readOptionOverride(detail?.optionsOverride);
            void processInput(value, optionOverride ?? undefined);
          };""",
              "option override event",
          )

          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """import {
            filterV1ExploreLocations,""",
              """import { getV1ExplorePlaceActionOptions } from \"./explore-location-actions-v1.js\";
          import {
            filterV1ExploreLocations,""",
              "post-detail action import",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              'type ExploreStage = "menu" | "filters" | "places" | "tour";',
              'type ExploreStage = "menu" | "filters" | "places" | "detail" | "tour";',
              "detail stage",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """function markerForLocation(
            location: MorroV1SearchCatalogItem,
            index: number,
          ): MapMarker {""",
              """function markerForLocation(
            location: MorroV1SearchCatalogItem,
            index: number,
            openPopup = false,
          ): MapMarker {""",
              "marker openPopup argument",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """    label: location.name,
            });""",
              """    label: location.name,
              ...(openPopup ? { openPopup: true } : {}),
            });""",
              "selected marker popup flag",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """  if (locations.length === 1) {
            const location = locations[0];
            if (!location) return;
            if (geospatialEngine?.initialized) {
              void geospatialEngine.setCenter({
                latitude: location.latitude,
                longitude: location.longitude,
              });
            } else {
              map?.setCenter([location.longitude, location.latitude]);
            }
            return;
          }""",
              """  if (locations.length === 1) {
            const location = locations[0];
            if (!location) return;
            if (map?.flyTo) {
              map.flyTo({
                center: [location.longitude, location.latitude],
                zoom: 16,
                duration: 650,
                essential: true,
              });
            } else if (map) {
              map.setCenter([location.longitude, location.latitude]);
              map.setZoom?.(16);
            } else if (geospatialEngine?.initialized) {
              void geospatialEngine.setCenter({
                latitude: location.latitude,
                longitude: location.longitude,
              });
            }
            return;
          }""",
              "V1 selected camera zoom",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """  const renderLocationsOnMap = async (
            locations: readonly MorroV1SearchCatalogItem[],
            category: string,
          ): Promise<void> => {""",
              """  const renderLocationsOnMap = async (
            locations: readonly MorroV1SearchCatalogItem[],
            category: string,
            openSelectedPopup = false,
          ): Promise<void> => {""",
              "render popup parameter",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """        locations.map((location, index) => markerForLocation(location, index)),""",
              """        locations.map((location, index) =>
                  markerForLocation(
                    location,
                    index,
                    openSelectedPopup && locations.length === 1,
                  ),
                ),""",
              "marker popup mapping",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """    activeStage = \"places\";
            removeAssistantFlowResults(document);
            await renderLocationsOnMap([location], activeCategory.value);""",
              """    activeStage = \"detail\";
            removeAssistantFlowResults(document);
            await renderLocationsOnMap([location], activeCategory.value, true);""",
              "selected detail stage",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """    document.dispatchEvent(
              new CustomEvent(\"morro:assistant-option-selected\", {
                detail: { value: createExploreLocationDetailsCommand(location.name) },
              }),
            );""",
              """    const optionsOverride = getV1ExplorePlaceActionOptions(
              activeCategory.value,
            ).map(({ label, value }) => Object.freeze({ label, value }));
            document.dispatchEvent(
              new CustomEvent(\"morro:assistant-option-selected\", {
                detail: {
                  value: createExploreLocationDetailsCommand(location.name),
                  optionsOverride: Object.freeze(optionsOverride),
                },
              }),
            );""",
              "dispatch V1 detail options",
          )
          patch(
              "apps/morro-digital-platform/src/map/explore-locations-control.ts",
              """    const value = typeof candidate === \"string\" ? candidate : \"\";
            if (!isBackToMenuValue(value)) return;
            event.stopImmediatePropagation();
            backToMenu(false);""",
              """    const value = typeof candidate === \"string\" ? candidate : \"\";
            if (
              activeStage === \"detail\" &&
              activeCategory &&
              value === `[sub]${activeCategory.value}`
            ) {
              event.stopImmediatePropagation();
              const allLocations = getExploreLocationsForCategory(activeCategory.value);
              renderPlaces(
                allLocations,
                `${activeCategory.label}: escolha outro local para ver os detalhes.`,
              );
              return;
            }
            if (!isBackToMenuValue(value)) return;
            event.stopImmediatePropagation();
            backToMenu(false);""",
              "detail back to places",
          )

          patch(
              ".github/workflows/v1-explore-locations-browser-regression.yml",
              """      - apps/morro-digital-platform/src/map/explore-locations-control.ts
                - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts""",
              """      - apps/morro-digital-platform/src/map/explore-locations-control.ts
                - apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
                - apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts
                - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts""",
              "action workflow paths",
          )
          patch(
              ".github/workflows/v1-explore-locations-browser-regression.yml",
              """      - apps/morro-digital-platform/src/assistant/**
                - apps/morro-digital-platform/src/map/explore-locations-control.ts""",
              """      - apps/morro-digital-platform/src/assistant/**
                - packages/geospatial/src/**
                - apps/morro-digital-platform/src/map/explore-locations-control.ts""",
              "geospatial workflow path",
          )
          patch(
              ".github/workflows/v1-explore-locations-browser-regression.yml",
              """          async function waitForMapCenter(page, longitude, latitude) {
                    const deadline = Date.now() + 6000;
                    let last = null;
                    while (Date.now() < deadline) {
                      last = await page.evaluate(() => {
                        const center = globalThis.mapboxPrimaryInstance?.getCenter?.();
                        return center ? { lng: center.lng, lat: center.lat } : null;
                      });
                      if (last && Math.abs(last.lng - longitude) < 0.001 && Math.abs(last.lat - latitude) < 0.001) return last;
                      await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    throw new Error(`Selected location did not recenter map: ${JSON.stringify(last)}`);
                  }""",
              """          async function waitForSelectedMapCamera(page, longitude, latitude) {
                    const deadline = Date.now() + 6000;
                    let last = null;
                    while (Date.now() < deadline) {
                      last = await page.evaluate(() => {
                        const map = globalThis.mapboxPrimaryInstance;
                        const center = map?.getCenter?.();
                        return center ? { lng: center.lng, lat: center.lat, zoom: map?.getZoom?.() } : null;
                      });
                      if (
                        last &&
                        Math.abs(last.lng - longitude) < 0.001 &&
                        Math.abs(last.lat - latitude) < 0.001 &&
                        typeof last.zoom === 'number' &&
                        Math.abs(last.zoom - 16) < 0.05
                      ) return last;
                      await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    throw new Error(`Selected location did not reach the V1 camera: ${JSON.stringify(last)}`);
                  }""",
              "selected camera helper",
          )
          patch(
              ".github/workflows/v1-explore-locations-browser-regression.yml",
              """              await page.locator('#assistant-category-results [data-location-name=\"Primeira Praia\"]').click();
                      await waitMap(page, 'beaches', 1, 'places');
                      const center = await waitForMapCenter(page, -38.9142193, -13.3776181);
                      const selected = await page.evaluate(() => ({""",
              """              await page.locator('#assistant-category-results [data-location-name=\"Primeira Praia\"]').click();
                      await waitMap(page, 'beaches', 1, 'detail');
                      const center = await waitForSelectedMapCamera(page, -38.9142193, -13.3776181);
                      await page.locator('.mapboxgl-popup').filter({ hasText: 'Primeira Praia' }).waitFor({ state: 'visible', timeout: 5000 });
                      await page.locator('.assistant-options .assistant-option-btn[data-value=\"condições da praia\"]').waitFor({ state: 'visible', timeout: 8000 });
                      const selected = await page.evaluate(() => ({""",
              "selected popup and detail stage",
          )
          patch(
              ".github/workflows/v1-explore-locations-browser-regression.yml",
              """                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                      }));
                      if (!selected.flowRemoved || !selected.mainHidden || selected.markerCount !== '1' || selected.activeTour !== null || !selected.selectedValues.includes('Fale sobre Primeira Praia')) {
                        throw new Error(`Location selection diverged in ${viewport.id}: ${JSON.stringify(selected)}`);
                      }""",
              """                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                        popupText: document.querySelector('.mapboxgl-popup')?.textContent?.trim() ?? '',
                        detailValues: Array.from(
                          document.querySelectorAll('.assistant-options:not(:has([data-explore-category])) .assistant-option-btn'),
                          button => button.getAttribute('data-value'),
                        ),
                      }));
                      const expectedBeachDetailValues = [
                        'condições da praia',
                        'como chegar',
                        'ver fotos',
                        'informações',
                        'mais opções',
                        '[sub]beaches',
                      ];
                      if (
                        !selected.flowRemoved ||
                        !selected.mainHidden ||
                        selected.markerCount !== '1' ||
                        selected.activeTour !== null ||
                        !selected.selectedValues.includes('Fale sobre Primeira Praia') ||
                        !selected.popupText.includes('Primeira Praia') ||
                        JSON.stringify(selected.detailValues) !== JSON.stringify(expectedBeachDetailValues)
                      ) {
                        throw new Error(`Location selection diverged in ${viewport.id}: ${JSON.stringify(selected)}`);
                      }

                      await page.locator('.assistant-options .assistant-option-btn[data-value=\"[sub]beaches\"]').click();
                      await page.locator('#assistant-category-results[data-stage=\"places\"]').waitFor({ state: 'visible', timeout: 5000 });
                      await waitMap(page, 'beaches', 8, 'places');
                      const returnedPlaces = await page.locator('#assistant-category-results [data-location-name]').count();
                      if (returnedPlaces !== 8) {
                        throw new Error(`Detail back did not restore the V1 places list: ${returnedPlaces}`);
                      }""",
              "detail option matrix and back behavior",
          )
          PY
      - name: Format changed product files
        run: |
          pnpm exec prettier --write \
            packages/geospatial/src/provider.ts \
            packages/geospatial/src/adapters/mapbox.ts \
            packages/geospatial/src/infrastructure/mapbox-gl-driver.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts \
            .github/workflows/v1-explore-locations-browser-regression.yml
          git diff --check
      - name: Validate affected workspaces
        run: |
          pnpm --filter @touristic/geospatial lint
          pnpm --filter @touristic/geospatial typecheck
          pnpm --filter @touristic/geospatial test
          pnpm --filter @touristic/geospatial build
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit validated product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/geospatial/src/provider.ts \
            packages/geospatial/src/adapters/mapbox.ts \
            packages/geospatial/src/infrastructure/mapbox-gl-driver.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.ts \
            apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts \
            .github/workflows/v1-explore-locations-browser-regression.yml
          git commit -m 'fix(assistant): restore V1 detail actions and marker popup parity'
          git push origin HEAD:fix/v1-assistant-category-subflows-20260915
