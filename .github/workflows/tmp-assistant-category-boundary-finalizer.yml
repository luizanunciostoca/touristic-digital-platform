name: Temporary Assistant Category Boundary Finalizer

on:
  push:
    branches:
      - fix/assistant-v1-place-action-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/assistant-v1-place-action-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply category boundary fix
        run: node tooling/patch-assistant-category-boundary.mjs
      - name: Format affected source
        run: |
          pnpm exec prettier --write \
            packages/assistant/src/intent-engine.ts \
            packages/assistant/src/intent-engine.category-boundary.test.ts
      - name: Validate assistant and platform
        run: |
          pnpm exec prettier --check \
            packages/assistant/src/intent-engine.ts \
            packages/assistant/src/intent-engine.category-boundary.test.ts
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
          pnpm --filter @touristic/assistant lint
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          git diff --check
      - name: Commit validated category boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/assistant/src/intent-engine.ts \
            packages/assistant/src/intent-engine.category-boundary.test.ts
          git diff --cached --quiet && { echo 'No validated source changes'; exit 1; }
          git commit -m "fix(assistant): preserve tour category for barco place details"
          git push origin HEAD:fix/assistant-v1-place-action-parity
