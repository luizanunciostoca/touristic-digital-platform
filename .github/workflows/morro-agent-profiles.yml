name: Agent Profile Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/morro-agent-profiles.yml"
      - ".morro/changesets/**"
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-profile-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pr-changeset:
    if: github.event_name == 'pull_request'
    name: resolve-agent-profile-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest_path: ${{ steps.changeset.outputs.path }}
      retirement: ${{ steps.transition.outputs.retirement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Resolve the registered ChangeSet for this PR branch
        id: changeset
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          path="$(node tooling/fabric/resolve-changeset.mjs "$HEAD_BRANCH")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Classify exact retirement transition
        id: transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MANIFEST_PATH: ${{ steps.changeset.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/morro-control/claims.json" > "$RUNNER_TEMP/base-claims.json"
          removed="$(jq -n --slurpfile base "$RUNNER_TEMP/base-claims.json" --slurpfile candidate .github/morro-control/claims.json '($base[0].claims | keys) - ($candidate[0].claims | keys)')"
          added="$(jq -n --slurpfile base "$RUNNER_TEMP/base-claims.json" --slurpfile candidate .github/morro-control/claims.json '($candidate[0].claims | keys) - ($base[0].claims | keys)')"
          retirement=false
          if [ "$(jq length <<<"$removed")" -eq 1 ] && [ "$(jq length <<<"$added")" -eq 0 ]; then
            claim_id="$(jq -r '.[0]' <<<"$removed")"
            if [ "$MANIFEST_PATH" = ".morro/changesets/$claim_id.json" ] &&
              [ "$(jq -r '.state' "$MANIFEST_PATH")" = "MERGED" ] &&
              [ "$(jq -r '.baseSha' "$MANIFEST_PATH")" = "$BASE_SHA" ] &&
              [ "$(jq -r '.branch' "$MANIFEST_PATH")" = "$HEAD_BRANCH" ]; then
              retirement=true
            fi
          fi
          echo "retirement=$retirement" >> "$GITHUB_OUTPUT"

  validate-pr:
    if: github.event_name == 'pull_request' && needs.resolve-pr-changeset.outputs.retirement != 'true'
    needs: resolve-pr-changeset
    name: ${{ needs.resolve-pr-changeset.outputs.retirement == 'true' && 'agent-profile-contract-generic-skipped' || 'agent-profile-contract' }}
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@504d587c9eb780cff01aae71d377b2c2aec99054
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      manifest_path: ${{ needs.resolve-pr-changeset.outputs.manifest_path }}
    permissions:
      contents: read

  validate-retirement:
    if: github.event_name == 'pull_request' && needs.resolve-pr-changeset.outputs.retirement == 'true'
    needs: resolve-pr-changeset
    name: agent-profile-contract / trusted-agent-profile-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - id: trusted-identity
        name: Verify trusted validator checkout identity
        shell: bash
        env:
          EXPECTED_TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git -C trusted rev-parse HEAD)"
          tree_sha="$(git -C trusted rev-parse 'HEAD^{tree}')"
          test "$head_sha" = "$EXPECTED_TRUSTED_SHA"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Test trusted agent-profile validator
        run: node --test trusted/tooling/quality/agent-profile-contract-trusted.test.mjs

      - name: Validate candidate profiles as data
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_VALIDATOR_SHA: ${{ steps.trusted-identity.outputs.head_sha }}
          TRUSTED_VALIDATOR_TREE_SHA: ${{ steps.trusted-identity.outputs.tree_sha }}
        run: node trusted/tooling/quality/agent-profile-contract-trusted.mjs candidate

      - name: Test trusted independent-proof implementation
        run: node --test trusted/tooling/quality/independent-proof-trusted.test.mjs

      - name: Audit candidate workflow supply chain with trusted code
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node ../trusted/tooling/quality/check-workflow-supply-chain.mjs --strict

      - name: Prove retirement from trusted base evidence
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --test trusted/tooling/fabric/claim-retirement-proof.test.mjs
          node trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate | tee agent-profile-retirement-proof.json

      - name: Upload retirement proof
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: agent-profile-retirement-proof-${{ github.event.pull_request.head.sha }}
          path: agent-profile-retirement-proof.json
          if-no-files-found: error
          retention-days: 30

  validate-merge-group:
    if: github.event_name == 'merge_group'
    name: agent-profile-contract
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@504d587c9eb780cff01aae71d377b2c2aec99054
    with:
      candidate_sha: ${{ github.sha }}
      base_sha: ${{ github.event.merge_group.base_sha }}
      manifest_path: .morro/changesets/MD-CP-002C.json
    permissions:
      contents: read
