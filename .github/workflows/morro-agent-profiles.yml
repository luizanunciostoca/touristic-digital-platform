name: Agent Profile Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/morro-agent-profiles.yml"
      - ".morro/changesets/MD-CP-002C.json"
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/morro-agent-profiles.yml"
      - ".morro/changesets/MD-CP-002C.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-profile-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: agent-profile-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Install formatter toolchain
        run: pnpm install --frozen-lockfile
      - name: Render canonical Prettier preview
        run: |
          pnpm exec prettier --write .github/agents/profile-contract.test.mjs
          echo "MORRO_FORMATTED_FILE_BEGIN"
          cat .github/agents/profile-contract.test.mjs
          echo "MORRO_FORMATTED_FILE_END"
          git checkout -- .github/agents/profile-contract.test.mjs
      - name: Test rejected profile configurations
        run: node --test .github/agents/*.test.mjs
      - name: Validate profiles and exact source identity
        run: node .github/agents/profile-contract.mjs
