name: Wave E Format Probe

on:
  push:
    branches:
      - wave/ux-v2-navigation-guidance-convergence-20260922
    paths:
      - .github/workflows/wave-e-format-probe.yml

permissions:
  contents: read

concurrency:
  group: wave-e-format-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/public/premium-ux-v2.css             apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts             apps/morro-digital-platform/src/navigation/navigation-wave-e-convergence.test.ts
          git diff --             apps/morro-digital-platform/public/premium-ux-v2.css             apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts             apps/morro-digital-platform/src/navigation/navigation-wave-e-convergence.test.ts
          test -z "$(git status --short --             apps/morro-digital-platform/public/premium-ux-v2.css             apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts             apps/morro-digital-platform/src/navigation/navigation-wave-e-convergence.test.ts)"
