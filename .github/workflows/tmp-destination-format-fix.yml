name: Temporary Destination Formatting Fix

on:
  push:
    branches:
      - wave/control-center-destination-owner-20260920
    paths:
      - .github/workflows/tmp-destination-format-fix.yml

permissions:
  contents: write

concurrency:
  group: tmp-destination-format-fix
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/control-center-destination-owner-20260920
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs \
            apps/morro-digital-platform/tooling/destination-admin-runtime.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            packages/destination/src/index.ts \
            packages/destinations/src/index.ts \
            pnpm-lock.yaml \
            services/destinations/src/index.test.ts \
            services/destinations/src/index.ts \
            services/destinations/src/mysql-destination-repository.test.ts \
            services/destinations/src/mysql-destination-repository.ts
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs \
            apps/morro-digital-platform/tooling/destination-admin-runtime.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            packages/destination/src/index.ts \
            packages/destinations/src/index.ts \
            pnpm-lock.yaml \
            services/destinations/src/index.test.ts \
            services/destinations/src/index.ts \
            services/destinations/src/mysql-destination-repository.test.ts \
            services/destinations/src/mysql-destination-repository.ts
          git commit -m "style(destination): apply canonical prettier formatting"
          git push origin HEAD:wave/control-center-destination-owner-20260920
