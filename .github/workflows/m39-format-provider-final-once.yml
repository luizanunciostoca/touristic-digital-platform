name: M39 Format Provider Final Once
on:
  push:
    branches:
      - feat/search-m39-mapbox-provider
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m39-mapbox-provider
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write packages/search/src/mapbox-search-provider.ts
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/m39-format-provider-final-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/search/src/mapbox-search-provider.ts .github/workflows/m39-format-provider-final-once.yml
          git commit -m "style(search): format final M39 provider"
          git push origin HEAD:feat/search-m39-mapbox-provider
