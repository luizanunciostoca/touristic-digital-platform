name: M26 Price Implement

on:
  push:
    branches:
      - feat/assistant-m26-price

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m26-price
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts')
          text = adapter.read_text()
          old = '''      price: (place) => ({\n        text: `Os preços de ${place} ainda estão sendo conectados à nova arquitetura.`,\n        metadata: { domain: "price", state: "provider_pending", place },\n      }),'''
          new = '''      price: (place) => ({\n        text:\n          `💰 Sobre preços em <b>${place}</b>:<br><br>` +\n          `As informações de preço podem variar. Recomendo verificar diretamente com o estabelecimento.<br><br>` +\n          `Em geral, as praias de Morro de São Paulo são <b>gratuitas</b>. Passeios de barco custam em torno de <b>R$ 80-150</b> por pessoa. Restaurantes variam de <b>R$ 30-150</b> por pessoa.`,\n        options: [...PLACE_DETAILS_OPTIONS],\n        metadata: { domain: "price", state: "v1_guidance", place },\n      }),'''
          if old not in text:
              raise SystemExit('price placeholder not found')
          adapter.write_text(text.replace(old, new, 1))

          tests = Path('apps/morro-digital-platform/src/assistant/assistant-domain-adapter.test.ts')
          t = tests.read_text()
          marker = '\n});\n'
          case = '''\n  it("preserves the audited V1 price guidance for a contextual place", async () => {\n    const handlers = createAssistantBrowserDomainHandlers();\n    const response = await handlers.price?.(request("price", "Segunda Praia"));\n\n    expect(response).toEqual({\n      text:\n        "💰 Sobre preços em <b>Segunda Praia</b>:<br><br>" +\n        "As informações de preço podem variar. Recomendo verificar diretamente com o estabelecimento.<br><br>" +\n        "Em geral, as praias de Morro de São Paulo são <b>gratuitas</b>. Passeios de barco custam em torno de <b>R$ 80-150</b> por pessoa. Restaurantes variam de <b>R$ 30-150</b> por pessoa.",\n      options: [\n        { label: "Como chegar", value: "como chegar" },\n        { label: "Ver fotos", value: "ver fotos" },\n        { label: "Horário", value: "horário" },\n        { label: "Voltar ao menu principal", value: "voltar ao menu" },\n      ],\n      metadata: { domain: "price", state: "v1_guidance", place: "Segunda Praia" },\n    });\n  });\n'''
          if 'preserves the audited V1 price guidance' not in t:
              pos = t.rfind(marker)
              if pos < 0:
                  raise SystemExit('test suite end not found')
              t = t[:pos] + case + t[pos:]
              tests.write_text(t)

          matrix = Path('docs/migration/ASSISTANT-MIGRATION-MATRIX.md')
          m = matrix.read_text()
          m = m.replace('Estado M25', 'Estado M26', 1)
          m = m.replace('assets binários de photos, price e paridade completa de weather ainda pendentes', 'assets binários de photos e paridade completa de weather/i18n ainda pendentes', 1)
          m = m.replace('assets binários de photos, price e paridades restantes faltam', 'assets binários de photos e paridades de i18n restantes faltam', 1)
          section = '''\n## Estado do milestone M26\n\nO M26 remove o estado `provider_pending` do intent `price` reproduzindo a orientação observável da baseline V1 quando existe um local em contexto. A V1 não consultava um provider de preços em tempo real nesse fluxo: informava que valores podem variar, recomendava confirmação direta com o estabelecimento e apresentava as faixas gerais auditadas — praias gratuitas, passeios de barco em torno de R$ 80–150 por pessoa e restaurantes entre R$ 30–150 por pessoa.\n\nA V2 preserva esse comportamento sem fabricar um preço específico para o estabelecimento e mantém o local no metadata do diálogo. A ausência de local continua coberta pelo contrato `awaiting_place` da camada de domínio. Com isso `price` deixa de ser um provider ausente; a linha agregada permanece `PARTIAL` apenas pelos assets físicos de `photos` e pelas paridades multilíngues/weather ainda abertas.\n\nA FEATURE-0004 / MIG-0006 **ainda não está equivalente**. Permanecem o delivery de assets de `photos`, provider LLM same-origin, boundary `/api/ai/*`, voz, paridade completa de weather, lifecycle/UI completa e paridades de copy/i18n marcadas como `PARTIAL`.\n'''
          anchor = '\nPara promover MIG-0006 a `equivalent`'
          if '## Estado do milestone M26' not in m:
              m = m.replace(anchor, section + anchor, 1)
          matrix.write_text(m)
          PY
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.test.ts \
            docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          rm .github/workflows/m26-price-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assistant): preserve V1 price guidance"
          git push
