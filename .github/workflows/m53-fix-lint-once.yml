name: M53 Fix Lint Once

on:
  push:
    branches:
      - feat/business-m53-onboarding-core
    paths:
      - .github/workflows/m53-fix-lint-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m53-onboarding-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace control-character regex safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/business/src/onboarding.ts')
          s = p.read_text()
          old = '''function safeText(value: unknown, maxLength = 240): string {
            if (typeof value !== "string") return "";
            return value
              .replace(/[\\u0000-\\u001F\\u007F<>]/gu, " ")
              .replace(/\\s+/gu, " ")
              .trim()
              .slice(0, maxLength);
          }'''
          new = '''function safeText(value: unknown, maxLength = 240): string {
            if (typeof value !== "string") return "";
            const sanitized = Array.from(value, (character) => {
              const codePoint = character.codePointAt(0) ?? 0;
              return codePoint <= 31 || codePoint === 127 || character === "<" || character === ">"
                ? " "
                : character;
            }).join("");
            return sanitized.replace(/\\s+/gu, " ").trim().slice(0, maxLength);
          }'''
          if old not in s:
              raise SystemExit('expected safeText block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Format and validate Business package
        run: |
          pnpm exec prettier --write packages/business/src/onboarding.ts
          pnpm --filter @touristic/business lint
          pnpm --filter @touristic/business typecheck
          pnpm --filter @touristic/business test
      - name: Commit fix and remove helper
        run: |
          git rm .github/workflows/m53-fix-lint-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/src/onboarding.ts
          git commit -m "fix(business): sanitize M53 onboarding text safely"
          git push origin HEAD:feat/business-m53-onboarding-core
