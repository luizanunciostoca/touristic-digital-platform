name: Temporary PR74 Suppressed Review Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-pr74-suppressed-review-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-place-action-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all suppressed review remediations
        run: |
          python <<'PY'
          from pathlib import Path

          adapter = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts')
          adapter_test = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts')
          runtime = Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          browser = Path('.github/workflows/assistant-place-actions-v1-parity.yml')

          a = adapter.read_text()
          t = adapter_test.read_text()
          r = runtime.read_text()
          b = browser.read_text()

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          helper = '''function transportNavigationConfirmation(\n  placeName: string,\n  language: AssistantV1PlaceActionLanguage,\n) {\n  const copy = {\n    pt: {\n      text: `Deseja iniciar a navegação até ${placeName}?`,\n      yes: "Sim",\n      no: "Não",\n    },\n    en: {\n      text: `Would you like to start navigation to ${placeName}?`,\n      yes: "Yes",\n      no: "No",\n    },\n    es: {\n      text: `¿Deseas iniciar la navegación hasta ${placeName}?`,\n      yes: "Sí",\n      no: "No",\n    },\n    he: {\n      text: `האם תרצה להתחיל ניווט אל ${placeName}?`,\n      yes: "כן",\n      no: "לא",\n    },\n  } as const;\n  return copy[language];\n}\n\n'''
          a = one(a, 'function moreOptions(\n', helper + 'function moreOptions(\n', 'navigation confirmation helper')
          a = one(
              a,
              '  if (["mais opcoes", "more options"].includes(normalized)) {',
              '''  if (\n    [\n      "mais opcoes",\n      "outras opcoes",\n      "more options",\n      "mas opciones",\n      "אפשרויות נוספות",\n    ].includes(normalized)\n  ) {''',
              'more-options aliases',
          )
          a = one(
              a,
              '["localizacao", "location", "ubicacion"].includes(normalized)',
              '["localizacao", "location", "ubicacion", "מיקום"].includes(normalized)',
              'transport location aliases',
          )
          a = one(
              a,
              '''    const destination = Object.freeze({\n      name: place.name,\n      latitude: place.latitude,\n      longitude: place.longitude,\n      category: place.category,\n    });\n    return {''',
              '''    const destination = Object.freeze({\n      name: place.name,\n      latitude: place.latitude,\n      longitude: place.longitude,\n      category: place.category,\n    });\n    const confirmation = transportNavigationConfirmation(place.name, language);\n    return {''',
              'transport confirmation binding',
          )
          a = one(
              a,
              '''        text: `Deseja iniciar a navegação até ${place.name}?`,\n        options: [\n          { label: "Sim", value: "sim" },\n          { label: "Não", value: "não" },\n        ],''',
              '''        text: confirmation.text,\n        options: [\n          { label: confirmation.yes, value: "sim" },\n          { label: confirmation.no, value: "não" },\n        ],''',
              'localized transport confirmation',
          )

          t = one(
              t,
              '  it("keeps unavailable transport secondary information explicit", () => {',
              '''  it.each([\n    ["mais opções", "pt"],\n    ["outras opções", "pt"],\n    ["more options", "en"],\n    ["más opciones", "es"],\n    ["אפשרויות נוספות", "he"],\n  ] as const)(\n    "routes the %s secondary-menu alias deterministically",\n    (input, language) => {\n      const result = resolve(input, "Morena Bela", "restaurants", language);\n      expect(result?.response.metadata).toMatchObject({\n        action: "restaurant_more_options",\n        deterministic: true,\n      });\n    },\n  );\n\n  it.each([\n    [\n      "location",\n      "en",\n      "Would you like to start navigation to Píer de Morro de São Paulo?",\n      "Yes",\n      "No",\n    ],\n    [\n      "ubicación",\n      "es",\n      "¿Deseas iniciar la navegación hasta Píer de Morro de São Paulo?",\n      "Sí",\n      "No",\n    ],\n    [\n      "מיקום",\n      "he",\n      "האם תרצה להתחיל ניווט אל Píer de Morro de São Paulo?",\n      "כן",\n      "לא",\n    ],\n  ] as const)(\n    "localizes transport location confirmation for %s",\n    (input, language, text, yes, no) => {\n      const result = resolve(\n        input,\n        "Píer de Morro de São Paulo",\n        "transport",\n        language,\n      );\n      expect(result?.response.text).toBe(text);\n      expect(result?.response.options).toEqual([\n        { label: yes, value: "sim" },\n        { label: no, value: "não" },\n      ]);\n      expect(result?.response.metadata).toMatchObject({\n        action: "transport_location",\n        navigation: "awaiting_confirmation",\n        deterministic: true,\n      });\n    },\n  );\n\n  it("keeps unavailable transport secondary information explicit", () => {''',
              'localized alias tests',
          )

          context_pair = '''        lastCategory: state.category,\n        lastIntent: "categoria",\n        awaiting:'''
          context_pair_fixed = '''        lastCategory: state.category,\n        lastPlace: null,\n        lastIntent: "categoria",\n        awaiting:'''
          r = one(r, context_pair, context_pair_fixed, 'clear place in filters')
          r = one(r, context_pair, context_pair_fixed, 'clear place in places')
          r = one(
              r,
              '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          awaiting: { type: "confirmar_navegacao", intent: "navigate" },''',
              '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          fallbackCount: 0,\n          awaiting: { type: "confirmar_navegacao", intent: "navigate" },''',
              'reset fallback navigation action',
          )
          r = one(
              r,
              '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          awaiting: null,''',
              '''          lastPlace: placeAction.place.name,\n          lastCategory: placeAction.category,\n          fallbackCount: 0,\n          awaiting: null,''',
              'reset fallback place action',
          )

          b = one(
              b,
              '''                localStorage.setItem('morro-digital-onboarded', '1');\n                localStorage.setItem('voice-enabled', 'false');\n                globalThis.__placeActionRoutes = [];''',
              '''                localStorage.setItem('morro-digital-onboarded', '1');\n                localStorage.setItem('voice-enabled', 'false');\n                localStorage.setItem('assistantContext', JSON.stringify({\n                  _version: 2,\n                  fallbackCount: 3,\n                  sessionStart: Date.now(),\n                }));\n                globalThis.__placeActionRoutes = [];''',
              'seed fallback context',
          )
          b = one(
              b,
              '''              await expectAction(\n                'condições da praia',\n                'beach_conditions',\n                'Ainda não há condições confiáveis cadastradas para esta praia.',\n              );\n\n              await openPlace('restaurants', 'Morena Bela');''',
              '''              await expectAction(\n                'condições da praia',\n                'beach_conditions',\n                'Ainda não há condições confiáveis cadastradas para esta praia.',\n              );\n              await waitUntil(\n                () => page.evaluate(() => {\n                  const raw = localStorage.getItem('assistantContext');\n                  if (!raw) return false;\n                  return JSON.parse(raw).fallbackCount === 0;\n                }),\n                'fallback counter reset after deterministic place action',\n              );\n\n              await openPlace('restaurants', 'Morena Bela');''',
              'browser fallback reset proof',
          )
          b = one(
              b,
              '''              await expectAction(\n                'cardápio',\n                'restaurant_menu',\n                'Este restaurante ainda não possui cardápio digital cadastrado.',\n              );\n\n              await openPlace('hotels', 'Pousada Natureza');''',
              '''              await expectAction(\n                'cardápio',\n                'restaurant_menu',\n                'Este restaurante ainda não possui cardápio digital cadastrado.',\n              );\n              await submit('mais opções');\n              await page.locator('.assistant-option-btn[data-value="avaliações"]').last().waitFor({\n                state: 'visible',\n                timeout: 5000,\n              });\n              await expectAction(\n                'avaliações',\n                'restaurant_reviews',\n                'Ainda não há avaliações cadastradas para este restaurante.',\n              );\n              await page.locator('.assistant-option-btn[data-value="[sub]restaurants"]').last().click();\n              await page.locator(\n                '#assistant-category-results[data-category="restaurants"][data-stage="places"]',\n              ).waitFor({ state: 'visible', timeout: 8000 });\n              await waitUntil(\n                () => page.evaluate(() => {\n                  const raw = localStorage.getItem('assistantContext');\n                  if (!raw) return false;\n                  return JSON.parse(raw).lastPlace === null;\n                }),\n                'selected place cleared after returning to restaurant list',\n              );\n\n              await openPlace('hotels', 'Pousada Natureza');''',
              'browser restaurant secondary/stale proof',
          )
          b = one(
              b,
              '''              await expectAction(\n                'ver quartos',\n                'accommodation_rooms',\n                'Esta hospedagem ainda não possui quartos cadastrados.',\n              );\n\n              await openPlace('tours', 'Passeio de Barco Volta à Ilha');''',
              '''              await expectAction(\n                'ver quartos',\n                'accommodation_rooms',\n                'Esta hospedagem ainda não possui quartos cadastrados.',\n              );\n              await submit('mais opções');\n              await page.locator('.assistant-option-btn[data-value="compartilhar"]').last().waitFor({\n                state: 'visible',\n                timeout: 5000,\n              });\n              await expectAction(\n                'compartilhar',\n                'accommodation_share',\n                'O compartilhamento desta hospedagem ainda não está disponível no assistente.',\n              );\n\n              await openPlace('tours', 'Passeio de Barco Volta à Ilha');''',
              'browser hotel share proof',
          )
          b = one(
              b,
              '''                'restaurant_menu',\n                'accommodation_rooms',''',
              '''                'restaurant_menu',\n                'restaurant_reviews',\n                'accommodation_rooms',\n                'accommodation_share',''',
              'browser required route list',
          )

          adapter.write_text(a)
          adapter_test.write_text(t)
          runtime.write_text(r)
          browser.write_text(b)
          PY
      - name: Format affected source
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            .github/workflows/assistant-place-actions-v1-parity.yml
      - name: Validate review remediation
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            .github/workflows/assistant-place-actions-v1-parity.yml
          git diff --check
      - name: Commit validated review remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            .github/workflows/assistant-place-actions-v1-parity.yml
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'fix(assistant): close suppressed place-action review findings'
          git push origin HEAD:fix/assistant-v1-place-action-parity
