name: Temporary Format Assistant Contextual

on:
  push:
    branches:
      - fix/assistant-contextual-state-final-rebase-20260924

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assistant-contextual-state-final-rebase-20260924
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-contextual-state.ts
      - name: Commit exact Prettier output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-format-assistant-contextual.yml
          git add apps/morro-digital-platform/src/assistant/assistant-contextual-state.ts
          git commit -m "style(assistant): apply exact repository Prettier"
          git push origin HEAD:fix/assistant-contextual-state-final-rebase-20260924
