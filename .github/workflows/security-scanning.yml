name: Security Scanning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Dependencies and repository secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies and tracked repository content
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table

  configuration:
    name: Platform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan Dockerfile and platform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: 1
          format: table

  gosu-reachability:
    name: gosu 1.19 vulnerability reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact upstream gosu 1.19 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tianon/gosu
          ref: 6456aaa0f3c854d199d0f037f068eb97515b7513
      - name: Set up Go 1.24.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.6
          cache: false
      - name: Install upstream-pinned govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run upstream gosu reachability policy
        run: ./govulncheck-with-excludes.sh ./...

  mysql-container:
    name: Staging MySQL container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build current staging MySQL image
        run: >-
          docker build --pull
          --file tooling/render/mysql-staging/Dockerfile
          --tag morro-digital-v2-mysql:sec07
          .
      - name: Scan built MySQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: morro-digital-v2-mysql:sec07
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
