name: M136 Hardening Once

on:
  push:
    branches:
      - feat/payments-m136-domain-vocabulary

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m136-domain-vocabulary
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm --filter @touristic/financial lint && pnpm --filter @touristic/financial typecheck && pnpm --filter @touristic/financial test && pnpm --filter @touristic/financial build
      - run: pnpm --filter @touristic/ordering lint && pnpm --filter @touristic/ordering typecheck && pnpm --filter @touristic/ordering test && pnpm --filter @touristic/ordering build
      - name: Commit canonical hardening state
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(payments): format M136 hardening"
          git push
