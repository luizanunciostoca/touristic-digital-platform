name: M68 CRM docs helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-m68-domain-model
    paths:
      - ".github/workflows/m68-crm-docs-helper.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m68-domain-model
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply M68 documentation reconciliation
        run: |
          python3 .github/scripts/m68-crm-docs.py
          pnpm exec prettier --write docs/migration/CRM-MIGRATION-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/CRM-M68-EVIDENCE.md
      - name: Validate reconciliation
        run: |
          pnpm format:check
          pnpm features:check
      - name: Commit permanent M68 docs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/CRM-MIGRATION-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/CRM-M68-EVIDENCE.md
          git commit -m "docs(crm): record M68 domain migration evidence"
          git push origin HEAD:feat/crm-m68-domain-model
