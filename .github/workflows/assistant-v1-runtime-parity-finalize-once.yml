name: Assistant V1 runtime parity finalization

on:
  push:
    branches:
      - fix/assistant-v1-runtime-intelligence-completion

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-runtime-intelligence-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited V1 runtime parity patch
        run: |
          python .github/scripts/finalize_assistant_v1_runtime_parity.py
          python .github/scripts/fix_assistant_v1_parity_types.py
      - name: Format affected sources
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            .github/workflows/assistant-input-menu-flow-v1-parity.yml
      - name: Validate assistant and platform
        run: |
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm -w build
          git diff --check
      - name: Commit validated source closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git diff --cached --check
          git commit -m "fix(assistant): close audited V1 runtime parity gaps"
          git push origin HEAD:fix/assistant-v1-runtime-intelligence-completion
