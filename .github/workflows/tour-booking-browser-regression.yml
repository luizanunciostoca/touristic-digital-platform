name: Tour Booking Browser Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/tour-booking-browser-regression.yml"
      - "apps/morro-digital-platform/public/tour-booking.html"
      - "apps/morro-digital-platform/public/tour-booking.css"
      - "apps/morro-digital-platform/public/ticketing.js"
      - "apps/morro-digital-platform/src/map/explore-locations-control.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tour-booking-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/tour-booking
      - name: Start browser runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/tour-booking/server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4173/tour-booking.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tour-booking/server.log
          exit 1
      - name: First-paint and ready-state acceptance
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const { writeFileSync } = require('node:fs');

          const origin = 'http://127.0.0.1:4173';
          const offer = {
            id: 'mpi_tour_booking_0000000000000000000001',
            destinationId: 'morro-de-sao-paulo',
            product: {
              kind: 'business_experience',
              reference: 'place-passeio-de-barco-volta-a-ilha',
            },
            label: 'Passeio Volta à Ilha',
            unitAmount: { minorUnits: 18000, currency: 'BRL' },
            pricingVersion: 'tour-booking-v1',
            capacity: 20,
            maxPerReservation: 6,
            availableQuantity: 12,
            startsAt: new Date(Date.now() + 86400000).toISOString(),
            endsAt: new Date(Date.now() + 86400000 + 8 * 3600000).toISOString(),
            rating: 4.9,
          };

          const fulfill = (route, body, status = 200) =>
            route.fulfill({
              status,
              contentType: 'application/json',
              body: JSON.stringify(body),
            });

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'pt-BR',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));

            await page.route('**/api/ticketing/v1/consumer-session', route =>
              fulfill(route, {
                data: {
                  subject: 'guest:tour-booking',
                  csrfToken: 'csrf_tour_booking',
                  expiresAt: new Date(Date.now() + 86400000).toISOString(),
                },
              }, 201),
            );
            await page.route('**/api/ticketing/v1/inventory', async route => {
              await new Promise(resolve => setTimeout(resolve, 900));
              return fulfill(route, { data: [offer] });
            });
            await page.route('**/api/ticketing/v1/reservations', route =>
              fulfill(route, { data: [] }),
            );
            await page.route('**/api/ticketing/v1/quote', route => {
              const body = route.request().postDataJSON();
              const quantity = Number(body.quantity || 1);
              return fulfill(route, {
                data: {
                  inventoryId: offer.id,
                  quantity,
                  unitAmount: offer.unitAmount,
                  totalAmount: {
                    minorUnits: offer.unitAmount.minorUnits * quantity,
                    currency: 'BRL',
                  },
                  pricingVersion: offer.pricingVersion,
                  availableQuantity: offer.availableQuantity,
                  maxPerReservation: offer.maxPerReservation,
                  observedAt: new Date().toISOString(),
                  expiresAt: new Date(Date.now() + 60000).toISOString(),
                },
              });
            });

            const url =
              origin +
              '/tour-booking.html?offer=' +
              encodeURIComponent(offer.id) +
              '&source=map&mode=tour';

            await page.goto(url, { waitUntil: 'domcontentloaded' });

            const firstFrame = await page.evaluate(() => ({
              htmlContext: document.documentElement.dataset.ticketingContext,
              bodyContext: document.body.dataset.ticketingContext,
              loading: document.body.dataset.ticketingLoading,
              dedicatedShell: Boolean(document.querySelector('.tour-booking-shell')),
              legacyShell: Boolean(document.querySelector('.ticketing-shell')),
              legacyPurchaseLayout: Boolean(document.querySelector('.ticketing-purchase-layout')),
              ticketingStylesheet: Array.from(document.styleSheets).some(sheet =>
                String(sheet.href || '').endsWith('/ticketing.css'),
              ),
              heading: document.querySelector('.tour-booking-heading')?.textContent?.trim(),
            }));

            if (
              firstFrame.htmlContext !== 'tour' ||
              firstFrame.bodyContext !== 'tour' ||
              firstFrame.loading !== 'true' ||
              !firstFrame.dedicatedShell ||
              firstFrame.legacyShell ||
              firstFrame.legacyPurchaseLayout ||
              firstFrame.ticketingStylesheet ||
              firstFrame.heading !== 'Reservar Passeio'
            ) {
              throw new Error('Dedicated first frame contract failed: ' + JSON.stringify(firstFrame));
            }

            await page.locator('#ticketing-title').filter({ hasText: 'Passeio Volta à Ilha' }).waitFor({
              state: 'visible',
              timeout: 10000,
            });
            await page.locator('#selection-summary:not([hidden])').waitFor({
              state: 'visible',
              timeout: 10000,
            });
            await page.locator('#summary-unit-price').filter({ hasNotText: '—' }).waitFor({
              state: 'visible',
              timeout: 10000,
            });

            const ready = await page.evaluate(() => {
              const hero = document.querySelector('.tour-hero');
              const cta = document.querySelector('#reserve-button');
              const heroRect = hero instanceof HTMLElement ? hero.getBoundingClientRect() : null;
              const ctaRect = cta instanceof HTMLElement ? cta.getBoundingClientRect() : null;
              return {
                loading: document.body.dataset.ticketingLoading,
                singleProduct: document.body.dataset.ticketingSingleProduct,
                title: document.querySelector('#ticketing-title')?.textContent?.trim(),
                cta: cta?.textContent?.trim(),
                offerGridVisible:
                  document.querySelector('#offers') instanceof HTMLElement &&
                  getComputedStyle(document.querySelector('#offers')).display !== 'none',
                heroHeight: heroRect?.height || 0,
                ctaWidth: ctaRect?.width || 0,
                ctaHeight: ctaRect?.height || 0,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
              };
            });

            if (
              ready.loading !== 'false' ||
              ready.singleProduct !== 'true' ||
              ready.title !== 'Passeio Volta à Ilha' ||
              ready.offerGridVisible ||
              ready.heroHeight < 180 ||
              ready.ctaWidth < 44 ||
              ready.ctaHeight < 44 ||
              ready.scrollWidth > ready.clientWidth + 1
            ) {
              throw new Error('Dedicated ready-state contract failed: ' + JSON.stringify(ready));
            }

            if (errors.length) {
              throw new Error('Tour booking page errors: ' + JSON.stringify(errors));
            }

            await page.screenshot({
              path: '/tmp/tour-booking/tour-booking-390x844.png',
              fullPage: true,
              animations: 'disabled',
            });
            writeFileSync(
              '/tmp/tour-booking/evidence.json',
              JSON.stringify({ firstFrame, ready }, null, 2),
            );
            await context.close();
            await browser.close();
          })().catch(error => {
            writeFileSync('/tmp/tour-booking/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/tour-booking/failure.txt || true
          cat /tmp/tour-booking/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tour-booking-browser-evidence
          path: /tmp/tour-booking
          retention-days: 7
          if-no-files-found: error
