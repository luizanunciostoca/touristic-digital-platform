name: M65 finalize Business equivalence

on:
  workflow_dispatch:
  push:
    branches:
      - feat/business-m65-live-runtime-reconciliation
    paths:
      - ".github/workflows/m65-finalize-business-equivalence.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m65-live-runtime-reconciliation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile Business equivalence sources
        run: |
          python3 .github/scripts/m65-finalize-business-equivalence.py
          pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/BUSINESS-M65-EVIDENCE.md
      - name: Validate documentation and Feature Registry
        run: |
          pnpm format:check
          pnpm features:check
      - name: Commit permanent M65 documentation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/BUSINESS-M65-EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(business): finalize M65 equivalence"
          git push origin HEAD:feat/business-m65-live-runtime-reconciliation
