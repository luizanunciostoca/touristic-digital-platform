name: Dependency Security Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  audit:
    name: dependency / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate patched lockfile from explicit overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies from generated lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for high or critical vulnerabilities
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high --json > dependency-audit.json
          status=$?
          cat dependency-audit.json
          exit "$status"

      - name: Persist generated lockfile to same-repository remediation branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches patched dependency graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh pnpm lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-remediation-${{ github.run_id }}
          path: |
            dependency-audit.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 30
