name: M25 Format Preview

on:
  push:
    branches:
      - feat/assistant-m25-photos

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-v1-photo-catalog.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/morro-digital-platform/src/assistant/assistant-v1-photo-catalog.ts \
              apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
            git commit -m "style(assistant): format M25 photo files"
            git push
          fi
