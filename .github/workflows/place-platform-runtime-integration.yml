name: Place Platform Runtime Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/place-platform-runtime-integration.yml"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.mjs"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.test.mjs"
      - "apps/morro-digital-platform/tooling/database-environment.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/business/**"
      - "packages/content/**"
      - "services/content/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: place-platform-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: morro_business
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BUSINESS_DATABASE_URL: mysql://root:root@127.0.0.1:3306/morro_business
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical Place dependencies
        run: |
          pnpm --filter @touristic/business build
          pnpm --filter @touristic/content-server build
      - name: Persistent Place runtime integration
        run: node --test apps/morro-digital-platform/tooling/place-platform-runtime.test.mjs
