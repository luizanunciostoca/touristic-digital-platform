name: Commerce Prettier One-Shot

on:
  pull_request:
    paths:
      - ".github/workflows/zz-one-shot-commerce-prettier.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/experience.js \
            apps/morro-digital-platform/public/ticketing.js \
            apps/morro-digital-platform/src/business-dashboard-surface.ts \
            services/ticketing/src/business-inventory-repository.ts \
            services/ticketing/src/commerce-public-http-transport.test.ts \
            services/ticketing/src/commerce-public-http-transport.ts
          git diff --check
      - name: Commit canonical formatting to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/experience.js \
            apps/morro-digital-platform/public/ticketing.js \
            apps/morro-digital-platform/src/business-dashboard-surface.ts \
            services/ticketing/src/business-inventory-repository.ts \
            services/ticketing/src/commerce-public-http-transport.test.ts \
            services/ticketing/src/commerce-public-http-transport.ts
          git commit -m "style(commerce): apply canonical prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
