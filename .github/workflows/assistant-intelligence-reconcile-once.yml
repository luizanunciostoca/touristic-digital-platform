name: Assistant V1 intelligence reconciliation one-shot

on:
  push:
    branches:
      - fix/assistant-v1-runtime-intelligence-completion

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-runtime-intelligence-completion
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audited V1 semantic reconciliation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          intent_path = "packages/assistant/src/intent-engine.ts"
          replace_once(
              intent_path,
              '  | "thanks"\n  | "category_beaches"',
              '  | "thanks"\n  | "recommendation"\n  | "compare"\n  | "category_beaches"',
          )
          intent_marker = '\n];\n\nconst PLACE_NAMES = ['
          intent_additions = r'''
            {
              intent: "recommendation",
              confidence: 0.9,
              patterns: [
                /(me recomend|recomend|sugest|o que voce indica|o que você indica|o que e bom|o que é bom|o melhor|o mais famoso|o mais popular|what do you recommend|suggest|best place|recomiend|suger|mejor lugar|ממליץ|ממליצה|ממליצים|המלצה)/i,
              ],
            },
            {
              intent: "compare",
              confidence: 0.85,
              patterns: [
                /(comparar|compare|diferenca entre|diferença entre|qual e melhor|qual é melhor|versus|vs\.?|ou o|ou a|diferencia entre|cu[aá]l es mejor|להשוות|מול)/i,
              ],
            },
            {
              intent: "category_filtered",
              confidence: 0.9,
              patterns: [
                /(barato|economico|econômico|em conta|budget|cheap).*(restaurante|pousada|hotel|comida)/i,
                /(luxo|luxury|premium|top|melhor).*(restaurante|pousada|hotel)/i,
                /(romantico|romântico|casal|couple).*(restaurante|pousada)/i,
                /(familia|família|crianca|criança|kids).*(praia|restaurante|atracao)/i,
                /(frente|beira|perto).*(praia|mar|beach).*(pousada|hotel|restaurante)/i,
                /(restaurante|comida|comer).*(praia|vila|segunda|terceira|quarta)/i,
                /(pousada|hotel).*(praia|vila|segunda|terceira|quarta)/i,
                /(praia).*(calma|tranquila|familia|crianca|snorkel|mergulho)/i,
              ],
            },'''
          replace_once(intent_path, intent_marker, intent_additions + intent_marker)

          router_path = "apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts"
          router_marker = '\nfunction tryOpenCategory(document: Document, message: string): boolean {'
          direct_category = r'''

          const DIRECT_CATEGORY_PREFIXES = Object.freeze([
            "ver ",
            "mostrar ",
            "abrir ",
            "explorar ",
            "quero ",
            "quero ver ",
            "show ",
            "open ",
            "explore ",
            "quiero ",
            "quiero ver ",
          ]);

          function directCategoryForMessage(message: string): string | null {
            const normalizedMessage = normalizeAssistantMenuCommand(message);
            if (!normalizedMessage) return null;
            const candidates = new Set<string>([normalizedMessage]);
            for (const prefix of DIRECT_CATEGORY_PREFIXES) {
              if (normalizedMessage.startsWith(prefix)) {
                const remainder = normalizedMessage.slice(prefix.length).trim();
                if (remainder) candidates.add(remainder);
              }
            }

            for (const [category, aliases] of Object.entries(CATEGORY_ALIASES)) {
              for (const rawAlias of aliases) {
                const alias = normalizeAssistantMenuCommand(rawAlias);
                if (alias && candidates.has(alias)) return category;
              }
            }
            return null;
          }'''
          replace_once(router_path, router_marker, direct_category + router_marker)
          router = Path(router_path)
          router_text = router.read_text()
          old_category_call = "const category = categoryForMessage(message);"
          if router_text.count(old_category_call) != 2:
              raise SystemExit(
                  f"expected two direct menu category sites, found {router_text.count(old_category_call)}"
              )
          router.write_text(
              router_text.replace(
                  old_category_call,
                  "const category = directCategoryForMessage(message);",
              )
          )

          runtime_path = "apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts"
          replace_once(
              runtime_path,
              '  type AssistantDialogResponse,\n} from "@touristic/assistant";',
              '  type AssistantDialogResponse,\n  type AssistantInterestCategory,\n} from "@touristic/assistant";',
          )
          replace_once(
              runtime_path,
              'import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";',
              'import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";\nimport { createAssistantV1IntelligenceHandlers } from "./assistant-v1-intelligence-adapter.js";',
          )
          awaiting_marker = '''const CONTROLLER_OWNED_AWAITING_TYPES = new Set([
            "awaiting_place",
            "awaiting_category",
            "awaiting_destination",
          ]);'''
          interest_helper = awaiting_marker + r'''

          function toProfileInterestCategory(
            value: string | null,
          ): AssistantInterestCategory | null {
            switch (value) {
              case "beaches":
              case "restaurants":
              case "hotels":
              case "shops":
              case "attractions":
              case "nightlife":
              case "tours":
              case "emergencies":
                return value;
              default:
                return null;
            }
          }'''
          replace_once(runtime_path, awaiting_marker, interest_helper)
          replace_once(
              runtime_path,
              '  const controller = createAssistantDialogController({',
              '  const intelligenceHandlers = createAssistantV1IntelligenceHandlers({\n    profile,\n  });\n  const controller = createAssistantDialogController({',
          )
          replace_once(
              runtime_path,
              '      ...domainHandlers,\n      ...navigationHandlers,',
              '      ...domainHandlers,\n      ...intelligenceHandlers,\n      ...navigationHandlers,',
          )
          replace_once(
              runtime_path,
              '    if (menuRouted) {\n      currentPresentation = null;',
              '    if (menuRouted) {\n      const routedState = readExploreState();\n      profile.recordInteraction(\n        value,\n        toProfileInterestCategory(routedState.category),\n      );\n      currentPresentation = null;',
          )

          intelligence_path = "apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts"
          replace_once(
              intelligence_path,
              '''  createAssistantUserProfileManager,
            getAssistantMainMenu,
            getAssistantSmartRecommendation,''',
              '''  createAssistantProactiveSuggestionEngine,
            createAssistantUserProfileManager,
            getAssistantContextualMenu,
            getAssistantMainMenu,
            getAssistantSmartRecommendation,''',
          )
          replace_once(
              intelligence_path,
              '    "getUserProfile" | "getRecentPlaces"\n',
              '    "getUserProfile" | "getRecentPlaces" | "getTopInterests"\n',
          )
          function_marker = '''export function createAssistantV1IntelligenceHandlers(
            options: AssistantV1IntelligenceAdapterOptions,
          ): Partial<Record<string, AssistantDialogIntentHandler>> {
            return {'''
          function_replacement = r'''export function createAssistantV1IntelligenceHandlers(
            options: AssistantV1IntelligenceAdapterOptions,
          ): Partial<Record<string, AssistantDialogIntentHandler>> {
            const proactiveEngine = createAssistantProactiveSuggestionEngine({
              ...(options.now ? { now: options.now } : {}),
            });
            const greeting: AssistantDialogIntentHandler = (request) => {
              const now = options.now?.() ?? Date.now();
              const profile = options.profile.getUserProfile();
              const recentPlaces = options.profile
                .getRecentPlaces(5)
                .filter(
                  (place): place is typeof place & { timestamp: number } =>
                    typeof place.timestamp === "number",
                )
                .map((place) => ({
                  name: place.name,
                  category: place.category,
                  timestamp: place.timestamp,
                }));
              const hour = new Date(now).getHours();
              const locale = languageFor(request);
              const menu = getAssistantContextualMenu({
                locale,
                hour,
                profile,
                topInterests: options.profile.getTopInterests(3),
                recentPlaces,
              });
              const suggestion = proactiveEngine.getSuggestion({
                hour,
                profile,
                recentPlaces,
                now,
              });
              return {
                text: menu.intro,
                options: menu.buttons.map((button) => ({
                  label: button.label,
                  value: button.value.startsWith("[place]")
                    ? button.value.slice("[place]".length)
                    : button.value,
                })),
                metadata: {
                  domain: "proactive",
                  state: "contextual_menu",
                  suggestion: suggestion?.type ?? null,
                  priority: suggestion?.priority ?? null,
                },
              };
            };

            return {
              greeting,'''
          replace_once(intelligence_path, function_marker, function_replacement)
          PY

      - name: Canonical Prettier normalization
        run: |
          pnpm exec prettier --write \
            packages/assistant/src/intent-engine.ts \
            packages/assistant/src/intent-engine-v1-intelligence.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-v1-intelligence-adapter.test.ts

      - name: Validate focused assistant packages
        run: |
          pnpm --filter @touristic/assistant test
          pnpm --filter @touristic/assistant typecheck
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck

      - name: Remove one-shot workflow and commit reconciliation
        run: |
          rm .github/workflows/assistant-intelligence-reconcile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(assistant): reconcile V1 intelligence runtime"
          git push origin HEAD:fix/assistant-v1-runtime-intelligence-completion
