name: Temporary format Map Controls PR 292

on:
  push:
    branches:
      - fix/map-layer-toggle-controls-20260923

permissions:
  contents: write

jobs:
  format-map-controls:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-layer-toggle-controls-20260923
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/browser-entry.ts apps/morro-digital-platform/src/ux/shared-components-v2-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/browser-entry.ts apps/morro-digital-platform/src/ux/shared-components-v2-contract.test.ts
          git commit -m "style(map): apply prettier formatting"
          git push origin HEAD:fix/map-layer-toggle-controls-20260923
