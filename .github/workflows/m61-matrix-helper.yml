name: M61 matrix helper
on:
  push:
    branches: [feat/business-m61-commercial-conversion-handoff]
    paths: [.github/workflows/m61-matrix-helper.yml]
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m61-commercial-conversion-handoff
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Update matrix conservatively
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('docs/migration/BUSINESS-MIGRATION-MATRIX.md')
          text = path.read_text()
          replacements = [
            ('# Business Portal — Migration Matrix (M60 partner workspace sandbox parity)', '# Business Portal — Migration Matrix (M61 commercial conversion handoff parity)'),
            ('After M60, `FEATURE-0005` remains `baseline-pending`, but the Business-owned onboarding now includes the frozen recommendation, profile and partner-workspace tutorial contracts. M60 adds session-only event summaries, sandbox promotion creation and a partner-panel projection while preserving the centralized Auth boundary: the protected dashboard is never embedded or bypassed. Production analytics remain unavailable, wider live Business runtime is still partial, and commercial conversion/Payments stay outside this milestone.', 'After M61, `FEATURE-0005` remains `baseline-pending`, but every currently classified Business-owned migration contract is now at least partially represented in V2. M61 closes the commercial-conversion GAP with plan recommendation, contractor/consent preparation and an explicit checkout handoff while preserving Payments ownership of transaction execution and financial verification. Production profile breadth, wider live Business runtime and broader Business browser behavior remain partial; checkout stays outside Business ownership.'),
            ('| Contract                                | Frozen V1 evidence                                                    | V2 evidence at M60', '| Contract                                | Frozen V1 evidence                                                    | V2 evidence at M61'),
            ('explicit runtime-context allowlist including M58-M60 tutorial results', 'explicit runtime-context allowlist including M58-M61 tutorial/commercial results'),
            ('| Commercial conversion adapter           | `business-commercial-conversion-adapter.js`                           | no Business conversion port                                                                                                                                                                   | GAP     | Keep payments/subscriptions outside Business ownership.                                                                                                   |', '| Commercial conversion adapter           | `business-commercial-conversion-adapter.js`                           | M61 ports plan recommendation, contractor/consent preparation, immutable commercial draft and an explicit Payments handoff; verified same-session payment signals are consumed fail-closed     | PASS    | Keep payment/subscription execution in `FEATURE-0009`; Business owns only commercial preparation and handoff.                                            |'),
            ('full 28-step presentation remains browser-tested; M59 adds profile preview and M60 adds sandbox promotion plus partner-session summary controls', 'full 28-step presentation remains browser-tested; M59 adds profile preview, M60 adds partner workspace controls and M61 adds the commercial preparation form/payment-ownership disclosure'),
            ('## M60 score\n\n- `PASS`: 15\n- `PARTIAL`: 3\n- `GAP`: 1\n- `N/A`: 1', '## M61 score\n\n- `PASS`: 16\n- `PARTIAL`: 3\n- `GAP`: 0\n- `N/A`: 1'),
            ('M60 promotes `Partner workspace adapter` from `GAP` to `PASS`. The frozen V1 audit confirmed two active Business-owned behaviors: a workspace summary derived from tutorial-session events and a demo-promotion loop that remains inside the sandbox. V2 now reproduces both without restoring the V1 global/iframe coupling.\n\n`@touristic/business/onboarding-workspace` owns the immutable event vocabulary, normalized session-summary projection, category-aware promotion defaults and sandbox promotion construction. Promotion state is always `environment: "sandbox"`, `publishable: false`, tutorial-only and excluded from Business metrics. The runtime records only the frozen tutorial signals already produced by existing onboarding effects.\n\nThe `promotions` step renders an editable demonstration form and persists only `businessDemoPromotion`. The `partner-panel` step builds a workspace snapshot from `businessTutorialEventSummary` and renders that isolated summary. The dashboard action emits an explicit handoff to the existing protected Business dashboard with `requiresAuthentication: true`; no iframe, credential, cookie, CSRF bypass or synthetic Auth session is introduced.\n\nThe permanent Workspace Browser Contract proves the full browser loop in Chromium: edited promotion submission, sandbox/non-publishable boundary, event-summary increment, workspace rendering, absence of dashboard iframe and authenticated handoff. Route and Profile Browser import maps were extended for the new package subpath and remain regression targets.\n\n`Business profile behavior` remains `PARTIAL` because production profile persistence breadth is not completed by M60. `Live Business runtime` remains `PARTIAL` because production analytics and other frozen runtime breadth are still incomplete. `Commercial conversion adapter` remains the only Business-owned `GAP`, and Payments/checkout remains separately owned.', 'M61 promotes `Commercial conversion adapter` from `GAP` to `PASS`. The frozen V1 audit separates Business-owned commercial preparation from Payments-owned execution: Business recommends a plan, collects contractor data and required legal acceptances, then hands a normalized payload to checkout. Payment is never considered confirmed from the request itself.\n\n`@touristic/business/onboarding-commercial` owns the immutable plan vocabulary, objective-based recommendation, contractor sanitization, versioned Terms/Privacy acceptance, optional marketing consent, checkout-handoff construction and same-correlation verification gate. The onboarding runtime persists only explicit M61 keys and dispatches `businessCheckoutRequested` with `requiresPaymentProvider: true`.\n\nThe `finish` step renders the commercial preparation form and states that no payment is executed there. The handoff correlation derives from the onboarding workflow creation time and is not an Auth credential or proof of payment. A future Payments-owned implementation must execute checkout and emit a trustworthy verification signal. Wrong-session or unverified signals are rejected; only a verified same-correlation signal produces `businessCommercialActivationReady`.\n\nThe permanent Commercial Browser Contract proves the full boundary in Chromium: `events` recommends `performance`, contractor input is sanitized, required consents are persisted, the checkout request contains no synthetic payment success, wrong/unverified confirmations fail closed and exactly one verified same-correlation confirmation is accepted.\n\n`Business profile behavior`, `Live Business runtime` and broader `Business domain/browser behavior` remain `PARTIAL`. `Checkout client` remains `N/A` for Business because provider/payment execution belongs to `FEATURE-0009`. M61 therefore reaches zero Business-owned GAPs without claiming full Business equivalence.'),
            ('`BUSINESS-M60-EVIDENCE.md`, `onboarding-workspace.test.ts`, the expanded `onboarding-context.test.ts` and the permanent Business Onboarding Workspace Browser Contract prove session-only event summaries, sandbox promotion creation, partner-panel rendering, metric exclusion, absence of iframe/Auth bypass and an explicit authenticated dashboard handoff.\n\nThe official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route, Onboarding Profile, Onboarding Workspace and Navigation Accessibility regressions must remain green on the final permanent M60 head.', '`BUSINESS-M60-EVIDENCE.md`, `onboarding-workspace.test.ts`, the expanded `onboarding-context.test.ts` and the permanent Business Onboarding Workspace Browser Contract prove session-only event summaries, sandbox promotion creation, partner-panel rendering, metric exclusion, absence of iframe/Auth bypass and an explicit authenticated dashboard handoff.\n\n`BUSINESS-M61-EVIDENCE.md`, `onboarding-commercial.test.ts`, the expanded runtime-context allowlist and the permanent Business Onboarding Commercial Browser Contract prove plan recommendation, contractor/consent preparation, payment-provider handoff, absence of synthetic financial confirmation and fail-closed same-correlation verification.\n\nThe official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route, Onboarding Profile, Onboarding Workspace, Onboarding Commercial and Navigation Accessibility regressions must remain green on the final permanent M61 head.'),
            ('M61 should audit the frozen `Commercial conversion adapter` call sites before implementation. It is now the only remaining Business-owned `GAP`, but the audit must separate Business handoff/orchestration from payment, subscription and checkout execution owned by `FEATURE-0009`.\n\nProduction profile breadth and `Live Business runtime` remain `PARTIAL`; neither should be promoted until executable frozen evidence proves the missing production behavior. Analytics endpoints must not be invented merely to increase the migration score.', 'M62 should audit the remaining `PARTIAL` contracts from frozen production V1 call sites, prioritizing the smallest observable production behavior that can be ported without inventing analytics or weakening Auth/Payments ownership.\n\nProduction profile breadth, wider `Live Business runtime` and broader Business browser behavior must not be promoted until executable frozen evidence proves their missing production behavior. Zero GAPs at M61 does not make `FEATURE-0005` equivalent while these PARTIAL contracts remain.')
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing expected matrix text: {old[:100]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M61-EVIDENCE.md
      - name: Commit matrix and evidence formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M61-EVIDENCE.md
          git commit -m "docs(business): consolidate M61 migration evidence" || exit 0
          git push
