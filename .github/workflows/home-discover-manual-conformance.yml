name: Home Discover Manual Conformance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/home-discover-manual-conformance.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/home/**
      - apps/morro-digital-platform/src/map/**
      - apps/morro-digital-platform/src/onboarding/public-interactive-tour.ts
      - apps/morro-digital-platform/src/ux/home-*.test.ts
      - apps/morro-digital-platform/public/tourist-shell-v2.css
      - apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs
      - apps/morro-digital-platform/tooling/assistant-voice-*.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-discover-manual:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/home-discover-manual

      - name: Build workspace
        run: pnpm -w build

      - name: Recover pre-convergence manual-authority evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/home-discover-manual/before-authority
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10678501691/zip" \
            > /tmp/home-authority-before.zip
          unzip -q /tmp/home-authority-before.zip \
            -d /tmp/home-discover-manual/before-authority
          mkdir -p /tmp/home-discover-manual/before-mapbox
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10677849264/zip" \
            > /tmp/home-mapbox-before.zip
          unzip -q /tmp/home-mapbox-before.zip \
            -d /tmp/home-discover-manual/before-mapbox
          printf '%s\n' \
            'Before sources: PR #250 artifacts 10678501691 (manual authority) and 10677849264 (Mapbox visual evidence).' \
            > /tmp/home-discover-manual/before-authority-source.txt

      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || {
            echo 'MAPBOX_PUBLIC_TOKEN_CI missing'
            exit 1
          }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs \
            >/tmp/home-discover-manual/server.log 2>&1 &
          echo $! >/tmp/home-discover-manual/server.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/home-discover-manual/server.log
          exit 1

      - name: Validate Home / Discover against manual authority
        run: node apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs

      - name: Show server diagnostics
        if: failure()
        run: cat /tmp/home-discover-manual/server.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: home-discover-manual-conformance
          path: /tmp/home-discover-manual
          retention-days: 14
          if-no-files-found: error
