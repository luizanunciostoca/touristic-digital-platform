name: PR248 Assistant formatter

on:
  push:
    branches:
      - feat/assistant-runtime-client-cancellation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-client-cancellation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Assistant runtime and remove helper
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-api.mjs
          rm .github/workflows/pr248-format.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/assistant-api.mjs .github/workflows/pr248-format.yml
          git commit -m "style(assistant): apply canonical formatting"
          git push origin HEAD:feat/assistant-runtime-client-cancellation
