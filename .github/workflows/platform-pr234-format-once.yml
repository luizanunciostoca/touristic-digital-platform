name: Platform PR234 Format Once

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/platform-pr234-format-once.yml"
      - "packages/core/src/runtime.ts"
      - "packages/core/src/runtime.test.ts"
      - "apps/morro-digital-platform/src/config/tour-selection.ts"

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.number == 234 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/core/src/runtime.ts \
            packages/core/src/runtime.test.ts \
            apps/morro-digital-platform/src/config/tour-selection.ts
          rm .github/workflows/platform-pr234-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/runtime.ts packages/core/src/runtime.test.ts apps/morro-digital-platform/src/config/tour-selection.ts .github/workflows/platform-pr234-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(platform): apply canonical formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
