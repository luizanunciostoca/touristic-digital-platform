name: Temporary Affiliate Matrix Format

on:
  push:
    branches:
      - fix/affiliates-privacy-lgpd-20260823
    paths:
      - ".github/workflows/temp-affiliate-matrix-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/affiliates-privacy-lgpd-20260823
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/AFFILIATES-MIGRATION-MATRIX.md
      - name: Commit formatted matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/AFFILIATES-MIGRATION-MATRIX.md
          if ! git diff --cached --quiet; then
            git commit -m "style(affiliates): format migration matrix"
            git push origin HEAD:fix/affiliates-privacy-lgpd-20260823
          fi
