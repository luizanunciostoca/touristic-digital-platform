name: M42 Refine Domain Wiring Once
on:
  push:
    branches: [feat/search-m42-browser-integration]
    paths: [.github/workflows/m42-refine-domain-wiring-once.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m42-browser-integration
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Move Search handler ownership to domain adapter
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts')
          s=p.read_text()
          anchor='import { fetchMorroWeather } from "../weather/weather-widget.js";\n'
          if anchor not in s: raise SystemExit('import anchor missing')
          s=s.replace(anchor, anchor+'import { createAssistantSearchHandler } from "./assistant-search-adapter.js";\n', 1)
          old='  return createAssistantDomainHandlers({\n'
          if old not in s: raise SystemExit('return anchor missing')
          s=s.replace(old, '  const domainHandlers = createAssistantDomainHandlers({\n', 1)
          tail='''    },\n  });\n}\n'''
          replacement='''    },\n  });\n\n  return {\n    ...domainHandlers,\n    place_search: createAssistantSearchHandler({\n      ...(options.fetch ? { fetch: options.fetch } : {}),\n      ...(options.mapboxAccessToken\n        ? { mapboxAccessToken: options.mapboxAccessToken }\n        : {}),\n    }),\n  };\n}\n'''
          if not s.endswith(tail): raise SystemExit('tail anchor missing')
          p.write_text(s[:-len(tail)] + replacement)
          PY
          pnpm prettier --write apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts
      - name: Commit refinement and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/m42-refine-domain-wiring-once.yml
          git add apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
          git commit -m "refactor(search): own place search in domain adapter"
          git push origin HEAD:feat/search-m42-browser-integration
