name: Prepare NAV-08 Temp

on:
  push:
    branches:
      - feat/navigation-app-composition
    paths:
      - .github/workflows/navigation-nav08-prepare-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-app-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Apply canonical formatter output
        run: pnpm exec prettier --write apps/morro-digital-platform/package.json apps/morro-digital-platform/src/navigation/navigation-composition.ts apps/morro-digital-platform/src/navigation/navigation-composition.test.ts pnpm-lock.yaml
      - name: Commit prepared files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/package.json apps/morro-digital-platform/src/navigation/navigation-composition.ts apps/morro-digital-platform/src/navigation/navigation-composition.test.ts pnpm-lock.yaml
          git commit -m "chore: prepare NAV-08 workspace integration"
          git push origin HEAD:feat/navigation-app-composition
