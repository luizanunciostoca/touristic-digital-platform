name: Temporary M146 Cleanup Order Fix

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-cleanup-order-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Respect M146 foreign-key cleanup order
        run: |
          python3 -c 'from pathlib import Path; p=Path("services/financial/src/mysql-integration.test.ts"); s=p.read_text(); old="    await pool.query(\"DROP TRIGGER IF EXISTS financial_test_fail_posting\");\n    await pool.query(\"DELETE FROM financial_reconciliation_run_findings\");"; new="    await pool.query(\"DROP TRIGGER IF EXISTS financial_test_fail_posting\");\n    await pool.query(\"DELETE FROM financial_settlements\");\n    await pool.query(\"DELETE FROM financial_payables\");\n    await pool.query(\"DELETE FROM financial_allocations\");\n    await pool.query(\"DELETE FROM financial_reconciliation_run_findings\");"; assert old in s; s=s.replace(old,new,1); s=s.replace("    await pool.query(\"DELETE FROM financial_payments\");\n    await pool.query(\"DELETE FROM financial_payment_idempotency\");", "    await pool.query(\"DELETE FROM financial_payment_idempotency\");\n    await pool.query(\"DELETE FROM financial_payments\");", 1); p.write_text(s)'
          pnpm exec prettier --write services/financial/src/mysql-integration.test.ts
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/financial-server test:integration
          git diff --check
      - name: Commit cleanup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/financial/src/mysql-integration.test.ts
          git commit -m "test(payments): isolate legacy MySQL cleanup from M146"
          git push origin HEAD:feat/payments-m146-settlement
