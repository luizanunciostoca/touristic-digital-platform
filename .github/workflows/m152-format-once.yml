name: M152 Format Once

on:
  pull_request:
    paths:
      - "services/financial/src/provider-retry.ts"
      - "services/financial/src/provider-retry.test.ts"
      - "services/financial/src/provider-retry-composition.test.ts"
      - ".github/workflows/m152-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting
        run: |
          pnpm exec prettier services/financial/src/provider-retry.ts services/financial/src/provider-retry.test.ts services/financial/src/provider-retry-composition.test.ts --write
          if git diff --quiet -- services/financial/src/provider-retry.ts services/financial/src/provider-retry.test.ts services/financial/src/provider-retry-composition.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/financial/src/provider-retry.ts services/financial/src/provider-retry.test.ts services/financial/src/provider-retry-composition.test.ts
          git commit -m "style(financial): apply canonical M152 formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
