name: Place Wave Prettier Helper

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/place-wave-prettier-helper.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format wave files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts \
            apps/morro-digital-platform/src/map/place-bottom-sheet.ts \
            apps/morro-digital-platform/src/ux/place-search-explore-v2-contract.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
      - name: Emit canonical contents
        run: |
          for file in \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts \
            apps/morro-digital-platform/src/map/place-bottom-sheet.ts \
            apps/morro-digital-platform/src/ux/place-search-explore-v2-contract.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
          do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
