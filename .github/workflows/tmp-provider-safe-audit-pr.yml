name: Temporary Provider Safe Audit PR Patch

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-provider-safe-audit-pr.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/payments-provider-safe-audit-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/payments-provider-safe-audit-20260822
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and validate safe provider audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'apps/morro-digital-platform/tooling/payments-api.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const anchor = `function runtimeAudit(defaultAudit, event) {
            try {
              defaultAudit(Object.freeze({ ...event }));
            } catch {
              // Audit delivery must not expose request internals or mutate the checkout.
            }
          }

          export function createPaymentsApi({`;
          const replacement = `function runtimeAudit(defaultAudit, event) {
            try {
              defaultAudit(Object.freeze({ ...event }));
            } catch {
              // Audit delivery must not expose request internals or mutate the checkout.
            }
          }

          const safeCheckoutProviderFailureReasons = Object.freeze({
            MERCADO_PAGO_TEST_ACCOUNT_REQUIRED: "test_account_required",
            MERCADO_PAGO_REJECTED: "provider_rejected",
            MERCADO_PAGO_UNAVAILABLE: "provider_unavailable",
            MERCADO_PAGO_INVALID_RESPONSE: "provider_invalid_response",
            MERCADO_PAGO_INVALID_REQUEST: "provider_invalid_request",
          });

          export function createAuditedCheckoutProvider(provider, audit = () => {}) {
            if (!provider || typeof provider.createCheckout !== "function") {
              throw new Error("PAYMENTS_CHECKOUT_PROVIDER_REQUIRED");
            }
            return Object.freeze({
              async createCheckout(input) {
                try {
                  return await provider.createCheckout(input);
                } catch (error) {
                  const code = error !== null && typeof error === "object" && typeof error.code === "string" ? error.code : "";
                  const reason = safeCheckoutProviderFailureReasons[code];
                  if (reason) runtimeAudit(audit, { action: "checkout.provider", result: "failure", reason });
                  throw error;
                }
              },
            });
          }

          export function createPaymentsApi({`;
          if (!source.includes(anchor)) throw new Error('AUDIT_ANCHOR_NOT_FOUND');
          source = source.replace(anchor, replacement);
          const providerAnchor = '        provider: createSandboxCheckoutProviderFromEnvironment(environment),';
          const providerReplacement = `        provider: createAuditedCheckoutProvider(
                  createSandboxCheckoutProviderFromEnvironment(environment),
                  audit,
                ),`;
          if (!source.includes(providerAnchor)) throw new Error('PROVIDER_ANCHOR_NOT_FOUND');
          source = source.replace(providerAnchor, providerReplacement);
          fs.writeFileSync(file, source);
          fs.writeFileSync('apps/morro-digital-platform/tooling/payments-provider-safe-audit.test.mjs', `import { describe, expect, it } from "vitest";

          import { createAuditedCheckoutProvider } from "./payments-api.mjs";

          describe("payments provider safe audit", () => {
            it("projects only allowlisted provider failure codes into audit", async () => {
              const audits = [];
              const error = Object.assign(new Error("must-not-be-logged"), { code: "MERCADO_PAGO_TEST_ACCOUNT_REQUIRED", secret: "must-not-be-logged" });
              const provider = createAuditedCheckoutProvider({ createCheckout: () => Promise.reject(error) }, (event) => audits.push(event));
              await expect(provider.createCheckout({})).rejects.toBe(error);
              expect(audits).toEqual([{ action: "checkout.provider", result: "failure", reason: "test_account_required" }]);
              expect(JSON.stringify(audits)).not.toContain("must-not-be-logged");
            });
            it("does not project unknown provider errors", async () => {
              const audits = [];
              const error = Object.assign(new Error("opaque"), { code: "UNKNOWN_PROVIDER_CODE" });
              const provider = createAuditedCheckoutProvider({ createCheckout: () => Promise.reject(error) }, (event) => audits.push(event));
              await expect(provider.createCheckout({})).rejects.toBe(error);
              expect(audits).toEqual([]);
            });
          });
          `);
          NODE
          pnpm exec prettier --write apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/payments-provider-safe-audit.test.mjs
          pnpm exec vitest run apps/morro-digital-platform/tooling/payments-provider-safe-audit.test.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/payments-api.mjs apps/morro-digital-platform/tooling/payments-provider-safe-audit.test.mjs
          git commit -m "fix(payments): audit provider failures safely"
          git push origin HEAD:fix/payments-provider-safe-audit-20260822
