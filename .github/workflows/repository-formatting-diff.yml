name: Repository Formatting Diff

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repository-formatting-diff.yml"
  push:
    branches:
      - fix/ci-governance-crm-path-contract
    paths:
      - ".github/workflows/repository-formatting-diff.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ci-governance-crm-path-contract
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate reviewed formatting patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            .github/workflows/business-dashboard-browser-contract.yml \
            .github/workflows/business-live-runtime-browser-contract.yml \
            .github/workflows/business-onboarding-adapter-browser-contract.yml \
            .github/workflows/business-onboarding-browser-contract.yml \
            .github/workflows/business-onboarding-commercial-browser-contract.yml \
            .github/workflows/business-onboarding-lifecycle-browser-contract.yml \
            .github/workflows/business-onboarding-profile-browser-contract.yml \
            .github/workflows/business-onboarding-route-browser-contract.yml \
            .github/workflows/business-onboarding-workspace-browser-contract.yml \
            .github/workflows/business-production-profile-browser-contract.yml \
            .github/workflows/crm-equivalence-browser-contract.yml \
            .github/workflows/crm-lead-detail-browser-contract.yml \
            .github/workflows/navigation-visual-baseline.yml \
            apps/morro-digital-platform/tooling/payments-migrate.mjs \
            apps/morro-digital-platform/tooling/platform-operations.mjs \
            docs/qa/MORRO-DIGITAL-V2-FINAL-GO-NO-GO-2026-08-18.md \
            services/affiliates/src/affiliate-adapters.ts \
            services/affiliates/src/mysql-affiliate-persistence.ts \
            services/auth/src/security-state.test.ts \
            services/financial/src/index.ts \
            services/financial/src/mercado-pago-provider.test.ts \
            services/financial/src/mercado-pago-provider.ts \
            services/financial/src/mercado-pago-webhook-authenticator.ts \
            services/financial/src/webhook-http-transport.ts \
            tooling/payments/mercado-pago-provider-preflight.mjs \
            tooling/payments/render-v2-smoke.mjs \
            tooling/quality/check-ci-governance.mjs \
            tooling/quality/check-environment-reconciliation.mjs \
            tooling/quality/check-workflow-supply-chain.mjs
          git diff --check
          git diff --binary > formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-formatting-patch
          path: formatting.patch
          if-no-files-found: error
          retention-days: 1
