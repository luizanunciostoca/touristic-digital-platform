name: Temporary PR74 Secondary Actions Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-pr74-secondary-actions-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-place-action-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic secondary-action remediation
        run: |
          python <<'PY'
          from pathlib import Path

          adapter = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts')
          tests = Path('apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts')
          source = adapter.read_text()
          spec = tests.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '  | "restaurant_contact"\n  | "accommodation_rooms"',
              '  | "restaurant_contact"\n  | "restaurant_reviews"\n  | "accommodation_rooms"',
              'restaurant_reviews union',
          )
          source = replace_once(
              source,
              '  | "accommodation_booking"\n  | "tour_booking"',
              '  | "accommodation_booking"\n  | "accommodation_share"\n  | "tour_booking"',
              'accommodation_share union',
          )
          source = replace_once(
              source,
              '  accommodation_rooms: {',
              '''  restaurant_reviews: {\n    pt: "Ainda não há avaliações cadastradas para este restaurante.",\n    en: "No reviews are registered for this restaurant yet.",\n    es: "Aún no hay reseñas registradas para este restaurante.",\n    he: "עדיין אין ביקורות רשומות למסעדה זו.",\n  },\n  accommodation_rooms: {''',
              'restaurant_reviews copy',
          )
          source = replace_once(
              source,
              '  tour_booking: {',
              '''  accommodation_share: {\n    pt: "O compartilhamento desta hospedagem ainda não está disponível no assistente.",\n    en: "Sharing this accommodation is not available in the assistant yet.",\n    es: "Compartir este alojamiento aún no está disponible en el asistente.",\n    he: "שיתוף מקום האירוח הזה עדיין אינו זמין בעוזר.",\n  },\n  tour_booking: {''',
              'accommodation_share copy',
          )
          source = replace_once(
              source,
              '''    {\n      aliases: ["contato", "contact", "contacto"],\n      action: "restaurant_contact",\n    },\n  ],\n  hotels: [''',
              '''    {\n      aliases: ["contato", "contact", "contacto"],\n      action: "restaurant_contact",\n    },\n    {\n      aliases: ["avaliacoes", "reviews"],\n      action: "restaurant_reviews",\n    },\n  ],\n  hotels: [''',
              'restaurant_reviews mapping',
          )
          source = replace_once(
              source,
              '''    {\n      aliases: ["reservar", "reserva", "book", "booking"],\n      action: "accommodation_booking",\n    },\n  ],\n  tours: [''',
              '''    {\n      aliases: ["reservar", "reserva", "book", "booking"],\n      action: "accommodation_booking",\n    },\n    {\n      aliases: ["compartilhar", "share"],\n      action: "accommodation_share",\n    },\n  ],\n  tours: [''',
              'accommodation_share mapping',
          )

          spec = replace_once(
              spec,
              '["contato", "Morena Bela", "restaurants", "restaurant_contact"],',
              '["contato", "Morena Bela", "restaurants", "restaurant_contact"],\n    ["avaliações", "Morena Bela", "restaurants", "restaurant_reviews"],',
              'restaurant_reviews test',
          )
          spec = replace_once(
              spec,
              '["reservar", "Pousada Natureza", "hotels", "accommodation_booking"],',
              '["reservar", "Pousada Natureza", "hotels", "accommodation_booking"],\n    ["compartilhar", "Pousada Natureza", "hotels", "accommodation_share"],',
              'accommodation_share test',
          )
          spec = replace_once(
              spec,
              '  it("keeps unavailable transport secondary information explicit", () => {',
              '''  it("keeps review/share secondary actions deterministic and localized", () => {\n    expect(\n      resolve("reviews", "Morena Bela", "restaurants", "en")?.response,\n    ).toMatchObject({\n      text: "No reviews are registered for this restaurant yet.",\n      metadata: { action: "restaurant_reviews", deterministic: true },\n    });\n    expect(\n      resolve("share", "Pousada Natureza", "hotels", "en")?.response,\n    ).toMatchObject({\n      text: "Sharing this accommodation is not available in the assistant yet.",\n      metadata: { action: "accommodation_share", deterministic: true },\n    });\n  });\n\n  it("keeps unavailable transport secondary information explicit", () => {''',
              'localized secondary action test',
          )

          adapter.write_text(source)
          tests.write_text(spec)
          PY
      - name: Format affected source
        run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
      - name: Validate platform assistant remediation
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          git diff --check
      - name: Commit validated remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-action-adapter.test.ts
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'fix(assistant): close deterministic secondary actions'
          git push origin HEAD:fix/assistant-v1-place-action-parity
