name: M42 Add More Info I18n Once

on:
  push:
    branches:
      - feat/search-m42-browser-integration
    paths:
      - .github/workflows/m42-add-more-info-i18n-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m42-browser-integration
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add localized more-info patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/assistant/src/intent-engine.ts')
          text = path.read_text()
          old = '''      /(mais informacoes|mais informações|mais info|detalhes|tell me more|more info|more details|sobre o|sobre a|me fale sobre|fale sobre|o que e|o que é|what is)/i,'''
          new = '''      /(mais informacoes|mais informações|mais info|detalhes|tell me more|more info|more details|sobre o|sobre a|me fale sobre|fale sobre|o que e|o que é|what is|detalles|más información|mas informacion|פרטים|מה זה)/i,'''
          if old not in text:
              raise SystemExit('Expected more_info pattern was not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/assistant/src/intent-engine.ts packages/assistant/src/intent-engine.more-info-i18n.test.ts apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
          pnpm --filter @touristic/assistant test
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m42-add-more-info-i18n-once.yml
          git add packages/assistant/src/intent-engine.ts packages/assistant/src/intent-engine.more-info-i18n.test.ts apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
          git commit -m "fix(search): preserve locale through details selection"
          git push origin HEAD:feat/search-m42-browser-integration
