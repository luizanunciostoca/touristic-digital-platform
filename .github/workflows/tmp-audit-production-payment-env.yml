name: Temporary Audit Production Payment Env

on:
  push:
    branches:
      - ops/audit-production-payment-env-20260924

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/audit-production-payment-env-20260924
          fetch-depth: 0

      - name: Audit Render payment environment without exposing values
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_PRODUCTION_API_KEY"
          test -n "$RENDER_PRODUCTION_SERVICE_ID"

          umask 077
          curl --fail --silent --show-error             --header "Authorization: Bearer $RENDER_PRODUCTION_API_KEY"             --header "Accept: application/json"             "https://api.render.com/v1/services/$RENDER_PRODUCTION_SERVICE_ID/env-vars"             > /tmp/render-env.json

          jq -e 'type == "array"' /tmp/render-env.json >/dev/null

          has_nonempty() {
            local key="$1"
            jq -e --arg key "$key" '
              any(.[]; (.envVar.key // "") == $key and ((.envVar.value // "") | length) > 0)
            ' /tmp/render-env.json >/dev/null
          }

          value_equals() {
            local key="$1"
            local expected="$2"
            jq -e --arg key "$key" --arg expected "$expected" '
              any(.[]; (.envVar.key // "") == $key and (.envVar.value // "") == $expected)
            ' /tmp/render-env.json >/dev/null
          }

          min_length() {
            local key="$1"
            local min="$2"
            jq -e --arg key "$key" --argjson min "$min" '
              any(.[]; (.envVar.key // "") == $key and ((.envVar.value // "") | length) >= $min)
            ' /tmp/render-env.json >/dev/null
          }

          report() {
            local key="$1"
            local status="$2"
            printf 'PAYMENT_ENV_AUDIT %s=%s\n' "$key" "$status"
          }

          if min_length MERCADO_PAGO_ACCESS_TOKEN 32; then report MERCADO_PAGO_ACCESS_TOKEN VALID_PRESENT; else report MERCADO_PAGO_ACCESS_TOKEN MISSING_OR_INVALID; fi
          if min_length MERCADO_PAGO_WEBHOOK_SECRET 16; then report MERCADO_PAGO_WEBHOOK_SECRET VALID_PRESENT; else report MERCADO_PAGO_WEBHOOK_SECRET MISSING_OR_INVALID; fi
          if has_nonempty MERCADO_PAGO_CHECKOUT_ORIGINS; then report MERCADO_PAGO_CHECKOUT_ORIGINS PRESENT; else report MERCADO_PAGO_CHECKOUT_ORIGINS MISSING; fi
          if value_equals MERCADO_PAGO_CHECKOUT_MODE test; then report MERCADO_PAGO_CHECKOUT_MODE TEST; else report MERCADO_PAGO_CHECKOUT_MODE NOT_TEST; fi
          if value_equals PAYMENTS_PROVIDER_MODE mercado_pago; then report PAYMENTS_PROVIDER_MODE MERCADO_PAGO; else report PAYMENTS_PROVIDER_MODE NOT_MERCADO_PAGO; fi
          if value_equals MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED true; then report MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED TRUE; else report MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED NOT_TRUE; fi
          if has_nonempty PAYMENTS_WEBHOOK_URL; then report PAYMENTS_WEBHOOK_URL PRESENT; else report PAYMENTS_WEBHOOK_URL MISSING; fi
          if has_nonempty PAYMENTS_RETURN_URL_ORIGINS; then report PAYMENTS_RETURN_URL_ORIGINS PRESENT; else report PAYMENTS_RETURN_URL_ORIGINS MISSING; fi

          rm -f /tmp/render-env.json

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-audit-production-payment-env.yml
          git commit -m "chore(ci): remove payment environment audit helper"
          git push origin HEAD:ops/audit-production-payment-env-20260924
