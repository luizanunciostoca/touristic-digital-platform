name: M34 Shell Wiring Once

on:
  push:
    branches:
      - feat/assistant-m34-shell-ui-parity

permissions:
  contents: write

jobs:
  wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m34-shell-ui-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply and format M34 wiring
        run: |
          python tooling/m34-shell-wiring-once.py
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-shell-ui.ts \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/layouts/app-shell.ts
      - name: Commit wiring and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m34-shell-wiring-once.yml tooling/m34-shell-wiring-once.py
          git add apps/morro-digital-platform/src
          git commit -m "feat(assistant): wire M34 shell visibility parity"
          git push origin HEAD:feat/assistant-m34-shell-ui-parity
