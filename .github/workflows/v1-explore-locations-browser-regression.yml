name: V1 Explore Locations Browser Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/v1-explore-locations-browser-regression.yml
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/ux/tourist-surface-bottom-sheet.ts
      - apps/morro-digital-platform/src/ux/tourist-bottom-sheet-v2-contract.test.ts
      - apps/morro-digital-platform/public/**
      - packages/geospatial/src/**
      - packages/search/src/**
      - packages/assistant/src/menu.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v1-explore-locations:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/v1-explore-locations
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-explore-locations/server.log 2>&1 &
          echo $! >/tmp/v1-explore-locations/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-explore-locations/server.log
          exit 1
      - name: Validate staged V1 category, filter, map and detail flow
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const viewports = [
            { id: 'mobile', width: 390, height: 844 },
            { id: 'tablet', width: 768, height: 1024 },
            { id: 'desktop', width: 1440, height: 900 },
          ];
          const expectedCounts = {
            beaches: 8,
            restaurants: 45,
            hotels: 35,
            shops: 12,
            transport: 8,
            attractions: 8,
            tours: 6,
            nightlife: 5,
            emergencies: 4,
          };
          const expectedBeachDetailValues = [
            'condições da praia',
            'como chegar',
            'ver fotos',
            'informações',
            'mais opções',
            '[sub]beaches',
          ];
          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          async function openAssistant(page) {
            await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 5000 });
            const assistant = page.locator('#assistant-messages');
            const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
            await quickAction.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await assistant.isVisible())) await quickAction.click();
            await assistant.waitFor({ state: 'visible', timeout: 5000 });
          }

          async function waitMap(page, category, count, stage) {
            await page.locator(`#map[data-explore-state="ready"][data-explore-category="${category}"][data-map-marker-count="${count}"][data-explore-stage="${stage}"]`).waitFor({ state: 'attached', timeout: 8000 });
          }

          async function assertFiltersStage(page, category, count) {
            await page.locator(`#assistant-category-results[data-category="${category}"][data-stage="filters"]`).waitFor({ state: 'visible', timeout: 5000 });
            await waitMap(page, category, count, 'filters');
            const state = await page.evaluate(() => {
              const main = document.querySelector('.assistant-options:has([data-explore-category])');
              const results = document.getElementById('assistant-category-results');
              return {
                mainHidden: Boolean(main?.classList.contains('hidden')),
                mainAriaHidden: main?.getAttribute('aria-hidden'),
                filterCount: results?.querySelectorAll('[data-explore-action]').length ?? 0,
                locationCount: results?.querySelectorAll('[data-location-name]').length ?? 0,
              };
            });
            if (!state.mainHidden || state.mainAriaHidden !== 'true' || state.filterCount < 2 || state.locationCount !== 0) {
              throw new Error(`V1 filter stage diverged for ${category}: ${JSON.stringify(state)}`);
            }
          }

          async function assertMainMenu(page) {
            const state = await page.evaluate(() => {
              const main = document.querySelector('.assistant-options:has([data-explore-category])');
              return {
                hidden: Boolean(main?.classList.contains('hidden')),
                ariaHidden: main?.getAttribute('aria-hidden'),
                categories: main?.querySelectorAll('[data-explore-category]').length ?? 0,
                flowExists: Boolean(document.getElementById('assistant-category-results')),
              };
            });
            if (state.hidden || state.ariaHidden === 'true' || state.categories !== 9 || state.flowExists) {
              throw new Error(`Main menu was not restored: ${JSON.stringify(state)}`);
            }
          }

          async function assertTouristSheet(page, surface, expectedState = 'half') {
            const selector =
              `#assistant-messages.md-tourist-surface-sheet[data-sheet-surface="${surface}"][data-sheet-state="${expectedState}"]`;
            const sheet = page.locator(selector);
            await sheet.waitFor({ state: 'visible', timeout: 5000 });
            const handle = sheet.locator('[data-tourist-sheet-handle="true"]');
            await handle.waitFor({ state: 'visible', timeout: 5000 });
            const state = await page.evaluate(() => {
              const assistant = document.getElementById('assistant-messages');
              const handle = assistant?.querySelector('[data-tourist-sheet-handle="true"]');
              const messages = assistant?.querySelector('.messages-area');
              const box = assistant instanceof HTMLElement ? assistant.getBoundingClientRect() : null;
              const style = messages instanceof HTMLElement ? getComputedStyle(messages) : null;
              return {
                surface: assistant?.getAttribute('data-sheet-surface'),
                sheetState: assistant?.getAttribute('data-sheet-state'),
                bodySurface: document.body.getAttribute('data-md-tourist-sheet-surface'),
                bodyState: document.body.getAttribute('data-md-tourist-sheet-state'),
                expanded: handle?.getAttribute('aria-expanded'),
                controls: handle?.getAttribute('aria-controls'),
                handleHeight: handle instanceof HTMLElement ? handle.getBoundingClientRect().height : 0,
                overscroll: style?.overscrollBehavior,
                rect: box
                  ? { left: box.left, top: box.top, right: box.right, bottom: box.bottom }
                  : null,
                viewport: { width: innerWidth, height: innerHeight },
              };
            });
            if (
              state.surface !== surface ||
              state.sheetState !== expectedState ||
              state.bodySurface !== surface ||
              state.bodyState !== expectedState ||
              state.controls !== 'assistant-messages' ||
              state.handleHeight < 44 ||
              !state.rect ||
              state.rect.left < -1 ||
              state.rect.right > state.viewport.width + 1 ||
              state.rect.top < -1 ||
              state.rect.bottom > state.viewport.height + 1 ||
              state.overscroll !== 'contain'
            ) {
              throw new Error(`Tourist Bottom Sheet V2 drifted: ${JSON.stringify(state)}`);
            }
            return { sheet, handle, state };
          }

          async function waitForSelectedMapCamera(page, longitude, latitude) {
            const deadline = Date.now() + 6000;
            let last = null;
            while (Date.now() < deadline) {
              last = await page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                const center = map?.getCenter?.();
                return center
                  ? { lng: center.lng, lat: center.lat, zoom: map?.getZoom?.() }
                  : null;
              });
              if (
                last &&
                Math.abs(last.lng - longitude) < 0.001 &&
                Math.abs(last.lat - latitude) < 0.001 &&
                typeof last.zoom === 'number' &&
                Math.abs(last.zoom - 16) < 0.05
              ) {
                return last;
              }
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`Selected location did not reach the V1 camera: ${JSON.stringify(last)}`);
          }

          async function readDynamicOptionValues(page) {
            return page.evaluate(() => {
              const containers = Array.from(document.querySelectorAll('.assistant-options'));
              const dynamic = containers.find(container =>
                !container.querySelector('[data-explore-category]') &&
                container.id !== 'assistant-category-results'
              );
              return dynamic
                ? Array.from(dynamic.querySelectorAll('.assistant-option-btn'), button => button.getAttribute('data-value'))
                : [];
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport,
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              const mapboxHttpErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('mapbox.com') && response.status() >= 400) {
                  mapboxHttpErrors.push({ status: response.status() });
                }
              });
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(weather),
              }));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-mode="real"][data-map-marker-count="0"]').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('#loading-overlay.fade-out').waitFor({ state: 'attached', timeout: 5000 });
              await openAssistant(page);
              await assertMainMenu(page);

              for (const [category, count] of Object.entries(expectedCounts)) {
                await page.locator(`#assistant-category-${category}`).click();
                await assertFiltersStage(page, category, count);
                await page.keyboard.press('Escape');
                await assertMainMenu(page);
              }

              const beaches = page.locator('#assistant-category-beaches');
              await beaches.click();
              await assertFiltersStage(page, 'beaches', 8);

              await page.locator('#assistant-category-results [data-value="surf"]').click();
              await page.locator('#assistant-category-results[data-stage="places"]').waitFor({ state: 'visible' });
              const surfState = await page.evaluate(() => ({
                placeCount: document.querySelectorAll('#assistant-category-results [data-location-name]').length,
                markerCount: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                hasBackFilters: Boolean(document.querySelector('#assistant-category-results [data-value="voltar_filtros"]')),
                mainHidden: Boolean(document.querySelector('.assistant-options:has([data-explore-category])')?.classList.contains('hidden')),
              }));
              if (surfState.placeCount < 1 || surfState.placeCount !== surfState.markerCount || !surfState.hasBackFilters || !surfState.mainHidden) {
                throw new Error(`Surf filter diverged in ${viewport.id}: ${JSON.stringify(surfState)}`);
              }

              await page.locator('#assistant-category-results [data-value="voltar_filtros"]').click();
              await assertFiltersStage(page, 'beaches', 8);

              await page.locator('#assistant-category-results [data-value="ver todos"]').click();
              await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible' });
              await waitMap(page, 'beaches', 8, 'places');

              await page.evaluate(() => {
                globalThis.__exploreSelectedValues = [];
                document.addEventListener('morro:assistant-option-selected', event => {
                  if (event instanceof CustomEvent && typeof event.detail?.value === 'string') {
                    globalThis.__exploreSelectedValues.push(event.detail.value);
                  }
                });
              });

              await page.locator('#assistant-category-results [data-location-name="Primeira Praia"]').click();
              await waitMap(page, 'beaches', 1, 'detail');
              const center = await waitForSelectedMapCamera(page, -38.9142193, -13.3776181);
              await page.locator('.assistant-option-btn[data-value="condições da praia"]').waitFor({ state: 'visible', timeout: 8000 });
              const detailValues = await readDynamicOptionValues(page);
              if (viewport.id === 'mobile') {
                await assertTouristSheet(page, 'place', 'half');
              }

              const selected = await page.evaluate(() => ({
                flowRemoved: !document.getElementById('assistant-category-results'),
                mainHidden: Boolean(document.querySelector('.assistant-options:has([data-explore-category])')?.classList.contains('hidden')),
                selectedValues: globalThis.__exploreSelectedValues,
                markerCount: document.getElementById('map')?.getAttribute('data-map-marker-count'),
                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                popupVisible: Array.from(document.querySelectorAll('.mapboxgl-popup')).some(popup => {
                  const style = getComputedStyle(popup);
                  const rect = popup.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0' && rect.width > 0 && rect.height > 0;
                }),
              }));
              if (
                !selected.flowRemoved ||
                !selected.mainHidden ||
                selected.markerCount !== '1' ||
                selected.activeTour !== null ||
                !selected.selectedValues.includes('Fale sobre Primeira Praia') ||
                selected.popupVisible ||
                JSON.stringify(detailValues) !== JSON.stringify(expectedBeachDetailValues)
              ) {
                throw new Error(`Location detail diverged in ${viewport.id}: ${JSON.stringify({ selected, detailValues })}`);
              }

              await page.locator('.assistant-option-btn[data-value="[sub]beaches"]').click();
              await page.locator('#assistant-category-results[data-stage="places"]').waitFor({ state: 'visible', timeout: 5000 });
              await waitMap(page, 'beaches', 8, 'places');
              const returnedPlaces = await page.locator('#assistant-category-results [data-location-name]').count();
              if (returnedPlaces !== 8) {
                throw new Error(`Detail back did not restore the V1 places list: ${returnedPlaces}`);
              }

              await page.keyboard.press('Escape');
              await assertMainMenu(page);

              if (viewport.id === 'mobile') {
                await page.locator('#assistant-category-beaches').click();
                await assertFiltersStage(page, 'beaches', 8);
                const filterSheet = await assertTouristSheet(page, 'search', 'half');
                await filterSheet.handle.focus();
                await page.keyboard.press('ArrowUp');
                await assertTouristSheet(page, 'search', 'full');
                await page.keyboard.press('Home');
                await assertTouristSheet(page, 'search', 'peek');
                await page.keyboard.press('End');
                await assertTouristSheet(page, 'search', 'full');
                await page.keyboard.press('ArrowDown');
                await assertTouristSheet(page, 'search', 'half');

                const dragBox = await filterSheet.handle.boundingBox();
                if (!dragBox) throw new Error('Tourist sheet handle has no pointer geometry');
                await page.mouse.move(dragBox.x + dragBox.width / 2, dragBox.y + dragBox.height / 2);
                await page.mouse.down();
                await page.mouse.move(dragBox.x + dragBox.width / 2, dragBox.y - 80, { steps: 4 });
                await page.mouse.up();
                await assertTouristSheet(page, 'search', 'full');
                await page.keyboard.press('ArrowDown');
                await assertTouristSheet(page, 'search', 'half');

                await page.locator('#assistant-category-results [data-value="proximo"]').click();
                await page.locator('#assistant-category-results[data-stage="places"]').waitFor({ state: 'visible' });
                const nearby = await page.evaluate(() => ({
                  places: document.querySelectorAll('#assistant-category-results [data-location-name]').length,
                  markers: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                }));
                if (nearby.places < 1 || nearby.places > 12 || nearby.places !== nearby.markers) {
                  throw new Error(`Nearby flow diverged: ${JSON.stringify(nearby)}`);
                }
                await assertTouristSheet(page, 'search', 'half');
                await page.keyboard.press('Escape');
                await assertMainMenu(page);

                await page.locator('#assistant-category-tours').click();
                await assertFiltersStage(page, 'tours', 6);
                await page.locator('#assistant-category-results [data-value="tour_volta_ilha"]').click();
                await page.locator('#map[data-tour-state="ready"][data-active-tour="volta-a-ilha"][data-map-marker-count="8"]').waitFor({ state: 'attached', timeout: 10000 });
                await assertTouristSheet(page, 'tour', 'half');
              }

              if (pageErrors.length || mapboxHttpErrors.length) {
                throw new Error(`${viewport.id} browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
              }

              await page.screenshot({
                path: `/tmp/v1-explore-locations/v1-category-flow-${viewport.id}.png`,
                fullPage: false,
                animations: 'disabled',
              });
              evidence[viewport.id] = { surfState, selected, center, detailValues, returnedPlaces };
              await context.close();
            }

            writeFileSync('/tmp/v1-explore-locations/evidence.json', JSON.stringify(evidence, null, 2));
            await browser.close();
          })().catch(error => {
            writeFileSync('/tmp/v1-explore-locations/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show server diagnostics
        if: failure()
        run: cat /tmp/v1-explore-locations/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-explore-locations-evidence
          path: /tmp/v1-explore-locations
          retention-days: 7
          if-no-files-found: error
