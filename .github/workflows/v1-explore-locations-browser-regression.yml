name: V1 Explore Locations Browser Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/v1-explore-locations-browser-regression.yml
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.test.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/explore-locations.css
      - apps/morro-digital-platform/public/index.html
      - packages/search/src/morro-v1-search-catalog.ts
      - packages/assistant/src/menu.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  v1-explore-locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical formatting patch
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.test.ts
          git diff -- \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/map/explore-locations-control.test.ts
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/v1-explore-locations
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-explore-locations/server.log 2>&1 &
          echo $! >/tmp/v1-explore-locations/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-explore-locations/server.log
          exit 1
      - name: Validate V1 controls, submenu, selection and accessibility
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const viewports = [
            { id: 'mobile', width: 390, height: 844 },
            { id: 'tablet', width: 768, height: 1024 },
            { id: 'desktop', width: 1440, height: 900 },
          ];
          const expectedCounts = {
            beaches: 8,
            restaurants: 45,
            hotels: 35,
            shops: 12,
            transport: 8,
            attractions: 8,
            tours: 6,
            nightlife: 5,
            emergencies: 4,
          };
          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          async function waitForMapCenter(page, longitude, latitude) {
            const deadline = Date.now() + 5000;
            let last = null;
            while (Date.now() < deadline) {
              last = await page.evaluate(() => {
                const center = globalThis.mapboxPrimaryInstance?.getCenter?.();
                return center ? { lng: center.lng, lat: center.lat } : null;
              });
              if (
                last &&
                Math.abs(last.lng - longitude) < 0.001 &&
                Math.abs(last.lat - latitude) < 0.001
              ) return last;
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`Explore selection did not recenter the map: ${JSON.stringify(last)}`);
          }

          async function waitForLoadingOverlay(page) {
            await page.waitForFunction(() =>
              document.getElementById('loading-overlay')?.classList.contains('fade-out') ?? true,
            );
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              const mapboxHttpErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('mapbox.com') && response.status() >= 400) {
                  mapboxHttpErrors.push({
                    status: response.status(),
                    url: response.url().replace(/access_token=[^&]+/u, 'access_token=[redacted]'),
                  });
                }
              });
              await page.route('**/api/weather', async route => {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify(weather),
                });
              });

              await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-mode="real"][data-map-marker-count="0"]').waitFor({
                state: 'attached',
                timeout: 30000,
              });
              await waitForLoadingOverlay(page);

              const categoryButtons = page.locator('#buttonGroup .control-button');
              if (await categoryButtons.count() !== 9) {
                throw new Error(`Expected 9 V1 location categories in ${viewport.id}`);
              }

              for (const [category, count] of Object.entries(expectedCounts)) {
                const trigger = page.locator(`[data-explore-category="${category}"]`);
                await trigger.click();
                await page.locator('#submenu[aria-hidden="false"]').waitFor({ state: 'visible' });
                const actual = await page.locator(`#submenuContainer [data-location-category="${category}"]`).count();
                if (actual !== count) {
                  throw new Error(`${viewport.id}/${category}: expected ${count}, received ${actual}`);
                }
                await page.keyboard.press('Escape');
              }

              const beaches = page.locator('[data-explore-category="beaches"]');
              await beaches.focus();
              await page.keyboard.press('Enter');
              await page.locator('#submenu[aria-hidden="false"]').waitFor({ state: 'visible' });
              const keyboardState = await page.evaluate(() => ({
                expanded: document.querySelector('[data-explore-category="beaches"]')?.getAttribute('aria-expanded'),
                pressed: document.querySelector('[data-explore-category="beaches"]')?.getAttribute('aria-pressed'),
                itemCount: document.querySelectorAll('#submenuContainer [data-location-category="beaches"]').length,
                firstItemFocused: document.activeElement?.getAttribute('data-location-name') === 'Primeira Praia',
              }));
              if (
                keyboardState.expanded !== 'true' ||
                keyboardState.pressed !== 'true' ||
                keyboardState.itemCount !== 8 ||
                !keyboardState.firstItemFocused
              ) {
                throw new Error(`Keyboard open contract diverged in ${viewport.id}: ${JSON.stringify(keyboardState)}`);
              }
              await page.keyboard.press('Escape');
              const escapeState = await page.evaluate(() => ({
                hidden: document.getElementById('submenu')?.getAttribute('aria-hidden'),
                focusReturned: document.activeElement?.getAttribute('data-explore-category') === 'beaches',
              }));
              if (escapeState.hidden !== 'true' || !escapeState.focusReturned) {
                throw new Error(`Escape/focus-return contract diverged in ${viewport.id}: ${JSON.stringify(escapeState)}`);
              }

              await page.evaluate(() => {
                document.documentElement.style.fontSize = '200%';
              });
              await beaches.click();
              const enlargedBounds = await page.locator('#submenu').boundingBox();
              if (
                !enlargedBounds ||
                enlargedBounds.x < -1 ||
                enlargedBounds.y < -1 ||
                enlargedBounds.x + enlargedBounds.width > viewport.width + 1 ||
                enlargedBounds.y + enlargedBounds.height > viewport.height + 1
              ) {
                throw new Error(`200% text submenu escaped viewport in ${viewport.id}: ${JSON.stringify(enlargedBounds)}`);
              }
              await page.keyboard.press('Escape');
              await page.evaluate(() => {
                document.documentElement.style.fontSize = '';
                globalThis.__exploreSelectedValues = [];
                document.addEventListener('morro:assistant-option-selected', event => {
                  if (event instanceof CustomEvent && typeof event.detail?.value === 'string') {
                    globalThis.__exploreSelectedValues.push(event.detail.value);
                  }
                });
              });

              await beaches.click();
              await page.locator('[data-location-name="Primeira Praia"]').click();
              const center = await waitForMapCenter(page, -38.9142193, -13.3776181);
              await page.waitForFunction(() =>
                document.getElementById('assistant-messages')?.textContent?.includes('Primeira Praia') ?? false,
              );
              const selectionState = await page.evaluate(() => ({
                submenuHidden: document.getElementById('submenu')?.getAttribute('aria-hidden'),
                assistantVisible: !document.getElementById('assistant-messages')?.classList.contains('hidden'),
                selectedValues: globalThis.__exploreSelectedValues,
                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                markerCount: document.getElementById('map')?.getAttribute('data-map-marker-count'),
              }));
              if (
                selectionState.submenuHidden !== 'true' ||
                !selectionState.assistantVisible ||
                !selectionState.selectedValues.includes('Fale sobre Primeira Praia') ||
                selectionState.activeTour !== null ||
                selectionState.markerCount !== '0'
              ) {
                throw new Error(`Location selection contract diverged in ${viewport.id}: ${JSON.stringify(selectionState)}`);
              }

              if (pageErrors.length || mapboxHttpErrors.length) {
                throw new Error(`${viewport.id} browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
              }

              await page.screenshot({
                path: `/tmp/v1-explore-locations/explore-${viewport.id}.png`,
                fullPage: false,
                animations: 'disabled',
              });
              evidence[viewport.id] = {
                keyboardState,
                escapeState,
                enlargedBounds,
                center,
                selectionState,
                pageErrors,
                mapboxHttpErrors,
              };
              await context.close();
            }

            const forcedColorsContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              forcedColors: 'active',
            });
            await forcedColorsContext.addInitScript(() => {
              localStorage.setItem('morro-digital-onboarded', '1');
              localStorage.setItem('voice-enabled', 'false');
            });
            const forcedColorsPage = await forcedColorsContext.newPage();
            await forcedColorsPage.route('**/api/weather', async route => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(weather) });
            });
            await forcedColorsPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await forcedColorsPage.locator('#map[data-map-state="ready"]').waitFor({ state: 'attached', timeout: 30000 });
            await waitForLoadingOverlay(forcedColorsPage);
            await forcedColorsPage.locator('[data-explore-category="beaches"]').click();
            await forcedColorsPage.locator('#submenu[aria-hidden="false"]').waitFor({ state: 'visible' });
            if (!(await forcedColorsPage.locator('[data-location-name="Primeira Praia"]').isVisible())) {
              throw new Error('Forced-colors explore surface is not visible');
            }
            await forcedColorsPage.screenshot({
              path: '/tmp/v1-explore-locations/explore-forced-colors.png',
              fullPage: false,
              animations: 'disabled',
            });
            await forcedColorsContext.close();

            writeFileSync('/tmp/v1-explore-locations/evidence.json', JSON.stringify(evidence, null, 2));
            await browser.close();
          })().catch(error => {
            writeFileSync('/tmp/v1-explore-locations/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show server diagnostics
        if: failure()
        run: cat /tmp/v1-explore-locations/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-explore-locations-evidence
          path: /tmp/v1-explore-locations
          retention-days: 7
          if-no-files-found: error
