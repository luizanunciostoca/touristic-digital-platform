name: V1 Explore Locations Browser Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/v1-explore-locations-browser-regression.yml
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.test.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts
      - apps/morro-digital-platform/src/map/place-bottom-sheet.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - packages/geospatial/src/**
      - packages/search/src/**
      - packages/assistant/src/menu.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v1-explore-locations:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/v1-explore-locations
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-explore-locations/server.log 2>&1 &
          echo $! >/tmp/v1-explore-locations/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-explore-locations/server.log
          exit 1
      - name: Validate staged V1 category, filter, map and detail flow
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const viewports = [
            { id: 'mobile', width: 390, height: 844 },
            { id: 'tablet', width: 768, height: 1024 },
            { id: 'desktop', width: 1440, height: 900 },
          ];
          const expectedCounts = {
            beaches: 8,
            restaurants: 45,
            hotels: 35,
            shops: 12,
            transport: 8,
            attractions: 8,
            tours: 4,
            nightlife: 5,
            emergencies: 4,
          };
          const expectedBeachDetailValues = [
            'condições da praia',
            'como chegar',
            'ver fotos',
            'informações',
            'mais opções',
            'adicionar aos favoritos',
            'compartilhar',
          ];
          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          async function openAssistant(page) {
            await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 5000 });
            const assistant = page.locator('#assistant-messages');
            const input = page.locator('#assistantInput');
            await input.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await assistant.isVisible())) {
              await input.evaluate(node => node.blur());
              await input.focus();
            }
            await assistant.waitFor({ state: 'visible', timeout: 5000 });
          }

          async function invokeCategory(page, category) {
            const railButton = page.locator(
              `#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="${category}"]`,
            );
            await railButton.waitFor({ state: 'visible', timeout: 5000 });
            await railButton.click();
          }

          async function waitMap(page, category, count, stage) {
            await page.locator(`#map[data-explore-state="ready"][data-explore-category="${category}"][data-map-marker-count="${count}"][data-explore-stage="${stage}"]`).waitFor({ state: 'attached', timeout: 8000 });
          }

          async function assertFiltersStage(page, category, count) {
            await page.locator(
              `#assistant-category-rail[data-rail-stage="filters"][data-context-category="${category}"]`,
            ).waitFor({ state: 'visible', timeout: 5000 });
            await waitMap(page, category, count, 'filters');
            const state = await page.evaluate(() => {
              const main = document.querySelector('.assistant-options:has([data-explore-category])');
              const results = document.getElementById('assistant-category-results');
              const rail = document.getElementById('assistant-category-rail');
              const sheet = document.getElementById('explore-flow-bottom-sheet');
              const railButtons = Array.from(
                rail?.querySelectorAll('[data-context-rail-option="true"]') ?? [],
              );
              return {
                mainHidden: Boolean(main?.classList.contains('hidden')),
                mainAriaHidden: main?.getAttribute('aria-hidden'),
                sourceHidden:
                  results?.getAttribute('aria-hidden') === 'true' &&
                  results?.hasAttribute('inert'),
                sourceFilterCount:
                  results?.querySelectorAll('[data-explore-action]').length ?? 0,
                railStage: rail?.getAttribute('data-rail-stage'),
                railCategory: rail?.getAttribute('data-context-category'),
                railFilterCount: railButtons.length,
                railLocationCount: rail?.querySelectorAll('[data-location-name]').length ?? 0,
                exploreSheetVisible:
                  sheet?.getAttribute('aria-hidden') === 'false' &&
                  !sheet?.classList.contains('hidden'),
                surfLabel:
                  rail?.querySelector('[data-value="surf"]')?.textContent?.trim() ?? null,
              };
            });
            if (
              !state.mainHidden ||
              state.mainAriaHidden !== 'true' ||
              !state.sourceHidden ||
              state.sourceFilterCount < 2 ||
              state.railStage !== 'filters' ||
              state.railCategory !== category ||
              state.railFilterCount !== state.sourceFilterCount ||
              state.railLocationCount !== 0 ||
              state.exploreSheetVisible
            ) {
              throw new Error(`Contextual filter rail diverged for ${category}: ${JSON.stringify(state)}`);
            }
            if (category === 'beaches' && state.surfLabel !== '🏄 Para surf') {
              throw new Error(`Surf filter copy diverged: ${JSON.stringify(state.surfLabel)}`);
            }
          }

          async function assertMainMenu(page) {
            const state = await page.evaluate(() => {
              const main = document.querySelector('.assistant-options:has([data-explore-category])');
              const rail = document.getElementById('assistant-category-rail');
              return {
                hidden: Boolean(main?.classList.contains('hidden')),
                ariaHidden: main?.getAttribute('aria-hidden'),
                legacyCategories: main?.querySelectorAll('[data-explore-category]').length ?? 0,
                railStage: rail?.getAttribute('data-rail-stage'),
                railCategories: rail?.querySelectorAll('[data-assistant-category]').length ?? 0,
                flowExists: Boolean(document.getElementById('assistant-category-results')),
              };
            });
            if (
              state.hidden ||
              state.ariaHidden === 'true' ||
              state.legacyCategories !== 9 ||
              state.railStage !== 'menu' ||
              state.railCategories !== 10 ||
              state.flowExists
            ) {
              throw new Error(`Main menu was not restored: ${JSON.stringify(state)}`);
            }
          }

          async function waitForSelectedMapCamera(page, longitude, latitude) {
            const deadline = Date.now() + 6000;
            let last = null;
            while (Date.now() < deadline) {
              last = await page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                const center = map?.getCenter?.();
                return center
                  ? { lng: center.lng, lat: center.lat, zoom: map?.getZoom?.() }
                  : null;
              });
              if (
                last &&
                Math.abs(last.lng - longitude) < 0.001 &&
                Math.abs(last.lat - latitude) < 0.001 &&
                typeof last.zoom === 'number' &&
                Math.abs(last.zoom - 16) < 0.05
              ) {
                return last;
              }
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`Selected location did not reach the V1 camera: ${JSON.stringify(last)}`);
          }

          async function readDynamicOptionValues(page) {
            return page.evaluate(() => {
              const containers = Array.from(document.querySelectorAll('.assistant-options'));
              const dynamic = containers.find(container =>
                !container.querySelector('[data-explore-category]') &&
                container.id !== 'assistant-category-results'
              );
              return dynamic
                ? Array.from(dynamic.querySelectorAll('.assistant-option-btn'), button => button.getAttribute('data-value'))
                : [];
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport,
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              const mapboxHttpErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('mapbox.com') && response.status() >= 400) {
                  mapboxHttpErrors.push({ status: response.status() });
                }
              });
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(weather),
              }));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-mode="real"][data-map-marker-count="0"]').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('#loading-overlay.fade-out').waitFor({ state: 'attached', timeout: 5000 });
              await openAssistant(page);
              await assertMainMenu(page);

              for (const [category, count] of Object.entries(expectedCounts)) {
                await openAssistant(page);
                await invokeCategory(page, category);
                await assertFiltersStage(page, category, count);
                await page.keyboard.press('Escape');
                await assertMainMenu(page);
              }

              await openAssistant(page);
              await invokeCategory(page, 'beaches');
              await assertFiltersStage(page, 'beaches', 8);

              await page.locator('#assistant-category-rail[data-rail-stage="filters"] [data-value="surf"]').click();
              await page.locator('#assistant-category-rail[data-rail-stage="places"]').waitFor({ state: 'visible' });
              const surfState = await page.evaluate(() => ({
                placeCount: document.querySelectorAll('#assistant-category-rail[data-rail-stage="places"] [data-location-name]').length,
                markerCount: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                hasBackFilters: Boolean(document.querySelector('#assistant-category-rail[data-rail-stage="places"] [data-value="voltar_filtros"]')),
                mainHidden: Boolean(document.querySelector('.assistant-options:has([data-explore-category])')?.classList.contains('hidden')),
              }));
              if (surfState.placeCount < 1 || surfState.placeCount !== surfState.markerCount || !surfState.hasBackFilters || !surfState.mainHidden) {
                throw new Error(`Surf filter diverged in ${viewport.id}: ${JSON.stringify(surfState)}`);
              }

              await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-value="voltar_filtros"]').click();
              await assertFiltersStage(page, 'beaches', 8);

              await page.locator('#assistant-category-rail[data-rail-stage="filters"] [data-value="ver todos"]').click();
              await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible' });
              await waitMap(page, 'beaches', 8, 'places');

              await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]').click();
              await waitMap(page, 'beaches', 1, 'detail');
              const center = await waitForSelectedMapCamera(page, -38.9142193, -13.3776181);
              await page.locator(
                '#assistant-category-rail[data-rail-stage="detail"][data-context-place="Primeira Praia"]',
              ).waitFor({ state: 'visible', timeout: 8000 });
              await page.locator(
                '#assistant-category-results-message.md-assistant-place-detail-message[data-place="Primeira Praia"]',
              ).waitFor({ state: 'visible', timeout: 8000 });
              const placeState = await page.evaluate(() => {
                const message = document.querySelector(
                  '#assistant-category-results-message.md-assistant-place-detail-message',
                );
                const rail = document.querySelector(
                  '#assistant-category-rail[data-rail-stage="detail"]',
                );
                const actionButtons = Array.from(
                  rail?.querySelectorAll('[data-context-rail-option="true"]') ?? [],
                );
                const voice = document.getElementById('voiceButton');
                const voiceRect =
                  voice instanceof HTMLElement ? voice.getBoundingClientRect() : null;
                return {
                  legacySheetExists: Boolean(document.getElementById('place-bottom-sheet')),
                  title:
                    message?.querySelector('.md-assistant-place-detail-title')?.textContent?.trim() ??
                    null,
                  category: message?.getAttribute('data-category') ?? null,
                  actionValues: actionButtons.map(button => button.getAttribute('data-value')),
                  touchTargets: actionButtons.map(button => {
                    const rect = button.getBoundingClientRect();
                    const style = getComputedStyle(button);
                    return {
                      width: rect.width,
                      height: rect.height,
                      visible:
                        style.display !== 'none' &&
                        style.visibility !== 'hidden' &&
                        rect.width > 0 &&
                        rect.height > 0,
                    };
                  }),
                  voiceLabel: voice?.textContent?.trim() ?? null,
                  voiceWidth: voiceRect?.width ?? 0,
                  voiceHeight: voiceRect?.height ?? 0,
                  voiceVisible: (() => {
                    if (!(voice instanceof HTMLElement)) return false;
                    const style = getComputedStyle(voice);
                    return (
                      style.display !== 'none' &&
                      style.visibility !== 'hidden' &&
                      style.opacity !== '0' &&
                      (voiceRect?.width ?? 0) > 0 &&
                      (voiceRect?.height ?? 0) > 0
                    );
                  })(),
                  bottomNavVisible: (() => {
                    const node = document.getElementById('home-bottom-navigation');
                    if (!(node instanceof HTMLElement)) return false;
                    const rect = node.getBoundingClientRect();
                    const style = getComputedStyle(node);
                    return (
                      style.display !== 'none' &&
                      style.visibility !== 'hidden' &&
                      style.opacity !== '0' &&
                      rect.width > 0 &&
                      rect.height > 0
                    );
                  })(),
                };
              });
              if (
                placeState.legacySheetExists ||
                placeState.title !== 'Primeira Praia' ||
                placeState.category !== 'beaches' ||
                !placeState.actionValues.includes('condições da praia') ||
                !placeState.actionValues.includes('como chegar') ||
                !placeState.actionValues.includes('ver fotos') ||
                !placeState.actionValues.includes('informações') ||
                !placeState.actionValues.includes('adicionar aos favoritos') ||
                !placeState.actionValues.includes('compartilhar') ||
                !placeState.actionValues.includes('__back_to_places__') ||
                placeState.touchTargets.some(
                  ({ width, height, visible }) => !visible || width < 44 || height < 44,
                ) ||
                placeState.voiceLabel !== 'Fale comigo' ||
                !placeState.voiceVisible ||
                !placeState.bottomNavVisible ||
                placeState.voiceWidth < 180 ||
                placeState.voiceHeight < 44
              ) {
                throw new Error(
                  `Assistant Place detail diverged in ${viewport.id}: ${JSON.stringify(placeState)}`,
                );
              }

              const selected = await page.evaluate(() => ({
                flowRemoved: !document.getElementById('assistant-category-results'),
                mainHidden: Boolean(document.querySelector('.assistant-options:has([data-explore-category])')?.classList.contains('hidden')),
                markerCount: document.getElementById('map')?.getAttribute('data-map-marker-count'),
                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                popupVisible: Array.from(document.querySelectorAll('.mapboxgl-popup')).some(popup => {
                  const style = getComputedStyle(popup);
                  const rect = popup.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0' && rect.width > 0 && rect.height > 0;
                }),
              }));
              if (
                !selected.flowRemoved ||
                !selected.mainHidden ||
                selected.markerCount !== '1' ||
                selected.activeTour !== null ||
                selected.popupVisible ||
                expectedBeachDetailValues.some(value => !placeState.actionValues.includes(value))
              ) {
                throw new Error(
                  `Location detail diverged in ${viewport.id}: ${JSON.stringify({ selected, placeState })}`,
                );
              }

              await page.locator(
                '#assistant-category-rail[data-rail-stage="detail"] [data-value="__back_to_places__"]',
              ).click();
              await page.locator('#assistant-category-rail[data-rail-stage="places"]').waitFor({ state: 'visible', timeout: 5000 });
              await waitMap(page, 'beaches', 8, 'places');
              const returnedPlaces = await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-location-name]').count();
              if (returnedPlaces !== 8) {
                throw new Error(`Detail back did not restore the V1 places list: ${returnedPlaces}`);
              }

              await page.locator('#assistant-category-rail[data-rail-stage="places"] [data-location-name="Primeira Praia"]').click();
              await page.locator(
                '#assistant-category-rail[data-rail-stage="detail"][data-context-place="Primeira Praia"]',
              ).waitFor({ state: 'visible', timeout: 5000 });
              await page.keyboard.press('Escape');
              await page.locator('#assistant-category-rail[data-rail-stage="places"]').waitFor({ state: 'visible', timeout: 5000 });

              await page.keyboard.press('Escape');
              await assertMainMenu(page);

              if (viewport.id === 'mobile') {
                await openAssistant(page);
                await invokeCategory(page, 'beaches');
                await assertFiltersStage(page, 'beaches', 8);
                await page.locator('#assistant-category-rail[data-rail-stage="filters"] [data-value="proximo"]').click();
                await page.locator('#assistant-category-rail[data-rail-stage="places"]').waitFor({ state: 'visible' });
                const nearby = await page.evaluate(() => ({
                  places: document.querySelectorAll('#assistant-category-rail[data-rail-stage="places"] [data-location-name]').length,
                  markers: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                }));
                if (nearby.places < 1 || nearby.places > 12 || nearby.places !== nearby.markers) {
                  throw new Error(`Nearby flow diverged: ${JSON.stringify(nearby)}`);
                }
                await page.keyboard.press('Escape');
                await assertMainMenu(page);

                await openAssistant(page);
                await invokeCategory(page, 'tours');
                await assertFiltersStage(page, 'tours', 4);
                const tourClusters = await page.locator(
                  '.morro-explore-marker[data-explore-category="tours"][data-tour-cluster="true"][data-cluster-count="3"]',
                ).count();
                if (tourClusters !== 1) {
                  throw new Error(`Tour discovery clustering diverged: ${tourClusters}`);
                }
                await page.locator('#assistant-category-rail[data-rail-stage="filters"] [data-value="tour_volta_ilha"]').click();
                await page.locator('#map[data-tour-state="ready"][data-active-tour="volta-a-ilha"][data-map-marker-count="8"]').waitFor({ state: 'attached', timeout: 10000 });
                await page.locator('#explore-flow-bottom-sheet[data-flow-kind="tour"] .tour-intro-card').waitFor({
                  state: 'visible',
                  timeout: 10000,
                });
              }

              if (pageErrors.length || mapboxHttpErrors.length) {
                throw new Error(`${viewport.id} browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
              }

              await page.screenshot({
                path: `/tmp/v1-explore-locations/v1-category-flow-${viewport.id}.png`,
                fullPage: false,
                animations: 'disabled',
              });

              evidence[viewport.id] = { surfState, selected, center, placeState, returnedPlaces };
              await context.close();
            }

            writeFileSync('/tmp/v1-explore-locations/evidence.json', JSON.stringify(evidence, null, 2));
            await browser.close();
          })().catch(error => {
            writeFileSync('/tmp/v1-explore-locations/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show server diagnostics
        if: failure()
        run: cat /tmp/v1-explore-locations/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-explore-locations-evidence
          path: /tmp/v1-explore-locations
          retention-days: 7
          if-no-files-found: error
