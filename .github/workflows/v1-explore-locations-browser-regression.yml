name: V1 Explore Locations Browser Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/v1-explore-locations-browser-regression.yml
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.test.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - packages/search/src/morro-v1-search-catalog.ts
      - packages/assistant/src/menu.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  v1-explore-locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/v1-explore-locations
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-explore-locations/server.log 2>&1 &
          echo $! >/tmp/v1-explore-locations/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-explore-locations/server.log
          exit 1
      - name: Validate V1 assistant category flow and map POIs
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const viewports = [
            { id: 'mobile', width: 390, height: 844 },
            { id: 'tablet', width: 768, height: 1024 },
            { id: 'desktop', width: 1440, height: 900 },
          ];
          const expectedCounts = {
            beaches: 8,
            restaurants: 45,
            hotels: 35,
            shops: 12,
            transport: 8,
            attractions: 8,
            tours: 6,
            nightlife: 5,
            emergencies: 4,
          };
          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          async function openAssistant(page) {
            const assistant = page.locator('#assistant-messages');
            const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
            await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 5000 });
            await quickAction.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await assistant.isVisible())) await quickAction.click();
            await assistant.waitFor({ state: 'visible', timeout: 5000 });
            if ((await assistant.getAttribute('aria-hidden')) !== 'false') {
              throw new Error('Visible assistant must expose aria-hidden="false"');
            }
          }

          async function waitForCategory(page, category, count) {
            await page.locator(`#assistant-category-results[data-category="${category}"]`).waitFor({ state: 'visible', timeout: 5000 });
            await page.locator(`#map[data-explore-state="ready"][data-explore-category="${category}"][data-map-marker-count="${count}"]`).waitFor({ state: 'attached', timeout: 5000 });
            const optionCount = await page.locator(`#assistant-category-results [data-location-category="${category}"]`).count();
            if (optionCount !== count) {
              throw new Error(`${category}: expected ${count} assistant location options, received ${optionCount}`);
            }
            const submenuState = await page.locator('#submenu').evaluate(element => ({
              hidden: element.classList.contains('hidden'),
              ariaHidden: element.getAttribute('aria-hidden'),
            }));
            if (!submenuState.hidden || submenuState.ariaHidden !== 'true') {
              throw new Error(`${category}: detached submenu must remain hidden: ${JSON.stringify(submenuState)}`);
            }
          }

          async function waitForMapCenter(page, longitude, latitude) {
            const deadline = Date.now() + 5000;
            let last = null;
            while (Date.now() < deadline) {
              last = await page.evaluate(() => {
                const center = globalThis.mapboxPrimaryInstance?.getCenter?.();
                return center ? { lng: center.lng, lat: center.lat } : null;
              });
              if (last && Math.abs(last.lng - longitude) < 0.001 && Math.abs(last.lat - latitude) < 0.001) return last;
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`Explore selection did not recenter the map: ${JSON.stringify(last)}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              const mapboxHttpErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('mapbox.com') && response.status() >= 400) {
                  mapboxHttpErrors.push({
                    status: response.status(),
                    url: response.url().replace(/access_token=[^&]+/u, 'access_token=[redacted]'),
                  });
                }
              });
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(weather),
              }));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-mode="real"][data-map-marker-count="0"]').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('#loading-overlay.fade-out').waitFor({ state: 'attached', timeout: 5000 });
              await openAssistant(page);

              if (await page.locator('#controls').count() !== 0) {
                throw new Error(`Duplicate external category rail exists in ${viewport.id}`);
              }
              const categoryButtons = page.locator('.assistant-options .assistant-option-btn[data-explore-category]');
              if (await categoryButtons.count() !== 9) {
                throw new Error(`Expected 9 assistant-owned location categories in ${viewport.id}`);
              }

              for (const [category, count] of Object.entries(expectedCounts)) {
                const trigger = page.locator(`#assistant-category-${category}`);
                await trigger.click();
                await waitForCategory(page, category, count);
                const state = await trigger.evaluate(element => ({
                  expanded: element.getAttribute('aria-expanded'),
                  pressed: element.getAttribute('aria-pressed'),
                }));
                if (state.expanded !== 'true' || state.pressed !== 'true') {
                  throw new Error(`${viewport.id}/${category}: category trigger state diverged: ${JSON.stringify(state)}`);
                }
                await page.keyboard.press('Escape');
                if (await page.locator('#assistant-category-results').count()) {
                  throw new Error(`${viewport.id}/${category}: Escape did not close category results`);
                }
                if (!(await page.locator('#assistant-messages').isVisible())) {
                  throw new Error(`${viewport.id}/${category}: Escape closed the assistant instead of category results`);
                }
                if ((await page.evaluate(() => document.activeElement?.id)) !== `assistant-category-${category}`) {
                  throw new Error(`${viewport.id}/${category}: focus did not return to category trigger`);
                }
              }

              const beaches = page.locator('#assistant-category-beaches');
              await beaches.focus();
              await page.keyboard.press('Enter');
              await waitForCategory(page, 'beaches', 8);
              const keyboardState = await page.evaluate(() => ({
                optionCount: document.querySelectorAll('#assistant-category-results [data-location-category="beaches"]').length,
                firstFocused: document.activeElement?.getAttribute('data-location-name') === 'Primeira Praia',
                assistantContainsResults: Boolean(document.querySelector('#assistant-messages #assistant-category-results')),
              }));
              if (keyboardState.optionCount !== 8 || !keyboardState.firstFocused || !keyboardState.assistantContainsResults) {
                throw new Error(`Keyboard assistant-results contract diverged in ${viewport.id}: ${JSON.stringify(keyboardState)}`);
              }
              await page.keyboard.press('Escape');

              await page.evaluate(() => {
                globalThis.__exploreSelectedValues = [];
                document.addEventListener('morro:assistant-option-selected', event => {
                  if (event instanceof CustomEvent && typeof event.detail?.value === 'string') {
                    globalThis.__exploreSelectedValues.push(event.detail.value);
                  }
                });
              });
              await beaches.click();
              await waitForCategory(page, 'beaches', 8);
              await page.locator('#assistant-category-results [data-location-name="Primeira Praia"]').click();
              const center = await waitForMapCenter(page, -38.9142193, -13.3776181);
              await page.locator('#assistant-messages').filter({ hasText: 'Primeira Praia' }).waitFor({ state: 'visible', timeout: 5000 });
              const selectionState = await page.evaluate(() => ({
                resultsRemoved: !document.getElementById('assistant-category-results'),
                submenuHidden: document.getElementById('submenu')?.getAttribute('aria-hidden'),
                assistantVisible: !document.getElementById('assistant-messages')?.classList.contains('hidden'),
                selectedValues: globalThis.__exploreSelectedValues,
                activeTour: document.getElementById('map')?.getAttribute('data-active-tour'),
                markerCount: document.getElementById('map')?.getAttribute('data-map-marker-count'),
                exploreCategory: document.getElementById('map')?.getAttribute('data-explore-category'),
              }));
              if (
                !selectionState.resultsRemoved ||
                selectionState.submenuHidden !== 'true' ||
                !selectionState.assistantVisible ||
                !selectionState.selectedValues.includes('Fale sobre Primeira Praia') ||
                selectionState.activeTour !== null ||
                selectionState.markerCount !== '8' ||
                selectionState.exploreCategory !== 'beaches'
              ) {
                throw new Error(`Location selection contract diverged in ${viewport.id}: ${JSON.stringify(selectionState)}`);
              }

              if (pageErrors.length || mapboxHttpErrors.length) {
                throw new Error(`${viewport.id} browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
              }

              await page.screenshot({
                path: `/tmp/v1-explore-locations/assistant-category-${viewport.id}.png`,
                fullPage: false,
                animations: 'disabled',
              });
              evidence[viewport.id] = { keyboardState, center, selectionState };
              await context.close();
            }

            const forcedColorsContext = await browser.newContext({ viewport: { width: 390, height: 844 }, forcedColors: 'active' });
            await forcedColorsContext.addInitScript(() => {
              localStorage.setItem('morro-digital-onboarded', '1');
              localStorage.setItem('voice-enabled', 'false');
            });
            const forcedColorsPage = await forcedColorsContext.newPage();
            await forcedColorsPage.route('**/api/weather', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(weather) }));
            await forcedColorsPage.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await forcedColorsPage.locator('#map[data-map-state="ready"]').waitFor({ state: 'attached', timeout: 30000 });
            await forcedColorsPage.locator('#loading-overlay.fade-out').waitFor({ state: 'attached', timeout: 5000 });
            await openAssistant(forcedColorsPage);
            await forcedColorsPage.locator('#assistant-category-beaches').click();
            await waitForCategory(forcedColorsPage, 'beaches', 8);
            if (!(await forcedColorsPage.locator('#assistant-category-results [data-location-name="Primeira Praia"]').isVisible())) {
              throw new Error('Forced-colors assistant category results are not visible');
            }
            await forcedColorsPage.screenshot({
              path: '/tmp/v1-explore-locations/assistant-category-forced-colors.png',
              fullPage: false,
              animations: 'disabled',
            });
            await forcedColorsContext.close();

            writeFileSync('/tmp/v1-explore-locations/evidence.json', JSON.stringify(evidence, null, 2));
            await browser.close();
          })().catch(error => {
            writeFileSync('/tmp/v1-explore-locations/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show server diagnostics
        if: failure()
        run: cat /tmp/v1-explore-locations/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-explore-locations-evidence
          path: /tmp/v1-explore-locations
          retention-days: 1
          if-no-files-found: ignore
