name: V1 Assistant Single Message POI Markers

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/actions/ci-bootstrap/**"
      - .github/workflows/v1-assistant-single-message-poi-markers.yml
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser.ts
      - apps/morro-digital-platform/src/assistant/assistant-single-message-controller.ts
      - apps/morro-digital-platform/src/map/explore-marker-element.ts
      - apps/morro-digital-platform/src/map/explore-marker-element.test.ts
      - apps/morro-digital-platform/src/map/explore-map-viewport-v1.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - packages/geospatial/src/**
      - packages/search/src/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v1-single-message-poi-markers:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
        with:
          browser: "true"
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/v1-single-message-poi.log 2>&1 &
          echo $! >/tmp/v1-single-message-poi.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1-single-message-poi.log
          exit 1
      - name: Validate V1 replacement semantics and visible category POIs
        timeout-minutes: 3
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          async function assertCatalogMarkerMembership(page, category, legacyCount, selectedName = null) {
            const catalog = (await import(require('node:url').pathToFileURL(
              require('node:path').resolve('packages/search/dist/index.js')).href)).morroV1SearchCatalog;
            const key = item => JSON.stringify([item.category, item.name]);
            const allKeys = catalog.map(key);
            if (new Set(allKeys).size !== allKeys.length) throw new Error('Local catalog identity tuple is not unique');
            const expected = catalog.filter(item => (!category || item.category === category) && (!selectedName || item.name === selectedName)).map(key).sort();
            const deadline = Date.now() + 10000;
            let stable = 0;
            while (Date.now() < deadline) {
              const state = await page.evaluate(() => {
                const map = document.getElementById('map');
                return {
                  ready: map?.getAttribute('data-explore-state') === 'ready',
                  moving: Boolean(globalThis.mapboxPrimaryInstance?.isMoving?.()),
                  physical: Number(map?.getAttribute('data-map-marker-count')),
                  actual: document.querySelectorAll('.morro-explore-marker[data-morro-explore-marker="true"]').length,
                  members: map?.getAttribute('data-map-member-count'),
                };
              });
              if (state.ready && !state.moving && state.physical === state.actual &&
                  (state.members === null ? state.physical === legacyCount : Number(state.members) === expected.length)) stable += 1;
              else stable = 0;
              if (stable >= 2) break;
              await page.waitForTimeout(50);
            }
            if (stable < 2) throw new Error('Marker membership did not settle under the actual map contract');
            const markers = await page.locator('.morro-explore-marker[data-morro-explore-marker="true"]').evaluateAll(nodes => nodes.map(node => ({
              id: node.getAttribute('data-marker-id'), category: node.getAttribute('data-explore-category'),
              name: node.getAttribute('data-location-name'), canonicalId: node.getAttribute('data-canonical-place-id'),
              clustered: node.getAttribute('data-marker-cluster') === 'true' || node.getAttribute('data-tour-cluster') === 'true',
              count: Number(node.getAttribute('data-cluster-count')),
            })));
            const counts = await page.locator('#map').evaluate(node => ({
              physical: Number(node.getAttribute('data-map-marker-count')),
              members: node.getAttribute('data-map-member-count'),
            }));
            if (counts.physical !== markers.length) throw new Error('Physical marker count disagrees with rendered symbols');
            const sourceDeclaresMemberContract = require('node:fs').readFileSync(
              'apps/morro-digital-platform/src/map/explore-locations-control.ts', 'utf8').includes('"data-map-member-count"');
            if (counts.members === null) {
              if (sourceDeclaresMemberContract) throw new Error('U7 producer contract declared but runtime membership capability missing');
              const compareLegacy = expectedCount => {
                if (markers.length !== expectedCount) throw new Error('Legacy physical marker contract changed');
              };
              compareLegacy(legacyCount);
              for (const wrongCount of [legacyCount - 1, legacyCount + 1]) {
                let rejected = false;
                try { compareLegacy(wrongCount); } catch { rejected = true; }
                if (!rejected) throw new Error('Legacy count negative canary failed');
              }
              const proof = { proofMode: 'LEGACY_PHYSICAL_CONTRACT', u7Membership: 'NOT_EXERCISED', physical: markers.length };
              console.log(JSON.stringify(proof));
              return proof;
            }
            if (Number(counts.members) !== expected.length) throw new Error('Dataset member count disagrees with independent catalog');
            const initialSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
            if (initialSemantic === null || Number(initialSemantic) !== expected.length)
              throw new Error('Semantic current dataset count is missing or incorrect');
            if (markers.some(marker => !marker.id) || new Set(markers.map(marker => marker.id)).size !== markers.length)
              throw new Error('Physical marker identities missing or duplicated');
            const observed = [];
            for (const marker of markers) {
              if (!marker.clustered) {
                observed.push(key(marker));
                continue;
              }
              await page.locator(`.morro-explore-marker[data-marker-id=${JSON.stringify(marker.id)}]`).evaluate(node => node.click());
              const back = page.locator('#assistant-category-rail [data-explore-action="back-cluster"]');
              await back.waitFor({ state: 'visible', timeout: 5000 });
              const members = await page.locator('#assistant-category-rail [data-location-name][data-location-category]').evaluateAll(nodes => nodes.map(node => ({
                category: node.getAttribute('data-location-category'), name: node.getAttribute('data-location-name'),
                source: node.getAttribute('data-location-source'), canonicalId: node.getAttribute('data-canonical-place-id'),
              })));
              if (members.length !== marker.count || members.some(member => member.source !== 'catalog'))
                throw new Error('Actual local cluster list disagrees with declared membership/source');
              const selectedSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
              if (selectedSemantic === null || Number(selectedSemantic) !== members.length)
                throw new Error('Semantic count disagrees with the actual opened subset');
              observed.push(...members.map(key));
              await back.click();
              await back.waitFor({ state: 'hidden', timeout: 5000 });
              const restoredSemantic = await page.locator('#map').getAttribute('data-explore-location-count');
              if (restoredSemantic === null || Number(restoredSemantic) !== expected.length)
                throw new Error('Semantic count did not restore the full current dataset');
            }
            const compare = wanted => {
              if (JSON.stringify([...observed].sort()) !== JSON.stringify([...wanted].sort()))
                throw new Error('Canonical catalog membership missing, duplicated, invented or wrong category');
            };
            compare(expected);
            for (const wrong of [expected.slice(1), [...expected, expected[0]], [JSON.stringify(['__wrong_category__', '__wrong_identity__']), ...expected.slice(1)]]) {
              let rejected = false;
              try { compare(wrong); } catch { rejected = true; }
              if (!rejected) throw new Error('Membership missing/duplicate/wrong identity negative canary failed');
            }
            const proof = { proofMode: 'U7_LOCAL_CATALOG_MEMBERSHIP', localIdentity: 'unique category/name tuple', locations: expected.length, physical: markers.length, negativeCanaries: ['missing', 'duplicate', 'wrong-identity'] };
            console.log(JSON.stringify(proof));
            return proof;
          }


          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          async function poll(page, predicate, label, timeout = 10000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              if (await page.evaluate(predicate)) return;
              await page.waitForTimeout(100);
            }
            throw new Error(`${label} did not become ready`);
          }

          async function readState(page) {
            return page.evaluate(() => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0' && rect.width > 0 && rect.height > 0;
              };
              const describeElement = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return {
                  tagName: element.tagName,
                  id: element.id,
                  className: element.className,
                  ariaHidden: element.getAttribute('aria-hidden'),
                  hiddenClass: element.classList.contains('hidden'),
                  display: style.display,
                  visibility: style.visibility,
                  opacity: style.opacity,
                  width: rect.width,
                  height: rect.height,
                  text: element.textContent?.trim() ?? '',
                };
              };
              const area = document.querySelector('#assistant-messages .messages-area');
              const assistant = document.getElementById('assistant-messages');
              const assistantRect = assistant?.getBoundingClientRect() ?? null;
              const messages = area ? Array.from(area.children).filter((element) => element.classList.contains('message')) : [];
              const markers = Array.from(document.querySelectorAll('.morro-explore-marker[data-morro-explore-marker="true"]'));
              const markerState = markers.map((marker) => {
                const rect = marker.getBoundingClientRect();
                return {
                  category: marker.getAttribute('data-explore-category'),
                  name: marker.getAttribute('data-location-name'),
                  visible: visible(marker),
                  width: rect.width,
                  height: rect.height,
                  centerY: rect.top + rect.height / 2,
                };
              });
              const menu = document.querySelector('.assistant-options:has([data-explore-category])');
              const flowMessage = document.getElementById('assistant-category-results-message');
              const flowResults = document.getElementById('assistant-category-results');
              const exploreSheet = document.getElementById('explore-flow-bottom-sheet');
              const contextualRail = document.getElementById('assistant-category-rail');
              const contextualRailButtons = contextualRail
                ? Array.from(
                    contextualRail.querySelectorAll('[data-context-rail-option="true"]'),
                  )
                : [];
              return {
                visibleMessageCount: messages.filter(visible).length,
                visibleUserMessageCount: messages.filter((message) => message.classList.contains('user') && visible(message)).length,
                visibleAssistantMessages: messages.filter((message) => message.classList.contains('assistant') && visible(message)).map((message) => message.textContent?.trim() ?? ''),
                allMessages: messages.map(describeElement),
                areaChildren: area ? Array.from(area.children).map(describeElement) : [],
                flowMessage: flowMessage ? describeElement(flowMessage) : null,
                flowResults: flowResults ? describeElement(flowResults) : null,
                exploreSheet: exploreSheet ? describeElement(exploreSheet) : null,
                contextualRail: contextualRail ? describeElement(contextualRail) : null,
                contextualRailStage: contextualRail?.getAttribute('data-rail-stage') ?? null,
                contextualRailButtonCount: contextualRailButtons.length,
                assistantVisible: Boolean(assistant && visible(assistant)),
                mainMenuVisible: Boolean(menu && visible(menu)),
                markerCountAttribute: Number(document.getElementById('map')?.getAttribute('data-map-marker-count') || 0),
                markerState,
                assistantTop: assistantRect?.top ?? null,
              };
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let context = null;
            try {
              context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.route('**/api/weather', route => route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(weather),
              }));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({ state: 'attached', timeout: 30000 });
              await page.locator('body[data-public-onboarding-settled="true"]').waitFor({ state: 'attached', timeout: 5000 });
              const assistant = page.locator('#assistant-messages');
              if (!(await assistant.isVisible())) await page.locator('#assistantInput').focus();
              await assistant.waitFor({ state: 'visible', timeout: 5000 });

              await page
                .locator('#assistant-category-rail[data-rail-stage="menu"] [data-assistant-category="beaches"]')
                .click();
              await page.locator('#assistant-category-rail[data-rail-stage="filters"][data-context-category="beaches"]').waitFor({ state: 'visible', timeout: 5000 });
              await page.locator('#map[data-explore-state="ready"][data-explore-category="beaches"]').waitFor({ state: 'attached', timeout: 8000 });
              await assertCatalogMarkerMembership(page, 'beaches', 8);
              await page.waitForTimeout(2300);

              const filtersState = await readState(page);
              if (
                filtersState.visibleMessageCount < 1 ||
                filtersState.visibleUserMessageCount !== 0 ||
                !filtersState.assistantVisible ||
                !filtersState.exploreSheet ||
                !filtersState.exploreSheet.hiddenClass ||
                filtersState.exploreSheet.ariaHidden !== 'true' ||
                filtersState.flowResults?.ariaHidden !== 'true' ||
                filtersState.contextualRailStage !== 'filters' ||
                filtersState.contextualRailButtonCount < 2
              ) {
                throw new Error(`Contextual Explore presentation contract diverged: ${JSON.stringify(filtersState)}`);
              }
              if (filtersState.mainMenuVisible) {
                throw new Error(`Main categories remained visible with Beaches flow: ${JSON.stringify(filtersState)}`);
              }
              if (filtersState.markerCountAttribute !== filtersState.markerState.length || filtersState.markerState.length === 0 || filtersState.markerState.some(marker => !marker.visible || marker.width < 30 || marker.height < 30 || marker.category !== 'beaches')) {
                throw new Error(`Beach POI marker presentation diverged: ${JSON.stringify(filtersState)}`);
              }
              await page.locator('#assistant-messages').evaluate((element) => {
                const height = element.getBoundingClientRect().height;
                element.style.height = `${height}px`;
                element.style.maxHeight = `${height}px`;
              });
              await page.evaluate(() => {
                const map = globalThis.mapboxPrimaryInstance;
                if (!map?.fitBounds) throw new Error('Mapbox fitBounds unavailable');
                globalThis.__exploreViewportFitBoundsCalls = 0;
                const originalFitBounds = map.fitBounds.bind(map);
                map.fitBounds = (...args) => {
                  globalThis.__exploreViewportFitBoundsCalls += 1;
                  return originalFitBounds(...args);
                };
              });

              await page.setViewportSize({ width: 430, height: 844 });
              await poll(
                page,
                () => globalThis.__exploreViewportFitBoundsCalls >= 1,
                'width-only Explore viewport reframe',
              );
              await assertCatalogMarkerMembership(page, 'beaches', 8);
              const resizedState = await readState(page);
              if (resizedState.markerCountAttribute !== resizedState.markerState.length || resizedState.markerState.length === 0) {
                throw new Error(`Explore resize lost markers: ${JSON.stringify(resizedState)}`);
              }

              await page.locator('#assistant-messages').evaluate((element) => {
                element.style.height = '';
                element.style.maxHeight = '';
              });
              await page.setViewportSize({ width: 844, height: 390 });
              await poll(
                page,
                () => globalThis.__exploreViewportFitBoundsCalls >= 2,
                'landscape Explore viewport reframe',
              );
              await page.waitForTimeout(2300);
              await assertCatalogMarkerMembership(page, 'beaches', 8);
              const landscapeState = await readState(page);
              if (landscapeState.markerCountAttribute !== landscapeState.markerState.length || landscapeState.markerState.length === 0) {
                throw new Error(`Explore rotation lost markers: ${JSON.stringify(landscapeState)}`);
              }

              await page.locator('#assistant-category-rail[data-rail-stage="filters"] [data-value="ver todos"]').click();
              await page.locator('#assistant-category-rail[data-rail-stage="places"]').waitFor({ state: 'visible', timeout: 5000 });
              await assertCatalogMarkerMembership(page, 'beaches', 8);
              const placesState = await readState(page);
              if (
                placesState.visibleMessageCount < 1 ||
                placesState.visibleUserMessageCount !== 0 ||
                !placesState.assistantVisible ||
                placesState.mainMenuVisible ||
                !placesState.exploreSheet ||
                !placesState.exploreSheet.hiddenClass ||
                placesState.exploreSheet.ariaHidden !== 'true' ||
                placesState.contextualRailStage !== 'places' ||
                placesState.contextualRailButtonCount < 2
              ) {
                throw new Error(`Places contextual rail stacked stale presentation: ${JSON.stringify(placesState)}`);
              }

              await page.keyboard.press('Escape');
              await poll(page, () => {
                const menu = document.querySelector('.assistant-options:has([data-explore-category])');
                const assistant = document.getElementById('assistant-messages');
                const sheet = document.getElementById('explore-flow-bottom-sheet');
                const rail = document.getElementById('assistant-category-rail');
                return Boolean(
                  menu &&
                  !menu.classList.contains('hidden') &&
                  assistant &&
                  !assistant.classList.contains('hidden') &&
                  assistant.getAttribute('aria-hidden') !== 'true' &&
                  sheet?.classList.contains('hidden') &&
                  sheet.getAttribute('aria-hidden') === 'true' &&
                  rail?.getAttribute('data-rail-stage') === 'menu' &&
                  rail.querySelectorAll('[data-assistant-category]').length === 10
                );
              }, 'V2 Discover contextual rail restore');

              if (pageErrors.length) throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
            } finally {
              await context?.close().catch(() => undefined);
              await browser.close().catch(() => undefined);
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
