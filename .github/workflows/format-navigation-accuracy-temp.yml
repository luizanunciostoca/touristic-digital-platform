name: Format Navigation Accuracy Temp

on:
  push:
    branches:
      - feat/navigation-accuracy-baseline
    paths:
      - .github/workflows/format-navigation-accuracy-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-accuracy-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/navigation/navigation-accuracy-v1.test.ts
      - name: Commit formatted test
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "luizidebook"
          git config user.email "47362223+luizidebook@users.noreply.github.com"
          git add apps/morro-digital-platform/src/navigation/navigation-accuracy-v1.test.ts
          git commit -m "style: format navigation accuracy parity test"
          git push origin HEAD:feat/navigation-accuracy-baseline
