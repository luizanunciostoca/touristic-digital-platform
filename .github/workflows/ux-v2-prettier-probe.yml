name: UX V2 Prettier Probe

on:
  push:
    branches:
      - wave/ux-v2-assistant-modal-v4-20260920
    paths:
      - .github/workflows/ux-v2-prettier-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier apps/morro-digital-platform/src/ux/assistant-modal-v2-contract.test.ts --write
          git diff -- apps/morro-digital-platform/src/ux/assistant-modal-v2-contract.test.ts
