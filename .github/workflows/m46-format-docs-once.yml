name: M46 Format Docs Once

on:
  push:
    branches:
      - docs/wave6-m46-auth-business-baseline
    paths:
      - .github/workflows/m46-format-docs-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/wave6-m46-auth-business-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M46 documentation
        run: >-
          pnpm exec prettier --write
          docs/migration/WAVE6-AUTH-BUSINESS-V1-BASELINE.md
          docs/migration/AUTH-MIGRATION-MATRIX.md
          docs/migration/BUSINESS-MIGRATION-MATRIX.md
          docs/qa/WAVE6-M46-EVIDENCE.md
      - name: Commit formatted docs and remove helper
        run: |
          rm .github/workflows/m46-format-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/WAVE6-AUTH-BUSINESS-V1-BASELINE.md docs/migration/AUTH-MIGRATION-MATRIX.md docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/WAVE6-M46-EVIDENCE.md .github/workflows/m46-format-docs-once.yml
          git commit -m "chore(ci): format M46 docs once"
          git push origin HEAD:docs/wave6-m46-auth-business-baseline
