name: Control Center Visual Golden V1

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-control-center-visual-golden-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-golden-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: control-center-golden-ci
          MYSQL_DATABASE: control_center_golden_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcontrol-center-golden-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the scheduler source identity
        id: ci_command_01
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: ./.github/actions/ci-bootstrap
        with:
          browser: "true"

      - name: Check Wave 4 formatting
        id: ci_command_02
        run: >-
          pnpm exec prettier --check
          .github/workflows/control-center-visual-golden-v1.yml
          apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs
          tests/visual-regression/control-center-v1/manual-contract.json

      - name: Verify baseline inventory
        id: ci_command_03
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="tests/visual-regression/control-center-v1"
          for size in 1440x900 1280x800 1024x768 768x1024 390x844; do
            test -s "$BASE_DIR/control-center-v1-${size}.png"
          done

      - name: Install deterministic Chromium and image diff dependencies
        id: ci_command_04
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2 pixelmatch@5.3.0 pngjs@7.0.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Clean build runtime graph
        id: ci_command_05
        run: pnpm -w build

      - name: Start deterministic authenticated Control Center
        id: ci_command_06
        shell: bash
        run: |
          set -euo pipefail
          PORT=4199
          AUTH_SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="control center responsive browser fixture"
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 35))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"platform-owner-responsive",email:"platform-owner-responsive@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}]))' "$OWNER_HASH")
          DB_URL="mysql://root:control-center-golden-ci@127.0.0.1:3306/control_center_golden_ci"
          DASHBOARD_AUTH_SECRET="$AUTH_SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          AUTH_DATABASE_URL="$DB_URL" \
          CONTROL_CENTER_AUDIT_DATABASE_URL="$DB_URL" \
          DESTINATIONS_DATABASE_URL="$DB_URL" \
          TZ="America/Bahia" \
          PORT="$PORT" \
          HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs \
            >/tmp/control-center-visual-golden-v1-server.log 2>&1 &
          echo $! >/tmp/control-center-visual-golden-v1-server.pid
          for _ in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/apps/control-center/public/index.html" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/control-center-visual-golden-v1-server.log
          exit 1

      - name: Validate manual visual conformance
        id: ci_command_07
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4199
        shell: bash
        run: |
          CONTROL_CENTER_EXACT_HEAD="$(git rev-parse HEAD)" \
            node apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs

      - name: Prove the golden suite rejects deliberate regressions
        id: ci_command_08
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4199
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/control-center-visual-golden-v1/negative
          for mutation in dark-topbar hide-destination narrow-attention remove-kpi shift-sidebar; do
            if CONTROL_CENTER_EXACT_HEAD="$(git rev-parse HEAD)" \
              CONTROL_CENTER_GOLDEN_MUTATION="$mutation" \
              node apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs \
              >"/tmp/control-center-visual-golden-v1/negative/${mutation}.log" 2>&1; then
              echo "FALSE_GREEN: mutation '$mutation' unexpectedly passed"
              cat "/tmp/control-center-visual-golden-v1/negative/${mutation}.log"
              exit 1
            fi
            echo "Expected failure confirmed: $mutation"
          done
          rm -f /tmp/control-center-visual-golden-v1/failure.json

      - name: Record exact-head evidence identity
        id: ci_command_09
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/control-center-visual-golden-v1
          git rev-parse HEAD > /tmp/control-center-visual-golden-v1/exact-head.txt
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/control-center-visual-golden-v1/workflow-run-id.txt

      - name: Show diagnostics
        id: ci_command_10
        if: failure()
        run: cat /tmp/control-center-visual-golden-v1-server.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-center-visual-golden-v1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/control-center-visual-golden-v1/expected/**
            /tmp/control-center-visual-golden-v1/actual/**
            /tmp/control-center-visual-golden-v1/diff/**
            /tmp/control-center-visual-golden-v1/report.json
            /tmp/control-center-visual-golden-v1/failure.json
            /tmp/control-center-visual-golden-v1/negative/**
            /tmp/control-center-visual-golden-v1/exact-head.txt
            /tmp/control-center-visual-golden-v1/workflow-run-id.txt
          retention-days: 14
          if-no-files-found: error

      - name: Stop runtime
        id: ci_command_11
        if: always()
        run: kill "$(cat /tmp/control-center-visual-golden-v1-server.pid)" 2>/dev/null || true

      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["control-center-visual-golden-v1.yml"]'), 'control-center-visual-golden-v1.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["control-center-visual-golden-v1.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt control-center-visual-golden-v1.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-control-center-visual-golden-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
