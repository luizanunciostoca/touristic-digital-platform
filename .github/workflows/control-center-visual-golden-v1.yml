name: Control Center Visual Golden V1

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/control-center-visual-golden-v1.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "tests/visual-regression/control-center-v1/**"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "services/auth/**"
      - "services/destinations/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/control-center-visual-golden-v1.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs"
      - "tests/visual-regression/control-center-v1/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: control-center-visual-golden-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-golden-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: control-center-golden-ci
          MYSQL_DATABASE: control_center_golden_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcontrol-center-golden-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap reviewed Wave 3 goldens once
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="tests/visual-regression/control-center-v1"
          if test -f "$BASE_DIR/control-center-v1-1440x900.png"; then
            echo "Reviewed golden baselines already pinned."
            exit 0
          fi
          mkdir -p "$BASE_DIR" /tmp/wave3-golden
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10681151958/zip" > /tmp/wave3-golden.zip
          unzip -q /tmp/wave3-golden.zip -d /tmp/wave3-golden
          cp /tmp/wave3-golden/control-center-responsive-accessibility-v1-1440.png "$BASE_DIR/control-center-v1-1440x900.png"
          cp /tmp/wave3-golden/control-center-responsive-accessibility-v1-1280.png "$BASE_DIR/control-center-v1-1280x800.png"
          cp /tmp/wave3-golden/control-center-responsive-accessibility-v1-1024.png "$BASE_DIR/control-center-v1-1024x768.png"
          cp /tmp/wave3-golden/control-center-responsive-accessibility-v1-768.png "$BASE_DIR/control-center-v1-768x1024.png"
          cp /tmp/wave3-golden/control-center-responsive-accessibility-v1-390.png "$BASE_DIR/control-center-v1-390x844.png"
          printf '%s  %s\n' \
            4ca9dc2995aa51cecb6f7cd699bbf77b0cafbb9aa2a02d5d9bc41883712bf659 "$BASE_DIR/control-center-v1-1440x900.png" \
            aaa4a5ee6ae2c6933536fe97701a5af3ce0861feb8f5bc9aefe041e0d5be7630 "$BASE_DIR/control-center-v1-1280x800.png" \
            577b5b970cff2809b76b2da1cf9ae7b410ff7c8527b8cabbafa9acc4e1263302 "$BASE_DIR/control-center-v1-1024x768.png" \
            ec8f87995e0099bd54acbf8d85bd5106d93e1594695ce115ce35cccc5d7136c5 "$BASE_DIR/control-center-v1-768x1024.png" \
            116fc0ea9ee9f2d75504929cd15594dc1205691f4c0ba5700e04ee191888e867 "$BASE_DIR/control-center-v1-390x844.png" \
            | sha256sum --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE_DIR"/*.png
          git commit -m "test(control-center): pin reviewed Wave 3 visual goldens"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Normalize Wave 4 harness formatting once
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs \
            tests/visual-regression/control-center-v1/manual-contract.json
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs \
            tests/visual-regression/control-center-v1/manual-contract.json
          git commit -m "style(control-center): format visual golden harness"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check Wave 4 formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/control-center-visual-golden-v1.yml
          apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs
          tests/visual-regression/control-center-v1/manual-contract.json

      - name: Verify baseline inventory
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="tests/visual-regression/control-center-v1"
          for size in 1440x900 1280x800 1024x768 768x1024 390x844; do
            test -s "$BASE_DIR/control-center-v1-${size}.png"
          done

      - name: Install deterministic Chromium and image diff dependencies
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2 pixelmatch@5.3.0 pngjs@7.0.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Clean build runtime graph
        run: pnpm -w build

      - name: Start deterministic authenticated Control Center
        shell: bash
        run: |
          set -euo pipefail
          PORT=4199
          AUTH_SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="control center responsive browser fixture"
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 35))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"platform-owner-responsive",email:"platform-owner-responsive@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}]))' "$OWNER_HASH")
          DB_URL="mysql://root:control-center-golden-ci@127.0.0.1:3306/control_center_golden_ci"
          DASHBOARD_AUTH_SECRET="$AUTH_SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          AUTH_DATABASE_URL="$DB_URL" \
          CONTROL_CENTER_AUDIT_DATABASE_URL="$DB_URL" \
          DESTINATIONS_DATABASE_URL="$DB_URL" \
          TZ="America/Bahia" \
          PORT="$PORT" \
          HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs \
            >/tmp/control-center-visual-golden-v1-server.log 2>&1 &
          echo $! >/tmp/control-center-visual-golden-v1-server.pid
          for _ in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/apps/control-center/public/index.html" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/control-center-visual-golden-v1-server.log
          exit 1

      - name: Validate manual visual conformance
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4199
        shell: bash
        run: |
          CONTROL_CENTER_EXACT_HEAD="$(git rev-parse HEAD)" \
            node apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs

      - name: Prove the golden suite rejects deliberate regressions
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4199
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/control-center-visual-golden-v1/negative
          for mutation in dark-topbar hide-destination narrow-attention remove-kpi shift-sidebar; do
            if CONTROL_CENTER_EXACT_HEAD="$(git rev-parse HEAD)" \
              CONTROL_CENTER_GOLDEN_MUTATION="$mutation" \
              node apps/morro-digital-platform/tooling/control-center-visual-golden-v1-browser-contract.cjs \
              >"/tmp/control-center-visual-golden-v1/negative/${mutation}.log" 2>&1; then
              echo "FALSE_GREEN: mutation '$mutation' unexpectedly passed"
              cat "/tmp/control-center-visual-golden-v1/negative/${mutation}.log"
              exit 1
            fi
            echo "Expected failure confirmed: $mutation"
          done
          rm -f /tmp/control-center-visual-golden-v1/failure.json

      - name: Record exact-head evidence identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/control-center-visual-golden-v1
          git rev-parse HEAD > /tmp/control-center-visual-golden-v1/exact-head.txt
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/control-center-visual-golden-v1/workflow-run-id.txt

      - name: Show diagnostics
        if: failure()
        run: cat /tmp/control-center-visual-golden-v1-server.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-center-visual-golden-v1-evidence
          path: |
            /tmp/control-center-visual-golden-v1/expected/**
            /tmp/control-center-visual-golden-v1/actual/**
            /tmp/control-center-visual-golden-v1/diff/**
            /tmp/control-center-visual-golden-v1/report.json
            /tmp/control-center-visual-golden-v1/failure.json
            /tmp/control-center-visual-golden-v1/negative/**
            /tmp/control-center-visual-golden-v1/exact-head.txt
            /tmp/control-center-visual-golden-v1/workflow-run-id.txt
          retention-days: 14
          if-no-files-found: error

      - name: Stop runtime
        if: always()
        run: kill "$(cat /tmp/control-center-visual-golden-v1-server.pid)" 2>/dev/null || true

# Exact-head user-trigger marker after canonical baseline/style pinning.
