name: Temporary Affiliate Privacy Format

on:
  push:
    branches:
      - fix/affiliates-privacy-lgpd-20260823
    paths:
      - ".github/workflows/temp-affiliate-privacy-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/affiliates-privacy-lgpd-20260823
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix deterministic binary fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'services/affiliates/src/affiliate-privacy-integration.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, source.replaceAll('UNHEX(?)', 'UNHEX(SHA2(?, 256))'));
          NODE
      - name: Format privacy implementation
        run: pnpm exec prettier --write services/affiliates/src/affiliate-privacy-service.ts services/affiliates/src/affiliate-privacy-integration.test.ts
      - name: Commit branch-only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/affiliates/src/affiliate-privacy-service.ts services/affiliates/src/affiliate-privacy-integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(affiliates): normalize privacy acceptance fixtures"
            git push origin HEAD:fix/affiliates-privacy-lgpd-20260823
          fi
