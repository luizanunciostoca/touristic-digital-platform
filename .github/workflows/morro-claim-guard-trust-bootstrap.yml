name: Trusted Claim Guard Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/morro-claim-guard-trusted.yml"
      - ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
      - ".morro/changesets/MD-CP-CLAIM-ACQ-CLI-711.json"
      - ".morro/changesets/MD-CP-003-TRUST.json"
      - ".morro/changesets/MD-CP-003-TRUST-RECON.json"
      - ".morro/changesets/MD-CP-003-HOOKS.json"
      - ".morro/changesets/MD-CP-003-HOOKS-RECON.json"
      - ".morro/changesets/MD-CP-003-GOV.json"
      - ".github/morro-control/claims.json"
      - "tooling/fabric/claim-guard.mjs"
      - "tooling/fabric/claim-guard.test.mjs"
      - "tooling/fabric/claim-retirement-proof.mjs"
      - "tooling/fabric/claim-retirement-proof.test.mjs"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: trusted-claim-guard-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: trusted-claim-guard-bootstrap
    outputs:
      manifest_path: ${{ steps.changeset.outputs.path }}
      retirement: ${{ steps.transition.outputs.retirement }}
      approved_bootstrap: ${{ steps.changeset.outputs.approved_bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Resolve registered ChangeSet or the one-time approved bootstrap
        id: changeset
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" = "713" ] &&
             [ "$REPOSITORY" = "luizanunciostoca/touristic-digital-platform" ] &&
             [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] &&
             [ "$BASE_REF" = "main" ] &&
             [ "$HEAD_BRANCH" = "fix/claim-acquisition-cli-bootstrap-20261004" ] &&
             [ "$BASE_SHA" = "2ad095e4eb17bed9023a8aa6c1473b1f9c902feb" ]; then
            owner="$(gh api "repos/$REPOSITORY")"
            approval="$(
              gh api "repos/$REPOSITORY/issues/711/comments?per_page=100" --paginate --slurp |
                jq -er --arg head "$HEAD_SHA" --argjson repository "$owner" '
                  $repository.owner as $owner |
                  if $owner.type != "User" or ($owner.id | type) != "number" then false
                  else
                    [.[][] | select(
                      .user.id == $owner.id and
                      .user.login == $owner.login and
                      .user.type == "User" and
                      .author_association == "OWNER" and
                      .performed_via_github_app == null and
                      .body == ("APPROVED_BOOTSTRAP_HEAD:" + $head)
                    )] | length == 1
                  end
                '
            )"
            test "$approval" = "true"
            echo "approved_bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "path=.morro/changesets/MD-CP-CLAIM-ACQ-CLI-711.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "approved_bootstrap=false" >> "$GITHUB_OUTPUT"
          path="$(node tooling/fabric/resolve-changeset.mjs "$HEAD_BRANCH")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Classify claim registry transition
        id: transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_claims="$(mktemp)"
          git show "$BASE_SHA:.github/morro-control/claims.json" > "$base_claims"
          removed_count="$(jq -n --slurpfile base "$base_claims" --slurpfile candidate .github/morro-control/claims.json '($base[0].claims | keys) - ($candidate[0].claims | keys) | length')"
          added_count="$(jq -n --slurpfile base "$base_claims" --slurpfile candidate .github/morro-control/claims.json '($candidate[0].claims | keys) - ($base[0].claims | keys) | length')"
          retirement=false
          if [ "$removed_count" -eq 1 ] && [ "$added_count" -eq 0 ]; then retirement=true; fi
          echo "retirement=$retirement" >> "$GITHUB_OUTPUT"

      - name: Test trusted Claim Guard contract
        run: >-
          node --test
          tooling/fabric/claim-guard.test.mjs
          tooling/fabric/claim-retirement-proof.test.mjs

  orchestrator-registry-proof:
    if: needs.unit.outputs.retirement != 'true' && needs.unit.outputs.approved_bootstrap != 'true'
    needs: unit
    name: base-controlled-orchestrator-registry-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate registry mutation with ORCHESTRATOR authority when present
        id: registry-proof
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
          MANIFEST_PATH: ${{ needs.unit.outputs.manifest_path }}
          CLAIM_GUARD_AUTHORITY: ORCHESTRATOR
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -C candidate diff --name-only "$EXPECTED_BASE_SHA...$EXPECTED_CANDIDATE_SHA")"
          if ! grep -Fxq '.github/morro-control/claims.json' <<<"$changed"; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No claim registry mutation detected."
            exit 0
          fi

          manifest_id="$(jq -r '.id // empty' "candidate/$MANIFEST_PATH")"
          test -n "$manifest_id"
          owner="$(jq -r --arg id "$manifest_id" '.claims[$id].owner // empty' candidate/.github/morro-control/claims.json)"
          test "$owner" = "CHATGPT-PRO-CONTROL"

          echo "required=true" >> "$GITHUB_OUTPUT"
          node trusted/tooling/fabric/claim-guard.mjs candidate             | tee orchestrator-claim-guard-proof.json

      - name: Upload orchestrator Claim Guard proof
        if: steps.registry-proof.outputs.required == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orchestrator-claim-guard-proof-${{ github.event.pull_request.head.sha }}
          path: orchestrator-claim-guard-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove every removed claim from trusted base evidence
        id: claim-retirement-proof
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          removed_count="$(
            jq -n               --slurpfile base trusted/.github/morro-control/claims.json               --slurpfile candidate candidate/.github/morro-control/claims.json               '($base[0].claims | keys) - ($candidate[0].claims | keys) | length'
          )"
          if [ "$removed_count" -eq 0 ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No claim retirements detected."
            exit 0
          fi

          test -f trusted/tooling/fabric/claim-retirement-proof.mjs || {
            echo "CLAIM_RETIREMENT_VALIDATOR_NOT_TRUSTED" >&2
            exit 1
          }

          echo "required=true" >> "$GITHUB_OUTPUT"
          node trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate             | tee claim-retirement-proof.json

      - name: Upload claim retirement proof
        if: steps.claim-retirement-proof.outputs.required == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-retirement-proof-${{ github.event.pull_request.head.sha }}
          path: claim-retirement-proof.json
          if-no-files-found: error
          retention-days: 30

  approved-bootstrap-proof:
    # Read-only baseline proof must be available before exact-head owner approval.
    if: ${{ always() && (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 713 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-acquisition-cli-bootstrap-20261004' && github.event.pull_request.base.sha == '2ad095e4eb17bed9023a8aa6c1473b1f9c902feb') }}
    needs: unit
    name: approved-bootstrap-exact-head-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prove exact approved bootstrap scope and behavior
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_NUMBER" = "713"
          test "$EXPECTED_BRANCH" = "fix/claim-acquisition-cli-bootstrap-20261004"
          test "$EXPECTED_BASE" = "2ad095e4eb17bed9023a8aa6c1473b1f9c902feb"
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          mapfile -t changed < <(git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort)
          expected=(
            ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
            ".github/workflows/morro-claim-guard.yml"
            ".github/workflows/morro-merge-gate.yml"
            ".morro/changesets/MD-CP-CLAIM-ACQ-CLI-711.json"
            "tooling/control-state/mdctl-merge-gate.test.mjs"
            "tooling/fabric/claim-guard.mjs"
            "tooling/fabric/claim-guard.test.mjs"
            "tooling/mdctl/merge-gate.mjs"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          # Baseline regression assertions and all unchanged dependencies come from
          # the trusted base. Only the two implementation modules are replaced.
          # This is baseline coverage, not certification of the new exception.
          proof_root="$(mktemp -d)"
          trap 'rm -rf "$proof_root"' EXIT
          git -C trusted archive "$EXPECTED_BASE" | tar -x -C "$proof_root"
          for module in tooling/fabric/claim-guard.mjs tooling/mdctl/merge-gate.mjs; do
            test "$(git -C candidate ls-tree "$EXPECTED_HEAD" -- "$module" | awk '{print $1}')" = "100644"
            git -C candidate show "$EXPECTED_HEAD:$module" > "$proof_root/$module"
          done
          (
            cd "$proof_root"
            node --test tooling/fabric/claim-guard.test.mjs tooling/control-state/mdctl-merge-gate.test.mjs
          )

  retirement-proof:
    if: needs.unit.outputs.retirement == 'true'
    needs: unit
    name: base-controlled-retirement-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prove retirement from trusted base evidence
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          node --test trusted/tooling/fabric/claim-retirement-proof.test.mjs
          node trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate | tee claim-retirement-proof.json
      - name: Upload retirement proof
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-retirement-proof-${{ github.event.pull_request.head.sha }}
          path: claim-retirement-proof.json
          if-no-files-found: error
          retention-days: 30

  independent-proof:
    # Proof may run before approval, but cannot waive the failing approval gate.
    if: ${{ always() && needs.unit.outputs.retirement != 'true' && (needs.unit.result == 'success' || (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 713 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-acquisition-cli-bootstrap-20261004' && github.event.pull_request.base.sha == '2ad095e4eb17bed9023a8aa6c1473b1f9c902feb')) }}
    needs: unit
    name: base-controlled-independent-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@504d587c9eb780cff01aae71d377b2c2aec99054
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      manifest_path: ${{ (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 713 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-acquisition-cli-bootstrap-20261004' && github.event.pull_request.base.sha == '2ad095e4eb17bed9023a8aa6c1473b1f9c902feb') && '.morro/changesets/MD-CP-CLAIM-ACQ-CLI-711.json' || needs.unit.outputs.manifest_path }}
    permissions:
      contents: read

  claim-handoff-proof:
    if: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-trust-reconcile-20260928' }}
    name: base-controlled-claim-handoff-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-claim-guard-trusted.yml@7105d020d167d7f6aa89091e7529fb3b7c8dbc5a
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      manifest_path: .morro/changesets/MD-CP-003-TRUST-RECON.json
      handoff_from_manifest_path: .morro/changesets/MD-CP-003-TRUST.json
      handoff_to_manifest_path: .morro/changesets/MD-CP-003-HOOKS.json
    permissions:
      contents: read

  hooks-claim-handoff-proof:
    if: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-hooks-reconcile-20260928' }}
    name: base-controlled-hooks-claim-handoff-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-claim-guard-trusted.yml@7105d020d167d7f6aa89091e7529fb3b7c8dbc5a
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      manifest_path: .morro/changesets/MD-CP-003-HOOKS-RECON.json
      handoff_from_manifest_path: .morro/changesets/MD-CP-003-HOOKS.json
      handoff_to_manifest_path: .morro/changesets/MD-CP-003-GOV.json
    permissions:
      contents: read
