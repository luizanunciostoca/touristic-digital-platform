name: Trusted Claim Guard Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/hooks/morro-claim-guard.json"
      - ".github/hooks/morro-pretool-guard.mjs"
      - ".github/hooks/morro-pretool-guard.test.mjs"
      - ".github/workflows/morro-claim-guard-trusted.yml"
      - ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
      - ".morro/changesets/MD-CP-003-TRUST.json"
      - "tooling/fabric/claim-guard.mjs"
      - "tooling/fabric/claim-guard.test.mjs"

permissions:
  contents: read

concurrency:
  group: trusted-claim-guard-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: trusted-claim-guard-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install formatting dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format bootstrap source for deterministic export
        run: >-
          pnpm exec prettier --write
          tooling/fabric/claim-guard.mjs
          tooling/fabric/claim-guard.test.mjs
          .github/hooks/morro-pretool-guard.mjs
          .github/hooks/morro-pretool-guard.test.mjs

      - name: Upload deterministic formatted source
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-guard-prettier-${{ github.event.pull_request.head.sha }}
          path: |
            tooling/fabric/claim-guard.mjs
            tooling/fabric/claim-guard.test.mjs
            .github/hooks/morro-pretool-guard.mjs
            .github/hooks/morro-pretool-guard.test.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Test Claim Guard and pre-tool safety contracts
        run: >-
          node --test
          tooling/fabric/claim-guard.test.mjs
          .github/hooks/morro-pretool-guard.test.mjs

  independent-proof:
    name: base-controlled-independent-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@4729cbfa5bd0b1ee0796fd0c2840c779fe3476db
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      manifest_path: .morro/changesets/MD-CP-003-TRUST.json
    permissions:
      contents: read
