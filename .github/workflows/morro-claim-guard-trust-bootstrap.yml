name: Trusted Claim Guard Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/morro-claim-guard-trusted.yml"
      - ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
      - ".morro/changesets/MD-CP-CLAIM-LIFECYCLE-711.json"
      - ".morro/changesets/MD-CP-SCHEDULER-REANCHOR-718.json"
      - ".github/workflows/morro-merge-gate.yml"
      - "tooling/mdctl/scheduler-live.mjs"
      - "tooling/control-state/mdctl-scheduler.test.mjs"
      - "tooling/control-state/mdctl-merge-gate.test.mjs"
      - "tooling/control-state/trust-root-reconciliation.test.mjs"
      - ".morro/changesets/MD-CP-003-TRUST.json"
      - ".morro/changesets/MD-CP-003-TRUST-RECON.json"
      - ".morro/changesets/MD-CP-003-HOOKS.json"
      - ".morro/changesets/MD-CP-003-HOOKS-RECON.json"
      - ".morro/changesets/MD-CP-003-GOV.json"
      - ".github/morro-control/claims.json"
      - "tooling/fabric/claim-guard.mjs"
      - "tooling/fabric/claim-guard.test.mjs"
      - "tooling/fabric/claim-retirement-proof.mjs"
      - "tooling/fabric/claim-retirement-proof.test.mjs"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: trusted-claim-guard-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: trusted-claim-guard-bootstrap
    outputs:
      manifest_path: ${{ steps.changeset.outputs.path }}
      retirement: ${{ steps.transition.outputs.retirement }}
      approved_bootstrap: ${{ steps.changeset.outputs.approved_bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Resolve registered ChangeSet or the one-time approved bootstrap
        id: changeset
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" = "719" ] &&
             [ "$REPOSITORY" = "luizanunciostoca/touristic-digital-platform" ] &&
             [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] &&
             [ "$BASE_REF" = "main" ] &&
             [ "$HEAD_BRANCH" = "fix/scheduler-reanchor-bootstrap-20261004" ] &&
             [ "$BASE_SHA" = "d006a94aecfb7a70f9829acdc14ff5a22a142201" ]; then
            owner="$(gh api "repos/$REPOSITORY")"
            approval="$(
              gh api "repos/$REPOSITORY/issues/718/comments?per_page=100" --paginate --slurp |
                jq -er --arg head "$HEAD_SHA" --argjson repository "$owner" '
                  $repository.owner as $owner |
                  if $owner.type != "User" or ($owner.id | type) != "number" then false
                  else
                    [.[][] | select(
                      .user.id == $owner.id and
                      .user.login == $owner.login and
                      .user.type == "User" and
                      .author_association == "OWNER" and
                      .performed_via_github_app == null and
                      .body == ("APPROVED_BOOTSTRAP_HEAD:" + $head)
                    )] | length == 1
                  end
                '
            )"
            test "$approval" = "true"
            echo "approved_bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "path=.morro/changesets/MD-CP-SCHEDULER-REANCHOR-718.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_NUMBER" = "714" ] &&
             [ "$REPOSITORY" = "luizanunciostoca/touristic-digital-platform" ] &&
             [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] &&
             [ "$BASE_REF" = "main" ] &&
             [ "$HEAD_BRANCH" = "fix/claim-lifecycle-bootstrap-20261004" ] &&
             [ "$BASE_SHA" = "de6c1637abc98e4e86e9c575ac0aaeb00a99551c" ]; then
            owner="$(gh api "repos/$REPOSITORY")"
            approval="$(
              gh api "repos/$REPOSITORY/issues/711/comments?per_page=100" --paginate --slurp |
                jq -er --arg head "$HEAD_SHA" --argjson repository "$owner" '
                  $repository.owner as $owner |
                  if $owner.type != "User" or ($owner.id | type) != "number" then false
                  else
                    [.[][] | select(
                      .user.id == $owner.id and
                      .user.login == $owner.login and
                      .user.type == "User" and
                      .author_association == "OWNER" and
                      .performed_via_github_app == null and
                      .body == ("APPROVED_BOOTSTRAP_HEAD:" + $head)
                    )] | length == 1
                  end
                '
            )"
            test "$approval" = "true"
            echo "approved_bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "path=.morro/changesets/MD-CP-CLAIM-LIFECYCLE-711.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "approved_bootstrap=false" >> "$GITHUB_OUTPUT"
          path="$(node tooling/fabric/resolve-changeset.mjs "$HEAD_BRANCH")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Classify claim registry transition
        id: transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_claims="$(mktemp)"
          git show "$BASE_SHA:.github/morro-control/claims.json" > "$base_claims"
          removed_count="$(jq -n --slurpfile base "$base_claims" --slurpfile candidate .github/morro-control/claims.json '($base[0].claims | keys) - ($candidate[0].claims | keys) | length')"
          added_count="$(jq -n --slurpfile base "$base_claims" --slurpfile candidate .github/morro-control/claims.json '($candidate[0].claims | keys) - ($base[0].claims | keys) | length')"
          retirement=false
          if [ "$removed_count" -eq 1 ] && [ "$added_count" -eq 0 ]; then retirement=true; fi
          echo "retirement=$retirement" >> "$GITHUB_OUTPUT"

      - name: Test trusted Claim Guard contract
        run: >-
          node --test
          tooling/fabric/claim-guard.test.mjs
          tooling/fabric/claim-retirement-proof.test.mjs
          tooling/quality/independent-proof-trusted.test.mjs

  orchestrator-registry-proof:
    if: needs.unit.outputs.retirement != 'true' && needs.unit.outputs.approved_bootstrap != 'true'
    needs: unit
    name: base-controlled-orchestrator-registry-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate registry mutation with ORCHESTRATOR authority when present
        id: registry-proof
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
          MANIFEST_PATH: ${{ needs.unit.outputs.manifest_path }}
          CLAIM_GUARD_AUTHORITY: ORCHESTRATOR
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -C candidate diff --name-only "$EXPECTED_BASE_SHA...$EXPECTED_CANDIDATE_SHA")"
          if ! grep -Fxq '.github/morro-control/claims.json' <<<"$changed"; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No claim registry mutation detected."
            exit 0
          fi

          manifest_id="$(jq -r '.id // empty' "candidate/$MANIFEST_PATH")"
          test -n "$manifest_id"
          owner="$(jq -r --arg id "$manifest_id" '.claims[$id].owner // empty' candidate/.github/morro-control/claims.json)"
          test "$owner" = "CHATGPT-PRO-CONTROL"

          echo "required=true" >> "$GITHUB_OUTPUT"
          node trusted/tooling/fabric/claim-guard.mjs candidate             | tee orchestrator-claim-guard-proof.json

      - name: Upload orchestrator Claim Guard proof
        if: steps.registry-proof.outputs.required == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orchestrator-claim-guard-proof-${{ github.event.pull_request.head.sha }}
          path: orchestrator-claim-guard-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove every removed claim from trusted base evidence
        id: claim-retirement-proof
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          removed_count="$(
            jq -n               --slurpfile base trusted/.github/morro-control/claims.json               --slurpfile candidate candidate/.github/morro-control/claims.json               '($base[0].claims | keys) - ($candidate[0].claims | keys) | length'
          )"
          if [ "$removed_count" -eq 0 ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No claim retirements detected."
            exit 0
          fi

          test -f trusted/tooling/fabric/claim-retirement-proof.mjs || {
            echo "CLAIM_RETIREMENT_VALIDATOR_NOT_TRUSTED" >&2
            exit 1
          }

          echo "required=true" >> "$GITHUB_OUTPUT"
          node trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate             | tee claim-retirement-proof.json

      - name: Upload claim retirement proof
        if: steps.claim-retirement-proof.outputs.required == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-retirement-proof-${{ github.event.pull_request.head.sha }}
          path: claim-retirement-proof.json
          if-no-files-found: error
          retention-days: 30

  approved-bootstrap-proof:
    # Read-only baseline proof must be available before exact-head owner approval.
    if: ${{ always() && (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 714 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-lifecycle-bootstrap-20261004' && github.event.pull_request.base.sha == 'de6c1637abc98e4e86e9c575ac0aaeb00a99551c') }}
    needs: unit
    name: approved-bootstrap-exact-head-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prove exact approved bootstrap scope and behavior
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_NUMBER" = "714"
          test "$EXPECTED_BRANCH" = "fix/claim-lifecycle-bootstrap-20261004"
          test "$EXPECTED_BASE" = "de6c1637abc98e4e86e9c575ac0aaeb00a99551c"
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          mapfile -t changed < <(git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort)
          expected=(
            ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
            ".github/workflows/morro-claim-guard.yml"
            ".github/workflows/morro-merge-gate.yml"
            ".morro/changesets/MD-CP-CLAIM-LIFECYCLE-711.json"
            "tooling/control-state/mdctl-merge-gate.test.mjs"
            "tooling/fabric/claim-guard.mjs"
            "tooling/fabric/claim-guard.test.mjs"
            "tooling/mdctl/merge-gate.mjs"
            "tooling/quality/independent-proof-trusted.mjs"
            "tooling/quality/independent-proof-trusted.test.mjs"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          # Base assertions are retained with a hash-bound, explicit fixture migration.
          # Original control, unmigrated RED and the complete migrated PASS are retained.
          proof_root="$(mktemp -d)"
          evidence_root="$GITHUB_WORKSPACE/claim-lifecycle-baseline"
          mkdir -p "$evidence_root"
          trap 'rm -rf "$proof_root"' EXIT
          git -C trusted archive "$EXPECTED_BASE" | tar -x -C "$proof_root"
          tests=(tooling/fabric/claim-guard.test.mjs tooling/control-state/mdctl-merge-gate.test.mjs tooling/quality/independent-proof-trusted.test.mjs)
          run_tests() { (cd "$proof_root" && node --test "${tests[@]}") > "$evidence_root/$1" 2>&1; }
          run_tests baseline-control.tap
          for module in tooling/fabric/claim-guard.mjs tooling/mdctl/merge-gate.mjs tooling/quality/independent-proof-trusted.mjs; do
            test "$(git -C candidate ls-tree "$EXPECTED_HEAD" -- "$module" | awk '{print $1}')" = "100644"
            git -C candidate show "$EXPECTED_HEAD:$module" > "$proof_root/$module"
          done
          if run_tests baseline-unmigrated.tap; then
            echo "BASELINE_UNSAFE_ACQUISITION_STILL_ACCEPTED" >&2
            exit 1
          fi
          python3 - "$proof_root" "$evidence_root" <<'PY_MIGRATE'
          #!/usr/bin/env python3
          """Exact, auditable test-fixture migration for main de6c1637; archive copies only."""
          import argparse, difflib, hashlib, json, pathlib, re
          BASE='de6c1637abc98e4e86e9c575ac0aaeb00a99551c'
          EXPECTED={
           'tooling/fabric/claim-guard.test.mjs':'ffa7f2ff59ea747b5f6aa44d7d1911af5403299d903a1709ba44fc721ccb30d0',
           'tooling/control-state/mdctl-merge-gate.test.mjs':'43b1bc48195ccdb7e74be3762b8a8ded16bf1a20bba75a5ffebfb893336ac851',
          }
          parser=argparse.ArgumentParser();parser.add_argument('archive_root',type=pathlib.Path);parser.add_argument('evidence_root',type=pathlib.Path);args=parser.parse_args()
          root=args.archive_root.resolve();out=args.evidence_root.resolve()
          assert root.is_dir() and not (root/'.git').exists(),'ARCHIVE_COPY_REQUIRED'
          assert root!=out and root not in out.parents,'EVIDENCE_MUST_BE_OUTSIDE_ARCHIVE'
          out.mkdir(parents=True,exist_ok=True)
          old={p:(root/p).read_text() for p in EXPECTED}
          for p,h in EXPECTED.items():assert hashlib.sha256(old[p].encode()).hexdigest()==h,'BASE_PREIMAGE_MISMATCH:'+p
          new=dict(old);edits=[]
          def replace(path,label,before,after):
           assert new[path].count(before)==1,'EXACTLY_ONE_PREIMAGE_REQUIRED:'+label
           new[path]=new[path].replace(before,after,1);edits.append({'file':path,'change':label,'replacements':1})
          g='tooling/fabric/claim-guard.test.mjs';m='tooling/control-state/mdctl-merge-gate.test.mjs'
          replace(g,'acquisition CLI fixture owns only persistent implementation',
          '''  manifest.owns = {
              paths: [
                registryPath,
                ledgerPath,
                manifestPath,
                "tooling/quality/cli-owned.mjs",
              ],
              contracts: [],
            };''',
          '''  manifest.owns = {
              paths: [manifestPath, "tooling/quality/cli-owned.mjs"],
              contracts: [],
            };''')
          replace(g,'already-canonical disjoint claim is valid',
          '''      if (scenario === "valid") {''',
          '''      if (scenario === "valid" || scenario === "existing claim") {''')
          replace(g,'already-canonical proof uses its actual requested base',
          '''        assert.equal(proof.currentBaseSha, f.base);''',
          '''        assert.equal(proof.currentBaseSha, f.env.EXPECTED_BASE_SHA);''')
          replace(g,'already-canonical fixture has no changed files',
          '''          [f.registryPath, f.ledgerPath, f.manifestPath].sort(),''',
          '''          scenario === "existing claim"
                      ? []
                      : [f.registryPath, f.ledgerPath, f.manifestPath].sort(),''')
          for variable,anchor,label in [
           ('candidate','  const currentClaim = claim(candidate, { status: "IMPLEMENTING" });','pure acquisition factory keeps metadata transient'),
           ('candidateManifest','  const candidateClaim = claim(candidateManifest, { status: "IMPLEMENTING" });','Git acquisition factory keeps metadata transient'),
          ]:
           insertion=f'''  {variable}.owns.paths = {variable}.owns.paths.filter(
              (path) =>
                ![
                  ".github/morro-control/claims.json",
                  ".github/morro-control/events.ndjson",
                ].includes(path),
            );
          '''
           replace(m,label,anchor,insertion+anchor)
          assert len(edits)==6,'EXACT_SIX_EDITS_REQUIRED'
          report={'baseSha':BASE,'purpose':'Explicit fixture-only contract migration; source assertions retained except the documented already-canonical disjoint-claim expectation.','edits':edits,'files':[]}
          patch=[]
          for p in EXPECTED:
           # No test definitions/names removed, and no skip/todo/only marker introduced.
           tests=lambda s:re.findall(r'^test\((.*)$',s,re.M)
           assert tests(old[p])==tests(new[p]),'TEST_DEFINITIONS_CHANGED:'+p
           marks=lambda s:re.findall(r'\btest\.(?:skip|todo|only)\b',s)
           assert marks(old[p])==marks(new[p]),'TEST_SELECTION_CHANGED:'+p
           patch.extend(difflib.unified_diff(old[p].splitlines(True),new[p].splitlines(True),fromfile='a/'+p,tofile='b/'+p,n=5))
           report['files'].append({'path':p,'preimageSha256':EXPECTED[p],'postimageSha256':hashlib.sha256(new[p].encode()).hexdigest(),'testDeclarations':len(tests(new[p]))})
          # Write only after every preimage/count/invariant was checked.
          for p in EXPECTED:(root/p).write_text(new[p])
          patch_text=''.join(patch);(out/'migration.patch').write_text(patch_text)
          report['patchSha256']=hashlib.sha256(patch_text.encode()).hexdigest()
          (out/'migration.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY_MIGRATE
          run_tests baseline-migrated.tap
          python3 - "$evidence_root" <<'PY_VERIFY'
          import json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          expected={
            "claim acquisition accepts exactly one bounded orchestrator claim",
            "claim acquisition permits only mandatory bookkeeping overlap with a surviving claim",
            "claim acquisition never ignores non-path semantic collisions",
            "claim acquisition rejects authority, event, scope and trust weakening",
            "claim acquisition preserves invalid concurrent fail-closed behavior",
            "claim acquisition enforces active PR and global writer limits",
            "claim acquisition enforces semantic collision and exact trust binding",
            "runMergeGate routes one new claim through trusted acquisition mode",
            "real CLI acquisition: valid",
          }
          for name, failures in [("baseline-control.tap",0),("baseline-unmigrated.tap",9),("baseline-migrated.tap",0)]:
            tap=(root/name).read_text()
            counts={k:int(v) for k,v in re.findall(r'^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$',tap,re.M)}
            assert counts=={"tests":139,"pass":139-failures,"fail":failures,"cancelled":0,"skipped":0,"todo":0}, "BASELINE_COUNTS_MISMATCH"
            if failures:
              blocks=re.findall(r'^not ok \d+ - ([^\n]+)\n([\s\S]*?)(?=^(?:ok|not ok) \d+ -|\Z)',tap,re.M)
              assert len(blocks)==9 and {n for n,_ in blocks}==expected, "BASELINE_UNEXPECTED_CONTRACT_DELTA"
              assert all("ACQUISITION_PERSISTENT_BOOKKEEPING_FORBIDDEN" in body for _,body in blocks), "BASELINE_WRONG_REJECTION"
          print(json.dumps({"baselineControl":139,"explicitContractDeltas":9,"migratedBaselinePassed":139,"skipped":0}))
          PY_VERIFY

      - name: Upload explicit baseline contract migration evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-lifecycle-baseline-${{ github.event.pull_request.head.sha }}
          path: claim-lifecycle-baseline/
          if-no-files-found: error

  scheduler-reanchor-bootstrap-proof:
    if: ${{ always() && (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 719 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/scheduler-reanchor-bootstrap-20261004' && github.event.pull_request.base.sha == 'd006a94aecfb7a70f9829acdc14ff5a22a142201') }}
    needs: unit
    name: base-controlled-scheduler-reanchor-proof
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prove exact bootstrap scope and trusted baseline compatibility
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "fix/scheduler-reanchor-bootstrap-20261004"
          test "$EXPECTED_BASE" = "d006a94aecfb7a70f9829acdc14ff5a22a142201"
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          mapfile -t changed < <(git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort)
          expected=(
            ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
            ".github/workflows/morro-claim-guard.yml"
            ".github/workflows/morro-merge-gate.yml"
            ".morro/changesets/MD-CP-SCHEDULER-REANCHOR-718.json"
            "tooling/control-state/mdctl-scheduler.test.mjs"
            "tooling/control-state/trust-root-reconciliation.test.mjs"
            "tooling/mdctl/scheduler-live.mjs"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          proof_root="$(mktemp -d)"
          trap 'rm -rf "$proof_root"' EXIT
          git -C trusted archive "$EXPECTED_BASE" | tar -x -C "$proof_root"
          cp candidate/tooling/mdctl/scheduler-live.mjs "$proof_root/tooling/mdctl/scheduler-live.mjs"
          (cd "$proof_root" && node --test --test-reporter=tap tooling/control-state/mdctl-scheduler.test.mjs tooling/control-state/trust-root-reconciliation.test.mjs) | tee trusted-baseline-with-candidate-scheduler.tap
          grep -Fq "# fail 0" trusted-baseline-with-candidate-scheduler.tap
      - name: Prove new exact-head reanchor regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate && node --test --test-reporter=tap tooling/control-state/mdctl-scheduler.test.mjs tooling/control-state/trust-root-reconciliation.test.mjs) | tee scheduler-reanchor-candidate.tap
          grep -Fq "live collector accepts exact trusted reanchor bookkeeping only" scheduler-reanchor-candidate.tap
          grep -Fq "live collector rejects reanchor bookkeeping without exact-head trusted proof" scheduler-reanchor-candidate.tap
          grep -Fq "live collector never widens trusted reanchor bookkeeping to extra paths" scheduler-reanchor-candidate.tap
          grep -Fq "live collector rejects semantic authority mutation even during reanchor" scheduler-reanchor-candidate.tap
          grep -Fq "# fail 0" scheduler-reanchor-candidate.tap
          grep -Fq 'trust?.authority !== "TRUSTED_CLAIM_GUARD_EXACT_HEAD"' candidate/tooling/mdctl/scheduler-live.mjs
          grep -Fq '".github/morro-control/claims.json"' candidate/tooling/mdctl/scheduler-live.mjs
          grep -Fq '".github/morro-control/events.ndjson"' candidate/tooling/mdctl/scheduler-live.mjs
      - name: Upload scheduler reanchor bootstrap proof
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: scheduler-reanchor-bootstrap-${{ github.event.pull_request.head.sha }}
          path: |
            trusted-baseline-with-candidate-scheduler.tap
            scheduler-reanchor-candidate.tap
          if-no-files-found: error
          retention-days: 30
  retirement-proof:
    if: needs.unit.outputs.retirement == 'true'
    needs: unit
    name: base-controlled-retirement-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prove retirement from trusted base evidence
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          node --test trusted/tooling/fabric/claim-retirement-proof.test.mjs
          node trusted/tooling/fabric/claim-retirement-proof.mjs trusted candidate | tee claim-retirement-proof.json
      - name: Upload retirement proof
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: claim-retirement-proof-${{ github.event.pull_request.head.sha }}
          path: claim-retirement-proof.json
          if-no-files-found: error
          retention-days: 30

  independent-proof:
    # Proof may run before approval, but cannot waive the failing approval gate.
    if: ${{ always() && needs.unit.outputs.retirement != 'true' && (needs.unit.result == 'success' || (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 714 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-lifecycle-bootstrap-20261004' && github.event.pull_request.base.sha == 'de6c1637abc98e4e86e9c575ac0aaeb00a99551c')) }}
    needs: unit
    name: base-controlled-independent-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@504d587c9eb780cff01aae71d377b2c2aec99054
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      manifest_path: ${{ (github.repository == 'luizanunciostoca/touristic-digital-platform' && github.event.pull_request.number == 714 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/claim-lifecycle-bootstrap-20261004' && github.event.pull_request.base.sha == 'de6c1637abc98e4e86e9c575ac0aaeb00a99551c') && '.morro/changesets/MD-CP-CLAIM-LIFECYCLE-711.json' || needs.unit.outputs.manifest_path }}
    permissions:
      contents: read

  claim-handoff-proof:
    if: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-trust-reconcile-20260928' }}
    name: base-controlled-claim-handoff-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-claim-guard-trusted.yml@7105d020d167d7f6aa89091e7529fb3b7c8dbc5a
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      manifest_path: .morro/changesets/MD-CP-003-TRUST-RECON.json
      handoff_from_manifest_path: .morro/changesets/MD-CP-003-TRUST.json
      handoff_to_manifest_path: .morro/changesets/MD-CP-003-HOOKS.json
    permissions:
      contents: read

  hooks-claim-handoff-proof:
    if: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-hooks-reconcile-20260928' }}
    name: base-controlled-hooks-claim-handoff-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-claim-guard-trusted.yml@7105d020d167d7f6aa89091e7529fb3b7c8dbc5a
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      manifest_path: .morro/changesets/MD-CP-003-HOOKS-RECON.json
      handoff_from_manifest_path: .morro/changesets/MD-CP-003-HOOKS.json
      handoff_to_manifest_path: .morro/changesets/MD-CP-003-GOV.json
    permissions:
