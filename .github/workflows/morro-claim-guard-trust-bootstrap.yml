name: Trusted Claim Guard Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/morro-claim-guard-trusted.yml"
      - ".github/workflows/morro-claim-guard-trust-bootstrap.yml"
      - ".morro/changesets/MD-CP-003-TRUST.json"
      - ".morro/changesets/MD-CP-003-TRUST-RECON.json"
      - "tooling/fabric/claim-guard.mjs"
      - "tooling/fabric/claim-guard.test.mjs"

permissions:
  contents: read

concurrency:
  group: trusted-claim-guard-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: trusted-claim-guard-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Test trusted Claim Guard contract
        run: >-
          node --test
          tooling/fabric/claim-guard.test.mjs

  independent-proof:
    name: base-controlled-independent-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-agent-profiles-trusted.yml@3973e2ddab85d6ee3c3865ab9411513e65db85ed
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      manifest_path: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-trust-reconcile-20260928' && '.morro/changesets/MD-CP-003-TRUST-RECON.json' || '.morro/changesets/MD-CP-003-TRUST.json' }}
    permissions:
      contents: read

  claim-handoff-proof:
    if: ${{ github.event.pull_request.head.ref == 'infra/control-plane-v3.2-stage-c-trust-reconcile-20260928' }}
    name: base-controlled-claim-handoff-proof
    uses: luizanunciostoca/touristic-digital-platform/.github/workflows/morro-claim-guard-trusted.yml@395db872a76e73193e5507cd044e5943be14b4bc
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      manifest_path: .morro/changesets/MD-CP-003-TRUST-RECON.json
      handoff_from_manifest_path: .morro/changesets/MD-CP-003-TRUST.json
      handoff_to_manifest_path: .morro/changesets/MD-CP-003-HOOKS.json
    permissions:
      contents: read
