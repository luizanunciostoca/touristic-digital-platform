name: M138 Format Integration Once

on:
  push:
    branches:
      - feat/payments-m138-checkout-application

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m138-checkout-application
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tooling/payments/checkout-mysql-integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/payments/checkout-mysql-integration.test.ts
          git commit -m "style: format M138 MySQL integration"
          git push origin HEAD:feat/payments-m138-checkout-application
