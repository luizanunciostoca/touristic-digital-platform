name: Assistant Modal Reading Order

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/assistant-modal-reading-order.yml
      - apps/morro-digital-platform/src/assistant/assistant-navigation-feedback.ts
      - apps/morro-digital-platform/src/assistant/assistant-single-message-controller.ts
      - apps/morro-digital-platform/src/assistant/assistant-shell-ui.ts
      - apps/morro-digital-platform/src/assistant/assistant-ui-state.ts
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - apps/morro-digital-platform/public/assistant-v2.css
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/main.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/runtime/browser-locale.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modal-reading-order:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start deterministic runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/assistant-modal-order.log 2>&1 &
          echo $! >/tmp/assistant-modal-order.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/assistant-modal-order.log
          exit 1
      - name: Verify assistant text precedes restored options
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('morro-digital-language', 'pt-BR');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#map[data-map-state="ready"]').waitFor({ state: 'attached', timeout: 20000 });
              const trigger = page.locator('.mood-button[data-assistant-shell-ready="true"]');
              await trigger.waitFor({ state: 'visible', timeout: 15000 });
              if (await page.locator('#assistant-messages:not(.hidden)').isVisible()) {
                await page.keyboard.press('Escape');
                await page.locator('#assistant-messages.hidden').waitFor({ state: 'attached', timeout: 5000 });
              }
              await trigger.focus();
              await trigger.click();
              await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });
              await page.waitForTimeout(150);

              const modalV2 = await page.evaluate(() => {
                const dialog = document.getElementById('assistant-messages');
                const status = document.getElementById('assistant-dialog-status');
                const composer = document.getElementById('assistant-input-area');
                return {
                  role: dialog?.getAttribute('role'),
                  ariaModal: dialog?.getAttribute('aria-modal'),
                  ariaHidden: dialog?.getAttribute('aria-hidden'),
                  busy: dialog?.getAttribute('aria-busy'),
                  state: dialog?.getAttribute('data-assistant-state'),
                  statusRole: status?.getAttribute('role'),
                  composerRole: composer?.getAttribute('role'),
                  focusedInput: document.activeElement?.id === 'assistantInput',
                };
              });
              if (
                modalV2.role !== 'dialog' ||
                modalV2.ariaModal !== 'false' ||
                modalV2.ariaHidden !== 'false' ||
                modalV2.busy !== 'false' ||
                modalV2.state !== 'idle' ||
                modalV2.statusRole !== 'status' ||
                modalV2.composerRole !== 'group' ||
                !modalV2.focusedInput
              ) {
                throw new Error(`Assistant Modal V2 semantics/focus diverged: ${JSON.stringify(modalV2)}`);
              }

              await page.evaluate(() => {
                document.dispatchEvent(new CustomEvent('morro:assistant-ui-state', {
                  detail: { state: 'loading' },
                }));
              });
              await page.locator('#assistant-messages[aria-busy="true"][data-assistant-state="loading"]').waitFor({
                state: 'attached',
                timeout: 5000,
              });
              const loadingStatus = (await page.locator('#assistant-dialog-status').textContent())?.trim() ?? '';
              if (!loadingStatus.includes('Preparando resposta')) {
                throw new Error(`Assistant loading announcement missing: ${loadingStatus}`);
              }

              const loadingSkeleton = await page.locator(
                '#assistant-messages .assistant-loading-skeleton[aria-hidden="true"]',
              ).count();
              const loadingLines = await page.locator(
                '#assistant-messages .assistant-loading-skeleton .md-skeleton',
              ).count();
              if (loadingSkeleton !== 1 || loadingLines !== 3) {
                throw new Error('Assistant loading skeleton drifted');
              }


              await page.keyboard.press('Escape');
              await page.locator('#assistant-messages.hidden[aria-hidden="true"]').waitFor({
                state: 'attached',
                timeout: 5000,
              });
              const focusRestored = await page.evaluate(() =>
                document.activeElement?.classList.contains('mood-button') ?? false,
              );
              if (!focusRestored) {
                throw new Error('Assistant Escape did not restore focus to the trigger');
              }

              await trigger.click();
              await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });

              await page.evaluate(() => {
                dispatchEvent(new CustomEvent('navigationEnded', {
                  detail: { reason: 'cancelled' },
                }));
              });
              await page.waitForTimeout(750);

              const state = await page.evaluate(() => {
                const area = document.querySelector('#assistant-messages .messages-area');
                const children = area ? Array.from(area.children) : [];
                const feedback = area?.querySelector('.message[data-message-type="navigation-feedback"]') ?? null;
                const menu = area?.querySelector('.assistant-options:has([data-explore-category])') ?? null;
                return {
                  feedbackText: feedback?.textContent?.trim() ?? '',
                  feedbackIndex: feedback ? children.indexOf(feedback) : -1,
                  menuIndex: menu ? children.indexOf(menu) : -1,
                  menuVisible: Boolean(menu && !menu.classList.contains('hidden') && menu.getAttribute('aria-hidden') !== 'true'),
                  optionCount: menu?.querySelectorAll('.assistant-option-btn').length ?? 0,
                };
              });

              if (
                !state.feedbackText.includes('Navegação encerrada. Como posso ajudar?') ||
                state.feedbackIndex < 0 ||
                state.menuIndex <= state.feedbackIndex ||
                !state.menuVisible ||
                state.optionCount !== 10
              ) {
                throw new Error(`Assistant modal reading order diverged: ${JSON.stringify(state)}`);
              }

              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/assistant-modal-order.log || true
