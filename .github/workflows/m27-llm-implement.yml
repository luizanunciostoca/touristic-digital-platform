name: M27 LLM Implement

on:
  push:
    branches:
      - feat/assistant-m27-llm-boundary

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Implement M27
        run: |
          cat > apps/morro-digital-platform/src/assistant/assistant-llm-adapter.ts <<'EOF'
          import type {
            AssistantDialogIntentHandler,
            AssistantDialogResponse,
          } from "@touristic/assistant";

          const LLM_ENDPOINT = "/api/ai/assistant/respond";
          const LLM_TIMEOUT_MS = 12_000;
          const MAX_HISTORY_ENTRIES = 6;

          interface AssistantLlmPayload {
            input: string;
            lang: "pt" | "en" | "es" | "he";
            userType: "tourist" | "resident";
            context: {
              lastPlace: string | null;
              lastCategory: string | null;
              lastIntent: string | null;
            };
            history: Array<{ role: "user" | "assistant"; content: string }>;
          }

          interface AssistantLlmResponsePayload {
            text?: unknown;
            intent?: unknown;
            action?: unknown;
            options?: unknown;
            confidence?: unknown;
          }

          function plainText(value: unknown, maxLength: number): string {
            if (typeof value !== "string") return "";
            return value
              .replace(/<[^>]*>/gu, " ")
              .replace(/[\u0000-\u001f\u007f]/gu, " ")
              .replace(/\s+/gu, " ")
              .trim()
              .slice(0, maxLength);
          }

          function normalizeLanguage(value: unknown): AssistantLlmPayload["lang"] {
            return value === "en" || value === "es" || value === "he" ? value : "pt";
          }

          function normalizeAction(value: unknown): string | null {
            if (typeof value !== "string") return null;
            const action = value.trim();
            if (/^show_category:[a-z_]+$/iu.test(action)) return action;
            if (action.startsWith("show_place:")) {
              const place = plainText(action.slice("show_place:".length), 120);
              return place ? `show_place:${place}` : null;
            }
            return null;
          }

          function normalizeResponse(payload: AssistantLlmResponsePayload): AssistantDialogResponse | null {
            const text = plainText(payload.text, 4_000);
            if (!text) return null;
            const confidence = Number(payload.confidence);
            const options = Array.isArray(payload.options)
              ? payload.options
                  .slice(0, 6)
                  .map((item) => plainText(item, 100))
                  .filter(Boolean)
                  .map((label) => ({ label, value: label }))
              : undefined;

            return {
              text,
              ...(options && options.length > 0 ? { options } : {}),
              metadata: {
                domain: "llm",
                state: "resolved",
                intent:
                  plainText(payload.intent, 50).replace(/[^a-zA-Z0-9_:-]/gu, "_") ||
                  "llm_response",
                action: normalizeAction(payload.action),
                confidence: Number.isFinite(confidence)
                  ? Math.max(0, Math.min(1, confidence))
                  : 0.7,
                fromLLM: true,
              },
            };
          }

          function createPayload(
            request: Parameters<AssistantDialogIntentHandler>[0],
          ): AssistantLlmPayload {
            const history = request.context.history
              .slice(-MAX_HISTORY_ENTRIES)
              .flatMap((entry) => {
                const values: AssistantLlmPayload["history"] = [];
                const input = plainText(entry.input, 600);
                const response = plainText(entry.response, 600);
                if (input) values.push({ role: "user", content: input });
                if (response) values.push({ role: "assistant", content: response });
                return values;
              })
              .slice(-MAX_HISTORY_ENTRIES);

            return {
              input: plainText(request.input, 1_000),
              lang: normalizeLanguage(request.intent.entities.lang),
              userType: "tourist",
              context: {
                lastPlace: plainText(request.context.lastPlace, 120) || null,
                lastCategory: plainText(request.context.lastCategory, 50) || null,
                lastIntent: plainText(request.context.lastIntent, 50) || null,
              },
              history,
            };
          }

          export interface AssistantLlmAdapterOptions {
            readonly fetch?: typeof globalThis.fetch;
            readonly endpoint?: string;
          }

          export function createAssistantLlmHandler(
            options: AssistantLlmAdapterOptions = {},
          ): AssistantDialogIntentHandler {
            const fetchImplementation = options.fetch ?? globalThis.fetch;
            const endpoint = options.endpoint ?? LLM_ENDPOINT;

            return async (request) => {
              const payload = createPayload(request);
              if (!payload.input) return null;

              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), LLM_TIMEOUT_MS);
              try {
                const response = await fetchImplementation(endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  credentials: "same-origin",
                  body: JSON.stringify(payload),
                  signal: controller.signal,
                });
                if (!response.ok) return null;
                return normalizeResponse(
                  (await response.json()) as AssistantLlmResponsePayload,
                );
              } catch {
                return null;
              } finally {
                clearTimeout(timeout);
              }
            };
          }
          EOF

          cat > apps/morro-digital-platform/src/assistant/assistant-llm-adapter.test.ts <<'EOF'
          import { describe, expect, it, vi } from "vitest";
          import type { AssistantDialogIntentHandlerContext } from "@touristic/assistant";
          import {
            analyzeAssistantIntent,
            createAssistantContextManager,
          } from "@touristic/assistant";
          import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";

          function request(input = "me explique a história da Segunda Praia") {
            const manager = createAssistantContextManager();
            manager.updateContext({
              lastPlace: "Segunda Praia",
              lastCategory: "beaches",
              lastIntent: "place_search",
            });
            manager.addToHistory({ input: "olá", response: "Olá!" });
            const context = manager.getContext();
            return {
              input,
              intent: analyzeAssistantIntent(input, {
                lastPlace: context.lastPlace,
                lastCategory: context.lastCategory,
                lastIntent: context.lastIntent,
                awaiting: context.awaiting,
              }),
              context,
            } satisfies AssistantDialogIntentHandlerContext;
          }

          describe("createAssistantLlmHandler", () => {
            it("posts sanitized context to the same-origin AI boundary", async () => {
              const fetchImplementation = vi.fn(async (_input: RequestInfo | URL, init?: RequestInit) => {
                expect(init?.credentials).toBe("same-origin");
                const payload = JSON.parse(String(init?.body)) as Record<string, unknown>;
                expect(payload).toMatchObject({
                  input: "me explique a história da Segunda Praia",
                  userType: "tourist",
                  context: {
                    lastPlace: "Segunda Praia",
                    lastCategory: "beaches",
                    lastIntent: "place_search",
                  },
                });
                return new Response(
                  JSON.stringify({
                    text: "Segunda Praia tem uma história ligada ao desenvolvimento turístico de Morro.",
                    intent: "cultural_history",
                    action: "show_place:Segunda Praia",
                    options: ["Ver no mapa"],
                    confidence: 0.91,
                  }),
                  { status: 200, headers: { "Content-Type": "application/json" } },
                );
              });
              const handler = createAssistantLlmHandler({ fetch: fetchImplementation });

              const response = await handler(request());

              expect(fetchImplementation).toHaveBeenCalledWith(
                "/api/ai/assistant/respond",
                expect.objectContaining({ method: "POST" }),
              );
              expect(response).toEqual({
                text: "Segunda Praia tem uma história ligada ao desenvolvimento turístico de Morro.",
                options: [{ label: "Ver no mapa", value: "Ver no mapa" }],
                metadata: {
                  domain: "llm",
                  state: "resolved",
                  intent: "cultural_history",
                  action: "show_place:Segunda Praia",
                  confidence: 0.91,
                  fromLLM: true,
                },
              });
            });

            it("fails closed when the server-side provider is unavailable", async () => {
              const handler = createAssistantLlmHandler({
                fetch: vi.fn(async () => new Response("{}", { status: 503 })),
              });
              await expect(handler(request())).resolves.toBeNull();
            });

            it("strips markup returned by the provider before rendering", async () => {
              const handler = createAssistantLlmHandler({
                fetch: vi.fn(async () =>
                  new Response(JSON.stringify({ text: "<b>Seguro</b><script>x</script>" }), {
                    status: 200,
                    headers: { "Content-Type": "application/json" },
                  }),
                ),
              });
              const response = await handler(request());
              expect(response?.text).toBe("Seguro x");
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          text = runtime.read_text()
          needle = 'import { createAssistantNavigationAppHandlers } from "./assistant-navigation-adapter.js";\n'
          replacement = needle + 'import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";\n'
          if replacement not in text:
              text = text.replace(needle, replacement, 1)
          old = '''  const controller = createAssistantDialogController({
            context,
            handlers: {
              ...domainHandlers,
              ...navigationHandlers,
            },
          });'''
          new = '''  const controller = createAssistantDialogController({
            context,
            handlers: {
              ...domainHandlers,
              ...navigationHandlers,
            },
            llm: createAssistantLlmHandler({
              ...(options.fetch ? { fetch: options.fetch } : {}),
            }),
          });'''
          if old not in text:
              raise SystemExit('browser runtime controller block not found')
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          server = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = server.read_text()
          anchor = 'const weatherStaleTtlMs = 30 * 60 * 1000;\n'
          additions = '''const assistantTimeoutMs = 12_000;
          const assistantRateWindowMs = 60_000;
          const assistantRateLimit = 30;
          const assistantRateBuckets = new Map();
          const supportedAssistantLanguages = new Set(["pt", "en", "es", "he"]);
          const allowedAssistantCategories = new Set([
            "beaches",
            "restaurants",
            "hotels",
            "shops",
            "transport",
            "attractions",
            "tours",
            "nightlife",
            "emergencies",
            "help",
          ]);
          const assistantSystemPrompt = `Você é o assistente virtual do Morro Digital, guia de Morro de São Paulo e Cairu.
          Responda no idioma solicitado e use somente informações que possam ser apresentadas com segurança.
          Nunca invente horários, preços, telefones, condições de acessibilidade ou informações de emergência.
          Quando não houver confirmação, informe que o dado precisa ser verificado.
          Retorne exclusivamente JSON no formato:
          {"text":"texto","intent":"identificador_curto","action":"show_category:categoria, show_place:nome ou null","options":["opção curta"],"confidence":0.0}`;
          '''
          if additions not in text:
              text = text.replace(anchor, anchor + additions, 1)

          before_server = 'const server = createServer(async (request, response) => {\n'
          helpers = r'''
          function safeAssistantString(value, maxLength) {
            if (typeof value !== "string") return "";
            return value.replace(/[\u0000-\u001f\u007f]/gu, " ").trim().slice(0, maxLength);
          }

          function sanitizeAssistantContext(value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) return {};
            return {
              lastPlace: safeAssistantString(value.lastPlace, 120) || null,
              lastCategory: safeAssistantString(value.lastCategory, 50) || null,
              lastIntent: safeAssistantString(value.lastIntent, 50) || null,
            };
          }

          function sanitizeAssistantHistory(value) {
            if (!Array.isArray(value)) return [];
            return value.slice(-6).flatMap((entry) => {
              if (!entry || typeof entry !== "object") return [];
              const role = entry.role === "assistant" ? "assistant" : "user";
              const content = safeAssistantString(entry.content, 600);
              return content ? [{ role, content }] : [];
            });
          }

          async function readJsonBody(request, limit = 64 * 1024) {
            let size = 0;
            const chunks = [];
            for await (const chunk of request) {
              size += chunk.length;
              if (size > limit) throw new Error("request_body_too_large");
              chunks.push(chunk);
            }
            if (chunks.length === 0) return {};
            return JSON.parse(Buffer.concat(chunks).toString("utf8"));
          }

          function assistantRateAllowed(request) {
            const now = Date.now();
            const key = request.socket.remoteAddress || "unknown";
            const bucket = assistantRateBuckets.get(key);
            if (!bucket || bucket.resetAt <= now) {
              assistantRateBuckets.set(key, { count: 1, resetAt: now + assistantRateWindowMs });
              return { allowed: true, retryAfter: 0 };
            }
            bucket.count += 1;
            if (bucket.count <= assistantRateLimit) return { allowed: true, retryAfter: 0 };
            return {
              allowed: false,
              retryAfter: Math.max(1, Math.ceil((bucket.resetAt - now) / 1000)),
            };
          }

          function normalizeAssistantProviderResponse(value) {
            const source = value && typeof value === "object" ? value : {};
            const text = safeAssistantString(source.text, 4000);
            const intent = safeAssistantString(source.intent, 50).replace(/[^a-zA-Z0-9_:-]/gu, "_");
            let action = typeof source.action === "string" ? source.action.trim() : null;
            if (action?.startsWith("show_category:")) {
              const category = action.slice("show_category:".length).trim();
              action = allowedAssistantCategories.has(category) ? `show_category:${category}` : null;
            } else if (action?.startsWith("show_place:")) {
              const place = safeAssistantString(action.slice("show_place:".length), 120);
              action = place ? `show_place:${place}` : null;
            } else {
              action = null;
            }
            const confidenceValue = Number(source.confidence);
            return {
              text,
              intent: intent || "llm_response",
              action,
              options: Array.isArray(source.options)
                ? source.options.slice(0, 6).map((item) => safeAssistantString(item, 100)).filter(Boolean)
                : [],
              confidence: Number.isFinite(confidenceValue)
                ? Math.max(0, Math.min(1, confidenceValue))
                : 0.7,
            };
          }

          function parseAssistantJson(text) {
            const normalized = String(text || "")
              .trim()
              .replace(/^```(?:json)?\s*/iu, "")
              .replace(/\s*```$/u, "");
            return JSON.parse(normalized);
          }

          async function serveAssistant(request, response) {
            response.setHeader("Cache-Control", "no-store");
            if (request.method !== "POST") {
              response.statusCode = 405;
              response.setHeader("Allow", "POST");
              response.end(JSON.stringify({ error: "method_not_allowed" }));
              return;
            }

            const rate = assistantRateAllowed(request);
            if (!rate.allowed) {
              response.statusCode = 429;
              response.setHeader("Retry-After", String(rate.retryAfter));
              response.setHeader("Content-Type", "application/json; charset=utf-8");
              response.end(JSON.stringify({ error: "assistant_rate_limited" }));
              return;
            }

            const apiKey = (process.env.OPENAI_API_KEY ?? localEnvironment.OPENAI_API_KEY ?? "").trim();
            if (!apiKey) {
              response.statusCode = 503;
              response.setHeader("Content-Type", "application/json; charset=utf-8");
              response.end(JSON.stringify({ error: "assistant_not_configured" }));
              return;
            }

            try {
              const body = await readJsonBody(request);
              const input = safeAssistantString(body.input, 1000);
              if (!input) {
                response.statusCode = 400;
                response.setHeader("Content-Type", "application/json; charset=utf-8");
                response.end(JSON.stringify({ error: "invalid_input" }));
                return;
              }
              const lang = supportedAssistantLanguages.has(body.lang) ? body.lang : "pt";
              const context = sanitizeAssistantContext(body.context);
              const history = sanitizeAssistantHistory(body.history);
              const userType = body.userType === "resident" ? "resident" : "tourist";
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), assistantTimeoutMs);
              try {
                const upstream = await fetch("https://api.openai.com/v1/chat/completions", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${apiKey}`,
                  },
                  body: JSON.stringify({
                    model: (process.env.OPENAI_MODEL ?? localEnvironment.OPENAI_MODEL ?? "gpt-4o-mini").trim(),
                    messages: [
                      { role: "system", content: assistantSystemPrompt },
                      {
                        role: "system",
                        content: `Contexto validado: ${JSON.stringify({ lang, userType, context })}`,
                      },
                      ...history,
                      { role: "user", content: input },
                    ],
                    max_tokens: 600,
                    temperature: 0.4,
                    response_format: { type: "json_object" },
                  }),
                  signal: controller.signal,
                });
                if (!upstream.ok) {
                  response.statusCode = upstream.status === 429 ? 429 : 502;
                  response.setHeader("Content-Type", "application/json; charset=utf-8");
                  response.end(JSON.stringify({ error: "assistant_provider_error" }));
                  return;
                }
                const data = await upstream.json();
                const content = data?.choices?.[0]?.message?.content;
                const normalized = normalizeAssistantProviderResponse(parseAssistantJson(content));
                if (!normalized.text) throw new Error("assistant_invalid_response");
                response.statusCode = 200;
                response.setHeader("Content-Type", "application/json; charset=utf-8");
                response.end(JSON.stringify(normalized));
              } finally {
                clearTimeout(timeout);
              }
            } catch (error) {
              response.statusCode = error?.name === "AbortError" ? 504 : 502;
              response.setHeader("Content-Type", "application/json; charset=utf-8");
              response.end(JSON.stringify({ error: error?.name === "AbortError" ? "assistant_timeout" : "assistant_request_failed" }));
            }
          }

          '''
          if 'async function serveAssistant(request, response)' not in text:
              text = text.replace(before_server, helpers + before_server, 1)

          route_anchor = '''    if (requestUrl.pathname === "/api/weather") {
              await serveWeather(response);
              return;
            }
          '''
          route_replacement = route_anchor + '''    if (
              requestUrl.pathname === "/api/ai/assistant/respond" ||
              requestUrl.pathname === "/api/assistant/respond"
            ) {
              await serveAssistant(request, response);
              return;
            }
          '''
          if route_replacement not in text:
              if route_anchor not in text:
                  raise SystemExit('weather route anchor not found')
              text = text.replace(route_anchor, route_replacement, 1)
          server.write_text(text)

          matrix = Path('docs/migration/ASSISTANT-MIGRATION-MATRIX.md')
          text = matrix.read_text()
          text = text.replace('Estado M26', 'Estado M27', 1)
          text = text.replace(
              '| Fallback LLM — execução               | `llm-fallback.js`          | porta `llm` do controller                                                                                       | PARTIAL    | orquestração pronta; provider same-origin real ainda pendente                                                                            |',
              '| Fallback LLM — execução               | `llm-fallback.js`          | porta `llm` do controller + `assistant-llm-adapter.ts`                                                          | PASS       | client same-origin, timeout/fail-closed, resposta normalizada e provider server-side conectados                                            |',
              1,
          )
          text = text.replace(
              '| Boundary `/api/ai/*`                  | legado + registry          | API same-origin V2                                                                                              | GAP        | nenhum segredo no cliente; provider server-side                                                                                          |',
              '| Boundary `/api/ai/*`                  | legado + registry          | `/api/ai/assistant/respond` + alias legado `/api/assistant/respond`                                             | PASS       | nenhum segredo no cliente; provider server-side, validação, rate limit e timeout                                                         |',
              1,
          )
          marker = '\nPara promover MIG-0006 a `equivalent`, todos os itens acima precisam estar em PASS e o Quality Gate do head final deve estar integralmente verde.\n'
          section = '''\n## Estado do milestone M27\n\nO M27 fecha a execução do fallback LLM e o boundary server-side do Assistente. `assistant-llm-adapter.ts` conecta a porta `llm` do controller ao endpoint same-origin `/api/ai/assistant/respond`, preservando timeout de 12 segundos, histórico limitado, contexto sanitizado, normalização de action/options/confidence e falha fechada para que indisponibilidade do provider nunca quebre o diálogo local-first.\n\nO `dev-server.mjs` passa a hospedar a fronteira server-side: valida método e payload, limita 30 chamadas por minuto por origem, mantém `OPENAI_API_KEY` e `OPENAI_MODEL` exclusivamente no processo do servidor, normaliza a resposta do provider e expõe também `/api/assistant/respond` como alias de compatibilidade com a baseline V1. Nenhum segredo é serializado em `runtime-config.js` ou entregue ao browser.\n\nCom isso, `Fallback LLM — execução` e `Boundary /api/ai/*` passam a `PASS`. A FEATURE-0004 / MIG-0006 **ainda não está equivalente**: permanecem delivery físico dos assets de `photos`, paridade completa de weather e copy/i18n dos handlers, voz e lifecycle/UI completa do assistente.\n'''
          if '## Estado do milestone M27' not in text:
              text = text.replace(marker, section + marker)
          matrix.write_text(text)
          PY

          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-llm-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-llm-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

          rm .github/workflows/m27-llm-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assistant): connect same-origin LLM boundary"
          git push
