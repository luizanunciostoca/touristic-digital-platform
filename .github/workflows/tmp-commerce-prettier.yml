name: Temporary Commerce Prettier Diagnostic

on:
  push:
    branches:
      - feat/commerce-ux-public-catalog-20260915

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Commerce files
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/public/experience.html
          apps/morro-digital-platform/public/experience.js
          apps/morro-digital-platform/public/ticketing.js
          apps/morro-digital-platform/src/commerce/home-commerce.ts
          services/ticketing/src/commerce-public-http-transport.ts
      - name: Verify exact formatting
        run: >-
          pnpm exec prettier --check
          apps/morro-digital-platform/public/experience.html
          apps/morro-digital-platform/public/experience.js
          apps/morro-digital-platform/public/ticketing.js
          apps/morro-digital-platform/src/commerce/home-commerce.ts
          services/ticketing/src/commerce-public-http-transport.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-prettier-exact
          path: |
            apps/morro-digital-platform/public/experience.html
            apps/morro-digital-platform/public/experience.js
            apps/morro-digital-platform/public/ticketing.js
            apps/morro-digital-platform/src/commerce/home-commerce.ts
            services/ticketing/src/commerce-public-http-transport.ts
          if-no-files-found: error
          retention-days: 1
