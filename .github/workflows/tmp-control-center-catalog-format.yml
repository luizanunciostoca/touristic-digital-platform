name: Temporary Catalog Draft Formatter

on:
  push:
    branches: [feat/control-center-catalog-drafts-20260925]
    paths:
      - ".github/workflows/tmp-control-center-catalog-format.yml"
      - "apps/control-center/public/control-center-business-cms.js"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.mjs"

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(auto): format catalog drafts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/control-center-catalog-drafts-20260925
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files
        run: |
          pnpm exec prettier --write apps/control-center/public/control-center-business-cms.js apps/morro-digital-platform/tooling/place-platform-runtime.mjs
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-center/public/control-center-business-cms.js apps/morro-digital-platform/tooling/place-platform-runtime.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(auto): format catalog drafts"
            git push origin HEAD:feat/control-center-catalog-drafts-20260925
          fi
