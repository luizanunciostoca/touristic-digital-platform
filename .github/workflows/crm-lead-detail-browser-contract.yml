name: CRM Lead Detail Browser Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crm-lead-detail-browser-contract.yml"
      - "apps/admin-crm/public/index.html"
      - "apps/admin-crm/public/lead-detail.html"
      - "apps/admin-crm/public/lead-detail.js"
      - "apps/admin-crm/public/lead-detail-links.js"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/crm-lead-detail-contract.test.ts"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"
      - "apps/morro-digital-platform/tooling/crm-m140-browser-e2e.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "packages/business/**"
      - "packages/crm/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/crm/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crm-lead-detail-browser-contract.yml"
      - "apps/admin-crm/public/index.html"
      - "apps/admin-crm/public/lead-detail.html"
      - "apps/admin-crm/public/lead-detail.js"
      - "apps/admin-crm/public/lead-detail-links.js"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/src/crm-lead-detail-contract.test.ts"
      - "apps/morro-digital-platform/tooling/crm-api.mjs"
      - "apps/morro-digital-platform/tooling/crm-m140-browser-e2e.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "packages/business/**"
      - "packages/crm/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/crm/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: crm-lead-detail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lead-detail-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crm-pass
          MYSQL_DATABASE: morro_crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcrm-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate focused CRM contracts
        run: |
          pnpm --filter @touristic/crm test
          pnpm --filter @touristic/crm-server lint
          pnpm --filter @touristic/crm-server typecheck
          pnpm --filter @touristic/crm-server test
          pnpm --filter @touristic/morro-digital-platform exec vitest run src/crm-lead-detail-contract.test.ts

      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Build authenticated CRM runtime graph
        run: |
          pnpm turbo run build --filter=@touristic/auth-browser --filter=@touristic/auth-server --filter=@touristic/crm --filter=@touristic/crm-server --filter=@touristic/business --filter=@touristic/financial-server --filter=@touristic/ordering-server
          pnpm --filter @touristic/morro-digital-platform build

      - name: Start authenticated CRM runtime
        shell: bash
        run: |
          set -euo pipefail
          PORT=4192
          SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="correct horse battery staple"
          HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 13))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"owner-1",email:"owner@example.com",passwordHash:process.argv[1],role:"owner",businessIds:["toca-do-morcego"]},{id:"viewer-1",email:"viewer@example.com",passwordHash:process.argv[1],role:"viewer",businessIds:["toca-do-morcego"]}]))' "$HASH")
          DASHBOARD_AUTH_SECRET="$SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          CRM_DATABASE_URL="mysql://root:crm-pass@127.0.0.1:3306/morro_crm" \
          PORT="$PORT" HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/crm-m140-server.log 2>&1 &
          echo $! >/tmp/crm-m140-server.pid
          for _ in $(seq 1 80); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/runtime-config.js" >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/crm-m140-server.log
          exit 1

      - name: Validate real Auth CSRF RBAC MySQL Lead Detail API
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="http://127.0.0.1:4192"
          PASSWORD="correct horse battery staple"

          request() {
            local file="$1"
            shift
            curl --silent --output "$file" --write-out '%{http_code}' "$@"
          }
          assert_http() {
            local actual="$1" expected="$2" file="$3" label="$4"
            if [ "$actual" != "$expected" ]; then
              echo "$label expected HTTP $expected but received $actual"
              cat "$file" || true
              cat /tmp/crm-m140-server.log || true
              exit 1
            fi
          }

          UNAUTH=$(request /tmp/m140-unauth.json "$ORIGIN/api/crm/leads/1/detail")
          assert_http "$UNAUTH" 401 /tmp/m140-unauth.json unauthenticated-detail
          grep -q 'AUTH_REQUIRED' /tmp/m140-unauth.json

          OWNER_LOGIN=$(request /tmp/m140-owner-login.json --cookie-jar /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"owner@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$OWNER_LOGIN" 200 /tmp/m140-owner-login.json owner-login
          OWNER_CSRF=$(jq -r '.csrfToken' /tmp/m140-owner-login.json)

          CREATE=$(request /tmp/m140-create.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' \
            --data '{"companyName":"Toca do Morcego","segment":"events","contactName":"Luiz"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$CREATE" 200 /tmp/m140-create.json owner-create
          LEAD_ID=$(jq -r '.data.id' /tmp/m140-create.json)
          test "$LEAD_ID" != "null"
          printf '%s' "$LEAD_ID" >/tmp/m140-lead-id.txt

          DETAIL=$(request /tmp/m140-detail.json --cookie /tmp/m140-owner.cookies "$ORIGIN/api/crm/leads/$LEAD_ID/detail")
          assert_http "$DETAIL" 200 /tmp/m140-detail.json owner-detail
          test "$(jq '.data.checklist | length' /tmp/m140-detail.json)" = "16"
          CHECKLIST_ID=$(jq -r '.data.checklist[0].id' /tmp/m140-detail.json)
          test "$CHECKLIST_ID" != "null"
          jq -e '.data.interactions | any(.type == "system" and .content == "Lead cadastrado no sistema")' /tmp/m140-detail.json >/dev/null

          BAD_CSRF=$(request /tmp/m140-bad-csrf.json --request PATCH --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header 'X-CSRF-Token: wrong' \
            --header 'Content-Type: application/json' --data '{"completed":true}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/checklist/$CHECKLIST_ID")
          assert_http "$BAD_CSRF" 403 /tmp/m140-bad-csrf.json invalid-csrf
          grep -q 'INVALID_CSRF' /tmp/m140-bad-csrf.json

          VIEWER_LOGIN=$(request /tmp/m140-viewer-login.json --cookie-jar /tmp/m140-viewer.cookies \
            --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --data "{\"email\":\"viewer@example.com\",\"password\":\"$PASSWORD\"}" \
            "$ORIGIN/api/dashboard/auth/login")
          assert_http "$VIEWER_LOGIN" 200 /tmp/m140-viewer-login.json viewer-login
          VIEWER_CSRF=$(jq -r '.csrfToken' /tmp/m140-viewer-login.json)

          VIEWER_READ=$(request /tmp/m140-viewer-read.json --cookie /tmp/m140-viewer.cookies "$ORIGIN/api/crm/leads/$LEAD_ID/detail")
          assert_http "$VIEWER_READ" 200 /tmp/m140-viewer-read.json viewer-detail

          VIEWER_WRITE=$(request /tmp/m140-viewer-write.json --request PATCH --cookie /tmp/m140-viewer.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $VIEWER_CSRF" \
            --header 'Content-Type: application/json' --data '{"completed":true}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/checklist/$CHECKLIST_ID")
          assert_http "$VIEWER_WRITE" 403 /tmp/m140-viewer-write.json viewer-write
          grep -q 'READ_ONLY_ROLE' /tmp/m140-viewer-write.json

          CREATE_SECOND=$(request /tmp/m140-create-second.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"companyName":"Second Lead"}' \
            "$ORIGIN/api/crm/leads")
          assert_http "$CREATE_SECOND" 200 /tmp/m140-create-second.json second-create
          SECOND_ID=$(jq -r '.data.id' /tmp/m140-create-second.json)

          CROSS_LEAD=$(request /tmp/m140-cross-lead.json --request PATCH --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"completed":true}' \
            "$ORIGIN/api/crm/leads/$SECOND_ID/checklist/$CHECKLIST_ID")
          assert_http "$CROSS_LEAD" 404 /tmp/m140-cross-lead.json cross-lead-checklist

          TOGGLE=$(request /tmp/m140-toggle.json --request PATCH --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"completed":true}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/checklist/$CHECKLIST_ID")
          assert_http "$TOGGLE" 200 /tmp/m140-toggle.json owner-toggle

          SYSTEM_MANUAL=$(request /tmp/m140-system-manual.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"type":"system","content":"blocked"}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/interactions")
          assert_http "$SYSTEM_MANUAL" 400 /tmp/m140-system-manual.json system-manual
          grep -q 'INVALID_INPUT' /tmp/m140-system-manual.json

          NOTE=$(request /tmp/m140-note.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"type":"note","content":"Cliente pediu retorno amanhã"}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/interactions")
          assert_http "$NOTE" 200 /tmp/m140-note.json owner-note

          STAGE=$(request /tmp/m140-stage.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"stage":"first_contact"}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/stage")
          assert_http "$STAGE" 200 /tmp/m140-stage.json owner-stage

          RESET_STAGE=$(request /tmp/m140-stage-reset.json --cookie /tmp/m140-owner.cookies \
            --header "Origin: $ORIGIN" --header "X-CSRF-Token: $OWNER_CSRF" \
            --header 'Content-Type: application/json' --data '{"stage":"new_lead"}' \
            "$ORIGIN/api/crm/leads/$LEAD_ID/stage")
          assert_http "$RESET_STAGE" 200 /tmp/m140-stage-reset.json reset-stage

          READBACK=$(request /tmp/m140-readback.json --cookie /tmp/m140-owner.cookies "$ORIGIN/api/crm/leads/$LEAD_ID/detail")
          assert_http "$READBACK" 200 /tmp/m140-readback.json owner-readback
          test "$(jq -r '.data.lead.stage' /tmp/m140-readback.json)" = "new_lead"
          test "$(jq -r '.data.checklist[0].completed' /tmp/m140-readback.json)" = "true"
          test "$(jq -r '.data.checklist[0].completedBySubject' /tmp/m140-readback.json)" = "owner-1"
          jq -e '.data.interactions | any(.type == "note" and .content == "Cliente pediu retorno amanhã")' /tmp/m140-readback.json >/dev/null
          test "$(jq -r '.data.lead.lastContactAt' /tmp/m140-readback.json)" != "null"

      - name: Validate authenticated Lead Detail browser lifecycle
        run: node apps/morro-digital-platform/tooling/crm-m140-browser-e2e.cjs

      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/crm-m140-server.log || true
          cat /tmp/m140-stage.json || true
          cat /tmp/m140-stage-reset.json || true
          cat /tmp/m140-readback.json || true
          cat /tmp/crm-m140-browser-evidence.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crm-m140-lead-detail-evidence
          path: /tmp/crm-m140-browser-evidence.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Stop runtime
        if: always()
        run: |
          if [ -f /tmp/crm-m140-server.pid ]; then kill "$(cat /tmp/crm-m140-server.pid)" 2>/dev/null || true; fi