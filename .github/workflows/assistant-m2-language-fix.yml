name: Assistant M2 language detection fix

on:
  push:
    branches: [feat/assistant-runtime-m2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-m2
      - name: Fix language detection word boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/assistant/src/intent-engine.ts')
          text = path.read_text()
          text = text.replace(
              '    /(the|is|are|what|where|how|can|i\\b|you\\b|me\\b|my\\b)/i.test(input)',
              '    /\\b(the|is|are|what|where|how|can|i|you|me|my)\\b/i.test(input)',
          )
          text = text.replace(
              '    /(el|la|los|las|que|donde|como|es\\b|son|hay|quiero)/i.test(input)',
              '    /\\b(el|la|los|las|que|donde|como|es|son|hay|quiero)\\b/i.test(input)',
          )
          path.write_text(text)
          PY
      - name: Verify tests and formatting
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/assistant/src/intent-engine.ts
          pnpm --filter @touristic/assistant test
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant/src/intent-engine.ts
          git commit -m "fix(assistant): bound language detection tokens"
          git push origin HEAD:feat/assistant-runtime-m2
