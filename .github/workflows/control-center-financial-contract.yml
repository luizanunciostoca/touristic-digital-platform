name: Control Center Financial Contract

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/control-center-financial-contract.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/auth-api*.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.test.mjs"
      - "apps/morro-digital-platform/tooling/payments-runtime-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-runtime-api.test.mjs"
      - "packages/auth/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/control-center-financial-contract.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/auth-api*.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.test.mjs"
      - "apps/morro-digital-platform/tooling/payments-runtime-api.mjs"
      - "apps/morro-digital-platform/tooling/payments-runtime-api.test.mjs"
      - "packages/auth/**"
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/auth/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: control-center-financial-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  financial-admin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: control-center-financial-contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcontrol-center-financial-contract"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:control-center-financial-contract@127.0.0.1:3306/mysql
      FINANCIAL_DATABASE_URL: mysql://root:control-center-financial-contract@127.0.0.1:3306/financial_m137_test
      ORDERING_DATABASE_URL: mysql://root:control-center-financial-contract@127.0.0.1:3306/ordering_m137_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build owner boundaries
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/ordering build
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/ordering-server build
          pnpm --filter @touristic/financial-server build
      - name: Validate Control Center financial orchestration
        run: |
          pnpm --filter @touristic/morro-digital-platform exec vitest run \
            tooling/admin-api.test.mjs \
            tooling/admin-domain-adapters.test.mjs \
            tooling/auth-api-delegation.test.mjs \
            tooling/payments-api.test.mjs \
            tooling/payments-runtime-api.test.mjs
      - name: Validate Financial owner persistence
        run: pnpm --filter @touristic/financial-server test:integration
      - name: Validate Ordering owner persistence
        run: pnpm --filter @touristic/ordering-server test:integration
