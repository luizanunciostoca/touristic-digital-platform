name: M60 Format Workspace Once
on:
  push:
    branches: [feat/business-m60-partner-workspace]
    paths: [.github/workflows/m60-format-workspace-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m60-partner-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/business/src/onboarding-workspace.ts packages/business/src/onboarding-workspace.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/src/onboarding-workspace.ts packages/business/src/onboarding-workspace.test.ts
          git commit -m "style(business): format M60 workspace domain"
          git push origin HEAD:feat/business-m60-partner-workspace
