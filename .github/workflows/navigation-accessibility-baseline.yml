name: Navigation Accessibility Baseline

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/navigation-accessibility-baseline.yml
      - apps/morro-digital-platform/src/navigation/**
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/ux/outdoor-one-hand-v2-contract.test.ts
      - apps/morro-digital-platform/public/**
      - packages/geospatial/src/**
      - packages/navigation/src/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  navigation-accessibility:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/navigation-accessibility
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/navigation-accessibility.log 2>&1 &
          echo $! >/tmp/navigation-accessibility.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/navigation-accessibility.log
          exit 1
      - name: Validate forced colors and 200 percent text navigation
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const outputDir = '/tmp/navigation-accessibility';
          const start = { latitude: -13.3762, longitude: -38.9172 };
          const livePosition = { latitude: -13.37615, longitude: -38.91715 };
          const destination = { latitude: -13.3740, longitude: -38.9148 };
          const routeResponse = {
            type: 'FeatureCollection',
            features: [{
              type: 'Feature',
              properties: {
                summary: { distance: 390, duration: 290 },
                segments: [{
                  distance: 390,
                  duration: 290,
                  steps: [
                    { distance: 92, duration: 68, instruction: 'Continue em frente', name: 'Caminho principal', way_points: [0, 1] },
                    { distance: 126, duration: 94, instruction: 'Vire à direita', name: 'Rua da Fonte', way_points: [1, 2] },
                    { distance: 172, duration: 128, instruction: 'Continue até o destino', name: 'Destino', way_points: [2, 3] },
                  ],
                }],
              },
              geometry: {
                type: 'LineString',
                coordinates: [
                  [start.longitude, start.latitude],
                  [-38.91655, -13.37565],
                  [-38.91575, -13.37485],
                  [destination.longitude, destination.latitude],
                ],
              },
            }],
          };

          async function poll(page, predicate, label, timeout = 15000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              if (await page.evaluate(predicate)) return;
              await page.waitForTimeout(100);
            }
            throw new Error(`${label} did not become ready`);
          }

          async function waitForMap(page) {
            await page.locator('#map[data-map-state="ready"][data-map-mode="real"][data-map-provider="mapbox"]').waitFor({ state: 'attached', timeout: 30000 });
            await page.locator('#map .mapboxgl-canvas').waitFor({ state: 'visible', timeout: 30000 });
            await poll(page, () => Boolean(globalThis.mapboxPrimaryInstance?.isStyleLoaded?.()), 'mapbox-style', 30000);
          }

          async function runCase(browser, testCase) {
            const context = await browser.newContext({
              viewport: { width: testCase.width, height: testCase.height },
              deviceScaleFactor: testCase.deviceScaleFactor,
              geolocation: start,
              permissions: ['geolocation'],
            });
            await context.addInitScript(() => {
              localStorage.setItem('morro-digital-onboarded', '1');
              localStorage.setItem('voice-enabled', 'false');
              globalThis.__navigationA11yEvidence = { events: [] };
              for (const type of ['navigationStarted', 'userLocationUpdated', 'navigationRouteRuntimeUpdated', 'navigationEnded']) {
                addEventListener(type, (event) => globalThis.__navigationA11yEvidence.events.push({ type, detail: event.detail ?? null }));
              }
            });
            const page = await context.newPage();
            await page.emulateMedia({
              forcedColors: testCase.forcedColors ? 'active' : 'none',
              reducedMotion: testCase.reducedMotion ? 'reduce' : 'no-preference',
            });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            await page.route('**/api/routing/directions', async (route) => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(routeResponse) });
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForMap(page);
            await page.evaluate((nextDestination) => {
              document.dispatchEvent(new CustomEvent('morro:navigation-requested', { detail: { destination: nextDestination } }));
            }, destination);
            await page.locator('#instruction-banner:not(.hidden)').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#voiceButton.is-navigation-stop').waitFor({ state: 'visible', timeout: 15000 });
            await context.setGeolocation(livePosition);
            await poll(page, () => globalThis.__navigationA11yEvidence.events.some((event) => event.type === 'navigationRouteRuntimeUpdated'), 'runtime');
            await page.waitForTimeout(500);

            const state = await page.evaluate(() => {
              const banner = document.getElementById('instruction-banner');
              const minimize = document.getElementById('minimize-navigation-btn');
              const end = document.querySelector('#voiceButton.is-navigation-stop');
              const assistantInput = document.getElementById('assistant-input-area');
              const instruction = document.getElementById('instruction-main');
              const bannerRect = banner?.getBoundingClientRect();
              const minimizeRect = minimize?.getBoundingClientRect();
              const endRect = end?.getBoundingClientRect();
              const assistantInputRect = assistantInput?.getBoundingClientRect();
              const minimizeStyle = minimize ? getComputedStyle(minimize) : null;
              const mainStyle = instruction ? getComputedStyle(instruction) : null;
              const detailsElement = document.getElementById('instruction-details');
              const detailsStyle = detailsElement ? getComputedStyle(detailsElement) : null;
              const endStyle = end ? getComputedStyle(end) : null;
              const presentation = (selector) => {
                const element = document.querySelector(selector);
                if (!(element instanceof HTMLElement)) return null;
                const style = getComputedStyle(element);
                return {
                  display: style.display,
                  visibility: style.visibility,
                  pointerEvents: style.pointerEvents,
                };
              };
              const toMilliseconds = (durationList) => Math.max(
                0,
                ...String(durationList ?? '0s')
                  .split(',')
                  .map((value) => value.trim())
                  .map((value) => value.endsWith('ms') ? Number.parseFloat(value) : Number.parseFloat(value) * 1000)
                  .filter(Number.isFinite),
              );
              return {
                forcedColors: matchMedia('(forced-colors: active)').matches,
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                bannerVisible: Boolean(banner && !banner.classList.contains('hidden') && getComputedStyle(banner).display !== 'none'),
                endVisible: Boolean(end && getComputedStyle(end).display !== 'none'),
                bodyActive: document.body.classList.contains('navigation-active'),
                assistantOpen: document.body.classList.contains('assistant-modal-open'),
                mdMode: document.body.dataset.mdMode ?? null,
                modeComposition: {
                  header: presentation('header'),
                  weather: presentation('#weather-widget'),
                  submenu: presentation('#submenu'),
                  globe: presentation('#globe-map-control'),
                  globeToggle: presentation('#toggle-globe-view'),
                  mapLayer: presentation('#toggle-map-layer'),
                  threeD: presentation('#toggle-3d-mode'),
                  location: presentation('#recenter-map-control'),
                  assistantInput: presentation('#assistant-input-area'),
                  bottomNavigation: presentation('#home-bottom-navigation'),
                },
                instruction: instruction?.textContent?.trim() ?? '',
                bannerRect: bannerRect ? { left: bannerRect.left, right: bannerRect.right, top: bannerRect.top, bottom: bannerRect.bottom, width: bannerRect.width, height: bannerRect.height } : null,
                minimizeRect: minimizeRect ? { width: minimizeRect.width, height: minimizeRect.height } : null,
                endRect: endRect ? { width: endRect.width, height: endRect.height, top: endRect.top, bottom: endRect.bottom } : null,
                assistantInputRect: assistantInputRect ? { top: assistantInputRect.top, bottom: assistantInputRect.bottom } : null,
                mainFontPx: Number.parseFloat(mainStyle?.fontSize ?? '0'),
                detailsFontPx: Number.parseFloat(detailsStyle?.fontSize ?? '0'),
                endBottomGap: endRect ? innerHeight - endRect.bottom : null,
                endTouchAction: endStyle?.touchAction ?? null,
                minimizeForcedColorAdjust: minimizeStyle?.forcedColorAdjust ?? null,
                minimizeBorderWidth: minimizeStyle?.borderTopWidth ?? null,
                minimizeTransitionMs: toMilliseconds(minimizeStyle?.transitionDuration),
                viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
                documentWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                markerCount: document.querySelectorAll('#map .mapboxgl-marker').length,
                dynamicRecenterCount: document.querySelectorAll('#navigation-recenter-btn').length,
                bottomNavigationItemCount: document.querySelectorAll('#home-bottom-navigation [data-home-nav-action]').length,
                events: globalThis.__navigationA11yEvidence.events,
              };
            });

            if (!state.bannerVisible || !state.endVisible || !state.bodyActive || !state.instruction) {
              throw new Error(`Active navigation UI missing for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            const hidden = (value) =>
              value &&
              value.visibility === 'hidden' &&
              value.pointerEvents === 'none';
            if (
              state.mdMode !== 'navigation' ||
              !hidden(state.modeComposition.header) ||
              !hidden(state.modeComposition.weather) ||
              !hidden(state.modeComposition.submenu) ||
              state.modeComposition.globe?.visibility !== 'visible' ||
              state.modeComposition.globe?.pointerEvents !== 'auto' ||
              state.modeComposition.globeToggle?.display === 'none' ||
              state.modeComposition.mapLayer?.display === 'none' ||
              state.modeComposition.threeD?.display === 'none' ||
              state.modeComposition.location?.display === 'none' ||
              state.dynamicRecenterCount !== 0 ||
              state.bottomNavigationItemCount !== 5 ||
              state.modeComposition.bottomNavigation?.visibility !== 'visible' ||
              state.modeComposition.bottomNavigation?.pointerEvents !== 'auto' ||
              (state.modeComposition.assistantInput?.visibility !== 'visible' ||
                state.modeComposition.assistantInput?.pointerEvents !== 'auto')
            ) {
              throw new Error(
                `Navigation mode composition drift for ${testCase.name}: ${JSON.stringify(state.modeComposition)}`,
              );
            }
            if (!state.bannerRect || state.bannerRect.width <= 0 || state.bannerRect.height <= 0 || !state.minimizeRect || !state.endRect) {
              throw new Error(`Navigation controls have invalid geometry for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            if (
              state.minimizeRect.width < 44 ||
              state.minimizeRect.height < 44 ||
              state.endRect.width < 44 ||
              state.endRect.height < 44
            ) {
              throw new Error(`Navigation touch target below 44px for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            if (state.mainFontPx < 20 || state.detailsFontPx < 16) {
              throw new Error(
                `Navigation outdoor typography too small for ${testCase.name}: ${JSON.stringify({
                  mainFontPx: state.mainFontPx,
                  detailsFontPx: state.detailsFontPx,
                })}`,
              );
            }
            if (
              state.viewport.width <= 720 &&
              (state.endBottomGap === null ||
                state.endBottomGap < 0 ||
                state.endBottomGap > 120 ||
                state.endTouchAction !== 'manipulation' ||
                !state.endRect ||
                (state.assistantOpen &&
                  (!state.assistantInputRect ||
                    state.endRect.bottom > state.assistantInputRect.top)))
            ) {
              throw new Error(
                `Navigation one-hand action placement drift for ${testCase.name}: ${JSON.stringify({
                  endBottomGap: state.endBottomGap,
                  endTouchAction: state.endTouchAction,
                  endRect: state.endRect,
                  assistantInputRect: state.assistantInputRect,
                })}`,
              );
            }
            if (testCase.forcedColors && !state.forcedColors) {
              throw new Error(`Forced colors was not active for ${testCase.name}`);
            }
            if (testCase.forcedColors && state.minimizeForcedColorAdjust !== 'none') {
              throw new Error(`V1 forced-color contract missing for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            if (testCase.text200 && state.viewport.dpr !== 2) {
              throw new Error(`200 percent text emulation diverged for ${testCase.name}: ${JSON.stringify(state.viewport)}`);
            }
            if (testCase.reducedMotion && (!state.reducedMotion || state.minimizeTransitionMs > 0.02)) {
              throw new Error(`Reduced-motion contract diverged for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            if (state.scrollWidth > state.documentWidth + 1) {
              throw new Error(`Horizontal overflow detected for ${testCase.name}: ${JSON.stringify(state)}`);
            }
            if (state.markerCount < 1 || pageErrors.length) {
              throw new Error(`Browser/navigation evidence failed for ${testCase.name}: ${JSON.stringify({ state, pageErrors })}`);
            }

            await page.screenshot({ path: `${outputDir}/${testCase.name}.png`, fullPage: false, animations: 'disabled' });
            await page.locator('#voiceButton.is-navigation-stop').click();
            await poll(page, () => globalThis.__navigationA11yEvidence.events.some((event) => event.type === 'navigationEnded'), 'navigation-ended', 5000);
            await context.close();
            return { state, pageErrors };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'forced-colors-mobile', width: 390, height: 844, deviceScaleFactor: 1, forcedColors: true },
              { name: 'forced-colors-tablet', width: 768, height: 1024, deviceScaleFactor: 1, forcedColors: true },
              { name: 'forced-colors-desktop', width: 1440, height: 900, deviceScaleFactor: 1, forcedColors: true },
              { name: 'text-200-mobile', width: 195, height: 422, deviceScaleFactor: 2, text200: true },
              { name: 'text-200-tablet', width: 384, height: 512, deviceScaleFactor: 2, text200: true },
              { name: 'text-200-desktop', width: 720, height: 450, deviceScaleFactor: 2, text200: true },
              { name: 'reduced-motion-mobile', width: 390, height: 844, deviceScaleFactor: 1, reducedMotion: true },
            ];
            const evidence = {};
            try {
              for (const testCase of cases) evidence[testCase.name] = await runCase(browser, testCase);
            } finally {
              await browser.close();
            }
            writeFileSync(`${outputDir}/evidence.json`, JSON.stringify({
              v1Commit: '60746fd7fed97b805758b37adfdbe3bad2582bfe',
              scenarios: ['active-navigation-forced-colors', 'active-navigation-text-200'],
              evidence,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/navigation-accessibility.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: navigation-accessibility-baseline-evidence
          path: /tmp/navigation-accessibility
          if-no-files-found: error
          retention-days: 14
