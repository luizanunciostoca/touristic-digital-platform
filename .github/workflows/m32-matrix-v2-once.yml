name: M32 Matrix V2 Once

on:
  push:
    branches:
      - feat/assistant-m32-domain-i18n

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m32-domain-i18n
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply and format matrix evidence
        run: |
          python .github/scripts/m32_matrix_patch.py
          pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - name: Commit matrix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m32-matrix-v2-once.yml .github/scripts/m32_matrix_patch.py
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          git commit -m "docs(assistant): record M32 i18n parity evidence"
          git push origin HEAD:feat/assistant-m32-domain-i18n
