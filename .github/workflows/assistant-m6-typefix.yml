name: Assistant M6 typefix

on:
  push:
    branches: [feat/assistant-runtime-m6]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-m6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix profile typing and economic inference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/assistant/src/user-profile.ts')
          text = path.read_text()
          old = '''function deepMerge<T extends object>(target: T, source: unknown): T {\n  if (!isRecord(source)) return target;\n  const result: Record<string, unknown> = { ...target };\n  for (const [key, value] of Object.entries(source)) {\n    const current = result[key];\n    result[key] =\n      isRecord(value) && isRecord(current)\n        ? deepMerge(current, value)\n        : clone(value);\n  }\n  return result as T;\n}\n'''
          new = '''function deepMergeRecord(\n  target: Record<string, unknown>,\n  source: Record<string, unknown>,\n): Record<string, unknown> {\n  const result: Record<string, unknown> = { ...target };\n  for (const [key, value] of Object.entries(source)) {\n    const current = result[key];\n    result[key] =\n      isRecord(value) && isRecord(current)\n        ? deepMergeRecord(current, value)\n        : clone(value);\n  }\n  return result;\n}\n\nfunction deepMerge<T extends object>(target: T, source: unknown): T {\n  if (!isRecord(source)) return target;\n  const targetRecord = Object.fromEntries(Object.entries(target));\n  const result = deepMergeRecord(targetRecord, source);\n  return result as unknown as T;\n}\n'''
          if old not in text:
              raise SystemExit('Expected deepMerge block not found')
          text = text.replace(old, new, 1)
          text = text.replace('(barato|econômico|economico|preço baixo|preco baixo|budget|cheap|acessível|acessivel)', '(barat[oa]|econômico|economico|preço baixo|preco baixo|budget|cheap|acessível|acessivel)', 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write packages/assistant/src/user-profile.ts
      - run: pnpm --filter @touristic/assistant lint
      - run: pnpm --filter @touristic/assistant typecheck
      - run: pnpm --filter @touristic/assistant test
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant/src/user-profile.ts
          git commit -m "fix(assistant): harden M6 profile merge and inference"
          git push origin HEAD:feat/assistant-runtime-m6
