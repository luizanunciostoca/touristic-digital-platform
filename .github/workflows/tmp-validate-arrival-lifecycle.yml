name: Temporary Arrival Lifecycle Validation

on:
  push:
    branches:
      - fix/v1-navigation-arrival-lifecycle-20260913
    paths:
      - .github/workflows/tmp-validate-arrival-lifecycle.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1-navigation-arrival-lifecycle-20260913
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-status.test.ts
      - run: git diff --check
      - run: pnpm --filter @touristic/navigation test
      - run: pnpm --filter @touristic/morro-digital-platform test
      - run: pnpm --filter @touristic/morro-digital-platform build
      - name: Commit validated formatting and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts apps/morro-digital-platform/src/navigation/browser-navigation-runtime-status.test.ts
          git rm .github/workflows/tmp-validate-arrival-lifecycle.yml
          git commit -m 'style(navigation): finalize arrival lifecycle parity patch'
          git push origin HEAD:fix/v1-navigation-arrival-lifecycle-20260913
