name: Ticketing Current-Main Format Once

on:
  push:
    branches:
      - fix/ticketing-feature-0011-current-main
    paths:
      - ".github/workflows/zz-ticketing-current-main-format-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-ticketing-current-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticketing-feature-0011-current-main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write \
            packages/ordering/src/index.ts \
            packages/ordering/src/ticketing-checkout.ts \
            packages/ordering/src/ticketing-reservation.test.ts \
            packages/ordering/src/ticketing-reservation.ts \
            packages/ticketing/src/offline-device-credential.ts \
            packages/ticketing/src/qr-svg.test.ts \
            packages/ticketing/src/reservations.ts \
            services/financial/src/mysql-verified-payment-result-feed.ts \
            services/ordering/src/checkout-http-transport.ts \
            services/ordering/src/mysql-ticketing-order-binding-repository.ts \
            services/ordering/src/ticketing-checkout-handoff.ts \
            services/ticketing/src/mysql-offline-device-registry.ts \
            services/ticketing/src/mysql-refunded-reservation-cancellation-repository.ts \
            services/ticketing/src/mysql-ticket-holder-profile-repository.ts \
            services/ticketing/src/mysql-ticketing-public-read-repository.ts \
            services/ticketing/src/offline-device-sync.ts \
            services/ticketing/src/ordering-financial-confirmation-authority.test.ts \
            services/ticketing/src/ordering-financial-confirmation-authority.ts \
            services/ticketing/src/public-http-transport.ts \
            services/ticketing/src/reservation-fulfillment-service.ts \
            services/ticketing/src/verified-financial-result-processor.ts
      - name: Commit formatted files if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/ordering/src/index.ts \
            packages/ordering/src/ticketing-checkout.ts \
            packages/ordering/src/ticketing-reservation.test.ts \
            packages/ordering/src/ticketing-reservation.ts \
            packages/ticketing/src/offline-device-credential.ts \
            packages/ticketing/src/qr-svg.test.ts \
            packages/ticketing/src/reservations.ts \
            services/financial/src/mysql-verified-payment-result-feed.ts \
            services/ordering/src/checkout-http-transport.ts \
            services/ordering/src/mysql-ticketing-order-binding-repository.ts \
            services/ordering/src/ticketing-checkout-handoff.ts \
            services/ticketing/src/mysql-offline-device-registry.ts \
            services/ticketing/src/mysql-refunded-reservation-cancellation-repository.ts \
            services/ticketing/src/mysql-ticket-holder-profile-repository.ts \
            services/ticketing/src/mysql-ticketing-public-read-repository.ts \
            services/ticketing/src/offline-device-sync.ts \
            services/ticketing/src/ordering-financial-confirmation-authority.test.ts \
            services/ticketing/src/ordering-financial-confirmation-authority.ts \
            services/ticketing/src/public-http-transport.ts \
            services/ticketing/src/reservation-fulfillment-service.ts \
            services/ticketing/src/verified-financial-result-processor.ts
          git commit -m "style(ticketing): apply canonical current-main formatting"
          git push origin HEAD:fix/ticketing-feature-0011-current-main
