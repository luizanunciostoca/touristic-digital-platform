name: M56 Hygiene Once
on:
  push:
    branches: [feat/business-m56-onboarding-step-contracts]
    paths: [.github/workflows/m56-hygiene-once.yml]
permissions:
  contents: write
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m56-onboarding-step-contracts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix strict lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('packages/business/src/onboarding-context.ts')
          s = p.read_text()
          old = '''function safeText(value: unknown, maxLength: number): string {
            if (typeof value !== "string") return "";
            return value
              .replace(/[<>\\u0000-\\u001f\\u007f]/gu, " ")
              .replace(/\\s+/gu, " ")
              .trim()
              .slice(0, maxLength);
          }'''.replace('          ', '')
          new = '''function safeText(value: unknown, maxLength: number): string {
            if (typeof value !== "string") return "";
            const sanitized = Array.from(value, (character) => {
              const codePoint = character.codePointAt(0) ?? 0;
              return codePoint <= 31 || codePoint === 127 || character === "<" || character === ">" ? " " : character;
            }).join("");
            return sanitized.replace(/\\s+/gu, " ").trim().slice(0, maxLength);
          }'''.replace('          ', '')
          if old not in s:
            raise SystemExit('context pattern not found')
          p.write_text(s.replace(old, new))

          p = Path('packages/business/src/onboarding-presentation.ts')
          s = p.read_text()
          marker = 'function categoryKey(context: Readonly<Record<string, unknown>>): keyof typeof CATEGORY_COPY {'
          helper = 'function contextText(value: unknown, fallback: string): string {\n  return typeof value === "string" ? value : fallback;\n}\n\n'
          s = s.replace(marker, helper + marker)
          s = s.replace('String(context.category ?? "other")', 'contextText(context.category, "other")')
          s = s.replace('String(context.businessName ?? "sua empresa")', 'contextText(context.businessName, "sua empresa")')
          s = s.replace('String(context.specialty ?? "sua especialidade")', 'contextText(context.specialty, "sua especialidade")')
          p.write_text(s)

          p = Path('packages/business/src/onboarding-steps.ts')
          s = p.read_text().replace('getBusinessOnboardingSpecialties(String(context.category ?? "other"))', 'getBusinessOnboardingSpecialties(typeof context.category === "string" ? context.category : "other")')
          p.write_text(s)
          PY
      - name: Format M56 files
        run: pnpm exec prettier --write apps/morro-digital-platform/public/business-onboarding.css apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts packages/business/src/onboarding-context.ts packages/business/src/onboarding-host.test.ts packages/business/src/onboarding-presentation.ts packages/business/src/onboarding-steps.test.ts packages/business/src/onboarding-steps.ts
      - name: Validate Business package
        run: |
          pnpm --filter @touristic/business lint
          pnpm --filter @touristic/business typecheck
          pnpm --filter @touristic/business test
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m56-hygiene-once.yml
          git add apps/morro-digital-platform/public/business-onboarding.css apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts packages/business/src/onboarding-context.ts packages/business/src/onboarding-host.test.ts packages/business/src/onboarding-presentation.ts packages/business/src/onboarding-steps.test.ts packages/business/src/onboarding-steps.ts
          git commit -m "fix(business): normalize M56 hygiene"
          git push origin HEAD:feat/business-m56-onboarding-step-contracts
