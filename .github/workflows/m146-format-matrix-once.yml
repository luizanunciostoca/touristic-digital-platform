name: Temporary M146 Matrix Formatter

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-format-matrix-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format canonical M146 matrix
        run: |
          pnpm exec prettier --write docs/migration/PAYMENTS-MIGRATION-MATRIX.md
          pnpm exec prettier --check docs/migration/PAYMENTS-MIGRATION-MATRIX.md
          git diff --check
      - name: Commit formatted matrix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m146-format-matrix-once.yml
          git add docs/migration/PAYMENTS-MIGRATION-MATRIX.md
          git commit -m "style(payments): format M146 migration matrix"
          git push origin HEAD:feat/payments-m146-settlement
