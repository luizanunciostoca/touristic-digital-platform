name: Staging Payments Authenticated Provider Probe

on:
  push:
    branches:
      - ops/payments-authenticated-provider-e2e-1692d1a-20260824

permissions:
  contents: read

jobs:
  provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_URL: https://morro-digital-v2-staging.onrender.com
      ACCEPTANCE_PASSWORD: ${{ secrets.STAGING_PAYMENTS_ACCEPTANCE_PASSWORD }}
      EXPECTED_RELEASE_SHA: 1692d1a274e1d4c3df0e834d81d527d707751e26
    steps:
      - name: Probe authenticated TEST card through preapproval
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { randomUUID } = require('node:crypto');
          const base = process.env.STAGING_URL;
          const password = process.env.ACCEPTANCE_PASSWORD || '';
          const expectedSha = process.env.EXPECTED_RELEASE_SHA;
          const ownerEmail = 'payments-acceptance-owner@morro.invalid';
          const businessId = 'biz_payments_acceptance';
          const providerPayerEmail = 'payments.acceptance@example.com';
          const origin = base;
          const referer = `${base}/business-onboarding.html`;

          function assert(ok, code) { if (!ok) throw new Error(code); }
          async function body(response) {
            const text = await response.text();
            try { return text ? JSON.parse(text) : {}; }
            catch { throw new Error(`NON_JSON_${response.status}`); }
          }
          function err(payload) {
            return String(payload?.error || payload?.message || 'UNKNOWN').slice(0, 180);
          }
          function cookie(response) {
            const values = typeof response.headers.getSetCookie === 'function'
              ? response.headers.getSetCookie()
              : [response.headers.get('set-cookie')].filter(Boolean);
            return String(values[0] || '').split(';', 1)[0];
          }
          async function login() {
            const response = await fetch(`${base}/api/dashboard/auth/login`, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', Origin: origin, Referer: referer },
              body: JSON.stringify({ email: ownerEmail, password }),
            });
            const payload = await body(response);
            assert(response.status === 200, `LOGIN_${response.status}_${err(payload)}`);
            const sessionCookie = cookie(response);
            assert(sessionCookie.includes('='), 'COOKIE_MISSING');
            assert(typeof payload.csrfToken === 'string' && payload.csrfToken.length > 10, 'CSRF_MISSING');
            return { cookie: sessionCookie, csrf: payload.csrfToken };
          }
          function authHeaders(session, mutation = true) {
            return {
              Accept: 'application/json',
              Origin: origin,
              Referer: referer,
              Cookie: session.cookie,
              'X-Business-ID': businessId,
              ...(mutation ? { 'X-CSRF-Token': session.csrf, 'Content-Type': 'application/json' } : {}),
            };
          }
          async function tokenize(publicKey) {
            const url = new URL('https://api.mercadopago.com/v1/card_tokens');
            url.searchParams.set('public_key', publicKey);
            const response = await fetch(url, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({
                card_number: '5031433215406351',
                expiration_month: 11,
                expiration_year: 2030,
                security_code: '123',
                cardholder: { name: 'APRO', identification: { type: 'CPF', number: '12345678909' } },
              }),
            });
            const payload = await body(response);
            assert(response.ok && typeof payload.id === 'string', `TOKEN_${response.status}_${err(payload)}`);
            return payload.id;
          }
          async function status(checkout) {
            const response = await fetch(`${base}/api/payments/v1/checkouts/${encodeURIComponent(checkout.checkoutId)}`, {
              headers: { Accept: 'application/json', 'X-Checkout-Token': checkout.statusToken, 'X-Correlation-ID': `browser:${randomUUID()}` },
              cache: 'no-store',
            });
            const payload = await body(response);
            assert(response.ok, `STATUS_${response.status}_${err(payload)}`);
            return payload.data || {};
          }
          async function waitConfirmed(checkout) {
            for (let i = 0; i < 75; i += 1) {
              const state = await status(checkout);
              if (state.status === 'CONFIRMED' && state.verifiedPayment?.verified === true) return state;
              if (['FAILED','CANCELLED','EXPIRED','REFUNDED'].includes(state.status)) throw new Error(`TERMINAL_${state.status}`);
              await new Promise(r => setTimeout(r, 2000));
            }
            throw new Error('CONFIRM_TIMEOUT');
          }

          (async () => {
            assert(base === 'https://morro-digital-v2-staging.onrender.com', 'TARGET_DENIED');
            assert(password.length >= 20, 'SECRET_MISSING');
            const ready = await fetch(`${base}/readyz`, { cache: 'no-store' });
            assert(ready.status === 200, `READY_${ready.status}`);
            assert(ready.headers.get('x-release-sha') === expectedSha, 'SHA_MISMATCH');
            console.log('STAGING_RELEASE_IDENTITY=PASS');

            const runtime = await (await fetch(`${base}/runtime-config.js`, { cache: 'no-store' })).text();
            const match = runtime.match(/Object\.freeze\((\{.*\})\);/su);
            assert(match, 'RUNTIME_PARSE');
            const publicKey = String(JSON.parse(match[1]).VITE_MERCADO_PAGO_PUBLIC_KEY || '');
            assert(publicKey.length > 20, 'PUBLIC_KEY_MISSING');

            const session = await login();
            console.log('AUTH_OWNER=PASS');
            const suffix = `${Date.now()}_${randomUUID().slice(0,8)}`;
            const handoff = {
              sessionId: `business_acceptance_${suffix}`,
              planId: 'provider_acceptance_test',
              contractor: { name: 'Payments Acceptance', email: ownerEmail, phone: '75999999999', document: '12345678900' },
              businessDraft: { demoBusinessId: `demo_${suffix}`, displayName: 'Payments Acceptance TEST', categoryId: 'events', specialty: 'Provider TEST', environment: 'sandbox', publishable: false },
              acceptedTerms: [
                { type: 'terms', version: 'business-partner-terms-2026-08', acceptedAt: new Date().toISOString() },
                { type: 'privacy', version: 'privacy-policy-2026-08', acceptedAt: new Date().toISOString() },
              ],
              returnUrl: `${base}/business-onboarding.html`, tutorial: false, requiresPaymentsCapability: true,
            };
            const create = await fetch(`${base}/api/payments/v1/checkouts`, {
              method: 'POST',
              headers: { ...authHeaders(session), 'Idempotency-Key': `business:${handoff.sessionId}:${handoff.planId}`, 'X-Correlation-ID': `browser:${randomUUID()}` },
              body: JSON.stringify(handoff),
            });
            const createPayload = await body(create);
            assert(create.ok, `CREATE_${create.status}_${err(createPayload)}`);
            const checkout = createPayload.data;
            assert(checkout?.plan?.amount?.minorUnits === 1000 && checkout?.plan?.amount?.currency === 'BRL', 'SERVER_PRICE_MISMATCH');
            console.log(`AUTHENTICATED_BUSINESS_CHECKOUT=PASS checkout=${checkout.checkoutId} payment=${checkout.paymentId}`);

            const cardToken = await tokenize(publicKey);
            const card = await fetch(`${base}/api/payments/v1/checkouts/${encodeURIComponent(checkout.checkoutId)}/card`, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', Origin: origin, Referer: referer, 'X-Checkout-Token': checkout.statusToken, 'X-Correlation-ID': `brick:${randomUUID()}` },
              body: JSON.stringify({ token: cardToken, installments: 1, payment_method_id: 'master', payer: { email: providerPayerEmail } }),
            });
            const cardPayload = await body(card);
            assert(card.ok, `CARD_${card.status}_${err(cardPayload)}`);
            console.log('AUTHENTICATED_CARD_PROVIDER_TEST=PASS');

            await waitConfirmed(checkout);
            console.log('VERIFIED_WEBHOOK_CONFIRMED=PASS');

            const materialize = await fetch(`${base}/api/payments/v1/subscriptions`, {
              method: 'POST', headers: authHeaders(session), body: JSON.stringify({ orderId: checkout.checkoutId }),
            });
            const materialized = await body(materialize);
            assert(materialize.ok, `MATERIALIZE_${materialize.status}_${err(materialized)}`);
            const subscriptionId = String(materialized.data?.subscriptionId || '');
            assert(subscriptionId.startsWith('sub_'), 'SUBSCRIPTION_ID_INVALID');
            console.log(`SUBSCRIPTION_MATERIALIZATION=PASS subscription=${subscriptionId}`);

            const subscriptionToken = await tokenize(publicKey);
            const providerPath = `${base}/api/payments/v1/subscriptions/${encodeURIComponent(subscriptionId)}/provider`;
            const preapproval = await fetch(providerPath, {
              method: 'POST', headers: authHeaders(session), body: JSON.stringify({ cardToken: subscriptionToken }),
            });
            const preapprovalPayload = await body(preapproval);
            assert(preapproval.ok, `PREAPPROVAL_${preapproval.status}_${err(preapprovalPayload)}`);
            console.log(`PREAPPROVAL_CREATE=PASS status=${preapprovalPayload.data?.providerStatus || 'unknown'}`);
            console.log('PROBE_THROUGH_PREAPPROVAL=PASS');
          })().catch(error => {
            console.error(`PROBE_THROUGH_PREAPPROVAL=FAIL reason=${String(error?.message || error).slice(0,280)}`);
            process.exitCode = 1;
          });
          NODE
