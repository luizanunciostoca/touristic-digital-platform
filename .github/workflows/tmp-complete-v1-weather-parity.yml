name: Temporary Complete V1 Weather Parity

on:
  push:
    branches:
      - fix/v1-home-parity-weather-globe-20260912
    paths:
      - .github/workflows/tmp-complete-v1-weather-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-home-parity-weather-globe-20260912
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete weather contracts and provider forecast
        run: |
          python3 <<'PY'
          from pathlib import Path

          widget = Path('apps/morro-digital-platform/src/weather/weather-widget.ts')
          text = widget.read_text()
          text = text.replace(
              '  readonly forecast: readonly WeatherForecastDay[];\n',
              '  readonly forecast?: readonly WeatherForecastDay[];\n',
          )
          old = '''    activeModal?.close();
    activeModal = openWeatherForecastModal({ document, reading: latestReading });
    widget.setAttribute("aria-expanded", "true");

    const close = activeModal.close;
    activeModal = Object.freeze({
      element: activeModal.element,
      close(): void {
        close();
        widget.setAttribute("aria-expanded", "false");
        activeModal = undefined;
      },
    });
'''
          new = '''    activeModal?.close();
    activeModal = openWeatherForecastModal({
      document,
      reading: latestReading,
      onClose: () => {
        widget.setAttribute("aria-expanded", "false");
        activeModal = undefined;
      },
    });
    widget.setAttribute("aria-expanded", "true");
'''
          if old not in text:
              raise SystemExit('weather widget modal block not found')
          widget.write_text(text.replace(old, new))

          modal = Path('apps/morro-digital-platform/src/weather/weather-forecast-modal.ts')
          text = modal.read_text()
          text = text.replace(
              '  readonly reading: WeatherReading;\n}',
              '  readonly reading: WeatherReading;\n  readonly onClose?: () => void;\n}',
          )
          text = text.replace(
              '  return reading.forecast.length > 0 ? reading.forecast : [todayFallback(reading)];',
              '  return reading.forecast && reading.forecast.length > 0\n    ? reading.forecast\n    : [todayFallback(reading)];',
          )
          text = text.replace(
              '  reading,\n}: WeatherForecastModalOptions): WeatherForecastModalController {',
              '  reading,\n  onClose,\n}: WeatherForecastModalOptions): WeatherForecastModalController {',
          )
          text = text.replace(
              '    modal.remove();\n    previouslyFocused?.focus();\n',
              '    modal.remove();\n    onClose?.();\n    previouslyFocused?.focus();\n',
          )
          modal.write_text(text)

          server = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = server.read_text()
          old = '''  return {
    temperatureCelsius,
    temperatureMaxCelsius: today.tempmax,
    temperatureMinCelsius: today.tempmin,
    humidityPercent: current.humidity,
    windSpeedKph: current.windspeed,
    rainChancePercent: today.precipprob,
    weatherCode: conditionToWeatherCode(current?.conditions || icon),
    isDay: !icon.includes("night"),
    provider: "visual-crossing",
  };
'''
          new = '''  const forecast = Array.isArray(payload?.days)
    ? payload.days.slice(0, 7).flatMap((day) => {
        if (
          typeof day?.datetime !== "string" ||
          typeof day?.tempmax !== "number" ||
          typeof day?.tempmin !== "number" ||
          typeof day?.humidity !== "number" ||
          typeof day?.windspeed !== "number" ||
          typeof day?.precipprob !== "number"
        ) {
          return [];
        }
        return [
          {
            date: day.datetime,
            temperatureMaxCelsius: day.tempmax,
            temperatureMinCelsius: day.tempmin,
            humidityPercent: day.humidity,
            windSpeedKph: day.windspeed,
            rainChancePercent: day.precipprob,
            weatherCode: conditionToWeatherCode(day?.conditions || day?.icon),
          },
        ];
      })
    : [];

  return {
    temperatureCelsius,
    temperatureMaxCelsius: today.tempmax,
    temperatureMinCelsius: today.tempmin,
    humidityPercent: current.humidity,
    windSpeedKph: current.windspeed,
    rainChancePercent: today.precipprob,
    weatherCode: conditionToWeatherCode(current?.conditions || icon),
    isDay: !icon.includes("night"),
    forecast,
    provider: "visual-crossing",
  };
'''
          if old not in text:
              raise SystemExit('Visual Crossing return block not found')
          text = text.replace(old, new)
          text = text.replace(
              '    "temperature_2m_max,temperature_2m_min,precipitation_probability_max",',
              '    "temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,relative_humidity_2m_max,wind_speed_10m_max",',
          )
          old = '''  return {
    temperatureCelsius: current.temperature_2m,
    temperatureMaxCelsius: daily.temperature_2m_max[0],
    temperatureMinCelsius: daily.temperature_2m_min[0],
    humidityPercent: current.relative_humidity_2m,
    windSpeedKph: current.wind_speed_10m,
    rainChancePercent: daily.precipitation_probability_max[0],
    weatherCode: current.weather_code,
    isDay: current.is_day === 1,
    provider: "open-meteo",
  };
'''
          new = '''  const forecast = Array.isArray(daily?.time)
    ? daily.time.slice(0, 7).flatMap((date, index) => {
        const temperatureMax = daily?.temperature_2m_max?.[index];
        const temperatureMin = daily?.temperature_2m_min?.[index];
        const rainChance = daily?.precipitation_probability_max?.[index];
        const weatherCode = daily?.weather_code?.[index];
        const humidity = daily?.relative_humidity_2m_max?.[index];
        const windSpeed = daily?.wind_speed_10m_max?.[index];
        if (
          typeof date !== "string" ||
          typeof temperatureMax !== "number" ||
          typeof temperatureMin !== "number" ||
          typeof rainChance !== "number" ||
          typeof weatherCode !== "number" ||
          typeof humidity !== "number" ||
          typeof windSpeed !== "number"
        ) {
          return [];
        }
        return [
          {
            date,
            temperatureMaxCelsius: temperatureMax,
            temperatureMinCelsius: temperatureMin,
            humidityPercent: humidity,
            windSpeedKph: windSpeed,
            rainChancePercent: rainChance,
            weatherCode,
          },
        ];
      })
    : [];

  return {
    temperatureCelsius: current.temperature_2m,
    temperatureMaxCelsius: daily.temperature_2m_max[0],
    temperatureMinCelsius: daily.temperature_2m_min[0],
    humidityPercent: current.relative_humidity_2m,
    windSpeedKph: current.wind_speed_10m,
    rainChancePercent: daily.precipitation_probability_max[0],
    weatherCode: current.weather_code,
    isDay: current.is_day === 1,
    forecast,
    provider: "open-meteo",
  };
'''
          if old not in text:
              raise SystemExit('Open-Meteo return block not found')
          server.write_text(text.replace(old, new))
          PY
      - name: Format TypeScript files
        run: pnpm exec prettier --write apps/morro-digital-platform/src/weather/weather-widget.ts apps/morro-digital-platform/src/weather/weather-forecast-modal.ts apps/morro-digital-platform/src/map/global-view-control.ts apps/morro-digital-platform/src/browser-entry.ts
      - name: Validate patch
        run: git diff --check && pnpm --filter @touristic/morro-digital-platform build
      - name: Commit runtime parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/weather/weather-widget.ts \
                  apps/morro-digital-platform/src/weather/weather-forecast-modal.ts \
                  apps/morro-digital-platform/src/map/global-view-control.ts \
                  apps/morro-digital-platform/src/browser-entry.ts \
                  apps/morro-digital-platform/tooling/dev-server.mjs
          git commit -m 'feat(home): restore V1 weather forecast and global view parity'
          git push origin HEAD:fix/v1-home-parity-weather-globe-20260912
