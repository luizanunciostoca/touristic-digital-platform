name: Prettier Assistant Runtime Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/prettier-assistant-runtime-diagnostic.yml
      - apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts
      - apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - packages/assistant/src/dialog-controller.test.ts
      - packages/assistant/src/dialog-controller.ts

permissions:
  contents: read

jobs:
  prettier-assistant-runtime-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical formatter diff
        run: |
          pnpm exec prettier \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            packages/assistant/src/dialog-controller.test.ts \
            packages/assistant/src/dialog-controller.ts \
            --write
          git diff -- \
            apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            packages/assistant/src/dialog-controller.test.ts \
            packages/assistant/src/dialog-controller.ts
