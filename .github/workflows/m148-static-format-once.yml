name: Temporary M148 Static Formatter

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/m148-static-format-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded static corrections and canonical formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.ts')
          s = client.read_text()
          replacements = [
              (
                  '  open(url: string, target: string, features: string): unknown | null;',
                  '  open(url: string, target: string, features: string): object | null;',
              ),
              (
                  '  return Object.freeze(Object.fromEntries(headers.entries()));',
                  '''  const normalized: Record<string, string> = {};
          for (const name of [
            "x-checkout-handoff-token",
            "x-csrf-token",
            "x-business-id",
          ]) {
            const value = headers.get(name);
            if (value) normalized[name] = value;
          }
          return Object.freeze(normalized);'''.replace('          ', ''),
              ),
              (
                  '''function paymentFailure(
          sessionId: string,
          code: PaymentsBrowserCheckoutErrorCode,
          message: string,
          ): PaymentsBrowserCheckoutError {
          return new PaymentsBrowserCheckoutError(code, message);
          }'''.replace('          ', ''),
                  '''function paymentFailure(
          sessionId: string,
          code: PaymentsBrowserCheckoutErrorCode,
          message: string,
          ): PaymentsBrowserCheckoutError {
          void sessionId;
          return new PaymentsBrowserCheckoutError(code, message);
          }'''.replace('          ', ''),
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'client replacement not found exactly once: {old[:80]!r}')
              s = s.replace(old, new, 1)
          client.write_text(s)

          test = Path('apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts')
          t = test.read_text()
          test_replacements = [
              (
                  '    readonly popupResult?: unknown | null;',
                  '    readonly popupResult?: object | null;',
              ),
              (
                  '      requests.push({ url: String(input), init });',
                  '''      const url =
          typeof input === "string"
            ? input
            : input instanceof URL
              ? input.toString()
              : input.url;
          requests.push({ url, init });'''.replace('          ', ''),
              ),
          ]
          for old, new in test_replacements:
              if t.count(old) != 1:
                  raise SystemExit(f'test replacement not found exactly once: {old!r}')
              t = t.replace(old, new, 1)
          test.write_text(t)
          PY
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform test
          git diff --check
      - name: Commit permanent files and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m148-static-format-once.yml
          git add \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts
          git commit -m "fix(payments): harden and format M148 browser client"
          git push origin HEAD:feat/payments-m148-browser-checkout
