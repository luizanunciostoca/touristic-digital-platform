name: M38 Move V1 Catalog Once
on:
  push:
    branches:
      - feat/search-m38-shared-v1-catalog
permissions:
  contents: write
jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m38-shared-v1-catalog
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Move frozen catalog ownership into Search
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          source = Path('apps/morro-digital-platform/src/assistant/assistant-v1-destination-catalog.ts')
          target = Path('packages/search/src/morro-v1-search-catalog.ts')
          text = source.read_text()
          text = text.replace(
              'import type { AssistantDestinationCatalogEntry } from "./assistant-destination-resolver.js";',
              'import type { SearchCatalogItem } from "./index.js";\n\nexport interface MorroV1SearchCatalogItem extends SearchCatalogItem {\n  readonly latitude: number;\n  readonly longitude: number;\n  readonly category: string;\n}'
          )
          text = text.replace('morroAssistantV1DestinationCatalog', 'morroV1SearchCatalog')
          text = text.replace('readonly AssistantDestinationCatalogEntry[]', 'readonly MorroV1SearchCatalogItem[]')
          text = text.replace(
              'Only fields consumed by the V1 assistant place resolver are retained:',
              'Frozen base discovery fields retained from the V1 canonical catalog:'
          )
          target.write_text(text)
          source.unlink()

          index = Path('packages/search/src/index.ts')
          current = index.read_text()
          export_line = '\nexport { morroV1SearchCatalog, type MorroV1SearchCatalogItem } from "./morro-v1-search-catalog.js";\n'
          if 'morroV1SearchCatalog' not in current:
              index.write_text(current.rstrip() + export_line)

          for path in [
              Path('apps/morro-digital-platform/src/assistant/assistant-destination-resolver.ts'),
              Path('apps/morro-digital-platform/src/assistant/assistant-nearby-adapter.ts'),
          ]:
              content = path.read_text()
              content = content.replace(
                  'import { morroAssistantV1DestinationCatalog } from "./assistant-v1-destination-catalog.js";',
                  'import { morroV1SearchCatalog } from "@touristic/search";'
              )
              content = content.replace('morroAssistantV1DestinationCatalog', 'morroV1SearchCatalog')
              path.write_text(content)

          package = Path('apps/morro-digital-platform/package.json')
          manifest = json.loads(package.read_text())
          deps = manifest.setdefault('dependencies', {})
          deps['@touristic/search'] = 'workspace:*'
          manifest['dependencies'] = dict(sorted(deps.items()))
          package.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - run: pnpm install
      - run: pnpm format
      - name: Commit move and remove helper
        run: |
          rm .github/workflows/m38-move-v1-catalog-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/search apps/morro-digital-platform pnpm-lock.yaml .github/workflows/m38-move-v1-catalog-once.yml
          git commit -m "refactor(search): move frozen V1 catalog ownership"
          git push origin HEAD:feat/search-m38-shared-v1-catalog
