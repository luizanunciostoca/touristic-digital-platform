name: Temporary Payments M149 Workflow Export

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/m149-export-formatted-workflow-once.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render canonical workflow
        run: |
          pnpm exec prettier --write .github/workflows/payments-browser-checkout-contract.yml
          pnpm exec prettier --check .github/workflows/payments-browser-checkout-contract.yml
          cp .github/workflows/payments-browser-checkout-contract.yml docs/qa/PAYMENTS-M149-WORKFLOW-FORMATTED.tmp
      - name: Publish temporary formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/PAYMENTS-M149-WORKFLOW-FORMATTED.tmp
          git commit -m "chore(payments): export formatted M149 workflow"
          git push origin HEAD:feat/payments-m148-browser-checkout
