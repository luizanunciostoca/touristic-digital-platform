name: M136 Prepare Once

on:
  push:
    branches:
      - feat/payments-m136-domain-vocabulary

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m136-domain-vocabulary
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reconcile M136 master tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/migration/MASTER-MIGRATION-TRACKER.md')
          text = path.read_text()
          old_row = '| MIG-0010 | pagamentos/assinaturas | Ordering / Financial | FEATURE-0009 | `@touristic/ordering` + `@touristic/financial` | 8 | snapshotted | checkout/browser baseline congelado; superfície V2 ainda não implementada | V1 checkout congelado em M135; 34 contratos: 1 PASS / 5 PARTIAL / 27 GAP / 1 N/A; pricing server-authoritative, idempotência, webhook HMAC, status público e confirmação financeira inventariados | `PAYMENTS-V1-BASELINE.md`; `PAYMENTS-MIGRATION-MATRIX.md`; `PAYMENTS-M135-EVIDENCE.md` | crítico |'
          new_row = '| MIG-0010 | pagamentos/assinaturas | Ordering / Financial | FEATURE-0009 | `@touristic/ordering` + `@touristic/financial` | 8 | migrating | domínio/ports executáveis em M136; checkout/browser/provider ainda não implementados | 34 contratos: 3 PASS / 15 PARTIAL / 15 GAP / 1 N/A; Order, Money, Payment, idempotência, provider ports, ledger balanceado e eventos versionados agora têm evidência executável | `PAYMENTS-V1-BASELINE.md`; `PAYMENTS-MIGRATION-MATRIX.md`; `PAYMENTS-M135-EVIDENCE.md`; `PAYMENTS-M136-EVIDENCE.md` | crítico |'
          if old_row not in text:
              raise SystemExit('M135 MIG-0010 row not found')
          text = text.replace(old_row, new_row, 1)
          start = text.index('## Payments baseline congelada — MIG-0010')
          end = text.index('## Evidência consolidada — checkpoint Home + Runtime + Geospatial')
          section = '''## Payments em migração — MIG-0010

M135 congelou a Wave 8 a partir da V1 `luizidebook/morro-de-sao-paulo-digital@60746fd7fed97b805758b37adfdbe3bad2582bfe` e separou Business, Ordering e Financial sem habilitar money movement.

M136 materializa os packages framework-independent:

```text
@touristic/ordering
@touristic/financial
```

O núcleo agora possui evidência executável para:

- `Money` em minor units inteiras e moeda normalizada, sem autoridade financeira baseada em decimal floating-point;
- identidades tipadas de Order, Payment, Ledger e Financial events;
- request key lógica `business:<sessionId>:<planId>` separada da idempotência financeira `payment:v1:<orderReference>`;
- pricing quote/snapshot server-authoritative e versionado;
- lifecycle fail-closed de Order e Payment;
- repository/pricing/idempotency/provider/webhook ports;
- ledger double-entry que rejeita postings desbalanceados, zero, cross-currency e overflow;
- eventos `OrderPlaced v1`, `PaymentApproved v1` e `PaymentRefunded v1` provider-agnostic.

A matriz canônica M136 é:

```text
PASS      3
PARTIAL  15
GAP      15
N/A       1
TOTAL    34
```

`MIG-0010` e `FEATURE-0009` avançam para `migrating`, mas equivalence behavior/visual/API permanece `false`. M136 **não** adiciona provider, SDK financeiro, HTTP route, database adapter, webhook endpoint, public token, browser checkout ou transação monetária real.

A direção de dependências permanece:

```text
Business → Ordering → Financial public contracts
                    ↘ provider ports (future adapters)
Financial ↛ Business/UI/provider SDK
```

O próximo milestone M137 deve implementar persistência durable server-side para Order, Payment, atomic idempotency claims e append-only Ledger transactions, com constraints, transações, parameterized access, schema evolution e rollback. Nenhuma chamada real a provider deve existir antes dessa base.

Affiliates continua bloqueado até Payment/Ledger autoritativos e reversíveis estarem persistidos, pois comissão/payout deve consumir eventos financeiros confiáveis em vez de inferir conversão pelo browser.

'''
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only
      - name: Apply canonical formatting
        run: pnpm format
      - name: Validate M136 packages
        run: |
          pnpm --filter @touristic/financial lint
          pnpm --filter @touristic/financial typecheck
          pnpm --filter @touristic/financial test
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/ordering lint
          pnpm --filter @touristic/ordering typecheck
          pnpm --filter @touristic/ordering test
          pnpm --filter @touristic/ordering build
      - name: Commit prepared M136 state
        run: |
          if git diff --quiet; then
            echo "No preparation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(payments): prepare M136 workspace and docs"
          git push
