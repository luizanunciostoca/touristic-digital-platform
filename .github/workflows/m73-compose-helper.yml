name: M73 CRM composition helper

on:
  push:
    branches:
      - feat/crm-m73-platform-auth-composition
    paths:
      - ".github/workflows/m73-compose-helper.yml"

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m73-platform-auth-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply M73 composition patch
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          auth=Path('apps/morro-digital-platform/tooling/auth-api.mjs')
          s=auth.read_text()
          anchor='  function authorizeBusinessRequest(\n'
          helper='''  function authorizeMutation(request, active, auditAction = "platform.mutation") {\n    if (!originAllowed(request)) {\n      audit(request, {\n        action: auditAction,\n        result: "denied",\n        reason: "cross_origin_request",\n      });\n      return Object.freeze({ allowed: false, reason: "cross_origin_request" });\n    }\n    if (\n      !verifyCsrfToken(\n        firstHeader(request.headers["x-csrf-token"]),\n        active,\n        secret,\n      )\n    ) {\n      audit(request, {\n        action: auditAction,\n        result: "denied",\n        reason: "invalid_csrf",\n      });\n      return Object.freeze({ allowed: false, reason: "invalid_csrf" });\n    }\n    return Object.freeze({ allowed: true });\n  }\n\n'''
          if helper not in s:
            assert anchor in s
            s=s.replace(anchor, helper+anchor, 1)
          return_anchor='''  return Object.freeze({\n    authorizeBusinessRequest,\n'''
          replacement='''  return Object.freeze({\n    authorizeBusinessRequest,\n    authorizeMutation,\n    resolveSession: currentSession,\n'''
          assert return_anchor in s
          s=s.replace(return_anchor,replacement,1)
          auth.write_text(s)

          pkg=Path('apps/morro-digital-platform/package.json')
          data=json.loads(pkg.read_text())
          data['dependencies']['@touristic/crm']='workspace:*'
          data['dependencies']['@touristic/crm-server']='workspace:*'
          data['dependencies']=dict(sorted(data['dependencies'].items()))
          pkg.write_text(json.dumps(data,indent=2)+"\n")

          dev=Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          s=dev.read_text()
          import_anchor='import { createBusinessApi } from "./business-api.mjs";\n'
          crm_import='import { createCrmApi } from "./crm-api.mjs";\n'
          if crm_import not in s:
            assert import_anchor in s
            s=s.replace(import_anchor,import_anchor+crm_import,1)
          business_anchor='const businessApi = createBusinessApi({ authApi });\n'
          crm_create='''const crmApi = createCrmApi({\n  authApi,\n  getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",\n});\n\n'''
          if crm_create not in s:
            assert business_anchor in s
            s=s.replace(business_anchor,crm_create+business_anchor,1)
          route_anchor='''    if (businessApi.matches(requestUrl.pathname)) {\n      await businessApi.handle(request, response, requestUrl.pathname);\n      return;\n    }\n'''
          crm_route='''    if (crmApi.matches(requestUrl.pathname)) {\n      await crmApi.handle(request, response, requestUrl);\n      return;\n    }\n'''
          if crm_route not in s:
            assert route_anchor in s
            s=s.replace(route_anchor,crm_route+route_anchor,1)
          dev.write_text(s)
          PY
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/package.json apps/morro-digital-platform/tooling/auth-api.mjs apps/morro-digital-platform/tooling/crm-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs pnpm-lock.yaml
      - name: Validate M73 composition
        run: |
          pnpm --filter @touristic/auth-server test
          pnpm --filter @touristic/crm-server test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm -w build
          rm -rf .turbo
          pnpm check
      - name: Commit permanent M73 code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/package.json apps/morro-digital-platform/tooling/auth-api.mjs apps/morro-digital-platform/tooling/crm-api.mjs apps/morro-digital-platform/tooling/dev-server.mjs pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(crm): integrate M73 platform auth composition"
          git push origin HEAD:feat/crm-m73-platform-auth-composition
