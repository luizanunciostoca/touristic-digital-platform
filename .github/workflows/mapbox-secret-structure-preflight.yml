name: Mapbox Secret Structure Preflight

on:
  pull_request:
    paths:
      - .github/workflows/mapbox-secret-structure-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret structure without disclosure
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          value = os.environ.get("MAPBOX_PUBLIC_TOKEN_CI", "")
          stripped = value.strip()
          report = {
              "present": bool(value),
              "length": len(value),
              "leading_whitespace": len(value) - len(value.lstrip()),
              "trailing_whitespace": len(value) - len(value.rstrip()),
              "starts_pk_exact": value.startswith("pk."),
              "starts_pk_after_trim": stripped.startswith("pk."),
              "contains_pk": "pk." in value,
              "pk_offset": value.find("pk.") if "pk." in value else None,
              "outer_double_quotes": len(stripped) >= 2 and stripped.startswith('"') and stripped.endswith('"'),
              "outer_single_quotes": len(stripped) >= 2 and stripped.startswith("'") and stripped.endswith("'"),
              "assignment_prefix": stripped.startswith("MAPBOX_PUBLIC_TOKEN_CI="),
          }
          print("secret_structure=" + json.dumps(report, sort_keys=True))

          if not stripped.startswith("pk."):
              raise SystemExit("normalized_public_token=false")

          request = urllib.request.Request(
              "https://api.mapbox.com/styles/v1/mapbox/streets-v12?access_token=" + stripped,
              headers={"User-Agent": "morro-digital-ci-preflight/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code
          print(f"mapbox_styles_http_status={status}")
          if status != 200:
              raise SystemExit("mapbox_provider_validation=false")
          print("mapbox_provider_validation=true")
          PY
