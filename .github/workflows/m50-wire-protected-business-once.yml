name: M50 Wire Protected Business Once

on:
  push:
    branches:
      - feat/business-m50-protected-http
    paths:
      - .github/workflows/m50-wire-protected-business-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m50-protected-http
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply M50 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          auth = Path('apps/morro-digital-platform/tooling/auth-api.mjs')
          text = auth.read_text()
          if 'authorizeBusinessAccess' not in text:
              text = 'import { authorizeBusinessAccess } from "@touristic/auth";\n' + text

          anchor = '  async function login(request, response) {'
          block = '''  function authorizeBusinessRequest(\n    request,\n    response,\n    businessIdInput,\n    { mutation = false, auditAction = "business.resource" } = {},\n  ) {\n    const active = requireSession(request, response);\n    if (!active) return null;\n\n    if (mutation && !originAllowed(request)) {\n      audit(request, {\n        action: auditAction,\n        result: "denied",\n        reason: "cross_origin_request",\n      });\n      json(response, 403, {\n        error: "ORIGIN_DENIED",\n        message: "Origem da solicitação não autorizada.",\n      });\n      return null;\n    }\n\n    if (\n      mutation &&\n      !verifyCsrfToken(\n        firstHeader(request.headers["x-csrf-token"]),\n        active,\n        secret,\n      )\n    ) {\n      audit(request, {\n        action: auditAction,\n        result: "denied",\n        reason: "invalid_csrf",\n      });\n      json(response, 403, {\n        error: "INVALID_CSRF",\n        message: "Validação de segurança expirada. Recarregue o painel.",\n      });\n      return null;\n    }\n\n    const decision = authorizeBusinessAccess(active, businessIdInput, {\n      mutation,\n    });\n    if (!decision.allowed || !decision.businessId) {\n      audit(request, {\n        action: auditAction,\n        result: "denied",\n        reason: decision.reason,\n      });\n\n      if (decision.reason === "invalid_business_id") {\n        json(response, 400, {\n          error: "INVALID_BUSINESS_ID",\n          message: "Identificador de empresa inválido.",\n        });\n        return null;\n      }\n      if (decision.reason === "read_only_role") {\n        json(response, 403, {\n          error: "READ_ONLY_ROLE",\n          message: "Este usuário possui acesso somente para leitura.",\n        });\n        return null;\n      }\n\n      json(response, 403, {\n        error: "BUSINESS_ACCESS_DENIED",\n        message: "Acesso à empresa não autorizado.",\n      });\n      return null;\n    }\n\n    return Object.freeze({ session: active, businessId: decision.businessId });\n  }\n\n'''
          if block not in text:
              if anchor not in text:
                  raise SystemExit('auth login anchor not found')
              text = text.replace(anchor, block + anchor, 1)
          return_anchor = '  return Object.freeze({\n    matches(pathname) {'
          replacement = '  return Object.freeze({\n    authorizeBusinessRequest,\n    matches(pathname) {'
          if replacement not in text:
              if return_anchor not in text:
                  raise SystemExit('auth return anchor not found')
              text = text.replace(return_anchor, replacement, 1)
          auth.write_text(text)

          dev = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = dev.read_text()
          import_anchor = 'import { createAuthApi } from "./auth-api.mjs";\n'
          if 'createBusinessApi' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { createBusinessApi } from "./business-api.mjs";\n', 1)
          auth_create = '''const authApi = createAuthApi({\n  getEnvironmentValue: (key) => process.env[key] ?? localEnvironment[key] ?? "",\n});\n'''
          business_create = auth_create + '''\nconst businessApi = createBusinessApi({ authApi });\n'''
          if 'const businessApi = createBusinessApi' not in text:
              if auth_create not in text:
                  raise SystemExit('dev auth creation anchor not found')
              text = text.replace(auth_create, business_create, 1)
          route_anchor = '''    if (assistantApi.matches(requestUrl.pathname)) {\n      await assistantApi.handle(request, response);\n      return;\n    }\n'''
          business_route = '''    if (businessApi.matches(requestUrl.pathname)) {\n      await businessApi.handle(request, response, requestUrl.pathname);\n      return;\n    }\n''' + route_anchor
          if 'businessApi.matches' not in text:
              if route_anchor not in text:
                  raise SystemExit('dev assistant route anchor not found')
              text = text.replace(route_anchor, business_route, 1)
          dev.write_text(text)

          package_path = Path('apps/morro-digital-platform/package.json')
          package = json.loads(package_path.read_text())
          deps = package['dependencies']
          deps['@touristic/auth'] = 'workspace:*'
          deps['@touristic/business'] = 'workspace:*'
          package['dependencies'] = dict(sorted(deps.items()))
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')
          PY

          cat > apps/morro-digital-platform/tooling/business-api.mjs <<'EOF'
          import { createAuthorizedBusinessProfileService } from "@touristic/business";

          const businessProfilePattern = /^\/api\/business\/([^/]+)\/profile$/u;
          const maxBodyBytes = 64 * 1024;

          function json(response, statusCode, payload) {
            response.statusCode = statusCode;
            response.setHeader("Content-Type", "application/json; charset=utf-8");
            response.setHeader("Cache-Control", "no-store");
            response.end(JSON.stringify(payload));
          }

          async function readJsonBody(request) {
            const chunks = [];
            let total = 0;
            for await (const chunk of request) {
              const buffer = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk);
              total += buffer.length;
              if (total > maxBodyBytes) throw new Error("REQUEST_BODY_TOO_LARGE");
              chunks.push(buffer);
            }
            if (chunks.length === 0) return {};
            return JSON.parse(Buffer.concat(chunks).toString("utf8"));
          }

          function createMemoryBusinessProfileRepository() {
            const profiles = new Map();
            return Object.freeze({
              async getProfile(businessId) {
                return profiles.get(businessId) ?? null;
              },
              async saveProfile(businessId, profile) {
                profiles.set(businessId, profile);
                return profile;
              },
            });
          }

          export function createBusinessApi({
            authApi,
            repository = createMemoryBusinessProfileRepository(),
          }) {
            if (!authApi?.authorizeBusinessRequest) {
              throw new Error("BUSINESS_AUTH_BOUNDARY_REQUIRED");
            }
            const profiles = createAuthorizedBusinessProfileService(repository);

            function route(pathname) {
              const match = businessProfilePattern.exec(pathname);
              if (!match) return null;
              try {
                return { businessId: decodeURIComponent(match[1] || "") };
              } catch {
                return { businessId: "" };
              }
            }

            return Object.freeze({
              matches(pathname) {
                return businessProfilePattern.test(pathname);
              },

              async handle(request, response, pathname) {
                const matched = route(pathname);
                if (!matched) {
                  json(response, 404, { error: "BUSINESS_RESOURCE_NOT_FOUND" });
                  return;
                }

                if (request.method === "GET") {
                  const access = authApi.authorizeBusinessRequest(
                    request,
                    response,
                    matched.businessId,
                    { mutation: false, auditAction: "business.profile.read" },
                  );
                  if (!access) return;
                  const profile = await profiles.getProfile(
                    access.session,
                    access.businessId,
                  );
                  response.setHeader("Vary", "Cookie");
                  if (!profile) {
                    json(response, 404, { error: "BUSINESS_PROFILE_NOT_FOUND" });
                    return;
                  }
                  json(response, 200, { profile });
                  return;
                }

                if (request.method === "PUT") {
                  const access = authApi.authorizeBusinessRequest(
                    request,
                    response,
                    matched.businessId,
                    { mutation: true, auditAction: "business.profile.write" },
                  );
                  if (!access) return;

                  let body;
                  try {
                    body = await readJsonBody(request);
                  } catch {
                    json(response, 400, { error: "INVALID_BUSINESS_PROFILE" });
                    return;
                  }

                  const profile = await profiles.saveProfile(
                    access.session,
                    access.businessId,
                    body,
                  );
                  response.setHeader("Vary", "Cookie");
                  json(response, 200, { success: true, profile });
                  return;
                }

                json(response, 405, { error: "METHOD_NOT_ALLOWED" });
              },
            });
          }
          EOF

          cat > .github/workflows/business-auth-integration-contract.yml <<'EOF'
          name: Business Auth Integration Contract

          on:
            pull_request:
              paths:
                - "packages/auth/**"
                - "packages/business/**"
                - "services/auth/**"
                - "apps/morro-digital-platform/package.json"
                - "apps/morro-digital-platform/tooling/auth-api.mjs"
                - "apps/morro-digital-platform/tooling/business-api.mjs"
                - "apps/morro-digital-platform/tooling/dev-server.mjs"
                - "pnpm-lock.yaml"
                - ".github/workflows/business-auth-integration-contract.yml"
            push:
              branches:
                - main
              paths:
                - "packages/auth/**"
                - "packages/business/**"
                - "services/auth/**"
                - "apps/morro-digital-platform/package.json"
                - "apps/morro-digital-platform/tooling/auth-api.mjs"
                - "apps/morro-digital-platform/tooling/business-api.mjs"
                - "apps/morro-digital-platform/tooling/dev-server.mjs"
                - "pnpm-lock.yaml"
                - ".github/workflows/business-auth-integration-contract.yml"

          permissions:
            contents: read

          jobs:
            business-auth-contract:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - name: Validate Business and Auth packages
                  run: |
                    pnpm --filter @touristic/auth test
                    pnpm --filter @touristic/business lint
                    pnpm --filter @touristic/business typecheck
                    pnpm --filter @touristic/business test
                - name: Build workspace
                  run: pnpm -w build
                - name: Validate protected Business HTTP contract
                  shell: bash
                  run: |
                    set -euo pipefail
                    PORT=4175
                    ORIGIN="http://127.0.0.1:${PORT}"
                    SECRET="0123456789abcdef0123456789abcdef"
                    PASSWORD="correct horse battery staple"
                    HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 7))))" "$PASSWORD")
                    USERS=$(node -e 'console.log(JSON.stringify([{id:"owner-1",email:"owner@example.com",passwordHash:process.argv[1],role:"owner",businessIds:["toca-do-morcego"]},{id:"viewer-1",email:"viewer@example.com",passwordHash:process.argv[1],role:"viewer",businessIds:["toca-do-morcego"]}]))' "$HASH")

                    DASHBOARD_AUTH_SECRET="$SECRET" \
                    DASHBOARD_USERS_JSON="$USERS" \
                    PORT="$PORT" \
                    HOST="127.0.0.1" \
                    node apps/morro-digital-platform/tooling/dev-server.mjs > /tmp/m50-business-server.log 2>&1 &
                    SERVER_PID=$!
                    trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/m50-business-server.log || true' EXIT

                    for _ in $(seq 1 40); do
                      if curl --fail --silent "$ORIGIN/runtime-config.js" >/dev/null; then break; fi
                      sleep 0.25
                    done

                    OWNER_LOGIN=$(curl --silent --output /tmp/owner-login.json --write-out '%{http_code}' \
                      --cookie-jar /tmp/owner.cookies \
                      --header "Origin: $ORIGIN" \
                      --header 'Content-Type: application/json' \
                      --data "{\"email\":\"owner@example.com\",\"password\":\"$PASSWORD\"}" \
                      "$ORIGIN/api/dashboard/auth/login")
                    test "$OWNER_LOGIN" = "200"
                    python - <<'PY'
                    import json
                    data=json.load(open('/tmp/owner-login.json'))
                    open('/tmp/owner-csrf.txt','w').write(data['csrfToken'])
                    PY
                    OWNER_CSRF=$(cat /tmp/owner-csrf.txt)

                    PUT_STATUS=$(curl --silent --output /tmp/profile-put.json --write-out '%{http_code}' \
                      --cookie /tmp/owner.cookies \
                      --header "Origin: $ORIGIN" \
                      --header "X-CSRF-Token: $OWNER_CSRF" \
                      --header 'Content-Type: application/json' \
                      --request PUT \
                      --data '{"name":"Toca do Morcego","categoryLabel":"Experiência","locationLabel":"Morro de São Paulo"}' \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$PUT_STATUS" = "200"
                    grep -q '"name":"Toca do Morcego"' /tmp/profile-put.json

                    GET_STATUS=$(curl --silent --output /tmp/profile-get.json --write-out '%{http_code}' \
                      --cookie /tmp/owner.cookies \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$GET_STATUS" = "200"
                    grep -q '"id":"toca-do-morcego"' /tmp/profile-get.json

                    TENANT_STATUS=$(curl --silent --output /tmp/tenant-denied.json --write-out '%{http_code}' \
                      --cookie /tmp/owner.cookies \
                      "$ORIGIN/api/business/outra-empresa/profile")
                    test "$TENANT_STATUS" = "403"
                    grep -q 'BUSINESS_ACCESS_DENIED' /tmp/tenant-denied.json

                    BAD_CSRF_STATUS=$(curl --silent --output /tmp/business-bad-csrf.json --write-out '%{http_code}' \
                      --cookie /tmp/owner.cookies \
                      --header "Origin: $ORIGIN" \
                      --header 'X-CSRF-Token: wrong' \
                      --header 'Content-Type: application/json' \
                      --request PUT \
                      --data '{"name":"Blocked"}' \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$BAD_CSRF_STATUS" = "403"
                    grep -q 'INVALID_CSRF' /tmp/business-bad-csrf.json

                    CROSS_STATUS=$(curl --silent --output /tmp/business-cross.json --write-out '%{http_code}' \
                      --cookie /tmp/owner.cookies \
                      --header 'Origin: https://evil.example' \
                      --header "X-CSRF-Token: $OWNER_CSRF" \
                      --header 'Content-Type: application/json' \
                      --request PUT \
                      --data '{"name":"Blocked"}' \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$CROSS_STATUS" = "403"
                    grep -q 'ORIGIN_DENIED' /tmp/business-cross.json

                    VIEWER_LOGIN=$(curl --silent --output /tmp/viewer-login.json --write-out '%{http_code}' \
                      --cookie-jar /tmp/viewer.cookies \
                      --header "Origin: $ORIGIN" \
                      --header 'Content-Type: application/json' \
                      --data "{\"email\":\"viewer@example.com\",\"password\":\"$PASSWORD\"}" \
                      "$ORIGIN/api/dashboard/auth/login")
                    test "$VIEWER_LOGIN" = "200"
                    python - <<'PY'
                    import json
                    data=json.load(open('/tmp/viewer-login.json'))
                    open('/tmp/viewer-csrf.txt','w').write(data['csrfToken'])
                    PY
                    VIEWER_CSRF=$(cat /tmp/viewer-csrf.txt)

                    VIEWER_GET=$(curl --silent --output /tmp/viewer-get.json --write-out '%{http_code}' \
                      --cookie /tmp/viewer.cookies \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$VIEWER_GET" = "200"

                    VIEWER_PUT=$(curl --silent --output /tmp/viewer-put.json --write-out '%{http_code}' \
                      --cookie /tmp/viewer.cookies \
                      --header "Origin: $ORIGIN" \
                      --header "X-CSRF-Token: $VIEWER_CSRF" \
                      --header 'Content-Type: application/json' \
                      --request PUT \
                      --data '{"name":"Viewer blocked"}' \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$VIEWER_PUT" = "403"
                    grep -q 'READ_ONLY_ROLE' /tmp/viewer-put.json

                    UNAUTH_STATUS=$(curl --silent --output /tmp/business-unauth.json --write-out '%{http_code}' \
                      "$ORIGIN/api/business/toca-do-morcego/profile")
                    test "$UNAUTH_STATUS" = "401"
                    grep -q 'AUTH_REQUIRED' /tmp/business-unauth.json
          EOF

          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write \
            apps/morro-digital-platform/package.json \
            apps/morro-digital-platform/tooling/auth-api.mjs \
            apps/morro-digital-platform/tooling/business-api.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            .github/workflows/business-auth-integration-contract.yml \
            pnpm-lock.yaml
          pnpm --filter @touristic/business test
          pnpm --filter @touristic/morro-digital-platform typecheck
      - name: Commit M50 wiring and remove helper
        run: |
          rm .github/workflows/m50-wire-protected-business-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/package.json \
            apps/morro-digital-platform/tooling/auth-api.mjs \
            apps/morro-digital-platform/tooling/business-api.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            .github/workflows/business-auth-integration-contract.yml \
            pnpm-lock.yaml \
            .github/workflows/m50-wire-protected-business-once.yml
          git commit -m "feat(business): wire protected Business HTTP boundary"
          git push origin HEAD:feat/business-m50-protected-http
