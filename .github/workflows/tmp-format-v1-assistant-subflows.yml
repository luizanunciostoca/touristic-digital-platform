name: Temporary Format V1 Assistant Subflows

on:
  push:
    branches:
      - fix/v1-assistant-category-subflows-20260915
    paths:
      - .github/workflows/tmp-format-v1-assistant-subflows.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1-assistant-category-subflows-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/map/explore-locations-control.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
            apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/map/explore-locations-control.ts \
                  apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts \
                  apps/morro-digital-platform/src/map/explore-locations-v1-flow.test.ts
          git commit -m 'style(assistant): format V1 category subflows'
          git push origin HEAD:fix/v1-assistant-category-subflows-20260915
