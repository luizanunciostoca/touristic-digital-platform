name: Voice Unsupported Fix Temp

on:
  push:
    branches:
      - fix/assistant-voice-unsupported-controls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-voice-unsupported-controls
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Make unsupported voice controls fail-safe by default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/morro-digital-platform/src/layouts/app-shell.ts')
          text = p.read_text()
          replacements = {
            '<input id="assistantVoiceEnabled" type="checkbox" />': '<input id="assistantVoiceEnabled" type="checkbox" disabled />',
            '<select id="assistantVoiceSelect" class="assistant-voice-selector"></select>': '<select id="assistantVoiceSelect" class="assistant-voice-selector" disabled></select>',
            '<input id="assistantVoiceSpeed" type="range" min="0.5" max="2" step="0.05" value="1" />': '<input id="assistantVoiceSpeed" type="range" min="0.5" max="2" step="0.05" value="1" disabled />',
            '<select id="assistantVoiceLanguage">': '<select id="assistantVoiceLanguage" disabled>',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing target: {old}')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/layouts/app-shell.ts
      - run: pnpm format:check
      - run: pnpm architecture:check
      - run: pnpm features:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/voice-unsupported-fix-temp.yml
          git add apps/morro-digital-platform/src/layouts/app-shell.ts
          git commit -m "fix(assistant): default unsupported voice controls to disabled"
          git push origin HEAD:fix/assistant-voice-unsupported-controls
