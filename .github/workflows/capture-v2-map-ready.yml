name: Capture V2 loading and map-ready states

on:
  push:
    branches:
      - feat/v1-app-shell-checkpoint
    paths:
      - .github/workflows/capture-v2-map-ready.yml
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/development/leaflet-compatibility-sdk.ts
      - apps/morro-digital-platform/src/weather/weather-widget.ts
      - apps/morro-digital-platform/public/index.html
      - apps/morro-digital-platform/public/styles.css
      - apps/morro-digital-platform/public/legacy/index-inline.css
      - apps/morro-digital-platform/tooling/dev-server.mjs

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Start V2
        run: |
          pnpm --filter @touristic/morro-digital-platform dev >/tmp/v2.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/dist/browser-entry.js >/dev/null
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/public/styles.css >/dev/null
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/public/legacy/checkpoint.css >/dev/null
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/public/legacy/index-inline.css >/dev/null
          curl -fsS http://127.0.0.1:4173/api/weather >/tmp/weather.json
          node -e "const fs=require('fs'); const w=JSON.parse(fs.readFileSync('/tmp/weather.json','utf8')); if(!Number.isFinite(w.temperatureCelsius)||!Number.isFinite(w.weatherCode)||typeof w.isDay!=='boolean') process.exit(1); console.log('weather endpoint', w);"
      - name: Capture loading and map ready
        run: |
          mkdir -p visual/v2
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              ['mobile', 390, 844],
              ['tablet', 768, 1024],
              ['desktop', 1440, 900],
            ];
            for (const [name, width, height] of cases) {
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const errors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') errors.push(`console: ${message.text()}`);
              });
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
              page.on('requestfailed', (request) => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));

              await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
              await page.evaluate(() => document.fonts.ready);
              const loading = await page.evaluate(() => {
                const overlay = document.getElementById('loading-overlay');
                const spinner = document.querySelector('.spinner');
                overlay?.classList.remove('fade-out');
                if (overlay instanceof HTMLElement) {
                  overlay.style.transition = 'none';
                  overlay.style.opacity = '1';
                  overlay.style.visibility = 'visible';
                }
                if (spinner instanceof HTMLElement) {
                  spinner.style.animation = 'none';
                  spinner.style.transform = 'none';
                }
                return {
                  exists: Boolean(overlay),
                  faded: overlay?.classList.contains('fade-out') ?? false,
                  text: overlay?.textContent?.trim() ?? '',
                  background: overlay ? getComputedStyle(overlay).backgroundColor : '',
                  zIndex: overlay ? getComputedStyle(overlay).zIndex : '',
                };
              });
              console.log(`${name} loading`, JSON.stringify(loading));
              if (!loading.exists || loading.faded || !loading.text.includes('Carregando Morro Digital') || loading.background !== 'rgb(0, 67, 179)' || loading.zIndex !== '10000') {
                throw new Error(`V2 loading state incomplete for ${name}: ${JSON.stringify(loading)}`);
              }
              await page.screenshot({ path: `visual/v2/loading-${name}.png`, fullPage: false });

              await page.evaluate(() => localStorage.setItem('morro-digital-onboarded', '1'));
              await page.reload({ waitUntil: 'domcontentloaded' });
              let weatherReady = false;
              for (let attempt = 0; attempt < 40; attempt += 1) {
                weatherReady = await page.evaluate(() => document.getElementById('weather-widget')?.getAttribute('data-weather-state') === 'ready');
                if (weatherReady) break;
                await page.waitForTimeout(250);
              }
              if (!weatherReady) {
                const weatherState = await page.evaluate(() => document.getElementById('weather-widget')?.getAttribute('data-weather-state') ?? 'missing');
                throw new Error(`Weather widget did not become ready for ${name}; final state=${weatherState}`);
              }
              await page.waitForTimeout(5000);
              const ready = await page.evaluate(() => {
                const weather = document.getElementById('weather-widget');
                const weatherTemp = weather?.querySelector('.weather-temp')?.textContent?.trim() ?? '';
                return {
                  appChildren: document.getElementById('app')?.children.length ?? 0,
                  mapExists: Boolean(document.getElementById('map')),
                  leafletContainer: document.getElementById('map')?.classList.contains('leaflet-container') ?? false,
                  assistantVisible: !document.getElementById('assistant-messages')?.classList.contains('hidden'),
                  optionCount: document.querySelectorAll('.assistant-option-btn').length,
                  weatherVisible: Boolean(weather),
                  weatherState: weather?.getAttribute('data-weather-state') ?? '',
                  weatherTemp,
                  globeVisible: Boolean(document.getElementById('toggle-globe-view')),
                };
              });
              console.log(`${name} map-ready`, JSON.stringify(ready));
              if (errors.length) console.log(name, errors.join('\n'));
              if (!ready.mapExists || !ready.leafletContainer || !ready.assistantVisible || ready.optionCount !== 10 || !ready.weatherVisible || ready.weatherState !== 'ready' || !/^\d+°C$/.test(ready.weatherTemp) || !ready.globeVisible) {
                throw new Error(`V2 V1 overlay state incomplete for ${name}: ${JSON.stringify(ready)}`);
              }
              await page.screenshot({ path: `visual/v2/map-ready-${name}.png`, fullPage: false });
              await context.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v2-loading-map-ready-screenshots
          path: visual/v2
          retention-days: 1
