name: Capture V2 map ready aligned

on:
  push:
    branches:
      - feat/v1-app-shell-checkpoint
    paths:
      - .github/workflows/capture-v2-map-ready.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Start V2
        run: |
          pnpm --filter @touristic/morro-digital-platform dev >/tmp/v2.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/dist/browser-entry.js >/dev/null
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/public/styles.css >/dev/null
          curl -fsS http://127.0.0.1:4173/apps/morro-digital-platform/public/legacy/checkpoint.css >/dev/null
      - name: Capture map ready
        run: |
          mkdir -p visual/v2
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              ['mobile', 390, 844],
              ['tablet', 768, 1024],
              ['desktop', 1440, 900],
            ];
            for (const [name, width, height] of cases) {
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const errors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') errors.push(`console: ${message.text()}`);
              });
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
              page.on('requestfailed', (request) => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));
              await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
              await page.evaluate(() => localStorage.setItem('morro-digital-onboarded', '1'));
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);
              const state = await page.evaluate(() => ({
                appChildren: document.getElementById('app')?.children.length ?? 0,
                mapExists: Boolean(document.getElementById('map')),
                mapProvider: document.getElementById('map')?.getAttribute('data-map-provider'),
                leafletContainer: document.getElementById('map')?.classList.contains('leaflet-container') ?? false,
                loadingOverlay: Boolean(document.getElementById('loading-overlay')),
                bodyText: document.body.innerText.slice(0, 500),
              }));
              console.log(name, JSON.stringify(state));
              if (errors.length) console.log(name, errors.join('\n'));
              if (!state.mapExists || state.appChildren === 0 || !state.leafletContainer) {
                throw new Error(`V2 Leaflet shell did not mount for ${name}: ${JSON.stringify(state)}`);
              }
              await page.screenshot({ path: `visual/v2/map-ready-${name}.png`, fullPage: false });
              await context.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v2-map-ready-screenshots
          path: visual/v2
          retention-days: 1
