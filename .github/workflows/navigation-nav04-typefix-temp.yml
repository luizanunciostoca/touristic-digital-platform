name: Fix NAV-04 Type Temp

on:
  push:
    branches:
      - feat/navigation-visual-stabilizer
    paths:
      - .github/workflows/navigation-nav04-typefix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-visual-stabilizer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact optional property fix
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/navigation/src/stabilizer.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('readonly usedRouteSnap?: boolean;', 'readonly usedRouteSnap: boolean;');
          const needle = '    speed: finiteNumber(location.speed),\n';
          if (!source.includes(needle)) throw new Error('normalizeLocation anchor not found');
          source = source.replace(needle, needle + '    usedRouteSnap: Boolean(location.usedRouteSnap),\n');
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write packages/navigation/src/stabilizer.ts
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/navigation/src/stabilizer.ts
          git commit -m "fix: normalize NAV-04 route snap state"
          git push origin HEAD:feat/navigation-visual-stabilizer
