name: Format Runtime M1

on:
  push:
    branches:
      - feat/platform-runtime-m1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-runtime-m1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Runtime M1 sources
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/src/bootstrap/geospatial.ts
          apps/morro-digital-platform/src/bootstrap/runtime.ts
          apps/morro-digital-platform/src/config/mapbox-runtime.ts
          apps/morro-digital-platform/src/development/mapbox-sdk.test.ts
          apps/morro-digital-platform/src/development/mapbox-sdk.ts
          apps/morro-digital-platform/tooling/dev-server.mjs
          packages/core/src/runtime.test.ts
          packages/core/src/runtime.ts

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/bootstrap/geospatial.ts \
            apps/morro-digital-platform/src/bootstrap/runtime.ts \
            apps/morro-digital-platform/src/config/mapbox-runtime.ts \
            apps/morro-digital-platform/src/development/mapbox-sdk.test.ts \
            apps/morro-digital-platform/src/development/mapbox-sdk.ts \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            packages/core/src/runtime.test.ts \
            packages/core/src/runtime.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format Runtime M1 sources"
            git push origin HEAD:feat/platform-runtime-m1
          fi
