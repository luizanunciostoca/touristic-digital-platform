name: Format Runtime M1

on:
  push:
    branches:
      - feat/platform-runtime-m1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-runtime-m1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Runtime M1 implementation
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform
          packages/core
          packages/geospatial
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform packages/core packages/geospatial
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format Runtime M1 implementation"
            git push origin HEAD:feat/platform-runtime-m1
          fi
