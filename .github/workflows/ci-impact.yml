name: CI Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      risk: ${{ steps.impact.outputs.risk }}
      domains: ${{ steps.impact.outputs.domains }}
      suites: ${{ steps.impact.outputs.suites }}
      needs_browser: ${{ steps.impact.outputs.needs_browser }}
      needs_visual: ${{ steps.impact.outputs.needs_visual }}
      needs_database: ${{ steps.impact.outputs.needs_database }}
      needs_dependency_audit: ${{ steps.impact.outputs.needs_dependency_audit }}
      needs_full_security: ${{ steps.impact.outputs.needs_full_security }}
      needs_full_regression: ${{ steps.impact.outputs.needs_full_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve impact base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze changed domains and risk
        id: impact
        run: node tooling/ci/impact-analyzer.mjs "${{ steps.base.outputs.sha }}" "$GITHUB_SHA" | tee ci-impact-report.json
      - name: Upload impact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-impact-${{ github.run_id }}
          path: ci-impact-report.json
          if-no-files-found: error
          retention-days: 30

  selective-core:
    needs: impact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality core
        run: |
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform test -- assistant-conversation-orchestrator assistant-contextual-state
      - name: Shadow-mode decision log
        run: |
          echo "risk=${{ needs.impact.outputs.risk }}"
          echo 'domains=${{ needs.impact.outputs.domains }}'
          echo 'selected suites=${{ needs.impact.outputs.suites }}'
          echo "full regression=${{ needs.impact.outputs.needs_full_regression }}"
