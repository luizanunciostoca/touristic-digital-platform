name: CI Impact Analysis

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      base_sha:
        value: ${{ jobs.impact.outputs.base_sha }}
      quality_profile:
        value: ${{ jobs.impact.outputs.quality_profile }}
      risk:
        value: ${{ jobs.impact.outputs.risk }}
      domains:
        value: ${{ jobs.impact.outputs.domains }}
      suites:
        value: ${{ jobs.impact.outputs.suites }}
      needs_browser:
        value: ${{ jobs.impact.outputs.needs_browser }}
      needs_visual:
        value: ${{ jobs.impact.outputs.needs_visual }}
      needs_database:
        value: ${{ jobs.impact.outputs.needs_database }}
      needs_dependency_audit:
        value: ${{ jobs.impact.outputs.needs_dependency_audit }}
      needs_full_security:
        value: ${{ jobs.impact.outputs.needs_full_security }}
      needs_full_regression:
        value: ${{ jobs.impact.outputs.needs_full_regression }}
      non_runtime:
        value: ${{ jobs.impact.outputs.non_runtime }}
      serialized_control_transition_only:
        value: ${{ jobs.impact.outputs.serialized_control_transition_only }}
      scheduled_suites:
        value: ${{ jobs.impact.outputs.scheduled_suites }}

permissions:
  contents: read

concurrency:
  group: ci-impact-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      quality_profile: ${{ steps.impact.outputs.quality_profile }}
      risk: ${{ steps.impact.outputs.risk }}
      domains: ${{ steps.impact.outputs.domains }}
      suites: ${{ steps.impact.outputs.suites }}
      needs_browser: ${{ steps.impact.outputs.needs_browser }}
      needs_visual: ${{ steps.impact.outputs.needs_visual }}
      needs_database: ${{ steps.impact.outputs.needs_database }}
      needs_dependency_audit: ${{ steps.impact.outputs.needs_dependency_audit }}
      needs_full_security: ${{ steps.impact.outputs.needs_full_security }}
      needs_full_regression: ${{ steps.impact.outputs.needs_full_regression }}
      non_runtime: ${{ steps.impact.outputs.non_runtime }}
      serialized_control_transition_only: ${{ steps.impact.outputs.serialized_control_transition_only }}
      scheduled_suites: ${{ steps.schedule.outputs.scheduled_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve impact base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git merge-base refs/remotes/origin/main HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze changed domains and risk
        id: impact
        shell: bash
        env:
          CI_RELEASE_CANDIDATE: ${{ startsWith(github.ref, 'refs/tags/rc/') }}
        run: node tooling/ci/impact-analyzer.mjs "${{ steps.base.outputs.sha }}" "$GITHUB_SHA" | tee ci-impact-report.json
      - name: Select centrally managed suites
        id: schedule
        shell: bash
        run: node tooling/ci/suite-scheduler.mjs ci-impact-report.json | tee ci-suite-plan.json
      - name: Upload impact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-impact-${{ github.run_id }}
          path: |
            ci-impact-report.json
            ci-suite-plan.json
          if-no-files-found: error
          retention-days: 30
