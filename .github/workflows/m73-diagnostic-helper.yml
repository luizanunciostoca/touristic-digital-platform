name: M73 diagnostic helper

on:
  push:
    branches:
      - feat/crm-m73-platform-auth-composition
    paths:
      - ".github/workflows/m73-diagnostic-helper.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m73-platform-auth-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Improve API failure observability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dev = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = dev.read_text()
          old = '''  } catch {\n    response.statusCode = 404;\n    response.setHeader("Content-Type", "text/plain; charset=utf-8");\n    response.end("Recurso não encontrado.");\n  }\n});\n'''
          new = '''  } catch (error) {\n    if (String(request.url || "").startsWith("/api/")) {\n      console.error(\n        "API runtime failure.",\n        error instanceof Error ? error.stack || error.message : error,\n      );\n      response.statusCode = 500;\n      response.setHeader("Content-Type", "application/json; charset=utf-8");\n      response.setHeader("Cache-Control", "no-store");\n      response.end(JSON.stringify({ error: "INTERNAL_SERVER_ERROR" }));\n      return;\n    }\n    response.statusCode = 404;\n    response.setHeader("Content-Type", "text/plain; charset=utf-8");\n    response.end("Recurso não encontrado.");\n  }\n});\n'''
          if old not in text:
            raise SystemExit('dev-server catch anchor not found')
          dev.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write apps/morro-digital-platform/tooling/dev-server.mjs
      - name: Validate changed surface
        run: |
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/crm-server test
          pnpm -w build
      - name: Commit permanent change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/dev-server.mjs
          git commit -m "fix(crm): expose API runtime failures safely"
          git push origin HEAD:feat/crm-m73-platform-auth-composition
