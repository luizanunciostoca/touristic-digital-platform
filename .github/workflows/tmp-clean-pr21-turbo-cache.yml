name: One-shot clean PR21 generated Turbo cache

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove generated cache and self
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .turbo/cache
          rm -f .github/workflows/tmp-clean-pr21-turbo-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove generated Turbo cache from payment fix"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
