name: Validate Runtime M1

on:
  push:
    branches:
      - feat/platform-runtime-m1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-runtime-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Validate Feature Registry
        run: pnpm features:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
