name: Assistant Voice Unsupported Fix Once

on:
  push:
    branches:
      - test/assistant-voice-browser-pass
    paths:
      - .github/workflows/assistant-voice-unsupported-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Harden unsupported Web Speech simulation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs')
          text = path.read_text()
          start_marker = '''  await context.addInitScript(() => {\n    localStorage.setItem("morro-digital-onboarded", "1");\n    Object.defineProperty(globalThis, "speechSynthesis", {'''
          start = text.index(start_marker, text.index('async function runUnsupportedContract'))
          end_marker = '''  });\n  const page = await context.newPage();'''
          end = text.index(end_marker, start)
          replacement = '''  await context.addInitScript(() => {\n    localStorage.setItem("morro-digital-onboarded", "1");\n\n    const hideCapability = (target, property) => {\n      try {\n        Object.defineProperty(target, property, {\n          configurable: true,\n          get: () => undefined,\n        });\n      } catch {\n        try {\n          target[property] = undefined;\n        } catch {\n          // Best-effort override for browser-native capability detection.\n        }\n      }\n    };\n\n    for (const property of [\n      "speechSynthesis",\n      "SpeechSynthesisUtterance",\n      "SpeechRecognition",\n      "webkitSpeechRecognition",\n    ]) {\n      hideCapability(globalThis, property);\n      hideCapability(Window.prototype, property);\n    }\n  });\n  const page = await context.newPage();'''
          text = text[:start] + replacement + text[end + len(end_marker):]
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/assistant-voice-unsupported-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs .github/workflows/assistant-voice-unsupported-fix-once.yml
          git commit -m "fix(assistant): harden unsupported voice browser simulation"
          git push origin HEAD:test/assistant-voice-browser-pass
