name: M60 Finalize Contracts Once
on:
  push:
    branches: [feat/business-m60-partner-workspace]
    paths: [.github/workflows/m60-finalize-contracts-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m60-partner-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refactor promotion defaults and update permanent import maps
        run: |
          python <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          sf='apps/morro-digital-platform/src/business-onboarding-surface.ts'
          rep(sf,
              'import { validateBusinessOnboardingStepInput } from "@touristic/business/onboarding-steps";\n',
              'import { validateBusinessOnboardingStepInput } from "@touristic/business/onboarding-steps";\nimport { getBusinessTutorialPromotionDefaults } from "@touristic/business/onboarding-workspace";\n')
          start='''    const defaults: Record<string, readonly [string, string, string]> = {\n      restaurant: [\n        "Oferta especial de hoje",\n        "Condição exclusiva para quem encontrou a empresa pelo Morro Digital.",\n        "Ver oferta",\n      ],\n      lodging: [\n        "Benefício na reserva",\n        "Consulte uma condição especial para sua hospedagem.",\n        "Consultar",\n      ],\n      tour: [\n        "Condição especial no passeio",\n        "Garanta uma vantagem ao reservar pelo Morro Digital.",\n        "Reservar",\n      ],\n      events: [\n        "Ingresso ou benefício especial",\n        "Confira a condição disponível para este evento.",\n        "Ver evento",\n      ],\n    };\n    const [defaultTitle, defaultDescription, defaultCta] = defaults[\n      stringValue(context.category)\n    ] ?? [\n      "Oferta especial",\n      "Confira uma condição exclusiva disponível agora.",\n      "Ver oferta",\n    ];'''
          end='''    const { title: defaultTitle, description: defaultDescription, cta: defaultCta } =\n      getBusinessTutorialPromotionDefaults(context.category);'''
          rep(sf,start,end)

          for wf in [
            '.github/workflows/business-onboarding-route-browser-contract.yml',
            '.github/workflows/business-onboarding-profile-browser-contract.yml',
          ]:
              p=Path(wf); s=p.read_text()
              marker="                  '@touristic/business/onboarding-recommendation': '/packages/business/dist/onboarding-recommendation.js',\n"
              addition=marker+"                  '@touristic/business/onboarding-workspace': '/packages/business/dist/onboarding-workspace.js',\n"
              if '@touristic/business/onboarding-workspace' not in s:
                  if marker not in s: raise SystemExit(f'import-map marker missing in {wf}')
                  s=s.replace(marker,addition,1)
                  p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-surface.ts .github/workflows/business-onboarding-route-browser-contract.yml .github/workflows/business-onboarding-profile-browser-contract.yml packages/business/src/onboarding-context.test.ts
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Commit permanent refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/business-onboarding-surface.ts .github/workflows/business-onboarding-route-browser-contract.yml .github/workflows/business-onboarding-profile-browser-contract.yml packages/business/src/onboarding-context.test.ts
          git commit -m "test(business): finalize M60 module boundaries"
          git push origin HEAD:feat/business-m60-partner-workspace
