name: Assistant Voice Format Once

on:
  push:
    branches:
      - test/assistant-voice-browser-pass
    paths:
      - .github/workflows/assistant-voice-format-once.yml
      - apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/assistant-voice-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs .github/workflows/assistant-voice-format-once.yml
          git commit -m "style(assistant): format voice browser contract"
          git push origin HEAD:test/assistant-voice-browser-pass
