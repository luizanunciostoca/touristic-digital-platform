name: Temporary Explore Live Locale Finalizer

on:
  push:
    paths:
      - .github/workflows/tmp-explore-live-locale-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/explore-v1-i18n-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply live locale refresh fix
        run: python tooling/tmp-explore-live-locale-fix.py
      - name: Format source
        run: pnpm exec prettier --write apps/morro-digital-platform/src/map/explore-locations-control.ts
      - name: Validate source
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check apps/morro-digital-platform/src/map/explore-locations-control.ts
          git diff --check
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/morro-digital-platform/src/map/explore-locations-control.ts
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'fix(explore): refresh localization during active sessions'
          git push origin HEAD:fix/explore-v1-i18n-parity
