name: Render Staging Blueprint Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - render.staging.yaml
      - docs/deployment/RENDER-STAGING-V2.md
      - tooling/render/mysql-staging/**
      - tooling/render/with-staging-mysql-env.mjs
      - tooling/render/with-staging-mysql-env.test.mjs
      - tooling/render/payments-provider-acceptance-runner.mjs
      - tooling/render/payments-provider-acceptance-runner.test.mjs
      - tooling/quality/check-render-staging-blueprint.mjs
      - package.json
      - .github/workflows/render-staging-blueprint-contract.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply dedicated subscription application credential split
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          from pathlib import Path

          runner_paths = [
              Path('tooling/render/payments-provider-acceptance-runner.mjs'),
              Path('tooling/render/payments-provider-acceptance-runner.test.mjs'),
          ]
          for path in runner_paths:
              text = path.read_text()
              old = 'VITE_MERCADO_PAGO_PUBLIC_KEY'
              if old not in text:
                  raise SystemExit(f'{path}: expected public-key marker missing')
              path.write_text(text.replace(old, 'MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY'))

          blueprint = Path('render.staging.yaml')
          text = blueprint.read_text()
          access_marker = '      - key: MERCADO_PAGO_ACCESS_TOKEN\n        sync: false\n'
          access_insert = access_marker + '      - key: MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN\n        sync: false\n'
          if 'MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN' not in text:
              if access_marker not in text:
                  raise SystemExit('render.staging.yaml: access-token marker missing')
              text = text.replace(access_marker, access_insert, 1)
          public_marker = '      - key: VITE_MERCADO_PAGO_PUBLIC_KEY\n        sync: false\n'
          public_insert = public_marker + '      - key: MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY\n        sync: false\n'
          if 'MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY' not in text:
              if public_marker not in text:
                  raise SystemExit('render.staging.yaml: public-key marker missing')
              text = text.replace(public_marker, public_insert, 1)
          blueprint.write_text(text)

          runbook = Path('docs/deployment/RENDER-STAGING-V2.md')
          text = runbook.read_text()
          old_access = '- `MERCADO_PAGO_ACCESS_TOKEN`: Access Token exibido em **Testes > Credenciais de teste** da aplicação aprovada;\n'
          new_access = old_access + '- `MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN`: Access Token exibido em **Testes > Credenciais de teste** da aplicação específica de Assinaturas; nunca reutilize aqui o token do Checkout Bricks;\n'
          if 'MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN' not in text:
              if old_access not in text:
                  raise SystemExit('runbook: access-token marker missing')
              text = text.replace(old_access, new_access, 1)
          old_public = '- `VITE_MERCADO_PAGO_PUBLIC_KEY`: Public Key das **credenciais de teste** da mesma aplicação. Ela é browser-visible por definição, mas deve continuar separada do Access Token e do webhook secret.\n'
          new_public = old_public + '- `MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY`: Public Key TEST da aplicação específica de Assinaturas, usada somente para tokenizar o cartão no acceptance de `/preapproval`; não substitui a Public Key do Bricks.\n'
          if 'MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY' not in text:
              if old_public not in text:
                  raise SystemExit('runbook: public-key marker missing')
              text = text.replace(old_public, new_public, 1)
          old_para = 'O Card Payment Brick recebe somente `VITE_MERCADO_PAGO_PUBLIC_KEY`. Access Token, webhook secret, amount, currency e recurrence permanecem autoridade server-side. O runtime de subscriptions só inicia quando `PAYMENTS_SUBSCRIPTIONS_ENABLED=true` e exige `PAYMENTS_SUBSCRIPTION_BACK_URL` HTTPS válido.\n'
          new_para = 'O Card Payment Brick recebe somente `VITE_MERCADO_PAGO_PUBLIC_KEY`. O adapter de Subscriptions exige separadamente `MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN`, e o acceptance runner tokeniza o cartão TEST com `MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY`. Não existe fallback silencioso das credenciais de Assinaturas para as credenciais do Bricks. Access Token, webhook secret, amount, currency e recurrence permanecem autoridade server-side. O runtime de subscriptions só inicia quando `PAYMENTS_SUBSCRIPTIONS_ENABLED=true` e exige `PAYMENTS_SUBSCRIPTION_BACK_URL` HTTPS válido.\n'
          if old_para in text:
              text = text.replace(old_para, new_para, 1)
          runbook.write_text(text)
          PY
          pnpm exec prettier --write \
            tooling/render/payments-provider-acceptance-runner.mjs \
            tooling/render/payments-provider-acceptance-runner.test.mjs \
            render.staging.yaml \
            docs/deployment/RENDER-STAGING-V2.md
          git diff --check
          if git diff --quiet -- \
            tooling/render/payments-provider-acceptance-runner.mjs \
            tooling/render/payments-provider-acceptance-runner.test.mjs \
            render.staging.yaml \
            docs/deployment/RENDER-STAGING-V2.md; then
            echo 'SUBSCRIPTIONS_APP_CREDENTIAL_SPLIT=already_applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tooling/render/payments-provider-acceptance-runner.mjs \
            tooling/render/payments-provider-acceptance-runner.test.mjs \
            render.staging.yaml \
            docs/deployment/RENDER-STAGING-V2.md
          git commit -m 'fix(payments): separate subscription application credentials'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Validate staging Blueprint invariants
        run: node tooling/quality/check-render-staging-blueprint.mjs
      - name: Validate staging MySQL URL derivation
        run: node --test tooling/render/with-staging-mysql-env.test.mjs
      - name: Validate staging provider acceptance runner
        run: node --test tooling/render/payments-provider-acceptance-runner.test.mjs
      - name: Validate MySQL init shell syntax
        run: sh -n tooling/render/mysql-staging/01-init-databases.sh
      - name: Reject committed secret-like staging values
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(sk_live_|sk_test_|APP_USR-[A-Za-z0-9_-]{16,}|pk\.[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' \
            render.staging.yaml docs/deployment/RENDER-STAGING-V2.md tooling/render/mysql-staging/*; then
            echo 'Potential provider secret/token was committed in staging IaC.' >&2
            exit 1
          fi
