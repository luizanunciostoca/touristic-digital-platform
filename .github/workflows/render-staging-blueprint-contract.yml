name: Render Staging Blueprint Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - render.staging.yaml
      - docs/deployment/RENDER-STAGING-V2.md
      - tooling/render/mysql-staging/**
      - tooling/render/with-staging-mysql-env.mjs
      - tooling/render/with-staging-mysql-env.test.mjs
      - tooling/render/payments-provider-acceptance-runner.mjs
      - tooling/render/payments-provider-acceptance-runner.test.mjs
      - tooling/quality/check-render-staging-blueprint.mjs
      - package.json
      - .github/workflows/render-staging-blueprint-contract.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply canonical formatting to subscription credential isolation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            services/financial/src/mercado-pago-subscription-credentials-provider.ts \
            services/financial/src/mercado-pago-subscription-credentials-provider.test.ts
          if git diff --quiet -- \
            services/financial/src/mercado-pago-subscription-credentials-provider.ts \
            services/financial/src/mercado-pago-subscription-credentials-provider.test.ts; then
            echo 'SUBSCRIPTION_CREDENTIAL_FORMAT=already_canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/financial/src/mercado-pago-subscription-credentials-provider.ts \
            services/financial/src/mercado-pago-subscription-credentials-provider.test.ts
          git commit -m 'style(payments): apply canonical subscription credential formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Validate staging Blueprint invariants
        run: node tooling/quality/check-render-staging-blueprint.mjs
      - name: Validate staging MySQL URL derivation
        run: node --test tooling/render/with-staging-mysql-env.test.mjs
      - name: Validate staging provider acceptance runner
        run: node --test tooling/render/payments-provider-acceptance-runner.test.mjs
      - name: Validate MySQL init shell syntax
        run: sh -n tooling/render/mysql-staging/01-init-databases.sh
      - name: Reject committed secret-like staging values
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(sk_live_|sk_test_|APP_USR-[A-Za-z0-9_-]{16,}|pk\.[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' \
            render.staging.yaml docs/deployment/RENDER-STAGING-V2.md tooling/render/mysql-staging/*; then
            echo 'Potential provider secret/token was committed in staging IaC.' >&2
            exit 1
          fi
