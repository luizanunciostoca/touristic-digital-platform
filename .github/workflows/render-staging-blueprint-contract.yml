name: Render Staging Blueprint Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - render.staging.yaml
      - docs/deployment/RENDER-STAGING-V2.md
      - tooling/render/mysql-staging/**
      - tooling/render/with-staging-mysql-env.mjs
      - tooling/render/with-staging-mysql-env.test.mjs
      - tooling/render/payments-provider-acceptance-runner.mjs
      - tooling/render/payments-provider-acceptance-runner.test.mjs
      - tooling/quality/check-render-staging-blueprint.mjs
      - package.json
      - .github/workflows/render-staging-blueprint-contract.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/mercado-pago-bricks-subscriptions-20260823
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Align authorized-subscription TEST payer
        shell: bash
        run: |
          set -euo pipefail
          runner='tooling/render/payments-provider-acceptance-runner.mjs'
          wrapper='tooling/render/with-staging-mysql-env.mjs'
          test "$(grep -o 'test@testuser.com' "$runner" | wc -l)" -eq 1
          test "$(grep -o 'test@testuser.com' "$wrapper" | wc -l)" -eq 1
          sed -i 's/test@testuser.com/test_payer@testuser.com/g' "$runner" "$wrapper"
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write "$runner" "$wrapper"
          node --test tooling/render/with-staging-mysql-env.test.mjs
          node --test tooling/render/payments-provider-acceptance-runner.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$runner" "$wrapper"
          git commit -m 'fix(payments): align authorized subscription test payer'
          git push origin HEAD:fix/mercado-pago-bricks-subscriptions-20260823
