name: Chat7 Notifications Prettier Diagnostic

on:
  push:
    branches:
      - diag/chat7-notifications-prettier
  pull_request:
    branches:
      - wave/chat7-notifications-foundation

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print exact output
        run: |
          pnpm exec prettier packages/notifications/src/index.ts --write
          echo '===PRETTIER_FILE_BEGIN==='
          cat packages/notifications/src/index.ts
          echo '===PRETTIER_FILE_END==='
