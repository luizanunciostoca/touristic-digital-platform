name: Temporary PR75 Review Format Fix

on:
  push:
    paths:
      - .github/workflows/tmp-pr75-review-format-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/explore-v1-i18n-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fix
        run: python tooling/tmp-pr75-review-format-fix.py
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router-runtime-action.test.ts
      - name: Validate candidate
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router-runtime-action.test.ts
          git diff --check
      - name: Commit validated non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts \
            apps/morro-digital-platform/src/assistant/assistant-menu-command-router-runtime-action.test.ts
          git diff --cached --check
          git commit -m "fix(explore): route Hebrew V1 back-menu aliases"
          git push origin HEAD:fix/explore-v1-i18n-parity
