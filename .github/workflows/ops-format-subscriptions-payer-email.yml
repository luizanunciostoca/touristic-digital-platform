name: Ops Format Subscription Payer Acceptance

on:
  push:
    branches:
      - ops/format-subscriptions-payer-email-20260826

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ops branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/format-subscriptions-payer-email-20260826
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          tooling/render/payments-provider-acceptance-runner.mjs
          tooling/render/payments-provider-acceptance-runner.test.mjs
          tooling/render/with-staging-mysql-env.mjs
          tooling/render/with-staging-mysql-env.test.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tooling/render/payments-provider-acceptance-runner.mjs \
            tooling/render/payments-provider-acceptance-runner.test.mjs \
            tooling/render/with-staging-mysql-env.mjs \
            tooling/render/with-staging-mysql-env.test.mjs
          git commit -m "style(payments): apply canonical Prettier"
          git push origin HEAD:ops/format-subscriptions-payer-email-20260826
