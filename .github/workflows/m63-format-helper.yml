name: M63 format helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/business-m63-production-profile-view
    paths:
      - ".github/workflows/m63-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m63-production-profile-view
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M63 TypeScript
        run: pnpm exec prettier --write apps/morro-digital-platform/src/business-dashboard-surface.ts apps/morro-digital-platform/src/business-profile-view.ts
      - name: Commit formatted files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/business-dashboard-surface.ts apps/morro-digital-platform/src/business-profile-view.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(business): format M63 profile view"
          git push origin HEAD:feat/business-m63-production-profile-view
