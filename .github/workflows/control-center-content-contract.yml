name: Control Center Content Contract

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/control-center-content-contract.yml"
      - ".github/workflows/quality.yml"
      - ".env.example"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/content-admin-runtime.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/content/**"
      - "packages/auth/**"
      - "services/content/**"
      - "services/auth/**"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/control-center-content-contract.yml"
      - ".github/workflows/quality.yml"
      - ".env.example"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/package.json"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/content-admin-runtime.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/content/**"
      - "packages/auth/**"
      - "services/content/**"
      - "services/auth/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: control-center-content-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-owner-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: control_center_content_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CONTENT_DATABASE_URL: mysql://root@127.0.0.1:3306/control_center_content_contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Content owner boundaries
        run: |
          pnpm --filter @touristic/content build
          pnpm --filter @touristic/content-server build
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/auth-server build
      - name: Validate Content Node runtime exports
        run: |
          pnpm --filter @touristic/morro-digital-platform exec node --input-type=module -e "const m = await import('@touristic/content-server'); if (typeof m.applyContentM156Schema !== 'function' || typeof m.MySqlPlaceMediaRepository !== 'function') process.exit(1)"

      - name: Validate Control Center orchestration
        run: |
          pnpm --filter @touristic/morro-digital-platform exec vitest run \
            tooling/admin-api.test.mjs \
            tooling/admin-domain-adapters.test.mjs
      - name: Validate durable Content owner contract
        run: pnpm --filter @touristic/content-server test:integration

  content-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: control_center_content_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build Control Center Content runtime graph
        run: pnpm -w build
      - name: Start authenticated Control Center with Content owner runtime
        shell: bash
        run: |
          set -euo pipefail
          PORT=4198
          DB_URL="mysql://root@127.0.0.1:3306/control_center_content_browser"
          PASSWORD="control center content browser fixture"
          AUTH_SECRET=$(printf 'd%.0s' {1..64})
          SUPPORT_SECRET=$(printf 'e%.0s' {1..64})
          STEP_UP_SECRET=$(printf 'f%.0s' {1..64})
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 43))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([
            {id:"platform-owner-content",email:"platform-owner-content@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}
          ]))' "$OWNER_HASH")
          env \
            NODE_ENV=development \
            DASHBOARD_AUTH_SECRET="$AUTH_SECRET" \
            DASHBOARD_USERS_JSON="$USERS" \
            CONTROL_CENTER_SUPPORT_SECRET="$SUPPORT_SECRET" \
            CONTROL_CENTER_STEP_UP_SECRET="$STEP_UP_SECRET" \
            CONTROL_CENTER_AUDIT_DATABASE_URL="$DB_URL" \
            CONTENT_DATABASE_URL="$DB_URL" \
            CRM_DATABASE_URL="$DB_URL" \
            PORT="$PORT" \
            HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs \
              >/tmp/control-center-content-server.log 2>&1 &
          echo $! >/tmp/control-center-content-server.pid
          for _ in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/apps/control-center/public/index.html" >/dev/null; then
              exit 0
            fi
            sleep .25
          done
          cat /tmp/control-center-content-server.log
          exit 1
      - name: Validate Content journeys in Chromium
        shell: bash
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { chromium } = require("/tmp/pw/node_modules/playwright");

          const origin = "http://127.0.0.1:4198";
          const password = "control center content browser fixture";

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = { errors: [], journeys: [] };
            try {
              const context = await browser.newContext({
                viewport: { width: 1280, height: 900 },
              });
              const page = await context.newPage();
              page.on("pageerror", (error) => evidence.errors.push(error.message));

              await page.goto(`${origin}/apps/control-center/public/index.html`, {
                waitUntil: "domcontentloaded",
                timeout: 30000,
              });
              await page.waitForURL(
                (url) => url.pathname === "/dashboard/login.html",
                { timeout: 10000 },
              );
              await page.locator("#email").fill("platform-owner-content@example.com");
              await page.locator("#password").fill(password);
              await page.locator("#submit").click();
              await page.waitForURL(
                (url) => url.pathname === "/apps/control-center/public/index.html",
                { timeout: 15000 },
              );
              await page.locator("#app:not([hidden])").waitFor({ state: "visible" });
              await page
                .locator("#content[data-rendered-view]")
                .waitFor({ state: "attached", timeout: 15000 });

              const adminSession = await page.evaluate(async () => {
                const response = await fetch("/api/admin/v1/session", {
                  credentials: "same-origin",
                  headers: { Accept: "application/json" },
                });
                return { status: response.status, body: await response.json() };
              });
              if (
                adminSession.status !== 200 ||
                !adminSession.body?.actor?.capabilities?.includes("content.manage")
              ) {
                throw new Error(
                  `Content admin session missing content.manage: ${JSON.stringify(adminSession)}`,
                );
              }

              await page.evaluate(() => {
                window.location.hash = "#content";
              });
              await page
                .locator('#content[data-rendered-view="content"]')
                .waitFor({ state: "attached", timeout: 15000 });
              const createForm = page.locator("#content-create-id");
              if ((await createForm.count()) === 0) {
                const view = await page.locator("#content").innerText();
                throw new Error(`Content create form missing after render: ${view}`);
              }
              await createForm.fill("content-browser-0001");
              await page.locator("#content-create-title").fill("Segunda Praia");
              await page
                .locator("#content-create-summary")
                .fill("Conteúdo criado pelo contrato browser.");
              await page
                .locator("#content-create-reason")
                .fill("Criar conteúdo para prova browser governada");
              await page.getByRole("button", { name: "Criar rascunho" }).click();

              await page.waitForURL(
                (url) => url.hash === "#content:content-browser-0001",
                { timeout: 15000 },
              );
              await page.getByText("Segunda Praia", { exact: true }).waitFor();
              evidence.journeys.push("content-create-owner");

              await page
                .locator("#content-revise-title")
                .fill("Segunda Praia revisada");
              await page
                .locator("#content-revise-reason")
                .fill("Revisar conteúdo após validação editorial");
              await page.getByRole("button", { name: "Salvar revisão" }).click();
              await page
                .getByText("Segunda Praia revisada", { exact: true })
                .waitFor();
              evidence.journeys.push("content-revise-owner");

              await page.locator("#content-transition-status").selectOption("preview");
              await page
                .locator("#content-transition-reason")
                .fill("Mover conteúdo revisado para preview");
              await page.getByRole("button", { name: "Aplicar transição" }).click();
              await page.getByText("preview", { exact: true }).first().waitFor();
              evidence.journeys.push("content-lifecycle-owner");

              await page.locator("#global-search").fill("Segunda Praia revisada");
              await page
                .locator("#search-results")
                .getByText("Segunda Praia revisada", { exact: true })
                .waitFor({ timeout: 10000 });
              evidence.journeys.push("content-universal-search");

              const audit = await page.evaluate(async () => {
                const response = await fetch("/api/admin/v1/audit?limit=20", {
                  credentials: "same-origin",
                  headers: { Accept: "application/json" },
                });
                return response.json();
              });
              const completed = audit.entries.filter(
                (entry) => entry.action === "control-center.content.mutation.complete",
              );
              if (
                completed.length < 3 ||
                !completed.some(
                  (entry) =>
                    entry.reason === "Mover conteúdo revisado para preview" &&
                    entry.previousState?.status === "draft" &&
                    entry.newState?.status === "preview",
                )
              ) {
                throw new Error(`Content audit evidence diverged: ${JSON.stringify(completed)}`);
              }
              evidence.journeys.push("content-immutable-audit-context");

              if (evidence.errors.length) {
                throw new Error(`Browser page errors: ${JSON.stringify(evidence.errors)}`);
              }
              evidence.status = "PASS";
              writeFileSync(
                "/tmp/control-center-content-browser-evidence.json",
                JSON.stringify(evidence, null, 2),
              );
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show Content diagnostics
        if: failure()
        run: cat /tmp/control-center-content-server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-center-content-browser-evidence
          path: /tmp/control-center-content-browser-evidence.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Stop Content Control Center runtime
        if: always()
        run: kill "$(cat /tmp/control-center-content-server.pid)" 2>/dev/null || true
