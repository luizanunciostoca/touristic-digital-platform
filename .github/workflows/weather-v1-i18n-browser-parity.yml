name: Weather V1 I18n Browser Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/weather-v1-i18n-browser-parity.yml
      - apps/morro-digital-platform/src/weather/weather-i18n.ts
      - apps/morro-digital-platform/src/weather/weather-i18n.test.ts
      - apps/morro-digital-platform/src/weather/weather-widget.ts
      - apps/morro-digital-platform/src/weather/weather-widget.test.ts
      - apps/morro-digital-platform/src/weather/weather-forecast-modal.ts
      - apps/morro-digital-platform/tooling/weather-v1-i18n-browser-parity.mjs
      - apps/morro-digital-platform/src/config/tour-localization.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  weather-v1-i18n:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit coverage
        run: pnpm --filter @touristic/morro-digital-platform test -- weather-i18n.test.ts weather-widget.test.ts
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/weather-v1-i18n
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/weather-v1-i18n/server.log 2>&1 &
          echo $! >/tmp/weather-v1-i18n/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weather-v1-i18n/server.log
          exit 1
      - name: Verify PT EN ES HE weather presentation parity
        run: node apps/morro-digital-platform/tooling/weather-v1-i18n-browser-parity.mjs
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/weather-v1-i18n/server.log || true
