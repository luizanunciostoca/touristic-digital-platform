name: M33 Matrix V2 Once

on:
  push:
    branches:
      - feat/assistant-m33-ui-lifecycle-parity

permissions:
  contents: write

jobs:
  matrix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m33-ui-lifecycle-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply and format M33 evidence
        run: |
          python tooling/m33-matrix-once.py
          pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
      - name: Commit matrix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m33-matrix-v2-once.yml tooling/m33-matrix-once.py
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          git commit -m "docs(assistant): record M33 DOM lifecycle evidence"
          git push origin HEAD:feat/assistant-m33-ui-lifecycle-parity
