name: M25 Lint Finalize

on:
  push:
    branches:
      - feat/assistant-m25-photos

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m25-photos
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @touristic/morro-digital-platform exec eslint src/assistant/assistant-domain-adapter.test.ts --fix
          pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-domain-adapter.test.ts
          rm .github/workflows/m25-lint-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(assistant): remove unnecessary photo test assertion"
          git push
