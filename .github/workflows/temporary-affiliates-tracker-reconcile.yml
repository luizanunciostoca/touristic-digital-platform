name: Temporary Affiliates Tracker Reconcile

on:
  push:
    branches:
      - docs/affiliates-equivalence-finalization-20260824

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/affiliates-equivalence-finalization-20260824
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile MIG-0011 only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/migration/MASTER-MIGRATION-TRACKER.md';
          let text = fs.readFileSync(path, 'utf8');
          const oldRow = '| MIG-0011 | afiliados | Affiliates | FEATURE-0010 | `packages/affiliates` + `services/affiliates` | 9 | migrating | runtime durável, schema/repositories/transações/materialization/API autenticada estão em `main` | 15 PASS / 10 PARTIAL / 0 GAP / 2 N/A; Affiliates 4/4 na matriz MySQL e permanent `Affiliates FEATURE-0010 Contract` PASS no candidate tree; retenção/DSR e demais acceptance PARTIAL permanecem | `AFFILIATES-MIGRATION-MATRIX.md`; MySQL 339/339; permanent Affiliates contract; `AFFILIATES-ROLLOUT-ROLLBACK.md` | crítico |';
          const newRow = '| MIG-0011 | afiliados | Affiliates | FEATURE-0010 | `packages/affiliates` + `services/affiliates` | 9 | equivalent | N/A deliberado: a feature é server-authoritative e não exige superfície browser/admin autoritativa; qualquer UI futura permanece apresentação/input somente | 25 PASS / 0 PARTIAL / 0 GAP / 2 N/A; Identity/Suspension, Privacy/LGPD, Attribution, Conversion/Commission/Refund, replay, concorrência e Affiliate → Financial readback estão aceitos | `AFFILIATES-MIGRATION-MATRIX.md`; Quality #242; Affiliates Contract #102; Render Staging Blueprint #66; MySQL integrado; tree `f1ef9038de983a69737c94a2d218eec57e179efb` | crítico |';
          if (!text.includes(oldRow)) {
            throw new Error('MIG-0011 canonical old row not found');
          }
          text = text.replace(oldRow, newRow);

          const anchor = '## Auth equivalente — MIG-0009\n\nM66 closes the four consumer-dependent Auth parity rows intentionally left partial in M48. The canonical matrix is `20 PASS / 0 PARTIAL / 0 GAP / 0 N/A`. The feature is `equivalent`, not `released`. Permanent evidence includes the Auth Integration Contract, Auth Login Browser Contract and Business dashboard/security regressions on PR #129.\n';
          if (!text.includes(anchor)) {
            throw new Error('Auth section anchor not found');
          }
          const section = `\n## Affiliates equivalente — MIG-0011\n\nA Wave 9 foi concluída sobre o runtime integrado de Privacy/LGPD, Identity/Eligibility/Suspension, Attribution e Commercial. O checkpoint executável imediatamente anterior a esta reconciliação documental é:\n\n\`\`\`text\nmain = a2a1f10420c1d452e9426c75549864c76d57f22c\ncertified PR head = 851740d2429c41d18f81f0e476fc2fb67a6a0c3b\ncertified tree = f1ef9038de983a69737c94a2d218eec57e179efb\nmain tree = f1ef9038de983a69737c94a2d218eec57e179efb\nQuality Gate #242 = PASS\nAffiliates FEATURE-0010 Contract #102 = PASS\nRender Staging Blueprint Contract #66 = PASS\n\`\`\`\n\nA árvore certificada e a árvore integrada em \`main\` são idênticas. A matriz canônica final é:\n\n\`\`\`text\nPASS       25\nPARTIAL     0\nGAP         0\nN/A         2\nTOTAL      27\n\`\`\`\n\nOs dois N/A são deliberados: browser/admin não é requisito para a feature server-authoritative e nunca pode virar autoridade monetária; Affiliate-owned payment/ledger/wallet/payout é proibido. Financial permanece a única autoridade sobre Payment, eligible revenue, ledger, payable/wallet, settlement, payout, reconciliation, FX e reversões monetárias; Ordering permanece a autoridade de Order.\n\nA aceitação integrada cobre MySQL real para Privacy, Identity/Suspension, Attribution e Commercial; replay exato/divergente; concorrência e locks; retenção/DSR/anonymization/pseudonymization/legal hold; commission 3000 bps com integer minor units/half-up; lifecycle/refunds/reversals; e materialization request/readback/retry sem instrução monetária controlada pelo Affiliate/browser. Nenhum Mercado Pago real, dinheiro real ou produção foi executado nesta campanha.\n\nO staging V2 conectado é isolado e possui MySQL privado próprio, porém o web service permanece vinculado a uma branch histórica de Payments com auto-deploy desligado. O conector Render disponível consegue disparar deploy, mas não retargetar a branch de um serviço existente; por isso nenhum deploy da branch errada foi executado. O contrato permanente Render Staging Blueprint #66 é PASS na árvore certificada.\n\n\`MIG-0011\` e \`FEATURE-0010\` passam a \`equivalent\`, não \`released\`. Rollout para tráfego/produção continua separado e preserva rollback application-first, durable readback/audit e toda autoridade monetária no Financial.\n`;
          text = text.replace(anchor, anchor + section);
          fs.writeFileSync(path, text);
          NODE
      - name: Apply canonical formatting
        run: pnpm exec prettier --write docs/migration/MASTER-MIGRATION-TRACKER.md
      - name: Commit tracker reconciliation
        shell: bash
        run: |
          if git diff --quiet -- docs/migration/MASTER-MIGRATION-TRACKER.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m "docs(affiliates): promote MIG-0011 to equivalent"
          git push origin HEAD:docs/affiliates-equivalence-finalization-20260824
