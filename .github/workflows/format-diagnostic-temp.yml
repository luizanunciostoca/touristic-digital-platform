name: Format Diagnostic Temp

on:
  push:
    branches:
      - wave/category-rail-scroll-affordance-20260924

permissions:
  contents: read

concurrency:
  group: format-diagnostic-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/public/tourist-shell-v2.css
          git diff -- apps/morro-digital-platform/public/tourist-shell-v2.css
