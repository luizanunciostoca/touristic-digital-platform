name: Affiliates FEATURE-0010 Contract

on:
  pull_request:
    paths:
      - "packages/affiliates/**"
      - "services/affiliates/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "docs/product-architecture/AFFILIATES-CANONICAL-SCOPE.md"
      - "docs/product-architecture/AFFILIATES-TECHNICAL-CONTRACT.md"
      - "docs/product-architecture/AFFILIATES-DECISION-SHEET.md"
      - "docs/product-architecture/AFFILIATES-THREAT-MODEL.md"
      - "docs/migration/AFFILIATES-MIGRATION-MATRIX.md"
      - "docs/qa/AFFILIATES-FEATURE-0010-DISCOVERY-EVIDENCE.md"
      - "docs/qa/AFFILIATES-FEATURE-0010-EQUIVALENCE-EVIDENCE.md"
      - "docs/qa/AFFILIATES-FEATURE-0010-TEST-PLAN.md"
      - "docs/operations/AFFILIATES-ROLLOUT-ROLLBACK.md"
      - "docs/product-architecture/CAPABILITY-MATRIX.md"
      - "docs/product-architecture/DOMAIN-MAP.md"
      - "docs/product-architecture/MODULE-CONTRACTS.md"
      - "docs/features/registry.json"
      - "docs/migration/MASTER-MIGRATION-TRACKER.md"
      - ".github/workflows/affiliates-feature-0010-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: affiliates-m154
          MYSQL_DATABASE: affiliates_m154_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -paffiliates-m154"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate architecture and registry
        run: pnpm architecture:check && pnpm features:check
      - name: Validate Affiliate runtime foundation
        run: pnpm affiliates:check
      - name: Validate Affiliate MySQL persistence
        env:
          AFFILIATES_DATABASE_URL: mysql://root:affiliates-m154@127.0.0.1:3306/affiliates_m154_test
        run: pnpm --filter @touristic/affiliates-server test:integration
      - name: Validate Affiliate authority and policy contract
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Affiliate contract gate failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          require_fixed() {
            local expected="$1"
            local file="$2"
            if ! grep -Fq "$expected" "$file"; then
              echo "Missing required Affiliate contract text in ${file}: ${expected}" >&2
              exit 1
            fi
          }

          test -f packages/affiliates/package.json
          test -f packages/affiliates/src/index.ts
          test -f packages/affiliates/src/policy.ts
          test -f packages/affiliates/src/attribution.ts
          test -f packages/affiliates/src/commission.ts
          test -f packages/affiliates/src/conversion.ts
          test -f packages/affiliates/src/eligibility.ts
          test -f packages/affiliates/src/ids.ts
          test -f packages/affiliates/src/materialization.ts
          test -f packages/affiliates/src/ports.ts
          test -f packages/affiliates/src/events.ts
          test -f packages/affiliates/src/index.test.ts
          test -f packages/affiliates/tsconfig.json
          test -f services/affiliates/package.json
          test -f services/affiliates/src/index.ts
          test -f services/affiliates/src/mysql-affiliate-persistence.ts
          test -f services/affiliates/src/schema.ts

          test -f docs/product-architecture/AFFILIATES-CANONICAL-SCOPE.md
          test -f docs/product-architecture/AFFILIATES-TECHNICAL-CONTRACT.md
          test -f docs/product-architecture/AFFILIATES-DECISION-SHEET.md
          test -f docs/product-architecture/AFFILIATES-THREAT-MODEL.md
          test -f docs/migration/AFFILIATES-MIGRATION-MATRIX.md
          test -f docs/qa/AFFILIATES-FEATURE-0010-DISCOVERY-EVIDENCE.md
          test -f docs/qa/AFFILIATES-FEATURE-0010-EQUIVALENCE-EVIDENCE.md
          test -f docs/qa/AFFILIATES-FEATURE-0010-TEST-PLAN.md
          test -f docs/operations/AFFILIATES-ROLLOUT-ROLLBACK.md

          require_fixed 'Status: **APPROVED**' docs/product-architecture/AFFILIATES-DECISION-SHEET.md
          require_fixed 'Policy version: **AFFILIATE-POLICY-V1**' docs/product-architecture/AFFILIATES-DECISION-SHEET.md
          require_fixed 'Financial remains the only monetary source of truth' docs/product-architecture/AFFILIATES-CANONICAL-SCOPE.md
          require_fixed 'No Affiliate-owned payout, wallet or payment runtime is ever authorized.' docs/product-architecture/AFFILIATES-CANONICAL-SCOPE.md
          require_fixed 'affiliate:v1:<operation>:' docs/product-architecture/AFFILIATES-TECHNICAL-CONTRACT.md
          require_fixed 'AffiliateFinancialMaterializationPort' docs/product-architecture/AFFILIATES-TECHNICAL-CONTRACT.md
          require_fixed 'rateBasisPoints: 3000' packages/affiliates/src/policy.ts
          require_fixed 'attributionWindowDays: 30' packages/affiliates/src/policy.ts
          require_fixed 'subscriptionRenewalsEligible: false' packages/affiliates/src/policy.ts
          require_fixed 'financial_net_eligible_platform_revenue' packages/affiliates/src/policy.ts

          decision_count="$(grep -Ec '^## [0-9]+\.' docs/product-architecture/AFFILIATES-DECISION-SHEET.md)"
          if [ "$decision_count" -ne 19 ]; then
            echo "Expected 19 Affiliate decisions, found ${decision_count}." >&2
            exit 1
          fi

          node <<'NODE'
          const affiliateManifest = require('./packages/affiliates/package.json');
          const serverManifest = require('./services/affiliates/package.json');
          const rootManifest = require('./package.json');
          if (affiliateManifest.name !== '@touristic/affiliates') throw new Error('Affiliate package name diverged.');
          if (affiliateManifest.type !== 'module') throw new Error('Affiliate package must remain ESM.');
          if (affiliateManifest.dependencies || affiliateManifest.devDependencies) {
            throw new Error('Affiliate domain package must remain dependency-free.');
          }
          if (serverManifest.name !== '@touristic/affiliates-server') throw new Error('Affiliate server package name diverged.');
          if (!rootManifest.scripts?.['affiliates:check']) throw new Error('Root affiliates:check script is missing.');
          NODE

          if grep -REn --include='*.ts' --include='*.tsx' \
            '@touristic/(business|financial|ordering)|services/(business|financial|ordering)|apps/' \
            packages/affiliates/src; then
            echo 'Affiliate domain source crossed a forbidden implementation boundary.' >&2
            exit 1
          fi

          node <<'NODE'
          const { readdirSync, readFileSync } = require('node:fs');
          const { join, relative } = require('node:path');

          const roots = ['packages/affiliates/src', 'services/affiliates/src'];
          const forbidden = /(payoutDestination|settlementInstruction|providerToken|providerSecret)/gu;
          const rejectionGuard = {
            path: 'services/affiliates/src/affiliate-http-transport.ts',
            line: '"providerToken",',
            identifier: 'providerToken',
          };
          const violations = [];
          let rejectionGuardOccurrences = 0;

          function sourceFiles(directory) {
            return readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) return sourceFiles(path);
              if (!/\.tsx?$/u.test(entry.name) || /\.test\.tsx?$/u.test(entry.name)) {
                return [];
              }
              return [path];
            });
          }

          for (const root of roots) {
            for (const path of sourceFiles(root)) {
              const source = readFileSync(path, 'utf8');
              const lines = source.split('\n');
              for (const match of source.matchAll(forbidden)) {
                const lineNumber = source.slice(0, match.index).split('\n').length;
                const line = lines[lineNumber - 1]?.trim() ?? '';
                const repositoryPath = relative('.', path);
                if (
                  repositoryPath === rejectionGuard.path &&
                  match[0] === rejectionGuard.identifier &&
                  line === rejectionGuard.line
                ) {
                  rejectionGuardOccurrences += 1;
                  continue;
                }
                violations.push(`${repositoryPath}:${lineNumber}:${line}`);
              }
            }
          }

          if (rejectionGuardOccurrences !== 1 || violations.length > 0) {
            console.error('Affiliate runtime contains a forbidden monetary/provider instruction.');
            for (const violation of violations) console.error(violation);
            process.exit(1);
          }
          NODE

          grep -Fq 'providerToken: "forbidden-provider-token"' \
            services/affiliates/src/affiliate-http-transport.test.ts
          grep -Fq 'if (hasBrowserMonetaryAuthority(body)) {' \
            services/affiliates/src/affiliate-http-transport.ts

          node <<'NODE'
          const registry = require('./docs/features/registry.json');
          const feature = registry.features.find((entry) => entry.id === 'FEATURE-0010');
          if (!feature) throw new Error('FEATURE-0010 is missing from the feature registry.');
          if (feature.domain !== 'affiliates') {
            throw new Error(`FEATURE-0010 domain diverged: ${feature.domain}`);
          }
          if (!['migrating', 'equivalent'].includes(feature.status)) {
            throw new Error(`FEATURE-0010 registry state diverged: ${feature.status}`);
          }
          const flags = feature.equivalence ?? {};
          if (feature.status === 'migrating') {
            if (flags.behavior || flags.visual || flags.api) {
              throw new Error('FEATURE-0010 migrating state cannot claim complete equivalence.');
            }
          } else {
            if (!flags.behavior || !flags.visual || !flags.api) {
              throw new Error('FEATURE-0010 equivalent state requires all registry equivalence flags true.');
            }
            if (feature.verification?.provider !== 'NOT_APPLICABLE') {
              throw new Error('Affiliate provider verification must remain NOT_APPLICABLE.');
            }
          }
          NODE

          if ! grep -Eq 'MIG-0011.*FEATURE-0010.*(migrating|equivalent)' docs/migration/MASTER-MIGRATION-TRACKER.md; then
            echo 'MIG-0011 is missing or has an invalid state in the master migration tracker.' >&2
            exit 1
          fi

          if grep -Fq '| MIG-0011 ' docs/migration/MASTER-MIGRATION-TRACKER.md && \
             grep -Eq 'MIG-0011.*FEATURE-0010.*equivalent' docs/migration/MASTER-MIGRATION-TRACKER.md; then
            require_fixed 'PASS       25' docs/migration/AFFILIATES-MIGRATION-MATRIX.md
            require_fixed 'PARTIAL     0' docs/migration/AFFILIATES-MIGRATION-MATRIX.md
            require_fixed 'GAP         0' docs/migration/AFFILIATES-MIGRATION-MATRIX.md
            require_fixed 'N/A         2' docs/migration/AFFILIATES-MIGRATION-MATRIX.md
            require_fixed 'FEATURE-0010' docs/qa/AFFILIATES-FEATURE-0010-EQUIVALENCE-EVIDENCE.md
            require_fixed 'Financial remains sole authority' docs/qa/AFFILIATES-FEATURE-0010-EQUIVALENCE-EVIDENCE.md
          fi
