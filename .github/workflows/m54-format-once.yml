name: M54 Format Once

on:
  push:
    branches:
      - feat/business-m54-onboarding-adapters
    paths:
      - .github/workflows/m54-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m54-onboarding-adapters
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M54 files
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/src/business-onboarding-adapters.ts
          apps/morro-digital-platform/src/business-onboarding-adapters.test.ts
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/m54-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/business-onboarding-adapters.ts apps/morro-digital-platform/src/business-onboarding-adapters.test.ts .github/workflows/m54-format-once.yml
          git commit -m "style(business): format M54 onboarding adapters"
          git push origin HEAD:feat/business-m54-onboarding-adapters
