name: M55 Format Docs Once

on:
  push:
    branches:
      - feat/business-m55-onboarding-browser-lifecycle-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m55-onboarding-browser-lifecycle-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M55 documentation
        run: >-
          pnpm exec prettier --write
          docs/migration/BUSINESS-MIGRATION-MATRIX.md
          docs/qa/BUSINESS-M55-EVIDENCE.md
      - name: Commit formatted docs and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m55-format-docs-once.yml
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M55-EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(business): format M55 documentation"
          git push origin HEAD:feat/business-m55-onboarding-browser-lifecycle-v2
