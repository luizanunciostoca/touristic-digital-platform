name: Control Center Shell V1 Contract

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-control-center-shell-v1-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: control-center-shell-ci
          MYSQL_DATABASE: control_center_shell_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcontrol-center-shell-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/ci-bootstrap
        with:
          browser: "true"
      - name: Check exact shell formatting
        id: ci_command_01
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            apps/control-center/public/control-center-shell-v1.css
            apps/control-center/public/control-center-shell-v1.js
            apps/control-center/public/index.html
            apps/morro-digital-platform/src/ux/control-center-shell-sidebar-v1-contract.test.ts
            apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs
          )
          pnpm exec prettier --check "${FILES[@]}"
      - name: Run shell source contract
        id: ci_command_02
        run: >
          pnpm --filter @touristic/morro-digital-platform exec vitest run
          src/ux/control-center-shell-sidebar-v1-contract.test.ts
      - name: Install deterministic Chromium
        id: ci_command_03
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build runtime graph
        id: ci_command_04
        run: pnpm -w build
      - name: Start authenticated Control Center
        id: ci_command_05
        shell: bash
        run: |
          set -euo pipefail
          PORT=4196
          AUTH_SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="control center shell browser fixture"
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 31))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([
            {id:"platform-owner-shell",email:"platform-owner-shell@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}
          ]))' "$OWNER_HASH")
          DB_URL="mysql://root:control-center-shell-ci@127.0.0.1:3306/control_center_shell_ci"
          DASHBOARD_AUTH_SECRET="$AUTH_SECRET" \
          DASHBOARD_USERS_JSON="$USERS" \
          AUTH_DATABASE_URL="$DB_URL" \
          CONTROL_CENTER_AUDIT_DATABASE_URL="$DB_URL" \
          DESTINATIONS_DATABASE_URL="$DB_URL" \
          PORT="$PORT" \
          HOST="127.0.0.1" \
            node apps/morro-digital-platform/tooling/dev-server.mjs \
            >/tmp/control-center-shell-v1-server.log 2>&1 &
          echo $! >/tmp/control-center-shell-v1-server.pid
          for _ in $(seq 1 100); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/apps/control-center/public/index.html" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/control-center-shell-v1-server.log
          exit 1
      - name: Validate shell in mandatory viewports
        id: ci_command_06
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4196
        run: node apps/morro-digital-platform/tooling/control-center-shell-v1-browser-contract.cjs
      - name: Show diagnostics
        id: ci_command_07
        if: failure()
        run: cat /tmp/control-center-shell-v1-server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-center-shell-v1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/control-center-shell-v1-evidence.json
            /tmp/control-center-shell-v1-*.png
          retention-days: 5
          if-no-files-found: ignore
      - name: Stop runtime
        id: ci_command_08
        if: always()
        run: kill "$(cat /tmp/control-center-shell-v1-server.pid)" 2>/dev/null || true
      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["control-center-shell-v1-contract.yml"]'), 'control-center-shell-v1-contract.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["control-center-shell-v1-contract.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt control-center-shell-v1-contract.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-control-center-shell-v1-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
