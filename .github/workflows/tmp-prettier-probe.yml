name: Temporary Prettier Probe

on:
  push:
    branches:
      - wave/ux-p0-design-system-v2

permissions:
  contents: write

concurrency:
  group: temporary-prettier-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier
        run: pnpm exec prettier apps/morro-digital-platform/src/accessibility/ux-p0-foundations.test.ts --write

      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/morro-digital-platform/src/accessibility/ux-p0-foundations.test.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/accessibility/ux-p0-foundations.test.ts
          git commit -m "style(ui): apply canonical Prettier output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
