name: M68 CRM domain helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-m68-domain-model
    paths:
      - ".github/workflows/m68-crm-domain-helper.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m68-domain-model
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Integrate workspace lockfile
        run: pnpm install --lockfile-only
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Validate CRM domain package
        run: |
          pnpm --filter @touristic/crm lint
          pnpm --filter @touristic/crm typecheck
          pnpm --filter @touristic/crm test
          pnpm --filter @touristic/crm build
      - name: Validate repository quality
        run: |
          pnpm format:check
          pnpm architecture:check
          pnpm features:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(crm): integrate M68 workspace lockfile"
          git push origin HEAD:feat/crm-m68-domain-model
