name: Temporary M149 Documentation Reconciler

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/m149-reconcile-docs-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile M149 truth
        run: python3 .github/scripts/m149-reconcile-once.py
      - name: Format and validate documentation
        run: |
          pnpm exec prettier --write docs/qa/PAYMENTS-M149-EVIDENCE.md docs/migration/PAYMENTS-MIGRATION-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md
          git diff --check
      - name: Commit permanent documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/PAYMENTS-M149-EVIDENCE.md docs/migration/PAYMENTS-MIGRATION-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m "docs(payments): reconcile M149 browser checkout truth"
          git push origin HEAD:feat/payments-m148-browser-checkout
