name: Temporary M149 Verified Failure Reconciler

on:
  push:
    branches:
      - feat/payments-m148-browser-checkout
    paths:
      - ".github/workflows/m149-reconcile-docs-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m148-browser-checkout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile M149 verified result contracts
        run: python3 .github/scripts/m149-reconcile-once.py
      - name: Format and validate permanent files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts \
            docs/qa/PAYMENTS-M149-EVIDENCE.md \
            docs/migration/PAYMENTS-MIGRATION-MATRIX.md \
            docs/migration/MASTER-MIGRATION-TRACKER.md
          git diff --check
      - name: Build workspace dependencies
        run: pnpm -w build
      - name: Run focused unit contract
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run src/payments-browser-checkout-client.test.ts
      - name: Commit permanent M149 contract changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/payments-browser-checkout-client.ts \
            apps/morro-digital-platform/src/payments-browser-checkout-client.test.ts \
            docs/qa/PAYMENTS-M149-EVIDENCE.md \
            docs/migration/PAYMENTS-MIGRATION-MATRIX.md \
            docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m "feat(payments): require persisted verified failure in M149"
          git push origin HEAD:feat/payments-m148-browser-checkout
