name: Format NAV-25B Temp

on:
  push:
    branches:
      - feat/navigation-event-lifecycle-integration
    paths:
      - .github/workflows/navigation-nav25b-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-event-lifecycle-integration
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/navigation/navigation-composition.ts apps/morro-digital-platform/src/navigation/navigation-dom-lifecycle.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/navigation/navigation-composition.ts apps/morro-digital-platform/src/navigation/navigation-dom-lifecycle.ts
          git commit -m "style: format NAV-25B lifecycle integration"
          git push origin HEAD:feat/navigation-event-lifecycle-integration
