name: Control Center Formatting Repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/__temp-control-center-format-repair.yml"

permissions:
  contents: write

concurrency:
  group: control-center-format-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair Ticketing assertion and format exact files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "services/ticketing/src/ticketing-admin-service.test.ts";
          let source = fs.readFileSync(path, "utf8");
          const before = "availableQuantity: 8,";
          const after = "remainingQuantity: 8,";
          const matches = source.split(before).length - 1;
          if (matches !== 1) {
            throw new Error(
              `TICKETING_ADMIN_AVAILABILITY_ASSERTION_COUNT_${matches}`,
            );
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

          pnpm exec prettier --write \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs \
            apps/morro-digital-platform/tooling/ticketing-api-startup.test.mjs \
            services/ticketing/src/ticketing-admin-service.ts \
            services/ticketing/src/ticketing-admin-service.test.ts

          rm .github/workflows/__temp-control-center-format-repair.yml

          git config user.name "morro-digital-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(control-center): normalize commerce admin contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
