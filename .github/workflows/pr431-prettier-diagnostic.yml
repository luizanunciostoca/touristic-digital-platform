name: PR431 Prettier Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/analytics/src/ingestion.ts
      - services/analytics/src/schema.ts
      - .github/workflows/pr431-prettier-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: pr431-prettier-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-diff:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          targets=(packages/analytics/src/ingestion.ts services/analytics/src/schema.ts)
          pnpm exec prettier --write "${targets[@]}"
          git --no-pager diff -- "${targets[@]}" || true
          if git diff --quiet -- "${targets[@]}"; then
            echo "PR431_PRETTIER_ALREADY_FORMATTED"
          else
            echo "PR431_PRETTIER_DIFF_EMITTED"
          fi
