name: Format Assistant Contextual PR 343
on:
  push:
    branches:
      - ops/format-assistant-contextual-343-20260924

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assistant-contextual-presentation-authority-20260924
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact assistant changes
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-contextual-state.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-contextual-state.ts \
            apps/morro-digital-platform/src/assistant/assistant-message-dom.ts \
            apps/morro-digital-platform/src/assistant/assistant-navigation-feedback.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            packages/assistant/src/message-pipeline.test.ts \
            packages/assistant/src/message-pipeline.ts
      - name: Commit formatted files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/assistant/assistant-contextual-state.test.ts \
            apps/morro-digital-platform/src/assistant/assistant-contextual-state.ts \
            apps/morro-digital-platform/src/assistant/assistant-message-dom.ts \
            apps/morro-digital-platform/src/assistant/assistant-navigation-feedback.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            packages/assistant/src/message-pipeline.test.ts \
            packages/assistant/src/message-pipeline.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style(assistant): apply canonical prettier formatting"
          git push origin HEAD:fix/assistant-contextual-presentation-authority-20260924
