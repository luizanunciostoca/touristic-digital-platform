name: M60 Finalize Docs Once
on:
  push:
    branches: [feat/business-m60-partner-workspace]
    paths: [.github/workflows/m60-finalize-docs-once.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m60-partner-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Promote M60 in canonical matrix
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('docs/migration/BUSINESS-MIGRATION-MATRIX.md')
          s=p.read_text()
          s=s.replace('# Business Portal — Migration Matrix (M59 tutorial profile sandbox/runtime parity)', '# Business Portal — Migration Matrix (M60 partner workspace sandbox parity)')
          start=s.index('After M59,')
          end=s.index('\n\n| Contract', start)
          s=s[:start] + 'After M60, `FEATURE-0005` remains `baseline-pending`, but the Business-owned onboarding now includes the frozen recommendation, profile and partner-workspace tutorial contracts. M60 adds session-only event summaries, sandbox promotion creation and a partner-panel projection while preserving the centralized Auth boundary: the protected dashboard is never embedded or bypassed. Production analytics remain unavailable, wider live Business runtime is still partial, and commercial conversion/Payments stay outside this milestone.' + s[end:]
          s=s.replace('V2 evidence at M59', 'V2 evidence at M60')
          old='| Partner workspace adapter               | `business-partner-workspace-adapter.js`                               | no Business workspace port                                                                                                                                                                    | GAP     | Freeze active call sites before implementation.                                                                                                           |'
          new='| Partner workspace adapter               | `business-partner-workspace-adapter.js`                               | M60 renders session-only metrics, creates sandbox promotions and hands off explicitly to the protected authenticated dashboard                                                               | PASS    | Keep tutorial workspace isolated; Auth protects the real dashboard and production analytics remain separate.                                              |'
          if old not in s: raise SystemExit('partner row not found')
          s=s.replace(old,new,1)
          s=s.replace('explicit runtime-context allowlist including M58/M59 tutorial results', 'explicit runtime-context allowlist including M58-M60 tutorial results')
          s=s.replace('wider live/workspace/analytics runtime remains incomplete', 'wider live/analytics/commercial runtime remains incomplete')
          s=s.replace('full 28-step declarative presentation remains browser-tested; M59 embeds a normalized profile preview and explicit tutorial-only profile controls in the existing surface', 'full 28-step presentation remains browser-tested; M59 adds profile preview and M60 adds sandbox promotion plus partner-session summary controls')
          score_start=s.index('## M59 score')
          dep=s.index('## Dependency rule', score_start)
          narrative='''## M60 score\n\n- `PASS`: 15\n- `PARTIAL`: 3\n- `GAP`: 1\n- `N/A`: 1\n- total: 20\n\nM60 promotes `Partner workspace adapter` from `GAP` to `PASS`. The frozen V1 audit confirmed two active Business-owned behaviors: a workspace summary derived from tutorial-session events and a demo-promotion loop that remains inside the sandbox. V2 now reproduces both without restoring the V1 global/iframe coupling.\n\n`@touristic/business/onboarding-workspace` owns the immutable event vocabulary, normalized session-summary projection, category-aware promotion defaults and sandbox promotion construction. Promotion state is always `environment: "sandbox"`, `publishable: false`, tutorial-only and excluded from Business metrics. The runtime records only the frozen tutorial signals already produced by existing onboarding effects.\n\nThe `promotions` step renders an editable demonstration form and persists only `businessDemoPromotion`. The `partner-panel` step builds a workspace snapshot from `businessTutorialEventSummary` and renders that isolated summary. The dashboard action emits an explicit handoff to the existing protected Business dashboard with `requiresAuthentication: true`; no iframe, credential, cookie, CSRF bypass or synthetic Auth session is introduced.\n\nThe permanent Workspace Browser Contract proves the full browser loop in Chromium: edited promotion submission, sandbox/non-publishable boundary, event-summary increment, workspace rendering, absence of dashboard iframe and authenticated handoff. Route and Profile Browser import maps were extended for the new package subpath and remain regression targets.\n\n`Business profile behavior` remains `PARTIAL` because production profile persistence breadth is not completed by M60. `Live Business runtime` remains `PARTIAL` because production analytics and other frozen runtime breadth are still incomplete. `Commercial conversion adapter` remains the only Business-owned `GAP`, and Payments/checkout remains separately owned.\n\n'''
          s=s[:score_start]+narrative+s[dep:]
          marker='`BUSINESS-M59-EVIDENCE.md`, `onboarding-profile.test.ts`, `onboarding-context.test.ts` and the permanent Business Onboarding Profile Browser Contract prove tutorial profile projection, shared-core sanitization, explicit runtime persistence, embedded preview, map/primary/promotion actions, no fabricated rating/opening-hours state and metric exclusion.\n\n'
          addition=marker+'`BUSINESS-M60-EVIDENCE.md`, `onboarding-workspace.test.ts`, the expanded `onboarding-context.test.ts` and the permanent Business Onboarding Workspace Browser Contract prove session-only event summaries, sandbox promotion creation, partner-panel rendering, metric exclusion, absence of iframe/Auth bypass and an explicit authenticated dashboard handoff.\n\n'
          if marker not in s: raise SystemExit('evidence marker not found')
          s=s.replace(marker,addition,1)
          old_accept='The official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route, Onboarding Profile and Navigation Accessibility regressions must remain green on the final permanent M59 head.'
          new_accept='The official Quality Gate must validate formatting, architecture, Feature Registry, lint, typecheck, tests and build. Business Auth, Dashboard, Onboarding Adapter, Onboarding Browser, Onboarding Route, Onboarding Profile, Onboarding Workspace and Navigation Accessibility regressions must remain green on the final permanent M60 head.'
          s=s.replace(old_accept,new_accept,1)
          next_start=s.index('## Next implementation milestone')
          s=s[:next_start]+'''## Next implementation milestone\n\nM61 should audit the frozen `Commercial conversion adapter` call sites before implementation. It is now the only remaining Business-owned `GAP`, but the audit must separate Business handoff/orchestration from payment, subscription and checkout execution owned by `FEATURE-0009`.\n\nProduction profile breadth and `Live Business runtime` remain `PARTIAL`; neither should be promoted until executable frozen evidence proves the missing production behavior. Analytics endpoints must not be invented merely to increase the migration score.\n'''
          p.write_text(s)
          Path('docs/migration/BUSINESS-MIGRATION-MATRIX-M60-DRAFT.md').unlink()
          PY
      - run: pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M60-EVIDENCE.md
      - name: Commit canonical M60 docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M60-EVIDENCE.md
          git rm docs/migration/BUSINESS-MIGRATION-MATRIX-M60-DRAFT.md
          git commit -m "docs(business): finalize M60 migration evidence"
          git push origin HEAD:feat/business-m60-partner-workspace
