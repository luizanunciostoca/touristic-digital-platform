name: Production OCI Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest produced by Release OCI Image
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: production-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2.onrender.com

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Prove exact SHA is current main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$EXPECTED_SHA"

      - name: Re-prove immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --workflow release-oci-image.yml \
              --branch main \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          test -n "$run_id"
          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$run_id" \
            --name "release-provenance-$EXPECTED_SHA" \
            --dir /tmp/release-provenance
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            '.source_sha == $sha and .digest == $digest' \
            /tmp/release-provenance/release-provenance.json >/dev/null
          echo "PASS: immutable image $IMAGE_REPOSITORY@$IMAGE_DIGEST from run $run_id"

      - name: Re-prove mandatory release gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            final-release-acceptance.yml \
            oci-release-promotion-gate.yml \
            dependency-security-audit.yml \
            security-scanning.yml
          do
            run_id="$(gh run list \
              --workflow "$workflow" \
              --branch main \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            test -n "$run_id"
            echo "PASS: $workflow run $run_id @ $EXPECTED_SHA"
          done

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Trigger Render image deploy by exact digest
        id: render
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_IMAGE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK"
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          encoded="$(jq -rn --arg value "$image_ref" '$value|@uri')"
          separator='?'
          [[ "$DEPLOY_HOOK" == *\?* ]] && separator='&'
          status="$(curl --request POST --silent --show-error \
            --output /tmp/render-image-deploy.json \
            --write-out '%{http_code}' \
            "${DEPLOY_HOOK}${separator}imgURL=${encoded}")"
          case "$status" in 200|202) ;; *) cat /tmp/render-image-deploy.json >&2; exit 1 ;; esac
          deploy_id="$(jq -r '.deploy.id // .id // empty' /tmp/render-image-deploy.json 2>/dev/null || true)"
          echo "deploy_id=${deploy_id:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA runtime identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "image=$IMAGE_REPOSITORY"
            echo "digest=$IMAGE_DIGEST"
            echo "render_deploy_id=${DEPLOY_ID:-unknown}"
            echo "target_url=$TARGET_URL"
          } > oci-deployment-evidence.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-oci-deployment-evidence-${{ github.run_id }}
          path: oci-deployment-evidence.txt
          if-no-files-found: error
          retention-days: 90
