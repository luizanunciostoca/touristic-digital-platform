name: Production OCI Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest produced by Release OCI Image
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  deployments: write

concurrency:
  group: production-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2.onrender.com
  RENDER_WORKSPACE_ID: tea-d9p09oks728c7381s990
  RENDER_PRODUCTION_MYSQL_SERVICE_ID: srv-datbsavlot8c73evbhj0

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/run-production-cutover '))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      expected_sha: ${{ steps.invocation.outputs.expected_sha }}
      image_digest: ${{ steps.orchestrate.outputs.image_digest }}
      confirm_deploy: ${{ steps.invocation.outputs.confirm_deploy }}
      dr_run_id: ${{ steps.orchestrate.outputs.dr_run_id }}
      dr_requested_at: ${{ steps.orchestrate.outputs.dr_requested_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact owner-authorized invocation
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_DIGEST: ${{ inputs.image_digest }}
          INPUT_CONFIRM: ${{ inputs.confirm_deploy }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_sha="$INPUT_SHA"
            image_digest="$INPUT_DIGEST"
            confirm_deploy="$INPUT_CONFIRM"
            orchestrate="false"
          else
            read -r command expected_sha confirm_deploy extra <<<"$COMMENT_BODY"
            test "$command" = "/run-production-cutover"
            test -z "${extra:-}"
            image_digest=""
            orchestrate="true"
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$orchestrate" = "false" ]; then
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          test "$confirm_deploy" = "DEPLOY"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$expected_sha"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "confirm_deploy=$confirm_deploy" >> "$GITHUB_OUTPUT"
          echo "orchestrate=$orchestrate" >> "$GITHUB_OUTPUT"

      - name: Orchestrate exact-main release, MySQL, and fresh DR gates
        id: orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          INPUT_DIGEST: ${{ steps.invocation.outputs.image_digest }}
          ORCHESTRATE: ${{ steps.invocation.outputs.orchestrate }}
        shell: bash
        run: |
          set -euo pipefail

          assert_exact_main() {
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$current_main" = "$EXPECTED_SHA"
          }

          wait_for_success() {
            local workflow="$1"
            for _ in $(seq 1 1440); do
              assert_exact_main
              local run_id
              run_id="$(gh run list \
                --workflow "$workflow" \
                --commit "$EXPECTED_SHA" \
                --status success \
                --limit 20 \
                --json databaseId,headSha \
                --jq --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty')"
              if [ -n "$run_id" ]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for $workflow @ $EXPECTED_SHA" >&2
            return 1
          }

          dispatch_and_wait() {
            local workflow="$1"
            shift
            local key before_file run_id status conclusion head_sha
            key="${workflow//[^A-Za-z0-9]/_}"
            before_file="/tmp/${key}.before"
            gh run list \
              --workflow "$workflow" \
              --commit "$EXPECTED_SHA" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId' > "$before_file" || true

            assert_exact_main
            gh workflow run "$workflow" --ref main "$@"

            run_id=""
            for _ in $(seq 1 120); do
              assert_exact_main
              while read -r candidate; do
                [ -n "$candidate" ] || continue
                if ! grep -Fxq "$candidate" "$before_file"; then
                  run_id="$candidate"
                  break
                fi
              done < <(
                gh run list \
                  --workflow "$workflow" \
                  --commit "$EXPECTED_SHA" \
                  --event workflow_dispatch \
                  --limit 20 \
                  --json databaseId,headSha \
                  --jq --arg sha "$EXPECTED_SHA" '.[] | select(.headSha == $sha) | .databaseId'
              )
              [ -n "$run_id" ] && break
              sleep 5
            done
            test -n "$run_id"

            for _ in $(seq 1 1440); do
              assert_exact_main
              status="$(gh run view "$run_id" --json status --jq '.status')"
              if [ "$status" = "completed" ]; then
                conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
                head_sha="$(gh run view "$run_id" --json headSha --jq '.headSha')"
                test "$head_sha" = "$EXPECTED_SHA"
                test "$conclusion" = "success"
                echo "PASS: $workflow run $run_id @ $EXPECTED_SHA" >&2
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for dispatched $workflow run $run_id" >&2
            return 1
          }

          assert_exact_main
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

          if [ "$ORCHESTRATE" = "true" ]; then
            final_release_run_id="$(dispatch_and_wait final-release-acceptance.yml)"
            candidate_run_id="$(dispatch_and_wait release-candidate-certification.yml)"
            dependency_run_id="$(wait_for_success dependency-security-audit.yml)"
            security_run_id="$(wait_for_success security-scanning.yml)"
            oci_run_id="$(dispatch_and_wait release-oci-image.yml -f "expected_sha=$EXPECTED_SHA")"

            rm -rf /tmp/release-provenance
            mkdir -p /tmp/release-provenance
            gh run download "$oci_run_id" \
              --name "release-provenance-$EXPECTED_SHA" \
              --dir /tmp/release-provenance
            expected_tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
            image_digest="$(jq -r \
              --arg sha "$EXPECTED_SHA" \
              --arg tree "$expected_tree" \
              'select(.source_sha == $sha and .tree_sha == $tree) | .digest // empty' \
              /tmp/release-provenance/release-provenance.json)"
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            oci_gate_run_id="$(dispatch_and_wait oci-release-promotion-gate.yml \
              -f "expected_sha=$EXPECTED_SHA" \
              -f "image_digest=$image_digest")"
            mysql_provision_run_id="$(dispatch_and_wait production-mysql-render-provision.yml \
              -f "expected_sha=$EXPECTED_SHA" \
              -f "confirm_provision=PROVISION")"
            bootstrap_run_id="$(dispatch_and_wait production-mysql-canonical-bootstrap.yml \
              -f "expected_sha=$EXPECTED_SHA" \
              -f "image_digest=$image_digest" \
              -f "confirm_bootstrap=BOOTSTRAP")"

            echo "PASS: orchestrated final=$final_release_run_id candidate=$candidate_run_id dependency=$dependency_run_id security=$security_run_id oci=$oci_run_id gate=$oci_gate_run_id mysql=$mysql_provision_run_id bootstrap=$bootstrap_run_id" >&2
          else
            image_digest="$INPUT_DIGEST"
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            for workflow in \
              final-release-acceptance.yml \
              release-candidate-certification.yml \
              dependency-security-audit.yml \
              security-scanning.yml \
              production-mysql-render-provision.yml
            do
              wait_for_success "$workflow" >/dev/null
            done

            oci_run_id="$(wait_for_success release-oci-image.yml)"
            rm -rf /tmp/release-provenance
            mkdir -p /tmp/release-provenance
            gh run download "$oci_run_id" \
              --name "release-provenance-$EXPECTED_SHA" \
              --dir /tmp/release-provenance
            expected_tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
            jq -e \
              --arg sha "$EXPECTED_SHA" \
              --arg tree "$expected_tree" \
              --arg digest "$image_digest" \
              '.source_sha == $sha and .tree_sha == $tree and .digest == $digest' \
              /tmp/release-provenance/release-provenance.json >/dev/null

            gate_run_id=""
            rm -rf /tmp/oci-gate
            mkdir -p /tmp/oci-gate
            while read -r candidate_run; do
              [ -n "$candidate_run" ] || continue
              rm -rf /tmp/oci-gate/*
              if gh run download "$candidate_run" \
                --name "oci-promotion-gate-evidence-$candidate_run" \
                --dir /tmp/oci-gate >/dev/null 2>&1
              then
                if jq -e \
                  --arg sha "$EXPECTED_SHA" \
                  --arg digest "$image_digest" \
                  '.status == "pass" and .sourceSha == $sha and .imageDigest == $digest' \
                  /tmp/oci-gate/oci-promotion-gate-evidence.json >/dev/null 2>&1
                then
                  gate_run_id="$candidate_run"
                  break
                fi
              fi
            done < <(
              gh run list \
                --workflow oci-release-promotion-gate.yml \
                --commit "$EXPECTED_SHA" \
                --status success \
                --limit 30 \
                --json databaseId,headSha \
              | jq -r --arg sha "$EXPECTED_SHA" '.[] | select(.headSha == $sha) | .databaseId'
            )
            test -n "$gate_run_id"

            bootstrap_run_id="$(wait_for_success production-mysql-canonical-bootstrap.yml)"
            rm -rf /tmp/bootstrap-gate
            mkdir -p /tmp/bootstrap-gate
            gh run download "$bootstrap_run_id" \
              --name "production-mysql-canonical-bootstrap-$bootstrap_run_id" \
              --dir /tmp/bootstrap-gate
            jq -e \
              --arg sha "$EXPECTED_SHA" \
              --arg digest "$image_digest" \
              '.status == "pass" and
               .expectedSha == $sha and
               .release.imageDigest == $digest and
               .runtimeUsers.status == "pass" and
               .runtimeUsers.runtimeUsers == 13 and
               .runtimeUsers.allowedSchemaPrivilegesPerUser == 4 and
               .runtimeUsers.schemaPrivilegeEntries == 52 and
               .runtimeUsers.crossDomainDenied == 156 and
               .runtimeUsers.globalPrivilegeEntries == 0 and
               .bootstrap.status == "pass" and
               .bootstrap.idempotent == true and
               .bootstrap.runs == 2 and
               .bootstrap.totalTables == 91' \
              /tmp/bootstrap-gate/production-mysql-canonical-bootstrap-evidence.json >/dev/null
          fi

          assert_exact_main
          dr_requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dr_run_id="$(dispatch_and_wait production-mysql-backup-restore-proof.yml \
            -f "expected_sha=$EXPECTED_SHA" \
            -f "source_mysql_sha=$EXPECTED_SHA" \
            -f "confirm_dr=BACKUP_RESTORE")"

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "dr_run_id=$dr_run_id" >> "$GITHUB_OUTPUT"
          echo "dr_requested_at=$dr_requested_at" >> "$GITHUB_OUTPUT"
          echo "PASS: fresh DR run $dr_run_id dispatched at $dr_requested_at" >&2

  deploy:
    needs: preflight
    if: needs.preflight.outputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rehydrate exact DR evidence
        id: dr
        env:
          GH_TOKEN: ${{ github.token }}
          DR_RUN_ID: ${{ needs.preflight.outputs.dr_run_id }}
          DR_REQUESTED_AT: ${{ needs.preflight.outputs.dr_requested_at }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_meta="$(gh run view "$DR_RUN_ID" --json headSha,event,status,conclusion,createdAt)"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg requested "$DR_REQUESTED_AT" \
            '.headSha == $sha and
             .event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .createdAt >= $requested' <<<"$run_meta" >/dev/null

          rm -rf /tmp/production-dr-evidence
          mkdir -p /tmp/production-dr-evidence
          gh run download "$DR_RUN_ID"             --name "production-mysql-backup-restore-proof-$DR_RUN_ID"             --dir /tmp/production-dr-evidence
          evidence="/tmp/production-dr-evidence/production-mysql-backup-restore-evidence.json"
          test -s "$evidence"
          jq -e             --arg sha "$EXPECTED_SHA" --arg run "$DR_RUN_ID"             '.status == "pass" and
             .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
             .toolSha == $sha and
             .runId == $run and
             .sourceSha == $sha and
             .source.schemaCount == 13 and
             .source.totalTables == 91 and
             .restore.schemaCount == 13 and
             .restore.totalTables == 91 and
             .restore.rowCountsMatch == true and
             .restore.checksumsMatch == true and
             .restore.leastPrivilegeReadback == true'             "$evidence" >/dev/null
          source_sha="$(jq -r '.sourceSha // empty' "$evidence")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$source_sha" = "$EXPECTED_SHA"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Execute fail-closed canonical database cutover
        id: cutover
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_GHCR_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_GHCR_REGISTRY_CREDENTIAL_ID }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
          EXPECTED_MYSQL_SOURCE_SHA: ${{ steps.dr.outputs.source_sha }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_PRODUCTION_API_KEY"
          test -n "$RENDER_PRODUCTION_SERVICE_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA"
          node tooling/render/production-canonical-db-cutover.mjs cutover

      - name: Wait for exact-SHA health and readiness
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Roll back source and database config on failed verification
        if: failure()
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-state.json ]; then
            node tooling/render/production-canonical-db-cutover.mjs rollback
          else
            echo "No cutover state exists; no production mutation requires rollback."
          fi

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-evidence.json ]; then
            cp /tmp/morro-production-cutover-evidence.json production-canonical-db-cutover-evidence.json
          else
            jq -n               --arg expectedSha "$EXPECTED_SHA"               --arg imageDigest "$IMAGE_DIGEST"               '{contract:"MORRO-CANONICAL-PRODUCTION-DATABASE-CUTOVER",status:"no-evidence",expectedSha:$expectedSha,imageDigest:$imageDigest}'               > production-canonical-db-cutover-evidence.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-oci-deployment-evidence-${{ github.run_id }}
          path: production-canonical-db-cutover-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Destroy ephemeral rollback state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/morro-production-cutover-state.json
