name: Production OCI Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest produced by Release OCI Image
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  packages: write
  deployments: write

concurrency:
  group: production-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2.onrender.com

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Prove frozen candidate provenance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

      - name: Re-prove immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --workflow release-oci-image.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          test -n "$run_id"
          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$run_id" \
            --name "release-provenance-$EXPECTED_SHA" \
            --dir /tmp/release-provenance
          expected_tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg tree "$expected_tree" \
            --arg digest "$IMAGE_DIGEST" \
            '.source_sha == $sha and .tree_sha == $tree and .digest == $digest' \
            /tmp/release-provenance/release-provenance.json >/dev/null
          echo "PASS: immutable image $IMAGE_REPOSITORY@$IMAGE_DIGEST from run $run_id"

      - name: Re-prove mandatory release gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            final-release-acceptance.yml \
            oci-release-promotion-gate.yml \
            dependency-security-audit.yml \
            security-scanning.yml
          do
            run_id="$(gh run list \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            test -n "$run_id"
            echo "PASS: $workflow run $run_id @ $EXPECTED_SHA"
          done

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Trigger Render image deploy by exact digest
        id: render
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_IMAGE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK"
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          encoded="$(jq -rn --arg value "$image_ref" '$value|@uri')"
          separator='?'
          [[ "$DEPLOY_HOOK" == *\?* ]] && separator='&'
          status="$(curl --request POST --silent --show-error \
            --output /tmp/render-image-deploy.json \
            --write-out '%{http_code}' \
            "${DEPLOY_HOOK}${separator}imgURL=${encoded}")"
          case "$status" in 200|202) ;; *) cat /tmp/render-image-deploy.json >&2; exit 1 ;; esac
          deploy_id="$(jq -r '.deploy.id // .id // empty' /tmp/render-image-deploy.json 2>/dev/null || true)"
          echo "deploy_id=${deploy_id:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA runtime identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "image=$IMAGE_REPOSITORY"
            echo "digest=$IMAGE_DIGEST"
            echo "render_deploy_id=${DEPLOY_ID:-unknown}"
            echo "target_url=$TARGET_URL"
          } > oci-deployment-evidence.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-oci-deployment-evidence-${{ github.run_id }}
          path: oci-deployment-evidence.txt
          if-no-files-found: error
          retention-days: 90

  command-cutover:
    name: production / canonical database cutover
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-production-cutover ')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: production
      url: \${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact cutover authority
        id: authority
        env:
          COMMENT_BODY: \${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          read -r command expected_sha confirm extra <<<"$COMMENT_BODY"
          test "$command" = "/run-production-cutover"
          test "$confirm" = "DEPLOY"
          test -z "\${extra:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          node tooling/ci/release-candidate.mjs "$expected_sha"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: \${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: \${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-prove canonical MySQL backup and restore on current source
        id: dr
        env:
          GH_TOKEN: \${{ github.token }}
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
          RENDER_PRODUCTION_API_KEY: \${{ secrets.RENDER_PRODUCTION_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.render.com/v1'
          auth="Authorization: Bearer $RENDER_PRODUCTION_API_KEY"

          curl --fail --silent --show-error \
            --header "$auth" \
            --header 'Accept: application/json' \
            "$api/services/srv-datbsavlot8c73evbhj0/deploys?limit=20" \
            > /tmp/mysql-deploys.json
          source_sha="$(
            jq -r '[.[] | (.deploy // .) | select(.status == "live")][0].commit.id // empty' \
              /tmp/mysql-deploys.json
          )"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          run_id="$(
            gh run list \
              --workflow production-mysql-backup-restore-proof.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          valid=''
          if [ -n "$run_id" ]; then
            rm -rf /tmp/dr-evidence
            mkdir -p /tmp/dr-evidence
            if gh run download "$run_id" \
              --name "production-mysql-backup-restore-proof-$run_id" \
              --dir /tmp/dr-evidence >/dev/null 2>&1
            then
              if jq -e \
                --arg tool "$EXPECTED_SHA" \
                --arg source "$source_sha" \
                '.status == "pass" and
                 .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
                 .toolSha == $tool and
                 .sourceSha == $source and
                 .restore.schemaCount == 13 and
                 .restore.totalTables == 91 and
                 .restore.rowCountsMatch == true and
                 .restore.checksumsMatch == true and
                 .restore.leastPrivilegeReadback == true' \
                /tmp/dr-evidence/production-mysql-backup-restore-evidence.json >/dev/null
              then
                valid=true
              fi
            fi
          fi

          if [ "$valid" != true ]; then
            before="$(date -u +%s)"
            gh workflow run production-mysql-backup-restore-proof.yml \
              --ref main \
              -f expected_sha="$EXPECTED_SHA" \
              -f source_mysql_sha="$source_sha" \
              -f confirm_dr=BACKUP_RESTORE

            run_id=''
            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow production-mysql-backup-restore-proof.yml \
                  --event workflow_dispatch \
                  --commit "$EXPECTED_SHA" \
                  --limit 10 \
                  --json databaseId,createdAt \
                | jq -r --argjson before "$before" \
                    '[.[] | select((.createdAt | fromdateiso8601) >= $before)][0].databaseId // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status

            rm -rf /tmp/dr-evidence
            mkdir -p /tmp/dr-evidence
            gh run download "$run_id" \
              --name "production-mysql-backup-restore-proof-$run_id" \
              --dir /tmp/dr-evidence
            jq -e \
              --arg tool "$EXPECTED_SHA" \
              --arg source "$source_sha" \
              '.status == "pass" and
               .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
               .toolSha == $tool and
               .sourceSha == $source and
               .restore.schemaCount == 13 and
               .restore.totalTables == 91 and
               .restore.rowCountsMatch == true and
               .restore.checksumsMatch == true and
               .restore.leastPrivilegeReadback == true' \
              /tmp/dr-evidence/production-mysql-backup-restore-evidence.json >/dev/null
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "PASS: production MySQL DR run $run_id, source $source_sha"

      - name: Ensure exact-head release gates
        env:
          GH_TOKEN: \${{ github.token }}
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_workflow() {
            workflow="$1"
            run_id="$(
              gh run list \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --commit "$EXPECTED_SHA" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [ -n "$run_id" ]; then
              echo "REUSE: $workflow run $run_id"
              return
            fi

            before="$(date -u +%s)"
            gh workflow run "$workflow" --ref main
            run_id=''
            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --commit "$EXPECTED_SHA" \
                  --limit 10 \
                  --json databaseId,createdAt \
                | jq -r --argjson before "$before" \
                    '[.[] | select((.createdAt | fromdateiso8601) >= $before)][0].databaseId // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status
          }

          ensure_workflow final-release-acceptance.yml
          ensure_workflow dependency-security-audit.yml
          ensure_workflow security-scanning.yml

      - name: Build or reuse exact immutable OCI release
        id: image
        env:
          GH_TOKEN: \${{ github.token }}
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --workflow release-oci-image.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          if [ -z "$run_id" ]; then
            before="$(date -u +%s)"
            gh workflow run release-oci-image.yml --ref main -f expected_sha="$EXPECTED_SHA"
            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow release-oci-image.yml \
                  --event workflow_dispatch \
                  --commit "$EXPECTED_SHA" \
                  --limit 10 \
                  --json databaseId,createdAt \
                | jq -r --argjson before "$before" \
                    '[.[] | select((.createdAt | fromdateiso8601) >= $before)][0].databaseId // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status
          fi

          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$run_id" \
            --name "release-provenance-$EXPECTED_SHA" \
            --dir /tmp/release-provenance
          digest="$(jq -r '.digest // empty' /tmp/release-provenance/release-provenance.json)"
          tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg tree "$tree" \
            --arg digest "$digest" \
            '.source_sha == $sha and .tree_sha == $tree and .digest == $digest' \
            /tmp/release-provenance/release-provenance.json >/dev/null
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require anonymously pullable immutable image before production mutation
        env:
          GH_TOKEN: \${{ github.token }}
          IMAGE_DIGEST: \${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          if ! docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              /user/packages/container/morro-digital-v2 \
              -f visibility=public >/dev/null
          fi
          docker buildx imagetools inspect "$image_ref" >/dev/null

      - name: Re-prove OCI promotion contract
        id: oci_gate
        env:
          GH_TOKEN: \${{ github.token }}
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
          IMAGE_DIGEST: \${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --workflow oci-release-promotion-gate.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          if [ -z "$run_id" ]; then
            before="$(date -u +%s)"
            gh workflow run oci-release-promotion-gate.yml \
              --ref main \
              -f expected_sha="$EXPECTED_SHA" \
              -f image_digest="$IMAGE_DIGEST"
            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow oci-release-promotion-gate.yml \
                  --event workflow_dispatch \
                  --commit "$EXPECTED_SHA" \
                  --limit 10 \
                  --json databaseId,createdAt \
                | jq -r --argjson before "$before" \
                    '[.[] | select((.createdAt | fromdateiso8601) >= $before)][0].databaseId // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Reconfirm exact main immediately before cutover
        env:
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$EXPECTED_SHA"

      - name: Execute rollback-safe canonical database cutover
        id: cutover
        env:
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
          IMAGE_DIGEST: \${{ steps.image.outputs.digest }}
          RENDER_PRODUCTION_API_KEY: \${{ secrets.RENDER_PRODUCTION_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node tooling/render/production-application-cutover.mjs

      - name: Exact release identity and TEST-safe runtime smoke
        env:
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
          MORRO_V2_BASE_URL: \${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          identity="$(pnpm --silent release:identity:smoke)"
          observed="$(printf '%s\n' "$identity" | tail -n 1 | jq -r '.releaseSha // empty')"
          test "$observed" = "$EXPECTED_SHA"
          pnpm --silent payments:render:smoke

      - name: Publish canonical cutover evidence
        if: always()
        env:
          EXPECTED_SHA: \${{ steps.authority.outputs.expected_sha }}
          IMAGE_DIGEST: \${{ steps.image.outputs.digest }}
          DR_RUN_ID: \${{ steps.dr.outputs.run_id }}
          DR_SOURCE_SHA: \${{ steps.dr.outputs.source_sha }}
          RELEASE_IMAGE_RUN_ID: \${{ steps.image.outputs.run_id }}
          OCI_GATE_RUN_ID: \${{ steps.oci_gate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f production-cutover-evidence.json ]; then
            jq \
              --arg drRun "$DR_RUN_ID" \
              --arg drSource "$DR_SOURCE_SHA" \
              --arg imageRun "$RELEASE_IMAGE_RUN_ID" \
              --arg ociGate "$OCI_GATE_RUN_ID" \
              '.proofGraph = {
                drRunId:$drRun,
                drSourceSha:$drSource,
                releaseImageRunId:$imageRun,
                ociPromotionGateRunId:$ociGate
              }' \
              production-cutover-evidence.json > production-cutover-evidence.final.json
          else
            jq -n \
              --arg sha "$EXPECTED_SHA" \
              --arg digest "$IMAGE_DIGEST" \
              --arg drRun "$DR_RUN_ID" \
              --arg drSource "$DR_SOURCE_SHA" \
              '{contract:"MORRO-CANONICAL-PRODUCTION-DATABASE-CUTOVER",
                status:"workflow_failed",
                expectedSha:$sha,
                imageDigest:$digest,
                drRunId:$drRun,
                drSourceSha:$drSource}' \
              > production-cutover-evidence.final.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: canonical-production-database-cutover-\${{ github.run_id }}
          path: production-cutover-evidence.final.json
          if-no-files-found: error
          retention-days: 90
