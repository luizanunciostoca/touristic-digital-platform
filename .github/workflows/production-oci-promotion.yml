name: Production OCI Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Optional immutable sha256 digest; omitted values are resolved from the certified OCI build
        required: false
        default: ""
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  deployments: write

concurrency:
  group: production-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2.onrender.com
  RENDER_WORKSPACE_ID: tea-d9p09oks728c7381s990
  RENDER_PRODUCTION_MYSQL_SERVICE_ID: srv-datbsavlot8c73evbhj0

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/run-production-cutover '))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      expected_sha: ${{ steps.invocation.outputs.expected_sha }}
      image_digest: ${{ steps.orchestrate.outputs.image_digest }}
      confirm_deploy: ${{ steps.invocation.outputs.confirm_deploy }}
      dr_run_id: ${{ steps.orchestrate.outputs.dr_run_id }}
      dr_requested_at: ${{ steps.orchestrate.outputs.dr_requested_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact owner-authorized cutover invocation
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_DIGEST: ${{ inputs.image_digest }}
          INPUT_CONFIRM: ${{ inputs.confirm_deploy }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_sha="$INPUT_SHA"
            requested_digest="$INPUT_DIGEST"
            confirm_deploy="$INPUT_CONFIRM"
          else
            read -r command expected_sha confirm_deploy extra <<<"$COMMENT_BODY"
            test "$command" = "/run-production-cutover"
            test -z "${extra:-}"
            requested_digest=""
          fi

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$requested_digest" ]; then
            [[ "$requested_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          test "$confirm_deploy" = "DEPLOY"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$expected_sha"

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "requested_digest=$requested_digest" >> "$GITHUB_OUTPUT"
          echo "confirm_deploy=$confirm_deploy" >> "$GITHUB_OUTPUT"

      - name: Prove frozen candidate identity
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

      - name: Resolve and execute prerequisite proof graph
        id: orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          REQUESTED_DIGEST: ${{ steps.invocation.outputs.requested_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          latest_success() {
            local workflow="$1"
            gh run list               --workflow "$workflow"               --commit "$EXPECTED_SHA"               --status success               --limit 30               --json databaseId,headSha             | jq -r --arg sha "$EXPECTED_SHA"                 '[.[] | select(.headSha == $sha)][0].databaseId // empty'
          }

          dispatch_wait() {
            local workflow="$1"
            shift
            local before run_id
            before="$(
              gh run list                 --workflow "$workflow"                 --limit 30                 --json databaseId               | jq '[.[].databaseId] | max // 0'
            )"

            gh workflow run "$workflow" --ref main "$@" >&2

            run_id=""
            for _ in $(seq 1 90); do
              run_id="$(
                gh run list                   --workflow "$workflow"                   --event workflow_dispatch                   --commit "$EXPECTED_SHA"                   --limit 30                   --json databaseId,headSha                 | jq -r                     --arg sha "$EXPECTED_SHA"                     --argjson before "$before"                     '[.[] |
                      select(.headSha == $sha and .databaseId > $before)] |
                     sort_by(.databaseId) |
                     .[0].databaseId // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status --interval 10 >&2
            printf '%s' "$run_id"
          }

          ensure_success() {
            local workflow="$1"
            shift
            local run_id
            run_id="$(latest_success "$workflow")"
            if [ -z "$run_id" ]; then
              run_id="$(dispatch_wait "$workflow" "$@")"
            fi
            printf '%s' "$run_id"
          }

          candidate_run_id="$(
            ensure_success release-candidate-certification.yml
          )"
          quality_run_id="$(ensure_success quality.yml)"
          dependency_run_id="$(ensure_success dependency-security-audit.yml)"
          security_run_id="$(ensure_success security-scanning.yml)"
          acceptance_run_id="$(ensure_success final-release-acceptance.yml)"

          image_run_id="$(latest_success release-oci-image.yml)"
          if [ -z "$image_run_id" ]; then
            image_run_id="$(
              dispatch_wait release-oci-image.yml                 -f expected_sha="$EXPECTED_SHA"
            )"
          fi

          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$image_run_id"             --name "release-provenance-$EXPECTED_SHA"             --dir /tmp/release-provenance
          provenance="/tmp/release-provenance/release-provenance.json"
          test -s "$provenance"
          tree_sha="$(git rev-parse "$EXPECTED_SHA^{tree}")"
          image_digest="$(jq -r '.digest // empty' "$provenance")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e             --arg sha "$EXPECTED_SHA"             --arg tree "$tree_sha"             --arg image "$IMAGE_REPOSITORY"             --arg digest "$image_digest"             '.source_sha == $sha and .tree_sha == $tree and .digest == $digest and
             .image == $image'             "$provenance" >/dev/null
          if [ -n "$REQUESTED_DIGEST" ]; then
            test "$REQUESTED_DIGEST" = "$image_digest"
          fi

          provision_run_id="$(
            ensure_success production-mysql-render-provision.yml               -f expected_sha="$EXPECTED_SHA"               -f confirm_provision=PROVISION
          )"

          bootstrap_run_id=""
          rm -rf /tmp/bootstrap-proof
          mkdir -p /tmp/bootstrap-proof
          while read -r candidate_run; do
            [ -n "$candidate_run" ] || continue
            rm -rf /tmp/bootstrap-proof/*
            if gh run download "$candidate_run"               --name "production-mysql-canonical-bootstrap-$candidate_run"               --dir /tmp/bootstrap-proof >/dev/null 2>&1
            then
              evidence="/tmp/bootstrap-proof/production-mysql-canonical-bootstrap-evidence.json"
              if jq -e                 --arg sha "$EXPECTED_SHA"                 --arg digest "$image_digest"                 '.status == "pass" and
                 .contractVersion >= 3 and
                 .expectedSha == $sha and
                 .provenance.imageDigest == $digest and
                 .runtimeUsers.status == "pass" and
                 .runtimeUsers.runtimeUsers == 13 and
                 .runtimeUsers.allowedSchemaPrivilegesPerUser == 4 and
                 .runtimeUsers.schemaPrivilegeEntries == 52 and
                 .runtimeUsers.crossDomainDenied == 156 and
                 .runtimeUsers.globalPrivilegeEntries == 0 and
                 .bootstrap.status == "pass" and
                 .bootstrap.expectedSha == $sha and
                 .bootstrap.idempotent == true and
                 .bootstrap.runs == 2 and
                 .bootstrap.totalTables == 91'                 "$evidence" >/dev/null 2>&1
              then
                bootstrap_run_id="$candidate_run"
                break
              fi
            fi
          done < <(
            gh run list               --workflow production-mysql-canonical-bootstrap.yml               --commit "$EXPECTED_SHA"               --status success               --limit 30               --json databaseId,headSha             | jq -r --arg sha "$EXPECTED_SHA"                 '.[] | select(.headSha == $sha) | .databaseId'
          )

          if [ -z "$bootstrap_run_id" ]; then
            bootstrap_run_id="$(
              dispatch_wait production-mysql-canonical-bootstrap.yml                 -f expected_sha="$EXPECTED_SHA"                 -f image_digest="$image_digest"                 -f confirm_bootstrap=BOOTSTRAP
            )"
            rm -rf /tmp/bootstrap-proof
            mkdir -p /tmp/bootstrap-proof
            gh run download "$bootstrap_run_id"               --name "production-mysql-canonical-bootstrap-$bootstrap_run_id"               --dir /tmp/bootstrap-proof
            evidence="/tmp/bootstrap-proof/production-mysql-canonical-bootstrap-evidence.json"
            jq -e               --arg sha "$EXPECTED_SHA"               --arg digest "$image_digest"               '.status == "pass" and
               .contractVersion >= 3 and
               .expectedSha == $sha and
               .provenance.imageDigest == $digest and
               .runtimeUsers.status == "pass" and
               .runtimeUsers.runtimeUsers == 13 and
               .runtimeUsers.allowedSchemaPrivilegesPerUser == 4 and
               .runtimeUsers.schemaPrivilegeEntries == 52 and
               .runtimeUsers.crossDomainDenied == 156 and
               .runtimeUsers.globalPrivilegeEntries == 0 and
               .bootstrap.status == "pass" and
               .bootstrap.expectedSha == $sha and
               .bootstrap.idempotent == true and
               .bootstrap.runs == 2 and
               .bootstrap.totalTables == 91'               "$evidence" >/dev/null
          fi

          staging_run_id="$(
            dispatch_wait staging-oci-promotion.yml \
              -f expected_sha="$EXPECTED_SHA" \
              -f image_digest="$image_digest" \
              -f confirm_deploy=DEPLOY
          )"
          rm -rf /tmp/staging-proof
          mkdir -p /tmp/staging-proof
          gh run download "$staging_run_id" \
            --name "staging-oci-deployment-evidence-$staging_run_id" \
            --dir /tmp/staging-proof
          staging_evidence="/tmp/staging-proof/oci-deployment-evidence.txt"
          test -s "$staging_evidence"
          grep -Fxq "expected_sha=$EXPECTED_SHA" "$staging_evidence"
          grep -Fxq "digest=$image_digest" "$staging_evidence"
          grep -Fxq "image=$IMAGE_REPOSITORY" "$staging_evidence"
          grep -Fxq "target_url=https://morro-digital-v2-staging.onrender.com" "$staging_evidence"
          staging_deploy_id="$(sed -n 's/^render_deploy_id=//p' "$staging_evidence" | head -n1)"
          test -n "$staging_deploy_id"
          test "$staging_deploy_id" != "unknown"
          echo "PASS: staging promoted exact artifact run=$staging_run_id deploy=$staging_deploy_id" >&2

          # DR is deliberately never reused: every cutover invocation creates
          # a fresh encrypted backup/restore proof after MySQL reconciliation.
          dr_requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dr_run_id="$(
            dispatch_wait production-mysql-backup-restore-proof.yml               -f expected_sha="$EXPECTED_SHA"               -f source_mysql_sha="$EXPECTED_SHA"               -f confirm_dr=BACKUP_RESTORE
          )"

          rm -rf /tmp/dr-proof
          mkdir -p /tmp/dr-proof
          gh run download "$dr_run_id"             --name "production-mysql-backup-restore-proof-$dr_run_id"             --dir /tmp/dr-proof
          dr_evidence="/tmp/dr-proof/production-mysql-backup-restore-evidence.json"
          jq -e             --arg sha "$EXPECTED_SHA"             '.status == "pass" and
             .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
             .toolSha == $sha and
             .sourceSha == $sha and
             .source.schemaCount == 13 and
             .source.totalTables == 91 and
             .source.stableDuringBackup == true and
             .restore.schemaCount == 13 and
             .restore.totalTables == 91 and
             .restore.rowCountsMatch == true and
             .restore.checksumsMatch == true and
             .restore.leastPrivilegeReadback == true'             "$dr_evidence" >/dev/null

          oci_gate_run_id="$(
            dispatch_wait oci-release-promotion-gate.yml               -f expected_sha="$EXPECTED_SHA"               -f image_digest="$image_digest"
          )"
          rm -rf /tmp/oci-gate
          mkdir -p /tmp/oci-gate
          gh run download "$oci_gate_run_id"             --name "oci-promotion-gate-evidence-$oci_gate_run_id"             --dir /tmp/oci-gate
          oci_evidence="/tmp/oci-gate/oci-promotion-gate-evidence.json"
          jq -e             --arg sha "$EXPECTED_SHA"             --arg digest "$image_digest"             '.status == "pass" and
             .sourceSha == $sha and
             .imageDigest == $digest'             "$oci_evidence" >/dev/null

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          jq -n             --arg sourceSha "$EXPECTED_SHA"             --arg imageDigest "$image_digest"             --arg candidateRunId "$candidate_run_id"             --arg qualityRunId "$quality_run_id"             --arg dependencyRunId "$dependency_run_id"             --arg securityRunId "$security_run_id"             --arg acceptanceRunId "$acceptance_run_id"             --arg imageRunId "$image_run_id"             --arg provisionRunId "$provision_run_id"             --arg bootstrapRunId "$bootstrap_run_id"             --arg stagingRunId "$staging_run_id"             --arg drRunId "$dr_run_id"             --arg ociGateRunId "$oci_gate_run_id"             '{
              contract:"MORRO-PRODUCTION-CUTOVER-PREFLIGHT",
              contractVersion:1,
              status:"pass",
              sourceSha:$sourceSha,
              imageDigest:$imageDigest,
              freshDr:true,
              runs:{
                candidate:$candidateRunId,
                quality:$qualityRunId,
                dependencySecurity:$dependencyRunId,
                security:$securityRunId,
                finalAcceptance:$acceptanceRunId,
                releaseImage:$imageRunId,
                mysqlProvision:$provisionRunId,
                mysqlBootstrap:$bootstrapRunId,
                stagingPromotion:$stagingRunId,
                backupRestore:$drRunId,
                ociGate:$ociGateRunId
              }
            }' > production-cutover-preflight-evidence.json

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "dr_run_id=$dr_run_id" >> "$GITHUB_OUTPUT"
          echo "dr_requested_at=$dr_requested_at" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-cutover-preflight-evidence-${{ github.run_id }}
          path: production-cutover-preflight-evidence.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: preflight
    if: needs.preflight.outputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rehydrate exact DR evidence
        id: dr
        env:
          GH_TOKEN: ${{ github.token }}
          DR_RUN_ID: ${{ needs.preflight.outputs.dr_run_id }}
          DR_REQUESTED_AT: ${{ needs.preflight.outputs.dr_requested_at }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_meta="$(gh run view "$DR_RUN_ID" --json headSha,event,status,conclusion,createdAt)"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg requested "$DR_REQUESTED_AT" \
            '.headSha == $sha and
             .event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .createdAt >= $requested' <<<"$run_meta" >/dev/null

          rm -rf /tmp/production-dr-evidence
          mkdir -p /tmp/production-dr-evidence
          gh run download "$DR_RUN_ID"             --name "production-mysql-backup-restore-proof-$DR_RUN_ID"             --dir /tmp/production-dr-evidence
          evidence="/tmp/production-dr-evidence/production-mysql-backup-restore-evidence.json"
          test -s "$evidence"
          jq -e             --arg sha "$EXPECTED_SHA" --arg run "$DR_RUN_ID"             '.status == "pass" and
             .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
             .toolSha == $sha and
             .runId == $run and
             .sourceSha == $sha and
             .source.schemaCount == 13 and
             .source.totalTables == 91 and
             .restore.schemaCount == 13 and
             .restore.totalTables == 91 and
             .restore.rowCountsMatch == true and
             .restore.checksumsMatch == true and
             .restore.leastPrivilegeReadback == true'             "$evidence" >/dev/null
          source_sha="$(jq -r '.sourceSha // empty' "$evidence")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$source_sha" = "$EXPECTED_SHA"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Reconfirm exact main and fresh DR immediately before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          DR_RUN_ID: ${{ needs.preflight.outputs.dr_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA"

          dr_state="$(gh run view "$DR_RUN_ID" --json headSha,status,conclusion,updatedAt)"
          test "$(jq -r '.headSha' <<<"$dr_state")" = "$EXPECTED_SHA"
          test "$(jq -r '.status' <<<"$dr_state")" = "completed"
          test "$(jq -r '.conclusion' <<<"$dr_state")" = "success"
          dr_updated="$(jq -r '.updatedAt' <<<"$dr_state")"
          dr_epoch="$(date -u -d "$dr_updated" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - dr_epoch))"
          test "$age_seconds" -ge 0
          test "$age_seconds" -le 1800
          echo "Fresh DR proof confirmed: run=$DR_RUN_ID age_seconds=$age_seconds"

      - name: Execute fail-closed canonical database cutover
        id: cutover
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_GHCR_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_GHCR_REGISTRY_CREDENTIAL_ID }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
          EXPECTED_MYSQL_SOURCE_SHA: ${{ steps.dr.outputs.source_sha }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_PRODUCTION_API_KEY"
          test -n "$RENDER_PRODUCTION_SERVICE_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA"
          node tooling/render/production-canonical-db-cutover.mjs cutover

      - name: Wait for exact-SHA health and readiness
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Roll back source and database config on failed verification
        if: failure()
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-state.json ]; then
            node tooling/render/production-canonical-db-cutover.mjs rollback
          else
            echo "No cutover state exists; no production mutation requires rollback."
          fi

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-evidence.json ]; then
            cp /tmp/morro-production-cutover-evidence.json production-canonical-db-cutover-evidence.json
          else
            jq -n               --arg expectedSha "$EXPECTED_SHA"               --arg imageDigest "$IMAGE_DIGEST"               '{contract:"MORRO-CANONICAL-PRODUCTION-DATABASE-CUTOVER",status:"no-evidence",expectedSha:$expectedSha,imageDigest:$imageDigest}'               > production-canonical-db-cutover-evidence.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-oci-deployment-evidence-${{ github.run_id }}
          path: production-canonical-db-cutover-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Destroy ephemeral rollback state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/morro-production-cutover-state.json
