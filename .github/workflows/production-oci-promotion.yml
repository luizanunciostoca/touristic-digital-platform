name: Production OCI Promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA approved for immutable image promotion
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest produced by Release OCI Image
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to authorize this deployment
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: production-oci-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/morro-digital-v2
  TARGET_URL: https://morro-digital-v2.onrender.com
  RENDER_WORKSPACE_ID: tea-d9p09oks728c7381s990
  RENDER_PRODUCTION_MYSQL_SERVICE_ID: srv-datbsavlot8c73evbhj0

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/run-production-oci-promotion '))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      expected_sha: ${{ steps.invocation.outputs.expected_sha }}
      image_digest: ${{ steps.invocation.outputs.image_digest }}
      confirm_deploy: ${{ steps.invocation.outputs.confirm_deploy }}
      dr_run_id: ${{ steps.gates.outputs.dr_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact owner-authorized invocation
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_DIGEST: ${{ inputs.image_digest }}
          INPUT_CONFIRM: ${{ inputs.confirm_deploy }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_sha="$INPUT_SHA"
            image_digest="$INPUT_DIGEST"
            confirm_deploy="$INPUT_CONFIRM"
          else
            read -r command expected_sha image_digest confirm_deploy extra <<<"$COMMENT_BODY"
            test "$command" = "/run-production-oci-promotion"
            test -z "${extra:-}"
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$confirm_deploy" = "DEPLOY"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$expected_sha"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "confirm_deploy=$confirm_deploy" >> "$GITHUB_OUTPUT"

      - name: Prove frozen candidate provenance
        env:
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ steps.invocation.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node tooling/ci/release-candidate.mjs "$EXPECTED_SHA"

      - name: Re-prove immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ steps.invocation.outputs.image_digest }}
          IMAGE_DIGEST: ${{ steps.invocation.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh run list               --workflow release-oci-image.yml               --commit "$EXPECTED_SHA"               --status success               --limit 20               --json databaseId,headSha               --jq --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
          )"
          test -n "$run_id"
          rm -rf /tmp/release-provenance
          mkdir -p /tmp/release-provenance
          gh run download "$run_id"             --name "release-provenance-$EXPECTED_SHA"             --dir /tmp/release-provenance
          expected_tree="$(git rev-parse "$EXPECTED_SHA^{tree}")"
          jq -e             --arg sha "$EXPECTED_SHA"             --arg tree "$expected_tree"             --arg digest "$IMAGE_DIGEST"             '.source_sha == $sha and .tree_sha == $tree and .digest == $digest'             /tmp/release-provenance/release-provenance.json >/dev/null
          echo "PASS: immutable image $IMAGE_REPOSITORY@$IMAGE_DIGEST from run $run_id"

      - name: Re-prove mandatory release and DR gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.invocation.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in             final-release-acceptance.yml             dependency-security-audit.yml             security-scanning.yml
          do
            run_id="$(
              gh run list                 --workflow "$workflow"                 --commit "$EXPECTED_SHA"                 --status success                 --limit 30                 --json databaseId,headSha                 --jq --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
            )"
            test -n "$run_id"
            echo "PASS: $workflow run $run_id @ $EXPECTED_SHA"
          done

          gate_run_id=""
          rm -rf /tmp/oci-gate
          mkdir -p /tmp/oci-gate
          while read -r candidate_run; do
            [ -n "$candidate_run" ] || continue
            rm -rf /tmp/oci-gate/*
            if gh run download "$candidate_run" \
              --name "oci-promotion-gate-evidence-$candidate_run" \
              --dir /tmp/oci-gate >/dev/null 2>&1
            then
              evidence="/tmp/oci-gate/oci-promotion-gate-evidence.json"
              if jq -e \
                --arg sha "$EXPECTED_SHA" \
                --arg digest "$IMAGE_DIGEST" \
                '.status == "pass" and
                 .sourceSha == $sha and
                 .imageDigest == $digest' \
                "$evidence" >/dev/null 2>&1
              then
                gate_run_id="$candidate_run"
                break
              fi
            fi
          done < <(
            gh run list \
              --workflow oci-release-promotion-gate.yml \
              --commit "$EXPECTED_SHA" \
              --status success \
              --limit 30 \
              --json databaseId,headSha \
            | jq -r --arg sha "$EXPECTED_SHA" '.[] | select(.headSha == $sha) | .databaseId'
          )
          test -n "$gate_run_id"
          echo "PASS: digest-bound OCI promotion gate run $gate_run_id @ $EXPECTED_SHA / $IMAGE_DIGEST"

          dr_run_id="$(
            gh run list               --workflow production-mysql-backup-restore-proof.yml               --commit "$EXPECTED_SHA"               --status success               --limit 30               --json databaseId,headSha               --jq --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
          )"
          test -n "$dr_run_id"
          echo "dr_run_id=$dr_run_id" >> "$GITHUB_OUTPUT"
          echo "PASS: production MySQL backup/restore run $dr_run_id @ $EXPECTED_SHA"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ env.TARGET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.expected_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rehydrate exact DR evidence
        id: dr
        env:
          GH_TOKEN: ${{ github.token }}
          DR_RUN_ID: ${{ needs.preflight.outputs.dr_run_id }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/production-dr-evidence
          mkdir -p /tmp/production-dr-evidence
          gh run download "$DR_RUN_ID"             --name "production-mysql-backup-restore-proof-$DR_RUN_ID"             --dir /tmp/production-dr-evidence
          evidence="/tmp/production-dr-evidence/production-mysql-backup-restore-evidence.json"
          test -s "$evidence"
          jq -e             --arg sha "$EXPECTED_SHA"             '.status == "pass" and
             .result == "PRODUCTION_MYSQL_BACKUP_RESTORE_PROOF = PASS" and
             .toolSha == $sha and
             .source.schemaCount == 13 and
             .source.totalTables == 91 and
             .restore.schemaCount == 13 and
             .restore.totalTables == 91 and
             .restore.rowCountsMatch == true and
             .restore.checksumsMatch == true and
             .restore.leastPrivilegeReadback == true'             "$evidence" >/dev/null
          source_sha="$(jq -r '.sourceSha // empty' "$evidence")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Execute fail-closed canonical database cutover
        id: cutover
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_GHCR_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_GHCR_REGISTRY_CREDENTIAL_ID }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
          EXPECTED_MYSQL_SOURCE_SHA: ${{ steps.dr.outputs.source_sha }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_PRODUCTION_API_KEY"
          test -n "$RENDER_PRODUCTION_SERVICE_ID"
          node tooling/render/production-canonical-db-cutover.mjs cutover

      - name: Wait for exact-SHA health and readiness
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          MORRO_V2_BASE_URL: ${{ env.TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail
          last_output=''
          for _ in $(seq 1 120); do
            if output="$(pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$output"
                exit 0
              fi
              last_output="$output"
            else
              last_output="$output"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          exit 1

      - name: Roll back source and database config on failed verification
        if: failure()
        env:
          RENDER_PRODUCTION_API_KEY: ${{ secrets.RENDER_PRODUCTION_API_KEY }}
          CUTOVER_STATE_FILE: /tmp/morro-production-cutover-state.json
          CUTOVER_EVIDENCE_FILE: /tmp/morro-production-cutover-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-state.json ]; then
            node tooling/render/production-canonical-db-cutover.mjs rollback
          else
            echo "No cutover state exists; no production mutation requires rollback."
          fi

      - name: Publish deployment evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/morro-production-cutover-evidence.json ]; then
            cp /tmp/morro-production-cutover-evidence.json production-canonical-db-cutover-evidence.json
          else
            jq -n               --arg expectedSha "$EXPECTED_SHA"               --arg imageDigest "$IMAGE_DIGEST"               '{contract:"MORRO-CANONICAL-PRODUCTION-DATABASE-CUTOVER",status:"no-evidence",expectedSha:$expectedSha,imageDigest:$imageDigest}'               > production-canonical-db-cutover-evidence.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-oci-deployment-evidence-${{ github.run_id }}
          path: production-canonical-db-cutover-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Destroy ephemeral rollback state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/morro-production-cutover-state.json
