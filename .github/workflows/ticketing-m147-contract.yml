name: Ticketing M147 Contract

on:
  pull_request:
    paths:
      - "packages/ticketing/**"
      - "services/ticketing/**"
      - "packages/ordering/**"
      - "packages/financial/**"
      - "docs/qa/TICKETING-M147-EVIDENCE.md"
      - "docs/features/registry.json"
      - ".github/workflows/ticketing-m147-contract.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/ticketing/**"
      - "services/ticketing/**"
      - "packages/ordering/**"
      - "packages/financial/**"
      - "docs/qa/TICKETING-M147-EVIDENCE.md"
      - "docs/features/registry.json"
      - ".github/workflows/ticketing-m147-contract.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketing-m147-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticketing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m147-ticketing@127.0.0.1:3306/mysql
      TICKETING_DATABASE_URL: mysql://root:m147-ticketing@127.0.0.1:3306/ticketing_m147_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Ticketing contracts with overlapped MySQL provisioning
        run: |
          set -euo pipefail

          mysql_container="ticketing-m147-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mysql_pull_log=/tmp/m147-mysql-pull.log

          finish() {
            status=$?
            trap - EXIT
            if (( status != 0 )); then
              cat "$mysql_pull_log" 2>/dev/null || true
              docker logs "$mysql_container" 2>/dev/null || true
            fi
            docker rm --force "$mysql_container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap finish EXIT

          docker pull mysql:8.4 >"$mysql_pull_log" 2>&1 &
          mysql_pull_pid=$!

          (
            set -euo pipefail
            pnpm --filter @touristic/ticketing lint
            pnpm --filter @touristic/ticketing typecheck
            pnpm --filter @touristic/ticketing-server lint
            pnpm --filter @touristic/ticketing-server typecheck
          ) &
          static_validation_pid=$!

          mysql_pull_status=0
          wait "$mysql_pull_pid" || mysql_pull_status=$?
          if (( mysql_pull_status != 0 )); then
            wait "$static_validation_pid" || true
            exit "$mysql_pull_status"
          fi

          docker run --detach \
            --name "$mysql_container" \
            --env MYSQL_ROOT_PASSWORD=m147-ticketing \
            --publish 3306:3306 \
            --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1 -P 3306 -pm147-ticketing" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=20 \
            mysql:8.4 >/tmp/m147-mysql-container-id

          static_validation_status=0
          wait "$static_validation_pid" || static_validation_status=$?
          if (( static_validation_status != 0 )); then
            exit "$static_validation_status"
          fi

          pnpm turbo run build --filter=@touristic/ticketing-server...

          mysql_health=""
          for _ in $(seq 1 120); do
            mysql_health="$(docker inspect --format='{{.State.Health.Status}}' "$mysql_container")"
            if [[ "$mysql_health" == "healthy" ]]; then
              break
            fi
            if [[ "$mysql_health" == "unhealthy" ]]; then
              exit 1
            fi
            sleep .25
          done
          if [[ "$mysql_health" != "healthy" ]]; then
            exit 1
          fi

          mysql_ready_streak=0
          for _ in $(seq 1 20); do
            if docker exec -e MYSQL_PWD=m147-ticketing "$mysql_container" \
              mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot \
              --silent --skip-column-names -e "SELECT 1" | grep -qx "1"; then
              mysql_ready_streak=$((mysql_ready_streak + 1))
              if (( mysql_ready_streak >= 3 )); then
                break
              fi
            else
              mysql_ready_streak=0
            fi
            sleep .5
          done
          if (( mysql_ready_streak < 3 )); then
            exit 1
          fi

          pnpm --filter @touristic/ticketing test
          pnpm --filter @touristic/ticketing-server exec vitest run --passWithNoTests
