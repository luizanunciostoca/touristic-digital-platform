name: Ticketing M147 Contract

on:
  pull_request:
    paths:
      - "packages/ticketing/**"
      - "services/ticketing/**"
      - "packages/ordering/**"
      - "packages/financial/**"
      - "docs/qa/TICKETING-M147-EVIDENCE.md"
      - "docs/features/registry.json"
      - "docs/migration/MASTER-MIGRATION-TRACKER.md"
      - ".github/workflows/ticketing-m147-contract.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/ticketing/**"
      - "services/ticketing/**"
      - "packages/ordering/**"
      - "packages/financial/**"
      - "docs/qa/TICKETING-M147-EVIDENCE.md"
      - "docs/features/registry.json"
      - "docs/migration/MASTER-MIGRATION-TRACKER.md"
      - ".github/workflows/ticketing-m147-contract.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketing-m147-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticketing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m147-ticketing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm147-ticketing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m147-ticketing@127.0.0.1:3306/mysql
      TICKETING_DATABASE_URL: mysql://root:m147-ticketing@127.0.0.1:3306/ticketing_m147_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Ticketing runtime graph once
        run: pnpm turbo run build --filter=@touristic/ticketing-server...
      - name: Validate Ticketing domain and server contracts
        run: |
          set -euo pipefail

          (
            set -euo pipefail
            pnpm --filter @touristic/ticketing lint
            pnpm --filter @touristic/ticketing typecheck
            pnpm --filter @touristic/ticketing test
          ) &
          domain_pid=$!

          (
            set -euo pipefail
            pnpm --filter @touristic/ticketing-server lint
            pnpm --filter @touristic/ticketing-server typecheck
            pnpm --filter @touristic/ticketing-server exec vitest run --passWithNoTests
            pnpm --filter @touristic/ticketing-server exec vitest run src/mysql-integration.test.ts
          ) &
          server_pid=$!

          domain_status=0
          server_status=0
          wait "$domain_pid" || domain_status=$?
          wait "$server_pid" || server_status=$?

          if (( domain_status != 0 || server_status != 0 )); then
            exit 1
          fi
