name: Temporary Runtime Accessibility I18n Finalizer

on:
  push:
    branches:
      - fix/runtime-accessibility-i18n-parity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-accessibility-i18n-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch runtime and browser regression
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          entry_path = Path("apps/morro-digital-platform/src/browser-entry.ts")
          entry = entry_path.read_text()
          entry = replace_once(
              entry,
              'import { loadMapboxGlSdk } from "./runtime/mapbox-sdk-loader.js";\n',
              'import { loadMapboxGlSdk } from "./runtime/mapbox-sdk-loader.js";\nimport {\n  applyRuntimeAccessibilityPresentation,\n  formatRuntimeStatus,\n  localizedTourStopLabel,\n  type RuntimeStatusDescriptor,\n} from "./runtime/runtime-accessibility-i18n.js";\n',
              "runtime i18n import",
          )
          entry = replace_once(
              entry,
              '''function updateStatus(message: string): void {\n  if (status) status.textContent = message;\n}\n\nfunction formatTourStatus(tourId: string, markerCount: number): string {\n  const tour = getMorroTourById(tourId);\n  const pointLabel = markerCount === 1 ? "parada" : "paradas";\n  return `${markerCount} ${pointLabel} de ${tour?.title ?? tourId} carregadas.`;\n}\n''',
              '''let runtimeStatusDescriptor: RuntimeStatusDescriptor = Object.freeze({\n  kind: "initializing",\n});\n\nfunction renderRuntimeAccessibility(): void {\n  applyRuntimeAccessibilityPresentation(document);\n  if (status) {\n    status.textContent = formatRuntimeStatus(\n      runtimeStatusDescriptor,\n      document.documentElement.lang,\n    );\n  }\n}\n\nfunction updateStatus(descriptor: RuntimeStatusDescriptor): void {\n  runtimeStatusDescriptor = Object.freeze(descriptor);\n  renderRuntimeAccessibility();\n}\n\nconst runtimeAccessibilityLocaleObserver = new MutationObserver(() => {\n  renderRuntimeAccessibility();\n});\nruntimeAccessibilityLocaleObserver.observe(document.documentElement, {\n  attributes: true,\n  attributeFilter: ["lang"],\n});\nrenderRuntimeAccessibility();\n''',
              "status helpers",
          )
          entry = replace_once(
              entry,
              '''  element.dataset.stopIndex = String(stopIndex);\n  element.dataset.tourId = tourId;\n  element.setAttribute("aria-label", input.label ?? stop.title);\n''',
              '''  element.dataset.stopIndex = String(stopIndex);\n  element.dataset.tourId = tourId;\n  element.dataset.stopId = stopId;\n  element.setAttribute(\n    "aria-label",\n    localizedTourStopLabel(\n      tourId,\n      stopId,\n      document.documentElement.lang,\n    ) ??\n      input.label ??\n      stop.title,\n  );\n''',
              "tour marker accessibility label",
          )
          entry = replace_once(
              entry,
              '''    const message =\n      error instanceof Error ? error.message : "Falha desconhecida no SDK.";\n    updateStatus(`Mapbox indisponível; usando fallback da V1: ${message}`);\n''',
              '''    const detail = error instanceof Error ? error.message : undefined;\n    updateStatus({ kind: "map-fallback", mode: "using", ...(detail ? { detail } : {}) });\n''',
              "map fallback using",
          )
          entry = replace_once(
              entry,
              '''    const message =\n      error instanceof Error\n        ? error.message\n        : "Falha desconhecida ao inicializar o Mapbox.";\n    updateStatus(`Mapbox indisponível; restaurando fallback da V1: ${message}`);\n''',
              '''    const detail = error instanceof Error ? error.message : undefined;\n    updateStatus({\n      kind: "map-fallback",\n      mode: "restoring",\n      ...(detail ? { detail } : {}),\n    });\n''',
              "map fallback restoring",
          )
          entry = replace_once(
              entry,
              '''  updateStatus(\n    `Runtime ativo: ${result.startedModules.join(", ")} — provider ${result.geospatialEngine?.providerId ?? "indisponível"} — Home pronta para explorar.`,\n  );\n''',
              '''  updateStatus({\n    kind: "runtime-ready",\n    modules: result.startedModules,\n    providerId: result.geospatialEngine?.providerId,\n  });\n''',
              "runtime ready status",
          )
          entry = replace_once(
              entry,
              '    updateStatus("Atualizando o roteiro exibido no mapa…");\n',
              '    updateStatus({ kind: "tour-switching" });\n',
              "tour switching status",
          )
          entry = replace_once(
              entry,
              '''        updateStatus(\n          `Runtime ativo — ${formatTourStatus(selection.activeTourId, selection.markerCount)}`,\n        );\n''',
              '''        updateStatus({\n          kind: "tour-ready",\n          tourId: selection.activeTourId,\n          markerCount: selection.markerCount,\n        });\n''',
              "tour ready status",
          )
          entry = replace_once(
              entry,
              '''        const message =\n          error instanceof Error\n            ? error.message\n            : "Falha desconhecida ao trocar o roteiro.";\n        updateStatus(`Não foi possível trocar o roteiro: ${message}`);\n''',
              '''        const detail = error instanceof Error ? error.message : undefined;\n        updateStatus({\n          kind: "tour-error",\n          ...(detail ? { detail } : {}),\n        });\n''',
              "tour error status",
          )
          entry = replace_once(
              entry,
              '''  const message =\n    error instanceof Error ? error.message : "Falha desconhecida no runtime.";\n  updateStatus(`Falha ao iniciar o Morro Digital: ${message}`);\n''',
              '''  const detail = error instanceof Error ? error.message : undefined;\n  updateStatus({\n    kind: "runtime-error",\n    ...(detail ? { detail } : {}),\n  });\n''',
              "runtime error status",
          )
          entry_path.write_text(entry)

          browser_path = Path("apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs")
          browser = browser_path.read_text()
          browser = replace_once(
              browser,
              '''};\n\nconst filterValues = [\n''',
              '''};\n\nconst runtimeAccessibility = {\n  pt: {\n    selectAria: "Roteiro exibido no mapa",\n    firstTour: "Passeio Volta à Ilha",\n    statusNeedle: "Runtime ativo:",\n  },\n  en: {\n    selectAria: "Tour displayed on the map",\n    firstTour: "Island Round Trip",\n    statusNeedle: "Runtime active:",\n  },\n  es: {\n    selectAria: "Recorrido mostrado en el mapa",\n    firstTour: "Vuelta a la Isla",\n    statusNeedle: "Runtime activo:",\n  },\n  he: {\n    selectAria: "המסלול המוצג במפה",\n    firstTour: "סיבוב האי",\n    statusNeedle: "המערכת פעילה:",\n  },\n};\n\nconst filterValues = [\n''',
              "runtime browser expectations",
          )
          browser = replace_once(
              browser,
              '''async function setLanguage(page, language) {\n  await page.evaluate((next) => {\n    document.documentElement.lang = next;\n  }, language);\n}\n\nasync function waitCategory''',
              '''async function setLanguage(page, language) {\n  await page.evaluate((next) => {\n    document.documentElement.lang = next;\n  }, language);\n}\n\nasync function waitRuntimeAccessibility(page, locale, expected) {\n  const deadline = Date.now() + 5000;\n  let observed = null;\n  while (Date.now() < deadline) {\n    observed = await page.evaluate(() => {\n      const select = document.getElementById("tour-select");\n      const firstOption = select?.querySelector("option");\n      return {\n        selectAria: select?.getAttribute("aria-label") ?? null,\n        firstTour: firstOption?.textContent?.trim() ?? null,\n        status: document.getElementById("runtime-status")?.textContent?.trim() ?? "",\n      };\n    });\n    if (\n      observed.selectAria === expected.selectAria &&\n      observed.firstTour === expected.firstTour &&\n      observed.status.includes(expected.statusNeedle)\n    ) {\n      return;\n    }\n    await page.waitForTimeout(50);\n  }\n  throw new Error(\n    `runtime accessibility ${locale}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(observed)}`,\n  );\n}\n\nasync function waitCategory''',
              "runtime browser helper",
          )
          browser = replace_once(
              browser,
              '  await waitCategory(page, "beaches", "Praias", "Praias, 8 locais");\n',
              '  await waitCategory(page, "beaches", "Praias", "Praias, 8 locais");\n  await waitRuntimeAccessibility(page, "pt", runtimeAccessibility.pt);\n',
              "initial pt runtime assertion",
          )
          browser = replace_once(
              browser,
              '''    await setLanguage(page, locale);\n    const expected = filters[locale];\n''',
              '''    await setLanguage(page, locale);\n    await waitRuntimeAccessibility(page, locale, runtimeAccessibility[locale]);\n    const expected = filters[locale];\n''',
              "en es runtime assertions",
          )
          browser = replace_once(
              browser,
              '''  await setLanguage(page, "he");\n  await waitCategory(page, "beaches", filters.he.category, filters.he.aria);\n''',
              '''  await setLanguage(page, "he");\n  await waitRuntimeAccessibility(page, "he", runtimeAccessibility.he);\n  await waitCategory(page, "beaches", filters.he.category, filters.he.aria);\n''',
              "he runtime assertion",
          )
          browser = replace_once(
              browser,
              '''  await setLanguage(page, "en-US");\n  await waitCategory(\n''',
              '''  await setLanguage(page, "en-US");\n  await waitRuntimeAccessibility(page, "en-US", runtimeAccessibility.en);\n  await waitCategory(\n''',
              "en-us runtime assertion",
          )
          browser = replace_once(
              browser,
              '''  await setLanguage(page, "pt-BR");\n  await waitCategory(page, "beaches", "Praias", "Praias, 8 locais");\n''',
              '''  await setLanguage(page, "he");\n  await waitRuntimeAccessibility(page, "he", runtimeAccessibility.he);\n  await page.evaluate(() => {\n    const select = document.getElementById("tour-select");\n    if (!(select instanceof HTMLSelectElement)) throw new Error("tour-select missing");\n    select.value = "volta-a-ilha";\n    select.dispatchEvent(new Event("change", { bubbles: true }));\n  });\n  await page\n    .locator('#map[data-tour-state="ready"][data-active-tour="volta-a-ilha"]')\n    .waitFor({ state: "attached", timeout: 10000 });\n  const heMarker = page.locator(\n    '.tour-stop-marker[data-tour-id="volta-a-ilha"][data-stop-id="stop-1"]',\n  ).first();\n  await heMarker.waitFor({ state: "attached", timeout: 5000 });\n  equal(\n    await heMarker.getAttribute("aria-label"),\n    "יציאה: Terceira Praia",\n    "he tour marker aria label",\n  );\n  if (!(await page.locator("#runtime-status").textContent())?.includes("סיבוב האי")) {\n    throw new Error("he tour runtime status did not localize the active tour title");\n  }\n\n  await setLanguage(page, "en");\n  await waitRuntimeAccessibility(page, "en", runtimeAccessibility.en);\n  const markerDeadline = Date.now() + 5000;\n  while (Date.now() < markerDeadline) {\n    if ((await heMarker.getAttribute("aria-label")) === "Departure: Terceira Praia") break;\n    await page.waitForTimeout(50);\n  }\n  equal(\n    await heMarker.getAttribute("aria-label"),\n    "Departure: Terceira Praia",\n    "live language switch tour marker aria label",\n  );\n\n  await setLanguage(page, "pt-BR");\n  await waitRuntimeAccessibility(page, "pt-BR", runtimeAccessibility.pt);\n  await waitCategory(page, "beaches", "Praias", "Praias, 8 locais");\n''',
              "tour marker browser accessibility assertions",
          )
          browser_path.write_text(browser)

          workflow_path = Path(".github/workflows/explore-v1-i18n-browser-parity.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              '''      - apps/morro-digital-platform/src/layouts/app-shell.ts\n      - apps/morro-digital-platform/public/**\n''',
              '''      - apps/morro-digital-platform/src/layouts/app-shell.ts\n      - apps/morro-digital-platform/src/browser-entry.ts\n      - apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts\n      - apps/morro-digital-platform/src/config/tour-localization.ts\n      - apps/morro-digital-platform/public/**\n''',
              "browser workflow paths",
          )
          workflow_path.write_text(workflow)
          PY
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
      - name: Validate runtime accessibility i18n
        run: |
          pnpm --filter @touristic/morro-digital-platform test -- runtime-accessibility-i18n.test.ts
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
          git diff --check
      - name: Commit clean functional tree
        run: |
          rm .github/workflows/tmp-runtime-accessibility-i18n-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(i18n): localize runtime accessibility surfaces"
          git push origin HEAD:fix/runtime-accessibility-i18n-parity
