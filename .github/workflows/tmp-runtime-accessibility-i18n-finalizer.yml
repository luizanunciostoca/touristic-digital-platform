name: Temporary Runtime Accessibility I18n Finalizer

on:
  push:
    branches:
      - fix/runtime-accessibility-i18n-parity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-accessibility-i18n-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply functional integration
        run: python tooling/tmp-runtime-accessibility-i18n-finalizer.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
      - name: App tests
        run: pnpm --filter @touristic/morro-digital-platform test
      - name: App typecheck
        shell: bash
        run: |
          set +e
          pnpm --filter @touristic/morro-digital-platform typecheck >/tmp/runtime-i18n-typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/runtime-i18n-typecheck.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/runtime-i18n-typecheck.log tooling/tmp-runtime-accessibility-typecheck.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tooling/tmp-runtime-accessibility-typecheck.log
            git commit -m "chore(i18n): capture typecheck diagnostics [skip ci]"
            git push origin HEAD:fix/runtime-accessibility-i18n-parity
            exit "$code"
          fi
      - name: App lint
        run: pnpm --filter @touristic/morro-digital-platform lint
      - name: App build
        run: pnpm --filter @touristic/morro-digital-platform build
      - name: Prettier check
        run: |
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts \
            apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.test.ts \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            .github/workflows/explore-v1-i18n-browser-parity.yml
      - name: Diff check
        run: git diff --check
      - name: Commit clean functional tree
        run: |
          rm .github/workflows/tmp-runtime-accessibility-i18n-finalizer.yml
          rm tooling/tmp-runtime-accessibility-i18n-finalizer.py
          rm -f tooling/tmp-runtime-accessibility-typecheck.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(i18n): localize runtime accessibility surfaces"
          git push origin HEAD:fix/runtime-accessibility-i18n-parity
