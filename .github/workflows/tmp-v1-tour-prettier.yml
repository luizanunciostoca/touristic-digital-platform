name: Temporary V1 Tour Prettier Canonicalization

on:
  push:
    branches:
      - fix/v1-immersive-tours-flow-parity-20260919

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format V1 tour implementation
        run: >-
          pnpm exec prettier --write
          apps/morro-digital-platform/src/map/explore-locations-control.ts
          apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts
          apps/morro-digital-platform/src/map/immersive-tour-v1-flow.test.ts
          apps/morro-digital-platform/src/map/immersive-tour-v1-flow.ts
          apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.test.ts
          apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/morro-digital-platform/src/map/explore-locations-control.ts             apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts             apps/morro-digital-platform/src/map/immersive-tour-v1-flow.test.ts             apps/morro-digital-platform/src/map/immersive-tour-v1-flow.ts             apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.test.ts             apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.ts
          git commit -m "chore(tours): apply canonical Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
