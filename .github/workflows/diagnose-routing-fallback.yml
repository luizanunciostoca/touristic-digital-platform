name: Temporary Routing Fallback Diagnostics

on:
  push:
    branches:
      - feat/navigation-mapbox-routing-fallback

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-mapbox-routing-fallback
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture geospatial lint
        run: pnpm --filter @touristic/geospatial lint > routing-fallback-lint.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routing-fallback-lint.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: capture routing fallback lint diagnostics"
          git push origin HEAD:feat/navigation-mapbox-routing-fallback
