name: Temporary Navigation Final Format

on:
  push:
    branches:
      - fix/navigation-v1-product-parity-20260915

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/navigation-v1-product-parity-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/navigation/navigation-contextual-suggestions.test.ts \
            apps/morro-digital-platform/src/navigation/navigation-contextual-suggestions.ts \
            docs/migration/NAVIGATION-MIG-0005-EQUIVALENCE-MATRIX.md \
            docs/migration/NAVIGATION-V1-GAP-REGISTER.md \
            packages/navigation/src/instruction-text.ts \
            packages/navigation/src/instruction-text.test.ts \
            packages/navigation/src/runtime.ts \
            packages/navigation/src/index.ts \
            .github/workflows/navigation-turn-by-turn-parity.yml \
            docs/features/registry.json \
            docs/migration/MASTER-MIGRATION-TRACKER.md
      - name: Validate Navigation remediation
        run: |
          pnpm --filter @touristic/navigation test
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/navigation build
          pnpm --filter @touristic/morro-digital-platform build
          git diff --check
      - name: Commit canonical formatting only
        run: |
          if git diff --quiet; then
            echo 'FORMAT_ALREADY_CANONICAL'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/morro-digital-platform/src/navigation/browser-navigation-runtime-install.ts \
            apps/morro-digital-platform/src/navigation/navigation-contextual-suggestions.test.ts \
            apps/morro-digital-platform/src/navigation/navigation-contextual-suggestions.ts \
            docs/migration/NAVIGATION-MIG-0005-EQUIVALENCE-MATRIX.md \
            docs/migration/NAVIGATION-V1-GAP-REGISTER.md \
            packages/navigation/src/instruction-text.ts \
            packages/navigation/src/instruction-text.test.ts \
            packages/navigation/src/runtime.ts \
            packages/navigation/src/index.ts \
            .github/workflows/navigation-turn-by-turn-parity.yml \
            docs/features/registry.json \
            docs/migration/MASTER-MIGRATION-TRACKER.md
          git commit -m 'style(navigation): canonicalize parity remediation'
          git push origin HEAD:fix/navigation-v1-product-parity-20260915
