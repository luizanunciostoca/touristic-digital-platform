name: M53 Format Onboarding Once

on:
  push:
    branches:
      - feat/business-m53-onboarding-core
    paths:
      - .github/workflows/m53-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m53-onboarding-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M53 files
        run: pnpm exec prettier --write packages/business/src/onboarding.ts packages/business/src/onboarding.test.ts
      - name: Commit formatted files and remove helper
        run: |
          git rm .github/workflows/m53-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/business/src/onboarding.ts packages/business/src/onboarding.test.ts
          git commit -m "style(business): format M53 onboarding core"
          git push origin HEAD:feat/business-m53-onboarding-core
