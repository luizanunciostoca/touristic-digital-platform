name: M25 Typecheck Finalize

on:
  push:
    branches:
      - feat/assistant-m25-photos

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m25-photos
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts')
          text = path.read_text()
          old = '''  try {\n    const probe = await fetchImplementation(photoSet.images[0], {\n      method: "HEAD",\n    });\n'''
          new = '''  const firstImage = photoSet.images[0];\n  if (!firstImage) {\n    return {\n      text: `Não encontrei fotos disponíveis de ${photoSet.place}.`,\n      metadata: { domain: "photos", state: "unavailable", place: photoSet.place },\n    };\n  }\n\n  try {\n    const probe = await fetchImplementation(firstImage, {\n      method: "HEAD",\n    });\n'''
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts
          rm .github/workflows/m25-typecheck-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(assistant): guard empty photo asset sets"
          git push
