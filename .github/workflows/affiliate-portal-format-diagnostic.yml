name: Affiliate Portal Prettier Diagnostic

on:
  pull_request:
    paths:
      - "apps/morro-digital-platform/src/affiliate-portal-client.test.ts"
      - ".github/workflows/affiliate-portal-format-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: affiliate-portal-format-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Emit exact formatted test
        shell: bash
        run: |
          set -euo pipefail
          file="apps/morro-digital-platform/src/affiliate-portal-client.test.ts"
          pnpm exec prettier --write "$file"
          echo "===== PRETTIER_FILE_BEGIN ====="
          base64 -w 0 "$file"
          echo
          echo "===== PRETTIER_FILE_END ====="
