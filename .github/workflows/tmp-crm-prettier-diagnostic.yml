name: Temporary CRM Prettier Diagnostic

on:
  push:
    branches:
      - fix/sec06-crm-storage-path-hardening-20260913

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format CRM storage files
        run: pnpm exec prettier --write services/crm/src/crm-storage-adapter.ts services/crm/src/crm-storage-adapter.test.ts
      - name: Verify formatting
        run: pnpm exec prettier --check services/crm/src/crm-storage-adapter.ts services/crm/src/crm-storage-adapter.test.ts
      - name: Upload exact formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-storage-prettier-3.9.6
          path: |
            services/crm/src/crm-storage-adapter.ts
            services/crm/src/crm-storage-adapter.test.ts
          retention-days: 1
