name: M62 doc format helper
on:
  push:
    branches: [feat/business-m62-commercial-browser-lifecycle]
    paths: [.github/workflows/m62-doc-format-helper.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m62-commercial-browser-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M62-EVIDENCE.md
      - name: Commit formatted documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/BUSINESS-MIGRATION-MATRIX.md docs/qa/BUSINESS-M62-EVIDENCE.md
          git commit -m "docs(business): format M62 migration evidence"
          git push
