name: Universal Search Prettier Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: universal-search-prettier-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier-probe:
    if: github.head_ref == 'wave/control-center-universal-search-final-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             apps/control-center/public/control-center-search.js             apps/control-center/public/control-center.js             apps/morro-digital-platform/tooling/admin-api.mjs             apps/morro-digital-platform/tooling/admin-api.test.mjs             apps/morro-digital-platform/tooling/admin-domain-adapters.mjs             apps/morro-digital-platform/tooling/control-center-universal-search-ui.test.mjs
          echo 'PRETTIER_PATCH_BEGIN'
          git diff --binary --             apps/control-center/public/control-center-search.js             apps/control-center/public/control-center.js             apps/morro-digital-platform/tooling/admin-api.mjs             apps/morro-digital-platform/tooling/admin-api.test.mjs             apps/morro-digital-platform/tooling/admin-domain-adapters.mjs             apps/morro-digital-platform/tooling/control-center-universal-search-ui.test.mjs             | gzip -9 | base64 -w0
          echo
          echo 'PRETTIER_PATCH_END'
