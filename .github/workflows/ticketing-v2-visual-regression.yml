name: Ticketing V2 Visual Regression

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/ticketing-v2-visual-regression.yml"
      - "tests/visual-regression/ux-v2-manual-reference-matrix.json"
      - "apps/morro-digital-platform/public/ticketing.css"
      - "apps/morro-digital-platform/public/ticketing.js"
      - "apps/morro-digital-platform/public/tickets.html"
      - "apps/morro-digital-platform/public/design-system-v2.css"
      - "apps/morro-digital-platform/public/premium-ux-v2.css"
      - "apps/morro-digital-platform/src/ux/ticketing-v2-contract.test.ts"
      - "apps/morro-digital-platform/src/ux/manual-visual-conformance-authority.test.ts"
      - "tests/visual-regression/ux-v2-manual-conformance.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ticketing-v2-visual:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static Ticketing V2 contract
        run: pnpm --filter @touristic/morro-digital-platform exec vitest run src/ux/ticketing-v2-contract.test.ts
      - name: Ticketing quote authority contract
        run: pnpm --filter @touristic/ticketing-server exec vitest run src/public-http-transport-validity.test.ts
      - name: Build workspace
        run: pnpm -w build
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/ticketing-v2
      - name: Start browser runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/ticketing-v2/server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4173/tickets.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ticketing-v2/server.log
          exit 1
      - name: Visual and accessibility acceptance
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const origin = 'http://127.0.0.1:4173';
          const now = Date.now();
          const iso = ms => new Date(now + ms).toISOString();
          const offer = {
            id: 'mpi_v2_visual_000000000000000000000001',
            destinationId: 'morro-de-sao-paulo',
            product: { kind: 'business_experience', reference: 'morro-pro:toca-do-morcego:sunset' },
            label: 'Sunset em Morro de São Paulo',
            unitAmount: { minorUnits: 15900, currency: 'BRL' },
            pricingVersion: 'v2-visual',
            capacity: 80,
            maxPerReservation: 6,
            availableQuantity: 24,
            startsAt: iso(3 * 86400000),
            endsAt: iso(3 * 86400000 + 4 * 3600000),
          };
          const reservation = {
            id: 'trv_v2_visual_0001',
            inventoryId: offer.id,
            destinationId: offer.destinationId,
            product: offer.product,
            unitAmount: offer.unitAmount,
            pricingVersion: offer.pricingVersion,
            holderReference: 'guest:v2-visual',
            quantity: 2,
            status: 'confirmed',
            validUntil: offer.endsAt,
            createdAt: iso(-3600000),
          };

          const evidence = [];
          const fulfill = (route, body, status = 200) =>
            route.fulfill({
              status,
              contentType: 'application/json',
              body: JSON.stringify(body),
            });

          async function installRoutes(page, state) {
            await page.route('**/api/ticketing/v1/consumer-session', route =>
              fulfill(route, {
                data: {
                  subject: 'guest:v2-visual',
                  csrfToken: 'csrf_v2_visual',
                  expiresAt: iso(30 * 86400000),
                },
              }, 201),
            );
            await page.route('**/api/ticketing/v1/inventory', async route => {
              if (state.delay) await new Promise(resolve => setTimeout(resolve, state.delay));
              if (state.error) return fulfill(route, { error: 'TICKETING_UNAVAILABLE' }, 503);
              return fulfill(route, { data: state.empty ? [] : (state.inventory || [offer]) });
            });
            await page.route('**/api/ticketing/v1/quote', async route => {
              if (state.quoteDelay) await new Promise(resolve => setTimeout(resolve, state.quoteDelay));
              if (state.quoteAbort) return route.abort('timedout');
              if (state.quoteError) {
                return fulfill(route, { error: state.quoteError }, state.quoteStatus || 409);
              }
              const body = route.request().postDataJSON();
              const unitCurrency = state.quoteUnitCurrency || offer.unitAmount.currency;
              const totalCurrency = state.quoteTotalCurrency || unitCurrency;
              const unitMinor = state.quoteMinor ?? offer.unitAmount.minorUnits;
              const quantity = Number(body.quantity);
              return fulfill(route, {
                data: {
                  inventoryId: body.inventoryId,
                  quantity,
                  unitAmount: { minorUnits: unitMinor, currency: unitCurrency },
                  totalAmount: { minorUnits: unitMinor * quantity, currency: totalCurrency },
                  pricingVersion: state.quotePricingVersion || offer.pricingVersion,
                  availableQuantity: state.quoteAvailableQuantity ?? offer.availableQuantity,
                  maxPerReservation: state.quoteMaxPerReservation ?? offer.maxPerReservation,
                  observedAt: iso(0),
                  expiresAt: state.quoteExpiresAt || iso(60000),
                },
              });
            });
            await page.route('**/api/ticketing/v1/reservations', async route => {
              if (route.request().method() === 'POST') {
                state.reservationPosts = (state.reservationPosts || 0) + 1;
                state.reservationIdempotencyKeys = [
                  ...(state.reservationIdempotencyKeys || []),
                  route.request().headers()['idempotency-key'] || '',
                ];
                if (state.reservationDelay) {
                  await new Promise(resolve => setTimeout(resolve, state.reservationDelay));
                }
                if (state.reservationError) {
                  return fulfill(route, { error: state.reservationError }, state.reservationStatus || 409);
                }
                return fulfill(route, {
                  data: {
                    reservation: { ...reservation, status: 'held', quantity: route.request().postDataJSON().quantity },
                    checkout: {
                      path: '/api/payments/v1/checkouts',
                      idempotencyKey: 'ticketing-visual-checkout-key',
                      reservationReference: reservation.id,
                      handoffToken: 'ticketing-visual-handoff',
                      handoff: {
                        reservationReference: reservation.id,
                        customer: { name: 'Visitante', email: 'visitante@example.com' },
                        returnUrl: origin + '/tickets.html',
                        requiresPaymentsCapability: true,
                      },
                    },
                  },
                }, 201);
              }
              if (state.delay) await new Promise(resolve => setTimeout(resolve, state.delay));
              return fulfill(route, {
                data: state.empty ? [] : state.reservations || [reservation],
              });
            });
            await page.route('**/api/payments/v1/checkouts', route => {
              state.checkoutPosts = (state.checkoutPosts || 0) + 1;
              state.checkoutIdempotencyKeys = [
                ...(state.checkoutIdempotencyKeys || []),
                route.request().headers()['idempotency-key'] || '',
              ];
              if (state.providerFail) return fulfill(route, { error: 'PAYMENTS_UNAVAILABLE' }, 503);
              return fulfill(route, {
                data: {
                  checkoutId: 'chk_v2_visual_0001',
                  statusToken: 'status-v2-visual',
                  statusExpiresAt: iso(600000),
                  plan: { amount: { minorUnits: 31800, currency: 'BRL' } },
                  checkoutUrl: 'https://payments.example.test/checkout',
                },
              }, 201);
            });
            await page.route('**/api/ticketing/v1/reservations/trv_v2_visual_0001/ticket', route =>
              fulfill(route, {
                data: {
                  code: 'MORRO-V2-VISUAL',
                  quantity: 2,
                  amount: { minorUnits: 31800, currency: 'BRL' },
                  issuedAt: iso(-3000000),
                  validUntil: offer.endsAt,
                  qrSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10"/></svg>',
                },
              }),
            );
          }

          async function audit(page, label) {
            const result = await page.evaluate(() => {
              const root = document.documentElement;
              const interactive = Array.from(
                document.querySelectorAll('button, a[href], input:not([type="hidden"])'),
              )
                .filter(node => {
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden';
                })
                .map(node => {
                  const rect = node.getBoundingClientRect();
                  return {
                    id: node.id || null,
                    className: node.className || null,
                    width: rect.width,
                    height: rect.height,
                  };
                });
              const backLink = document.querySelector('.back-link');
              const privacyTrigger = document.querySelector('.analytics-consent-trigger');
              const backRect =
                backLink instanceof HTMLElement ? backLink.getBoundingClientRect() : null;
              const privacyRect =
                privacyTrigger instanceof HTMLElement
                  ? privacyTrigger.getBoundingClientRect()
                  : null;
              const privacyBackOverlap =
                backRect !== null &&
                privacyRect !== null &&
                backRect.left < privacyRect.right &&
                backRect.right > privacyRect.left &&
                backRect.top < privacyRect.bottom &&
                backRect.bottom > privacyRect.top;
              const checkoutCta = document.querySelector('#reserve-button');
              const checkoutRect =
                checkoutCta instanceof HTMLElement && !checkoutCta.hidden
                  ? checkoutCta.getBoundingClientRect()
                  : null;
              const privacyCheckoutOverlap =
                checkoutRect !== null &&
                privacyRect !== null &&
                checkoutRect.width > 0 &&
                checkoutRect.height > 0 &&
                checkoutRect.left < privacyRect.right &&
                checkoutRect.right > privacyRect.left &&
                checkoutRect.top < privacyRect.bottom &&
                checkoutRect.bottom > privacyRect.top;
              return {
                scrollWidth: root.scrollWidth,
                clientWidth: root.clientWidth,
                bodyFont: getComputedStyle(document.body).fontFamily,
                interactive,
                privacyBackOverlap,
                privacyCheckoutOverlap,
              };
            });
            if (result.scrollWidth > result.clientWidth + 1) {
              throw new Error(label + ' horizontal overflow: ' + JSON.stringify(result));
            }
            if (/Inter/i.test(result.bodyFont)) {
              throw new Error(label + ' leaked Inter font: ' + result.bodyFont);
            }
            if (result.privacyBackOverlap) {
              throw new Error(
                label + ' privacy trigger overlaps Ticketing back action: ' + JSON.stringify(result),
              );
            }
            if (result.privacyCheckoutOverlap) {
              throw new Error(
                label + ' privacy trigger overlaps Ticketing checkout CTA: ' + JSON.stringify(result),
              );
            }
            const undersized = result.interactive.filter(
              item => item.width < 44 || item.height < 44,
            );
            if (undersized.length) {
              throw new Error(label + ' has undersized targets: ' + JSON.stringify(undersized));
            }
            return result;
          }

          async function readyCase(browser, viewport, suffix, mutate) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await installRoutes(page, {});
            await page.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
            await page.locator('.offer-card').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('.reservation-card').waitFor({ state: 'visible', timeout: 10000 });
            if (mutate) await mutate(page);
            const imageLedHierarchy = await page.evaluate(() => {
              const media = Array.from(
                document.querySelectorAll(
                  '.offer-card img, .offer-card picture, [data-ticketing-hero], [data-ticketing-experience-media]',
                ),
              ).filter(node => {
                const rect = node.getBoundingClientRect();
                const style = getComputedStyle(node);
                return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
              });
              return {
                visibleMediaCount: media.length,
                firstMediaWidth: media[0]?.getBoundingClientRect().width ?? null,
                firstMediaHeight: media[0]?.getBoundingClientRect().height ?? null,
              };
            });
            if (imageLedHierarchy.visibleMediaCount < 1) {
              throw new Error(
                suffix + ' MANUAL_CONFORMANCE_TICKETING_IMAGE_LED_HIERARCHY: ' +
                  JSON.stringify(imageLedHierarchy),
              );
            }
            const contract = await audit(page, suffix);
            await page.screenshot({
              path: '/tmp/ticketing-v2/' + suffix + '.png',
              fullPage: true,
              animations: 'disabled',
            });
            if (errors.length) throw new Error(suffix + ' page errors: ' + JSON.stringify(errors));
            evidence.push({ case: suffix, viewport, contract });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const matrix = [
                ['360x800', { width: 360, height: 800 }],
                ['390x844', { width: 390, height: 844 }],
                ['430x932', { width: 430, height: 932 }],
                ['768x1024', { width: 768, height: 1024 }],
                ['1440x900', { width: 1440, height: 900 }],
              ];
              for (const [name, viewport] of matrix) {
                await readyCase(browser, viewport, 'ready-' + name);
              }

              await readyCase(browser, { width: 390, height: 844 }, 'selected-quantity-quote-390x844', async page => {
                await page.locator('.offer-card .md-button--primary').click();
                await page.locator('#selection-summary:not([hidden])').waitFor({ state: 'visible' });
                await page.locator('#quantity-increase').click();
                await page.waitForFunction(() => {
                  const subtotal = document.querySelector('#summary-subtotal')?.textContent?.trim();
                  return subtotal && subtotal !== '—';
                });
                const state = await page.evaluate(() => {
                  const summary = document.querySelector('#selection-summary');
                  const cta = document.querySelector('#reserve-button');
                  const unit = document.querySelector('#summary-unit-price')?.textContent?.trim() ?? '';
                  const subtotal = document.querySelector('#summary-subtotal')?.textContent?.trim() ?? '';
                  const quantity = document.querySelector('#summary-quantity')?.textContent?.trim() ?? '';
                  const hero = document.querySelector('.ticketing-hero-media');
                  const heroRect = hero instanceof HTMLElement ? hero.getBoundingClientRect() : null;
                  const ctaRect = cta instanceof HTMLElement ? cta.getBoundingClientRect() : null;
                  return {
                    summaryVisible: summary instanceof HTMLElement && !summary.hidden,
                    quantity,
                    unit,
                    subtotal,
                    heroHeight: heroRect?.height ?? 0,
                    ctaWidth: ctaRect?.width ?? 0,
                    ctaHeight: ctaRect?.height ?? 0,
                    authorityNote: document.querySelector('.authority-note')?.textContent?.trim() ?? '',
                  };
                });
                if (!state.summaryVisible || state.quantity !== '2') {
                  throw new Error('Selection/quantity state missing: ' + JSON.stringify(state));
                }
                if (!state.unit || state.unit === '—' || !state.subtotal || state.subtotal === '—') {
                  throw new Error('Price breakdown unreadable: ' + JSON.stringify(state));
                }
                if (state.heroHeight < 160 || state.heroHeight > 260) {
                  throw new Error('MANUAL_CONFORMANCE_TICKETING_COMPACT_HERO: ' + JSON.stringify(state));
                }
                if (state.ctaWidth < 44 || state.ctaHeight < 44) {
                  throw new Error('Dominant checkout CTA geometry invalid: ' + JSON.stringify(state));
                }
                if (state.authorityNote.length < 20) {
                  throw new Error(
                    'Financial authority note missing or unreadable: ' + JSON.stringify(state),
                  );
                }
                evidence.push({ case: 'selected-quantity-quote-390x844', state });
              });

              await readyCase(browser, { width: 390, height: 844 }, 'dark-390x844', async page => {
                await page.evaluate(() => {
                  document.documentElement.dataset.theme = 'dark';
                });
              });

              const reducedContext = await browser.newContext({
                viewport: { width: 390, height: 844 },
                reducedMotion: 'reduce',
              });
              const reducedPage = await reducedContext.newPage();
              await installRoutes(reducedPage, {});
              await reducedPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await reducedPage.locator('.offer-card').waitFor({ state: 'visible', timeout: 10000 });
              const reducedContract = await audit(reducedPage, 'reduced-motion-390x844');
              await reducedPage.screenshot({
                path: '/tmp/ticketing-v2/reduced-motion-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              evidence.push({ case: 'reduced-motion-390x844', contract: reducedContract });
              await reducedContext.close();

              await readyCase(browser, { width: 390, height: 844 }, 'text-200-390x844', async page => {
                await page.addStyleTag({ content: 'html { font-size: 200% !important; }' });
              });

              const forcedContext = await browser.newContext({
                viewport: { width: 390, height: 844 },
                forcedColors: 'active',
              });
              const forcedPage = await forcedContext.newPage();
              await installRoutes(forcedPage, {});
              await forcedPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await forcedPage.locator('.offer-card').waitFor({ state: 'visible', timeout: 10000 });
              const forcedContract = await audit(forcedPage, 'forced-colors-390x844');
              await forcedPage.screenshot({
                path: '/tmp/ticketing-v2/forced-colors-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              evidence.push({ case: 'forced-colors-390x844', contract: forcedContract });
              await forcedContext.close();

              const loadingContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const loadingPage = await loadingContext.newPage();
              await installRoutes(loadingPage, { delay: 1500 });
              await loadingPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await loadingPage.locator('#offers[aria-busy="true"]').waitFor({ state: 'attached', timeout: 3000 });
              if ((await loadingPage.locator('.ticketing-skeleton-card').count()) < 3) {
                throw new Error('Ticketing loading skeletons missing');
              }
              await loadingPage.screenshot({
                path: '/tmp/ticketing-v2/loading-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              await loadingContext.close();

              const emptyContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const emptyPage = await emptyContext.newPage();
              await installRoutes(emptyPage, { empty: true });
              await emptyPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await emptyPage.locator('#offers .empty').waitFor({ state: 'visible', timeout: 10000 });
              await emptyPage.locator('#ticketing-title').filter({ hasText: 'Nenhuma experiência disponível agora' }).waitFor({ state: 'visible' });
              await audit(emptyPage, 'empty-390x844');
              await emptyPage.screenshot({
                path: '/tmp/ticketing-v2/empty-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              await emptyContext.close();

              const errorContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const errorPage = await errorContext.newPage();
              await installRoutes(errorPage, { error: true });
              await errorPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await errorPage.locator('#reservation-message').filter({ hasText: 'temporariamente indisponíveis' }).waitFor({
                state: 'visible',
                timeout: 10000,
              });
              const leakedTechnicalState = await errorPage.locator('#reservation-message').textContent();
              if (/TICKETING_|PAYMENTS_|HTTP_/u.test(leakedTechnicalState || '')) {
                throw new Error('Technical error leaked into consumer UI: ' + leakedTechnicalState);
              }
              await errorPage.screenshot({
                path: '/tmp/ticketing-v2/error-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              await errorContext.close();

              const transactionalContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const transactionalPage = await transactionalContext.newPage();
              const transactionalState = {};
              await installRoutes(transactionalPage, transactionalState);
              await transactionalPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await transactionalPage.locator('.offer-card .md-button--primary').click();
              await transactionalPage.locator('#holder-name').fill('Visitante');
              await transactionalPage.locator('#holder-email').fill('visitante@example.com');
              await transactionalPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });

              transactionalState.quoteMinor = 16900;
              await transactionalPage.locator('#reserve-button').click();
              await transactionalPage.locator('#reservation-message').filter({ hasText: 'Preço ou disponibilidade mudou' }).waitFor({ state: 'visible' });
              if ((transactionalState.reservationPosts || 0) !== 0) {
                throw new Error('Price drift reached reservation authority');
              }

              transactionalState.quoteMinor = 15900;
              transactionalState.quoteExpiresAt = iso(60000);
              await transactionalPage.locator('#quantity-increase').click();
              await transactionalPage.locator('#summary-subtotal').filter({ hasNotText: '—' }).waitFor({ state: 'visible' });
              transactionalState.quoteExpiresAt = iso(-1000);
              await transactionalPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });
              await transactionalPage.locator('#reserve-button').click();
              await transactionalPage.locator('#reservation-message').filter({ hasText: 'cotação expirou' }).waitFor({ state: 'visible' });
              if ((transactionalState.reservationPosts || 0) !== 0) {
                throw new Error('Expired quote reached reservation authority');
              }

              transactionalState.quoteExpiresAt = iso(60000);
              transactionalState.quoteUnitCurrency = 'BRL';
              transactionalState.quoteTotalCurrency = 'USD';
              await transactionalPage.locator('#quantity-increase').click();
              await transactionalPage.locator('#reservation-message').filter({ hasText: 'moeda' }).waitFor({ state: 'visible' });
              if (!(await transactionalPage.locator('#reserve-button').isDisabled())) {
                throw new Error('Currency mismatch did not fail closed');
              }

              transactionalState.quoteTotalCurrency = 'BRL';
              transactionalState.quoteAbort = true;
              await transactionalPage.locator('#quantity-decrease').click();
              await transactionalPage.locator('#reservation-message').waitFor({ state: 'visible' });
              if (!(await transactionalPage.locator('#reserve-button').isDisabled())) {
                throw new Error('Quote timeout did not fail closed');
              }

              transactionalState.quoteAbort = false;
              await transactionalPage.locator('#quantity-increase').click();
              await transactionalPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });
              transactionalState.reservationDelay = 300;
              transactionalState.reservationError = 'TICKETING_UNAVAILABLE';
              transactionalState.reservationStatus = 503;
              await Promise.all([
                transactionalPage.locator('#reserve-button').click(),
                transactionalPage.locator('#reserve-button').click({ force: true }),
              ]);
              await transactionalPage.waitForTimeout(500);
              if ((transactionalState.reservationPosts || 0) !== 1) {
                throw new Error('Double submit created duplicate reservation requests: ' + transactionalState.reservationPosts);
              }
              evidence.push({
                case: 'transactional-negative-390x844',
                reservationPosts: transactionalState.reservationPosts,
              });
              await transactionalContext.close();

              const reservationRetryContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const reservationRetryPage = await reservationRetryContext.newPage();
              const reservationRetryState = {
                reservationError: 'TICKETING_UNAVAILABLE',
                reservationStatus: 503,
              };
              await installRoutes(reservationRetryPage, reservationRetryState);
              await reservationRetryPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await reservationRetryPage.locator('#holder-name').fill('Visitante');
              await reservationRetryPage.locator('#holder-email').fill('visitante@example.com');
              await reservationRetryPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });
              await reservationRetryPage.locator('#reserve-button').click();
              await reservationRetryPage.locator('#reservation-message').filter({ hasText: 'Não foi possível criar a reserva' }).waitFor({ state: 'visible' });
              reservationRetryState.reservationError = null;
              await reservationRetryPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });
              await reservationRetryPage.locator('#reserve-button').click();
              await reservationRetryPage.waitForTimeout(300);
              if ((reservationRetryState.reservationPosts || 0) !== 2) {
                throw new Error('Reservation retry was not exercised twice');
              }
              const reservationKeys = reservationRetryState.reservationIdempotencyKeys || [];
              if (!reservationKeys[0] || reservationKeys[0] !== reservationKeys[1]) {
                throw new Error('Ambiguous reservation retry changed idempotency key: ' + JSON.stringify(reservationKeys));
              }
              evidence.push({
                case: 'reservation-retry-idempotency-390x844',
                reservationPosts: reservationRetryState.reservationPosts,
                stableKey: true,
              });
              await reservationRetryContext.close();

              const providerContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const providerPage = await providerContext.newPage();
              const providerState = { providerFail: true };
              await installRoutes(providerPage, providerState);
              await providerPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await providerPage.locator('#holder-name').fill('Visitante');
              await providerPage.locator('#holder-email').fill('visitante@example.com');
              await providerPage.locator('#reserve-button:not([disabled])').waitFor({ state: 'visible' });
              await providerPage.locator('#reserve-button').click();
              await providerPage.locator('#reserve-button').filter({ hasText: 'Retomar pagamento' }).waitFor({ state: 'visible' });
              const providerMessage = await providerPage.locator('#reservation-message').textContent();
              if (/TICKETING_|PAYMENTS_|HTTP_/u.test(providerMessage || '')) {
                throw new Error('Provider failure leaked technical state: ' + providerMessage);
              }
              if ((providerState.reservationPosts || 0) !== 1 || (providerState.checkoutPosts || 0) !== 1) {
                throw new Error('Provider failure did not preserve exactly one reservation: ' + JSON.stringify(providerState));
              }
              providerState.providerFail = false;
              await providerPage.locator('#reserve-button').click();
              await providerPage.waitForTimeout(300);
              if ((providerState.reservationPosts || 0) !== 1 || (providerState.checkoutPosts || 0) !== 2) {
                throw new Error('Provider retry created a duplicate reservation: ' + JSON.stringify(providerState));
              }
              const checkoutKeys = providerState.checkoutIdempotencyKeys || [];
              if (!checkoutKeys[0] || checkoutKeys[0] !== checkoutKeys[1]) {
                throw new Error('Checkout retry changed server-issued idempotency key: ' + JSON.stringify(checkoutKeys));
              }
              evidence.push({
                case: 'provider-retry-without-duplicate-reservation-390x844',
                reservationPosts: providerState.reservationPosts,
                checkoutPosts: providerState.checkoutPosts,
                stableCheckoutKey: true,
              });
              await providerContext.close();

              const privacyContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const privacyPage = await privacyContext.newPage();
              await installRoutes(privacyPage, {});
              await privacyPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              const collapsedVisible = await privacyPage.locator('.analytics-consent-trigger').isVisible().catch(() => false);
              if (collapsedVisible) throw new Error('Floating privacy trigger still competes with transactional UI');
              await privacyPage.locator('#privacy-settings-button').click();
              await privacyPage.locator('.analytics-consent-preferences[role="dialog"]').waitFor({ state: 'visible' });
              evidence.push({ case: 'privacy-inline-access-390x844', floatingTriggerVisible: false });
              await privacyContext.close();

              const stockContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const stockPage = await stockContext.newPage();
              const soldOut = { ...offer, id: 'mpi_v2_visual_sold_out', startsAt: iso(4 * 86400000), endsAt: iso(4 * 86400000 + 3600000), availableQuantity: 0 };
              const unavailable = { ...offer, id: 'mpi_v2_visual_unavailable', startsAt: iso(5 * 86400000), endsAt: iso(5 * 86400000 + 3600000), sellable: false };
              await installRoutes(stockPage, { inventory: [offer, soldOut, unavailable] });
              await stockPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await stockPage.locator('.date-chip').first().waitFor({ state: 'visible' });
              const dateStates = await stockPage.locator('.date-chip').allTextContents();
              if (!dateStates.some(value => value.includes('Esgotado')) || !dateStates.some(value => value.includes('Indisponível'))) {
                throw new Error('Sold-out/unavailable date states missing: ' + JSON.stringify(dateStates));
              }
              await audit(stockPage, 'date-states-390x844');
              await stockPage.screenshot({
                path: '/tmp/ticketing-v2/date-states-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              evidence.push({ case: 'date-states-390x844', dateStates });
              await stockContext.close();

              const terminalWalletContext = await browser.newContext({
                viewport: { width: 390, height: 844 },
              });
              const terminalWalletPage = await terminalWalletContext.newPage();
              const expiredReservation = {
                ...reservation,
                id: 'trv_v2_visual_expired',
                status: 'expired',
                validUntil: undefined,
              };
              const cancelledReservation = {
                ...reservation,
                id: 'trv_v2_visual_cancelled',
                status: 'cancelled',
                validUntil: undefined,
              };
              await installRoutes(terminalWalletPage, {
                reservations: [expiredReservation, cancelledReservation],
              });
              await terminalWalletPage.goto(origin + '/tickets.html', {
                waitUntil: 'domcontentloaded',
              });
              await terminalWalletPage.locator('.reservation-card').first().waitFor({
                state: 'visible',
                timeout: 10000,
              });
              const terminalWalletContract = await audit(
                terminalWalletPage,
                'wallet-expired-cancelled-390x844',
              );
              const terminalStatuses = await terminalWalletPage
                .locator('.reservation-card .status')
                .allTextContents();
              if (terminalStatuses.length !== 2) {
                throw new Error(
                  'Expired/cancelled wallet states missing: ' +
                    JSON.stringify(terminalStatuses),
                );
              }
              await terminalWalletPage.screenshot({
                path: '/tmp/ticketing-v2/wallet-expired-cancelled-390x844.png',
                fullPage: true,
                animations: 'disabled',
              });
              evidence.push({
                case: 'wallet-expired-cancelled-390x844',
                contract: terminalWalletContract,
                terminalStatuses,
              });
              await terminalWalletContext.close();

              const dialogContext = await browser.newContext({ viewport: { width: 390, height: 500 } });
              const dialogPage = await dialogContext.newPage();
              await installRoutes(dialogPage, {});
              await dialogPage.goto(origin + '/tickets.html', { waitUntil: 'domcontentloaded' });
              await dialogPage.locator('.reservation-card').waitFor({ state: 'visible', timeout: 10000 });
              await dialogPage.locator('.reservation-card .md-button--primary').click();
              await dialogPage.locator('#ticket-dialog[open]').waitFor({ state: 'visible', timeout: 10000 });
              const dialogState = await dialogPage.locator('#ticket-dialog').evaluate(node => {
                const rect = node.getBoundingClientRect();
                const qr = node.querySelector('#ticket-qr');
                const code = node.querySelector('#ticket-code');
                const close = node.querySelector('#ticket-close');
                const qrRect = qr instanceof HTMLElement ? qr.getBoundingClientRect() : null;
                const closeRect = close instanceof HTMLElement ? close.getBoundingClientRect() : null;
                return {
                  height: rect.height,
                  viewportHeight: innerHeight,
                  scrollHeight: node.scrollHeight,
                  clientHeight: node.clientHeight,
                  qrWidth: qrRect?.width ?? 0,
                  qrHeight: qrRect?.height ?? 0,
                  code: code?.textContent?.trim() ?? '',
                  closeWidth: closeRect?.width ?? 0,
                  closeHeight: closeRect?.height ?? 0,
                };
              });
              if (dialogState.height > dialogState.viewportHeight + 1) {
                throw new Error('Ticket dialog exceeds safe viewport: ' + JSON.stringify(dialogState));
              }
              if (dialogState.qrWidth < 180 || dialogState.qrHeight < 180 || !dialogState.code) {
                throw new Error('QR/code fallback clipped or missing: ' + JSON.stringify(dialogState));
              }
              if (dialogState.closeWidth < 44 || dialogState.closeHeight < 44) {
                throw new Error('QR accessible close target invalid: ' + JSON.stringify(dialogState));
              }
              await dialogPage.screenshot({
                path: '/tmp/ticketing-v2/dialog-compact-390x500.png',
                fullPage: false,
                animations: 'disabled',
              });
              evidence.push({ case: 'dialog-compact-390x500', dialogState });
              await dialogContext.close();

              writeFileSync('/tmp/ticketing-v2/evidence.json', JSON.stringify(evidence, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            writeFileSync('/tmp/ticketing-v2/failure.txt', String(error?.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: |
          cat /tmp/ticketing-v2/failure.txt || true
          cat /tmp/ticketing-v2/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ticketing-v2-visual-evidence
          path: /tmp/ticketing-v2
          retention-days: 7
          if-no-files-found: error
