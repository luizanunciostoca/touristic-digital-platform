name: M36 Format Search Matrix Once

on:
  push:
    branches:
      - feat/search-m36-v1-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m36-v1-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M36 matrix
        run: pnpm exec prettier --write docs/migration/SEARCH-MIGRATION-MATRIX.md
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/m36-format-search-matrix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/SEARCH-MIGRATION-MATRIX.md .github/workflows/m36-format-search-matrix-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(search): format M36 migration matrix"
          git push origin HEAD:feat/search-m36-v1-baseline
