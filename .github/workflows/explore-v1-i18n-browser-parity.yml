name: Explore V1 I18n Browser Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/explore-v1-i18n-browser-parity.yml
      - apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-v1-i18n.ts
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/runtime/runtime-accessibility-i18n.ts
      - apps/morro-digital-platform/src/config/**
      - apps/morro-digital-platform/public/**
      - packages/assistant/src/**
      - packages/geospatial/src/**
      - packages/search/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  explore-v1-i18n:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/explore-v1-i18n
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/explore-v1-i18n/server.log 2>&1 &
          echo $! >/tmp/explore-v1-i18n/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/explore-v1-i18n/server.log
          exit 1
      - name: Verify PT EN ES HE runtime presentation parity
        run: node apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/explore-v1-i18n/server.log || true
