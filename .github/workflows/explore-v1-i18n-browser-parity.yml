name: Explore V1 I18n Browser Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/explore-v1-i18n-browser-parity.yml
      - apps/morro-digital-platform/src/assistant/**
      - apps/morro-digital-platform/src/map/explore-v1-i18n.ts
      - apps/morro-digital-platform/src/map/explore-location-actions-v1.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/layouts/app-shell.ts
      - apps/morro-digital-platform/public/**
      - packages/assistant/src/**
      - packages/geospatial/src/**
      - packages/search/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  explore-v1-i18n:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/explore-v1-i18n
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/explore-v1-i18n/server.log 2>&1 &
          echo $! >/tmp/explore-v1-i18n/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/explore-v1-i18n/server.log
          exit 1
      - name: Verify PT EN ES HE runtime presentation parity
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const weather = {
            temperatureCelsius: 28,
            temperatureMaxCelsius: 31,
            temperatureMinCelsius: 24,
            humidityPercent: 78,
            windSpeedKph: 18,
            rainChancePercent: 42,
            weatherCode: 1,
            isDay: true,
            forecast: [],
          };

          const expectedFilters = {
            en: {
              category: 'Beaches',
              aria: 'Beaches, 8 places',
              labels: [
                '🏄 Good waves for surfing',
                '🤿 For diving / snorkel',
                '🌅 For sunset',
                '👨‍👩‍👧 Family-friendly / calm',
                '🎵 With bars / facilities',
                '📍 Nearby',
                '🗺️ See all',
                '🔙 Back to menu',
              ],
            },
            es: {
              category: 'Playas',
              aria: 'Playas, 8 lugares',
              labels: [
                '🏄 Con olas para surf',
                '🤿 Para buceo / snorkel',
                '🌅 Para ver el atardecer',
                '👨‍👩‍👧 Familiar / tranquila',
                '🎵 Con estructura / bares',
                '📍 Cercanos a mí',
                '🗺️ Ver todos',
                '🔙 Volver al menú',
              ],
            },
            he: {
              category: 'חופים',
              aria: 'חופים, 8 מקומות',
              labels: [
                '🏄 עם גלים לגלישה',
                '🤿 לצלילה / שנורקל',
                '🌅 לשקיעה',
                '👨‍👩‍👧 משפחתי / רגוע',
                '🎵 עם ברים / תשתיות',
                '📍 קרובים אלי',
                '🗺️ ראה הכל',
                '🔙 חזרה לתפריט',
              ],
            },
          };

          const beachDetailValues = [
            'condições da praia',
            'como chegar',
            'ver fotos',
            'informações',
            'mais opções',
            '[sub]beaches',
          ];
          const beachDetailHebrew = [
            '🌊 תנאי החוף',
            '📍 איך להגיע',
            '📸 צפה תמונות',
            'ℹ️ מידע',
            'אפשרויות נוספות',
            '⬅️ חזרה',
          ];
          const restaurantPrimaryEnglish = [
            '🍴 Menu',
            '📍 Directions',
            '📸 View photos',
            '📞 Contact',
            'More options',
            '⬅️ Back',
          ];
          const restaurantSecondaryEnglish = [
            'ℹ️ Information',
            '🕒 Hours',
            '💰 Price range',
            '⭐ Reviews',
            '❤️ Favorite',
            '⬅️ Back',
          ];

          async function openAssistant(page) {
            await page.locator('body[data-public-onboarding-settled="true"]').waitFor({
              state: 'attached',
              timeout: 5000,
            });
            const assistant = page.locator('#assistant-messages');
            const quickAction = page.locator('.mood-button[data-assistant-shell-ready="true"]');
            await quickAction.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await assistant.isVisible())) await quickAction.click();
            await assistant.waitFor({ state: 'visible', timeout: 5000 });
          }

          async function setLanguage(page, language) {
            await page.evaluate(language => {
              document.documentElement.lang = language;
            }, language);
          }

          async function waitCategoryPresentation(page, value, text, aria) {
            const button = page.locator(`#assistant-category-${value}`);
            await button.waitFor({ state: 'attached', timeout: 5000 });
            await page.waitForFunction(
              ({ value, text, aria }) => {
                const button = document.getElementById(`assistant-category-${value}`);
                return button?.textContent?.trim() === text && button.getAttribute('aria-label') === aria;
              },
              { value, text, aria },
              { timeout: 5000 },
            );
          }

          async function readFlow(page) {
            return page.evaluate(() => ({
              labels: Array.from(
                document.querySelectorAll('#assistant-category-results .assistant-flow-option'),
                button => button.textContent?.trim() ?? '',
              ),
              values: Array.from(
                document.querySelectorAll('#assistant-category-results .assistant-flow-option'),
                button => button.getAttribute('data-value'),
              ),
            }));
          }

          async function readDynamic(page) {
            return page.evaluate(() => {
              const containers = Array.from(document.querySelectorAll('.assistant-options'));
              const dynamic = containers
                .filter(container =>
                  !container.querySelector('[data-explore-category]') &&
                  container.id !== 'assistant-category-results'
                )
                .at(-1);
              return dynamic
                ? {
                    labels: Array.from(
                      dynamic.querySelectorAll('.assistant-option-btn'),
                      button => button.textContent?.trim() ?? '',
                    ),
                    values: Array.from(
                      dynamic.querySelectorAll('.assistant-option-btn'),
                      button => button.getAttribute('data-value'),
                    ),
                  }
                : { labels: [], values: [] };
            });
          }

          function assertEqual(actual, expected, label) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
              permissions: ['geolocation'],
            });
            await context.addInitScript(() => {
              localStorage.setItem('morro-digital-onboarded', '1');
              localStorage.setItem('voice-enabled', 'false');
            });
            const page = await context.newPage();
            const pageErrors = [];
            const mapboxHttpErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('response', response => {
              if (response.url().includes('mapbox.com') && response.status() >= 400) {
                mapboxHttpErrors.push(response.status());
              }
            });
            await page.route('**/api/weather', route => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify(weather),
            }));

            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.locator('#map[data-map-state="ready"][data-map-mode="real"]').waitFor({
              state: 'attached',
              timeout: 30000,
            });
            await page.locator('#loading-overlay.fade-out').waitFor({ state: 'attached', timeout: 5000 });
            await openAssistant(page);

            await waitCategoryPresentation(page, 'beaches', 'Praias', 'Praias, 8 locais');

            for (const locale of ['en', 'es']) {
              await setLanguage(page, locale);
              const expected = expectedFilters[locale];
              await waitCategoryPresentation(page, 'beaches', expected.category, expected.aria);
              await page.locator('#assistant-category-beaches').click();
              await page.locator('#assistant-category-results[data-stage="filters"]').waitFor({
                state: 'visible',
                timeout: 5000,
              });
              let flow = await readFlow(page);
              assertEqual(flow.labels, expected.labels, `${locale} filter labels`);
              assertEqual(
                flow.values,
                ['surf', 'mergulho', 'por do sol', 'familiar', 'estrutura', 'proximo', 'ver todos', 'voltar_menu'],
                `${locale} canonical filter values`,
              );
              await page.keyboard.press('Escape');
            }

            await setLanguage(page, 'he');
            const hebrew = expectedFilters.he;
            await waitCategoryPresentation(page, 'beaches', hebrew.category, hebrew.aria);
            await page.locator('#assistant-category-beaches').click();
            await page.locator('#assistant-category-results[data-stage="filters"]').waitFor({ state: 'visible' });
            let flow = await readFlow(page);
            assertEqual(flow.labels, hebrew.labels, 'he filter labels');

            await page.locator('#assistant-category-results [data-value="ver todos"]').click();
            await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({ state: 'visible' });
            await page.locator('#assistant-category-results [data-location-name="Primeira Praia"]').click();
            await page.locator('.assistant-option-btn[data-value="condições da praia"]').waitFor({ state: 'visible', timeout: 8000 });
            let dynamic = await readDynamic(page);
            assertEqual(dynamic.labels, beachDetailHebrew, 'he beach detail labels');
            assertEqual(dynamic.values, beachDetailValues, 'he beach canonical values');

            await page.locator('.assistant-option-btn[data-value="[sub]beaches"]').click();
            await page.locator('#assistant-category-results[data-stage="places"]').waitFor({ state: 'visible' });
            await page.keyboard.press('Escape');

            await setLanguage(page, 'en-US');
            await waitCategoryPresentation(page, 'restaurants', 'Restaurants', 'Restaurants, 45 places');
            await page.locator('#assistant-category-restaurants').click();
            await page.locator('#assistant-category-results[data-stage="filters"]').waitFor({ state: 'visible' });
            await page.locator('#assistant-category-results [data-value="ver todos"]').click();
            await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Morena Bela"]').waitFor({ state: 'visible' });
            await page.locator('#assistant-category-results [data-location-name="Morena Bela"]').click();
            await page.locator('.assistant-option-btn[data-value="cardápio"]').waitFor({ state: 'visible', timeout: 8000 });
            dynamic = await readDynamic(page);
            assertEqual(dynamic.labels, restaurantPrimaryEnglish, 'en restaurant primary labels');
            await page.locator('.assistant-option-btn[data-value="mais opções"]').last().click();
            await page.locator('.assistant-option-btn[data-value="avaliações"]').last().waitFor({ state: 'visible', timeout: 5000 });
            dynamic = await readDynamic(page);
            assertEqual(dynamic.labels, restaurantSecondaryEnglish, 'en restaurant secondary labels');
            assertEqual(
              dynamic.values,
              ['mais detalhes', 'horário de funcionamento', 'quanto custa', 'avaliações', 'adicionar aos favoritos', 'Morena Bela'],
              'en restaurant secondary canonical values',
            );

            await setLanguage(page, 'pt-BR');
            await waitCategoryPresentation(page, 'beaches', 'Praias', 'Praias, 8 locais');

            if (pageErrors.length || mapboxHttpErrors.length) {
              throw new Error(`browser/provider errors: ${JSON.stringify({ pageErrors, mapboxHttpErrors })}`);
            }

            console.log(JSON.stringify({
              result: 'pass',
              locales: ['pt', 'en', 'es', 'he'],
              canonicalValuesPreserved: true,
              liveLanguageSwitch: true,
            }));
            await context.close();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/explore-v1-i18n/server.log || true
