name: Assistant Voice Loader Fix Once

on:
  push:
    branches:
      - test/assistant-voice-browser-pass
    paths:
      - .github/workflows/assistant-voice-loader-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Fix CommonJS Playwright loader and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs')
          text = path.read_text()
          text = text.replace('import { chromium } from "/tmp/pw/node_modules/playwright/index.js";', 'import playwright from "/tmp/pw/node_modules/playwright/index.js";\n\nconst { chromium } = playwright;')
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/assistant-voice-loader-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs .github/workflows/assistant-voice-loader-fix-once.yml
          git commit -m "fix(assistant): load Playwright CommonJS in voice contract"
          git push origin HEAD:test/assistant-voice-browser-pass
