name: Payments Persistence Integration

on:
  push:
    branches:
      - main
    paths:
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "tooling/payments/**"
      - ".github/workflows/payments-persistence-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/financial/**"
      - "packages/ordering/**"
      - "services/financial/**"
      - "services/ordering/**"
      - "tooling/payments/**"
      - ".github/workflows/payments-persistence-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m137-integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm137-integration"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/mysql
      ORDERING_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/ordering_m137_test
      FINANCIAL_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/financial_m137_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ordering MySQL integration
        run: pnpm --filter @touristic/ordering-server test:integration
      - name: Financial MySQL integration
        run: pnpm --filter @touristic/financial-server test:integration
      - name: Checkout application MySQL integration
        run: pnpm exec vitest run tooling/payments/checkout-mysql-integration.test.ts
