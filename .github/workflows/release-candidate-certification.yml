name: Release Candidate Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  candidate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove exact candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          lock="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: Build candidate once
        run: pnpm -w build
      - name: Package immutable application artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -czf morro-digital-candidate.tgz             apps/morro-digital-platform/dist             apps/morro-digital-platform/public             apps/morro-digital-platform/tooling             package.json pnpm-lock.yaml pnpm-workspace.yaml
          digest="$(sha256sum morro-digital-candidate.tgz | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Emit immutable release manifest
        env:
          TREE_SHA: ${{ steps.identity.outputs.tree }}
          LOCK_DIGEST: ${{ steps.identity.outputs.lock }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
        shell: bash
        run: |
          node tooling/ci/impact-analyzer.mjs             "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'HEAD^' }}"             "$GITHUB_SHA" > ci-impact-report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const impact = JSON.parse(fs.readFileSync('ci-impact-report.json', 'utf8'));
          const manifest = {
            commitSha: process.env.GITHUB_SHA,
            treeSha: process.env.TREE_SHA,
            artifactDigest: 'sha256:' + process.env.ARTIFACT_DIGEST,
            lockfileDigest: 'sha256:' + process.env.LOCK_DIGEST,
            risk: impact.risk,
            domains: impact.domains,
            selectedSuites: impact.suites,
            needsFullRegression: impact.needsFullRegression,
            workflowRun: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
          };
          fs.writeFileSync('release-candidate-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          cat release-candidate-manifest.json
      - name: Upload immutable candidate + evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morro-digital-candidate-${{ github.sha }}
          path: |
            morro-digital-candidate.tgz
            release-candidate-manifest.json
            ci-impact-report.json
          if-no-files-found: error
          retention-days: 30
