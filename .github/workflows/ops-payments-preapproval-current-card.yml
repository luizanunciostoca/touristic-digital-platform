name: Ops Payments Preapproval Current Card

on:
  push:
    branches:
      - ops/payments-preapproval-current-card-59ebf566-20260825

permissions:
  contents: read

jobs:
  existing-subscription-current-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_URL: https://morro-digital-v2-staging.onrender.com
      EXPECTED_RELEASE_SHA: 59ebf5667ea25fadb4647c75237356b123a5d119
      ACCEPTANCE_PASSWORD: ${{ secrets.STAGING_PAYMENTS_ACCEPTANCE_PASSWORD }}
      SUBSCRIPTION_ID: sub_8169106f-1adb-43b4-9e77-84fd5a2df36a
    steps:
      - name: Probe existing TEST subscription with current Mastercard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { randomUUID } = require('node:crypto');
          const base = process.env.STAGING_URL;
          const expectedSha = process.env.EXPECTED_RELEASE_SHA;
          const password = process.env.ACCEPTANCE_PASSWORD || '';
          const subscriptionId = process.env.SUBSCRIPTION_ID;
          const ownerEmail = 'test_payer@testuser.com';
          const businessId = 'biz_payments_acceptance';
          const referer = `${base}/business-onboarding.html`;

          function assert(ok, code) { if (!ok) throw new Error(code); }
          async function body(response) {
            const text = await response.text();
            try { return text ? JSON.parse(text) : {}; }
            catch { throw new Error(`NON_JSON_${response.status}`); }
          }
          function safe(payload) {
            return String(payload?.error || payload?.message || 'UNKNOWN')
              .replace(/[^A-Za-z0-9_.:-]/g, '_')
              .slice(0, 120);
          }
          function cookie(response) {
            const values = typeof response.headers.getSetCookie === 'function'
              ? response.headers.getSetCookie()
              : [response.headers.get('set-cookie')].filter(Boolean);
            return String(values[0] || '').split(';', 1)[0];
          }
          async function login() {
            const response = await fetch(`${base}/api/dashboard/auth/login`, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', Origin: base, Referer: referer },
              body: JSON.stringify({ email: ownerEmail, password }),
            });
            const payload = await body(response);
            assert(response.status === 200, `LOGIN_${response.status}_${safe(payload)}`);
            const sessionCookie = cookie(response);
            assert(sessionCookie.includes('='), 'COOKIE_MISSING');
            assert(typeof payload.csrfToken === 'string' && payload.csrfToken.length > 10, 'CSRF_MISSING');
            return { cookie: sessionCookie, csrf: payload.csrfToken };
          }
          function headers(session, mutation = true) {
            return {
              Accept: 'application/json', Origin: base, Referer: referer, Cookie: session.cookie,
              'X-Business-ID': businessId, 'X-Correlation-ID': `acceptance_${randomUUID()}`,
              ...(mutation ? { 'X-CSRF-Token': session.csrf, 'Content-Type': 'application/json' } : {}),
            };
          }
          async function tokenize(publicKey) {
            const url = new URL('https://api.mercadopago.com/v1/card_tokens');
            url.searchParams.set('public_key', publicKey);
            const response = await fetch(url, {
              method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({
                card_number: '5480832801033311', expiration_month: 11, expiration_year: 2030, security_code: '123',
                cardholder: { name: 'APRO', identification: { type: 'CPF', number: '12345678909' } },
              }),
            });
            const payload = await body(response);
            assert(response.ok && typeof payload.id === 'string', `TOKEN_${response.status}_${safe(payload)}`);
            return payload.id;
          }
          async function read(session) {
            const response = await fetch(`${base}/api/payments/v1/subscriptions/${encodeURIComponent(subscriptionId)}/provider`, {
              headers: headers(session, false), cache: 'no-store',
            });
            const payload = await body(response);
            assert(response.ok, `READ_${response.status}_${safe(payload)}`);
            return payload.data || {};
          }
          async function mutate(session, suffix) {
            const response = await fetch(`${base}/api/payments/v1/subscriptions/${encodeURIComponent(subscriptionId)}/provider/${suffix}`, {
              method: 'POST', headers: headers(session, true), body: '{}',
            });
            const payload = await body(response);
            assert(response.ok, `${suffix.toUpperCase()}_${response.status}_${safe(payload)}`);
            return payload.data || {};
          }

          (async () => {
            assert(base === 'https://morro-digital-v2-staging.onrender.com', 'TARGET_DENIED');
            assert(expectedSha === '59ebf5667ea25fadb4647c75237356b123a5d119', 'EXPECTED_SHA_DENIED');
            assert(subscriptionId === 'sub_8169106f-1adb-43b4-9e77-84fd5a2df36a', 'SUBSCRIPTION_DENIED');
            assert(password.length >= 20, 'SECRET_MISSING');

            const ready = await fetch(`${base}/readyz`, { cache: 'no-store' });
            assert(ready.status === 200, `READY_${ready.status}`);
            assert(ready.headers.get('x-release-sha') === expectedSha, 'SHA_MISMATCH');
            console.log('EXACT_RELEASE=PASS');

            const runtimeText = await (await fetch(`${base}/runtime-config.js`, { cache: 'no-store' })).text();
            assert(!runtimeText.includes('MERCADO_PAGO_ACCESS_TOKEN'), 'SERVER_SECRET_BROWSER_EXPOSED');
            assert(!runtimeText.includes('MERCADO_PAGO_WEBHOOK_SECRET'), 'WEBHOOK_SECRET_BROWSER_EXPOSED');
            const match = runtimeText.match(/Object\.freeze\((\{.*\})\);/su);
            assert(match, 'RUNTIME_PARSE');
            const publicKey = String(JSON.parse(match[1]).VITE_MERCADO_PAGO_PUBLIC_KEY || '');
            assert(publicKey.length > 20, 'PUBLIC_KEY_MISSING');
            console.log('BROWSER_SECRET_BOUNDARY=PASS');

            const session = await login();
            console.log('AUTH_OWNER=PASS');
            const cardToken = await tokenize(publicKey);
            console.log('CURRENT_TEST_CARD_TOKENIZATION=PASS');

            const providerPath = `${base}/api/payments/v1/subscriptions/${encodeURIComponent(subscriptionId)}/provider`;
            const response = await fetch(providerPath, {
              method: 'POST', headers: headers(session, true), body: JSON.stringify({ cardToken }),
            });
            const payload = await body(response);
            if (response.status === 503) {
              assert(safe(payload).includes('SUBSCRIPTION_PROVIDER_UNAVAILABLE'), 'UNEXPECTED_503');
              console.log('PREAPPROVAL_CURRENT_CARD=PROVIDER_UNAVAILABLE http=503');
              return;
            }
            assert(response.ok, `PREAPPROVAL_${response.status}_${safe(payload)}`);
            assert(payload.data?.providerStatus === 'authorized', 'PREAPPROVAL_NOT_AUTHORIZED');
            console.log('PREAPPROVAL_CREATE=PASS');

            assert((await read(session)).providerStatus === 'authorized', 'READ_AUTHORIZED_MISMATCH');
            console.log('PREAPPROVAL_READBACK=PASS');
            assert((await mutate(session, 'pause')).providerStatus === 'paused', 'PAUSE_MISMATCH');
            assert((await read(session)).providerStatus === 'paused', 'READ_PAUSED_MISMATCH');
            console.log('PREAPPROVAL_PAUSE_READ=PASS');
            assert((await mutate(session, 'resume')).providerStatus === 'authorized', 'RESUME_MISMATCH');
            assert((await read(session)).providerStatus === 'authorized', 'READ_RESUME_MISMATCH');
            console.log('PREAPPROVAL_RESUME_READ=PASS');
            assert((await mutate(session, 'cancel')).providerStatus === 'cancelled', 'CANCEL_MISMATCH');
            assert((await read(session)).providerStatus === 'cancelled', 'READ_CANCEL_MISMATCH');
            console.log('PREAPPROVAL_CANCEL_READ=PASS');
            console.log('SUBSCRIPTION_PROVIDER_LIFECYCLE=PASS');
          })().catch((error) => {
            console.error(`CURRENT_CARD_PROBE=FAIL reason=${String(error?.message || error).slice(0, 180)}`);
            process.exitCode = 1;
          });
          NODE
