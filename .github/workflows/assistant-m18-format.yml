name: Assistant M18 format

on:
  push:
    branches: [fix/assistant-runtime-m18-radius]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-runtime-m18-radius
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-v1-place-boundary.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-resolver.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/assistant/assistant-v1-place-boundary.ts apps/morro-digital-platform/src/assistant/assistant-v1-place-resolver.test.ts
          git commit -m "style(assistant): format M18 files"
          git pull --rebase origin fix/assistant-runtime-m18-radius
          git push origin HEAD:fix/assistant-runtime-m18-radius
