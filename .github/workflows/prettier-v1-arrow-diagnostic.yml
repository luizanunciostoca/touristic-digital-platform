name: Prettier V1 Arrow Diagnostic

on:
  push:
    branches:
      - fix/navigation-user-arrow-v1-parity
    paths:
      - .github/workflows/prettier-v1-arrow-diagnostic.yml
      - apps/morro-digital-platform/src/navigation/browser-navigation-wiring.ts
      - apps/morro-digital-platform/src/navigation/navigation-user-marker-v1-parity.test.ts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show canonical Prettier diff
        run: |
          pnpm exec prettier apps/morro-digital-platform/src/navigation/browser-navigation-wiring.ts apps/morro-digital-platform/src/navigation/navigation-user-marker-v1-parity.test.ts --write
          git diff -- apps/morro-digital-platform/src/navigation/browser-navigation-wiring.ts apps/morro-digital-platform/src/navigation/navigation-user-marker-v1-parity.test.ts
