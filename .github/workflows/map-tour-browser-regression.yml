              await page.locator('#map').evaluate(node => node.setAttribute('data-tour-flow-stage', 'intro'));
              const intro = await page.evaluate(() => {
                const list = document.querySelector('[data-value="__tour_list__"]');
                const start = document.querySelector('[data-value="__tour_next__"]');
                const listRect = list?.getBoundingClientRect();
                const startRect = start?.getBoundingClientRect();
                const listStyle = list instanceof HTMLElement ? getComputedStyle(list) : null;
                return {
                  list: listRect ? { width: listRect.width, height: listRect.height } : null,
                  start: startRect ? { width: startRect.width, height: startRect.height } : null,
                  whiteSpace: listStyle?.whiteSpace || '',
                  overflowWrap: listStyle?.overflowWrap || '',
                  text: list?.textContent?.trim() || '',
                };
              });
              if (
                !intro.list ||
                !intro.start ||
                intro.list.width < 120 ||
                intro.list.width + 2 < intro.start.width ||
                intro.whiteSpace === 'nowrap' ||
                intro.text !== 'Ver todas as paradas'
              ) {
                throw new Error('UX584 Tour secondary action collapsed ' + name + ': ' + JSON.stringify(intro));
              }
              await page.screenshot({
                path: '/tmp/map-tour-evidence/ux584-tour-' + name + '.png',
                fullPage: false,
                animations: 'disabled',
              });
              evidence.tour.push({
                viewport: { width, height },
                url: 'fixture://ux584-tour',
                finalDimensions: {
                  scrollWidth: stop.viewport.scrollWidth,
                  sheetHeight: stop.sheet.height,
                },
                fullPage: false,
                stop,
                intro,
              });
              await context.close();
            }

            const navContext = await browser.newContext({
              viewport: { width: 320, height: 568 },
              locale: 'pt-BR',
            });
            const navPage = await navContext.newPage();
            await navPage.setContent(
              '<style>' +
                foundations +
                navigationStyles +
                '</style><body data-md-mode="navigation"><section id="instruction-banner"><div class="instruction-secondary"><p id="instruction-details"></p></div></section></body>',
            );
            const routeNames = [
              ['pt-BR', 'Siga pela Rua Caminho do Farol'],
              ['en', 'Continue on Lighthouse Access Road'],
              ['es', 'Sigue por la Rua Caminho do Farol'],
              ['he', 'המשיכו בדרך Caminho do Farol'],
            ];
            for (const [locale, text] of routeNames) {
              const nav = await navPage.locator('#instruction-details').evaluate((node, value) => {
                node.textContent = value;
                node.setAttribute('lang', value === 'המשיכו בדרך Caminho do Farol' ? 'he' : '');
                const css = getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                const lineHeight = Number.parseFloat(css.lineHeight || '0');
                return {
                  text: node.textContent,
                  width: rect.width,
                  height: rect.height,
                  scrollWidth: node.scrollWidth,
                  clientWidth: node.clientWidth,
                  scrollHeight: node.scrollHeight,
                  clientHeight: node.clientHeight,
                  whiteSpace: css.whiteSpace,
                  textOverflow: css.textOverflow,
                  overflow: css.overflow,
                  lines: lineHeight > 0 ? rect.height / lineHeight : 0,
                };
              }, text);
              if (
                nav.whiteSpace !== 'normal' ||
                nav.textOverflow === 'ellipsis' ||
                nav.scrollHeight > nav.clientHeight + 1 ||
                nav.scrollWidth > nav.clientWidth + 1 ||
                nav.lines > 2.1
              ) {
                throw new Error('UX584 Navigation instruction clipping ' + locale + ': ' + JSON.stringify(nav));
              }
              evidence.navigation.push({ locale, ...nav });
            }
            await navContext.close();

            const crmContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'pt-BR',
            });
            const crmPage = await crmContext.newPage();
            const hydratedCrm = crmHtml.replace(
              '</head>',
              '<style>' + crmStyles + '</style></head>',
            );
            await crmPage.setContent(hydratedCrm);
            await crmPage.evaluate(() => {
              document.querySelectorAll('[hidden]').forEach(node => {
                if (node instanceof HTMLElement) node.hidden = false;
              });
            });
            const crm = await crmPage.evaluate(() => {
              const wide = document.querySelector('.lead-form-span-wide');
              const checklist = document.querySelector('.lead-checklist-card');
              const wideStyle = wide instanceof HTMLElement ? getComputedStyle(wide) : null;
              const checklistStyle =
                checklist instanceof HTMLElement ? getComputedStyle(checklist) : null;
              return {
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight,
                clientHeight: document.documentElement.clientHeight,
                wideGridColumn: wideStyle?.gridColumn || '',
                checklistPadding: checklistStyle?.padding || '',
                inlineGridStyleCount: document.querySelectorAll('[style*="grid-column"]').length,
              };
            });
            if (
              crm.scrollWidth > crm.clientWidth + 1 ||
              crm.inlineGridStyleCount !== 0 ||
              crm.wideGridColumn === 'span 2'
            ) {
              throw new Error('UX584 CRM mobile overflow: ' + JSON.stringify(crm));
            }
            await crmPage.screenshot({
              path: '/tmp/map-tour-evidence/ux584-crm-390x844.png',
              fullPage: false,
              animations: 'disabled',
            });
            evidence.crm = {
              exactHeadSha,
              exactTreeSha,
              viewport: { width: 390, height: 844 },
              url: 'fixture://ux584-crm-lead-detail',
              finalDimensions: {
                width: crm.scrollWidth,
                height: crm.scrollHeight,
                clientWidth: crm.clientWidth,
                clientHeight: crm.clientHeight,
              },
              fullPage: false,
              dataClass: 'Runtime with Fixture',
              fixtureId: 'UX584_CRM_LEAD_DETAIL_V1',
              locale: 'pt-BR',
              browser: 'chromium',
              device: 'chromium-mobile-viewport',
              timestamp: new Date().toISOString(),
              workflow: process.env.GITHUB_WORKFLOW,
              runId: process.env.GITHUB_RUN_ID,
              ...crm,
            };
            await crmContext.close();

            writeFileSync(
              '/tmp/map-tour-evidence/ux584-computed-layout.json',
              JSON.stringify(evidence, null, 2),
            );
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
