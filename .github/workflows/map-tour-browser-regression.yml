name: Map Tour Browser Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/map-tour-browser-regression.yml
      - tests/visual-regression/ux-v2-manual-reference-matrix.json
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/config/tour-catalog.ts
      - apps/morro-digital-platform/src/config/tour-markers.ts
      - apps/morro-digital-platform/src/config/tour-selection.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-flow-bottom-sheet.ts
      - apps/morro-digital-platform/public/explore-locations.css
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-flow.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.ts
      - apps/morro-digital-platform/src/runtime/map-style-readiness.ts
      - apps/morro-digital-platform/src/ux/outdoor-one-hand-v2-contract.test.ts
      - apps/morro-digital-platform/src/development/leaflet-compatibility-sdk.ts
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/public/index.html
      - package.json
      - pnpm-lock.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/map-tour-browser-regression.yml
      - tests/visual-regression/ux-v2-manual-reference-matrix.json
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - apps/morro-digital-platform/src/config/tour-catalog.ts
      - apps/morro-digital-platform/src/config/tour-markers.ts
      - apps/morro-digital-platform/src/config/tour-selection.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/explore-locations-v1-flow.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-flow.ts
      - apps/morro-digital-platform/src/map/immersive-tour-v1-i18n.ts
      - apps/morro-digital-platform/src/runtime/map-style-readiness.ts
      - apps/morro-digital-platform/src/ux/outdoor-one-hand-v2-contract.test.ts
      - apps/morro-digital-platform/src/development/leaflet-compatibility-sdk.ts
      - apps/morro-digital-platform/tooling/dev-server.mjs
      - apps/morro-digital-platform/public/premium-ux-v2.css
      - apps/morro-digital-platform/public/index.html
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tour-browser-regression:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/map-tour-evidence
      - name: Build workspace
        run: pnpm -w build
      - name: Start fallback runtime
        run: |
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/morro-map-tour.log 2>&1 &
          echo $! >/tmp/morro-map-tour.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/morro-map-tour.log
          exit 1
      - name: Validate V1 tour switching and guided immersive flow
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const cases = [
            ['mobile-360', 360, 800],
            ['mobile-390', 390, 844],
            ['mobile-430', 430, 932],
            ['tablet', 768, 1024],
            ['desktop', 1440, 900],
          ];

          async function snapshot(page) {
            return page.locator('#map').evaluate((element) => ({
              mode: element.getAttribute('data-map-mode'),
              provider: element.getAttribute('data-map-provider'),
              mapState: element.getAttribute('data-map-state'),
              homeState: element.getAttribute('data-home-state'),
              tourState: element.getAttribute('data-tour-state'),
              activeTour: element.getAttribute('data-active-tour'),
              markerCount: element.getAttribute('data-map-marker-count'),
              leaflet: element.classList.contains('leaflet-container') || Boolean(element.querySelector('.leaflet-pane')),
              visibleMarkers: element.querySelectorAll('.leaflet-marker-icon').length,
            }));
          }

          async function waitForHome(page) {
            await page.locator('#map[data-map-state="ready"][data-home-state="ready"][data-tour-state="idle"][data-map-marker-count="0"]').waitFor({
              state: 'attached',
              timeout: 20000,
            });
            await page.locator('#tour-select:not([disabled])').waitFor({ state: 'attached', timeout: 20000 });
            return snapshot(page);
          }

          async function waitForTour(page, tourId, count) {
            await page.locator(`#map[data-map-state="ready"][data-tour-state="ready"][data-active-tour="${tourId}"][data-map-marker-count="${count}"]`).waitFor({
              state: 'attached',
              timeout: 20000,
            });
            await page.waitForTimeout(300);
            return snapshot(page);
          }

          async function dispatchTour(page, tourId) {
            await page.locator('#tour-select').evaluate((element, value) => {
              if (!(element instanceof HTMLSelectElement)) throw new Error('Tour selector is not a select element.');
              element.value = value;
              element.dispatchEvent(new Event('change', { bubbles: true }));
            }, tourId);
          }

          async function guidedSnapshot(page) {
            return page.locator('#map').evaluate((element) => ({
              tourState: element.getAttribute('data-tour-state'),
              activeTour: element.getAttribute('data-active-tour'),
              flowStage: element.getAttribute('data-tour-flow-stage'),
              flowTourId: element.getAttribute('data-tour-flow-id'),
              stopIndex: element.getAttribute('data-tour-stop-index'),
              exploreStage: element.getAttribute('data-explore-stage'),
              markerCount: element.getAttribute('data-map-marker-count'),
            }));
          }

          async function waitForGuidedStage(page, stage, tourId, stopIndex = null) {
            const suffix = stopIndex === null ? '' : `[data-tour-stop-index="${stopIndex}"]`;
            await page.locator(
              `#map[data-tour-flow-stage="${stage}"][data-tour-flow-id="${tourId}"]${suffix}`,
            ).waitFor({ state: 'attached', timeout: 20000 });
            return guidedSnapshot(page);
          }

          async function assertTourModeComposition(page, label) {
            await page.waitForTimeout(250);
            const state = await page.evaluate(() => {
              const visibility = (selector) => {
                const element = document.querySelector(selector);
                if (!(element instanceof HTMLElement)) return null;
                const style = getComputedStyle(element);
                return {
                  visibility: style.visibility,
                  pointerEvents: style.pointerEvents,
                  opacity: Number.parseFloat(style.opacity || '1'),
                };
              };
              return {
                mode: document.body.dataset.mdMode ?? null,
                header: visibility('header'),
                weather: visibility('#weather-widget'),
                submenu: visibility('#submenu'),
                globe: visibility('#globe-map-control'),
                assistant: visibility('#assistant-messages'),
                composer: visibility('#assistant-input-area'),
                privacy: visibility('.analytics-consent-preferences.is-collapsed'),
              };
            });
            const hidden = (value) =>
              value === null ||
              (value.visibility === 'hidden' &&
                value.pointerEvents === 'none');
            if (
              state.mode !== 'tour' ||
              !hidden(state.header) ||
              !hidden(state.weather) ||
              !hidden(state.submenu) ||
              !hidden(state.globe) ||
              !hidden(state.assistant) ||
              !hidden(state.composer) ||
              !hidden(state.privacy)
            ) {
              throw new Error(
                `Tour mode composition drift at ${label}: ${JSON.stringify(state)}`,
              );
            }
            return state;
          }

          async function assertTourOutdoorReadability(page, label) {
            const state = await page.evaluate(() => {
              const title = document.querySelector('.tour-stop-title');
              const description = document.querySelector('.tour-stop-desc');
              const narration = document.querySelector('.tour-narration-btn');
              const actionButtons = Array.from(
                document.querySelectorAll('#assistant-category-results .assistant-option-btn'),
              ).filter((element) => {
                if (!(element instanceof HTMLElement)) return false;
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return (
                  rect.width > 0 &&
                  rect.height > 0 &&
                  style.visibility !== 'hidden' &&
                  style.display !== 'none'
                );
              });
              const titleStyle = title instanceof HTMLElement ? getComputedStyle(title) : null;
              const descriptionStyle =
                description instanceof HTMLElement ? getComputedStyle(description) : null;
              const narrationStyle =
                narration instanceof HTMLElement ? getComputedStyle(narration) : null;
              const narrationRect =
                narration instanceof HTMLElement ? narration.getBoundingClientRect() : null;
              const sheet = document.querySelector('#explore-flow-bottom-sheet[data-flow-kind="tour"]');
              const sheetRect = sheet instanceof HTMLElement ? sheet.getBoundingClientRect() : null;
              const progress = document.querySelector('.tour-stop-progress-bar');
              const progressRect = progress instanceof HTMLElement ? progress.getBoundingClientRect() : null;
              const compactHeader = document.querySelector('.tour-active-header');
              const compactHeaderRect =
                compactHeader instanceof HTMLElement
                  ? compactHeader.getBoundingClientRect()
                  : null;
              const compactCount = document.querySelector('.tour-active-count');
              const compactThumb = document.querySelector('.tour-active-thumb');
              const progressSegments = Array.from(
                document.querySelectorAll('.tour-stop-progress-segment'),
              );
              const technicalControls = [
                document.querySelector('.explore-flow-sheet-state-controls'),
                document.querySelector('.explore-flow-sheet-drag-handle'),
              ].map((element) => {
                if (!(element instanceof HTMLElement)) return false;
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              });
              return {
                viewport: {
                  width: innerWidth,
                  height: innerHeight,
                  scrollWidth: document.documentElement.scrollWidth,
                },
                sheet: sheetRect
                  ? { top: sheetRect.top, bottom: sheetRect.bottom, height: sheetRect.height }
                  : null,
                compactHeader: compactHeaderRect
                  ? {
                      text: compactHeader?.textContent?.trim() ?? '',
                      top: compactHeaderRect.top,
                      bottom: compactHeaderRect.bottom,
                      width: compactHeaderRect.width,
                      height: compactHeaderRect.height,
                    }
                  : null,
                compactCount: compactCount?.textContent?.trim() ?? '',
                compactThumbVisible:
                  compactThumb instanceof HTMLElement &&
                  !compactThumb.hidden &&
                  compactThumb.getBoundingClientRect().width > 0,
                progressSegments: progressSegments.map(element => ({
                  current: element.classList.contains('is-current'),
                  complete: element.classList.contains('is-complete'),
                })),
                progress: progressRect
                  ? { top: progressRect.top, bottom: progressRect.bottom, width: progressRect.width, height: progressRect.height }
                  : null,
                technicalControlsVisible: technicalControls.some(Boolean),
                titleFontPx: Number.parseFloat(titleStyle?.fontSize ?? '0'),
                descriptionFontPx: Number.parseFloat(
                  descriptionStyle?.fontSize ?? '0',
                ),
                narration: narrationRect
                  ? {
                      width: narrationRect.width,
                      height: narrationRect.height,
                      top: narrationRect.top,
                      bottom: narrationRect.bottom,
                      touchAction: narrationStyle?.touchAction ?? null,
                    }
                  : null,
                actions: actionButtons.map((element) => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return {
                    value: element.dataset.value ?? '',
                    width: rect.width,
                    height: rect.height,
                    top: rect.top,
                    bottom: rect.bottom,
                    fontPx: Number.parseFloat(style.fontSize || '0'),
                    touchAction: style.touchAction,
                  };
                }),
              };
            });

            if (!state.sheet || state.sheet.height > state.viewport.height * 0.5 + 1 || state.sheet.bottom > state.viewport.height + 1) {
              throw new Error(
                `Tour card covers excessive map context at ${label}: ${JSON.stringify(state.sheet)}`,
              );
            }
            const countParts = state.compactCount.split('/');
            const validCompactCount =
              countParts.length === 2 &&
              countParts.every(part => {
                const value = Number(part);
                return Number.isInteger(value) && value > 0;
              });
            if (
              !state.compactHeader ||
              state.compactHeader.width <= 0 ||
              state.compactHeader.bottom > state.viewport.height + 1 ||
              !validCompactCount ||
              !state.compactThumbVisible ||
              state.progressSegments.length === 0 ||
              state.progressSegments.filter(segment => segment.current).length !== 1
            ) {
              throw new Error(
                `Compact Tour header/current-total missing at ${label}: ${JSON.stringify({
                  compactHeader: state.compactHeader,
                  compactCount: state.compactCount,
                  compactThumbVisible: state.compactThumbVisible,
                  progressSegments: state.progressSegments,
                })}`,
              );
            }
            if (!state.progress || state.progress.width <= 0 || state.progress.height <= 0 || state.progress.bottom > state.viewport.height + 1) {
              throw new Error(
                `Tour progress is not visible at ${label}: ${JSON.stringify(state.progress)}`,
              );
            }
            if (state.technicalControlsVisible) {
              throw new Error(
                `Technical sheet controls leaked into Tour at ${label}`,
              );
            }
            if (state.viewport.scrollWidth > state.viewport.width + 1) {
              throw new Error(
                `Tour introduced horizontal overflow at ${label}: ${JSON.stringify(state.viewport)}`,
              );
            }
            if (state.titleFontPx < 16 || state.descriptionFontPx < 15) {
              throw new Error(
                `Tour outdoor typography too small at ${label}: ${JSON.stringify(state)}`,
              );
            }
            if (
              !state.narration ||
              state.narration.width < 44 ||
              state.narration.height < 44 ||
              state.narration.touchAction !== 'manipulation'
            ) {
              throw new Error(
                `Tour narration one-hand target drift at ${label}: ${JSON.stringify(state)}`,
              );
            }
            if (
              state.actions.length === 0 ||
              state.actions.some(
                (action) =>
                  action.height < 44 ||
                  action.fontPx < 16 ||
                  action.touchAction !== 'manipulation' ||
                  action.top < 0 ||
                  action.bottom > state.viewport.height + 1,
              )
            ) {
              throw new Error(
                `Tour action ergonomics drift at ${label}: ${JSON.stringify(state.actions)}`,
              );
            }
            return state;
          }

          async function assertTourDiscoveryConvergence(page, evidenceName) {
            await page.locator('#map[data-explore-state="ready"][data-explore-category="tours"][data-explore-stage="filters"][data-map-marker-count="4"]').waitFor({
              state: 'attached',
              timeout: 10000,
            });
            const state = await page.evaluate(() => {
              const sheet = document.querySelector('#explore-flow-bottom-sheet');
              const source = document.querySelector(
                '#assistant-category-results[data-category="tours"][data-stage="filters"]',
              );
              const markers = Array.from(
                document.querySelectorAll('.morro-explore-marker[data-explore-category="tours"]'),
              );
              const clusters = markers.filter(
                marker => marker.getAttribute('data-tour-cluster') === 'true',
              );
              const labels = Array.from(
                document.querySelectorAll(
                  '.morro-explore-marker[data-explore-category="tours"] .morro-explore-marker-label',
                ),
              );
              const filterButtons = source
                ? Array.from(source.querySelectorAll('.assistant-flow-option'))
                : [];
              const sheetRect =
                sheet instanceof HTMLElement ? sheet.getBoundingClientRect() : null;
              return {
                viewport: { width: innerWidth, height: innerHeight },
                sheet: sheetRect
                  ? { width: sheetRect.width, height: sheetRect.height, bottom: sheetRect.bottom }
                  : null,
                markerCount: markers.length,
                clusterCounts: clusters.map(marker => marker.getAttribute('data-cluster-count')),
                visibleLabels: labels.filter(label => {
                  if (!(label instanceof HTMLElement)) return false;
                  return getComputedStyle(label).display !== 'none';
                }).length,
                filters: filterButtons.map(button => {
                  const rect = button.getBoundingClientRect();
                  const style = getComputedStyle(button);
                  return {
                    width: rect.width,
                    height: rect.height,
                    whiteSpace: style.whiteSpace,
                    overflow: style.overflow,
                    textOverflow: style.textOverflow,
                  };
                }),
              };
            });

            if (
              !state.sheet ||
              state.sheet.height > state.viewport.height * 0.3 + 1 ||
              state.sheet.bottom > state.viewport.height + 1
            ) {
              throw new Error(`Tour discovery is not map-first: ${JSON.stringify(state)}`);
            }
            if (
              state.markerCount !== 4 ||
              state.clusterCounts.length !== 1 ||
              state.clusterCounts[0] !== '3'
            ) {
              throw new Error(`Tour discovery clustering drift: ${JSON.stringify(state)}`);
            }
            if (state.visibleLabels !== 0) {
              throw new Error(`Tour labels collide by default: ${JSON.stringify(state)}`);
            }
            if (
              state.filters.length < 3 ||
              state.filters.some(
                filter =>
                  filter.height < 44 ||
                  filter.whiteSpace !== 'nowrap' ||
                  filter.overflow !== 'hidden' ||
                  filter.textOverflow !== 'ellipsis',
              )
            ) {
              throw new Error(`Tour compact filters drift: ${JSON.stringify(state.filters)}`);
            }
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-discovery-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });
            return state;
          }

          async function assertTourPreviewConvergence(page, evidenceName) {
            const state = await page.evaluate(() => {
              const sheet = document.querySelector(
                '#explore-flow-bottom-sheet[data-flow-kind="tour"]',
              );
              const start = document.querySelector(
                '#assistant-category-results [data-value="__tour_start__"]',
              );
              const list = document.querySelector(
                '#assistant-category-results [data-value="__tour_list__"]',
              );
              const sheetRect =
                sheet instanceof HTMLElement ? sheet.getBoundingClientRect() : null;
              const startRect =
                start instanceof HTMLElement ? start.getBoundingClientRect() : null;
              const listRect =
                list instanceof HTMLElement ? list.getBoundingClientRect() : null;
              const startStyle = start instanceof HTMLElement ? getComputedStyle(start) : null;
              return {
                viewport: { width: innerWidth, height: innerHeight },
                sheet: sheetRect
                  ? { width: sheetRect.width, height: sheetRect.height, bottom: sheetRect.bottom }
                  : null,
                start: startRect
                  ? {
                      width: startRect.width,
                      height: startRect.height,
                      disabled: start instanceof HTMLButtonElement ? start.disabled : true,
                      opacity: Number.parseFloat(startStyle?.opacity ?? '0'),
                      primary: start.classList.contains('md-button--primary'),
                    }
                  : null,
                list: listRect
                  ? {
                      width: listRect.width,
                      height: listRect.height,
                      primary: list?.classList.contains('md-button--primary') ?? false,
                    }
                  : null,
              };
            });
            if (
              !state.sheet ||
              state.sheet.height > state.viewport.height * 0.45 + 1 ||
              !state.start ||
              state.start.disabled ||
              !state.start.primary ||
              state.start.opacity < 0.95 ||
              state.start.height < 44
            ) {
              throw new Error(`Tour preview/Start Tour drift: ${JSON.stringify(state)}`);
            }
            if (!state.list || state.list.primary || state.list.width >= state.start.width) {
              throw new Error(`See all stops still competes with Start Tour: ${JSON.stringify(state)}`);
            }
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-preview-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });
            return state;
          }

          async function openGuidedTour(page, tourId, markerCount, evidenceName = 'runtime') {
            await page.locator('body[data-public-onboarding-settled="true"]:not(.tour-active)').waitFor({
              state: 'attached',
              timeout: 20000,
            });

            const assistant = page.locator('#assistant-messages');
            if (!(await assistant.isVisible())) {
              await page.locator('#assistantInput').focus();
            }
            await assistant.waitFor({ state: 'visible', timeout: 5000 });
            await page.locator('#assistant-category-tours').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#assistant-category-tours').click();
            await assertTourDiscoveryConvergence(page, evidenceName ?? 'runtime');
            const shortcut = page.locator(
              `#assistant-category-results .assistant-flow-option[data-tour-id="${tourId}"]`,
            );
            await shortcut.waitFor({ state: 'visible', timeout: 10000 });
            await shortcut.click();
            const intro = await waitForGuidedStage(page, 'intro', tourId);
            await assertTourModeComposition(page, 'intro');
            await page.locator('.tour-intro-card').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#assistant-category-results [data-value="__tour_start__"]').waitFor({
              state: 'visible',
              timeout: 10000,
            });
            await page.locator(
              `#map[data-tour-state="ready"][data-active-tour="${tourId}"][data-map-marker-count="${markerCount}"]`,
            ).waitFor({ state: 'attached', timeout: 20000 });
            await assertTourPreviewConvergence(page, evidenceName);
            return intro;
          }

          async function waitForSpeechCount(page, previousCount, timeout = 3000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              const count = await page.evaluate(
                () => globalThis.__tourSpeechEvidence.spoken.length,
              );
              if (count > previousCount) return count;
              await page.waitForTimeout(50);
            }
            throw new Error(
              `Timed out waiting for tour speech after ${previousCount} utterances.`,
            );
          }

          async function validateGuidedV1Flow(page, evidenceName) {
            const intro = await openGuidedTour(page, 'volta-a-ilha', '8', evidenceName);
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-intro-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });

            await page.locator('#assistant-category-results [data-value="__tour_start__"]').click();
            const first = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '0');
            await assertTourModeComposition(page, 'first-stop');
            await page.locator('.tour-stop-card').waitFor({ state: 'visible', timeout: 10000 });
            if (!(await page.locator('.tour-stop-pin.tour-stop-active').count())) {
              throw new Error('Guided tour did not highlight the active V1 stop marker.');
            }
            const firstBoundary = await page.evaluate(() => ({
              previous: document.querySelectorAll(
                '#assistant-category-results [data-value="__tour_prev__"]',
              ).length,
              next: document.querySelectorAll(
                '#assistant-category-results [data-value="__tour_next__"]',
              ).length,
              count: document.querySelector('.tour-active-count')?.textContent?.trim() ?? '',
              cardIndex: document.querySelector('.tour-stop-card')?.getAttribute('data-stop-index'),
              activeIndex: document
                .querySelector('.tour-stop-pin.tour-stop-active')
                ?.closest('.tour-stop-marker')
                ?.getAttribute('data-stop-index'),
              markerNumbers: Array.from(
                document.querySelectorAll('.tour-stop-number'),
              ).map(element => element.textContent?.trim() ?? ''),
            }));
            if (
              firstBoundary.previous !== 0 ||
              firstBoundary.next !== 1 ||
              firstBoundary.count !== '1/8' ||
              firstBoundary.cardIndex !== '0' ||
              firstBoundary.activeIndex !== '0' ||
              firstBoundary.markerNumbers.join(',') !== '1,2,3,4,5,6,7,8'
            ) {
              throw new Error(
                `First-stop/current-marker atomicity drift: ${JSON.stringify(firstBoundary)}`,
              );
            }

            const expectedSpeechLang = await page.evaluate(() => {
              const lang = document.documentElement.lang.toLowerCase();
              if (lang.startsWith('en')) return 'en-US';
              if (lang.startsWith('es')) return 'es-ES';
              if (lang.startsWith('he')) return 'he-IL';
              return 'pt-BR';
            });
            await waitForSpeechCount(page, 0);
            const narrationButton = page.locator('.tour-narration-btn');
            await narrationButton.waitFor({ state: 'attached', timeout: 3000 });
            await assertTourOutdoorReadability(page, 'first-stop');
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-stop-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });
            const stopImage = page.locator('.tour-stop-photo');
            if (await stopImage.count()) {
              await stopImage.evaluate(element =>
                element.dispatchEvent(new Event('error')),
              );
              await page.locator(
                '.tour-stop-card[data-photo-state="missing"] .tour-stop-photo-wrap[hidden]',
              ).waitFor({ state: 'attached', timeout: 3000 });
            }
            const autoNarration = await page.evaluate(() => ({
              ...globalThis.__tourSpeechEvidence,
              spoken: [...globalThis.__tourSpeechEvidence.spoken],
            }));
            const automaticSpeech = autoNarration.spoken.at(-1);
            if (
              !automaticSpeech ||
              automaticSpeech.lang !== expectedSpeechLang ||
              (await narrationButton.getAttribute('aria-pressed')) !== 'true'
            ) {
              throw new Error(
                `Automatic tour narration did not start with the active locale: ${JSON.stringify({
                  expectedSpeechLang,
                  autoNarration,
                })}`,
              );
            }

            await narrationButton.evaluate(element => element.click());
            const stoppedNarration = await page.evaluate(() => ({
              ...globalThis.__tourSpeechEvidence,
              spoken: [...globalThis.__tourSpeechEvidence.spoken],
            }));
            if (
              stoppedNarration.cancelled <= autoNarration.cancelled ||
              (await narrationButton.getAttribute('aria-pressed')) !== 'false'
            ) {
              throw new Error(`Tour narration stop did not cancel speech: ${JSON.stringify(stoppedNarration)}`);
            }

            await narrationButton.evaluate(element => element.click());
            const manualNarration = await page.evaluate(() => ({
              ...globalThis.__tourSpeechEvidence,
              spoken: [...globalThis.__tourSpeechEvidence.spoken],
            }));
            if (
              manualNarration.spoken.length <= autoNarration.spoken.length ||
              manualNarration.spoken.at(-1)?.lang !== expectedSpeechLang
            ) {
              throw new Error(`Manual tour narration did not restart speech: ${JSON.stringify(manualNarration)}`);
            }

            await page.locator('.tour-stop-marker[data-stop-index="2"]').evaluate(element => element.click());
            const markerJump = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '2');
            await waitForSpeechCount(page, manualNarration.spoken.length);
            const changedStopNarration = await page.evaluate(() => ({
              ...globalThis.__tourSpeechEvidence,
              spoken: [...globalThis.__tourSpeechEvidence.spoken],
            }));
            if (
              changedStopNarration.spoken.length <= manualNarration.spoken.length ||
              changedStopNarration.cancelled <= stoppedNarration.cancelled
            ) {
              throw new Error(`Tour narration did not transition safely between stops: ${JSON.stringify(changedStopNarration)}`);
            }

            await page.locator('#assistant-category-results [data-value="__tour_next__"]').click();
            const next = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '3');

            await page.locator('#assistant-category-results [data-value="__tour_prev__"]').click();
            const previous = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '2');
            await page.locator('#assistant-category-results [data-value="__tour_next__"]').click();
            const nextAfterPrevious = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '3');

            await page.locator('#assistant-category-results [data-value="__tour_list__"]').click();
            const list = await waitForGuidedStage(page, 'list', 'volta-a-ilha');
            await page.locator('.tour-stop-list-card').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#assistant-category-results [data-value="__tour_stop_7__"]').click();
            const directLast = await waitForGuidedStage(page, 'stop', 'volta-a-ilha', '7');
            const lastBoundary = await page.evaluate(() => ({
              previous: document.querySelectorAll(
                '#assistant-category-results [data-value="__tour_prev__"]',
              ).length,
              next: document.querySelectorAll(
                '#assistant-category-results [data-value="__tour_next__"]',
              ).length,
              finish: document.querySelectorAll(
                '#assistant-category-results [data-value="__tour_finish__"]',
              ).length,
              count: document.querySelector('.tour-active-count')?.textContent?.trim() ?? '',
              cardIndex: document.querySelector('.tour-stop-card')?.getAttribute('data-stop-index'),
              activeIndex: document
                .querySelector('.tour-stop-pin.tour-stop-active')
                ?.closest('.tour-stop-marker')
                ?.getAttribute('data-stop-index'),
            }));
            if (
              lastBoundary.previous !== 1 ||
              lastBoundary.next !== 0 ||
              lastBoundary.finish !== 1 ||
              lastBoundary.count !== '8/8' ||
              lastBoundary.cardIndex !== '7' ||
              lastBoundary.activeIndex !== '7'
            ) {
              throw new Error(
                `Last-stop/completion boundary drift: ${JSON.stringify(lastBoundary)}`,
              );
            }
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-last-stop-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });

            await page.locator('#assistant-category-results [data-value="__tour_finish__"]').click();
            const finale = await waitForGuidedStage(page, 'finale', 'volta-a-ilha');
            await page.locator('.tour-finale-card').waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({
              path: `/tmp/map-tour-evidence/tour-finale-${evidenceName}.png`,
              fullPage: false,
              animations: 'disabled',
            });

            await page.locator('#assistant-category-results [data-value="__tour_see_tours__"]').click();
            await page.locator('#map[data-tour-state="idle"]:not([data-active-tour])').waitFor({
              state: 'attached',
              timeout: 10000,
            });
            await page.locator('#assistant-category-results[data-category="tours"][data-stage="filters"]').waitFor({
              state: 'attached',
              timeout: 10000,
            });
            const returnedToTours = await guidedSnapshot(page);

            return {
              intro,
              first,
              autoNarration,
              stoppedNarration,
              manualNarration,
              markerJump,
              changedStopNarration,
              next,
              previous,
              nextAfterPrevious,
              list,
              directLast,
              finale,
              returnedToTours,
            };
          }

          async function validateRefreshReentry(page) {
            await page.reload({ waitUntil: 'domcontentloaded' });
            const refreshedHome = await waitForHome(page);
            const intro = await openGuidedTour(page, 'trilha-gamboa', '5', 'refresh-reentry');
            await page.locator('#assistant-category-results [data-value="__tour_start__"]').click();
            const first = await waitForGuidedStage(page, 'stop', 'trilha-gamboa', '0');
            await page.locator('.tour-stop-card').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#explore-flow-bottom-sheet[data-flow-kind="tour"] .explore-flow-sheet-close').click();
            await page.locator('#map[data-tour-state="idle"]:not([data-active-tour])').waitFor({
              state: 'attached',
              timeout: 10000,
            });
            const cancelled = await guidedSnapshot(page);
            if (cancelled.flowStage !== null || cancelled.flowTourId !== null) {
              throw new Error(`Tour cancel did not restore idle map state: ${JSON.stringify(cancelled)}`);
            }
            return { refreshedHome, intro, first, cancelled };
          }

          async function failureEvidence(page, name, phase, pageErrors) {
            let map = null;
            let select = null;
            let status = null;
            try { map = await snapshot(page); } catch (error) { map = { snapshotError: String(error) }; }
            try {
              select = await page.locator('#tour-select').evaluate((element) => ({
                value: element.value,
                selectedIndex: element.selectedIndex,
                disabled: element.disabled,
                options: Array.from(element.options).map(option => option.value),
              }));
            } catch (error) { select = { snapshotError: String(error) }; }
            try { status = await page.locator('#runtime-status').textContent(); } catch (error) { status = String(error); }
            const shell = await page.locator('body').evaluate((body) => ({
              className: body.className,
              onboardingSettled: body.getAttribute('data-public-onboarding-settled'),
              assistantHidden: document.getElementById('assistant-messages')?.classList.contains('hidden') ?? null,
              assistantAriaHidden: document.getElementById('assistant-messages')?.getAttribute('aria-hidden') ?? null,
            })).catch((error) => ({ snapshotError: String(error) }));
            const evidence = { status: 'failed', viewport: name, phase, map, select, shell, runtimeStatus: status, pageErrors };
            writeFileSync(`/tmp/map-tour-evidence/failure-${name}.json`, JSON.stringify(evidence, null, 2));
            try { await page.screenshot({ path: `/tmp/map-tour-evidence/failure-${name}.png`, fullPage: false }); } catch {}
            return evidence;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = {};

            for (const [name, width, height] of cases) {
              const context = await browser.newContext({ viewport: { width, height } });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                globalThis.__tourSpeechEvidence = { spoken: [], cancelled: 0 };
                globalThis.SpeechSynthesisUtterance = class {
                  constructor(text) {
                    this.text = String(text || '');
                    this.lang = '';
                    this.rate = 1;
                    this.pitch = 1;
                    this.volume = 1;
                    this.voice = null;
                    this.onend = null;
                    this.onerror = null;
                  }
                };
                Object.defineProperty(globalThis, 'speechSynthesis', {
                  configurable: true,
                  value: {
                    addEventListener() {},
                    cancel() {
                      globalThis.__tourSpeechEvidence.cancelled += 1;
                    },
                    getVoices() {
                      return [
                        {
                          name: 'Tour Test Voice',
                          lang: 'pt-BR',
                          default: true,
                        },
                      ];
                    },
                    removeEventListener() {},
                    speak(utterance) {
                      globalThis.__tourSpeechEvidence.spoken.push({
                        text: String(utterance?.text || ''),
                        lang: String(utterance?.lang || ''),
                      });
                    },
                  },
                });
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              let phase = 'navigation';

              try {
                await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
                phase = 'initial-home';
                const home = await waitForHome(page);
                if (home.mode !== 'leaflet' || !home.leaflet || home.activeTour !== null || home.visibleMarkers !== 0) {
                  throw new Error(`Initial Home state failed for ${name}: ${JSON.stringify(home)}`);
                }

                phase = 'volta-a-ilha';
                await dispatchTour(page, 'volta-a-ilha');
                const volta = await waitForTour(page, 'volta-a-ilha', '8');
                if (volta.visibleMarkers !== 8) {
                  throw new Error(`Volta a Ilha marker activation failed for ${name}: ${JSON.stringify(volta)}`);
                }

                phase = 'trilha-gamboa';
                await dispatchTour(page, 'trilha-gamboa');
                const gamboa = await waitForTour(page, 'trilha-gamboa', '5');
                if (gamboa.visibleMarkers !== 5) {
                  throw new Error(`Gamboa marker replacement failed for ${name}: ${JSON.stringify(gamboa)}`);
                }

                phase = 'passeio-quadriciclo';
                await dispatchTour(page, 'passeio-quadriciclo');
                const quadriciclo = await waitForTour(page, 'passeio-quadriciclo', '5');
                if (quadriciclo.visibleMarkers !== 5) {
                  throw new Error(`Quadriciclo marker replacement failed for ${name}: ${JSON.stringify(quadriciclo)}`);
                }

                phase = 'restore-volta-a-ilha';
                await dispatchTour(page, 'volta-a-ilha');
                const restored = await waitForTour(page, 'volta-a-ilha', '8');
                if (restored.visibleMarkers !== 8) {
                  throw new Error(`Return to Volta a Ilha failed for ${name}: ${JSON.stringify(restored)}`);
                }

                phase = 'guided-v1-flow';
                const guided = await validateGuidedV1Flow(page, name);

                phase = 'refresh-reentry';
                const refreshReentry = await validateRefreshReentry(page);

                if (pageErrors.length > 0) throw new Error(`Browser errors for ${name}: ${JSON.stringify(pageErrors)}`);
                evidence[name] = {
                  home,
                  volta,
                  gamboa,
                  quadriciclo,
                  restored,
                  guided,
                  refreshReentry,
                  pageErrors,
                };
                writeFileSync(`/tmp/map-tour-evidence/success-${name}.json`, JSON.stringify(evidence[name], null, 2));
                await page.screenshot({ path: `/tmp/map-tour-evidence/fallback-tour-${name}.png`, fullPage: false });
              } catch (error) {
                const details = await failureEvidence(page, name, phase, pageErrors);
                throw new Error(`${error instanceof Error ? error.message : String(error)} Evidence: ${JSON.stringify(details)}`);
              } finally {
                await context.close();
              }
            }

            writeFileSync('/tmp/map-tour-evidence/fallback-tour-switching.json', JSON.stringify({ status: 'validated', viewports: evidence }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/morro-map-tour.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: map-tour-browser-evidence
          path: /tmp/map-tour-evidence
          retention-days: 1
          if-no-files-found: ignore
