name: M35 Format Final Docs Once

on:
  push:
    branches:
      - feat/assistant-m35-photo-assets

permissions:
  contents: write

jobs:
  format-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-m35-photo-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final M35 docs
        run: |
          pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md docs/qa/ASSISTANT-M35-EVIDENCE.md
          rm .github/workflows/m35-format-final-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md docs/qa/ASSISTANT-M35-EVIDENCE.md .github/workflows/m35-format-final-docs-once.yml
          git diff --cached --check
          git commit -m 'style(assistant): format M35 final evidence'
          git push origin HEAD:feat/assistant-m35-photo-assets
