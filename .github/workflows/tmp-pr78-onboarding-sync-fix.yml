name: Temporary PR78 Onboarding Sync Fix

on:
  push:
    branches:
      - fix/runtime-accessibility-i18n-parity

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-accessibility-i18n-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply onboarding synchronization hardening
        run: python tooling/tmp-pr78-onboarding-sync-fix.py
      - name: Format changed test
        run: pnpm exec prettier --write apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
      - name: App lint
        run: pnpm --filter @touristic/morro-digital-platform lint
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/explore-v1-i18n
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated Mapbox runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/explore-v1-i18n/server.log 2>&1 &
          echo $! >/tmp/explore-v1-i18n/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/explore-v1-i18n/server.log
          exit 1
      - name: Verify PT EN ES HE browser parity
        run: node apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated synchronization hardening
        run: |
          rm tooling/tmp-pr78-onboarding-sync-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs \
            tooling/tmp-pr78-onboarding-sync-fix.py
          git diff --cached --check
          git commit -m "test(i18n): wait for settled onboarding before assistant"
          git push origin HEAD:fix/runtime-accessibility-i18n-parity
