name: PR38 Prettier Evidence

on:
  pull_request:
    paths:
      - .github/workflows/pr38-prettier-evidence.yml
      - apps/morro-digital-platform/src/browser-entry.ts
      - apps/morro-digital-platform/src/config/tour-selection.ts
      - apps/morro-digital-platform/src/onboarding/public-onboarding.ts

permissions:
  contents: read

jobs:
  format-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files with repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/config/tour-selection.ts \
            apps/morro-digital-platform/src/onboarding/public-onboarding.ts
          pnpm exec prettier --check \
            apps/morro-digital-platform/src/browser-entry.ts \
            apps/morro-digital-platform/src/config/tour-selection.ts \
            apps/morro-digital-platform/src/onboarding/public-onboarding.ts
          mkdir -p /tmp/pr38-prettier/apps/morro-digital-platform/src/config
          mkdir -p /tmp/pr38-prettier/apps/morro-digital-platform/src/onboarding
          cp apps/morro-digital-platform/src/browser-entry.ts /tmp/pr38-prettier/apps/morro-digital-platform/src/browser-entry.ts
          cp apps/morro-digital-platform/src/config/tour-selection.ts /tmp/pr38-prettier/apps/morro-digital-platform/src/config/tour-selection.ts
          cp apps/morro-digital-platform/src/onboarding/public-onboarding.ts /tmp/pr38-prettier/apps/morro-digital-platform/src/onboarding/public-onboarding.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr38-prettier-evidence
          path: /tmp/pr38-prettier
          retention-days: 1
          if-no-files-found: error
