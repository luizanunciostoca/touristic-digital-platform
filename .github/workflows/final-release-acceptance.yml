name: Final Release Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/final-release-acceptance.yml"
      - ".github/workflows/ux-v2-manual-golden-conformance.yml"
      - "tooling/ci/release-acceptance-manifest.json"
      - "tooling/quality/check-release-acceptance-manifest.mjs"
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: final-release-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.15.0
  TURBO_TELEMETRY_DISABLED: 1
  STAGING_URL: https://morro-digital-v2-staging.onrender.com

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deterministic acceptance inventory
        run: |
          pnpm release:acceptance-manifest:check
          grep -Fq '"workflow": "ux-v2-manual-golden-conformance.yml"' tooling/ci/release-acceptance-manifest.json

  acceptance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish pending acceptance status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='Final Release Acceptance' \
            -f description='Exact-head browser and staging acceptance is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Prove exact acceptance SHA is current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$GITHUB_SHA"
          echo "Exact main SHA: $GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release acceptance manifest
        run: pnpm release:acceptance-manifest:check

      - name: Build exact-head release candidate once
        run: pnpm build

      - name: Capture exact current tree
        id: tree-source
        shell: bash
        run: |
          set -euo pipefail
          current_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          echo "current_tree=$current_tree" >> "$GITHUB_OUTPUT"
          echo "Exact release tree: $current_tree"

      - name: Reuse proven tree-equivalent evidence and dispatch only missing suites
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TREE: ${{ steps.tree-source.outputs.current_tree }}
        run: |
          set -euo pipefail
          : > /tmp/final-acceptance-runs.tsv
          : > /tmp/tree-cache.tsv

          commit_tree() {
            local sha="$1"
            local cached
            cached="$(awk -F '\t' -v sha="$sha" '$1 == sha {print $2; exit}' /tmp/tree-cache.tsv)"
            if [ -n "$cached" ]; then
              printf '%s' "$cached"
              return
            fi
            local tree
            tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.tree.sha' 2>/dev/null || true)"
            if [ -n "$tree" ]; then
              printf '%s\t%s\n' "$sha" "$tree" >> /tmp/tree-cache.tsv
            fi
            printf '%s' "$tree"
          }

          while IFS=$'\t' read -r workflow reuse_tree_equivalent; do
            run_id=""
            mode="dispatch"
            expected_sha="$GITHUB_SHA"

            if [ "$reuse_tree_equivalent" = "true" ]; then
              while IFS=$'\t' read -r candidate_run candidate_sha candidate_event; do
                [ -n "$candidate_run" ] || continue
                [ "$candidate_sha" != "$GITHUB_SHA" ] || continue
                candidate_tree="$(commit_tree "$candidate_sha")"
                if [ "$candidate_tree" = "$CURRENT_TREE" ]; then
                  run_id="$candidate_run"
                  mode="reuse"
                  expected_sha="$candidate_sha"
                  echo "REUSE: $workflow -> run $run_id @ $candidate_sha ($candidate_event), identical tree $CURRENT_TREE"
                  break
                fi
              done < <(
                gh run list \
                  --workflow "$workflow" \
                  --status success \
                  --limit 30 \
                  --json databaseId,headSha,event \
                | jq -r '.[] | [.databaseId, .headSha, .event] | @tsv'
              )
            fi

            if [ -z "$run_id" ]; then
              echo "DISPATCH: $workflow on main@$GITHUB_SHA"
              gh workflow run "$workflow" --ref main

              for _ in $(seq 1 45); do
                run_id="$(
                  gh run list \
                    --workflow "$workflow" \
                    --event workflow_dispatch \
                    --branch main \
                    --limit 10 \
                    --json databaseId,headSha,createdAt \
                  | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
                )"
                if [ -n "$run_id" ]; then
                  break
                fi
                sleep 2
              done
            fi

            if [ -z "$run_id" ]; then
              echo "Unable to resolve evidence run for $workflow" >&2
              exit 1
            fi

            printf '%s\t%s\t%s\t%s\n' "$workflow" "$mode" "$run_id" "$expected_sha" >> /tmp/final-acceptance-runs.tsv
          done < <(
            jq -r '.suites[] | [.workflow, (.reuse_tree_equivalent // false | tostring)] | @tsv' \
              tooling/ci/release-acceptance-manifest.json
          )

          reused="$(awk -F '\t' '$2 == "reuse" {count++} END {print count+0}' /tmp/final-acceptance-runs.tsv)"
          dispatched="$(awk -F '\t' '$2 == "dispatch" {count++} END {print count+0}' /tmp/final-acceptance-runs.tsv)"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "dispatched=$dispatched" >> "$GITHUB_OUTPUT"
          echo "Acceptance evidence: $reused reused, $dispatched dispatched."

      - name: Wait collectively for acceptance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while true; do
            pending=0
            failed=0

            while IFS=$'\t' read -r workflow mode run_id expected_sha; do
              state="$(gh run view "$run_id" --json status,conclusion,headSha)"
              status="$(jq -r '.status' <<<"$state")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$state")"
              observed_sha="$(jq -r '.headSha' <<<"$state")"

              if [ "$observed_sha" != "$expected_sha" ]; then
                echo "SHA DRIFT: $workflow expected $expected_sha got $observed_sha" >&2
                failed=1
                continue
              fi

              if [ "$status" != "completed" ]; then
                pending=$((pending + 1))
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "FAILED: $workflow ($mode run $run_id) conclusion=$conclusion" >&2
                failed=1
              fi
            done < /tmp/final-acceptance-runs.tsv

            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              break
            fi

            echo "Waiting for $pending acceptance suites..."
            sleep 10
          done

      - name: Dispatch exact-SHA staging promotion
        id: staging-promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run staging-render-promotion.yml \
            --ref main \
            -f expected_sha="$GITHUB_SHA" \
            -f confirm_staging=DEPLOY

          run_id=""
          for _ in $(seq 1 45); do
            run_id="$(
              gh run list \
                --workflow staging-render-promotion.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty'
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "Unable to resolve staging promotion run for $GITHUB_SHA" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Staging promotion dispatched: run $run_id for $GITHUB_SHA"

      - name: Wait for exact-SHA staging promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_PROMOTION_RUN_ID: ${{ steps.staging-promotion.outputs.run_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            state="$(gh run view "$STAGING_PROMOTION_RUN_ID" --json status,conclusion,headSha)"
            status="$(jq -r '.status' <<<"$state")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$state")"
            observed_sha="$(jq -r '.headSha' <<<"$state")"

            if [ "$observed_sha" != "$GITHUB_SHA" ]; then
              echo "Staging promotion SHA drift: expected $GITHUB_SHA got $observed_sha" >&2
              exit 1
            fi

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Staging promotion failed: run $STAGING_PROMOTION_RUN_ID conclusion=$conclusion" >&2
                exit 1
              fi
              echo "Staging promotion PASS: run $STAGING_PROMOTION_RUN_ID"
              exit 0
            fi

            sleep 10
          done

          echo "Staging promotion timed out: run $STAGING_PROMOTION_RUN_ID" >&2
          exit 1

      - name: Prove exact-SHA live staging health and readiness
        shell: bash
        run: |
          set -euo pipefail
          last_output=""
          for _ in $(seq 1 90); do
            if output="$(MORRO_V2_BASE_URL="$STAGING_URL" pnpm --silent payments:render:smoke 2>&1)"; then
              release_sha="$(printf '%s\n' "$output" | tail -n 1 | jq -r '.releaseSha // empty' 2>/dev/null || true)"
              if [ "$release_sha" = "$GITHUB_SHA" ]; then
                printf '%s\n' "$output"
                echo "Exact-SHA staging smoke PASS: $release_sha"
                exit 0
              fi
              last_output="$output"
              echo "Staging release is ${release_sha:-unknown}; waiting for $GITHUB_SHA"
            else
              last_output="$output"
              echo "Staging smoke not ready yet; retrying"
            fi
            sleep 10
          done
          printf '%s\n' "$last_output" >&2
          echo "Exact-SHA staging smoke timed out for $GITHUB_SHA" >&2
          exit 1

      - name: Re-prove main did not move during acceptance
        shell: bash
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$GITHUB_SHA"
          echo "Final acceptance SHA remained frozen: $GITHUB_SHA"

      - name: Publish acceptance evidence artifact
        if: always()
        shell: bash
        env:
          CURRENT_TREE: ${{ steps.tree-source.outputs.current_tree }}
          REUSED: ${{ steps.dispatch.outputs.reused }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
        run: |
          set -euo pipefail
          {
            echo "exact_sha=$GITHUB_SHA"
            echo "tree_sha=$CURRENT_TREE"
            echo "reused_suites=${REUSED:-0}"
            echo "dispatched_suites=${DISPATCHED:-0}"
          } > final-release-acceptance-evidence.txt
          if [ -f /tmp/final-acceptance-runs.tsv ]; then
            cp /tmp/final-acceptance-runs.tsv final-release-acceptance-runs.tsv
          else
            : > final-release-acceptance-runs.tsv
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-release-acceptance-evidence-${{ github.run_id }}
          path: |
            final-release-acceptance-evidence.txt
            final-release-acceptance-runs.tsv
          if-no-files-found: error
          retention-days: 30

      - name: Publish final acceptance status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              state=success
              description='Exact-head browser and staging acceptance passed'
              ;;
            cancelled)
              state=error
              description='Exact-head browser and staging acceptance was cancelled'
              ;;
            *)
              state=failure
              description='Exact-head browser or staging acceptance failed'
              ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='Final Release Acceptance' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
