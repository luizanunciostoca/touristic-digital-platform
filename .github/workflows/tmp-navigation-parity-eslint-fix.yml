name: Temporary Navigation Parity Type Fix

on:
  push:
    branches:
      - fix/navigation-v1-product-parity-20260915

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/navigation-v1-product-parity-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply structurally bounded typed GPS mock patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts')
          text = path.read_text()

          fn_start = text.index('function setupBrowserAcquisition() {')
          driver_start = text.index('  const geolocationDriver = {', fn_start)
          driver_end = text.index('  const wiring:', driver_start)
          old_driver = text[driver_start:driver_end]
          assert 'getCurrentPosition: vi.fn()' in old_driver
          assert 'as unknown as BrowserGeolocationDriver' in old_driver
          new_driver = '''  const getCurrentPosition = vi.fn<
            BrowserGeolocationDriver["getCurrentPosition"]
          >();
          const geolocationDriver: BrowserGeolocationDriver = {
            watchPosition: vi.fn<BrowserGeolocationDriver["watchPosition"]>(() => 1),
            getCurrentPosition,
            clearWatch: vi.fn<BrowserGeolocationDriver["clearWatch"]>(),
          };
          '''
          text = text[:driver_start] + new_driver + text[driver_end:]

          fn_start = text.index('function setupBrowserAcquisition() {')
          return_start = text.index('  return {', fn_start)
          return_end = text.index('  };', return_start)
          return_block = text[return_start:return_end]
          assert '    geolocationDriver,\n' in return_block
          return_block = return_block.replace(
              '    geolocationDriver,\n',
              '    geolocationDriver,\n    getCurrentPosition,\n',
              1,
          )
          text = text[:return_start] + return_block + text[return_end:]

          test_start = text.index('  it("retries initial GPS acquisition')
          assign_start = text.index(
              '    context.geolocationDriver.getCurrentPosition = vi.fn(',
              test_start,
          )
          assign_end = text.index('\n\n    await expect(', assign_start)
          assert 'success(browserPosition())' in text[assign_start:assign_end]
          new_assign = '''    context.getCurrentPosition.mockImplementation((success, error, options) => {
            attempt += 1;
            if (attempt < 3) {
              error({
                code: 2,
                message: "temporarily unavailable",
              });
              return;
            }
            success(browserPosition());
            void options;
          });'''
          text = text[:assign_start] + new_assign + text[assign_end:]

          old_count = 'context.geolocationDriver.getCurrentPosition).toHaveBeenCalledTimes('
          assert old_count in text
          text = text.replace(
              old_count,
              'context.getCurrentPosition).toHaveBeenCalledTimes(',
              1,
          )

          mocked_marker = '.mocked(context.geolocationDriver.getCurrentPosition)'
          marker_index = text.index(mocked_marker, test_start)
          expect_start = text.rfind('    expect(', test_start, marker_index)
          expect_end_marker = '    ).toEqual([...NAVIGATION_BOOTSTRAP_ATTEMPT_TIMEOUTS_MS]);'
          expect_end = text.index(expect_end_marker, marker_index) + len(expect_end_marker)
          assert expect_start >= test_start
          new_calls = '''    expect(
            context.getCurrentPosition.mock.calls.map((call) => call[2]?.timeout),
          ).toEqual([...NAVIGATION_BOOTSTRAP_ATTEMPT_TIMEOUTS_MS]);'''
          text = text[:expect_start] + new_calls + text[expect_end:]

          old_recent = 'context.geolocationDriver.getCurrentPosition).not.toHaveBeenCalled()'
          assert old_recent in text
          text = text.replace(
              old_recent,
              'context.getCurrentPosition).not.toHaveBeenCalled()',
              1,
          )

          assert 'context.geolocationDriver.getCurrentPosition = vi.fn(' not in text
          assert mocked_marker not in text
          path.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts \
            apps/morro-digital-platform/src/browser.ts
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit validated type fixes
        run: |
          if git diff --quiet; then
            echo 'NO_TYPE_FIX_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts \
            apps/morro-digital-platform/src/browser.ts
          git commit -m 'fix(navigation): validate type-safe parity remediation'
          git push origin HEAD:fix/navigation-v1-product-parity-20260915
