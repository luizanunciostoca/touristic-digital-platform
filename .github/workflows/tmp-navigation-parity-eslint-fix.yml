name: Temporary Navigation Parity Type Fix

on:
  push:
    branches:
      - fix/navigation-v1-product-parity-20260915

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/navigation-v1-product-parity-20260915
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal typed GPS mock patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts')
          text = path.read_text()
          old = '''  const geolocationDriver = {
            watchPosition: vi.fn(),
            getCurrentPosition: vi.fn(),
            clearWatch: vi.fn(),
          } as unknown as BrowserGeolocationDriver;'''.replace('          ', '')
          new = '''  const getCurrentPosition = vi.fn<
            BrowserGeolocationDriver["getCurrentPosition"]
          >();
          const geolocationDriver: BrowserGeolocationDriver = {
            watchPosition: vi.fn<BrowserGeolocationDriver["watchPosition"]>(() => 1),
            getCurrentPosition,
            clearWatch: vi.fn<BrowserGeolocationDriver["clearWatch"]>(),
          };'''.replace('          ', '')
          index = text.rfind(old)
          assert index >= 0, 'typed-driver target not found'
          text = text[:index] + new + text[index + len(old):]
          text = text.replace('''    geolocationDriver,
            requestRouteImpl,
            createWiring,
          };'''.replace('          ', ''), '''    geolocationDriver,
            getCurrentPosition,
            requestRouteImpl,
            createWiring,
          };'''.replace('          ', ''), 1)
          old_test = '''    context.geolocationDriver.getCurrentPosition = vi.fn(
            (success, error, options) => {
              attempt += 1;
              if (attempt < 3) {
                error({
                  code: 2,
                  message: "temporarily unavailable",
                });
                return;
              }
              success(browserPosition());
              void options;
            },
          );'''.replace('          ', '')
          new_test = '''    context.getCurrentPosition.mockImplementation((success, error, options) => {
            attempt += 1;
            if (attempt < 3) {
              error({
                code: 2,
                message: "temporarily unavailable",
              });
              return;
            }
            success(browserPosition());
            void options;
          });'''.replace('          ', '')
          assert old_test in text, 'retry mock target not found'
          text = text.replace(old_test, new_test, 1)
          text = text.replace('context.geolocationDriver.getCurrentPosition).toHaveBeenCalledTimes(', 'context.getCurrentPosition).toHaveBeenCalledTimes(', 1)
          text = text.replace('''vi
                .mocked(context.geolocationDriver.getCurrentPosition)
                .mock.calls.map'''.replace('              ', ''), 'context.getCurrentPosition.mock.calls.map', 1)
          text = text.replace('context.geolocationDriver.getCurrentPosition).not.toHaveBeenCalled()', 'context.getCurrentPosition).not.toHaveBeenCalled()', 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts apps/morro-digital-platform/src/browser.ts
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform build
      - name: Commit validated type fixes
        run: |
          if git diff --quiet; then
            echo 'NO_TYPE_FIX_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/morro-digital-platform/src/navigation/navigation-session-bootstrap.test.ts apps/morro-digital-platform/src/browser.ts
          git commit -m 'fix(navigation): validate type-safe parity remediation'
          git push origin HEAD:fix/navigation-v1-product-parity-20260915
