name: Prettier Input Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/prettier-input-diagnostic.yml
      - apps/morro-digital-platform/public/assistant-input-v1-parity.js

permissions:
  contents: read

jobs:
  prettier-input-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier apps/morro-digital-platform/public/assistant-input-v1-parity.js --write
          git diff -- apps/morro-digital-platform/public/assistant-input-v1-parity.js
          test -z "$(git status --porcelain -- apps/morro-digital-platform/public/assistant-input-v1-parity.js)"
