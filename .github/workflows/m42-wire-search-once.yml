name: M42 Wire Search Once
on:
  push:
    branches: [feat/search-m42-browser-integration]
    paths: [.github/workflows/m42-wire-search-once.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-m42-browser-integration
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire place_search handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          s=p.read_text()
          old='import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";\n'
          new=old+'import { createAssistantSearchHandler } from "./assistant-search-adapter.js";\n'
          if old not in s: raise SystemExit('import anchor missing')
          s=s.replace(old,new,1)
          old2='  const controller = createAssistantDialogController({\n    context,\n    handlers: {\n      ...domainHandlers,\n      ...navigationHandlers,\n    },'
          new2='  const searchHandler = createAssistantSearchHandler({\n    ...(options.fetch ? { fetch: options.fetch } : {}),\n    ...(mapboxAccessToken ? { mapboxAccessToken } : {}),\n  });\n  const controller = createAssistantDialogController({\n    context,\n    handlers: {\n      ...domainHandlers,\n      place_search: searchHandler,\n      ...navigationHandlers,\n    },'
          if old2 not in s: raise SystemExit('controller anchor missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          pnpm prettier --write apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
      - name: Commit wiring and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/m42-wire-search-once.yml
          git add apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts apps/morro-digital-platform/src/assistant/assistant-search-adapter.ts
          git commit -m "feat(search): wire place search into browser assistant"
          git push origin HEAD:feat/search-m42-browser-integration
