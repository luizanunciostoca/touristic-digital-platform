name: Temporary M146 Legacy Cleanup Patch

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-remove-legacy-cleanup-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m146-legacy-cleanup
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm146-legacy-cleanup"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m146-legacy-cleanup@127.0.0.1:3306/mysql
      FINANCIAL_DATABASE_URL: mysql://root:m146-legacy-cleanup@127.0.0.1:3306/financial_m137_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove M146-only cleanup from legacy database test
        run: >-
          python3 -c 'from pathlib import Path; p=Path("services/financial/src/mysql-integration.test.ts"); s=p.read_text(); s=s.replace("    await pool.query(\"DELETE FROM financial_settlements\");\n    await pool.query(\"DELETE FROM financial_payables\");\n    await pool.query(\"DELETE FROM financial_allocations\");\n", "", 1); p.write_text(s)'
      - run: pnpm exec prettier --write services/financial/src/mysql-integration.test.ts
      - run: pnpm --filter @touristic/financial-server test:integration
      - name: Publish permanent patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m146-remove-legacy-cleanup-once.yml
          git add services/financial/src/mysql-integration.test.ts
          git diff --check
          git commit -m "test(payments): keep M146 cleanup isolated from legacy database"
          git push origin HEAD:feat/payments-m146-settlement
