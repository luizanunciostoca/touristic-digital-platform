name: Temporary Format PR437

on:
  push:
    branches:
      - fix/notifications-runtime-composition-20260927

permissions:
  contents: write

concurrency:
  group: temporary-format-pr437
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/notifications-runtime-composition-20260927
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files and remove helper
        run: |
          pnpm exec prettier --write             apps/morro-digital-platform/tooling/notifications-runtime.mjs             docs/qa/NOTIFICATIONS-DURABLE-RUNTIME-COMPOSITION-2026-09-27.md             render.staging.yaml             services/notifications/src/durable-dispatch-state.test.ts
          rm .github/workflows/temporary-format-pr437.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(notifications): apply canonical formatting"
          git push origin HEAD:fix/notifications-runtime-composition-20260927
