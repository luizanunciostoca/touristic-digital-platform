name: Payments Runtime Env Trace

on:
  push:
    branches:
      - ops/payments-provider-test-acceptance-20260824

permissions:
  contents: read

env:
  STAGING_URL: https://morro-digital-v2-staging.onrender.com
  EXPECTED_SHA: 0d5e4478ded981a1d4841f46fba95de17205f832

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Trace runtime config execution without values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const base = process.env.STAGING_URL;
          const expectedSha = process.env.EXPECTED_SHA;
          const sanitize = (value) => String(value || '').replace(/[A-Za-z0-9_-]{32,}/g, '[redacted]');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const runtimeNetwork = [];
              const browserErrors = [];

              page.on('request', request => {
                if (new URL(request.url()).pathname === '/runtime-config.js') {
                  runtimeNetwork.push({ phase: 'request', method: request.method() });
                }
              });
              page.on('response', response => {
                if (new URL(response.url()).pathname === '/runtime-config.js') {
                  runtimeNetwork.push({
                    phase: 'response',
                    status: response.status(),
                    contentType: response.headers()['content-type'] || '',
                    cacheControl: response.headers()['cache-control'] || '',
                  });
                }
              });
              page.on('requestfailed', request => {
                if (new URL(request.url()).pathname === '/runtime-config.js') {
                  runtimeNetwork.push({
                    phase: 'failed',
                    error: sanitize(request.failure()?.errorText || 'request_failed'),
                  });
                }
              });
              page.on('pageerror', error => browserErrors.push({ type: 'pageerror', text: sanitize(error.message) }));
              page.on('console', message => {
                if (message.type() === 'error' || message.type() === 'warning') {
                  browserErrors.push({ type: `console:${message.type()}`, text: sanitize(message.text()) });
                }
              });

              await page.addInitScript(() => {
                const trace = [];
                let current;
                const summarize = (value) => {
                  const object = value && typeof value === 'object' ? value : null;
                  const keys = object ? Object.keys(object).sort() : [];
                  return {
                    kind: object ? 'object' : value === undefined ? 'undefined' : typeof value,
                    keys,
                    hasMercadoPago: Boolean(object?.VITE_MERCADO_PAGO_PUBLIC_KEY),
                    hasMapboxStyle: Boolean(object?.VITE_MAPBOX_STYLE),
                  };
                };
                Object.defineProperty(window, '__MORRO_RUNTIME_ENV_TRACE__', {
                  value: trace,
                  writable: false,
                  enumerable: false,
                  configurable: false,
                });
                Object.defineProperty(window, '__MORRO_RUNTIME_ENV__', {
                  configurable: true,
                  enumerable: true,
                  get() { return current; },
                  set(value) {
                    current = value;
                    trace.push({ event: 'set', summary: summarize(value) });
                  },
                });
              });

              const health = await page.request.get(`${base}/healthz`);
              const ready = await page.request.get(`${base}/readyz`);
              if (!health.ok() || !ready.ok()) throw new Error(`staging-not-ready:${health.status()}:${ready.status()}`);
              for (const response of [health, ready]) {
                const sha = response.headers()['x-release-sha'];
                if (sha !== expectedSha) throw new Error(`release-sha-mismatch:${sha || 'missing'}`);
              }

              await page.goto(`${base}/business-onboarding.html`, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(3000);

              const browserState = await page.evaluate(() => {
                const trace = Array.isArray(window.__MORRO_RUNTIME_ENV_TRACE__)
                  ? window.__MORRO_RUNTIME_ENV_TRACE__
                  : [];
                const descriptor = Object.getOwnPropertyDescriptor(window, '__MORRO_RUNTIME_ENV__');
                const current = window.__MORRO_RUNTIME_ENV__;
                const object = current && typeof current === 'object' ? current : null;
                const script = document.querySelector('script[src="/runtime-config.js"]');
                return {
                  trace,
                  descriptor: descriptor
                    ? {
                        exists: true,
                        configurable: Boolean(descriptor.configurable),
                        enumerable: Boolean(descriptor.enumerable),
                        hasGetter: typeof descriptor.get === 'function',
                        hasSetter: typeof descriptor.set === 'function',
                        hasValue: Object.prototype.hasOwnProperty.call(descriptor, 'value'),
                      }
                    : { exists: false },
                  current: {
                    kind: object ? 'object' : current === undefined ? 'undefined' : typeof current,
                    keys: object ? Object.keys(object).sort() : [],
                    hasMercadoPago: Boolean(object?.VITE_MERCADO_PAGO_PUBLIC_KEY),
                    hasMapboxStyle: Boolean(object?.VITE_MAPBOX_STYLE),
                  },
                  script: script
                    ? { exists: true, src: script.getAttribute('src'), type: script.getAttribute('type') || 'classic' }
                    : { exists: false },
                };
              });

              const direct = await page.request.get(`${base}/runtime-config.js`);
              const directText = await direct.text();
              const directSummary = {
                status: direct.status(),
                containsMercadoPagoKeyName: directText.includes('VITE_MERCADO_PAGO_PUBLIC_KEY'),
                containsTestPublicKey: /VITE_MERCADO_PAGO_PUBLIC_KEY\s*\":\"TEST-/u.test(directText),
                containsMapboxStyle: directText.includes('VITE_MAPBOX_STYLE'),
              };

              console.log(JSON.stringify({
                status: 'TRACE',
                releaseSha: expectedSha,
                runtimeNetwork,
                browserState,
                directSummary,
                browserErrors,
              }));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(JSON.stringify({ status: 'FAIL', error: sanitize(error?.message || error) }));
            process.exit(1);
          });
          NODE
