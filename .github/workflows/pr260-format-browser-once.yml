name: PR260 M140 Browser Format Once

on:
  push:
    branches:
      - feat/crm-m140-lead-detail-activity
    paths:
      - .github/workflows/pr260-format-browser-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m140-lead-detail-activity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/tooling/crm-m140-browser-e2e.cjs
      - name: Remove formatter and commit canonical result
        run: |
          rm .github/workflows/pr260-format-browser-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "style(crm): format M140 browser synchronizer"
          git push origin HEAD:feat/crm-m140-lead-detail-activity
