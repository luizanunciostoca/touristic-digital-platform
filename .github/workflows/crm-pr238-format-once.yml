name: CRM PR238 Format Once

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/crm-pr238-format-once.yml"
      - "apps/morro-digital-platform/src/crm-admin-shell-contract.test.ts"
      - "docs/migration/CRM-MIGRATION-MATRIX.md"
      - "packages/crm/src/metrics-boundary.test.ts"
      - "packages/crm/src/metrics-boundary.ts"
      - "services/crm/src/metrics-http-transport.ts"
      - "services/crm/src/mysql-metrics-repository.test.ts"
      - "services/crm/src/mysql-metrics-repository.ts"

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.number == 238 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/crm-admin-shell-contract.test.ts \
            docs/migration/CRM-MIGRATION-MATRIX.md \
            packages/crm/src/metrics-boundary.test.ts \
            packages/crm/src/metrics-boundary.ts \
            services/crm/src/metrics-http-transport.ts \
            services/crm/src/mysql-metrics-repository.test.ts \
            services/crm/src/mysql-metrics-repository.ts
          rm .github/workflows/crm-pr238-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/crm-admin-shell-contract.test.ts \
            docs/migration/CRM-MIGRATION-MATRIX.md \
            packages/crm/src/metrics-boundary.test.ts \
            packages/crm/src/metrics-boundary.ts \
            services/crm/src/metrics-http-transport.ts \
            services/crm/src/mysql-metrics-repository.test.ts \
            services/crm/src/mysql-metrics-repository.ts \
            .github/workflows/crm-pr238-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(crm): apply canonical M138 formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
