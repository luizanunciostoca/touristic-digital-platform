name: Profile Prettier Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/profile-prettier-diagnostic.yml
      - apps/morro-digital-platform/tooling/profile-v2-visual-regression.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Profile regression harness
        run: pnpm exec prettier apps/morro-digital-platform/tooling/profile-v2-visual-regression.mjs --write
      - name: Show canonical diff
        run: git diff -- apps/morro-digital-platform/tooling/profile-v2-visual-regression.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-prettier-canonical
          path: apps/morro-digital-platform/tooling/profile-v2-visual-regression.mjs
          if-no-files-found: error
