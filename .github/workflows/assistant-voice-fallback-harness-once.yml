name: Assistant Voice Fallback Harness Once

on:
  push:
    branches:
      - test/assistant-voice-browser-pass
    paths:
      - .github/workflows/assistant-voice-fallback-harness-once.yml

permissions:
  contents: write

jobs:
  fix-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/assistant-voice-browser-pass
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Replace native API erasure with deterministic browser harness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs')
          text = path.read_text()
          start = text.index('async function runUnsupportedContract(browser) {')
          end = text.index('\nconst browser = await chromium.launch', start)
          replacement = r'''async function runUnsupportedContract(browser) {
  const context = await browser.newContext({
    viewport: { width: 390, height: 844 },
  });
  await context.addInitScript(() => {
    localStorage.setItem("morro-digital-onboarded", "1");
  });

  const page = await context.newPage();
  await page.goto(BASE_URL, { waitUntil: "domcontentloaded", timeout: 30000 });
  await waitForAssistant(page);

  const state = await page.evaluate(async () => {
    const settingsModule = await import(
      "/apps/morro-digital-platform/dist/assistant/assistant-voice-settings.js"
    );
    const inputModule = await import(
      "/apps/morro-digital-platform/dist/assistant/assistant-voice-input-adapter.js"
    );

    const controller = settingsModule.installAssistantVoiceSettings({
      document,
      voice: null,
    });

    const result = {
      supported: document.getElementById("assistantVoiceSettings")?.dataset
        .voiceSupported,
      enabledDisabled: document.getElementById("assistantVoiceEnabled")?.disabled,
      voiceDisabled: document.getElementById("assistantVoiceSelect")?.disabled,
      speedDisabled: document.getElementById("assistantVoiceSpeed")?.disabled,
      languageDisabled: document.getElementById("assistantVoiceLanguage")?.disabled,
      recognitionUnsupported:
        inputModule.resolveAssistantSpeechRecognitionConstructor({}) === null,
    };

    controller.destroy();
    return result;
  });

  assert(
    state.supported === "false",
    "Unsupported speech synthesis state not exposed",
    state,
  );
  assert(
    state.enabledDisabled &&
      state.voiceDisabled &&
      state.speedDisabled &&
      state.languageDisabled,
    "Unsupported-browser controls must be disabled",
    state,
  );
  assert(
    state.recognitionUnsupported,
    "SpeechRecognition resolver must fail closed when the API is absent",
    state,
  );

  const result = {
    state,
    strategy: "browser controller with explicit absent Web Speech capabilities",
  };
  writeFileSync(
    `${OUTPUT_DIR}/unsupported.json`,
    JSON.stringify(result, null, 2),
  );
  await context.close();
  return result;
}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          pnpm exec prettier --write apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/assistant-voice-fallback-harness-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs .github/workflows/assistant-voice-fallback-harness-once.yml
          git commit -m "fix(assistant): make voice fallback browser harness deterministic"
          git push origin HEAD:test/assistant-voice-browser-pass
