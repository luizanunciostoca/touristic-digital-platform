name: Temporary Home Prettier Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/tmp-home-prettier-repair.yml
      - apps/morro-digital-platform/public/tourist-shell-v2.css
      - apps/morro-digital-platform/src/home/home-discover-navigation.ts
      - apps/morro-digital-platform/src/ux/home-discover-manual-conformance.test.ts
      - apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs
      - apps/morro-digital-platform/tooling/assistant-voice-default-label-browser-parity.mjs
      - apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs

permissions:
  contents: write

concurrency:
  group: temporary-home-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ github.head_ref == 'wave/ux-v2-home-discover-map-manual-convergence-20260921' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Home convergence files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/home/home-discover-navigation.ts \
            apps/morro-digital-platform/src/ux/home-discover-manual-conformance.test.ts \
            apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs \
            apps/morro-digital-platform/tooling/assistant-voice-default-label-browser-parity.mjs \
            apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/tourist-shell-v2.css \
            apps/morro-digital-platform/src/home/home-discover-navigation.ts \
            apps/morro-digital-platform/src/ux/home-discover-manual-conformance.test.ts \
            apps/morro-digital-platform/tooling/assistant-voice-browser-contract.mjs \
            apps/morro-digital-platform/tooling/assistant-voice-default-label-browser-parity.mjs \
            apps/morro-digital-platform/tooling/home-discover-manual-conformance.mjs
          git commit -m "style(home): apply canonical Prettier formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
