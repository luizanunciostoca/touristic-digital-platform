name: Temporary Diagnose Readyz

on:
  push:
    branches:
      - ops/diagnose-readyz-c559-20260924

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read safe readiness details
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail-with-body https://morro-digital-v2.onrender.com/readyz || true)"
          printf '%s' "$body" | jq '{readiness, checks: [.checks[] | {name,status,critical,detail}]}'

# final-post-rotation
