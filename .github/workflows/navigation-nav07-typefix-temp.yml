name: Fix NAV-07 Types Temp

on:
  push:
    branches:
      - feat/navigation-browser-geolocation
    paths:
      - .github/workflows/navigation-nav07-typefix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-browser-geolocation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply explicit request method types
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/morro-digital-platform/src/navigation/browser-geolocation.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '    getLocation(requestOptions = {}) {',
            '    getLocation(\n      requestOptions: BrowserLocationRequestOptions = {},\n    ): Promise<BrowserLocation> {'
          );
          source = source.replace(
            '    getCurrentLocation(requestOptions = {}) {',
            '    getCurrentLocation(\n      requestOptions: Pick<BrowserLocationRequestOptions, "maxAge"> = {},\n    ): BrowserLocation | null {'
          );
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write apps/morro-digital-platform/src/navigation/browser-geolocation.ts
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/navigation/browser-geolocation.ts
          git commit -m "fix: type NAV-07 request methods"
          git push origin HEAD:feat/navigation-browser-geolocation
