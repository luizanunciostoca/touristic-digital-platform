name: Prettier Webhook Diagnostic 2026-08-24

on:
  push:
    branches:
      - ops/prettier-webhook-diag-beb25-20260824

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write services/financial/src/mercado-pago-webhook-authenticator.test.ts
          git diff -- services/financial/src/mercado-pago-webhook-authenticator.test.ts
