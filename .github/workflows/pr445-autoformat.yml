name: PR 445 Autoformat

on:
  push:
    branches:
      - fix/control-center-admin-replay-guard-20260927

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write \
            services/auth/src/security-state.ts \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/auth-api-admin-policy.test.mjs
      - name: Commit formatted files
        run: |
          if git diff --quiet -- \
            services/auth/src/security-state.ts \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/auth-api-admin-policy.test.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/auth/src/security-state.ts \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/auth-api-admin-policy.test.mjs
          git commit -m "style(control-center): apply prettier output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
