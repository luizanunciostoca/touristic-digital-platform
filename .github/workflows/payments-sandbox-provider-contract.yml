name: Payments Sandbox Provider Contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-payments-sandbox-provider-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
      - name: Financial provider unit contract
        run: pnpm --filter @touristic/financial-server test
      - name: Ordering provider composition contract
        run: pnpm --filter @touristic/ordering-server test
      - name: Local sandbox HTTP wire and idempotency contract
        run: pnpm exec vitest run tooling/payments/provider-sandbox-contract.test.ts
