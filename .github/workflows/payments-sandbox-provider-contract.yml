name: Payments Sandbox Provider Contract

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-payments-sandbox-provider-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-bootstrap
      - name: Financial provider unit contract
        id: ci_command_01
        run: pnpm --filter @touristic/financial-server test
      - name: Ordering provider composition contract
        id: ci_command_02
        run: pnpm --filter @touristic/ordering-server test
      - name: Local sandbox HTTP wire and idempotency contract
        id: ci_command_03
        run: pnpm exec vitest run tooling/payments/provider-sandbox-contract.test.ts

      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["payments-sandbox-provider-contract.yml"]'), 'payments-sandbox-provider-contract.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["payments-sandbox-provider-contract.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt payments-sandbox-provider-contract.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-payments-sandbox-provider-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
