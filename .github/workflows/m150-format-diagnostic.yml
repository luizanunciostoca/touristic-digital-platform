name: M150 Format Diagnostic

on:
  pull_request:
    paths:
      - "packages/ordering/src/subscription.test.ts"
      - ".github/workflows/m150-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier packages/ordering/src/subscription.test.ts --write
          git diff -- packages/ordering/src/subscription.test.ts
