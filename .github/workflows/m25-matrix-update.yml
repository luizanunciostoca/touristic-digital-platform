name: M25 Matrix Update

on:
  push:
    branches:
      - feat/assistant-m25-photos

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/migration/ASSISTANT-MIGRATION-MATRIX.md')
          text = path.read_text()
          text = text.replace('Estado M24', 'Estado M25', 1)
          text = text.replace(
              'weather, geolocalização e hours conectados; photos/price e paridade completa de weather ainda pendentes',
              'weather, geolocalização, photos e hours conectados; assets binários de photos, price e paridade completa de weather ainda pendentes',
              1,
          )
          text = text.replace(
              'weather/location/nearby/favorites/help/hours/more_info conectados; photos/price e paridades restantes ainda faltam',
              'weather/location/nearby/favorites/help/photos/hours/more_info conectados; assets binários de photos, price e paridades restantes ainda faltam',
              1,
          )
          marker = '\nPara promover MIG-0006 a `equivalent`, todos os itens acima precisam estar em PASS e o Quality Gate do head final deve estar integralmente verde.\n'
          section = '''\n## Estado do milestone M25\n\nO M25 porta integralmente a estratégia de resolução de fotos observada em `js/utils/carousel.js` da baseline V1. `assistant-v1-photo-catalog.ts` preserva as 118 entradas catalogadas, os três arquivos JPG associados a cada entrada e a precedência de resolução exact → inclusão parcial → aliases → prefixo → similaridade por palavra, com a mesma normalização de acentos, pontuação e espaços da V1.\n\nO browser runtime passa a reconhecer o contrato de apresentação `carousel` e renderiza uma galeria horizontal responsiva, com scroll snap, texto alternativo, carregamento lazy após a primeira imagem e sem dependência de Swiper. O adapter de domínio faz uma verificação `HEAD` do primeiro asset antes de expor o carrossel: enquanto os binários legados não estiverem presentes no runtime V2, responde com `asset_source_pending` em vez de produzir imagens quebradas. As regressões cobrem resolução exata, normalização, aliases, match parcial, categorias representativas, ausência segura e os estados de assets disponíveis/ausentes.\n\nO catálogo e o wiring visual estão implementados, porém os arquivos binários de `images/fotos/**` continuam armazenados apenas no repositório legado privado. A integração GitHub disponível para este checkpoint permite ler os blobs da origem, mas não oferece uma operação binária bulk entre repositórios; referências de blob não podem ser reutilizadas entre repositories. Por isso `photos` permanece `PARTIAL` até a migração física desses assets (ou definição de um asset origin público controlado) e a validação visual correspondente.\n\nA FEATURE-0004 / MIG-0006 **ainda não está equivalente**. Além do asset delivery de `photos`, permanecem pendentes `price`, provider LLM same-origin, boundary `/api/ai/*`, voz, paridade completa de weather, lifecycle/UI completa do assistente e as paridades de copy/i18n já marcadas como `PARTIAL`.\n'''
          if '## Estado do milestone M25' not in text:
              text = text.replace(marker, section + marker)
          path.write_text(text)
          PY
          pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/migration/ASSISTANT-MIGRATION-MATRIX.md
            git commit -m "docs(assistant): synchronize MIG-0006 through M25"
            git push
          fi
