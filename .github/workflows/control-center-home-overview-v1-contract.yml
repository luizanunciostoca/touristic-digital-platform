name: Control Center Home Overview V1 Contract

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/control-center-home-overview-v1-contract.yml"
      - "apps/control-center/**"
      - "apps/morro-digital-platform/src/ux/control-center-home-overview-v1-contract.test.ts"
      - "apps/morro-digital-platform/tooling/control-center-home-overview-v1-model.node.mjs"
      - "apps/morro-digital-platform/tooling/control-center-home-overview-v1-browser-contract.cjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/auth/**"
      - "packages/auth-browser/**"
      - "services/auth/**"
      - "services/destinations/**"

permissions:
  contents: read

concurrency:
  group: control-center-home-overview-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-overview-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: control-center-home-ci
          MYSQL_DATABASE: control_center_home_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcontrol-center-home-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Wave 2 formatting
        run: >
          pnpm exec prettier --check
          apps/control-center/public/control-center-home-overview-v1.css
          apps/control-center/public/control-center-home-overview-v1.js
          apps/control-center/public/control-center.js
          apps/control-center/public/index.html
          apps/morro-digital-platform/src/ux/control-center-home-overview-v1-contract.test.ts
          apps/morro-digital-platform/tooling/control-center-home-overview-v1-model.node.mjs
          apps/morro-digital-platform/tooling/control-center-home-overview-v1-browser-contract.cjs
      - name: Run Home source contract
        run: >
          pnpm --filter @touristic/morro-digital-platform exec vitest run
          src/ux/control-center-home-overview-v1-contract.test.ts
      - name: Run Home model edge cases
        run: node --test apps/morro-digital-platform/tooling/control-center-home-overview-v1-model.node.mjs
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build runtime graph
        run: pnpm -w build
      - name: Start authenticated Control Center
        shell: bash
        run: |
          set -euo pipefail
          PORT=4197
          AUTH_SECRET="0123456789abcdef0123456789abcdef"
          PASSWORD="control center home browser fixture"
          OWNER_HASH=$(node --input-type=module -e "import('./services/auth/dist/credentials.js').then(m => console.log(m.hashPassword(process.argv[1], Buffer.alloc(16, 33))))" "$PASSWORD")
          USERS=$(node -e 'console.log(JSON.stringify([{id:"platform-owner-home",email:"platform-owner-home@example.com",passwordHash:process.argv[1],role:"PLATFORM_OWNER",businessIds:[]}]))' "$OWNER_HASH")
          DB_URL="mysql://root:control-center-home-ci@127.0.0.1:3306/control_center_home_ci"
          DASHBOARD_AUTH_SECRET="$AUTH_SECRET" DASHBOARD_USERS_JSON="$USERS" AUTH_DATABASE_URL="$DB_URL" CONTROL_CENTER_AUDIT_DATABASE_URL="$DB_URL" DESTINATIONS_DATABASE_URL="$DB_URL" PORT="$PORT" HOST="127.0.0.1" node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/control-center-home-overview-v1-server.log 2>&1 &
          echo $! >/tmp/control-center-home-overview-v1-server.pid
          for _ in $(seq 1 100); do
            if curl --fail --silent "http://127.0.0.1:$PORT/apps/control-center/public/index.html" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/control-center-home-overview-v1-server.log
          exit 1
      - name: Validate Home in Chromium
        env:
          CONTROL_CENTER_ORIGIN: http://127.0.0.1:4197
        run: node apps/morro-digital-platform/tooling/control-center-home-overview-v1-browser-contract.cjs
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/control-center-home-overview-v1-server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-center-home-overview-v1-evidence
          path: |
            /tmp/control-center-home-overview-v1-evidence.json
            /tmp/control-center-home-overview-v1-*.png
          retention-days: 5
          if-no-files-found: ignore
      - name: Stop runtime
        if: always()
        run: kill "$(cat /tmp/control-center-home-overview-v1-server.pid)" 2>/dev/null || true
