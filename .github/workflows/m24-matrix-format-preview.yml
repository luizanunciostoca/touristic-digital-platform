name: M24 Matrix Format Preview

on:
  push:
    branches:
      - feat/assistant-m24-place-details

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write docs/migration/ASSISTANT-MIGRATION-MATRIX.md
          git diff -- docs/migration/ASSISTANT-MIGRATION-MATRIX.md
