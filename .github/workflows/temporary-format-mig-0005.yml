name: Temporary Format MIG-0005

on:
  push:
    branches:
      - docs/navigation-mig-0005-equivalent

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/navigation-mig-0005-equivalent
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format consolidation docs
        run: pnpm exec prettier --write docs/migration/NAVIGATION-MIG-0005-EQUIVALENCE-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md docs/features/registry.json
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/NAVIGATION-MIG-0005-EQUIVALENCE-MATRIX.md docs/migration/MASTER-MIGRATION-TRACKER.md docs/features/registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format MIG-0005 consolidation"
          git push origin HEAD:docs/navigation-mig-0005-equivalent
