name: PR49 Prettier Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/tmp-pr49-prettier-diagnostic.yml
      - .github/workflows/v1-tour-assistant-visibility-browser-regression.yml

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical patch
        run: |
          pnpm exec prettier --write .github/workflows/v1-tour-assistant-visibility-browser-regression.yml
          git diff -- .github/workflows/v1-tour-assistant-visibility-browser-regression.yml
