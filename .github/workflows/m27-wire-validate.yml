name: M27 Wire Validate

on:
  push:
    branches:
      - feat/assistant-m27-llm-boundary

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Wire M27
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts')
          text = runtime.read_text()
          nav_import = 'import { createAssistantNavigationAppHandlers } from "./assistant-navigation-adapter.js";\n'
          llm_import = 'import { createAssistantLlmHandler } from "./assistant-llm-adapter.js";\n'
          if llm_import not in text:
              if nav_import not in text:
                  raise SystemExit('navigation import anchor not found')
              text = text.replace(nav_import, nav_import + llm_import, 1)
          controller_tail = '''    handlers: {
              ...domainHandlers,
              ...navigationHandlers,
            },
          });

          const input = options.document.getElementById("assistantInput");'''
          controller_new = '''    handlers: {
              ...domainHandlers,
              ...navigationHandlers,
            },
            llm: createAssistantLlmHandler({
              ...(options.fetch ? { fetch: options.fetch } : {}),
            }),
          });

          const input = options.document.getElementById("assistantInput");'''
          if 'llm: createAssistantLlmHandler' not in text:
              if controller_tail not in text:
                  # account for YAML block indentation normalization by using a smaller exact suffix
                  old = '''    },
          });

          const input = options.document.getElementById("assistantInput");'''
                  new = '''    },
            llm: createAssistantLlmHandler({
              ...(options.fetch ? { fetch: options.fetch } : {}),
            }),
          });

          const input = options.document.getElementById("assistantInput");'''
                  if old not in text:
                      raise SystemExit('controller tail anchor not found')
                  text = text.replace(old, new, 1)
              else:
                  text = text.replace(controller_tail, controller_new, 1)
          runtime.write_text(text)

          server = Path('apps/morro-digital-platform/tooling/dev-server.mjs')
          text = server.read_text()
          assistant_import = 'import { createAssistantApi } from "./assistant-api.mjs";\n'
          url_import = 'import { fileURLToPath } from "node:url";\n'
          if assistant_import not in text:
              if url_import not in text:
                  raise SystemExit('server import anchor not found')
              text = text.replace(url_import, url_import + assistant_import, 1)

          env_anchor = 'const localEnvironment = await loadLocalEnvironment();\n'
          api_init = '''const assistantApi = createAssistantApi({
            getEnvironmentValue: (key) =>
              process.env[key] ?? localEnvironment[key] ?? "",
          });
          '''
          if 'const assistantApi = createAssistantApi' not in text:
              if env_anchor not in text:
                  raise SystemExit('local environment anchor not found')
              text = text.replace(env_anchor, env_anchor + '\n' + api_init, 1)

          weather_route = '''    if (requestUrl.pathname === "/api/weather") {
              await serveWeather(response);
              return;
            }
          '''
          assistant_route = '''    if (assistantApi.matches(requestUrl.pathname)) {
              await assistantApi.handle(request, response);
              return;
            }
          '''
          if 'assistantApi.matches(requestUrl.pathname)' not in text:
              if weather_route not in text:
                  raise SystemExit('weather route anchor not found')
              text = text.replace(weather_route, weather_route + assistant_route, 1)
          server.write_text(text)

          matrix = Path('docs/migration/ASSISTANT-MIGRATION-MATRIX.md')
          text = matrix.read_text()
          text = text.replace('Estado M26', 'Estado M27', 1)
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| Fallback LLM — execução'):
                  lines[i] = '| Fallback LLM — execução               | `llm-fallback.js`          | porta `llm` do controller + `assistant-llm-adapter.ts`                                                          | PASS       | client same-origin, timeout/fail-closed, resposta normalizada e provider server-side conectados                                           |'
              elif line.startswith('| Boundary `/api/ai/*`'):
                  lines[i] = '| Boundary `/api/ai/*`                  | legado + registry          | `/api/ai/assistant/respond` + alias legado `/api/assistant/respond`                                             | PASS       | nenhum segredo no cliente; provider server-side, validação, rate limit e timeout                                                         |'
          text = '\n'.join(lines) + '\n'
          marker = '\nPara promover MIG-0006 a `equivalent`, todos os itens acima precisam estar em PASS e o Quality Gate do head final deve estar integralmente verde.\n'
          section = '''\n## Estado do milestone M27\n\nO M27 fecha a execução do fallback LLM e o boundary server-side do Assistente. `assistant-llm-adapter.ts` conecta a porta `llm` do controller ao endpoint same-origin `/api/ai/assistant/respond`, preservando timeout de 12 segundos, histórico limitado, contexto sanitizado, normalização de action/options/confidence e falha fechada para que indisponibilidade do provider nunca quebre o diálogo local-first.\n\n`assistant-api.mjs` hospeda a fronteira server-side: valida método e payload, limita 30 chamadas por minuto por origem, mantém `OPENAI_API_KEY` e `OPENAI_MODEL` exclusivamente no processo do servidor, normaliza a resposta do provider e expõe também `/api/assistant/respond` como alias de compatibilidade com a baseline V1. Nenhum segredo é serializado em `runtime-config.js` ou entregue ao browser.\n\nCom isso, `Fallback LLM — execução` e `Boundary /api/ai/*` passam a `PASS`. A FEATURE-0004 / MIG-0006 **ainda não está equivalente**: permanecem delivery físico dos assets de `photos`, paridade completa de weather e copy/i18n dos handlers, voz e lifecycle/UI completa do assistente.\n'''
          if '## Estado do milestone M27' not in text:
              if marker in text:
                  text = text.replace(marker, section + marker, 1)
              else:
                  text += section
          matrix.write_text(text)
          PY

          pnpm exec prettier --write \
            apps/morro-digital-platform/src/assistant/assistant-llm-adapter.ts \
            apps/morro-digital-platform/src/assistant/assistant-llm-adapter.test.ts \
            apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts \
            apps/morro-digital-platform/tooling/assistant-api.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            docs/migration/ASSISTANT-MIGRATION-MATRIX.md

          pnpm format:check
          pnpm architecture:check
          pnpm features:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

          PORT=4180 node apps/morro-digital-platform/tooling/dev-server.mjs > /tmp/m27-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4180/runtime-config.js >/dev/null; then break; fi
            sleep 0.25
          done
          STATUS=$(curl -sS -o /tmp/m27-assistant.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data '{"input":"explique a história de Morro"}' \
            http://127.0.0.1:4180/api/ai/assistant/respond)
          test "$STATUS" = "503"
          grep -q 'assistant_not_configured' /tmp/m27-assistant.json
          ALIAS_STATUS=$(curl -sS -o /tmp/m27-alias.json -w '%{http_code}' \
            http://127.0.0.1:4180/api/assistant/respond)
          test "$ALIAS_STATUS" = "405"
          grep -q 'method_not_allowed' /tmp/m27-alias.json
          kill $SERVER_PID
          trap - EXIT

          rm .github/workflows/m27-wire-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assistant): wire same-origin LLM boundary"
          git push
