name: Wave D Format

on:
  push:
    branches:
      - wave/ux-v2-tours-active-tour-convergence-20260922

permissions:
  contents: write

concurrency:
  group: wave-d-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'chore(tours): format Wave D')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/ux-v2-tours-active-tour-convergence-20260922
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Wave D owned files
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-marker-element.ts \
            apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts \
            apps/morro-digital-platform/src/map/immersive-tour-v1-flow.test.ts \
            apps/morro-digital-platform/src/ux/tour-wave-d-contract.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/explore-locations.css \
            apps/morro-digital-platform/src/map/explore-marker-element.ts \
            apps/morro-digital-platform/src/map/immersive-tour-v1-controller.ts \
            apps/morro-digital-platform/src/map/immersive-tour-v1-flow.test.ts \
            apps/morro-digital-platform/src/ux/tour-wave-d-contract.test.ts
          git commit -m "chore(tours): format Wave D"
          git push origin HEAD:wave/ux-v2-tours-active-tour-convergence-20260922
