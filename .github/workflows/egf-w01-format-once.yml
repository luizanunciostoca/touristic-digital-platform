name: EGF W01 Format Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/egf-w01-format-once.yml"
      - "packages/shared/src/experience-growth-fabric/contracts/authority.ts"
      - "packages/shared/src/experience-growth-fabric/contracts/events.ts"

permissions:
  contents: write

concurrency:
  group: egf-w01-format-once-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-once:
    if: github.event.pull_request.head.ref == 'feat/egf-w01-contracts-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install canonical workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Normalize W01 contract formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/shared/src/experience-growth-fabric/contracts/authority.ts \
            packages/shared/src/experience-growth-fabric/contracts/events.ts
          git rm .github/workflows/egf-w01-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/shared/src/experience-growth-fabric/contracts/authority.ts \
            packages/shared/src/experience-growth-fabric/contracts/events.ts
          git commit -m "style(growth): apply canonical W01 formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
