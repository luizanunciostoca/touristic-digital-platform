name: M59 Format Once

on:
  push:
    branches:
      - feat/business-m59-profile-sandbox-runtime
    paths:
      - .github/workflows/m59-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m59-profile-sandbox-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-runtime.ts packages/business/src/onboarding-profile.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/business-onboarding-runtime.ts packages/business/src/onboarding-profile.ts
          git commit -m "style(business): format M59 profile runtime"
          git push origin HEAD:feat/business-m59-profile-sandbox-runtime
