name: M47 Normalize Lock Once
on:
  push:
    branches:
      - feat/auth-m47-core
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-m47-core
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write pnpm-lock.yaml packages/auth
      - name: Commit normalized lock and remove helper
        run: |
          rm .github/workflows/m47-normalize-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/auth .github/workflows/m47-normalize-lock-once.yml
          git diff --cached --quiet || git commit -m "chore(auth): normalize M47 workspace"
          git push
