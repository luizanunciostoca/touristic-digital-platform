name: Temporary Phase 21 Formatter

on:
  push:
    branches:
      - integration/phase21-converged-candidate-20261001
    paths:
      - ".github/workflows/tmp-phase21-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/phase21-converged-candidate-20261001
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format Phase 21 governance JSON
        run: >-
          pnpm exec prettier --write
          .github/morro-control/claims.json
          .morro/changesets/MD-CP-AUTONOMOUS-BLOCK-A.json
          .morro/changesets/MD-PHASE21-CONVERGED.json
          docs/integration/PHASE21-CONVERGED-CANDIDATE.md
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             .github/morro-control/claims.json             .morro/changesets/MD-CP-AUTONOMOUS-BLOCK-A.json             .morro/changesets/MD-PHASE21-CONVERGED.json             docs/integration/PHASE21-CONVERGED-CANDIDATE.md
          git commit -m "style(phase21): apply canonical Prettier"
          git push origin HEAD:integration/phase21-converged-candidate-20261001
