name: Itacare exact product candidate bounded proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "apps/morro-digital-platform/public/assets/brand/itacare-digital-micro-v2.svg"
      - "apps/morro-digital-platform/public/assets/brand/itacare-digital-symbol-v2.svg"
      - "apps/morro-digital-platform/public/destination.css"
      - "apps/morro-digital-platform/public/destination.html"
      - "apps/morro-digital-platform/src/bootstrap/geospatial.test.ts"
      - "apps/morro-digital-platform/src/bootstrap/geospatial.ts"
      - "apps/morro-digital-platform/src/bootstrap/runtime.test.ts"
      - "apps/morro-digital-platform/src/bootstrap/runtime.ts"
      - "apps/morro-digital-platform/src/browser-entry.ts"
      - "apps/morro-digital-platform/src/browser.ts"
      - "apps/morro-digital-platform/src/destinations/destination-browser-entry.ts"
      - "apps/morro-digital-platform/src/destinations/destination-page.test.ts"
      - "apps/morro-digital-platform/src/destinations/destination-page.ts"
      - "apps/morro-digital-platform/src/runtime/public-destination.test.ts"
      - "apps/morro-digital-platform/src/runtime/public-destination.ts"
      - "apps/morro-digital-platform/tooling/destination-api-host-gate.mjs"
      - "apps/morro-digital-platform/tooling/destination-api-host-gate.test.mjs"
      - "apps/morro-digital-platform/tooling/destination-page-resolver.mjs"
      - "apps/morro-digital-platform/tooling/destination-page-resolver.test.mjs"
      - "apps/morro-digital-platform/tooling/destination-public-projection.mjs"
      - "apps/morro-digital-platform/tooling/destination-public-templates.mjs"
      - "apps/morro-digital-platform/tooling/destination-public-templates.test.mjs"
      - "apps/morro-digital-platform/tooling/destination-request-resolver.mjs"
      - "apps/morro-digital-platform/tooling/destination-request-resolver.test.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "packages/business/src/public-place-projection.ts"
      - "packages/business/src/public-place-projection.test.ts"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.mjs"
      - "apps/morro-digital-platform/tooling/place-platform-runtime.vitest.mjs"
      - "apps/morro-digital-platform/tooling/itacare-place-destination-http.mysql.mjs"
      - ".github/workflows/itacare-product-candidate-proof.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor base SHA for the bounded activation census
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: itacare-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bounded-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: itacare_disposable
          MYSQL_ROOT_PASSWORD: local-ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=local-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      LAB_HARNESS_HEAD: bd67c168d46ce749483e826ee2ab7f563a7bf68e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: luizanunciostoca/morro-integration-lab
          ref: ${{ env.LAB_HARNESS_HEAD }}
          ssh-key: ${{ secrets.MORRO_LAB_READONLY_DEPLOY_KEY }}
          path: proof-lab
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Exact identities and positive helper assertions
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          [[ "$CANDIDATE_BASE" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$CANDIDATE_BASE^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_BASE" HEAD
          test "$(git -C ../proof-lab rev-parse HEAD)" = "$LAB_HARNESS_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/itacare-product-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/itacare-product-evidence/identity.txt"
          node --test apps/morro-digital-platform/tooling/destination-api-host-gate.test.mjs apps/morro-digital-platform/tooling/destination-page-resolver.test.mjs apps/morro-digital-platform/tooling/destination-request-resolver.test.mjs apps/morro-digital-platform/tooling/destination-public-templates.test.mjs
          node --test ../proof-lab/scripts/itacare-v2-disposable-database.test.mjs
      - name: Atomic owner-bound UI activation contract
        id: phase
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          # This version is integrated atomically with the complete destination UI.
          # Removal/partial activation is denied; actual server/SQL/browser proof follows.
          activation_paths=(
            "apps/morro-digital-platform/public/assets/brand/itacare-digital-micro-v2.svg"
            "apps/morro-digital-platform/public/assets/brand/itacare-digital-symbol-v2.svg"
            "apps/morro-digital-platform/public/destination.css"
            "apps/morro-digital-platform/public/destination.html"
            "apps/morro-digital-platform/src/bootstrap/geospatial.test.ts"
            "apps/morro-digital-platform/src/bootstrap/geospatial.ts"
            "apps/morro-digital-platform/src/bootstrap/runtime.test.ts"
            "apps/morro-digital-platform/src/bootstrap/runtime.ts"
            "apps/morro-digital-platform/src/browser-entry.ts"
            "apps/morro-digital-platform/src/browser.ts"
            "apps/morro-digital-platform/src/destinations/destination-browser-entry.ts"
            "apps/morro-digital-platform/src/destinations/destination-page.test.ts"
            "apps/morro-digital-platform/src/destinations/destination-page.ts"
            "apps/morro-digital-platform/src/runtime/public-destination.test.ts"
            "apps/morro-digital-platform/src/runtime/public-destination.ts"
          )
          for path in "${activation_paths[@]}"; do
            test -f "$path" && test ! -L "$path"
            git ls-files --error-unmatch "$path" >/dev/null
          done
          entry=apps/morro-digital-platform/tooling/dev-server.mjs
          adapter=apps/morro-digital-platform/tooling/itacare-place-destination-http.mysql.mjs
          test -f "$adapter" && test ! -L "$adapter"
          git ls-files --error-unmatch "$adapter" >/dev/null
          grep -Fq 'destination-browser-entry.js' apps/morro-digital-platform/public/destination.html
          grep -Fq '__DESTINATION_SCOPED_RUNTIME_CONFIG__' apps/morro-digital-platform/public/destination.html
          grep -Fq 'destination-page-resolver.mjs' "$entry"
          grep -Fq 'resolveTrustedPlaceDestinationScope({' "$entry"
          grep -Fq 'trustedPlace.scope' "$entry"
          grep -Fq 'requireOwner: true' "$entry"
          grep -Fq 'DISPOSABLE_PROOF_DOTENV_DENIED' "$entry"
          grep -Fq 'REAL_DEV_SERVER_API_PROVEN' "$adapter"
          grep -Fq 'runSyntheticBrowserProof' "$adapter"
          ! grep -Fq 'DESTINATION_UI_NOT_RELEASED' "$entry"
          echo 'scoped_place=true' >> "$GITHUB_OUTPUT"
          echo 'server_bound=true' >> "$GITHUB_OUTPUT"
          echo 'activated=true' >> "$GITHUB_OUTPUT"
          printf 'OWNER_BOUND_UI_PRESENT: exact candidate %s; acceptance still requires real SQL/server and separate browser proof.\n' "$CANDIDATE_HEAD" > "$RUNNER_TEMP/itacare-product-evidence/phase.txt"
      - name: Build exact current dependencies for scoped Place or destination activation
        if: steps.phase.outputs.scoped_place == 'true' || steps.phase.outputs.server_bound == 'true' || steps.phase.outputs.activated == 'true'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter '@touristic/morro-digital-platform^...' build
          pnpm --filter @touristic/morro-digital-platform typecheck
          pnpm --filter @touristic/morro-digital-platform lint
          pnpm --filter @touristic/morro-digital-platform build
      - name: Scoped Place unit and real SQL socket proof independent of UI B
        if: steps.phase.outputs.scoped_place == 'true'
        working-directory: product
        env:
          ITACARE_DISPOSABLE_MYSQL_URL: mysql://root:local-ci-only@127.0.0.1:3306/itacare_disposable
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @touristic/business exec vitest run src/public-place-projection.test.ts src/place-publication-governance.test.ts
          pnpm --filter @touristic/morro-digital-platform exec vitest run --config tooling/place-platform-runtime.vitest.config.mjs tooling/place-platform-runtime.vitest.mjs
          node --test apps/morro-digital-platform/tooling/itacare-place-destination-http.mysql.mjs | tee "$RUNNER_TEMP/itacare-product-evidence/scoped-place-sql-http.log"
      - name: Real owner-bound UI and Place API with suspension isolation
        if: steps.phase.outputs.server_bound == 'true'
        working-directory: product
        env:
          ITACARE_DISPOSABLE_MYSQL_URL: mysql://root:local-ci-only@127.0.0.1:3306/itacare_disposable
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.phase.outputs.scoped_place }}" = true
          node apps/morro-digital-platform/tooling/itacare-place-destination-http.mysql.mjs --mode=dev-server | tee "$RUNNER_TEMP/itacare-product-evidence/real-dev-server-api.log"
      - name: Activated destination UI regressions require the scoped Place proof
        if: steps.phase.outputs.activated == 'true'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.phase.outputs.scoped_place }}' = 'true'
          pnpm --filter @touristic/morro-digital-platform exec vitest run src/runtime/public-destination.test.ts src/bootstrap/runtime.test.ts src/bootstrap/geospatial.test.ts src/destinations/destination-page.test.ts
      - name: Exact built UI synthetic-browser regression and retained screenshots
        if: steps.phase.outputs.activated == 'true'
        working-directory: product
        env:
          ITACARE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/itacare-pw/node_modules/playwright/index.mjs
          ITACARE_BROWSER_PRODUCT_ROOT: ${{ github.workspace }}/product
          ITACARE_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/itacare-product-evidence/browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/itacare-pw" --no-save --no-audit --no-fund playwright@1.54.2
          node "$RUNNER_TEMP/itacare-pw/node_modules/playwright/cli.js" install --with-deps chromium
          node apps/morro-digital-platform/tooling/itacare-place-destination-http.mysql.mjs --mode=browser | tee "$RUNNER_TEMP/itacare-product-evidence/browser.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root=process.env.ITACARE_BROWSER_EVIDENCE_DIR;
          const report=JSON.parse(fs.readFileSync(path.join(root,'browser-report.json'),'utf8'));
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'screenshot-manifest.json'),'utf8'));
          const tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          assert.equal(report.status,'ITACARE_SYNTHETIC_BROWSER_PROVEN');
          assert.equal(report.headSha,process.env.CANDIDATE_HEAD);assert.equal(report.treeSha,tree);assert.equal(report.clean,true);
          assert.equal(manifest.headSha,report.headSha);assert.equal(manifest.treeSha,tree);
          assert.deepEqual(report.failures,[]);assert.deepEqual(report.externalRequests,[]);assert.deepEqual(report.pageErrors,[]);
          assert.equal(report.sqlAcceptance,'NOT_RUN');assert.equal(report.providerAcceptance,'NOT_RUN');
          assert.ok(report.cases.length>0 && report.cases.every(x=>x.result==='PASS'));
          const expected=['mobile-pt-BR.png','mobile-en.png','mobile-es.png','mobile-he.png','desktop-en.png'];
          assert.deepEqual(manifest.screenshots.map(x=>x.path).sort(),expected.sort());
          for(const file of manifest.screenshots){
            assert.equal(path.basename(file.path),file.path);
            const bytes=fs.readFileSync(path.join(root,file.path));
            assert.ok(bytes.length>100);assert.equal(bytes.length,file.bytes);
            assert.equal(bytes.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            assert.equal(createHash('sha256').update(bytes).digest('hex'),file.sha256);
          }
          console.log('RETAINED_SCREENSHOT_MANIFEST_VERIFIED');
          JS
          echo 'PROVEN: exact candidate real disposable SQL/HTTP owner and scoped Place boundary; separate actual Chromium over synthetic API/map fixtures. NOT_PROVEN: native Mapbox/provider, licensed catalog or production.' > "$RUNNER_TEMP/itacare-product-evidence/runtime-state.txt"
      - name: Final immutable readback
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itacare-exact-product-bounded-proof
          path: ${{ runner.temp }}/itacare-product-evidence
          if-no-files-found: error
