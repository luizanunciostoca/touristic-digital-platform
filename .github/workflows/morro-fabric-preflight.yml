name: Morro Fabric Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: /tmp/turbo-cache

jobs:
  plan:
    name: fabric / plan
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.plan.outputs.risk }}
      ui: ${{ steps.plan.outputs.ui }}
      auth: ${{ steps.plan.outputs.auth }}
      payments: ${{ steps.plan.outputs.payments }}
      ticketing: ${{ steps.plan.outputs.ticketing }}
      ci: ${{ steps.plan.outputs.ci }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Build semantic change plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node tooling/fabric/plan-change.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --json fabric-plan.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fabric-plan-${{ github.run_id }}
          path: fabric-plan.json
          retention-days: 14

  fast-proof:
    name: fabric / fast proof
    needs: plan
    if: ${{ needs.plan.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/turbo-cache
          key: fabric-turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','turbo.json','eslint.config.mjs','tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: |
            fabric-turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','turbo.json','eslint.config.mjs','tsconfig.base.json') }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Static proof
        run: |
          pnpm secret-patterns:check
          pnpm lint
          pnpm typecheck

  critical-policy:
    name: fabric / critical policy
    needs: plan
    if: ${{ needs.plan.outputs.risk == 'critical' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Critical invariants
        run: |
          pnpm architecture:check
          pnpm release:readiness:check
          pnpm ci:governance:check
          pnpm ci:supply-chain:strict
