name: Assistant Photo Browser Contract

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/assistant-photo-browser-contract.yml
      - images/fotos/**
      - docs/qa/ASSISTANT-V1-PHOTO-ASSETS.sha256
      - apps/morro-digital-platform/src/assistant/assistant-v1-photo-assets.test.ts
      - apps/morro-digital-platform/src/assistant/assistant-v1-photo-catalog.ts
      - apps/morro-digital-platform/src/assistant/assistant-domain-adapter.ts
      - apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - apps/morro-digital-platform/src/map/explore-locations-control.ts
      - apps/morro-digital-platform/src/map/place-bottom-sheet.ts
      - apps/morro-digital-platform/public/assistant-photo-carousel.css
      - apps/morro-digital-platform/public/design-system-v2.css
      - apps/morro-digital-platform/tooling/dev-server.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  photo-browser-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Chromium
        run: |
          npm install --prefix /tmp/pw --no-save playwright@1.54.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Build workspace
        run: pnpm -w build
      - name: Start authenticated browser runtime
        env:
          MAPBOX_PUBLIC_TOKEN_CI: ${{ secrets.MAPBOX_PUBLIC_TOKEN_CI }}
        run: |
          test -n "${MAPBOX_PUBLIC_TOKEN_CI:-}" || { echo 'MAPBOX_PUBLIC_TOKEN_CI missing'; exit 1; }
          VITE_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN_CI" \
          VITE_MAPBOX_STYLE=mapbox://styles/mapbox/streets-v12 \
          VITE_MAPBOX_CONTAINER_ID=map \
          VITE_MAPBOX_INITIAL_ZOOM=13.5 \
          node apps/morro-digital-platform/tooling/dev-server.mjs >/tmp/photo-browser-contract.log 2>&1 &
          echo $! >/tmp/photo-browser-contract.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/runtime-config.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/photo-browser-contract.log
          exit 1
      - name: Validate physical bytes, carousel and persistent place actions
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { chromium } = require('/tmp/pw/node_modules/playwright');

          const expectedAssets = new Map([
            ['/images/fotos/farol_do_morro1.jpg', 'e404a31c4f155637f1c5e969c9b25610cc824b0fdc1528dd04a3f067065a0434'],
            ['/images/fotos/primeira_praia2.jpeg', '0fcf94e6f7518415af009e8e57eca53093f87cc96789c6a64c55a2646524b90c'],
            ['/images/fotos/toca_do_morcego2.jpg', '8cd4c26a1cd3356c728a6ca06559b52ae1fbbee93aa822ab0dc6bfe0f51db3c6'],
          ]);
          const expectedBeachDetailValues = [
            'condições da praia',
            'como chegar',
            'ver fotos',
            'informações',
            'mais opções',
            'adicionar aos favoritos',
            'compartilhar',
          ];

          async function validateStaticAsset(path, expectedHash) {
            const response = await fetch(`http://127.0.0.1:4173${path}`);
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().startsWith('image/jpeg')) {
              throw new Error(`${path} returned unexpected content type ${contentType}`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            const hash = createHash('sha256').update(bytes).digest('hex');
            if (hash !== expectedHash) {
              throw new Error(`${path} hash drifted: ${hash}`);
            }
          }

          async function waitForMap(page) {
            await page.locator('#map[data-map-state="ready"][data-map-mode="real"][data-map-provider="mapbox"]').waitFor({
              state: 'attached',
              timeout: 30000,
            });
          }

          async function openAssistant(page) {
            const input = page.locator('#assistantInput');
            await input.waitFor({ state: 'visible', timeout: 10000 });
            await input.focus();
            await page.locator('#assistant-messages:not(.hidden)').waitFor({ state: 'visible', timeout: 5000 });
          }

          (async () => {
            for (const [path, hash] of expectedAssets) {
              await validateStaticAsset(path, hash);
            }

            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                geolocation: { latitude: -13.3776181, longitude: -38.9142193 },
                permissions: ['geolocation'],
              });
              await context.addInitScript(() => {
                localStorage.setItem('morro-digital-onboarded', '1');
                localStorage.setItem('voice-enabled', 'false');
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await waitForMap(page);
              await openAssistant(page);
              await page.locator('#assistantInput').fill('Fotos de Toca do Morcego');
              await page.locator('#sendButton').click();

              const carousel = page.locator('.assistant-photo-carousel');
              await carousel.waitFor({ state: 'visible', timeout: 10000 });
              const carouselV2 = await carousel.evaluate((node) => {
                const track = node.querySelector('.assistant-photo-carousel-track');
                const slides = Array.from(
                  node.querySelectorAll('.assistant-photo-carousel-slide'),
                );
                return {
                  role: node.getAttribute('role'),
                  label: node.getAttribute('aria-label'),
                  trackRole: track?.getAttribute('role'),
                  trackTabIndex: track?.getAttribute('tabindex'),
                  trackLabel: track?.getAttribute('aria-label'),
                  slideRoles: slides.map((slide) => slide.getAttribute('role')),
                  slideLabels: slides.map((slide) => slide.getAttribute('aria-label')),
                };
              });
              if (
                carouselV2.role !== 'region' ||
                !carouselV2.label?.includes('Toca do Morcego') ||
                carouselV2.trackRole !== 'list' ||
                carouselV2.trackTabIndex !== '0' ||
                !carouselV2.trackLabel?.includes('Toca do Morcego') ||
                carouselV2.slideRoles.some((role) => role !== 'listitem') ||
                carouselV2.slideLabels.length !== 3 ||
                !carouselV2.slideLabels[0]?.includes('1') ||
                !carouselV2.slideLabels[2]?.includes('3')
              ) {
                throw new Error(`Carousel V2 semantics drifted: ${JSON.stringify(carouselV2)}`);
              }

              const carouselTrack = carousel.locator('.assistant-photo-carousel-track');
              await carouselTrack.focus();
              await page.keyboard.press('ArrowRight');
              await page
                .locator('.assistant-photo-carousel-track[data-active-index="1"]')
                .waitFor({ state: 'attached', timeout: 5000 });
              await page.keyboard.press('End');
              await page
                .locator('.assistant-photo-carousel-track[data-active-index="2"]')
                .waitFor({ state: 'attached', timeout: 5000 });
              await page.keyboard.press('Home');
              await page
                .locator('.assistant-photo-carousel-track[data-active-index="0"]')
                .waitFor({ state: 'attached', timeout: 5000 });

              const sources = await carousel.locator('img').evaluateAll((images) =>
                images.map((image) => new URL(image.src).pathname),
              );
              const expectedSources = [
                '/images/fotos/toca_do_morcego1.jpg',
                '/images/fotos/toca_do_morcego2.jpg',
                '/images/fotos/toca_do_morcego3.jpg',
              ];
              if (JSON.stringify(sources) !== JSON.stringify(expectedSources)) {
                throw new Error(`Unexpected carousel sources: ${JSON.stringify(sources)}`);
              }

              const firstPhoto = page.locator('.assistant-photo-carousel img').first();
              await firstPhoto.waitFor({ state: 'visible', timeout: 10000 });
              const photoLoaded = await firstPhoto.evaluate(
                (image) =>
                  image instanceof HTMLImageElement &&
                  image.complete &&
                  image.naturalWidth > 0,
              );
              if (!photoLoaded) {
                throw new Error('Assistant carousel first photo did not load physical bytes.');
              }

              await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
              await waitForMap(page);
              await openAssistant(page);

              await page.locator('#assistant-category-beaches').click();
              await page.locator('#assistant-category-results[data-category="beaches"][data-stage="filters"]').waitFor({
                state: 'visible',
                timeout: 5000,
              });
              await page.locator('#assistant-category-results [data-value="ver todos"]').click();
              await page.locator('#assistant-category-results[data-stage="places"] [data-location-name="Primeira Praia"]').waitFor({
                state: 'visible',
                timeout: 5000,
              });
              await page.locator('#assistant-category-results [data-location-name="Primeira Praia"]').click();
              const placeValues = await page.locator(
                '#place-bottom-sheet .place-bottom-sheet-action',
              ).evaluateAll((buttons) =>
                buttons.map((button) => button.getAttribute('data-value')),
              );
              if (JSON.stringify(placeValues) !== JSON.stringify(expectedBeachDetailValues)) {
                throw new Error(`Place V2 photo action set drifted: ${JSON.stringify(placeValues)}`);
              }

              await page.locator('#place-bottom-sheet .place-bottom-sheet-action[data-value="ver fotos"]').click();

              const primeiraPraiaCarousel = page.locator('.assistant-photo-carousel');
              await primeiraPraiaCarousel.waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#assistant-messages:not(.hidden)').waitFor({
                state: 'visible',
                timeout: 5000,
              });

              const photoState = await page.evaluate(() => {
                const area = document.querySelector('#assistant-messages .messages-area');
                const children = area ? Array.from(area.children) : [];
                const visibleMessage = children.find((element) => {
                  if (!(element instanceof HTMLElement) || !element.classList.contains('message')) return false;
                  const style = getComputedStyle(element);
                  return !element.classList.contains('hidden') && style.display !== 'none' && style.visibility !== 'hidden';
                });
                const carousel = area?.querySelector('.assistant-photo-carousel') ?? null;
                const duplicatedPlaceActions = Array.from(
                  area?.querySelectorAll('.assistant-option-btn') ?? [],
                  (button) => button.getAttribute('data-value'),
                ).filter((value) => expectedBeachDetailValues.includes(value));
                return {
                  messageText: visibleMessage?.textContent?.trim() ?? '',
                  messageIndex: visibleMessage ? children.indexOf(visibleMessage) : -1,
                  carouselIndex: carousel ? children.indexOf(carousel) : -1,
                  duplicatedPlaceActions,
                  photoActionGroups: area?.querySelectorAll(
                    '.assistant-options[data-presentation="photo-actions"]',
                  ).length ?? 0,
                  photoActionValues: Array.from(
                    area?.querySelectorAll(
                      '.assistant-options[data-presentation="photo-actions"] .assistant-option-btn',
                    ) ?? [],
                    (button) => button.getAttribute('data-value'),
                  ),
                  legacyBackCount: area?.querySelectorAll('.assistant-photo-back-options').length ?? 0,
                };
              });
              if (
                !photoState.messageText.includes('Primeira Praia') ||
                photoState.messageIndex < 0 ||
                photoState.carouselIndex <= photoState.messageIndex ||
                photoState.duplicatedPlaceActions.length !== 0 ||
                photoState.photoActionGroups !== 1 ||
                JSON.stringify(photoState.photoActionValues) !== JSON.stringify(['[sub]beaches']) ||
                photoState.legacyBackCount !== 0
              ) {
                throw new Error(`Photo V2 de-duplication diverged: ${JSON.stringify(photoState)}`);
              }

              await page
                .locator(
                  '.assistant-options[data-presentation="photo-actions"] .assistant-option-btn[data-value="[sub]beaches"]',
                )
                .click();
              await page.locator(
                '#assistant-category-results[data-category="beaches"][data-stage="places"]',
              ).waitFor({ state: 'visible', timeout: 5000 });
              await page
                .locator('.assistant-photo-carousel')
                .waitFor({ state: 'detached', timeout: 5000 });
              const returnedPlaces = await page.locator(
                '#assistant-category-results [data-location-name]',
              ).count();
              if (returnedPlaces !== 8) {
                throw new Error(`Photo Back did not restore the beach list: ${returnedPlaces}`);
              }

              if (pageErrors.length) {
                throw new Error(`Browser errors: ${JSON.stringify(pageErrors)}`);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show diagnostics
        if: failure()
        run: cat /tmp/photo-browser-contract.log || true
