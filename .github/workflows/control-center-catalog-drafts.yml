name: Control Center Catalog Drafts Acceptance

on:
  workflow_call:
    inputs:
      ci_selected_suites:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: suite-control-center-catalog-drafts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: morro_business }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BUSINESS_DATABASE_URL: mysql://root:root@127.0.0.1:3306/morro_business
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: pnpm }
      - id: ci_command_01
        run: pnpm install --frozen-lockfile
      - name: Build canonical dependencies
        id: ci_command_02
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/core build
          pnpm --filter @touristic/business build
          pnpm --filter @touristic/content-server build
      - name: Catalog draft privacy acceptance
        id: ci_command_03
        run: node --test apps/morro-digital-platform/tooling/control-center-catalog-drafts.mysql.mjs

      - name: Record managed suite execution
        id: ci_receipt
        if: success() && contains(fromJSON(inputs.ci_selected_suites || '["control-center-catalog-drafts.yml"]'), 'control-center-catalog-drafts.yml')
        env:
          CI_SELECTED_SUITES: ${{ inputs.ci_selected_suites || '["control-center-catalog-drafts.yml"]' }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tooling/ci/workflow-coverage.mjs --receipt control-center-catalog-drafts.yml
      - name: Upload managed suite execution
        id: ci_receipt_upload
        if: success() && steps.ci_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-suite-control-center-catalog-drafts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-suite-receipt.json
          if-no-files-found: error
          retention-days: 30
