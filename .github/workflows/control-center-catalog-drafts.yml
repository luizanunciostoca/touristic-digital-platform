name: Control Center Catalog Drafts Acceptance

on:
  pull_request:
    paths:
      [
        ".github/workflows/control-center-catalog-drafts.yml",
        "apps/control-center/public/control-center-business-cms.js",
        "apps/morro-digital-platform/src/ux/control-center-business-cms-contract.test.ts",
        "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs",
        "apps/morro-digital-platform/tooling/catalog-platform-runtime.mjs",
        "apps/morro-digital-platform/tooling/control-center-catalog-drafts.mysql.mjs",
        "apps/morro-digital-platform/tooling/place-platform-runtime.mjs",
      ]

permissions: { contents: read }

concurrency:
  group: control-center-catalog-drafts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: morro_business }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BUSINESS_DATABASE_URL: mysql://root:root@127.0.0.1:3306/morro_business
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: { version: 10.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build canonical dependencies
        run: |
          pnpm --filter @touristic/auth build
          pnpm --filter @touristic/core build
          pnpm --filter @touristic/business build
          pnpm --filter @touristic/content-server build
      - name: Catalog draft privacy acceptance
        run: node --test apps/morro-digital-platform/tooling/control-center-catalog-drafts.mysql.mjs
