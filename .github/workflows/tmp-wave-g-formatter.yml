name: Temporary Wave G Formatter

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/tmp-wave-g-formatter.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/morro-digital-platform/public/design-system-v2.css \
            apps/morro-digital-platform/src/accessibility/wave-g-design-system-contract.test.ts \
            apps/morro-digital-platform/tooling/wave-g-responsive-a11y-regression.mjs

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/public/design-system-v2.css \
            apps/morro-digital-platform/src/accessibility/wave-g-design-system-contract.test.ts \
            apps/morro-digital-platform/tooling/wave-g-responsive-a11y-regression.mjs
          git commit -m "style(ux): apply canonical Wave G formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
