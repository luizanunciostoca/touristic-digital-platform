name: TEMP Affiliates PR Format

on:
  push:
    branches:
      - fix/affiliates-conversion-commission-reversals-20260823

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/affiliates-conversion-commission-reversals-20260823
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply narrow typed fixes
        shell: python
        run: |
          from pathlib import Path

          commercial = Path("services/affiliates/src/affiliate-commercial-application-service.ts")
          source = commercial.read_text()
          source = source.replace('"affiliate.transition_commission"', '"affiliate.change_entitlement"')
          source = source.replace('"affiliate.apply_financial_adjustment"', '"affiliate.change_entitlement"')
          old = '''function stable(value: unknown): string {
            if (value === null || typeof value !== "object") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(stable).join(",")}]`;
            const object = value as Readonly<Record<string, unknown>>;
            return `{${Object.keys(object)
              .sort()
              .map((key) => `${JSON.stringify(key)}:${stable(object[key])}`)
              .join(",")}}`;
          }'''
          new = '''function stable(value: unknown): string {
            if (value === null) return "null";
            if (
              typeof value === "string" ||
              typeof value === "number" ||
              typeof value === "boolean"
            ) {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(stable).join(",")}]`;
            if (typeof value === "object") {
              const object = value as Readonly<Record<string, unknown>>;
              return `{${Object.keys(object)
                .sort()
                .map((key) => `${JSON.stringify(key)}:${stable(object[key])}`)
                .join(",")}}`;
            }
            throw new Error("AFFILIATE_CANONICAL_INPUT_UNSUPPORTED");
          }'''
          if old not in source:
            raise SystemExit("stable() source block not found")
          commercial.write_text(source.replace(old, new))

          persistence = Path("services/affiliates/src/mysql-affiliate-persistence.ts")
          source = persistence.read_text()
          old = '''function entitlementFromRow(row: EntitlementRow): CommissionEntitlement {
            return {
          '''
          new = '''function entitlementFromRow(row: EntitlementRow): CommissionEntitlement {
            if (
              row.policy_version !== "AFFILIATE-POLICY-V1" ||
              row.rate_basis_points !== 3000
            ) {
              throw new Error("AFFILIATE_POLICY_SNAPSHOT_CONFLICT");
            }
            return {
          '''
          if old not in source:
            raise SystemExit("entitlementFromRow source block not found")
          source = source.replace(old, new)
          source = source.replace("rateBasisPoints: 3000,", "rateBasisPoints: row.rate_basis_points as 3000,")
          persistence.write_text(source)
      - name: Format changed affiliate files
        run: >-
          pnpm exec prettier --write
          packages/affiliates/package.json
          packages/affiliates/src/commission-acceptance.test.ts
          services/affiliates/package.json
          services/affiliates/src/index.ts
          services/affiliates/src/affiliate-adapters.ts
          services/affiliates/src/affiliate-adapters.test.ts
          services/affiliates/src/affiliate-commercial-application-service.ts
          services/affiliates/src/affiliate-http-transport.ts
          services/affiliates/src/affiliate-http-transport.test.ts
          services/affiliates/src/mysql-affiliate-persistence.ts
          services/affiliates/src/commercial-mysql-integration.test.ts
      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/affiliates services/affiliates
          git commit -m "fix(affiliates): align commercial acceptance contracts"
          git push origin HEAD:fix/affiliates-conversion-commission-reversals-20260823
