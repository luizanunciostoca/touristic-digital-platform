name: TEMP Affiliates PR Format

on:
  push:
    branches:
      - fix/affiliates-conversion-commission-reversals-20260823

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/affiliates-conversion-commission-reversals-20260823
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed affiliate files
        run: >-
          pnpm exec prettier --write
          packages/affiliates/package.json
          packages/affiliates/src/commission-acceptance.test.ts
          services/affiliates/package.json
          services/affiliates/src/index.ts
          services/affiliates/src/affiliate-adapters.ts
          services/affiliates/src/affiliate-adapters.test.ts
          services/affiliates/src/affiliate-commercial-application-service.ts
          services/affiliates/src/affiliate-http-transport.ts
          services/affiliates/src/affiliate-http-transport.test.ts
          services/affiliates/src/commercial-mysql-integration.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/affiliates services/affiliates
          git commit -m "style(affiliates): apply canonical formatting"
          git push origin HEAD:fix/affiliates-conversion-commission-reversals-20260823
