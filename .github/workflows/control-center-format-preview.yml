name: Control Center Formatting Preview

on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "apps/morro-digital-platform/tooling/admin-*.mjs"
      - "apps/morro-digital-platform/tooling/auth-api.mjs"
      - "docs/control-center/**"
      - "docs/features/registry.json"
      - "packages/auth/src/index.ts"
      - ".github/workflows/control-center-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit deterministic Prettier 3.9.6 output
        shell: bash
        run: |
          files=(
            "apps/control-center/public/control-center.css"
            "apps/control-center/public/control-center.js"
            "apps/control-center/public/index.html"
            "apps/morro-digital-platform/tooling/admin-api.mjs"
            "apps/morro-digital-platform/tooling/admin-api.test.mjs"
            "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
            "apps/morro-digital-platform/tooling/auth-api.mjs"
            "docs/control-center/IMPLEMENTATION.md"
            "docs/features/registry.json"
            "packages/auth/src/index.ts"
          )
          for file in "${files[@]}"; do
            echo "__MORRO_PRETTIER_START__${file}"
            pnpm exec prettier "${file}"
            echo "__MORRO_PRETTIER_END__${file}"
          done
