name: Control Center Formatting Preview

on:
  pull_request:
    paths:
      - ".github/workflows/control-center-format-preview.yml"
      - ".github/workflows/control-center-browser-contract.yml"
      - "apps/morro-digital-platform/src/business-login-entry.ts"
      - "apps/morro-digital-platform/src/business-login-entry.test.ts"
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-api.test.mjs"
      - "apps/morro-digital-platform/tooling/admin-audit-runtime.mjs"
      - "apps/morro-digital-platform/tooling/admin-audit-runtime.test.mjs"
      - "apps/morro-digital-platform/tooling/dev-server.mjs"
      - "services/analytics/src/control-center-audit.ts"
      - "services/analytics/src/control-center-audit.test.ts"
      - "services/analytics/src/index.ts"
      - "services/auth/src/index.ts"
      - "services/auth/src/index.test.ts"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit deterministic Prettier output
        shell: bash
        run: |
          files=(
            ".github/workflows/control-center-browser-contract.yml"
            "apps/morro-digital-platform/src/business-login-entry.ts"
            "apps/morro-digital-platform/src/business-login-entry.test.ts"
            "apps/morro-digital-platform/tooling/admin-api.mjs"
            "apps/morro-digital-platform/tooling/admin-api.test.mjs"
            "apps/morro-digital-platform/tooling/admin-audit-runtime.mjs"
            "apps/morro-digital-platform/tooling/admin-audit-runtime.test.mjs"
            "apps/morro-digital-platform/tooling/dev-server.mjs"
            "services/analytics/src/control-center-audit.ts"
            "services/analytics/src/control-center-audit.test.ts"
            "services/analytics/src/index.ts"
            "services/auth/src/index.ts"
            "services/auth/src/index.test.ts"
          )
          for file in "${files[@]}"; do
            echo "__MORRO_PRETTIER_START__${file}"
            pnpm exec prettier "${file}"
            echo "__MORRO_PRETTIER_END__${file}"
          done
