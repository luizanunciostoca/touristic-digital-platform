name: M48 Format Docs Once

on:
  push:
    branches:
      - feat/auth-m48-server-browser-integration
    paths:
      - .github/workflows/m48-format-docs-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M48 documentation
        run: pnpm exec prettier --write docs/migration/AUTH-MIGRATION-MATRIX.md docs/qa/AUTH-M48-EVIDENCE.md
      - name: Commit formatted docs and remove helper
        run: |
          rm .github/workflows/m48-format-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/AUTH-MIGRATION-MATRIX.md docs/qa/AUTH-M48-EVIDENCE.md .github/workflows/m48-format-docs-once.yml
          git commit -m "style(auth): format M48 documentation"
          git push
