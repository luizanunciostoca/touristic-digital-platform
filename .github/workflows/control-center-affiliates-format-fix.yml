name: Control Center Affiliates Format Fix

on:
  push:
    branches:
      - wave/control-center-affiliates-admin-20260920

permissions:
  contents: write

concurrency:
  group: control-center-affiliates-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: |
          pnpm exec prettier --write \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/package.json \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs \
            apps/morro-digital-platform/tooling/affiliate-admin-runtime.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            services/affiliates/src/affiliate-admin-query-service.ts \
            services/affiliates/src/index.ts \
            .github/workflows/control-center-affiliates-contract.yml \
            .github/workflows/control-center-affiliates-browser-contract.yml
      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/package.json \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.mjs \
            apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs \
            apps/morro-digital-platform/tooling/affiliate-admin-runtime.mjs \
            apps/morro-digital-platform/tooling/dev-server.mjs \
            services/affiliates/src/affiliate-admin-query-service.ts \
            services/affiliates/src/index.ts \
            .github/workflows/control-center-affiliates-contract.yml \
            .github/workflows/control-center-affiliates-browser-contract.yml
          git commit -m "style(control-center): format Affiliates admin slice"
          git push origin HEAD:wave/control-center-affiliates-admin-20260920
