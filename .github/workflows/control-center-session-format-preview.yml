name: Control Center Session Format Preview

on:
  push:
    branches:
      - wave/control-center-auth-sessions-20260920

permissions:
  contents: read

concurrency:
  group: control-center-session-format-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/control-center/public/control-center.js \
            services/auth/src/security-state.ts \
            services/auth/src/security-state.test.ts
          do
            echo "__MORRO_SESSION_PRETTIER_START__${file}"
            pnpm exec prettier "${file}"
            echo "__MORRO_SESSION_PRETTIER_END__${file}"
          done
