name: Format NAV-14 Temp

on:
  push:
    branches:
      - feat/navigation-request-port
    paths:
      - .github/workflows/navigation-nav14-format-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-request-port
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/navigation/navigation-request-port.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/src/navigation/navigation-request-port.ts
          git commit -m "style: format navigation request port"
          git push origin HEAD:feat/navigation-request-port
