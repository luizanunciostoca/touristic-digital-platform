name: M67 CRM baseline promotion helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-m67-baseline-inventory
    paths:
      - ".github/workflows/m67-crm-baseline-promotion-helper.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m67-baseline-inventory
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply baseline promotion
        run: |
          python3 .github/scripts/m67-crm-baseline-promotion.py
          pnpm exec prettier --write docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/CRM-M67-EVIDENCE.md
      - name: Validate canonical sources
        run: |
          pnpm format:check
          pnpm features:check
      - name: Commit permanent promotion only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/features/registry.json docs/migration/MASTER-MIGRATION-TRACKER.md docs/qa/CRM-M67-EVIDENCE.md
          git commit -m "docs(crm): promote M67 baseline state"
          git push origin HEAD:feat/crm-m67-baseline-inventory
