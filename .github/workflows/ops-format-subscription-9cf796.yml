name: Ops Format Subscription 9cf796

on:
  push:
    branches:
      - ops/format-subscription-9cf796-20260824

permissions:
  contents: write

jobs:
  format-fix:
    if: github.event.head_commit.message != 'chore(ops): canonical subscription fix blobs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact type fix and canonical formatting
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/morro-digital-platform/src/payments-browser-subscription-client.test.ts';
          const before = fs.readFileSync(path, 'utf8');
          const needle = 'function okResponse(data = projection): Response {';
          if (!before.includes(needle)) throw new Error('TYPE_FIX_TARGET_NOT_FOUND');
          fs.writeFileSync(path, before.replace(needle, 'function okResponse(data: unknown = projection): Response {'));
          NODE
          pnpm exec prettier --write \
            apps/morro-digital-platform/src/payments-browser-subscription-client.ts \
            apps/morro-digital-platform/src/payments-browser-subscription-client.test.ts \
            apps/morro-digital-platform/tooling/payments-subscription-api.mjs \
            packages/ordering/src/subscription-activation-application.ts \
            packages/ordering/src/subscription-activation-application.test.ts
          pnpm format:check
          pnpm -w build
          git diff --check
      - name: Commit canonical blobs to ops branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/morro-digital-platform/src/payments-browser-subscription-client.ts \
            apps/morro-digital-platform/src/payments-browser-subscription-client.test.ts \
            apps/morro-digital-platform/tooling/payments-subscription-api.mjs \
            packages/ordering/src/subscription-activation-application.ts \
            packages/ordering/src/subscription-activation-application.test.ts
          git diff --cached --check
          git commit -m "chore(ops): canonical subscription fix blobs"
          git push origin HEAD:ops/format-subscription-9cf796-20260824
