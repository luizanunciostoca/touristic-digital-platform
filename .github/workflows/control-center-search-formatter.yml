name: Control Center Search Formatter

on:
  push:
    branches:
      - wave/control-center-final-integration-20260921
    paths:
      - ".github/workflows/control-center-search-formatter.yml"

permissions:
  contents: write

concurrency:
  group: control-center-search-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm exec prettier --write apps/control-center/public/control-center-search.js

      - name: Commit formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/control-center-search-formatter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-center/public/control-center-search.js .github/workflows/control-center-search-formatter.yml
          git diff --cached --quiet && {
            echo "Expected formatting/self-removal changes, but none were generated." >&2
            exit 1
          }
          git commit -m "style(search): apply canonical Control Center formatting"
          git push origin "HEAD:wave/control-center-final-integration-20260921"
