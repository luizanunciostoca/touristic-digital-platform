name: M72 CRM transport helper

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-m72-authenticated-transport
    paths:
      - ".github/workflows/m72-crm-transport-helper.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m72-authenticated-transport
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - name: Format M72 artifacts
        run: pnpm exec prettier --write services/crm/package.json services/crm/src/index.ts services/crm/src/schema.ts services/crm/src/mysql-audit-port.ts services/crm/src/leads-http-transport.ts services/crm/src/leads-http-transport.test.ts pnpm-lock.yaml
      - name: Validate CRM server
        run: |
          pnpm --filter @touristic/crm-server lint
          pnpm --filter @touristic/crm-server typecheck
          pnpm --filter @touristic/crm-server test
          pnpm --filter @touristic/crm-server build
      - name: Validate repository quality
        run: pnpm check
      - name: Commit permanent M72 integration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/crm pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(crm): integrate M72 authenticated transport"
          git push origin HEAD:feat/crm-m72-authenticated-transport
