name: Financial Admin Formatting Preview

on:
  pull_request:
    paths:
      - "apps/morro-digital-platform/tooling/admin-api.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
      - "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
      - "apps/morro-digital-platform/tooling/payments-api.test.mjs"
      - ".github/workflows/control-center-financial-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier output
        shell: bash
        run: |
          files=(
            "apps/morro-digital-platform/tooling/admin-api.mjs"
            "apps/morro-digital-platform/tooling/admin-domain-adapters.mjs"
            "apps/morro-digital-platform/tooling/admin-domain-adapters.test.mjs"
            "apps/morro-digital-platform/tooling/payments-api.test.mjs"
          )
          for file in "${files[@]}"; do
            echo "__MD_FIN_FORMAT_START__${file}"
            pnpm exec prettier "${file}"
            echo "__MD_FIN_FORMAT_END__${file}"
          done
