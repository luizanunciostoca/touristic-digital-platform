name: Temporary Probe Production Readiness

on:
  push:
    branches:
      - ops/probe-production-readiness-c5597ea6-20260924

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe safe readiness fields
        shell: bash
        run: |
          set -euo pipefail
          base="https://morro-digital-v2.onrender.com"
          health_status="$(curl -sS -o /tmp/health.json -D /tmp/health.headers -w '%{http_code}' "$base/healthz")"
          ready_status="$(curl -sS -o /tmp/ready.json -D /tmp/ready.headers -w '%{http_code}' "$base/readyz")"
          echo "health_status=$health_status"
          echo "ready_status=$ready_status"
          echo "health_release=$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/{gsub(/\r/,"",$2); print $2}' /tmp/health.headers | tail -1)"
          echo "ready_release=$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/{gsub(/\r/,"",$2); print $2}' /tmp/ready.headers | tail -1)"
          echo "readiness=$(jq -r '.readiness // .status // "unknown"' /tmp/ready.json)"
          jq -r '[.checks[]? | select(.status == "fail") | .name] | "failed_checks=" + join(",")' /tmp/ready.json
