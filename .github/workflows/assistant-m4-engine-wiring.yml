name: Assistant M4 engine wiring

on:
  push:
    branches: [feat/assistant-runtime-m4]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-runtime-m4
      - name: Wire complex intents before synonym fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/assistant/src/intent-engine.ts')
          text = path.read_text()
          import_line = 'import { classifyAssistantComplexIntent } from "./complex-intents.js";\n\n'
          if not text.startswith(import_line):
              text = import_line + text
          needle = '  const synonymMatch = matchBySynonyms(normalized);\n'
          block = '''  const complexIntentMatch = classifyAssistantComplexIntent(input);\n  if (complexIntentMatch) {\n    return {\n      ...complexIntentMatch,\n      entities,\n      normalized,\n      modifiers,\n    };\n  }\n\n'''
          if block not in text:
              if needle not in text:
                  raise SystemExit('Expected synonym fallback insertion point not found')
              text = text.replace(needle, block + needle, 1)
          path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/assistant/src/intent-engine.ts packages/assistant/src/complex-intents.ts packages/assistant/src/complex-intents.test.ts
      - run: pnpm --filter @touristic/assistant lint && pnpm --filter @touristic/assistant typecheck && pnpm --filter @touristic/assistant test
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant/src/intent-engine.ts packages/assistant/src/complex-intents.ts packages/assistant/src/complex-intents.test.ts
          git commit -m "feat(assistant): wire V1 complex intents into analyzer"
          git push origin HEAD:feat/assistant-runtime-m4
