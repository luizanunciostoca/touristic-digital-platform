name: Temporary PR75 Dynamic Reader Fix

on:
  push:
    paths:
      - .github/workflows/tmp-pr75-dynamic-reader-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/explore-v1-i18n-parity
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply dynamic reader fix
        run: python tooling/tmp-pr75-dynamic-reader-fix.py
      - name: Format and validate harness
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
          pnpm exec prettier --check apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
          node --check apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
          git diff --check
      - name: Commit validated harness change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/morro-digital-platform/tooling/explore-v1-i18n-browser-parity.mjs
          git diff --cached --check
          git commit -m "test(explore): read dynamic i18n options from located container"
          git push origin HEAD:fix/explore-v1-i18n-parity
