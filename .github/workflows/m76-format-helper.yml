name: M76 format helper

on:
  push:
    branches:
      - feat/crm-m76-proposals-boundary
    paths:
      - ".github/workflows/m76-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-m76-proposals-boundary
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/crm/src/proposals-boundary.ts packages/crm/src/proposals-boundary.test.ts
      - name: Commit formatted M76 files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/crm/src/proposals-boundary.ts packages/crm/src/proposals-boundary.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(crm): format M76 proposals boundary"
          git push origin HEAD:feat/crm-m76-proposals-boundary
