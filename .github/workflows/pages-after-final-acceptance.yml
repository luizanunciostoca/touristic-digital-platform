name: Pages After Final Acceptance

on:
  workflow_run:
    workflows:
      - Final Release Acceptance
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-after-final-acceptance
  cancel-in-progress: false

jobs:
  build:
    name: pages / build certified SHA
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      certified_sha: ${{ steps.certify.outputs.sha }}
    steps:
      - name: Certify the accepted frozen candidate
        id: certify
        env:
          ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // empty')"
          test "$pages_build_type" = "workflow"

          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/rc/$ACCEPTED_SHA" --jq '.object.sha')"
          test "$candidate_sha" = "$ACCEPTED_SHA"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$ACCEPTED_SHA...main" --jq '.status')"
          [[ "$ancestry" == identical || "$ancestry" == ahead ]]

          acceptance_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ACCEPTED_SHA/status" \
            --jq '.statuses[] | select(.context == "Final Release Acceptance") | .state' \
            | head -n 1)"
          test "$acceptance_state" = "success"

          echo "sha=$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Certified exact SHA for Pages: $ACCEPTED_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.certify.outputs.sha }}
          fetch-depth: 1

      - name: Build Pages artifact from certified SHA
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: pages / deploy certified SHA
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Re-prove the candidate before Pages promotion
        env:
          CERTIFIED_SHA: ${{ needs.build.outputs.certified_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // empty')"
          test "$pages_build_type" = "workflow"

          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/rc/$CERTIFIED_SHA" --jq '.object.sha')"
          test "$candidate_sha" = "$CERTIFIED_SHA"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$CERTIFIED_SHA...main" --jq '.status')"
          [[ "$ancestry" == identical || "$ancestry" == ahead ]]
          latest_accepted_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow final-release-acceptance.yml \
            --branch main --event workflow_dispatch --status success --limit 1 \
            --json headSha --jq '.[0].headSha')"
          test "$latest_accepted_sha" = "$CERTIFIED_SHA"
          acceptance_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CERTIFIED_SHA/status" \
            --jq '.statuses[] | select(.context == "Final Release Acceptance") | .state' \
            | head -n 1)"
          test "$acceptance_state" = "success"

      - name: Deploy certified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
