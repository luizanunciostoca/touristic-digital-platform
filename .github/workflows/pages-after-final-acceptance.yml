name: Pages After Final Acceptance

on:
  workflow_run:
    workflows:
      - Final Release Acceptance
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-after-final-acceptance
  cancel-in-progress: false

jobs:
  build:
    name: pages / build certified SHA
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      certified_sha: ${{ steps.certify.outputs.sha }}
    steps:
      - name: Certify exact accepted SHA is still current main
        id: certify
        env:
          ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // empty')"
          test "$pages_build_type" = "workflow"

          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main_sha" = "$ACCEPTED_SHA"

          acceptance_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ACCEPTED_SHA/status" \
            --jq '.statuses[] | select(.context == "Final Release Acceptance") | .state' \
            | head -n 1)"
          test "$acceptance_state" = "success"

          echo "sha=$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Certified exact SHA for Pages: $ACCEPTED_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.certify.outputs.sha }}
          fetch-depth: 1

      - name: Build Pages artifact from certified SHA
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  deploy:
    name: pages / deploy certified SHA
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Re-prove certified SHA is still current main
        env:
          CERTIFIED_SHA: ${{ needs.build.outputs.certified_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // empty')"
          test "$pages_build_type" = "workflow"

          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main_sha" = "$CERTIFIED_SHA"
          acceptance_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CERTIFIED_SHA/status" \
            --jq '.statuses[] | select(.context == "Final Release Acceptance") | .state' \
            | head -n 1)"
          test "$acceptance_state" = "success"

      - name: Deploy certified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
