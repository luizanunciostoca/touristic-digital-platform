name: Assistant global command parity finalization

on:
  push:
    branches:
      - fix/assistant-v1-runtime-intelligence-completion

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/assistant-v1-runtime-intelligence-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply global command parity patch
        run: python .github/scripts/finalize_assistant_global_commands.py
      - name: Format affected files
        run: |
          pnpm exec prettier --write apps/morro-digital-platform/src/assistant/assistant-menu-command-router.ts apps/morro-digital-platform/src/assistant/browser-assistant-runtime.ts
      - name: Validate platform
        run: |
          pnpm --filter @touristic/morro-digital-platform test
          pnpm --filter @touristic/morro-digital-platform typecheck
      - name: Validate workspace build
        run: pnpm -w build
      - name: Commit validated result
        run: |
          rm -f .github/workflows/assistant-global-commands-finalize-once.yml
          rm -f .github/scripts/finalize_assistant_global_commands.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(assistant): restore V1 global commands and numeric selection"
          git push origin HEAD:fix/assistant-v1-runtime-intelligence-completion
