name: Ticketing Payments MySQL Cleanup Once

on:
  push:
    branches:
      - fix/ticketing-feature-0011-current-main
    paths:
      - ".github/workflows/zz-ticketing-payments-mysql-cleanup-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m137-integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pm137-integration"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_ADMIN_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/mysql
      ORDERING_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/ordering_m137_test
      FINANCIAL_DATABASE_URL: mysql://root:m137-integration@127.0.0.1:3306/financial_m137_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticketing-feature-0011-current-main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make M138 cleanup independent across schema generations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tooling/payments/checkout-mysql-integration.test.ts")
          s = p.read_text()
          start_marker = "  beforeEach(async () => {"
          end_marker = "\n  afterAll(async () => {"
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit(f"markers beforeEach={s.count(start_marker)} afterAll={s.count(end_marker)}")
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = '''  beforeEach(async () => {
            for (const table of [
              "ordering_subscription_renewal_intents",
              "ordering_subscriptions",
              "ordering_ticketing_reservation_bindings",
            ]) {
              try {
                await orderingPool.query(`DELETE FROM ${table}`);
              } catch (error) {
                if (
                  !error ||
                  typeof error !== "object" ||
                  !("code" in error) ||
                  error.code !== "ER_NO_SUCH_TABLE"
                ) {
                  throw error;
                }
              }
            }
            await orderingPool.query("DELETE FROM ordering_checkout_access");
            await financialPool.query("DELETE FROM financial_ledger_postings");
            await financialPool.query("DELETE FROM financial_ledger_transactions");
            await financialPool.query("DELETE FROM financial_payments");
            await financialPool.query("DELETE FROM financial_payment_idempotency");
            await orderingPool.query("DELETE FROM ordering_orders");
          });
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          pnpm exec prettier --write tooling/payments/checkout-mysql-integration.test.ts
      - name: Build M138 package dependencies
        run: |
          pnpm --filter @touristic/financial build
          pnpm --filter @touristic/ordering build
      - name: Validate M138 checkout MySQL integration
        run: pnpm exec vitest run tooling/payments/checkout-mysql-integration.test.ts
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/payments/checkout-mysql-integration.test.ts
          git commit -m "test(ticketing): isolate M138 cleanup across ordering schemas"
          git push origin HEAD:fix/ticketing-feature-0011-current-main
