name: One-shot branch formatter

on:
  push:
    branches:
      - feat/fast-safe-continuous-assistant-20260924
    paths:
      - ".github/workflows/branch-prettier-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/fast-safe-continuous-assistant-20260924
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write             .github/copilot-instructions.md             .github/skills/morro-code-review/SKILL.md             apps/morro-digital-platform/src/assistant/assistant-contextual-state.ts             apps/morro-digital-platform/src/assistant/assistant-conversation-orchestrator.ts             apps/morro-digital-platform/src/assistant/assistant-conversation-policy.ts             apps/morro-digital-platform/src/assistant/assistant-conversation-response-composer.ts             apps/morro-digital-platform/src/assistant/assistant-conversation-voice-composer.ts             apps/morro-digital-platform/src/assistant/assistant-message-dom.ts             tooling/ci/impact-analyzer.mjs             tooling/ci/test-impact-manifest.json             tooling/quality/check-assistant-public-copy.mjs
          rm .github/workflows/branch-prettier-format.yml
      - name: Commit formatter result and self-remove
        env:
          TARGET_BRANCH: feat/fast-safe-continuous-assistant-20260924
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply canonical formatting to assistant delivery wave"
          git push origin "HEAD:$TARGET_BRANCH"
