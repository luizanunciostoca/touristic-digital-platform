name: Control Center Users Format Repair
# rearmed after workflow admission

on:
  push:
    branches:
      - "wave/platform-control-center-final-completion-20260921"
    paths:
      - ".github/workflows/__temp-control-center-users-format.yml"

permissions:
  contents: write

concurrency:
  group: control-center-users-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/platform-control-center-final-completion-20260921
          repository: luizanunciostoca/touristic-digital-platform
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and validate Users Permissions slice
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec prettier --write \
            apps/control-center/public/control-center.js \
            apps/morro-digital-platform/tooling/admin-api.mjs \
            apps/morro-digital-platform/tooling/admin-api.test.mjs \
            apps/morro-digital-platform/tooling/auth-api-admin-policy.test.mjs \
            apps/morro-digital-platform/tooling/auth-api.mjs

          pnpm --filter @touristic/auth-server typecheck
          pnpm --filter @touristic/auth-server test
          pnpm --filter @touristic/morro-digital-platform exec vitest run \
            tooling/admin-api.test.mjs \
            tooling/auth-api-admin-policy.test.mjs

          rm .github/workflows/__temp-control-center-users-format.yml

          git config user.name "morro-digital-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(control-center): format durable user administration"
          git push origin "HEAD:wave/platform-control-center-final-completion-20260921"
