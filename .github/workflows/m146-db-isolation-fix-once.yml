name: Temporary M146 Database Isolation Fix

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-db-isolation-fix-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolate M146 integration database
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/financial/src/settlement-mysql-integration.test.ts')
          s = p.read_text()
          old = '''const databaseUrl = process.env.FINANCIAL_DATABASE_URL;
          const adminUrl = process.env.MYSQL_ADMIN_DATABASE_URL;
          const describeMySql = databaseUrl && adminUrl ? describe : describe.skip;'''
          new = '''const databaseUrl = process.env.FINANCIAL_DATABASE_URL;
          const adminUrl = process.env.MYSQL_ADMIN_DATABASE_URL;
          const settlementDatabaseUrl = databaseUrl
            ? (() => {
                const url = new URL(databaseUrl);
                url.pathname = "/financial_m146_test";
                return url.toString();
              })()
            : undefined;
          const describeMySql =
            settlementDatabaseUrl && adminUrl ? describe : describe.skip;'''
          if old not in s:
              raise SystemExit('database prelude not found exactly once')
          s = s.replace(old, new, 1)
          s = s.replace('if (!adminUrl || !databaseUrl)', 'if (!adminUrl || !settlementDatabaseUrl)', 1)
          s = s.replace('FINANCIAL_DATABASE_URL: databaseUrl,', 'FINANCIAL_DATABASE_URL: settlementDatabaseUrl,', 1)
          p.write_text(s)
          PY
          pnpm exec prettier --write services/financial/src/settlement-mysql-integration.test.ts
          pnpm --filter @touristic/financial-server lint
          pnpm --filter @touristic/financial-server typecheck
          git diff --check
      - name: Commit isolation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/financial/src/settlement-mysql-integration.test.ts
          git commit -m "test(payments): isolate M146 settlement database"
          git push origin HEAD:feat/payments-m146-settlement
