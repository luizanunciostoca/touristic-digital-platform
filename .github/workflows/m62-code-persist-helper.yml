name: M62 code persist helper
on:
  push:
    branches: [feat/business-m62-commercial-browser-lifecycle]
    paths: [.github/workflows/m62-code-persist-helper.yml]
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-m62-commercial-browser-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reuse validated M62 patch script
        run: |
          python <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/m62-integration-helper.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(lines) if 'name: Apply M62 browser lifecycle integration' in l)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_line + 1:]:
            if line.startswith('      - '):
              break
            body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/m62-apply.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/m62-apply.sh
      - run: pnpm exec prettier --write apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/src/business-onboarding-entry.ts apps/morro-digital-platform/public/business-onboarding.html packages/business/src/onboarding-context.ts
      - run: pnpm --filter @touristic/business lint && pnpm --filter @touristic/business typecheck && pnpm --filter @touristic/business test && pnpm --filter @touristic/morro-digital-platform typecheck && pnpm --filter @touristic/morro-digital-platform test && pnpm -w build
      - name: Commit validated code only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/morro-digital-platform/src/business-onboarding-runtime.ts apps/morro-digital-platform/src/business-onboarding-surface.ts apps/morro-digital-platform/src/business-onboarding-entry.ts apps/morro-digital-platform/public/business-onboarding.html packages/business/src/onboarding-context.ts
          git commit -m "feat(business): integrate M62 commercial browser lifecycle"
          git push
