name: Temporary M146 Fixture Fix

on:
  push:
    branches:
      - feat/payments-m146-settlement
    paths:
      - ".github/workflows/m146-fixture-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-m146-settlement
      - name: Correct settlement snapshot fixture clock
        run: |
          python3 -c 'from pathlib import Path; p=Path("services/financial/src/settlement-mysql-integration.test.ts"); s=p.read_text(); old="2026-08-15T05:00:00.000Z"; new="2026-08-15T04:31:00.000Z"; assert s.count(old)==1, "expected fixture timestamp not found exactly once"; p.write_text(s.replace(old,new,1))'
          git diff --check
      - name: Commit fixture and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m146-fixture-fix-once.yml
          git add services/financial/src/settlement-mysql-integration.test.ts
          git commit -m "test(payments): align M146 provider snapshot fixture"
          git push origin HEAD:feat/payments-m146-settlement
