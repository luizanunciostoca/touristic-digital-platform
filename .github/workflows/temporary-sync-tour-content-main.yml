name: Temporary Sync Tour Content Main

on:
  push:
    branches:
      - feat/tour-content-i18n

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tour-content-i18n
          fetch-depth: 0
      - name: Merge current main and preserve MIG-0014 decision
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            :
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "docs/migration/MASTER-MIGRATION-TRACKER.md" || {
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            }
            git checkout --theirs docs/migration/MASTER-MIGRATION-TRACKER.md
            python <<'PY'
          from pathlib import Path
          path = Path('docs/migration/MASTER-MIGRATION-TRACKER.md')
          text = path.read_text()
          old = '| MIG-0014 | `js/tours/tour-data.js` | Tours | FEATURE-0007 | `apps/morro-digital-platform/src/config/tour-catalog.ts` + `tour-localization.ts` | 4 | migrating | apresentação estrutural dos 3 roteiros preservada; conteúdo editorial multilíngue ainda não auditado integralmente | 3 roteiros / 18 paradas estruturais validados | PR #18 permanece draft até equivalência editorial com V1 congelada | alto |'
          new = '| MIG-0014 | `js/tours/tour-data.js` | Tours | FEATURE-0007 | `apps/morro-digital-platform/src/config/tour-catalog.ts` + `tour-localization.ts` | 4 | equivalent | estrutura e conteúdo editorial multilíngue dos 3 roteiros preservados em PT-BR, EN, ES e HE | 3 roteiros / 18 paradas; descrições, narrações, dicas, fallbacks, chaves V1, geometria e mídia preservados | PR #18; Quality Gate #385 verde; revalidação integradora obrigatória após sync com `main` | alto |'
          if old not in text:
              raise SystemExit('MIG-0014 tracker row did not match expected current-main baseline')
          path.write_text(text.replace(old, new))
          PY
            git add docs/migration/MASTER-MIGRATION-TRACKER.md
            git commit --no-edit
          fi
          if git status --porcelain | grep -q .; then
            echo "Unexpected dirty worktree after merge"
            git status --short
            exit 1
          fi
          git push origin HEAD:feat/tour-content-i18n
