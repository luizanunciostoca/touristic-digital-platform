name: Platform Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform-contract.yml"
      - "tooling/quality/check-platform-contracts.mjs"
      - "tooling/quality/check-workflow-supply-chain.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/contracts/**"
      - "docs/product-architecture/PLATFORM-BIBLE.md"
      - "docs/product-architecture/MODULE-CONTRACTS.md"
      - "packages/core/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-contract.yml"
      - "tooling/quality/check-platform-contracts.mjs"
      - "tooling/quality/check-workflow-supply-chain.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/contracts/**"
      - "docs/product-architecture/PLATFORM-BIBLE.md"
      - "docs/product-architecture/MODULE-CONTRACTS.md"
      - "packages/core/**"

permissions:
  contents: read

concurrency:
  group: platform-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-contract:
    name: platform-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run canonical Platform gate
        run: pnpm ci:platform
