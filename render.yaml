services:
  - type: pserv
    name: morro-digital-v2-production-mysql
    runtime: docker
    repo: https://github.com/luizanunciostoca/touristic-digital-platform
    branch: main
    region: virginia
    plan: starter
    autoDeploy: false
    dockerContext: .
    dockerfilePath: ./tooling/render/mysql-production/Dockerfile
    disk:
      name: mysql-production-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: AUTH_DATABASE_NAME
        value: morro_auth
      - key: AUTH_DATABASE_USER
        value: morro_auth
      - key: AUTH_DATABASE_PASSWORD
        generateValue: true
      - key: AUDIT_DATABASE_NAME
        value: morro_audit
      - key: AUDIT_DATABASE_USER
        value: morro_audit
      - key: AUDIT_DATABASE_PASSWORD
        generateValue: true
      - key: DESTINATIONS_DATABASE_NAME
        value: morro_destinations
      - key: DESTINATIONS_DATABASE_USER
        value: morro_destinations
      - key: DESTINATIONS_DATABASE_PASSWORD
        generateValue: true
      - key: CONTENT_DATABASE_NAME
        value: morro_content
      - key: CONTENT_DATABASE_USER
        value: morro_content
      - key: CONTENT_DATABASE_PASSWORD
        generateValue: true
      - key: BUSINESS_DATABASE_NAME
        value: morro_business
      - key: BUSINESS_DATABASE_USER
        value: morro_business
      - key: BUSINESS_DATABASE_PASSWORD
        generateValue: true
      - key: ORDERING_DATABASE_NAME
        value: morro_ordering
      - key: ORDERING_DATABASE_USER
        value: morro_ordering
      - key: ORDERING_DATABASE_PASSWORD
        generateValue: true
      - key: FINANCIAL_DATABASE_NAME
        value: morro_financial
      - key: FINANCIAL_DATABASE_USER
        value: morro_financial
      - key: FINANCIAL_DATABASE_PASSWORD
        generateValue: true
      - key: TICKETING_DATABASE_NAME
        value: morro_ticketing
      - key: TICKETING_DATABASE_USER
        value: morro_ticketing
      - key: TICKETING_DATABASE_PASSWORD
        generateValue: true
      - key: NOTIFICATIONS_DATABASE_NAME
        value: morro_notifications
      - key: NOTIFICATIONS_DATABASE_USER
        value: morro_notifications
      - key: NOTIFICATIONS_DATABASE_PASSWORD
        generateValue: true
      - key: AFFILIATES_DATABASE_NAME
        value: morro_affiliates
      - key: AFFILIATES_DATABASE_USER
        value: morro_affiliates
      - key: AFFILIATES_DATABASE_PASSWORD
        generateValue: true
      - key: ANALYTICS_DATABASE_NAME
        value: morro_analytics
      - key: ANALYTICS_DATABASE_USER
        value: morro_analytics
      - key: ANALYTICS_DATABASE_PASSWORD
        generateValue: true
      - key: CRM_DATABASE_NAME
        value: morro_crm
      - key: CRM_DATABASE_USER
        value: morro_crm
      - key: CRM_DATABASE_PASSWORD
        generateValue: true
      - key: COMMERCE_DATABASE_NAME
        value: morro_commerce
      - key: COMMERCE_DATABASE_USER
        value: morro_commerce
      - key: COMMERCE_DATABASE_PASSWORD
        generateValue: true

  - type: web
    name: morro-digital-v2
    runtime: node
    region: virginia
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: node apps/morro-digital-platform/tooling/payments-migrate.mjs
    startCommand: node apps/morro-digital-platform/tooling/dev-server.mjs
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # Bootstrap-only production MySQL topology. These prefixed values are
      # resolved by Render from the private service and are converted to canonical
      # *_DATABASE_URL values only inside the bootstrap child process. Keeping the
      # existing application database URLs untouched preserves rollback until cutover.
      - key: PRODUCTION_MYSQL_HOSTPORT
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          property: hostport
      - key: PRODUCTION_AUTH_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUTH_DATABASE_NAME
      - key: PRODUCTION_AUTH_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUTH_DATABASE_USER
      - key: PRODUCTION_AUTH_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUTH_DATABASE_PASSWORD
      - key: PRODUCTION_AUDIT_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUDIT_DATABASE_NAME
      - key: PRODUCTION_AUDIT_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUDIT_DATABASE_USER
      - key: PRODUCTION_AUDIT_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AUDIT_DATABASE_PASSWORD
      - key: PRODUCTION_DESTINATIONS_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: DESTINATIONS_DATABASE_NAME
      - key: PRODUCTION_DESTINATIONS_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: DESTINATIONS_DATABASE_USER
      - key: PRODUCTION_DESTINATIONS_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: DESTINATIONS_DATABASE_PASSWORD
      - key: PRODUCTION_CONTENT_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CONTENT_DATABASE_NAME
      - key: PRODUCTION_CONTENT_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CONTENT_DATABASE_USER
      - key: PRODUCTION_CONTENT_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CONTENT_DATABASE_PASSWORD
      - key: PRODUCTION_BUSINESS_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: BUSINESS_DATABASE_NAME
      - key: PRODUCTION_BUSINESS_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: BUSINESS_DATABASE_USER
      - key: PRODUCTION_BUSINESS_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: BUSINESS_DATABASE_PASSWORD
      - key: PRODUCTION_ORDERING_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ORDERING_DATABASE_NAME
      - key: PRODUCTION_ORDERING_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ORDERING_DATABASE_USER
      - key: PRODUCTION_ORDERING_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ORDERING_DATABASE_PASSWORD
      - key: PRODUCTION_FINANCIAL_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: FINANCIAL_DATABASE_NAME
      - key: PRODUCTION_FINANCIAL_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: FINANCIAL_DATABASE_USER
      - key: PRODUCTION_FINANCIAL_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: FINANCIAL_DATABASE_PASSWORD
      - key: PRODUCTION_TICKETING_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: TICKETING_DATABASE_NAME
      - key: PRODUCTION_TICKETING_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: TICKETING_DATABASE_USER
      - key: PRODUCTION_TICKETING_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: TICKETING_DATABASE_PASSWORD
      - key: PRODUCTION_NOTIFICATIONS_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: NOTIFICATIONS_DATABASE_NAME
      - key: PRODUCTION_NOTIFICATIONS_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: NOTIFICATIONS_DATABASE_USER
      - key: PRODUCTION_NOTIFICATIONS_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: NOTIFICATIONS_DATABASE_PASSWORD
      - key: PRODUCTION_AFFILIATES_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AFFILIATES_DATABASE_NAME
      - key: PRODUCTION_AFFILIATES_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AFFILIATES_DATABASE_USER
      - key: PRODUCTION_AFFILIATES_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: AFFILIATES_DATABASE_PASSWORD
      - key: PRODUCTION_ANALYTICS_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ANALYTICS_DATABASE_NAME
      - key: PRODUCTION_ANALYTICS_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ANALYTICS_DATABASE_USER
      - key: PRODUCTION_ANALYTICS_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: ANALYTICS_DATABASE_PASSWORD
      - key: PRODUCTION_CRM_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CRM_DATABASE_NAME
      - key: PRODUCTION_CRM_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CRM_DATABASE_USER
      - key: PRODUCTION_CRM_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: CRM_DATABASE_PASSWORD
      - key: PRODUCTION_COMMERCE_DATABASE_NAME
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: COMMERCE_DATABASE_NAME
      - key: PRODUCTION_COMMERCE_DATABASE_USER
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: COMMERCE_DATABASE_USER
      - key: PRODUCTION_COMMERCE_DATABASE_PASSWORD
        fromService:
          type: pserv
          name: morro-digital-v2-production-mysql
          envVarKey: COMMERCE_DATABASE_PASSWORD

      # Production Auth boundary used by Payments authenticated authority.
      - key: DASHBOARD_AUTH_SECRET
        generateValue: true
      - key: DASHBOARD_USERS_JSON
        sync: false
      - key: DASHBOARD_AUTH_ORIGIN
        sync: false
      - key: DASHBOARD_SESSION_TTL_SECONDS
        value: "28800"
      - key: AUTH_DATABASE_URL
        sync: false
      # Set true only when the configured production user set intentionally
      # contains a global admin. Leaving it false/unset fails readiness closed.
      - key: DASHBOARD_ADMIN_GLOBAL_BYPASS_CONFIRMED
        sync: false

      # Platform readiness / graceful shutdown. Release SHA/branch/instance
      # identity is derived automatically from Render-provided runtime variables.
      - key: PLATFORM_SHUTDOWN_READINESS_DELAY_MS
        value: "5000"
      - key: PLATFORM_SHUTDOWN_DRAIN_TIMEOUT_MS
        value: "15000"

      # Provider-neutral Notifications runtime. Delivery providers remain
      # unconfigured until separately authorized; persistence is server-only.
      - key: NOTIFICATIONS_FEATURE_ENABLED
        value: "false"
      - key: NOTIFICATIONS_DATABASE_URL
        sync: false
      - key: NOTIFICATIONS_SCHEDULER_INTERVAL_MS
        value: "5000"
      - key: NOTIFICATIONS_SCHEDULER_BATCH_SIZE
        value: "25"

      # Durable domain databases. Keep Ordering and Financial isolated.
      - key: ORDERING_DATABASE_URL
        sync: false
      - key: FINANCIAL_DATABASE_URL
        sync: false
      - key: ORDERING_PRICING_CATALOG_JSON
        sync: false

      # Checkout authority and public-return policy.
      - key: PAYMENTS_DESTINATION_ID
        value: morro-de-sao-paulo
      - key: PAYMENTS_RETURN_URL_ORIGINS
        sync: false
      - key: PAYMENTS_STATUS_TOKEN_SECRET
        generateValue: true
      - key: PAYMENTS_HANDOFF_SECRET
        generateValue: true
      # Server-only signing key; preserve existing values when syncing.
      - key: TICKETING_OFFLINE_PROVISIONING_SECRET
        generateValue: true
      - key: PAYMENTS_STATUS_TOKEN_TTL_SECONDS
        value: "86400"

      # Provider selection. Production infrastructure remains deliberately locked
      # to Mercado Pago TEST until an explicit financial authorization is recorded.
      - key: PAYMENTS_PROVIDER_MODE
        value: mercado_pago
      - key: MERCADO_PAGO_CHECKOUT_MODE
        value: test
      - key: MERCADO_PAGO_TEST_CREDENTIALS_CONFIRMED
        sync: false
      - key: MERCADO_PAGO_PRODUCTION_CREDENTIALS_CONFIRMED
        value: "false"
      - key: MERCADO_PAGO_PRODUCTION_AUTHORIZATION_ID
        sync: false
      # Checkout Pro's current API reference documents sandbox_init_point on this
      # exact HTTPS origin. The adapter rejects every other origin. Revalidate the
      # production provider response during the separately authorized cutover.
      - key: MERCADO_PAGO_CHECKOUT_ORIGINS
        value: https://sandbox.mercadopago.com

      # Production provider configuration is entered directly in this service's
      # Render environment. No secret is inherited from staging or legacy V1.
      - key: V1_PAYMENT_PROVIDER_API_URL
        value: https://api.mercadopago.com
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      # Browser-safe Public Key only; Access Tokens remain server-side.
      - key: VITE_MERCADO_PAGO_PUBLIC_KEY
        sync: false

      # Recurring billing is materialized but remains disabled before financial
      # authorization. Enabling it requires the dedicated production credentials
      # and callback to pass the predeploy cutover guard.
      - key: PAYMENTS_SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: PAYMENTS_SUBSCRIPTION_BACK_URL
        sync: false
      - key: MERCADO_PAGO_SUBSCRIPTIONS_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_SUBSCRIPTIONS_PUBLIC_KEY
        sync: false

      - key: PAYMENTS_WEBHOOK_URL
        sync: false
      - key: PAYMENTS_WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: PAYMENTS_PROVIDER_TIMEOUT_MS
        value: "8000"
      - key: PAYMENTS_PROVIDER_MAX_ATTEMPTS
        value: "2"
      - key: PAYMENTS_PROVIDER_RETRY_BASE_MS
        value: "100"

      # Current rate limiter is process-local and therefore requires one replica.
      - key: PAYMENTS_RUNTIME_REPLICA_COUNT
        value: "1"
      - key: PAYMENTS_RATE_LIMIT_DISTRIBUTED_STORE_CONFIGURED
        value: "false"

      # Existing browser/runtime provider configuration. Keep public and secret
      # values separated exactly as in the repository environment contract.
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: VITE_MAPBOX_STYLE
        sync: false
      - key: VITE_MAPBOX_CONTAINER_ID
        value: map
      - key: VITE_MAPBOX_INITIAL_ZOOM
        value: "14"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
