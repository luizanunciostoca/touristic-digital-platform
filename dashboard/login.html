<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#07111f" />
    <title>Acesso ao Painel — Morro Digital</title>
    <link rel="stylesheet" href="/dashboard/login.css" />
    <script
      type="module"
      src="/apps/morro-digital-platform/dist/business-login-entry.js"
    ></script>
  </head>
  <body>
    <main class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <div class="logo" aria-hidden="true">M</div>
        <div>
          <h1 id="login-title">Painel Morro Digital</h1>
          <p class="subtitle">Entre com a conta vinculada ao seu negócio.</p>
        </div>
      </div>

      <form id="login-form" autocomplete="on">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          maxlength="160"
          required
        />

        <label for="password">Senha</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          maxlength="200"
          required
        />

        <button id="submit" type="submit" disabled>Entrar com segurança</button>
        <div id="message" class="message" role="alert" hidden></div>
      </form>

      <p class="security">
        Sessão protegida por cookie HttpOnly, isolamento por empresa e validação
        CSRF.
      </p>
    </main>
  </body>
</html>
