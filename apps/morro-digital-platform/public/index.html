<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Guia digital interativo de Morro de São Paulo" />
    <title>Morro de São Paulo Digital</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#map">Ir para o mapa</a>
    <main class="app-shell" data-destination-id="morro-de-sao-paulo">
      <header class="top-header" aria-label="Cabeçalho principal">
        <div>
          <h1>Morro Digital</h1>
          <p>Descubra o paraíso</p>
        </div>
      </header>

      <section class="map-section" aria-label="Mapa interativo de Morro de São Paulo">
        <div id="map"></div>
      </section>

      <nav class="map-toolbar" aria-label="Controles do mapa">
        <button id="locateButton" type="button" aria-label="Mostrar minha localização">◎</button>
        <button id="zoomInButton" type="button" aria-label="Aproximar mapa">+</button>
        <button id="zoomOutButton" type="button" aria-label="Afastar mapa">−</button>
        <button id="layersButton" type="button" aria-label="Alternar visualização do mapa">◇</button>
      </nav>

      <aside class="assistant-card" aria-label="Assistente virtual">
        <button id="assistantClose" class="assistant-close" type="button" aria-label="Minimizar assistente">×</button>
        <div class="assistant-avatar" aria-hidden="true">☀️</div>
        <div class="assistant-copy">
          <strong>Olá! Eu sou o seu guia digital.</strong>
          <span>Posso ajudar você a descobrir praias, restaurantes, passeios e rotas.</span>
        </div>
      </aside>

      <button id="assistantOpen" class="assistant-fab" type="button" aria-label="Abrir assistente">☀️</button>

      <form id="assistantForm" class="assistant-input" aria-label="Pergunte ao assistente">
        <input id="assistantInput" type="text" placeholder="Pergunte algo sobre Morro de São Paulo..." aria-label="Campo de entrada do assistente" />
        <button type="submit" aria-label="Enviar mensagem">➤</button>
        <button type="button" aria-label="Enviar mensagem de voz">🎙</button>
        <button type="button" aria-label="Configurações do assistente">⚙</button>
      </form>

      <nav class="bottom-navigation" aria-label="Navegação principal">
        <button class="is-active" type="button"><span>⌂</span>Início</button>
        <button type="button"><span>⌕</span>Explorar</button>
        <button type="button"><span>♡</span>Favoritos</button>
        <button type="button"><span>☰</span>Menu</button>
      </nav>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
