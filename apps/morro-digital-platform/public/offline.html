<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#0f766e" />
    <title>Morro Digital — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          "Poppins",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f9fafb;
        color: #1f2937;
      }

      main {
        width: min(100%, 32rem);
        padding: 1.5rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1rem 2.5rem rgb(15 23 42 / 12%);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      p {
        line-height: 1.6;
      }

      button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1rem;
        font: inherit;
        font-weight: 600;
        background: #0f766e;
        color: #ffffff;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #0f766e;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }

        main {
          background: #111827;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>
        O Morro Digital preserva apenas conteúdo público e assets estáticos
        permitidos para uso offline. Pagamentos, reservas, ingressos e outras
        operações que exigem autoridade do servidor nunca são concluídos pelo
        cache.
      </p>
      <p>Reconecte-se para atualizar dados e usar recursos online.</p>
      <button type="button" onclick="location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
