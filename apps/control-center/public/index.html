<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f8fc" />
    <title>Morro Digital — Control Center</title>
    <link
      rel="stylesheet"
      href="/apps/control-center/public/control-center.css"
    />
  </head>
  <body>
    <div id="app" class="control-center app-shell" hidden>
      <aside id="sidebar" class="sidebar control-center__sidebar" aria-label="Navegação principal">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">MD</span>
          <div>
            <strong>Morro Digital</strong>
            <small>Control Center</small>
          </div>
        </div>

        <nav id="main-nav" aria-label="Módulos do Control Center"></nav>

        <div class="sidebar-footer">
          <div id="actor-card" class="actor-card"></div>
          <button id="logout-button" class="ghost-button" type="button">
            Sair
          </button>
        </div>
      </aside>
      <button
        id="sidebar-backdrop"
        class="sidebar-backdrop"
        type="button"
        aria-label="Fechar menu"
        hidden
      ></button>

      <main class="main control-center__main">
        <header class="topbar control-center__topbar">
          <button
            id="menu-button"
            class="icon-button mobile-only"
            type="button"
            aria-label="Abrir menu"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span aria-hidden="true">☰</span>
          </button>

          <div class="scope-controls" aria-label="Contexto operacional">
            <button
              id="global-scope"
              class="scope-button"
              type="button"
              aria-pressed="true"
              title="Visão Global"
            >
              <span aria-hidden="true">◎</span>
              <span>Visão Global</span>
            </button>
            <label class="destination-control" for="destination-selector">
              <span aria-hidden="true">⌖</span>
              <span class="sr-only">Destino atual</span>
              <select id="destination-selector" aria-label="Destino atual">
                <option value="global">Todos os destinos</option>
              </select>
            </label>
          </div>

          <div class="search-wrap" role="search">
            <span aria-hidden="true">⌕</span>
            <input
              id="global-search"
              type="search"
              autocomplete="off"
              placeholder="Pesquisar empresa, afiliado, reserva, pedido..."
              aria-label="Busca universal"
              aria-controls="search-results"
              aria-expanded="false"
              aria-autocomplete="list"
            />
            <kbd>⌘ K</kbd>
            <div
              id="search-results"
              class="search-results"
              role="listbox"
              aria-label="Resultados da busca"
              hidden
            ></div>
          </div>

          <div class="top-actions">
            <button
              id="notification-button"
              class="icon-button notification-button"
              type="button"
              aria-label="Notificações"
              title="Notificações"
            >
              <span aria-hidden="true">♧</span>
              <span id="notification-badge" class="notification-badge" hidden>0</span>
            </button>
            <button
              id="profile-button"
              class="profile-button"
              type="button"
              aria-label="Conta administrativa"
            >
              <span id="profile-avatar" class="profile-avatar" aria-hidden="true">A</span>
              <span id="profile-name" class="profile-name">Admin</span>
              <span aria-hidden="true">⌄</span>
            </button>
          </div>
        </header>

        <div id="support-banner" class="support-banner" hidden>
          <div>
            <strong>MODO SUPORTE ATIVO</strong>
            <span id="support-context"></span>
          </div>
          <button id="support-end" type="button">Encerrar modo suporte</button>
        </div>

        <section class="page">
          <div class="page-heading">
            <div class="page-heading__copy">
              <p id="breadcrumb" class="breadcrumb">
                Morro Digital → Visão Global
              </p>
              <h1 id="page-title">Visão Geral</h1>
              <p id="page-description">
                Estado operacional e administrativo da plataforma em uma única visão.
              </p>
            </div>
            <div class="page-heading__meta">
              <time id="page-date"></time>
              <span id="page-health" class="overall-status">
                <i class="status-dot" aria-hidden="true"></i>
                <span>Verificando operação</span>
              </span>
              <div id="page-actions" class="page-actions"></div>
            </div>
          </div>

          <div id="content" aria-live="polite" aria-busy="false"></div>
        </section>
      </main>
    </div>

    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="skeleton boot-mark" aria-hidden="true"></div>
      <strong>Abrindo Control Center</strong>
      <span>Validando sessão, contexto e permissões…</span>
    </div>

    <script
      type="module"
      src="/apps/control-center/public/control-center.js"
    ></script>
  </body>
</html>
