<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CRM · Follow-ups</title><link rel="stylesheet" href="/apps/admin-crm/public/crm.css"/><script type="importmap">{"imports":{"@touristic/auth":"/packages/auth/dist/index.js","@touristic/auth-browser":"/packages/auth-browser/dist/index.js"}}</script></head><body><main class="content"><p><a href="/apps/admin-crm/">← CRM</a></p><section class="hero" aria-labelledby="follow-ups-title"><span class="eyebrow">Administração · CRM</span><h1 id="follow-ups-title">Follow-ups</h1><p id="session-status" role="status">Validando sessão…</p></section><section class="lead-create-card" aria-labelledby="schedule-title"><span class="eyebrow">Acompanhamento comercial</span><h2 id="schedule-title">Agendar follow-up</h2><form id="follow-up-create-form" class="lead-create-form"><label>Lead ID<input name="leadId" type="number" min="1" step="1" required/></label><label>Configuração ID (opcional)<input name="settingId" type="number" min="1" step="1"/></label><label>Data e hora<input name="scheduledAt" type="datetime-local" required/></label><label>Tentativa<input name="attemptNumber" type="number" min="1" max="100" step="1" value="1" required/></label><div class="lead-create-actions"><button id="follow-up-create-submit" type="submit">Agendar follow-up</button><span id="follow-up-create-status" role="status"></span></div></form></section><section class="lead-create-card" aria-labelledby="pending-title"><span class="eyebrow">Histórico operacional</span><h2 id="pending-title">Acompanhamento</h2><p id="pending-status" class="leads-status" role="status">Carregando follow-ups…</p><div id="pending-list" class="grid"></div></section><section class="lead-create-card" aria-labelledby="setting-form-title"><span class="eyebrow">Automação autorizada</span><h2 id="setting-form-title">Salvar configuração</h2><form id="follow-up-setting-form" class="lead-create-form"><label>
