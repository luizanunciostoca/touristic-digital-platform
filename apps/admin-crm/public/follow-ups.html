<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CRM · Follow-ups</title></head><body><main><p><a href="/apps/admin-crm/">← CRM</a></p><h1>Follow-ups</h1><p id="session-status" role="status">Validando sessão…</p><section aria-labelledby="schedule-title"><h2 id="schedule-title">Agendar follow-up</h2><form id="follow-up-create-form"><label>Lead ID<input name="leadId" type="number" min="1" step="1" required/></label><label>Configuração ID (opcional)<input name="settingId" type="number" min="1" step="1"/></label><label>Data e hora<input name="scheduledAt" type="datetime-local" required/></label><label>Tentativa<input name="attemptNumber" type="number" min="1" max="100" step="1" value="1" required/></label><button id="follow-up-create-submit" type="submit">Agendar follow-up</button><span id="follow-up-create-status" role="status"></span></form></section><section aria-labelledby="pending-title"><h2 id="pending-title">Pendentes</h2><p id="pending-status" role="status">Carregando follow-ups…</p><div id="pending-list"></div></section><section aria-labelledby="setting-form-title"><h2 id="setting-form-title">Salvar configuração</h2><form id="follow-up-setting-form"><label>ID (opcional para atualizar)<input name="id" type="number" min="1" step="1"/></label><label>Nome<input name="name" required maxlength="160"/></label><label>Intervalo (dias)<input name="intervalDays" type="number" min="1" max="365" step="1" required/></label><label>Máximo de tentativas<input name="maxAttempts" type="number" min="1" max="100" step="1" required/></label><label>Modelo de mensagem<textarea name="messageTemplate" maxlength="4000"></textarea></label><label><input name="isActive" type="checkbox" checked/> Ativa</label><button id="follow-up-setting-submit" type="submit">Salvar configuração</button><span id="follow-up-setting-status" role="status"></span></form></section><section aria-labelledby="settings-title"><h2 id="settings-title">Configurações</h2><p id="settings-status" role="status">Carregando configurações…</p><div id="settings-list"></div></section></main><script type="module" src="./follow-ups.js"></script></body></html>
