<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrato · Morro Digital</title><style>body{font-family:system-ui,sans-serif;max-width:880px;margin:0 auto;padding:32px;background:#f7f7f7;color:#171717}main{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0001}h1{margin-top:0}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:24px 0}.meta div,.signature-card{border:1px solid #ddd;border-radius:12px;padding:14px}.contract-content{white-space:pre-wrap;line-height:1.6;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:24px 0;margin:24px 0}canvas{width:100%;height:180px;border:1px solid #bbb;border-radius:10px;touch-action:none;background:#fff}label{display:block;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;margin-right:8px}#sign-button{background:#111;color:#fff}#clear-button{background:#eee}.error{color:#9b1c1c}.success{color:#146c2e}</style></head><body><main><p id="status" role="status">Carregando contrato…</p><section id="contract" hidden><h1 id="title"></h1><div class="meta"><div><strong>Valor mensal</strong><p id="monthly-value">—</p></div><div><strong>Status</strong><p id="contract-status">—</p></div><div><strong>Enviado em</strong><p id="sent-at">—</p></div><div><strong>Assinado em</strong><p id="signed-at">—</p></div></div><article id="content" class="contract-content"></article><section id="signature-section" class="signature-card" hidden><h2>Assinatura</h2><label for="signer-name">Nome completo</label><input id="signer-name" maxlength="180" autocomplete="name"><label for="signature-canvas">Assine no campo abaixo</label><canvas id="signature-canvas" width="800" height="240"></canvas><p><button id="clear-button" type="button">Limpar</button><button id="sign-button" type="button">Assinar contrato</button></p><p id="sign-status" role="status"></p></section><p id="signed-by" hidden></p></section></main><script type="module" src="./contract-public.js"></script></body></html>
